<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Side-face reinforcement in a deep beam web</title><desc id="desc">IS 456 clause 26.5.1.3 asks for side-face steel of 0.1 percent of the web area when the web is deeper than 750 mm, shared equally between the two faces. For a web area of 180 000 mm squared that is 180 mm squared, 90 mm squared per face.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><rect x="190" y="90" width="56" height="252" fill="#e4e8e9" stroke="#273b45" stroke-width="2.5"/><rect x="196" y="96" width="44" height="240" rx="4" fill="none" stroke="#466d89" stroke-width="1.6"/><circle cx="203" cy="324" r="6" fill="#466d89" stroke="#273b45" stroke-width="1.2"/><circle cx="203" cy="106" r="4.5" fill="#466d89" stroke="#273b45" stroke-width="1.2"/><circle cx="233" cy="324" r="6" fill="#466d89" stroke="#273b45" stroke-width="1.2"/><circle cx="233" cy="106" r="4.5" fill="#466d89" stroke="#273b45" stroke-width="1.2"/><circle cx="201" cy="150" r="4.5" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><circle cx="235" cy="150" r="4.5" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><circle cx="201" cy="190" r="4.5" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><circle cx="235" cy="190" r="4.5" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><circle cx="201" cy="230" r="4.5" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><circle cx="235" cy="230" r="4.5" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><circle cx="201" cy="270" r="4.5" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><circle cx="235" cy="270" r="4.5" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><line x1="150" y1="90" x2="150" y2="342" stroke="#647780" stroke-width="1.5"/><line x1="157" y1="90" x2="143" y2="90" stroke="#647780" stroke-width="1.5"/><line x1="157" y1="342" x2="143" y2="342" stroke="#647780" stroke-width="1.5"/><text x="142" y="222" font-size="14" fill="#647780" text-anchor="end">D = 900</text><line x1="190" y1="362" x2="246" y2="362" stroke="#647780" stroke-width="1.5"/><line x1="190" y1="355" x2="190" y2="369" stroke="#647780" stroke-width="1.5"/><line x1="246" y1="355" x2="246" y2="369" stroke="#647780" stroke-width="1.5"/><text x="218" y="388" font-size="14" fill="#647780" text-anchor="middle">b = 200</text><line x1="239" y1="190" x2="300" y2="206" stroke="#b64f4f" stroke-width="1"/><line x1="239" y1="230" x2="300" y2="214" stroke="#b64f4f" stroke-width="1"/><text x="306" y="216" font-size="14" fill="#b64f4f" text-anchor="start"><tspan>side-face bars, both faces</tspan></text><text x="585" y="140" font-size="16" fill="#273b45" text-anchor="middle"><tspan>web area = 180 000 mm²</tspan></text><text x="585" y="172" font-size="16" fill="#273b45" text-anchor="middle"><tspan>0.1% of it, half per face</tspan></text><text x="585" y="204" font-size="16" fill="#273b45" text-anchor="middle"><tspan>0.001 × 180 000</tspan></text><rect x="480.75" y="252" width="208.5" height="33" rx="7" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><text x="585" y="272" font-size="17" fill="#2b7b61" text-anchor="middle"><tspan>180 mm² (90 per face)</tspan></text></g></svg>