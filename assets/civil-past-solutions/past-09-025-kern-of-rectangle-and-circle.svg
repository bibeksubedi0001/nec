<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Kern of a rectangle (middle third) and of a circle (middle quarter)</title><desc id="desc">A load inside the kern causes no tension anywhere on the section. For a rectangle the kern is a rhombus reaching b/6 each side of the centre, the middle third. For a circle it is a circle of diameter d/4, the middle quarter, so the middle-third rule holds only for rectangular sections.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><rect x="60" y="130" width="160" height="200" fill="#e4e8e9" stroke="#273b45" stroke-width="2.5"/><line x1="113.3" y1="130" x2="113.3" y2="330" stroke="#647780" stroke-width="1.2" stroke-dasharray="5 4"/><line x1="166.7" y1="130" x2="166.7" y2="330" stroke="#647780" stroke-width="1.2" stroke-dasharray="5 4"/><polygon points="140,196.7 166.7,230 140,263.3 113.3,230" fill="#f5ead8" stroke="#b98232" stroke-width="2.5" stroke-linejoin="round"/><circle cx="350" cy="230" r="100" fill="#e4e8e9" stroke="#273b45" stroke-width="2.5"/><circle cx="350" cy="230" r="25" fill="#f5ead8" stroke="#b98232" stroke-width="2.5"/><line x1="325" y1="300" x2="375" y2="300" stroke="#647780" stroke-width="1.5"/><line x1="325" y1="293" x2="325" y2="307" stroke="#647780" stroke-width="1.5"/><line x1="375" y1="293" x2="375" y2="307" stroke="#647780" stroke-width="1.5"/><text x="350" y="326" font-size="14" fill="#647780" text-anchor="middle">d/4</text><text x="140" y="360" font-size="14" fill="#273b45" text-anchor="middle"><tspan>rectangle: middle third</tspan></text><text x="140" y="384" font-size="14" fill="#b98232" text-anchor="middle"><tspan>e ≤ b/6</tspan></text><text x="350" y="360" font-size="14" fill="#273b45" text-anchor="middle"><tspan>circle: middle quarter</tspan></text><text x="350" y="384" font-size="14" fill="#b98232" text-anchor="middle"><tspan>e ≤ d/8</tspan></text><text x="585" y="150" font-size="16" fill="#273b45" text-anchor="middle"><tspan>no tension: load in the kern</tspan></text><text x="585" y="184" font-size="16" fill="#273b45" text-anchor="middle"><tspan>b/6 rule: rectangles only</tspan></text><rect x="470" y="243" width="230" height="32" rx="7" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><text x="585" y="262" font-size="16" fill="#2b7b61" text-anchor="middle"><tspan>rectangular sections only</tspan></text></g></svg>