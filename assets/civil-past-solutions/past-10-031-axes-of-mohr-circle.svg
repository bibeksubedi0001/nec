<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">The axes of Mohr's circle</title><desc id="desc">Mohr's circle is drawn with normal stress σ along the horizontal axis and shear stress τ along the vertical axis. The face stresses (σx, τxy) and (σy, -τxy) are the ends of a diameter, with the centre at the average normal stress.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="80" y1="230" x2="461.2" y2="230" stroke="#273b45" stroke-width="1.6"/><polygon points="470,230 459,234.5 459,225.5" fill="#273b45" stroke="#273b45" stroke-width="1.5" stroke-linejoin="round"/><line x1="110" y1="382" x2="110" y2="84.8" stroke="#273b45" stroke-width="1.6"/><polygon points="110,76 114.5,87 105.5,87" fill="#273b45" stroke="#273b45" stroke-width="1.5" stroke-linejoin="round"/><text x="474" y="235" font-size="17" fill="#273b45" text-anchor="start"><tspan>σ</tspan></text><text x="102" y="80" font-size="17" fill="#273b45" text-anchor="end"><tspan>τ</tspan></text><circle cx="302" cy="230" r="128" fill="#e6f1f8" stroke="#287aab" stroke-width="2.5"/><circle cx="302" cy="230" r="3.5" fill="#287aab" stroke="#287aab" stroke-width="2"/><line x1="382" y1="130.16" x2="222" y2="329.84" stroke="#647780" stroke-width="1.5" stroke-dasharray="5 4"/><circle cx="382" cy="130.16" r="5" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><circle cx="222" cy="329.84" r="5" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><text x="390" y="122.16" font-size="15" fill="#b64f4f" text-anchor="start"><tspan>(σ</tspan><tspan dy="4" font-size="11">x</tspan><tspan dy="-4">, τ</tspan><tspan dy="4" font-size="11">xy</tspan><tspan dy="-4">)</tspan></text><text x="214" y="349.84" font-size="15" fill="#b64f4f" text-anchor="end"><tspan>(σ</tspan><tspan dy="4" font-size="11">y</tspan><tspan dy="-4">, −τ</tspan><tspan dy="4" font-size="11">xy</tspan><tspan dy="-4">)</tspan></text><text x="302" y="252" font-size="14" fill="#287aab" text-anchor="middle"><tspan>centre (σ</tspan><tspan dy="4" font-size="10">x</tspan><tspan dy="-4"> + σ</tspan><tspan dy="4" font-size="10">y</tspan><tspan dy="-4">)/2</tspan></text><text x="498" y="236" font-size="15" fill="#273b45" text-anchor="start"><tspan>normal stress</tspan></text><text x="122" y="84" font-size="15" fill="#273b45" text-anchor="start"><tspan>shear stress</tspan></text><rect x="173" y="375" width="374" height="32" rx="7" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><text x="360" y="394" font-size="16" fill="#2b7b61" text-anchor="middle"><tspan>x axis: normal stress, y axis: shear stress</tspan></text></g></svg>