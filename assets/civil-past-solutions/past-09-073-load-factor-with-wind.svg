<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Load factor of an I-beam with the allowable stress raised for wind</title><desc id="desc">The load factor is the plastic moment divided by the working moment. Raising the allowable stress by 20 percent cuts the factor of safety to 1.5/1.2 = 1.25 between the working moment and first yield, and the shape factor 1.12 takes it on to Mp: LF = 1.12 x 1.25 = 1.40.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="70" y1="360" x2="431.2" y2="360" stroke="#273b45" stroke-width="1.6"/><polygon points="440,360 429,364.5 429,355.5" fill="#273b45" stroke="#273b45" stroke-width="1.5" stroke-linejoin="round"/><line x1="70" y1="360" x2="70" y2="68.8" stroke="#273b45" stroke-width="1.6"/><polygon points="70,60 74.5,71 65.5,71" fill="#273b45" stroke="#273b45" stroke-width="1.5" stroke-linejoin="round"/><text x="440" y="404" font-size="14" fill="#647780" text-anchor="end"><tspan>curvature</tspan></text><text x="80" y="68" font-size="14" fill="#647780" text-anchor="start"><tspan>M</tspan></text><line x1="70" y1="160" x2="430" y2="160" stroke="#647780" stroke-width="1.2" stroke-dasharray="5 4"/><text x="60" y="165" font-size="15" fill="#273b45" text-anchor="end"><tspan>M</tspan><tspan dy="4" font-size="11">w</tspan></text><line x1="70" y1="110" x2="430" y2="110" stroke="#647780" stroke-width="1.2" stroke-dasharray="5 4"/><text x="60" y="115" font-size="15" fill="#273b45" text-anchor="end"><tspan>M</tspan><tspan dy="4" font-size="11">y</tspan></text><line x1="70" y1="80" x2="430" y2="80" stroke="#647780" stroke-width="1.2" stroke-dasharray="5 4"/><text x="60" y="85" font-size="15" fill="#273b45" text-anchor="end"><tspan>M</tspan><tspan dy="4" font-size="11">p</tspan></text><path d="M70 360 L220 110 L223.5 108.3 L227 106.7 L230.5 105.18 L234 103.76 L237.5 102.41 L241 101.14 L244.5 99.94 L248 98.81 L251.5 97.75 L255 96.74 L258.5 95.79 L262 94.9 L265.5 94.05 L269 93.26 L272.5 92.51 L276 91.8 L279.5 91.13 L283 90.5 L286.5 89.9 L290 89.34 L293.5 88.81 L297 88.31 L300.5 87.84 L304 87.4 L307.5 86.98 L311 86.58 L314.5 86.21 L318 85.86 L321.5 85.53 L325 85.21 L328.5 84.92 L332 84.64 L335.5 84.38 L339 84.13 L342.5 83.89 L346 83.67 L349.5 83.47 L353 83.27 L356.5 83.08 L360 82.91 L363.5 82.74 L367 82.59 L370.5 82.44 L374 82.3 L377.5 82.17 L381 82.05 L384.5 81.93 L388 81.82 L391.5 81.72 L395 81.62 L398.5 81.53 L402 81.44 L405.5 81.36 L409 81.29 L412.5 81.21 L416 81.14 L419.5 81.08 L423 81.02 L426.5 80.96 L430 80.91" stroke="#287aab" stroke-width="3.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="150" y="100" font-size="14" fill="#b64f4f" text-anchor="middle"><tspan>× 1.12</tspan></text><text x="150" y="140" font-size="14" fill="#b64f4f" text-anchor="middle"><tspan>× 1.25</tspan></text><text x="585" y="150" font-size="16" fill="#273b45" text-anchor="middle"><tspan>FOS with wind = 1.5/1.2 = 1.25</tspan></text><text x="585" y="184" font-size="16" fill="#273b45" text-anchor="middle"><tspan>LF = S × FOS = 1.12 × 1.25</tspan></text><rect x="527.25" y="240" width="115.5" height="35" rx="7" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><text x="585" y="262" font-size="19" fill="#2b7b61" text-anchor="middle"><tspan>LF = 1.40</tspan></text></g></svg>