<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Resolving H and V at an arch section into thrust and radial shear</title><desc id="desc">At a section where the arch tangent makes θ with the horizontal, the components of H and V along the tangent add to the normal thrust N = H cosθ + V sinθ, and the components along the radius give the radial shear S = V cosθ - H sinθ.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><path d="M153.96 332.98 L156.27 329.07 L158.64 325.2 L161.08 321.37 L163.58 317.59 L166.15 313.85 L168.79 310.16 L171.48 306.51 L174.25 302.91 L177.07 299.36 L179.96 295.85 L182.91 292.4 L185.91 289.01 L188.98 285.66 L192.1 282.37 L195.28 279.13 L198.52 275.95 L201.81 272.83 L205.16 269.76 L208.55 266.76 L212.01 263.81 L215.51 260.92 L219.06 258.1 L222.66 255.33 L226.31 252.64 L230 250 L233.74 247.43 L237.52 244.93 L241.35 242.49 L245.22 240.12 L249.13 237.81 L253.08 235.58 L257.07 233.41 L261.09 231.32 L265.15 229.29 L269.25 227.34 L273.38 225.46 L277.54 223.65 L281.73 221.91 L285.95 220.25 L290.2 218.66 L294.48 217.14 L298.79 215.7 L303.11 214.34 L307.46 213.05 L311.84 211.84 L316.23 210.7 L320.64 209.64 L325.07 208.66 L329.52 207.76 L333.98 206.93 L338.46 206.18 L342.94 205.51 L347.44 204.92 L351.95 204.4 L356.47 203.97" stroke="#b8c8ce" stroke-width="12" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="107.13" y1="336.04" x2="352.87" y2="163.96" stroke="#647780" stroke-width="1.2" stroke-dasharray="6 5"/><line x1="293.09" y1="340.11" x2="166.91" y2="159.89" stroke="#647780" stroke-width="1.2" stroke-dasharray="6 5"/><text x="358.87" y="167.96" font-size="13" fill="#647780" text-anchor="start"><tspan>tangent</tspan></text><text x="160.91" y="163.89" font-size="13" fill="#647780" text-anchor="end"><tspan>radius</tspan></text><line x1="230" y1="250" x2="350" y2="250" stroke="#647780" stroke-width="1"/><path d="M276 250 A46 46 0 0 0 267.68 223.62" stroke="#273b45" stroke-width="1.8" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="286" y="238" font-size="16" fill="#273b45" text-anchor="start"><tspan>θ</tspan></text><line x1="230" y1="250" x2="317.2" y2="250" stroke="#b64f4f" stroke-width="3"/><polygon points="326,250 315,254.5 315,245.5" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="330" y="270" font-size="16" fill="#b64f4f" text-anchor="middle"><tspan>H</tspan></text><line x1="230" y1="250" x2="230" y2="166.8" stroke="#b64f4f" stroke-width="3"/><polygon points="230,158 234.5,169 225.5,169" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="220" y="158" font-size="16" fill="#b64f4f" text-anchor="end"><tspan>V</tspan></text><line x1="230" y1="250" x2="319.45" y2="187.37" stroke="#287aab" stroke-width="3.5"/><polygon points="326.66,182.32 320.23,192.31 315.07,184.94" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><text x="330.66" y="172.32" font-size="17" fill="#287aab" text-anchor="start"><tspan>N</tspan></text><line x1="230" y1="250" x2="192.6" y2="196.59" stroke="#2b7b61" stroke-width="3.5"/><polygon points="187.56,189.38 197.55,195.81 190.18,200.97" fill="#2b7b61" stroke="#2b7b61" stroke-width="1.5" stroke-linejoin="round"/><text x="179.56" y="201.38" font-size="17" fill="#2b7b61" text-anchor="end"><tspan>S</tspan></text><circle cx="230" cy="250" r="4" fill="#273b45" stroke="#273b45" stroke-width="2"/><text x="585" y="140" font-size="16" fill="#273b45" text-anchor="middle"><tspan>along the tangent:</tspan></text><text x="585" y="172" font-size="16" fill="#273b45" text-anchor="middle"><tspan>N = H cosθ + V sinθ</tspan></text><text x="585" y="204" font-size="16" fill="#273b45" text-anchor="middle"><tspan>along the radius:</tspan></text><rect x="479.75" y="240" width="210.5" height="35" rx="7" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><text x="585" y="262" font-size="19" fill="#2b7b61" text-anchor="middle"><tspan>S = V cosθ − H sinθ</tspan></text></g></svg>