<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Normal stress on the diagonal plane of an element</title><desc id="desc">On a plane at θ the normal stress is (fx + fy)/2 + ((fx - fy)/2) cos 2θ + τxy sin 2θ. On the 45 degree diagonal plane cos 2θ = 0 and sin 2θ = 1, leaving (fx + fy)/2 + τxy.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><rect x="100" y="120" width="140" height="140" fill="#e6f1f8" stroke="#273b45" stroke-width="2"/><line x1="244" y1="190" x2="265.2" y2="190" stroke="#b64f4f" stroke-width="3"/><polygon points="274,190 263,194.5 263,185.5" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><line x1="96" y1="190" x2="74.8" y2="190" stroke="#b64f4f" stroke-width="3"/><polygon points="66,190 77,185.5 77,194.5" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="280" y="196" font-size="16" fill="#b64f4f" text-anchor="start"><tspan>f</tspan><tspan dy="4" font-size="12">x</tspan></text><line x1="170" y1="116" x2="170" y2="94.8" stroke="#b64f4f" stroke-width="3"/><polygon points="170,86 174.5,97 165.5,97" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><line x1="170" y1="264" x2="170" y2="285.2" stroke="#b64f4f" stroke-width="3"/><polygon points="170,294 165.5,283 174.5,283" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="180" y="92" font-size="16" fill="#b64f4f" text-anchor="start"><tspan>f</tspan><tspan dy="4" font-size="12">y</tspan></text><line x1="108" y1="110" x2="224.8" y2="110" stroke="#2b7b61" stroke-width="2.5"/><polygon points="232,110 223,114 223,106" fill="#2b7b61" stroke="#2b7b61" stroke-width="1.5" stroke-linejoin="round"/><line x1="232" y1="270" x2="115.2" y2="270" stroke="#2b7b61" stroke-width="2.5"/><polygon points="108,270 117,266 117,274" fill="#2b7b61" stroke="#2b7b61" stroke-width="1.5" stroke-linejoin="round"/><line x1="250" y1="252" x2="250" y2="135.2" stroke="#2b7b61" stroke-width="2.5"/><polygon points="250,128 254,137 246,137" fill="#2b7b61" stroke="#2b7b61" stroke-width="1.5" stroke-linejoin="round"/><line x1="90" y1="128" x2="90" y2="244.8" stroke="#2b7b61" stroke-width="2.5"/><polygon points="90,252 86,243 94,243" fill="#2b7b61" stroke="#2b7b61" stroke-width="1.5" stroke-linejoin="round"/><text x="84" y="112" font-size="15" fill="#2b7b61" text-anchor="end"><tspan>τ</tspan><tspan dy="4" font-size="11">xy</tspan></text><line x1="100" y1="260" x2="240" y2="120" stroke="#b64f4f" stroke-width="3"/><line x1="170" y1="190" x2="205.78" y2="225.78" stroke="#287aab" stroke-width="3"/><polygon points="212,232 201.04,227.4 207.4,221.04" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><text x="218" y="250" font-size="16" fill="#287aab" text-anchor="start"><tspan>σ</tspan><tspan dy="4" font-size="12">45°</tspan></text><text x="505" y="130" font-size="16" fill="#273b45" text-anchor="middle"><tspan>σ</tspan><tspan dy="4" font-size="12">θ</tspan><tspan dy="-4"> = (f</tspan><tspan dy="4" font-size="12">x</tspan><tspan dy="-4"> + f</tspan><tspan dy="4" font-size="12">y</tspan><tspan dy="-4">)/2 + ((f</tspan><tspan dy="4" font-size="12">x</tspan><tspan dy="-4"> − f</tspan><tspan dy="4" font-size="12">y</tspan><tspan dy="-4">)/2) cos 2θ</tspan></text><text x="505" y="164" font-size="16" fill="#273b45" text-anchor="middle"><tspan>+ τ</tspan><tspan dy="4" font-size="12">xy</tspan><tspan dy="-4"> sin 2θ</tspan></text><text x="505" y="198" font-size="15" fill="#647780" text-anchor="middle"><tspan>θ = 45°: cos 2θ = 0, sin 2θ = 1</tspan></text><rect x="390.25" y="268" width="229.5" height="35" rx="7" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><text x="505" y="290" font-size="19" fill="#2b7b61" text-anchor="middle"><tspan>σ = (f</tspan><tspan dy="5" font-size="14">x</tspan><tspan dy="-5"> + f</tspan><tspan dy="5" font-size="14">y</tspan><tspan dy="-5">)/2 + τ</tspan><tspan dy="5" font-size="14">xy</tspan></text></g></svg>