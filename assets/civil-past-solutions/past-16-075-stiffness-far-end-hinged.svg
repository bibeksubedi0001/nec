<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Moment needed to rotate the near end with the far end hinged</title><desc id="desc">With the far end B pinned it can rotate freely, so no moment is carried over and the member is more flexible. A unit rotation at A needs 3EI/L instead of the 4EI/L needed when B is fixed.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="80" y1="200" x2="420" y2="200" stroke="#b8c8ce" stroke-width="6"/><path d="M80 200 L84.25 202.94 L88.5 205.78 L92.75 208.5 L97 211.12 L101.25 213.62 L105.5 216.03 L109.75 218.32 L114 220.52 L118.25 222.61 L122.5 224.61 L126.75 226.51 L131 228.31 L135.25 230.01 L139.5 231.62 L143.75 233.13 L148 234.56 L152.25 235.9 L156.5 237.14 L160.75 238.3 L165 239.38 L169.25 240.36 L173.5 241.27 L177.75 242.1 L182 242.84 L186.25 243.51 L190.5 244.09 L194.75 244.61 L199 245.05 L203.25 245.41 L207.5 245.7 L211.75 245.93 L216 246.08 L220.25 246.17 L224.5 246.19 L228.75 246.14 L233 246.04 L237.25 245.87 L241.5 245.64 L245.75 245.35 L250 245 L254.25 244.6 L258.5 244.14 L262.75 243.63 L267 243.07 L271.25 242.45 L275.5 241.79 L279.75 241.08 L284 240.32 L288.25 239.52 L292.5 238.67 L296.75 237.78 L301 236.86 L305.25 235.89 L309.5 234.88 L313.75 233.84 L318 232.76 L322.25 231.65 L326.5 230.5 L330.75 229.33 L335 228.13 L339.25 226.89 L343.5 225.63 L347.75 224.35 L352 223.04 L356.25 221.71 L360.5 220.36 L364.75 218.99 L369 217.6 L373.25 216.19 L377.5 214.77 L381.75 213.33 L386 211.88 L390.25 210.42 L394.5 208.95 L398.75 207.47 L403 205.99 L407.25 204.49 L411.5 203 L415.75 201.5 L420 200" stroke="#287aab" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="80,203 65,227 95,227" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><line x1="58" y1="230" x2="102" y2="230" stroke="#647780" stroke-width="2"/><line x1="80" y1="200" x2="150" y2="249.41" stroke="#647780" stroke-width="1.2" stroke-dasharray="5 4"/><path d="M128 200 A48 48 0 0 1 119.21 227.68" stroke="#273b45" stroke-width="1.6" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="138" y="188" font-size="15" fill="#273b45" text-anchor="start"><tspan>θ</tspan><tspan dy="4" font-size="11">A</tspan><tspan dy="-4"> = 1</tspan></text><path d="M54 188 Q80 142 106 188" stroke="#2b7b61" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="106,188 97.16,181.51 105,177.08" fill="#2b7b61" stroke="#2b7b61" stroke-width="1.5" stroke-linejoin="round"/><text x="80" y="134" font-size="15" fill="#2b7b61" text-anchor="middle"><tspan>M</tspan><tspan dy="4" font-size="11">A</tspan></text><text x="52" y="208" font-size="16" fill="#273b45" text-anchor="end"><tspan>A</tspan></text><polygon points="420,203 405,227 435,227" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><line x1="398" y1="230" x2="442" y2="230" stroke="#647780" stroke-width="2"/><text x="446" y="208" font-size="16" fill="#273b45" text-anchor="start"><tspan>B</tspan></text><text x="420" y="180" font-size="14" fill="#647780" text-anchor="middle"><tspan>M</tspan><tspan dy="4" font-size="10">B</tspan><tspan dy="-4"> = 0</tspan></text><text x="585" y="150" font-size="17" fill="#273b45" text-anchor="middle"><tspan>far end pinned: M</tspan><tspan dy="5" font-size="12">B</tspan><tspan dy="-5"> = 0</tspan></text><text x="585" y="184" font-size="17" fill="#273b45" text-anchor="middle"><tspan>no carry-over</tspan></text><rect x="527.25" y="240" width="115.5" height="35" rx="7" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><text x="585" y="262" font-size="19" fill="#2b7b61" text-anchor="middle"><tspan>k = 3EI/L</tspan></text></g></svg>