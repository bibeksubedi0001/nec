<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Ratio of bending to shear stress in a shaft under M and T</title><desc id="desc">In a solid shaft the extreme bending stress is 32M/πd cubed and the surface shear stress from torsion is 16T/πd cubed. Their ratio is 2M/T.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><rect x="90" y="130" width="280" height="64" rx="8" fill="#deeee6" stroke="#273b45" stroke-width="2"/><ellipse cx="90" cy="162" rx="11" ry="32" fill="#deeee6" stroke="#273b45" stroke-width="2"/><path d="M53.63 183 A42 42 0 1 1 126.37 183" stroke="#b64f4f" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="126.37,183 127.98,171.22 135.77,175.72" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><path d="M406.37 183 A42 42 0 1 0 333.63 183" stroke="#b64f4f" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="333.63,183 324.23,175.72 332.02,171.22" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="90" y="104" font-size="16" fill="#b64f4f" text-anchor="middle"><tspan>M, T</tspan></text><text x="370" y="104" font-size="16" fill="#b64f4f" text-anchor="middle"><tspan>M, T</tspan></text><circle cx="230" cy="300" r="50" fill="#d6dfe3" stroke="#273b45" stroke-width="2"/><line x1="180" y1="364" x2="280" y2="364" stroke="#647780" stroke-width="1.5"/><line x1="180" y1="357" x2="180" y2="371" stroke="#647780" stroke-width="1.5"/><line x1="280" y1="357" x2="280" y2="371" stroke="#647780" stroke-width="1.5"/><text x="230" y="390" font-size="14" fill="#647780" text-anchor="middle">d</text><text x="575" y="140" font-size="17" fill="#273b45" text-anchor="middle"><tspan>σ</tspan><tspan dy="5" font-size="12">b</tspan><tspan dy="-5"> = 32M/πd³</tspan></text><text x="575" y="174" font-size="17" fill="#273b45" text-anchor="middle"><tspan>τ = 16T/πd³</tspan></text><rect x="507.75" y="240" width="134.5" height="35" rx="7" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><text x="575" y="262" font-size="19" fill="#2b7b61" text-anchor="middle"><tspan>σ</tspan><tspan dy="5" font-size="14">b</tspan><tspan dy="-5">/τ = 2M/T</tspan></text></g></svg>