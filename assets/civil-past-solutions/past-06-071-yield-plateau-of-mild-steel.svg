<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">After yield, strain grows with little change in stress</title><desc id="desc">On the stress-strain curve of mild steel the stress drops from the upper to the lower yield point and then stays almost constant while the strain grows many times over, the yield plateau, before strain hardening raises the stress to the ultimate value.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="70" y1="360" x2="641.2" y2="360" stroke="#273b45" stroke-width="1.8"/><polygon points="650,360 639,364.5 639,355.5" fill="#273b45" stroke="#273b45" stroke-width="1.5" stroke-linejoin="round"/><line x1="70" y1="360" x2="70" y2="54.8" stroke="#273b45" stroke-width="1.8"/><polygon points="70,46 74.5,57 65.5,57" fill="#273b45" stroke="#273b45" stroke-width="1.5" stroke-linejoin="round"/><text x="646" y="382" font-size="14" fill="#647780" text-anchor="end"><tspan>strain</tspan></text><text x="62" y="58" font-size="14" fill="#647780" text-anchor="end"><tspan>stress</tspan></text><path d="M70 360 L98 200.5 L102.48 190.35 L106.96 180.2 L110.32 203.4 L118.72 199.95 L127.12 204.29 L135.52 206.62 L143.92 201.68 L152.32 200.62 L160.72 205.84 L169.12 205.55 L177.52 200.41 L185.92 202.02 L194.32 206.75 L202.72 203.92 L211.12 199.92 L221.2 192.54 L231.28 184.62 L241.36 176.81 L251.44 169.13 L261.52 161.66 L271.6 154.42 L281.68 147.47 L291.76 140.84 L301.84 134.58 L311.92 128.73 L322 123.32 L332.08 118.38 L342.16 113.96 L352.24 110.06 L362.32 106.73 L372.4 103.97 L382.48 101.8 L392.56 100.25 L402.64 99.31 L412.72 99 L426.16 99.52 L439.6 101.09 L453.04 103.7 L466.48 107.35 L479.92 112.05 L493.36 117.79 L506.8 124.58 L520.24 132.41 L533.68 141.28 L547.12 151.2" stroke="#287aab" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M110.32 203.4 L118.72 199.95 L127.12 204.29 L135.52 206.62 L143.92 201.68 L152.32 200.62 L160.72 205.84 L169.12 205.55 L177.52 200.41 L185.92 202.02 L194.32 206.75 L202.72 203.92 L211.12 199.92" stroke="#b98232" stroke-width="7" fill="none" stroke-linejoin="round" stroke-linecap="round" opacity="0.8"/><text x="159.6" y="223.7" font-size="15" fill="#b98232" text-anchor="middle"><tspan>yield plateau</tspan></text><circle cx="98" cy="200.5" r="4" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><line x1="101" y1="200.5" x2="126" y2="285" stroke="#647780" stroke-width="1"/><text x="130" y="290" font-size="13" fill="#647780" text-anchor="start"><tspan>proportional limit</tspan></text><circle cx="106.96" cy="180.2" r="4" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><line x1="109.96" y1="180.2" x2="126" y2="135" stroke="#647780" stroke-width="1"/><text x="130" y="140" font-size="13" fill="#647780" text-anchor="start"><tspan>upper yield point</tspan></text><circle cx="412.72" cy="99" r="4" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><text x="412.72" y="90" font-size="13" fill="#647780" text-anchor="middle"><tspan>ultimate</tspan></text><circle cx="547.12" cy="151.2" r="4" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><text x="555.12" y="156.2" font-size="13" fill="#647780" text-anchor="start"><tspan>fracture</tspan></text><rect x="353" y="310" width="234" height="33" rx="7" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><text x="470" y="330" font-size="17" fill="#2b7b61" text-anchor="middle"><tspan>strain increases heavily</tspan></text></g></svg>