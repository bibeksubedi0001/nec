<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Rivet value as the least of the shearing, bearing and tearing strengths</title><desc id="desc">The rivet value is the least of the three strengths, here 3425 kg in single shear. The number of rivets is 35 000/3425 = 10.2, which must be rounded up to 11.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><rect x="170" y="120" width="170.4" height="32" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><text x="160" y="142" font-size="15" fill="#273b45" text-anchor="end"><tspan>single shear</tspan></text><text x="348.4" y="142" font-size="15" fill="#2b7b61" text-anchor="start"><tspan>3425 kg</tspan></text><rect x="170" y="184" width="227.61" height="32" fill="#e6f1f8" stroke="#647780" stroke-width="2"/><text x="160" y="206" font-size="15" fill="#273b45" text-anchor="end"><tspan>bearing</tspan></text><text x="405.61" y="206" font-size="15" fill="#273b45" text-anchor="start"><tspan>4575 kg</tspan></text><rect x="170" y="248" width="250" height="32" fill="#e6f1f8" stroke="#647780" stroke-width="2"/><text x="160" y="270" font-size="15" fill="#273b45" text-anchor="end"><tspan>tearing</tspan></text><text x="428" y="270" font-size="15" fill="#273b45" text-anchor="start"><tspan>5025 kg</tspan></text><line x1="170" y1="104" x2="170" y2="296" stroke="#273b45" stroke-width="1.5"/><text x="255.2" y="108" font-size="14" fill="#2b7b61" text-anchor="middle"><tspan>rivet value</tspan></text><text x="250" y="340" font-size="14" fill="#647780" text-anchor="middle"><tspan>load in the member: 35 t = 35 000 kg</tspan></text><text x="585" y="150" font-size="17" fill="#273b45" text-anchor="middle"><tspan>rivet value = 3425 kg</tspan></text><text x="585" y="184" font-size="17" fill="#273b45" text-anchor="middle"><tspan>n = 35 000/3425 = 10.2</tspan></text><rect x="527.25" y="240" width="115.5" height="35" rx="7" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><text x="585" y="262" font-size="19" fill="#2b7b61" text-anchor="middle"><tspan>11 rivets</tspan></text></g></svg>