<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Length of the plastic zone under a central load</title><desc id="desc">Under a central load the moment is triangular with Mp at midspan. The section is partly plastic wherever the moment exceeds My = Mp/S, which is a length L(1 - 1/S) about the load: L/3 for a rectangle (S = 1.5) and about L/5 for an I-section (S = 1.25).</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="70" y1="110" x2="430" y2="110" stroke="#273b45" stroke-width="7"/><polygon points="70,113 55,137 85,137" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><line x1="48" y1="140" x2="92" y2="140" stroke="#647780" stroke-width="2"/><polygon points="430,113 415,134 445,134" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><circle cx="422" cy="140" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><circle cx="438" cy="140" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><line x1="408" y1="147" x2="452" y2="147" stroke="#647780" stroke-width="2"/><line x1="250" y1="47" x2="250" y2="96.2" stroke="#b64f4f" stroke-width="3.5"/><polygon points="250,105 245.5,94 254.5,94" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="250" y="37" font-size="16" fill="#b64f4f" text-anchor="middle">W</text><polygon points="70,200 250,330 430,200" fill="#f2dfdf" stroke="#b64f4f" stroke-width="2" stroke-linejoin="round"/><polygon points="214,304 250,330 286,304" fill="#f5ead8" stroke="#b98232" stroke-width="2" stroke-linejoin="round"/><line x1="70" y1="200" x2="430" y2="200" stroke="#273b45" stroke-width="1.5"/><line x1="70" y1="304" x2="430" y2="304" stroke="#647780" stroke-width="1.4" stroke-dasharray="6 5"/><text x="76" y="298" font-size="14" fill="#647780" text-anchor="start"><tspan>M</tspan><tspan dy="4" font-size="10">y</tspan><tspan dy="-4"> = M</tspan><tspan dy="4" font-size="10">p</tspan><tspan dy="-4">/S</tspan></text><text x="262" y="346" font-size="14" fill="#b64f4f" text-anchor="start"><tspan>M</tspan><tspan dy="4" font-size="10">p</tspan></text><line x1="214" y1="304" x2="214" y2="362" stroke="#647780" stroke-width="1" stroke-dasharray="3 4"/><line x1="286" y1="304" x2="286" y2="362" stroke="#647780" stroke-width="1" stroke-dasharray="3 4"/><line x1="214" y1="362" x2="286" y2="362" stroke="#647780" stroke-width="1.5"/><line x1="214" y1="355" x2="214" y2="369" stroke="#647780" stroke-width="1.5"/><line x1="286" y1="355" x2="286" y2="369" stroke="#647780" stroke-width="1.5"/><text x="250" y="390" font-size="14" fill="#647780" text-anchor="middle"><tspan>L</tspan><tspan dy="4" font-size="10">p</tspan><tspan dy="-4"> = L(1 − 1/S)</tspan></text><text x="585" y="140" font-size="16" fill="#273b45" text-anchor="middle"><tspan>L</tspan><tspan dy="4" font-size="12">p</tspan><tspan dy="-4"> = L(1 − 1/S)</tspan></text><text x="585" y="172" font-size="16" fill="#273b45" text-anchor="middle"><tspan>rectangle, S = 1.5: L/3</tspan></text><text x="585" y="204" font-size="16" fill="#273b45" text-anchor="middle"><tspan>I-section, S ≈ 1.25: L/5</tspan></text><rect x="532" y="250" width="106" height="35" rx="7" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><text x="585" y="272" font-size="19" fill="#2b7b61" text-anchor="middle"><tspan>L</tspan><tspan dy="5" font-size="14">p</tspan><tspan dy="-5"> ≈ L/5</tspan></text></g></svg>