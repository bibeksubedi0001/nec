<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Point load on a simple beam: triangular BMD</title><desc id="desc">A point load W at a from A gives RA = Wb/L and RB = Wa/L. The shear is constant on each side of the load, so the moment grows linearly from both supports to Wab/L under the load, forming a triangle.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="70" y1="100" x2="460" y2="100" stroke="#273b45" stroke-width="7"/><polygon points="70,105 55,129 85,129" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><line x1="48" y1="132" x2="92" y2="132" stroke="#647780" stroke-width="2"/><polygon points="460,105 445,126 475,126" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><circle cx="452" cy="132" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><circle cx="468" cy="132" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><line x1="438" y1="139" x2="482" y2="139" stroke="#647780" stroke-width="2"/><line x1="206.5" y1="48" x2="206.5" y2="87.2" stroke="#b64f4f" stroke-width="3.5"/><polygon points="206.5,96 202,85 211,85" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="206.5" y="39" font-size="16" fill="#b64f4f" text-anchor="middle"><tspan>W</tspan></text><line x1="70" y1="176" x2="70" y2="152.8" stroke="#287aab" stroke-width="3"/><polygon points="70,144 74.5,155 65.5,155" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><text x="80" y="176" font-size="15" fill="#287aab" text-anchor="start"><tspan>Wb/L</tspan></text><line x1="460" y1="176" x2="460" y2="152.8" stroke="#287aab" stroke-width="3"/><polygon points="460,144 464.5,155 455.5,155" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><text x="450" y="176" font-size="15" fill="#287aab" 