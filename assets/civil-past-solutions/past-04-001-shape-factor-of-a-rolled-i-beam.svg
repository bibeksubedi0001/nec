<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Elastic and plastic stress blocks of a rolled I-section</title><desc id="desc">The shape factor Mp/My = Zp/Ze compares the fully plastic and first-yield moments. In an I-section the flanges already carry most of the moment at first yield, so the plastic moment is only about 10 to 20 percent more: S is about 1.10 to 1.20, against 1.5 for a rectangle.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><rect x="70" y="110" width="120" height="22" fill="#d6dfe3" stroke="#273b45" stroke-width="2"/><rect x="70" y="308" width="120" height="22" fill="#d6dfe3" stroke="#273b45" stroke-width="2"/><rect x="123" y="132" width="14" height="176" fill="#d6dfe3" stroke="#273b45" stroke-width="2"/><line x1="56" y1="220" x2="204" y2="220" stroke="#647780" stroke-width="1.2" stroke-dasharray="5 4"/><line x1="270" y1="104" x2="270" y2="336" stroke="#273b45" stroke-width="1.4"/><polygon points="270,110 318,110 270,220" fill="#f2dfdf" stroke="#b64f4f" stroke-width="2" stroke-linejoin="round"/><polygon points="270,220 222,330 270,330" fill="#e6f1f8" stroke="#287aab" stroke-width="2" stroke-linejoin="round"/><text x="320" y="104" font-size="14" fill="#b64f4f" text-anchor="start"><tspan>f</tspan><tspan dy="4" font-size="10">y</tspan></text><text x="270" y="360" font-size="14" fill="#273b45" text-anchor="middle"><tspan>elastic, M</tspan><tspan dy="4" font-size="10">y</tspan></text><line x1="400" y1="104" x2="400" y2="336" stroke="#273b45" stroke-width="1.4"/><rect x="400" y="110" width="48" height="110" fill="#f2dfdf" stroke="#b64f4f" stroke-width="2"/><rect x="352" y="220" width="48" height="110" fill="#e6f1f8" stroke="#287aab" stroke-width="2"/><text x="450" y="104" font-size="14" fill="#b64f4f" text-anchor="start"><tspan>f</tspan><tspan dy="4" font-size="10">y</tspan></text><text x="400" y="360" font-size="14" fill="#273b45" text-anchor="middle"><tspan>plastic, M</tspan><tspan dy="4" font-size="10">p</tspan></text><text x="585" y="140" font-size="16" fill="#273b45" text-anchor="middle"><tspan>S = Z</tspan><tspan dy="4" font-size="12">p</tspan><tspan dy="-4">/Z</tspan><tspan dy="4" font-size="12">e</tspan><tspan dy="-4"> = M</tspan><tspan dy="4" font-size="12">p</tspan><tspan dy="-4">/M</tspan><tspan dy="4" font-size="12">y</tspan></text><text x="585" y="172" font-size="16" fill="#273b45" text-anchor="middle"><tspan>flanges carry most of M</tspan><tspan dy="4" font-size="12">y</tspan></text><text x="585" y="204" font-size="16" fill="#273b45" text-anchor="middle"><tspan>rectangle 1.5, circle 1.7</tspan></text><rect x="513" y="250" width="144" height="35" rx="7" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><text x="585" y="272" font-size="19" fill="#2b7b61" text-anchor="middle"><tspan>1.10 to 1.20</tspan></text></g></svg>