<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Free body of the unloaded half of a three-hinged arch</title><desc id="desc">With 80 kN at L/4 = 5 m on a 20 m span, VB = 80 x 5/20 = 20 kN. For the unloaded right half, moments about the crown hinge give H x 4 = 20 x 10, so the horizontal reaction is H = 50 kN at both supports.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><path d="M50 150 L52.5 148.03 L55 146.1 L57.5 144.23 L60 142.4 L62.5 140.63 L65 138.9 L67.5 137.23 L70 135.6 L72.5 134.03 L75 132.5 L77.5 131.03 L80 129.6 L82.5 128.23 L85 126.9 L87.5 125.63 L90 124.4 L92.5 123.23 L95 122.1 L97.5 121.03 L100 120 L102.5 119.03 L105 118.1 L107.5 117.23 L110 116.4 L112.5 115.63 L115 114.9 L117.5 114.23 L120 113.6 L122.5 113.03 L125 112.5 L127.5 112.03 L130 111.6 L132.5 111.23 L135 110.9 L137.5 110.63 L140 110.4 L142.5 110.23 L145 110.1 L147.5 110.03 L150 110 L152.5 110.03 L155 110.1 L157.5 110.23 L160 110.4 L162.5 110.63 L165 110.9 L167.5 111.23 L170 111.6 L172.5 112.03 L175 112.5 L177.5 113.03 L180 113.6 L182.5 114.23 L185 114.9 L187.5 115.63 L190 116.4 L192.5 117.23 L195 118.1 L197.5 119.03 L200 120 L202.5 121.03 L205 122.1 L207.5 123.23 L210 124.4 L212.5 125.63 L215 126.9 L217.5 128.23 L220 129.6 L222.5 131.03 L225 132.5 L227.5 134.03 L230 135.6 L232.5 137.23 L235 138.9 L237.5 140.63 L240 142.4 L242.5 144.23 L245 146.1 L247.5 148.03 L250 150" stroke="#273b45" stroke-width="6" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="50" cy="150" r="6.5" fill="#ffffff" stroke="#273b45" stroke-width="2.5"/><circle cx="150" cy="110" r="6.5" fill="#ffffff" stroke="#273b45" stroke-width="2.5"/><circle cx="250" cy="150" r="6.5" fill="#ffffff" stroke="#273b45" stroke-width="2.5"/><line x1="28" y1="159" x2="72" y2="159" stroke="#647780" stroke-width="2"/><line x1="34" y1="160" x2="24" y2="17