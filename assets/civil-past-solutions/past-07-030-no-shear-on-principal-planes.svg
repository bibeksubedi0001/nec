<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Principal planes lie where Mohr's circle cuts the σ axis</title><desc id="desc">The principal stresses are the two points where Mohr's circle crosses the σ axis, where τ = 0. So no shear acts on the plane of maximum principal stress; the maximum shear acts on planes at 45 degrees to it, at the top and bottom of the circle.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="80" y1="230" x2="461.2" y2="230" stroke="#273b45" stroke-width="1.6"/><polygon points="470,230 459,234.5 459,225.5" fill="#273b45" stroke="#273b45" stroke-width="1.5" stroke-linejoin="round"/><line x1="110" y1="382" x2="110" y2="84.8" stroke="#273b45" stroke-width="1.6"/><polygon points="110,76 114.5,87 105.5,87" fill="#273b45" stroke="#273b45" stroke-width="1.5" stroke-linejoin="round"/><text x="474" y="235" font-size="17" fill="#273b45" text-anchor="start"><tspan>σ</tspan></text><text x="102" y="80" font-size="17" fill="#273b45" text-anchor="end"><tspan>τ</tspan></text><circle cx="302" cy="230" r="128" fill="#e6f1f8" stroke="#287aab" stroke-width="2.5"/><circle cx="302" cy="230" r="3.5" fill="#287aab" stroke="#287aab" stroke-width="2"/><circle cx="430" cy="230" r="6" fill="#2b7b61" stroke="#2b7b61" stroke-width="2"/><circle cx="174" cy="230" r="6" fill="#2b7b61" stroke="#2b7b61" stroke-width="2"/><text x="438" y="252" font-size="15" fill="#2b7b61" text-anchor="start"><tspan>σ</tspan><tspan dy="4" font-size="11">1</tspan><tspan dy="-4">: τ = 0</tspan></text><text x="166" y="252" font-size="15" fill="#2b7b61" text-anchor="end"><tspan>σ</tspan><tspan dy="4" font-size="11">2</tspan><tspan dy="-4">: τ = 0</tspan></text><circle cx="302" cy="102" r="5" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><text x="312" y="96" font-size="15" fill="#b64f4f" text-anchor="start"><tspan>τ</tspan><tspan dy="4" font-size="11">max</tspan></text><line x1="302" y1="230" x2="302" y2="102" stroke="#b64f4f" stroke-width="1.5" stroke-dasharray="4 4"/><text x="440" y="146" font-size="13" fill="#647780" text-anchor="start">90° on the circle = 45° on the element</text><rect x="192" y="370" width="336" height="33" rx="7" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><text x="360" y="390" font-size="17" fill="#2b7b61" text-anchor="middle"><tspan>no shear stress on a principal plane</tspan></text></g></svg>