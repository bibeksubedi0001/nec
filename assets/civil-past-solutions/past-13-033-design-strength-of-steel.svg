<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Characteristic and design stress-strain lines of reinforcement</title><desc id="desc">In limit state design the characteristic strength of steel is divided by the partial safety factor 1.15, so the design strength is fy/1.15 = 0.87fy. The strength is reduced by about 13 to 15 percent.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="70" y1="340" x2="431.2" y2="340" stroke="#273b45" stroke-width="1.6"/><polygon points="440,340 429,344.5 429,335.5" fill="#273b45" stroke="#273b45" stroke-width="1.5" stroke-linejoin="round"/><line x1="70" y1="340" x2="70" y2="118.8" stroke="#273b45" stroke-width="1.6"/><polygon points="70,110 74.5,121 65.5,121" fill="#273b45" stroke="#273b45" stroke-width="1.5" stroke-linejoin="round"/><text x="440" y="384" font-size="14" fill="#647780" text-anchor="end"><tspan>strain</tspan></text><text x="80" y="118" font-size="14" fill="#647780" text-anchor="start"><tspan>stress</tspan></text><path d="M70 340 L170 150 L430 150" stroke="#287aab" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M70 340 L157 175.3 L430 175.3" stroke="#b64f4f" stroke-width="3" fill="none" stroke-dasharray="8 5" stroke-linejoin="round" stroke-linecap="round"/><text x="300" y="140" font-size="14" fill="#287aab" text-anchor="middle"><tspan>characteristic f</tspan><tspan dy="4" font-size="10">y</tspan></text><text x="300" y="198" font-size="14" fill="#b64f4f" text-anchor="middle"><tspan>design f</tspan><tspan dy="4" font-size="10">y</tspan><tspan dy="-4">/1.15 = 0.87f</tspan><tspan dy="4" font-size="10">y</tspan></text><text x="585" y="150" font-size="17" fill="#273b45" text-anchor="middle"><tspan>γ</tspan><tspan dy="5" font-size="12">m</tspan><tspan dy="-5"> = 1.15 for steel</tspan></text><text x="585" y="184" font-size="17" fill="#273b45" text-anchor="middle"><tspan>f</tspan><tspan dy="5" font-size="12">y</tspan><tspan dy="-5">/1.15 = 0.87f</tspan><tspan dy="5" font-size="12">y</tspan></text><rect x="493.5" y="241" width="183" height="34" rx="7" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><text x="585" y="262" font-size="18" fill="#2b7b61" text-anchor="middle"><tspan>reduced about 15%</tspan></text></g></svg>