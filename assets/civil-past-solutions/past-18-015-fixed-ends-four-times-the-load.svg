<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Crippling loads of hinged and fixed columns of equal length</title><desc id="desc">Both columns have length L. Hinged ends give le = L; fixed ends give le = L/2. Since P varies as 1/le squared, the fixed column carries (L/(L/2)) squared = 4 times the load.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="130" y1="90" x2="130" y2="360" stroke="#b8c8ce" stroke-width="7"/><path d="M130 360 L131.57 355.5 L133.14 351 L134.69 346.5 L136.24 342 L137.76 337.5 L139.27 333 L140.75 328.5 L142.2 324 L143.62 319.5 L145 315 L146.34 310.5 L147.63 306 L148.88 301.5 L150.07 297 L151.21 292.5 L152.29 288 L153.31 283.5 L154.27 279 L155.16 274.5 L155.98 270 L156.73 265.5 L157.41 261 L158.01 256.5 L158.53 252 L158.98 247.5 L159.34 243 L159.63 238.5 L159.84 234 L159.96 229.5 L160 225 L159.96 220.5 L159.84 216 L159.63 211.5 L159.34 207 L158.98 202.5 L158.53 198 L158.01 193.5 L157.41 189 L156.73 184.5 L155.98 180 L155.16 175.5 L154.27 171 L153.31 166.5 L152.29 162 L151.21 157.5 L150.07 153 L148.88 148.5 L147.63 144 L146.34 139.5 L145 135 L143.62 130.5 L142.2 126 L140.75 121.5 L139.27 117 L137.76 112.5 L136.24 108 L134.69 103.5 L133.14 99 L131.57 94.5 L130 90" stroke="#2b7b61" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="130,90 119,74 141,74" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><polygon points="130,360 119,376 141,376" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><line x1="130" y1="28" x2="130" y2="59.2" stroke="#b64f4f" stroke-width="3.5"/><polygon points="130,68 125.5,57 134.5,57" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="142" y="46" font-size="16" fill="#b64f4f" text-anchor="start"><tspan>P</tspan></text><text x="130" y="400" font-size="16" fill="#287aab" text-anchor="middle"><tspan>l</tspan><tspan dy="4" font-size="12">e</tspan><tspan dy="-4"> = L</tspan></text><line x1="320" y1="90" x2="320" y2="360" stroke="#b8c8ce" stroke-width="7"/><path d="M320 360 L320.07 355.5 L320.28 351 L320.64 346.5 L321.12 342 L321.74 337.5 L322.48 333 L323.34 328.5 L324.3 324 L325.36 319.5 L326.5 315 L327.71 310.5 L328.98 306 L330.3 301.5 L331.64 297 L333 292.5 L334.36 288 L335.7 283.5 L337.02 279 L338.29 274.5 L339.5 270 L340.64 265.5 L341.7 261 L342.66 256.5 L343.52 252 L344.26 247.5 L344.88 243 L345.36 238.5 L345.72 234 L345.93 229.5 L346 225 L345.93 220.5 L345.72 216 L345.36 211.5 L344.88 207 L344.26 202.5 L343.52 198 L342.66 193.5 L341.7 189 L340.64 184.5 L339.5 180 L338.29 175.5 L337.02 171 L335.7 166.5 L334.36 162 L333 157.5 L331.64 153 L330.3 148.5 L328.98 144 L327.71 139.5 L326.5 135 L325.36 130.5 L324.3 126 L323.34 121.5 L322.48 117 L321.74 112.5 L321.12 108 L320.64 103.5 L320.28 99 L320.07 94.5 L320 90" stroke="#2b7b61" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><rect x="296" y="78" width="48" height="12" fill="#d6dfe3" stroke="#273b45" stroke-width="2"/><rect x="296" y="360" width="48" height="12" fill="#d6dfe3" stroke="#273b45" stroke-width="2"/><line x1="320" y1="30" x2="320" y2="61.2" stroke="#b64f4f" stroke-width="3.5"/><polygon points="320,70 315.5,59 324.5,59" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="332" y="48" font-size="16" fill="#b64f4f" text-anchor="start"><tspan>4P</tspan></text><text x="320" y="400" font-size="16" fill="#287aab" text-anchor="middle"><tspan>l</tspan><tspan dy="4" font-size="12">e</tspan><tspan dy="-4"> = L/2</tspan></text><text x="560" y="150" font-size="17" fill="#273b45" text-anchor="middle"><tspan>P ∝ 1/l</tspan><tspan dy="5" font-size="12">e</tspan><tspan dy="-5">²</tspan></text><text x="560" y="184" font-size="17" fill="#273b45" text-anchor="middle"><tspan>(L ÷ L/2)² =