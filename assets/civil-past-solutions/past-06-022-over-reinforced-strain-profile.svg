<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Strain profiles of under-reinforced, balanced and over-reinforced sections</title><desc id="desc">At failure the top concrete strain is 0.0035. The more tension steel, the deeper the neutral axis and the smaller the steel strain. When the neutral axis is deeper than xu,max the steel is still below its yield strain of about 0.0038 for Fe415 as the concrete crushes: the section is over-reinforced.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><rect x="70" y="100" width="80" height="240" fill="#e4e8e9" stroke="#273b45" stroke-width="2.5"/><circle cx="86" cy="318" r="7" fill="#466d89" stroke="#273b45" stroke-width="1.2"/><circle cx="86" cy="298" r="7" fill="#466d89" stroke="#273b45" stroke-width="1.2"/><circle cx="110" cy="318" r="7" fill="#466d89" stroke="#273b45" stroke-width="1.2"/><circle cx="110" cy="298" r="7" fill="#466d89" stroke="#273b45" stroke-width="1.2"/><circle cx="134" cy="318" r="7" fill="#466d89" stroke="#273b45" stroke-width="1.2"/><circle cx="134" cy="298" r="7" fill="#466d89" stroke="#273b45" stroke-width="1.2"/><text x="110" y="364" font-size="14" fill="#647780" text-anchor="middle"><tspan>section</tspan></text><line x1="280" y1="100" x2="280" y2="334" stroke="#273b45" stroke-width="1.6"/><line x1="210" y1="100" x2="280" y2="100" stroke="#273b45" stroke-width="1.6"/><line x1="280" y1="320" x2="430" y2="320" stroke="#273b45" stroke-width="1.2"/><text x="210" y="92" font-size="14" fill="#273b45" text-anchor="middle"><tspan>0.0035</tspan></text><line x1="210" y1="100" x2="404.44" y2="320" stroke="#287aab" stroke-width="2.5"/><line x1="210" y1="100" x2="355.83" y2="320" stroke="#647780" stroke-width="2" stroke-dasharray="6 5"/><line x1="210" y1="100" x2="317.69" y2="320" stroke="#b64f4f" stroke-width="3.5"/><line x1="274" y1="243" x2="286" y2="243" stroke="#b64f4f" stroke-width="2"/><text x="270" y="248" font-size="14" fill="#b64f4f" text-anchor="end"><tspan>x</tspan><tspan dy="4" font-size="10">u</tspan><tspan dy="-4"> &gt; x</tspan><tspan dy="4" font-size="10">u,max</tspan></text><text x="313.69" y="342" font-size="14" fill="#b64f4f" text-anchor="end"><tspan>over-reinforced</tspan></text><text x="355.83" y="364" font-size="13" fill="#647780" text-anchor="middle"><tspan>balanced, ε</tspan><tspan dy="4" font-size="9">y</tspan><tspan dy="-4"> = 0.0038</tspan></text><text x="408.44" y="342" font-size="14" fill="#287aab" text-anchor="start"><tspan>under</tspan></text><text x="585" y="150" font-size="16" fill="#273b45" text-anchor="middle"><tspan>concrete crushes at 0.0035</tspan></text><text x="585" y="184" font-size="16" fill="#273b45" text-anchor="middle"><tspan>steel strain below yield</tspan></text><rect x="472.25" y="242" width="225.5" height="33" rx="7" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><text x="585" y="262" font-size="17" fill="#2b7b61" text-anchor="middle"><tspan>over-reinforced section</tspan></text></g></svg>