<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Moment carried over to a fixed far end</title><desc id="desc">A moment M applied at the near end A of a member whose far end B is fixed induces M/2 at B, with the moment diagram falling linearly and crossing zero at 2L/3. The ratio MB/MA is the carry-over factor: 1/2 for a fixed far end and 0 for a pinned one.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="90" y1="150" x2="420" y2="150" stroke="#273b45" stroke-width="7"/><polygon points="90,153 75,177 105,177" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><line x1="68" y1="180" x2="112" y2="180" stroke="#647780" stroke-width="2"/><line x1="420" y1="114" x2="420" y2="186" stroke="#273b45" stroke-width="3"/><line x1="420" y1="118" x2="431" y2="128" stroke="#647780" stroke-width="1.4"/><line x1="420" y1="130" x2="431" y2="140" stroke="#647780" stroke-width="1.4"/><line x1="420" y1="142" x2="431" y2="152" stroke="#647780" stroke-width="1.4"/><line x1="420" y1="154" x2="431" y2="164" stroke="#647780" stroke-width="1.4"/><line x1="420" y1="166" x2="431" y2="176" stroke="#647780" stroke-width="1.4"/><line x1="420" y1="178" x2="431" y2="188" stroke="#647780" stroke-width="1.4"/><path d="M64 138 Q90 92 116 138" stroke="#2b7b61" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="116,138 107.16,131.51 115,127.08" fill="#2b7b61" stroke="#2b7b61" stroke-width="1.5" stroke-linejoin="round"/><text x="90" y="84" font-size="16" fill="#2b7b61" text-anchor="middle"><tspan>M</tspan></text><path d="M354 138 Q380 92 406 138" stroke="#2b7b61" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="406,138 397.16,131.51 405,127.08" fill="#2b7b61" stroke="#2b7b61" stroke-width="1.5" stroke-linejoin="round"/><text x="380" y="84" font-size="16" fill="#2b7b61" text-anchor="middle"><tspan>M/2</tspan></text><text x="62" y="158" font-size="16" fill="#273b45" text-anchor="end"><tspan>A</tspan></text><text x="442" y="208" font-size="16" fill="#273b45" text-anchor="end"><tspan>B</tspan></text><polygon points="90,300 90,230 310,300" fill="#f2dfdf" stroke="#b64f4f" stroke-width="2" stroke-linejoin="round"/><polygon points="310,300 420,335 420,300" fill="#f2dfdf" stroke="#b64f4f" stroke-width="2" stroke-linejoin="round"/><line x1="90" y1="300" x2="420" y2="300" stroke="#273b45" stroke-width="1.5"/><text x="82" y="240" font-size="15" fill="#b64f4f" text-anchor="end"><tspan>M</tspan></text><text x="428" y="334" font-size="15" fill="#b64f4f" text-anchor="start"><tspan>M/2</tspan></text><text x="310" y="288" font-size="13" fill="#647780" text-anchor="middle"><tspan>2L/3</tspan></text><text x="585" y="140" font-size="16" fill="#273b45" text-anchor="middle"><tspan>M</tspan><tspan dy="4" font-size="12">B</tspan><tspan dy="-4"> = COF × M</tspan><tspan dy="4" font-size="12">A</tspan></text><text x="585" y="172" font-size="16" fill="#273b45" text-anchor="middle"><tspan>far end fixed: 1/2</tspan></text><text x="585" y="204" font-size="16" fill="#273b45" text-anchor="middle"><tspan>far end pinned: 0</tspan></text><rect x="497.75" y="242" width="174.5" height="33" rx="7" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><text x="585" y="262" font-size="17" fill="#2b7b61" text-anchor="middle"><tspan>carry-over factor</tspan></text></g></svg>