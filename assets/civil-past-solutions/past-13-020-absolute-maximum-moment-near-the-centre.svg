<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Absolute maximum moment under a moving train</title><desc id="desc">Place the train so that the centre of the span bisects the distance between the resultant R and the nearest heavy load. The absolute maximum moment then occurs under that load, close to mid-span, while the moment at the supports stays zero.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="70" y1="150" x2="470" y2="150" stroke="#273b45" stroke-width="6"/><polygon points="70,155 55,179 85,179" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><line x1="48" y1="182" x2="92" y2="182" stroke="#647780" stroke-width="2"/><polygon points="470,155 455,176 485,176" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><circle cx="462" cy="182" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><circle cx="478" cy="182" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><line x1="448" y1="189" x2="492" y2="189" stroke="#647780" stroke-width="2"/><line x1="236.67" y1="80" x2="236.67" y2="137.2" stroke="#b64f4f" stroke-width="3.5"/><polygon points="236.67,146 232.17,135 241.17,135" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="236.67" y="72" font-size="15" fill="#b64f4f" text-anchor="middle"><tspan>2W</tspan></text><line x1="436.67" y1="96" x2="436.67" y2="137.2" stroke="#b64f4f" stroke-width="3"/><polygon points="436.67,146 432.17,135 441.17,135" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="436.67" y="88" font-size="15" fill="#b64f4f" text-anchor="middle"><tspan>W</tspan></text><line x1="303.33" y1="90" x2="303.33" y2="137.2" stroke="#647780" stroke-width="2" stroke-dasharray="5 4"/><polygon points="303.33,146 298.83,135 307.83,135" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><text x="311.33" y="106" font-size="15" fill="#647780" text-anchor="start"><tspan>R</tspan></text><line x1="270" y1="70" x2="270" y2="250" stroke="#2b7b61" stroke-width="1.8" stroke-dasharray="6 4"/><text x="270" y="270" font-size="14" fill="#2b7b61" text-anchor="middle"><tspan>centre of span</tspan></text><line x1="236.67" y1="206" x2="270" y2="206" stroke="#647780" stroke-width="1.5"/><line x1="236.67" y1="199" x2="236.67" y2="213" stroke="#647780" stroke-width="1.5"/><line x1="270" y1="199" x2="270" y2="213" stroke="#647780" stroke-width="1.5"/><text x="253.33" y="232" font-size="13" fill="#647780" text-anchor="middle">e/2</text><line x1="270" y1="206" x2="303.33" y2="206" stroke="#647780" stroke-width="1.5"/><line x1="270" y1="199" x2="270" y2="213" stroke="#647780" stroke-width="1.5"/><line x1="303.33" y1="199" x2="303.33" y2="213" stroke="#647780" stroke-width="1.5"/><text x="286.67" y="232" font-size="13" fill="#647780" text-anchor="middle">e/2</text><text x="236.67" y="320" font-size="15" fill="#b64f4f" text-anchor="middle"><tspan>M</tspan><tspan dy="4" font-size="11">abs max</tspan><tspan dy="-4"> under 2W</tspan></text><rect x="511.25" y="242" width="157.5" height="33" rx="7" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><text x="590" y="262" font-size="17" fill="#2b7b61" text-anchor="middle"><tspan>near the centre</tspan></text></g></svg>