<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Moment needed to rotate the near end with the far end fixed</title><desc id="desc">Rotating the near end A of a prismatic member through a unit angle while the far end B stays fixed needs a moment of 4EI/L. Half of it, 2EI/L, is carried over to the fixed end.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="80" y1="200" x2="420" y2="200" stroke="#b8c8ce" stroke-width="6"/><path d="M80 200 L84.25 203.66 L88.5 207.13 L92.75 210.42 L97 213.54 L101.25 216.48 L105.5 219.25 L109.75 221.86 L114 224.3 L118.25 226.58 L122.5 228.71 L126.75 230.69 L131 232.51 L135.25 234.19 L139.5 235.73 L143.75 237.13 L148 238.4 L152.25 239.53 L156.5 240.54 L160.75 241.43 L165 242.19 L169.25 242.83 L173.5 243.36 L177.75 243.79 L182 244.1 L186.25 244.31 L190.5 244.42 L194.75 244.44 L199 244.36 L203.25 244.2 L207.5 243.95 L211.75 243.61 L216 243.2 L220.25 242.71 L224.5 242.15 L228.75 241.53 L233 240.84 L237.25 240.09 L241.5 239.28 L245.75 238.41 L250 237.5 L254.25 236.54 L258.5 235.54 L262.75 234.49 L267 233.41 L271.25 232.3 L275.5 231.16 L279.75 229.99 L284 228.8 L288.25 227.59 L292.5 226.37 L296.75 225.13 L301 223.89 L305.25 222.64 L309.5 221.39 L313.75 220.14 L318 218.9 L322.25 217.67 L326.5 216.45 L330.75 215.25 L335 214.06 L339.25 212.9 L343.5 211.77 L347.75 210.67 L352 209.6 L356.25 208.57 L360.5 207.58 L364.75 206.63 L369 205.74 L373.25 204.89 L377.5 204.1 L381.75 203.37 L386 202.7 L390.25 202.1 L394.5 201.56 L398.75 201.1 L403 200.71 L407.25 200.41 L411.5 200.18 L415.75 200.05 L420 200" stroke="#287aab" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="80,203 65,227 95,227" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><line x1="58" y1="230" x2="102" y2="230" stroke="#647780" stroke-width="2"/><line x1="80" y1="200" x2="150" y2="261.76" stroke="#647780" stroke-width="1.2" stroke-dasharray="5 4"/><path d="M128 200 A48 48 0 0 1 115.99 231.76" stroke="#273b45" stroke-width="1.6" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="138" y="188" font-size="15" fill="#273b45" text-anchor="start"><tspan>θ</tspan><tspan dy="4" font-size="11">A</tspan><tspan dy="-4"> = 1</tspan></text><path d="M54 188 Q80 142 106 188" stroke="#2b7b61" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="106,188 97.16,181.51 105,177.08" fill="#2b7b61" stroke="#2b7b61" stroke-width="1.5" stroke-linejoin="round"/><text x="80" y="134" font-size="15" fill="#2b7b61" text-anchor="middle"><tspan>M</tspan><tspan dy="4" font-size="11">A</tspan></text><text x="52" y="208" font-size="16" fill="#273b45" text-anchor="end"><tspan>A</tspan></text><line x1="420" y1="164" x2="420" y2="236" stroke="#273b45" stroke-width="3"/><line x1="420" y1="168" x2="431" y2="178" stroke="#647780" stroke-width="1.4"/><line x1="420" y1="180" x2="431" y2="190" stroke="#647780" stroke-width="1.4"/><line x1="420" y1="192" x2="431" y2="202" stroke="#647780" stroke-width="1.4"/><line x1="420" y1="204" x2="431" y2="214" stroke="#647780" stroke-width="1.4"/><line x1="420" y1="216" x2="431" y2="226" stroke="#647780" stroke-width="1.4"/><line x1="420" y1="228" x2="431" y2="238" stroke="#647780" stroke-width="1.4"/><text x="442" y="258" font-size="15" fill="#273b45" text-anchor="end"><tspan>B fixed</tspan></text><text x="412" y="152" font-size="14" fill="#647780" text-anchor="end"><tspan>carry-over 2EI/L</tspan></text><text x="585" y="150" font-size="17" fill="#273b45" text-anchor="middle"><tspan>θ</tspan><tspan dy="5" font-size="12">A</tspan><tspan dy="-5"> = 1, far end fixed</tspan></text><text x="585" y="184" font-size="17" fill="#273b45" text-anchor="middle"><tspan>carry-over 2EI/L</tspan></text><rect x="527.25" y="240" width="115.5" height="35" rx="7" fill="#