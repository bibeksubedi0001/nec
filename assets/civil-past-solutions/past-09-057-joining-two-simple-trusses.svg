<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Joining two simple trusses into a determinate compound truss</title><desc id="desc">Each simple truss is rigid with m = 2j - 3. Three bars that are neither parallel nor concurrent fix one truss to the other, like the three reactions of a rigid body, so the compound truss is rigid and determinate with m = m1 + m2 + 3.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="60" y1="300" x2="170" y2="300" stroke="#466d89" stroke-width="5"/><line x1="60" y1="190" x2="170" y2="190" stroke="#466d89" stroke-width="5"/><line x1="60" y1="300" x2="60" y2="190" stroke="#466d89" stroke-width="5"/><line x1="170" y1="300" x2="170" y2="190" stroke="#466d89" stroke-width="5"/><line x1="60" y1="300" x2="170" y2="190" stroke="#466d89" stroke-width="5"/><line x1="290" y1="300" x2="400" y2="300" stroke="#466d89" stroke-width="5"/><line x1="290" y1="190" x2="400" y2="190" stroke="#466d89" stroke-width="5"/><line x1="290" y1="300" x2="290" y2="190" stroke="#466d89" stroke-width="5"/><line x1="400" y1="300" x2="400" y2="190" stroke="#466d89" stroke-width="5"/><line x1="290" y1="190" x2="400" y2="300" stroke="#466d89" stroke-width="5"/><line x1="170" y1="190" x2="290" y2="190" stroke="#b64f4f" stroke-width="4"/><line x1="170" y1="300" x2="290" y2="300" stroke="#b64f4f" stroke-width="4"/><line x1="170" y1="300" x2="290" y2="190" stroke="#b64f4f" stroke-width="4"/><circle cx="60" cy="300" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><circle cx="170" cy="300" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><circle cx="60" cy="190" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><circle cx="170" cy="190" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><circle cx="290" cy="300" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><circle cx="400" cy="300" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><circle cx="290" cy="190" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><circle cx="400" cy="190" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><polygon points="60,305 45,329 75,329" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><line x1="38" y1="332" x2="82" y2="332" stroke="#647780" stroke-width="2"/><polygon points="400,305 385,326 415,326" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><circle cx="392" cy="332" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><circle cx="408" cy="332" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><line x1="378" y1="339" x2="422" y2="339" stroke="#647780" stroke-width="2"/><text x="115" y="170" font-size="14" fill="#273b45" text-anchor="middle"><tspan>truss 1: m</tspan><tspan dy="4" font-size="10">1</tspan><tspan dy="-4"> = 5</tspan></text><text x="345" y="170" font-size="14" fill="#273b45" text-anchor="middle"><tspan>truss 2: m</tspan><tspan dy="4" font-size="10">2</tspan><tspan dy="-4"> = 5</tspan></text><text x="230" y="140" font-size="14" fill="#b64f4f" text-anchor="middle"><tspan>3 connecting bars</tspan></text><text x="230" y="372" font-size="14" fill="#647780" text-anchor="middle"><tspan>j = 8, m = 13 = 2 × 8 − 3</tspan></text><text x="585" y="150" font-size="16" fill="#273b45" text-anchor="middle"><tspan>simple truss: m = 2j − 3</tspan></text><text x="585" y="184" font-size="16" fill="#273b45" text-anchor="middle"><tspan>3 bars join them rigidly</tspan></text><rect x="498.75" y="240" width="172.5" height="35" rx="7" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><text x="585" y="262" font-size="19" fill="#2b7b61" text-anchor="middle"><tspan>m = m</tspan><tspan dy="5" font-size="14">1</tspan><tspan dy="-5"> + m</tspan><tspan dy="5" font-size="14">2</tspan><tspan dy="-5"> + 3</tspan></text></g></svg>