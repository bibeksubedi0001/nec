<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Equal end moments: no reactions and no shear</title><desc id="desc">Equal moments M at the two supports balance each other, so both vertical reactions are zero. A free body cut at any section carries only the moment M, so the shear force is zero at all sections and the beam bends into a circular arc.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="90" y1="110" x2="440" y2="110" stroke="#647780" stroke-width="1.5" stroke-dasharray="6 5"/><path d="M90 110 L97 111.88 L104 113.76 L111 115.62 L118 117.46 L125 119.27 L132 121.04 L139 122.77 L146 124.45 L153 126.07 L160 127.63 L167 129.12 L174 130.54 L181 131.87 L188 133.12 L195 134.27 L202 135.33 L209 136.29 L216 137.14 L223 137.89 L230 138.53 L237 139.06 L244 139.47 L251 139.76 L258 139.94 L265 140 L272 139.94 L279 139.76 L286 139.47 L293 139.06 L300 138.53 L307 137.89 L314 137.14 L321 136.29 L328 135.33 L335 134.27 L342 133.12 L349 131.87 L356 130.54 L363 129.12 L370 127.63 L377 126.07 L384 124.45 L391 122.77 L398 121.04 L405 119.27 L412 117.46 L419 115.62 L426 113.76 L433 111.88 L440 110" stroke="#273b45" stroke-width="6" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="90,115 75,139 105,139" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><line x1="68" y1="142" x2="112" y2="142" stroke="#647780" stroke-width="2"/><polygon points="440,115 425,136 455,136" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><circle cx="432" cy="142" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><circle cx="448" cy="142" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><line x1="418" y1="149" x2="462" y2="149" stroke="#647780" stroke-width="2"/><path d="M69.22 122 A24 24 0 1 1 110.78 122" stroke="#2b7b61" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="110.78,122 112.39,110.22 120.18,114.72" fill="#2b7b61" stroke="#2b7b61" stroke-width="1.5" stroke-linejoin="round"/><path d="M460.78 122 A24 24 0 1 0 419.22 122" stroke="#2b7b61" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="419.22,122 409.82,114.72 417.61,110.22" fill="#2b7b61" stroke="#2b7b61" stroke-width="1.5" stroke-linejoin="round"/><text x="90" y="74" font-size="17" fill="#2b7b61" text-anchor="middle"><tspan>M</tspan></text><text x="440" y="74" font-size="17" fill="#2b7b61" text-anchor="middle"><tspan>M</tspan></text><text x="265" y="190" font-size="15" fill="#287aab" text-anchor="middle"><tspan>R</tspan><tspan dy="4" font-size="11">A</tspan><tspan dy="-4"> = R</tspan><tspan dy="4" font-size="11">B</tspan><tspan dy="-4"> = 0</tspan></text><rect x="90" y="260" width="170" height="26" fill="#d6dfe3" stroke="#273b45" stroke-width="2"/><path d="M70.95 284 A22 22 0 1 1 109.05 284" stroke="#2b7b61" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="109.05,284 110.66,272.22 118.45,276.72" fill="#2b7b61" stroke="#2b7b61" stroke-width="1.5" stroke-linejoin="round"/><path d="M279.05 284 A22 22 0 1 0 240.95 284" stroke="#2b7b61" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="240.95,284 231.55,276.72 239.34,272.22" fill="#2b7b61" stroke="#2b7b61" stroke-width="1.5" stroke-linejoin="round"/><text x="60" y="250" font-size="16" fill="#2b7b61" text-anchor="middle"><tspan>M</tspan></text><text x="292" y="250" font-size="16" fill="#2b7b61" text-anchor="middle"><tspan>M</tspan></text><text x="175" y="326" font-size="15" fill="#647780" text-anchor="middle"><tspan>free body: ΣF</tspan><tspan dy="4" font-size="11">y</tspan><tspan dy="-4"> = 0 gives S = 0</tspan></text><text x="590" y="150" font-size="17" fill="#273b45" text-anchor="middle"><tspan>couples balance</tspan></text><text x="590" y="184" font-size="17" fill="#273b45" text-anchor="middle"><tspan>no vertical force</tspan></text><rect x="490" y="242" width="200" height="33" rx="7" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><text x="590" y="262" font-size="17" fill="#2b7b61" text-anchor="middle"><tspan>SFD: zero everywhere</tspan></text></g></svg>