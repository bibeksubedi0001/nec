<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Euler loads for the four end conditions</title><desc id="desc">With P = π squared EI/le squared, the crippling load in units of π squared EI/L squared is 1/4 for fixed-free, 1 for hinged-hinged, about 2 for fixed-hinged and 4 for fixed-fixed, where le = L/2.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="70" y1="320" x2="450" y2="320" stroke="#273b45" stroke-width="1.6"/><rect x="90" y="307" width="56" height="13" fill="#e6f1f8" stroke="#287aab" stroke-width="2"/><text x="118" y="299" font-size="16" fill="#287aab" text-anchor="middle"><tspan>¼</tspan></text><text x="118" y="344" font-size="12" fill="#647780" text-anchor="middle">fixed–free</text><rect x="182" y="268" width="56" height="52" fill="#e6f1f8" stroke="#287aab" stroke-width="2"/><text x="210" y="260" font-size="16" fill="#287aab" text-anchor="middle"><tspan>1</tspan></text><text x="210" y="344" font-size="12" fill="#647780" text-anchor="middle">hinged–hinged</text><rect x="274" y="213.4" width="56" height="106.6" fill="#e6f1f8" stroke="#287aab" stroke-width="2"/><text x="302" y="205.4" font-size="16" fill="#287aab" text-anchor="middle"><tspan>2.05</tspan></text><text x="302" y="344" font-size="12" fill="#647780" text-anchor="middle">fixed–hinged</text><rect x="366" y="112" width="56" height="208" fill="#2b7b61" stroke="#2b7b61" stroke-width="2"/><text x="394" y="104" font-size="16" fill="#2b7b61" text-anchor="middle"><tspan>4</tspan></text><text x="394" y="344" font-size="12" fill="#647780" text-anchor="middle">fixed–fixed</text><text x="260" y="380" font-size="15" fill="#647780" text-anchor="middle"><tspan>P in units of π²EI/L²</tspan></text><text x="580" y="150" font-size="17" fill="#273b45" text-anchor="middle"><tspan>l</tspan><tspan dy="5" font-size="12">e</tspan><tspan dy="-5"> = L/2</tspan></text><text x="580" y="184" font-size="17" fill="#273b45" text-anchor="middle"><tspan>P = π²EI/(L/2)²</tspan></text><rect x="508" y="240" width="144" height="35" rx="7" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><text x="580" y="262" font-size="19" fill="#2b7b61" text-anchor="middle"><tspan>P = 4π²EI/L²</tspan></text></g></svg>