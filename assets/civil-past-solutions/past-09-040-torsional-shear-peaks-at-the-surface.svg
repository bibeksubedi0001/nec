<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Torsional shear stress grows from the centre to the surface</title><desc id="desc">In a shaft under torque T the shear stress is τ = Tr/J: zero on the axis and growing linearly with the radius to its largest value TR/J at the outer surface.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><circle cx="190" cy="210" r="110" fill="#d6dfe3" stroke="#273b45" stroke-width="2"/><circle cx="190" cy="210" r="4" fill="#273b45" stroke="#273b45" stroke-width="2"/><line x1="190" y1="210" x2="190" y2="180" stroke="#647780" stroke-width="1"/><line x1="190" y1="180" x2="206.8" y2="180" stroke="#2b7b61" stroke-width="2.5"/><polygon points="214,180 205,184 205,176" fill="#2b7b61" stroke="#2b7b61" stroke-width="1.5" stroke-linejoin="round"/><line x1="190" y1="210" x2="190" y2="150" stroke="#647780" stroke-width="1"/><line x1="190" y1="150" x2="230.8" y2="150" stroke="#2b7b61" stroke-width="2.5"/><polygon points="238,150 229,154 229,146" fill="#2b7b61" stroke="#2b7b61" stroke-width="1.5" stroke-linejoin="round"/><line x1="190" y1="210" x2="190" y2="120" stroke="#647780" stroke-width="1"/><line x1="190" y1="120" x2="254.8" y2="120" stroke="#2b7b61" stroke-width="2.5"/><polygon points="262,120 253,124 253,116" fill="#2b7b61" stroke="#2b7b61" stroke-width="1.5" stroke-linejoin="round"/><path d="M79.15 274 A128 128 0 1 1 300.85 274" stroke="#b64f4f" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="300.85,274 302.45,262.22 310.25,266.72" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="190" y="72" font-size="17" fill="#b64f4f" text-anchor="middle"><tspan>T</tspan></text><line x1="380" y1="330" x2="551.2" y2="330" stroke="#273b45" stroke-width="1.6"/><polygon points="560,330 549,334.5 549,325.5" fill="#273b45" stroke="#273b45" stroke-width="1.5" stroke-linejoin="round"/><line x1="380" y1="330" x2="380" y2="168.8" stroke="#273b45" stroke-width="1.6"/><polygon points="380,160 384.5,171 375.5,171" fill="#273b45" stroke="#273b45" stroke-width="1.5" stroke-linejoin="round"/><line x1="380" y1="330" x2="530" y2="190" stroke="#2b7b61" stroke-width="3"/><circle cx="530" cy="190" r="5" fill="#2b7b61" stroke="#2b7b61" stroke-width="2"/><text x="556" y="352" font-size="16" fill="#273b45" text-anchor="end"><tspan>r</tspan></text><text x="372" y="172" font-size="16" fill="#273b45" text-anchor="end"><tspan>τ</tspan></text><text x="530" y="352" font-size="15" fill="#273b45" text-anchor="middle"><tspan>R</tspan></text><text x="520" y="180" font-size="15" fill="#2b7b61" text-anchor="end"><tspan>TR/J</tspan></text><rect x="336" y="372" width="268" height="33" rx="7" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><text x="470" y="392" font-size="17" fill="#2b7b61" text-anchor="middle"><tspan>maximum at the outer surface</tspan></text></g></svg>