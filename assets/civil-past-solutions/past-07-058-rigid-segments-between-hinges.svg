<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Sway mechanism: straight segments between plastic hinges</title><desc id="desc">In rigid-plastic analysis all rotation happens at the plastic hinges, where the moment stays at Mp. The members between hinges carry less than Mp, their elastic bending is ignored, and they move as straight rigid bodies.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="110" y1="170" x2="110" y2="350" stroke="#b8c8ce" stroke-width="4" stroke-dasharray="7 5"/><line x1="110" y1="170" x2="370" y2="170" stroke="#b8c8ce" stroke-width="4" stroke-dasharray="7 5"/><line x1="370" y1="170" x2="370" y2="350" stroke="#b8c8ce" stroke-width="4" stroke-dasharray="7 5"/><line x1="110" y1="350" x2="160" y2="170" stroke="#273b45" stroke-width="6"/><line x1="160" y1="170" x2="420" y2="170" stroke="#273b45" stroke-width="6"/><line x1="370" y1="350" x2="420" y2="170" stroke="#273b45" stroke-width="6"/><rect x="86" y="356" width="48" height="12" fill="#d6dfe3" stroke="#273b45" stroke-width="2"/><rect x="346" y="356" width="48" height="12" fill="#d6dfe3" stroke="#273b45" stroke-width="2"/><circle cx="110" cy="350" r="7" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><circle cx="160" cy="170" r="7" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><circle cx="370" cy="350" r="7" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><circle cx="420" cy="170" r="7" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><line x1="40" y1="170" x2="141.2" y2="170" stroke="#b64f4f" stroke-width="3.5"/><polygon points="150,170 139,174.5 139,165.5" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="64" y="158" font-size="16" fill="#b64f4f" text-anchor="middle"><tspan>P</tspan></text><text x="290" y="156" font-size="15" fill="#273b45" text-anchor="middle"><tspan>rigid</tspan></text><text x="146" y="266" font-size="15" fill="#273b45" text-anchor="start"><tspan>rigid</tspan></text><text x="406" y="266" font-size="15" fill="#273b45" text-anchor="start"><tspan>rigid</tspan></text><text x="124" y="334" font-size="15" fill="#273b45" text-anchor="start"><tspan>θ</tspan></text><text x="384" y="334" font-size="15" fill="#273b45" text-anchor="start"><tspan>θ</tspan></text><circle cx="150" cy="396" r="7" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><text x="164" y="401" font-size="13" fill="#b64f4f" text-anchor="start"><tspan>plastic hinge: all rotation here</tspan></text><text x="585" y="150" font-size="17" fill="#273b45" text-anchor="middle"><tspan>rotation only at hinges</tspan></text><text x="585" y="184" font-size="17" fill="#273b45" text-anchor="middle"><tspan>members stay straight</tspan></text><rect x="494" y="240" width="182" height="35" rx="7" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><text x="585" y="262" font-size="19" fill="#2b7b61" text-anchor="middle"><tspan>a rigid material</tspan></text></g></svg>