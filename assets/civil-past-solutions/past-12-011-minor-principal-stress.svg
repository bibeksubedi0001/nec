<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Minor principal stress from σx and τxy</title><desc id="desc">With σy = 0, Mohr's circle passes through (σx, τxy) and (0, -τxy). Its centre is at σx/2 and its radius root(σx squared/4 + τxy squared), so the minor principal stress, on the left, is σx/2 minus that radius and is compressive.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="110" y1="230" x2="499.2" y2="230" stroke="#273b45" stroke-width="1.6"/><polygon points="508,230 497,234.5 497,225.5" fill="#273b45" stroke="#273b45" stroke-width="1.5" stroke-linejoin="round"/><line x1="260" y1="384" x2="260" y2="82.8" stroke="#273b45" stroke-width="1.6"/><polygon points="260,74 264.5,85 255.5,85" fill="#273b45" stroke="#273b45" stroke-width="1.5" stroke-linejoin="round"/><text x="512" y="235" font-size="17" fill="#273b45" text-anchor="start"><tspan>σ</tspan></text><text x="252" y="78" font-size="17" fill="#273b45" text-anchor="end"><tspan>τ</tspan></text><circle cx="338" cy="230" r="130" fill="#e6f1f8" stroke="#287aab" stroke-width="2.5"/><circle cx="338" cy="230" r="3.5" fill="#287aab" stroke="#287aab" stroke-width="2"/><line x1="416" y1="126" x2="260" y2="334" stroke="#647780" stroke-width="1.5" stroke-dasharray="5 4"/><circle cx="416" cy="126" r="5" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><circle cx="260" cy="334" r="5" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><text x="424" y="118" font-size="15" fill="#b64f4f" text-anchor="start"><tspan>(σ</tspan><tspan dy="4" font-size="11">x</tspan><tspan dy="-4">, τ</tspan><tspan dy="4" font-size="11">xy</tspan><tspan dy="-4">)</tspan></text><text x="272" y="362" font-size="15" fill="#b64f4f" text-anchor="start"><tspan>(0, −τ</tspan><tspan dy="4" font-size="11">xy</tspan><tspan dy="-4">)</tspan></text><circle cx="208" cy="230" r="6" fill="#2b7b61" stroke="#2b7b61" stroke-width="2"/><text x="200" y="252" font-size="17" fill="#2b7b61" text-anchor="end"><tspan>σ</tspan><tspan dy="5" font-size="12">2</tspan></text><text x="346" y="250" font-size="15" fill="#287aab" text-anchor="start"><tspan>σ</tspan><tspan dy="4" font-size="11">x</tspan><tspan dy="-4">/2</tspan></text><line x1="338" y1="230" x2="416" y2="126" stroke="#287aab" stroke-width="2"/><text x="383" y="178" font-size="16" fill="#287aab" text-anchor="start"><tspan>R</tspan></text><rect x="223.5" y="373" width="273" height="34" rx="7" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><text x="360" y="394" font-size="18" fill="#2b7b61" text-anchor="middle"><tspan>σ</tspan><tspan dy="5" font-size="13">2</tspan><tspan dy="-5"> = σ</tspan><tspan dy="5" font-size="13">x</tspan><tspan dy="-5">/2 − √(σ</tspan><tspan dy="5" font-size="13">x</tspan><tspan dy="-5">²/4 + τ</tspan><tspan dy="5" font-size="13">xy</tspan><tspan dy="-5">²)</tspan></text></g></svg>