<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Equilibrium of a short beam element</title><desc id="desc">Taking moments about the right face of a slice dx: M + S dx - (M + dM) = 0, the load term being negligible, so S = dM/dx. Vertical equilibrium gives dS/dx = -w.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><rect x="150" y="150" width="180" height="80" fill="#d6dfe3" stroke="#273b45" stroke-width="2"/><line x1="150" y1="117" x2="330" y2="117" stroke="#b64f4f" stroke-width="2"/><line x1="150" y1="117" x2="150" y2="138.8" stroke="#b64f4f" stroke-width="2"/><polygon points="150,146 146,137 154,137" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><line x1="186" y1="117" x2="186" y2="138.8" stroke="#b64f4f" stroke-width="2"/><polygon points="186,146 182,137 190,137" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><line x1="222" y1="117" x2="222" y2="138.8" stroke="#b64f4f" stroke-width="2"/><polygon points="222,146 218,137 226,137" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><line x1="258" y1="117" x2="258" y2="138.8" stroke="#b64f4f" stroke-width="2"/><polygon points="258,146 254,137 262,137" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><line x1="294" y1="117" x2="294" y2="138.8" stroke="#b64f4f" stroke-width="2"/><polygon points="294,146 290,137 298,137" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><line x1="330" y1="117" x2="330" y2="138.8" stroke="#b64f4f" stroke-width="2"/><polygon points="330,146 326,137 334,137" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="240" y="106" font-size="17" fill="#b64f4f" text-anchor="middle"><tspan>w</tspan></text><line x1="150" y1="224" x2="150" y2="166.8" stroke="#287aab" stroke-width="3.5"/><polygon points="150,158 154.5,169 145.5,169" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><line x1="330" y1="158" x2="330" y2="215.2" stroke="#287aab" stroke-width="3.5"/><polygon points="330,224 325.5,213 334.5,213" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><text x="150" y="252" font-size="17" fill="#287aab" text-anchor="middle"><tspan>S</tspan></text><text x="330" y="252" font-size="17" fill="#287aab" text-anchor="middle"><tspan>S + dS</tspan></text><path d="M73.48 203 A26 26 0 1 1 118.52 203" stroke="#2b7b61" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="118.52,203 120.12,191.22 127.91,195.72" fill="#2b7b61" stroke="#2b7b61" stroke-width="1.5" stroke-linejoin="round"/><path d="M406.52 203 A26 26 0 1 0 361.48 203" stroke="#2b7b61" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="361.48,203 352.09,195.72 359.88,191.22" fill="#2b7b61" stroke="#2b7b61" stroke-width="1.5" stroke-linejoin="round"/><text x="96" y="150" font-size="17" fill="#2b7b61" text-anchor="middle"><tspan>M</tspan></text><text x="384" y="150" font-size="17" fill="#2b7b61" text-anchor="middle"><tspan>M + dM</tspan></text><line x1="150" y1="280" x2="330" y2="280" stroke="#647780" stroke-width="1.5"/><line x1="150" y1="273" x2="150" y2="287" stroke="#647780" stroke-width="1.5"/><line x1="330" y1="273" x2="330" y2="287" stroke="#647780" stroke-width="1.5"/><text x="240" y="306" font-size="16" fill="#647780" text-anchor="middle">dx</text><text x="585" y="140" font-size="15" fill="#647780" text-anchor="middle"><tspan>moments about the right face</tspan></text><text x="585" y="172" font-size="17" fill="#273b45" text-anchor="middle"><tspan>M + S dx − (M + dM) = 0</tspan></text><text x="585" y="204" font-size="14" fill="#647780" text-anchor="middle"><tspan>w dx²/2 is negligible</tspan></text><rect x="527.25" y="240" width="115.5" height="35" rx="7" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><text x="585" y="262" font-size="19" fill="#2b7b61" text-anchor="middle"><tspan>S = dM/dx</tspan></text><text x="585" y="318" font-size="16" fill="#647780" text-anchor="middle"><tspan>and dS/dx = −w</tspan></text></g></svg>