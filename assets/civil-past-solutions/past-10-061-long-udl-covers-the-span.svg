<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">A uniform load longer than the span gives the greatest moment when it covers the span</title><desc id="desc">Every ordinate of the moment influence line of a simple beam is positive, so the moment at any section is largest when the whole span is loaded. The mid-span moment is then wL squared/8.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="90" y1="130" x2="450" y2="130" stroke="#273b45" stroke-width="6"/><polygon points="90,135 75,159 105,159" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><line x1="68" y1="162" x2="112" y2="162" stroke="#647780" stroke-width="2"/><polygon points="450,135 435,156 465,156" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><circle cx="442" cy="162" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><circle cx="458" cy="162" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><line x1="428" y1="169" x2="472" y2="169" stroke="#647780" stroke-width="2"/><line x1="90" y1="98" x2="450" y2="98" stroke="#b64f4f" stroke-width="2"/><line x1="90" y1="98" x2="90" y2="117.8" stroke="#b64f4f" stroke-width="2"/><polygon points="90,125 86,116 94,116" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><line x1="130" y1="98" x2="130" y2="117.8" stroke="#b64f4f" stroke-width="2"/><polygon points="130,125 126,116 134,116" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><line x1="170" y1="98" x2="170" y2="117.8" stroke="#b64f4f" stroke-width="2"/><polygon points="170,125 166,116 174,116" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><line x1="210" y1="98" x2="210" y2="117.8" stroke="#b64f4f" stroke-width="2"/><polygon points="210,125 206,116 214,116" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><line x1="250" y1="98" x2="250" y2="117.8" stroke="#b64f4f" stroke-width="2"/><polygon points="250,125 246,116 254,116" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><line x1="290" y1="98" x2="290" y2="117.8" stroke="#b64f4f" stroke-width="2"/><polygon points="290,125 286,116 294,116" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><line x1="330" y1="98" x2="330" y2="117.8" stroke="#b64f4f" stroke-width="2"/><polygon points="330,125 326,116 334,116" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><line x1="370" y1="98" x2="370" y2="117.8" stroke="#b64f4f" stroke-width="2"/><polygon points="370,125 366,116 374,116" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><line x1="410" y1="98" x2="410" y2="117.8" stroke="#b64f4f" stroke-width="2"/><polygon points="410,125 406,116 414,116" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><line x1="450" y1="98" x2="450" y2="117.8" stroke="#b64f4f" stroke-width="2"/><polygon points="450,125 446,116 454,116" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><rect x="40" y="94" width="460" height="32" fill="none" stroke="#b64f4f" stroke-width="1.5" stroke-dasharray="6 4"/><text x="270" y="84" font-size="14" fill="#b64f4f" text-anchor="middle"><tspan>load longer than the span</tspan></text><polygon points="90,340 90,340 270,220 450,340 450,340" fill="#f5ead8" stroke="none" stroke-width="2" stroke-linejoin="round"/><path d="M90 340 L270 220 L450 340" stroke="#b98232" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="90" y1="340" x2="450" y2="340" stroke="#273b45" stroke-width="1.5"/><text x="78" y="345" font-size="14" fill="#647780" text-anchor="end"><tspan>ILD M</tspan><tspan dy="4" font-size="10">mid</tspan></text><text x="270" y="210" font-size="14" fill="#b98232" text-anchor="middle"><tspan>all ordinates +</tspan></text><text x="590" y="150" font-size="16" fill="#273b45" text-anchor="middle"><tspan>whole span loaded</tspan></text><text x="590" y="184" font-size="16" fill="#273b45" text-anchor="middle"><tspan>M</tspan><tspan dy="4" font-size="12">mid</tspan><tspan dy="-4"> = wL²/8</tspan></text><rect x="477.5" y="244" width="225" height="31" rx="7" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><text x="590" y="262" font-size="15" fill="#2b7b61" text-anchor="middle"><tspan>UDL covers the entire beam</tspan></text></g></svg>