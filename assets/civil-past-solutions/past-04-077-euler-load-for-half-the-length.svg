<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Euler load of a pin-ended rod when its length is halved</title><desc id="desc">For the same section and end conditions, P = π squared EI/L squared varies as 1/L squared. Halving the length from 2 m to 1 m multiplies the crippling load by 4, from 1 kN to 4 kN.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="130" y1="90" x2="130" y2="370" stroke="#b8c8ce" stroke-width="7"/><path d="M130 370 L131.57 365.33 L133.14 360.67 L134.69 356 L136.24 351.33 L137.76 346.67 L139.27 342 L140.75 337.33 L142.2 332.67 L143.62 328 L145 323.33 L146.34 318.67 L147.63 314 L148.88 309.33 L150.07 304.67 L151.21 300 L152.29 295.33 L153.31 290.67 L154.27 286 L155.16 281.33 L155.98 276.67 L156.73 272 L157.41 267.33 L158.01 262.67 L158.53 258 L158.98 253.33 L159.34 248.67 L159.63 244 L159.84 239.33 L159.96 234.67 L160 230 L159.96 225.33 L159.84 220.67 L159.63 216 L159.34 211.33 L158.98 206.67 L158.53 202 L158.01 197.33 L157.41 192.67 L156.73 188 L155.98 183.33 L155.16 178.67 L154.27 174 L153.31 169.33 L152.29 164.67 L151.21 160 L150.07 155.33 L148.88 150.67 L147.63 146 L146.34 141.33 L145 136.67 L143.62 132 L142.2 127.33 L140.75 122.67 L139.27 118 L137.76 113.33 L136.24 108.67 L134.69 104 L133.14 99.33 L131.57 94.67 L130 90" stroke="#2b7b61" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="130,90 119,74 141,74" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><polygon points="130,370 119,386 141,386" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><line x1="130" y1="28" x2="130" y2="59.2" stroke="#b64f4f" stroke-width="3.5"/><polygon points="130,68 125.5,57 134.5,57" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="142" y="46" font-size="16" fill="#b64f4f" text-anchor="start"><tspan>1 kN</tspan></text><line x1="80" y1="90" x2="80" y2="370" stroke="#647780" stroke-width="1.5"/><line x1="87" y1="90" x2="73" y2="90" stroke="#647780" stroke-width="1.5"/><line x1="87" y1="370" x2="73" y2="370" stroke="#647780" stroke-width="1.5"/><text x="72" y="236" font-size="16" fill="#647780" text-anchor="end">2 m</text><line x1="330" y1="230" x2="330" y2="370" stroke="#b8c8ce" stroke-width="7"/><path d="M330 370 L330.94 367.67 L331.88 365.33 L332.82 363 L333.74 360.67 L334.66 358.33 L335.56 356 L336.45 353.67 L337.32 351.33 L338.17 349 L339 346.67 L339.8 344.33 L340.58 342 L341.33 339.67 L342.04 337.33 L342.73 335 L343.38 332.67 L343.99 330.33 L344.56 328 L345.1 325.67 L345.59 323.33 L346.04 321 L346.44 318.67 L346.8 316.33 L347.12 314 L347.39 311.67 L347.61 309.33 L347.78 307 L347.9 304.67 L347.98 302.33 L348 300 L347.98 297.67 L347.9 295.33 L347.78 293 L347.61 290.67 L347.39 288.33 L347.12 286 L346.8 283.67 L346.44 281.33 L346.04 279 L345.59 276.67 L345.1 274.33 L344.56 272 L343.99 269.67 L343.38 267.33 L342.73 265 L342.04 262.67 L341.33 260.33 L340.58 258 L339.8 255.67 L339 253.33 L338.17 251 L337.32 248.67 L336.45 246.33 L335.56 244 L334.66 241.67 L333.74 239.33 L332.82 237 L331.88 234.67 L330.94 232.33 L330 230" stroke="#2b7b61" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="330,230 319,214 341,214" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><polygon points="330,370 319,386 341,386" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><line x1="330" y1="168" x2="330" y2="199.2" stroke="#b64f4f" stroke-width="3.5"/><polygon points="330,208 325.5,197 334.5,197" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="342" y="186" font-size="16" fill="#b64f4f" text-anchor="start"><tspan>4 kN</tspan></text><line x1="280" y1="230" x2="280" y2="370" stroke="#647780" stroke-width="1.5"/><line x1="287" y1="230" x2="273" y2="230" stroke="#647780" stroke-width="1.5"/><line x1="287" y1="370" x2="273" y2="370" stroke="#647780" stroke-width="1.5"/><text x="272" y="306" font-size="16" fill="#647780" text-anchor="end">1 m</text><text x="575" y="150" font-size="17" fill="#273b45" text-anchor="middle"><tspan>P = π²EI/L²</tspan></text><text x="575" y="184" font-size="17" fill="#273b45" text-anchor="middle"><tspan>P ∝ 1/L²</tspan></text><text x="575" y="218" font-size="17" fill="#273b45" text-anchor="middle"><tspan>(2/1)² = 4</tspan></text><rect x="484" y="264" width="182" height="35" rx="7" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><text x="575" y="286" font-size="19" fill="#2b7b61" text-anchor="middle"><tspan>P = 4 × 1 = 4 kN</tspan></text></g></svg>