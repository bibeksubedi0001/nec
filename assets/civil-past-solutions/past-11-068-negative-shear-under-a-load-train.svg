<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Greatest negative shear at 8 m on a 24 m beam under a load train</title><desc id="desc">The shear influence line at 8 m is -x/24 to the left of the section. With the 10 kN load at the section and the 15, 15 and 8 kN loads 2, 4 and 6 m behind it, SF = -(10 x 8 + 15 x 6 + 15 x 4 + 8 x 2)/24 = -10.25 kN.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="60" y1="110" x2="480" y2="110" stroke="#273b45" stroke-width="6"/><polygon points="60,115 45,139 75,139" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><line x1="38" y1="142" x2="82" y2="142" stroke="#647780" stroke-width="2"/><polygon points="480,115 465,136 495,136" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><circle cx="472" cy="142" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><circle cx="488" cy="142" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><line x1="458" y1="149" x2="502" y2="149" stroke="#647780" stroke-width="2"/><line x1="95" y1="62" x2="95" y2="97.2" stroke="#b64f4f" stroke-width="3"/><polygon points="95,106 90.5,95 99.5,95" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="95" y="54" font-size="14" fill="#b64f4f" text-anchor="middle"><tspan>8</tspan></text><line x1="130" y1="62" x2="130" y2="97.2" stroke="#b64f4f" stroke-width="3"/><polygon points="130,106 125.5,95 134.5,95" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="130" y="54" font-size="14" fill="#b64f4f" text-anchor="middle"><tspan>15</tspan></text><line x1="165" y1="62" x2="165" y2="97.2" stroke="#b64f4f" stroke-width="3"/><polygon points="165,106 160.5,95 169.5,95" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="165" y="54" font-size="14" fill="#b64f4f" text-anchor="middle"><tspan>15</tspan></text><line x1="200" y1="62" x2="200" y2="97.2" stroke="#b64f4f" stroke-width="3"/><polygon points="200,106 195.5,95 204.5,95" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="200" y="54" font-size="14" fill="#b64f4f" text-anchor="middle"><tspan>10 kN</tspan></text><line x1="200" y1="100" x2="200" y2="360" stroke="#647780" stroke-width="1.2" stroke-dasharray="5 4"/><text x="206" y="140" font-size="13" fill="#647780" text-anchor="start"><tspan>section, 8 m</tspan></text><polygon points="60,270 60,270 200,320 200,270" fill="#f2dfdf" stroke="none" stroke-width="2" stroke-linejoin="round"/><path d="M60 270 L200 320" stroke="#b64f4f" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="60" y1="270" x2="200" y2="270" stroke="#273b45" stroke-width="1.5"/><text x="48" y="275" font-size="14" fill="#647780" text-anchor="end"><tspan>ILD S</tspan></text><polygon points="200,270 200,170 480,270 480,270" fill="#e6f1f8" stroke="none" stroke-width="2" stroke-linejoin="round"/><path d="M200 170 L480 270" stroke="#287aab" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="200" y1="270" x2="480" y2="270" stroke="#273b45" stroke-width="1.5"/><line x1="200" y1="170" x2="200" y2="320" stroke="#287aab" stroke-width="2"/><line x1="95" y1="270" x2="95" y2="282.5" stroke="#b64f4f" stroke-width="2"/><text x="95" y="300.5" font-size="13" fill="#b64f4f" text-anchor="middle"><tspan>−1/12</tspan></text><line x1="130" y1="270" x2="130" y2="295" stroke="#b64f4f" stroke-width="2"/><text x="130" y="313" font-size="13" fill="#b64f4f" text-anchor="middle"><tspan>−1/6</tspan></text><line x1="165" y1="270" x2="165" y2="307.5" stroke="#b64f4f" stroke-width="2"/><text x="165" y="325.5" font-size="13" fill="#b64f4f" text-anchor="middle"><tspan>−1/4</tspan></text><line x1="200" y1="270" x2="200" y2="320" stroke="#b64f4f" stroke-width="2"/><text x="194" y="338" font-size="13" fill="#b64f4f" text-anchor="end"><tspan>−1/3</tspan></text><text x="194" y="180" font-size="13" fill="#287aab" text-anchor="end"><tspan>+2/3</tspan></text><text x="590" y="150" font-size="16" fill="#273b45" text-anchor="middle"><tspan>SF = −(10×8 + 15×6</tspan></text><text x="590" y="180" font-size="16" fill="#273b45" text-anchor="middle"><tspan>+ 15×4 + 8×2)/24</tspan></text><text x="590" y="210" font-size="16" fill="#273b45" text-anchor="middle"><tspan>= −246/24</tspan></text><rect x="508.5" y="250" width="163" height="35" rx="7" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><text x="590" y="272" font-size="19" fill="#2b7b61" text-anchor="middle"><tspan>SF = −10.25 kN</tspan></text></g></svg>