<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Three bars from one joint to three hinged supports</title><desc id="desc">The truss has m = 3 members and j = 4 joints, and each of the three hinges gives 2 reactions, r = 6. Ds = m + r - 2j = 3 + 6 - 8 = 1, so one bar is redundant: two bars alone would hold the joint.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="250" y1="130" x2="80" y2="320" stroke="#466d89" stroke-width="5"/><line x1="250" y1="130" x2="250" y2="320" stroke="#466d89" stroke-width="5"/><line x1="250" y1="130" x2="420" y2="320" stroke="#466d89" stroke-width="5"/><circle cx="250" cy="130" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><polygon points="80,323 65,347 95,347" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><line x1="58" y1="350" x2="102" y2="350" stroke="#647780" stroke-width="2"/><polygon points="250,323 235,347 265,347" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><line x1="228" y1="350" x2="272" y2="350" stroke="#647780" stroke-width="2"/><polygon points="420,323 405,347 435,347" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><line x1="398" y1="350" x2="442" y2="350" stroke="#647780" stroke-width="2"/><line x1="250" y1="64" x2="250" y2="111.2" stroke="#b64f4f" stroke-width="3.5"/><polygon points="250,120 245.5,109 254.5,109" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="260" y="76" font-size="16" fill="#b64f4f" text-anchor="start"><tspan>P</tspan></text><text x="80" y="378" font-size="13" fill="#287aab" text-anchor="middle"><tspan>2 reactions</tspan></text><text x="250" y="378" font-size="13" fill="#287aab" text-anchor="middle"><tspan>2 reactions</tspan></text><text x="420" y="378" font-size="13" fill="#287aab" text-anchor="middle"><tspan>2 reactions</tspan></text><text x="250" y="402" font-size="14" fill="#647780" text-anchor="middle"><tspan>m = 3, r = 6, j = 4</tspan></text><text x="585" y="150" font-size="17" fill="#273b45" text-anchor="middle"><tspan>D</tspan><tspan dy="5" font-size="12">s</tspan><tspan dy="-5"> = m + r − 2j</tspan></text><text x="585" y="184" font-size="17" fill="#273b45" text-anchor="middle"><tspan>= 3 + 6 − 8</tspan></text><rect x="541.5" y="240" width="87" height="35" rx="7" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><text x="585" y="262" font-size="19" fill="#2b7b61" text-anchor="middle"><tspan>D</tspan><tspan dy="5" font-size="14">s</tspan><tspan dy="-5"> = 1</tspan></text></g></svg>