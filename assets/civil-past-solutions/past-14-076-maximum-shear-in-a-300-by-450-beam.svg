<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Maximum shear stress in a 300 x 450 mm beam carrying 50 kN</title><desc id="desc">The average shear stress is V/bd = 50000/(300 x 450) = 0.370 N/mm2. In a rectangle the shear stress is parabolic with its peak at the neutral axis equal to 1.5 times the average: 0.556 N/mm2.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><rect x="70" y="110" width="100" height="150" fill="#d6dfe3" stroke="#273b45" stroke-width="2"/><line x1="70" y1="280" x2="170" y2="280" stroke="#647780" stroke-width="1.5"/><line x1="70" y1="273" x2="70" y2="287" stroke="#647780" stroke-width="1.5"/><line x1="170" y1="273" x2="170" y2="287" stroke="#647780" stroke-width="1.5"/><text x="120" y="306" font-size="14" fill="#647780" text-anchor="middle">300</text><line x1="46" y1="110" x2="46" y2="260" stroke="#647780" stroke-width="1.5"/><line x1="53" y1="110" x2="39" y2="110" stroke="#647780" stroke-width="1.5"/><line x1="53" y1="260" x2="39" y2="260" stroke="#647780" stroke-width="1.5"/><text x="40" y="191" font-size="14" fill="#647780" text-anchor="end">450</text><line x1="60" y1="185" x2="200" y2="185" stroke="#647780" stroke-width="1.2" stroke-dasharray="6 4"/><polygon points="210,110 210,110 220.73,113.75 230.9,117.5 240.53,121.25 249.6,125 258.13,128.75 266.1,132.5 273.52,136.25 280.4,140 286.73,143.75 292.5,147.5 297.73,151.25 302.4,155 306.52,158.75 310.1,162.5 313.13,166.25 315.6,170 317.52,173.75 318.9,177.5 319.73,181.25 320,185 319.73,188.75 318.9,192.5 317.52,196.25 315.6,200 313.13,203.75 310.1,207.5 306.52,211.25 302.4,215 297.73,218.75 292.5,222.5 286.73,226.25 280.4,230 273.52,233.75 266.1,237.5 258.13,241.25 249.6,245 240.53,248.75 230.9,252.5 220.73,256.25 210,260 210,260" fill="#deeee6" stroke="#2b7b61" stroke-width="2" stroke-linejoin="round"/><line x1="210" y1="110" x2="283" y2="110" stroke="#287aab" stroke-width="1.5" stroke-dasharray="4 4"/><line x1="283" y1="110" x2="283" y2="260" stroke="#287aab" stroke-width="1.5" stroke-dasharray="4 4"/><text x="326" y="190" font-size="16" fill="#2b7b61" text-anchor="start"><tspan>0.556</tspan></text><text x="288" y="276" font-size="14" fill="#287aab" text-anchor="start"><tspan>average 0.370</tspan></text><text x="560" y="140" font-size="16" fill="#273b45" text-anchor="middle"><tspan>τ</tspan><tspan dy="4" font-size="12">avg</tspan><tspan dy="-4"> = 50000/(300 × 450)</tspan></text><text x="560" y="172" font-size="16" fill="#273b45" text-anchor="middle"><tspan>= 0.370 N/mm²</tspan></text><text x="560" y="204" font-size="16" fill="#273b45" text-anchor="middle"><tspan>τ</tspan><tspan dy="4" font-size="12">max</tspan><tspan dy="-4"> = 1.5 τ</tspan><tspan dy="4" font-size="12">avg</tspan></text><rect x="459.5" y="240" width="201" height="35" rx="7" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><text x="560" y="262" font-size="19" fill="#2b7b61" text-anchor="middle"><tspan>τ</tspan><tspan dy="5" font-size="14">max</tspan><tspan dy="-5"> = 0.556 N/mm²</tspan></text></g></svg>