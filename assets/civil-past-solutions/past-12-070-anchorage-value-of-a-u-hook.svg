<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Anchorage value of a standard U-hook and a 90 degree bend</title><desc id="desc">IS 456 credits a standard U-type (180 degree) hook with an anchorage value of 16 bar diameters and a 90 degree bend with 8 diameters. For a 20 mm bar the U-hook is worth 16 x 20 = 320 mm of straight bar.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="60" y1="150" x2="250" y2="150" stroke="#466d89" stroke-width="8"/><path d="M250 150 A25 25 0 0 1 250 200" stroke="#466d89" stroke-width="8" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="250" y1="200" x2="210" y2="200" stroke="#466d89" stroke-width="8"/><line x1="250" y1="150" x2="410" y2="150" stroke="#2b7b61" stroke-width="3" stroke-dasharray="8 6"/><line x1="250" y1="126" x2="410" y2="126" stroke="#647780" stroke-width="1.5"/><line x1="250" y1="119" x2="250" y2="133" stroke="#647780" stroke-width="1.5"/><line x1="410" y1="119" x2="410" y2="133" stroke="#647780" stroke-width="1.5"/><text x="330" y="116" font-size="16" fill="#2b7b61" text-anchor="middle">16φ</text><text x="130" y="130" font-size="15" fill="#273b45" text-anchor="middle"><tspan>U-hook (180°)</tspan></text><line x1="60" y1="300" x2="250" y2="300" stroke="#466d89" stroke-width="8"/><path d="M250 300 A25 25 0 0 1 275 325" stroke="#466d89" stroke-width="8" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="275" y1="325" x2="275" y2="365" stroke="#466d89" stroke-width="8"/><line x1="250" y1="300" x2="330" y2="300" stroke="#2b7b61" stroke-width="3" stroke-dasharray="8 6"/><line x1="250" y1="276" x2="330" y2="276" stroke="#647780" stroke-width="1.5"/><line x1="250" y1="269" x2="250" y2="283" stroke="#647780" stroke-width="1.5"/><line x1="330" y1="269" x2="330" y2="283" stroke="#647780" stroke-width="1.5"/><text x="290" y="266" font-size="16" fill="#2b7b61" text-anchor="middle">8φ</text><text x="130" y="280" font-size="15" fill="#273b45" text-anchor="middle"><tspan>90° bend</tspan></text><text x="585" y="140" font-size="17" fill="#273b45" text-anchor="middle"><tspan>U-hook: 16φ</tspan></text><text x="585" y="172" font-size="17" fill="#273b45" text-anchor="middle"><tspan>90° bend: 8φ</tspan></text><text x="585" y="204" font-size="17" fill="#273b45" text-anchor="middle"><tspan>φ = 20 mm: 16 × 20</tspan></text><rect x="513" y="250" width="144" height="35" rx="7" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><text x="585" y="272" font-size="19" fill="#2b7b61" text-anchor="middle"><tspan>16φ = 320 mm</tspan></text></g></svg>