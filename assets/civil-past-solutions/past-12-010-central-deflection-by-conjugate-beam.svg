<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Central deflection of a simple beam by the conjugate beam</title><desc id="desc">Load the conjugate beam with the M/EI triangle of peak PL/4EI. Each support reaction is half its area, PL squared/16EI. The moment of the conjugate beam at mid-span is PL squared/16EI x L/2 minus PL squared/16EI x L/6, which is PL cubed/48EI.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="70" y1="100" x2="430" y2="100" stroke="#647780" stroke-width="1.5" stroke-dasharray="6 5"/><path d="M70 100 L76 101.8 L82 103.59 L88 105.38 L94 107.16 L100 108.92 L106 110.66 L112 112.37 L118 114.06 L124 115.71 L130 117.33 L136 118.91 L142 120.45 L148 121.94 L154 123.37 L160 124.75 L166 126.07 L172 127.32 L178 128.51 L184 129.63 L190 130.67 L196 131.63 L202 132.5 L208 133.29 L214 133.98 L220 134.58 L226 135.08 L232 135.48 L238 135.77 L244 135.94 L250 136 L256 135.94 L262 135.77 L268 135.48 L274 135.08 L280 134.58 L286 133.98 L292 133.29 L298 132.5 L304 131.63 L310 130.67 L316 129.63 L322 128.51 L328 127.32 L334 126.07 L340 124.75 L346 123.37 L352 121.94 L358 120.45 L364 118.91 L370 117.33 L376 115.71 L382 114.06 L388 112.37 L394 110.66 L400 108.92 L406 107.16 L412 105.38 L418 103.59 L424 101.8 L430 100" stroke="#287aab" stroke-width="4.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="70,105 55,129 85,129" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><line x1="48" y1="132" x2="92" y2="132" stroke="#647780" stroke-width="2"/><polygon points="430,105 415,126 445,126" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><circle cx="422" cy="132" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><circle cx="438" cy="132" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><line x1="408" y1="139" x2="452" y2="139" stroke="#647780" stroke-width="2"/><line x1="250" y1="92" x2="250" y2="123.2" stroke="#b64f4f" stroke-width="3.5"/><polygon points="250,132 245.5,121 254.5,121" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="250" y="82" font-size="16" fill="#b64f4f" text-anchor="middle">P</text><polygon points="70,300 250,210 430,300" fill="#f2dfdf" stroke="#b64f4f" stroke-width="2" stroke-linejoin="round"/><line x1="70" y1="300" x2="430" y2="300" stroke="#273b45" stroke-width="1.5"/><text x="250" y="200" font-size="14" fill="#b64f4f" text-anchor="middle"><tspan>PL/4EI</tspan></text><text x="170" y="290" font-size="13" fill="#b64f4f" text-anchor="middle"><tspan>PL²/16EI</tspan></text><circle cx="190" cy="270" r="3.5" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><line x1="190" y1="330" x2="250" y2="330" stroke="#647780" stroke-width="1.5"/><line x1="190" y1="323" x2="190" y2="337" stroke="#647780" stroke-width="1.5"/><line x1="250" y1="323" x2="250" y2="337" stroke="#647780" stroke-width="1.5"/><text x="220" y="356" font-size="13" fill="#647780" text-anchor="middle">L/6</text><line x1="70" y1="350" x2="70" y2="322.8" stroke="#287aab" stroke-width="2.5"/><polygon points="70,314 74.5,325 65.5,325" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><text x="80" y="350" font-size="13" fill="#287aab" text-anchor="start"><tspan>R′</tspan><tspan dy="4" font-size="9">A</tspan><tspan dy="-4"> = PL²/16EI</tspan></text><text x="585" y="140" font-size="15" fill="#273b45" text-anchor="middle"><tspan>δ = R′</tspan><tspan dy="4" font-size="11">A</tspan><tspan dy="-4">(L/2) − (PL²/16EI)(L/6)</tspan></text><text x="585" y="174" font-size="15" fill="#273b45" text-anchor="middle"><tspan>= PL³/32EI − PL³/96EI</tspan></text><rect x="513" y="240" width="144" height="35" rx="7" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><text x="585" y="262" font-size="19" fill="#2b7b61" text-anchor="middle"><tspan>δ = PL³/48EI</tspan></text></g></svg>