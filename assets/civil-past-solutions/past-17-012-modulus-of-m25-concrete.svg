<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Short-term modulus of elasticity of M25 concrete</title><desc id="desc">IS 456 gives the short-term static modulus of concrete as Ec = 5000√fck, the slope of the early part of the stress-strain curve. For M25, Ec = 5000 x √25 = 5000 x 5 = 25 000 N/mm squared.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="70" y1="340" x2="431.2" y2="340" stroke="#273b45" stroke-width="1.6"/><polygon points="440,340 429,344.5 429,335.5" fill="#273b45" stroke="#273b45" stroke-width="1.5" stroke-linejoin="round"/><line x1="70" y1="340" x2="70" y2="118.8" stroke="#273b45" stroke-width="1.6"/><polygon points="70,110 74.5,121 65.5,121" fill="#273b45" stroke="#273b45" stroke-width="1.5" stroke-linejoin="round"/><text x="440" y="384" font-size="14" fill="#647780" text-anchor="end"><tspan>strain</tspan></text><text x="80" y="118" font-size="14" fill="#647780" text-anchor="start"><tspan>stress</tspan></text><path d="M70 340 L73.6 333.06 L77.2 326.25 L80.8 319.55 L84.4 312.98 L88 306.53 L91.6 300.21 L95.2 294 L98.8 287.92 L102.4 281.96 L106 276.13 L109.6 270.41 L113.2 264.82 L116.8 259.35 L120.4 254.01 L124 248.78 L127.6 243.68 L131.2 238.7 L134.8 233.85 L138.4 229.11 L142 224.5 L145.6 220.01 L149.2 215.65 L152.8 211.4 L156.4 207.28 L160 203.28 L163.6 199.41 L167.2 195.65 L170.8 192.02 L174.4 188.51 L178 185.13 L181.6 181.86 L185.2 178.72 L188.8 175.7 L192.4 172.8 L196 170.03 L199.6 167.38 L203.2 164.85 L206.8 162.45 L210.4 160.16 L214 158 L217.6 155.96 L221.2 154.04 L224.8 152.25 L228.4 150.58 L232 149.03 L235.6 147.6 L239.2 146.3 L242.8 145.12 L246.4 144.06 L250 143.13 L253.6 142.31 L257.2 141.62 L260.8 141.05 L264.4 140.61 L268 140.28 L271.6 140.08 L275.2 140 L278.8 140 L282.4 140 L286 140 L289.6 140 L293.2 140 L296.8 140 L300.4 140 L304 140 L307.6 140 L311.2 140 L314.8 140 L318.4 140 L322 140 L325.6 140 L329.2 140 L332.8 140 L336.4 140 L340 140 L343.6 140 L347.2 140 L350.8 140 L354.4 140 L358 140 L361.6 140 L365.2 140 L368.8 140 L372.4 140 L376 140 L379.6 140 L383.2 140 L386.8 140 L390.4 140 L394 140 L397.6 140 L401.2 140 L404.8 140 L408.4 140 L412 140 L415.6 140 L419.2 140 L422.8 140 L426.4 140 L430 140" stroke="#287aab" stroke-width="3.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="70" y1="340" x2="180" y2="150" stroke="#b64f4f" stroke-width="2.5"/><text x="132" y="262" font-size="17" fill="#b64f4f" text-anchor="start"><tspan>E</tspan><tspan dy="5" font-size="12">c</tspan></text><line x1="275.71" y1="140" x2="275.71" y2="340" stroke="#647780" stroke-width="1" stroke-dasharray="4 4"/><text x="275.71" y="360" font-size="13" fill="#647780" text-anchor="middle"><tspan>0.002</tspan></text><text x="430" y="360" font-size="13" fill="#647780" text-anchor="middle"><tspan>0.0035</tspan></text><text x="585" y="150" font-size="17" fill="#273b45" text-anchor="middle"><tspan>E</tspan><tspan dy="5" font-size="12">c</tspan><tspan dy="-5"> = 5000√f</tspan><tspan dy="5" font-size="12">ck</tspan></text><text x="585" y="184" font-size="17" fill="#273b45" text-anchor="middle"><tspan>= 5000 × √25 = 5000 × 5</tspan></text><rect x="493.5" y="241" width="183" height="34" rx="7" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><text x="585" y="262" font-size="18" fill="#2b7b61" text-anchor="middle"><tspan>E</tspan><tspan dy="5" font-size="13">c</tspan><tspan dy="-5"> = 25 000 N/mm²</tspan></text></g></svg>