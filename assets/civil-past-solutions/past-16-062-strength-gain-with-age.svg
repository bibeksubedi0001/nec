<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Strength gain of M20 concrete with age</title><desc id="desc">Ordinary Portland cement concrete gains about 40 percent of its 28-day strength in 3 days and about 65 percent in 7 days. For M20 the 7-day cube strength is therefore about 0.65 x 20 = 13 MPa.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="70" y1="340" x2="431.2" y2="340" stroke="#273b45" stroke-width="1.6"/><polygon points="440,340 429,344.5 429,335.5" fill="#273b45" stroke="#273b45" stroke-width="1.5" stroke-linejoin="round"/><line x1="70" y1="340" x2="70" y2="108.8" stroke="#273b45" stroke-width="1.6"/><polygon points="70,100 74.5,111 65.5,111" fill="#273b45" stroke="#273b45" stroke-width="1.5" stroke-linejoin="round"/><text x="440" y="384" font-size="14" fill="#647780" text-anchor="end"><tspan>age, days</tspan></text><text x="80" y="108" font-size="14" fill="#647780" text-anchor="start"><tspan>cube strength, MPa</tspan></text><path d="M70 340 L73.4 329.34 L76.8 319.58 L80.2 310.6 L83.6 302.32 L87 294.65 L90.4 287.54 L93.8 280.91 L97.2 274.73 L100.6 268.95 L104 263.53 L107.4 258.44 L110.8 253.66 L114.2 249.14 L117.6 244.88 L121 240.85 L124.4 237.03 L127.8 233.41 L131.2 229.97 L134.6 226.7 L138 223.59 L141.4 220.62 L144.8 217.78 L148.2 215.07 L151.6 212.48 L155 210 L158.4 207.63 L161.8 205.35 L165.2 203.16 L168.6 201.06 L172 199.04 L175.4 197.1 L178.8 195.22 L182.2 193.42 L185.6 191.68 L189 190 L192.4 188.38 L195.8 186.82 L199.2 185.31 L202.6 183.84 L206 182.43 L209.4 181.06 L212.8 179.73 L216.2 178.44 L219.6 177.19 L223 175.98 L226.4 174.81 L229.8 173.67 L233.2 172.56 L236.6 171.48 L240 170.44 L243.4 169.42 L246.8 168.43 L250.2 167.46 L253.6 166.53 L257 165.61 L260.4 164.72 L263.8 163.85 L267.2 163.01 L270.6 162.18 L274 161.38 L277.4 160.59 L280.8 159.82 L284.2 159.07 L287.6 158.34 L291 157.63 L294.4 156.93 L297.8 156.25 L301.2 155.58 L304.6 154.93 L308 154.29 L311.4 153.66 L314.8 153.05 L318.2 152.45 L321.6 151.87 L325 151.29 L328.4 150.73 L331.8 150.18 L335.2 149.64 L338.6 149.11 L342 148.59 L345.4 148.08 L348.8 147.58 L352.2 147.09 L355.6 146.61 L359 146.14 L362.4 145.68 L365.8 145.22 L369.2 144.78 L372.6 144.34 L376 143.91 L379.4 143.49 L382.8 143.07 L386.2 142.67 L389.6 142.27 L393 141.87 L396.4 141.48 L399.8 141.1 L403.2 140.73 L406.6 140.36 L410 140" stroke="#287aab" stroke-width="3.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="155" y1="340" x2="155" y2="210" stroke="#647780" stroke-width="1.2" stroke-dasharray="5 4"/><line x1="70" y1="210" x2="155" y2="210" stroke="#647780" stroke-width="1.2" stroke-dasharray="5 4"/><line x1="70" y1="140" x2="410" y2="140" stroke="#647780" stroke-width="1.2" stroke-dasharray="5 4"/><circle cx="155" cy="210" r="5.5" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><circle cx="410" cy="140" r="5" fill="#287aab" stroke="#287aab" stroke-width="2"/><text x="155" y="360" font-size="14" fill="#273b45" text-anchor="middle"><tspan>7</tspan></text><text x="410" y="360" font-size="14" fill="#273b45" text-anchor="middle"><tspan>28</tspan></text><text x="62" y="215" font-size="14" fill="#273b45" text-anchor="end"><tspan>13</tspan></text><text x="62" y="145" font-size="14" fill="#273b45" text-anchor="end"><tspan>20</tspan></text><text x="169" y="236" font-size="14" fill="#b64f4f" text-anchor="start"><tspan>7 days: about 65%</tspan></text><text x="410" y="128" font-size="14" fill="#287aab" text-anchor="end"><tspan>28 days: f</tspan><tspan dy="4" font-size="10">ck</tspan><tspan dy="-4"> = 20</tspan></text><text x="585" y="150" font-size="17" fill="#273b45" text-anchor="middle"><tspan>7 days ≈ 0.65 f</tspan><tspan dy="5" font-size="12">ck</tspan></text><text x="585" y="184" font-size="17" fill="#273b45" text-anchor="middle"><tspan>0.65 × 20 = 13</tspan></text><rect x="513" y="240" width