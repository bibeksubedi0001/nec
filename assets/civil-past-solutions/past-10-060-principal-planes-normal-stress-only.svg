<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">On principal planes only normal stresses act</title><desc id="desc">Rotating a stressed element through θp, with tan 2θp = 2τxy/(σx - σy), removes all the shear from its faces. The principal planes then carry only the normal principal stresses σ1 and σ2.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><rect x="102" y="122" width="96" height="96" fill="#e6f1f8" stroke="#273b45" stroke-width="2"/><line x1="202" y1="170" x2="227.2" y2="170" stroke="#b64f4f" stroke-width="3"/><polygon points="236,170 225,174.5 225,165.5" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><line x1="98" y1="170" x2="72.8" y2="170" stroke="#b64f4f" stroke-width="3"/><polygon points="64,170 75,165.5 75,174.5" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="242" y="176" font-size="16" fill="#b64f4f" text-anchor="start"><tspan>σ</tspan><tspan dy="4" font-size="12">x</tspan></text><line x1="150" y1="118" x2="150" y2="92.8" stroke="#b64f4f" stroke-width="3"/><polygon points="150,84 154.5,95 145.5,95" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><line x1="150" y1="222" x2="150" y2="247.2" stroke="#b64f4f" stroke-width="3"/><polygon points="150,256 145.5,245 154.5,245" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="160" y="90" font-size="16" fill="#b64f4f" text-anchor="start"><tspan>σ</tspan><tspan dy="4" font-size="12">y</tspan></text><line x1="110" y1="112" x2="182.8" y2="112" stroke="#2b7b61" stroke-width="2.5"/><polygon points="190,112 181,116 181,108" fill="#2b7b61" stroke="#2b7b61" stroke-width="1.5" stroke-linejoin="round"/><line x1="190" y1="228" x2="117.2" y2="228" stroke="#2b7b61" stroke-width="2.5"/><polygon points="110,228 119,224 119,232" fill="#2b7b61" stroke="#2b7b61" stroke-width="1.5" stroke-linejoin="round"/><line x1="208" y1="210" x2="208" y2="137.2" stroke="#2b7b61" stroke-width="2.5"/><polygon points="208,130 212,139 204,139" fill="#2b7b61" stroke="#2b7b61" stroke-width="1.5" stroke-linejoin="round"/><line x1="92" y1="130" x2="92" y2="202.8" stroke="#2b7b61" stroke-width="2.5"/><polygon points="92,210 88,201 96,201" fill="#2b7b61" stroke="#2b7b61" stroke-width="1.5" stroke-linejoin="round"/><text x="86" y="114" font-size="15" fill="#2b7b61" text-anchor="end"><tspan>τ</tspan><tspan dy="4" font-size="11">xy</tspan></text><text x="150" y="330" font-size="15" fill="#647780" text-anchor="middle">general element</text><line x1="290" y1="170" x2="351.2" y2="170" stroke="#647780" stroke-width="2.5"/><polygon points="360,170 349,174.5 349,165.5" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><text x="325" y="156" font-size="14" fill="#647780" text-anchor="middle"><tspan>rotate θ</tspan><tspan dy="4" font-size="10">p</tspan></text><polygon points="436.21,146.78 523.22,106.21 563.79,193.22 476.78,233.79" fill="#e6f1f8" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><line x1="547.13" y1="148.02" x2="579.03" y2="133.15" stroke="#b64f4f" stroke-width="3"/><polygon points="587.01,129.43 578.94,138.16 575.13,130" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><line x1="452.87" y1="191.98" x2="420.97" y2="206.85" stroke="#b64f4f" stroke-width="3"/><polygon points="412.99,210.57 421.06,201.84 424.87,210" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><line x1="478.02" y1="122.87" x2="467.37" y2="100.03" stroke="#b64f4f" stroke-width="3"/><polygon points="463.65,92.06 472.38,100.13 464.23,103.93" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><line x1="521.98" y1="217.13" x2="532.63" y2="239.97" stroke="#b64f4f" stroke-width="3"/><polygon points="536.35,247.94 527.62,239.87 535.77,236.07" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="601.02" y="140.55" font-size="17" fill="#b64f4f" text-anchor="start"><tspan>σ</tspan><tspan dy="5" font-size="12">1</tspan></text><text x="477.43" y="79.01" font-size="17" fill="#b64f4f" text-anchor="start"><tspan>σ</tspan><tspan dy="5" font-size="12">2</tspan></text><text x="500" y="330" font-size="15" fill="#647780" text-anchor="middle">principal element: no shear</text><rect x="250" y="368" width="220" height="35" rx="7" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><text x="360" y="390" font-size="19" fill="#2b7b61" text-anchor="middle"><tspan>normal stresses only</tspan></text></g></svg>