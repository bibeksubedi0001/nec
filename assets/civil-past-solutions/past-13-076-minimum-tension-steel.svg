<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Minimum tension steel for a 250 x 400 mm beam in Fe415</title><desc id="desc">IS 456 requires the tension steel to satisfy As/bd of at least 0.85/fy. For b = 250 mm, d = 400 mm and fy = 415 N/mm squared, As,min = 0.85 x 250 x 400/415, about 205 mm squared.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><rect x="140" y="100" width="125" height="225" fill="#e4e8e9" stroke="#273b45" stroke-width="2.5"/><rect x="151" y="111" width="103" height="203" rx="6" fill="none" stroke="#466d89" stroke-width="2"/><circle cx="163" cy="300" r="7" fill="#466d89" stroke="#273b45" stroke-width="1.2"/><circle cx="202.5" cy="300" r="7" fill="#466d89" stroke="#273b45" stroke-width="1.2"/><circle cx="242" cy="300" r="7" fill="#466d89" stroke="#273b45" stroke-width="1.2"/><circle cx="163" cy="124" r="5" fill="#466d89" stroke="#273b45" stroke-width="1.2"/><circle cx="242" cy="124" r="5" fill="#466d89" stroke="#273b45" stroke-width="1.2"/><line x1="140" y1="82" x2="265" y2="82" stroke="#647780" stroke-width="1.5"/><line x1="140" y1="75" x2="140" y2="89" stroke="#647780" stroke-width="1.5"/><line x1="265" y1="75" x2="265" y2="89" stroke="#647780" stroke-width="1.5"/><text x="202.5" y="72" font-size="14" fill="#647780" text-anchor="middle">b = 250 mm</text><line x1="300" y1="100" x2="300" y2="300" stroke="#647780" stroke-width="1.5"/><line x1="307" y1="100" x2="293" y2="100" stroke="#647780" stroke-width="1.5"/><line x1="307" y1="300" x2="293" y2="300" stroke="#647780" stroke-width="1.5"/><text x="310" y="206" font-size="14" fill="#647780" text-anchor="start">d = 400 mm</text><line x1="265" y1="300" x2="306" y2="300" stroke="#647780" stroke-width="1" stroke-dasharray="3 3"/><text x="202.5" y="352" font-size="14" fill="#466d89" text-anchor="middle"><tspan>tension steel A</tspan><tspan dy="4" font-size="10">s</tspan><tspan dy="-4">, Fe415</tspan></text><text x="585" y="150" font-size="17" fill="#273b45" text-anchor="middle"><tspan>A</tspan><tspan dy="5" font-size="12">s,min</tspan><tspan dy="-5"> = 0.85bd/f</tspan><tspan dy="5" font-size="12">y</tspan></text><text x="585" y="184" font-size="17" fill="#273b45" text-anchor="middle"><tspan>= 0.85 × 250 × 400/415</tspan></text><rect x="513" y="240" width="144" height="35" rx="7" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><text x="585" y="262" font-size="19" fill="#2b7b61" text-anchor="middle"><tspan>A</tspan><tspan dy="5" font-size="14">s</tspan><tspan dy="-5"> ≈ 205 mm²</tspan></text></g></svg>