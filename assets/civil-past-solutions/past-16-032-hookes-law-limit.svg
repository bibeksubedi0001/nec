<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Hooke's law holds up to the limit of proportionality</title><desc id="desc">Stress is proportional to strain, σ = Eε, only along the straight first part of the curve, which ends at the limit of proportionality. The elastic limit may lie a little beyond it, and yielding follows.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="80" y1="360" x2="631.2" y2="360" stroke="#273b45" stroke-width="1.8"/><polygon points="640,360 629,364.5 629,355.5" fill="#273b45" stroke="#273b45" stroke-width="1.5" stroke-linejoin="round"/><line x1="80" y1="360" x2="80" y2="78.8" stroke="#273b45" stroke-width="1.8"/><polygon points="80,70 84.5,81 75.5,81" fill="#273b45" stroke="#273b45" stroke-width="1.5" stroke-linejoin="round"/><text x="636" y="382" font-size="14" fill="#647780" text-anchor="end"><tspan>strain</tspan></text><text x="72" y="90" font-size="14" fill="#647780" text-anchor="end"><tspan>stress</tspan></text><path d="M80 360 L260 129 L288.8 114.3 L317.6 99.6 L339.2 133.2 L440 131.1 L584 129" stroke="#287aab" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="80" y1="360" x2="260" y2="129" stroke="#2b7b61" stroke-width="6"/><circle cx="260" cy="129" r="4.5" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><text x="250" y="134" font-size="14" fill="#647780" text-anchor="end"><tspan>limit of proportionality</tspan></text><circle cx="288.8" cy="114.3" r="4.5" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><text x="278.8" y="103.3" font-size="14" fill="#647780" text-anchor="end"><tspan>elastic limit</tspan></text><circle cx="317.6" cy="99.6" r="4.5" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><text x="327.6" y="96.6" font-size="14" fill="#647780" text-anchor="start"><tspan>yield point</tspan></text><text x="188" y="259.2" font-size="17" fill="#2b7b61" text-anchor="start"><tspan>σ = Eε</tspan></text><rect x="319" y="311" width="302" height="32" rx="7" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><text x="470" y="330" font-size="16" fill="#2b7b61" text-anchor="middle"><tspan>up to the limit of proportionality</tspan></text></g></svg>