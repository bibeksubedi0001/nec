<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Major principal stress for 80 and 60 N/mm2 with 20 N/mm2 shear</title><desc id="desc">The centre of Mohr's circle is (80 + 60)/2 = 70 and its radius root(10 squared + 20 squared) = 22.36 N/mm2, so the major principal stress is 70 + 22.36 = 92.36 N/mm2.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><rect x="58" y="106" width="68" height="68" fill="#e6f1f8" stroke="#273b45" stroke-width="2"/><line x1="130" y1="140" x2="147.2" y2="140" stroke="#b64f4f" stroke-width="3"/><polygon points="156,140 145,144.5 145,135.5" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><line x1="54" y1="140" x2="36.8" y2="140" stroke="#b64f4f" stroke-width="3"/><polygon points="28,140 39,135.5 39,144.5" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="162" y="146" font-size="16" fill="#b64f4f" text-anchor="start"><tspan>80</tspan></text><line x1="92" y1="102" x2="92" y2="84.8" stroke="#b64f4f" stroke-width="3"/><polygon points="92,76 96.5,87 87.5,87" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><line x1="92" y1="178" x2="92" y2="195.2" stroke="#b64f4f" stroke-width="3"/><polygon points="92,204 87.5,193 96.5,193" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="102" y="82" font-size="16" fill="#b64f4f" text-anchor="start"><tspan>60</tspan></text><line x1="66" y1="96" x2="110.8" y2="96" stroke="#2b7b61" stroke-width="2.5"/><polygon points="118,96 109,100 109,92" fill="#2b7b61" stroke="#2b7b61" stroke-width="1.5" stroke-linejoin="round"/><line x1="118" y1="184" x2="73.2" y2="184" stroke="#2b7b61" stroke-width="2.5"/><polygon points="66,184 75,180 75,188" fill="#2b7b61" stroke="#2b7b61" stroke-width="1.5" stroke-linejoin="round"/><line x1="136" y1="166" x2="136" y2="121.2" stroke="#2b7b61" stroke-width="2.5"/><polygon points="136,114 140,123 132,123" fill="#2b7b61" stroke="#2b7b61" stroke-width="1.5" stroke-linejoin="round"/><line x1="48" y1="114" x2="48" y2="158.8" stroke="#2b7b61" stroke-width="2.5"/><polygon points="48,166 44,157 52,157" fill="#2b7b61" stroke="#2b7b61" stroke-width="1.5" stroke-linejoin="round"/><text x="42" y="98" font-size="15" fill="#2b7b61" text-anchor="end"><tspan>20</tspan></text><line x1="180" y1="250" x2="600.64" y2="250" stroke="#273b45" stroke-width="1.6"/><polygon points="609.44,250 598.44,254.5 598.44,245.5" fill="#273b45" stroke="#273b45" stroke-width="1.5" stroke-linejoin="round"/><line x1="200" y1="363.44" x2="200" y2="143.36" stroke="#273b45" stroke-width="1.6"/><polygon points="200,134.56 204.5,145.56 195.5,145.56" fill="#273b45" stroke="#273b45" stroke-width="1.5" stroke-linejoin="round"/><text x="613.44" y="255" font-size="17" fill="#273b45" text-anchor="start"><tspan>σ</tspan></text><text x="192" y="138.56" font-size="17" fill="#273b45" text-anchor="end"><tspan>τ</tspan></text><circle cx="480" cy="250" r="89.44" fill="#e6f1f8" stroke="#287aab" stroke-width="2.5"/><circle cx="480" cy="250" r="3.5" fill="#287aab" stroke="#287aab" stroke-width="2"/><line x1="520" y1="170" x2="440" y2="330" stroke="#647780" stroke-width="1.5" stroke-dasharray="5 4"/><circle cx="520" cy="170" r="5" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><circle cx="440" cy="330" r="5" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><text x="528" y="164" font-size="14" fill="#b64f4f" text-anchor="start"><tspan>(80, 20)</tspan></text><text x="432" y="348" font-size="14" fill="#b64f4f" text-anchor="end"><tspan>(60, −20)</tspan></text><circle cx="569.44" cy="250" r="5" fill="#2b7b61" stroke="#2b7b61" stroke-width="2"/><text x="575.44" y="272" font-size="15" fill="#2b7b61" text-anchor="start"><tspan>92.36</tspan></text><text x="480" y="272" font-size="14" fill="#287aab" text-anchor="middle"><tspan>70</tspan></text><text x="100" y="250" font-size="15" fill="#273b45" text-anchor="middle"><tspan>C = 70</tspan></text><text x="100" y="278" font-size="15" fill="#273b45" text-anchor="middle"><tspan>R = √(10² + 20²)</tspan></text><text x="100" y="306" font-size="15" fill="#273b45" text-anchor="middle"><tspan>= 22.36</tspan></text><rect x="221.75" y="376" width="276.5" height="33" rx="7" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><text x="360" y="396" font-size="17" fill="#2b7b61" text-anchor="middle"><tspan>σ</tspan><tspan dy="5" font-size="12">1</tspan><tspan dy="-5"> = 70 + 22.36 = 92.36 N/mm²</tspan></text></g></svg>