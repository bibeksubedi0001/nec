<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Slenderness ratio of a wall between RCC slabs and cross walls</title><desc id="desc">The wall is 200 mm thick, 3.8 m high between RCC slabs and 5 m long between cross walls. The key takes the lesser of h/t = 3.8/0.2 = 19 and l/t = 5/0.2 = 25, giving a slenderness ratio of 19.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><rect x="90" y="120" width="300" height="228" fill="#f5ead8" stroke="#b98232" stroke-width="1.5"/><line x1="90" y1="139" x2="390" y2="139" stroke="#b98232" stroke-width="0.8"/><line x1="90" y1="158" x2="390" y2="158" stroke="#b98232" stroke-width="0.8"/><line x1="90" y1="177" x2="390" y2="177" stroke="#b98232" stroke-width="0.8"/><line x1="90" y1="196" x2="390" y2="196" stroke="#b98232" stroke-width="0.8"/><line x1="90" y1="215" x2="390" y2="215" stroke="#b98232" stroke-width="0.8"/><line x1="90" y1="234" x2="390" y2="234" stroke="#b98232" stroke-width="0.8"/><line x1="90" y1="253" x2="390" y2="253" stroke="#b98232" stroke-width="0.8"/><line x1="90" y1="272" x2="390" y2="272" stroke="#b98232" stroke-width="0.8"/><line x1="90" y1="291" x2="390" y2="291" stroke="#b98232" stroke-width="0.8"/><line x1="90" y1="310" x2="390" y2="310" stroke="#b98232" stroke-width="0.8"/><line x1="90" y1="329" x2="390" y2="329" stroke="#b98232" stroke-width="0.8"/><rect x="70" y="104" width="340" height="16" fill="#e4e8e9" stroke="#273b45" stroke-width="2"/><rect x="70" y="348" width="340" height="16" fill="#e4e8e9" stroke="#273b45" stroke-width="2"/><rect x="78" y="120" width="12" height="228" fill="#d6dfe3" stroke="#273b45" stroke-width="1.5"/><rect x="390" y="120" width="12" height="228" fill="#d6dfe3" stroke="#273b45" stroke-width="1.5"/><text x="240" y="96" font-size="14" fill="#647780" text-anchor="middle"><tspan>RCC slab</tspan></text><rect x="180" y="220" width="120" height="24" fill="#ffffff" stroke="#b98232" stroke-width="1"/><text x="240" y="238" font-size="15" fill="#273b45" text-anchor="middle"><tspan>t = 200 mm</tspan></text><line x1="420" y1="120" x2="420" y2="348" stroke="#647780" stroke-width="1.5"/><line x1="427" y1="120" x2="413" y2="120" stroke="#647780" stroke-width="1.5"/><line x1="427" y1="348" x2="413" y2="348" stroke="#647780" stroke-width="1.5"/><text x="430" y="240" font-size="14" fill="#647780" text-anchor="start">h = 3.8 m</text><line x1="90" y1="384" x2="390" y2="384" stroke="#647780" stroke-width="1.5"/><line x1="90" y1="377" x2="90" y2="391" stroke="#647780" stroke-width="1.5"/><line x1="390" y1="377" x2="390" y2="391" stroke="#647780" stroke-width="1.5"/><text x="240" y="410" font-size="14" fill="#647780" text-anchor="middle">l = 5 m between cross walls</text><text x="585" y="140" font-size="17" fill="#273b45" text-anchor="middle"><tspan>h/t = 3.8/0.2 = 19</tspan></text><text x="585" y="172" font-size="17" fill="#273b45" text-anchor="middle"><tspan>l/t = 5/0.2 = 25</tspan></text><text x="585" y="204" font-size="17" fill="#273b45" text-anchor="middle"><tspan>the lesser: 19</tspan></text><rect x="536.75" y="250" width="96.5" height="35" rx="7" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><text x="585" y="272" font-size="19" fill="#2b7b61" text-anchor="middle"><tspan>SR = 19</tspan></text></g></svg>