<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Shear stress on a plane at 30 degrees in a rod under 2 kN</title><desc id="desc">The axial stress is 2000/1000 = 2 N/mm2. On an oblique plane τ = (σ/2) sin 2θ = 1 x sin 60 = 0.866 N/mm2; a plane at 30 or at 60 degrees gives the same value.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><rect x="60" y="120" width="380" height="80" fill="#e6f1f8" stroke="#273b45" stroke-width="2"/><line x1="190" y1="200" x2="328.56" y2="120" stroke="#b64f4f" stroke-width="3"/><path d="M236 200 A46 46 0 0 0 229.84 177" stroke="#b98232" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="242" y="192" font-size="15" fill="#b98232" text-anchor="start"><tspan>30°</tspan></text><line x1="60" y1="160" x2="26.8" y2="160" stroke="#b64f4f" stroke-width="3.5"/><polygon points="18,160 29,155.5 29,164.5" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><line x1="440" y1="160" x2="473.2" y2="160" stroke="#b64f4f" stroke-width="3.5"/><polygon points="482,160 471,164.5 471,155.5" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="30" y="148" font-size="15" fill="#b64f4f" text-anchor="middle"><tspan>2 kN</tspan></text><text x="470" y="148" font-size="15" fill="#b64f4f" text-anchor="middle"><tspan>2 kN</tspan></text><line x1="236.77" y1="173" x2="286.3" y2="144.4" stroke="#2b7b61" stroke-width="3"/><polygon points="293.92,140 286.65,149.4 282.15,141.6" fill="#2b7b61" stroke="#2b7b61" stroke-width="1.5" stroke-linejoin="round"/><text x="303.12" y="133" font-size="17" fill="#2b7b61" text-anchor="start"><tspan>τ</tspan></text><text x="250" y="236" font-size="15" fill="#647780" text-anchor="middle"><tspan>A = 1000 mm²</tspan></text><text x="250" y="290" font-size="17" fill="#273b45" text-anchor="middle"><tspan>σ = 2000/1000 = 2 N/mm²</tspan></text><text x="250" y="322" font-size="17" fill="#273b45" text-anchor="middle"><tspan>τ = (σ/2) sin 2θ = 1 × sin 60°</tspan></text><rect x="503.75" y="240" width="172.5" height="35" rx="7" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><text x="590" y="262" font-size="19" fill="#2b7b61" text-anchor="middle"><tspan>τ = 0.866 N/mm²</tspan></text></g></svg>