<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Under wheel loads the moment peaks beneath a wheel</title><desc id="desc">For any position of a train of concentrated loads the shear is constant between the wheels, so the moment diagram is made of straight lines with its corners under the wheels. The maximum, and hence the absolute maximum, always occurs under a wheel load.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="70" y1="110" x2="450" y2="110" stroke="#273b45" stroke-width="7"/><polygon points="70,115 55,139 85,139" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><line x1="48" y1="142" x2="92" y2="142" stroke="#647780" stroke-width="2"/><polygon points="450,115 435,136 465,136" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><circle cx="442" cy="142" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><circle cx="458" cy="142" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><line x1="428" y1="149" x2="472" y2="149" stroke="#647780" stroke-width="2"/><line x1="184" y1="58" x2="184" y2="97.2" stroke="#b64f4f" stroke-width="3.5"/><polygon points="184,106 179.5,95 188.5,95" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="184" y="49" font-size="15" fill="#b64f4f" text-anchor="middle"><tspan>40</tspan></text><line x1="252.4" y1="58" x2="252.4" y2="97.2" stroke="#b64f4f" stroke-width="3.5"/><polygon points="252.4,106 247.9,95 256.9,95" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="252.4" y="49" font-size="15" fill="#b64f4f" text-anchor="middle"><tspan>60</tspan></text><line x1="320.8" y1="58" x2="320.8" y2="97.2" stroke="#b64f4f" stroke-width="3.5"/><polygon points="320.8,106 316.3,95 325.3,95" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" str