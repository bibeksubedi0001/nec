<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">The influence line for moment at a section is a triangle</title><desc id="desc">With the unit load at x left of C, MC = RB(L - a) = x(L - a)/L; to the right of C, MC = RA a = (L - x)a/L. Both are straight lines meeting at C with the peak a(L - a)/L, forming a triangle.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="70" y1="120" x2="470" y2="120" stroke="#273b45" stroke-width="6"/><polygon points="70,125 55,149 85,149" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><line x1="48" y1="152" x2="92" y2="152" stroke="#647780" stroke-width="2"/><polygon points="470,125 455,146 485,146" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><circle cx="462" cy="152" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><circle cx="478" cy="152" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><line x1="448" y1="159" x2="492" y2="159" stroke="#647780" stroke-width="2"/><line x1="150" y1="76" x2="150" y2="103.2" stroke="#b64f4f" stroke-width="2.5"/><polygon points="150,112 145.5,101 154.5,101" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="150" y="68" font-size="15" fill="#b64f4f" text-anchor="middle"><tspan>1</tspan></text><line x1="210" y1="100" x2="210" y2="170" stroke="#2b7b61" stroke-width="2" stroke-dasharray="5 4"/><text x="218" y="170" font-size="15" fill="#2b7b61" text-anchor="start"><tspan>C</tspan></text><line x1="70" y1="184" x2="210" y2="184" stroke="#647780" stroke-width="1.5"/><line x1="70" y1="177" x2="70" y2="191" stroke="#647780" stroke-width="1.5"/><line x1="210" y1="177" x2="210" y2="191" stroke="#647780" stroke-width="1.5"/><text x="140" y="210" font-size="14" fill="#647780" text-anchor="middle">a</text><polygon points="70,350 70,350 210,230 470,350 470,350" fill="#e6f1f8" stroke="none" stroke-width="2" stroke-linejoin="round"/><path d="M70 350 L210 230 L470 350" stroke="#287aab" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="70" y1="350" x2="470" y2="350" stroke="#273b45" stroke-width="1.5"/><text x="58" y="355" font-size="14" fill="#647780" text-anchor="end"><tspan>ILD M</tspan><tspan dy="4" font-size="10">C</tspan></text><text x="210" y="220" font-size="15" fill="#287aab" text-anchor="middle"><tspan>a(L − a)/L</tspan></text><text x="114" y="288.86" font-size="14" fill="#647780" text-anchor="end"><tspan>x(L − a)/L</tspan></text><text x="378" y="289.85" font-size="14" fill="#647780" text-anchor="start"><tspan>(L − x)a/L</tspan></text><rect x="547" y="240" width="106" height="35" rx="7" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><text x="600" y="262" font-size="19" fill="#2b7b61" text-anchor="middle"><tspan>triangle</tspan></text></g></svg>