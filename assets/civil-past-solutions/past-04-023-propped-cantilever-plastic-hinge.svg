<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Plastic hinges of a propped cantilever under a uniform load</title><desc id="desc">At collapse the moment is -Mp at the fixed end and +Mp at the sagging peak. With R the prop reaction the peak is at a = R/w from the prop, and matching both values gives a squared + 2aL - L squared = 0, so a = (√2 - 1)L = 0.414L and wu = 11.66Mp/L squared.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="70" y1="88" x2="70" y2="152" stroke="#273b45" stroke-width="3"/><line x1="70" y1="92" x2="59" y2="102" stroke="#647780" stroke-width="1.4"/><line x1="70" y1="104" x2="59" y2="114" stroke="#647780" stroke-width="1.4"/><line x1="70" y1="116" x2="59" y2="126" stroke="#647780" stroke-width="1.4"/><line x1="70" y1="128" x2="59" y2="138" stroke="#647780" stroke-width="1.4"/><line x1="70" y1="140" x2="59" y2="150" stroke="#647780" stroke-width="1.4"/><line x1="70" y1="120" x2="450" y2="120" stroke="#273b45" stroke-width="7"/><polygon points="450,126 435,147 465,147" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><circle cx="442" cy="153" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><circle cx="458" cy="153" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><line x1="428" y1="160" x2="472" y2="160" stroke="#647780" stroke-width="2"/><line x1="74" y1="86" x2="446" y2="86" stroke="#b64f4f" stroke-width="2"/><line x1="74" y1="86" x2="74" y2="107.8" stroke="#b64f4f" stroke-width="2"/><polygon points="74,115 70,106 78,106" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><line x1="115.33" y1="86" x2="115.33" y2="107.8" stroke="#b64f4f" stroke-width="2"/><polygon points="115.33,115 111.33,106 119.33,106" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><line x1="156.67" y1="8