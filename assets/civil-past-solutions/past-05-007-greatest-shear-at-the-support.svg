<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Greatest shear at support A from a load train</title><desc id="desc">The shear at A equals RA, whose influence line falls from 1 at A to 0 at B. The sum of load times ordinate is greatest when the whole train is on the span as close to A as possible, with its end load standing at A.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="70" y1="110" x2="450" y2="110" stroke="#273b45" stroke-width="6"/><polygon points="70,115 55,139 85,139" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><line x1="48" y1="142" x2="92" y2="142" stroke="#647780" stroke-width="2"/><polygon points="450,115 435,136 465,136" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><circle cx="442" cy="142" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><circle cx="458" cy="142" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><line x1="428" y1="149" x2="472" y2="149" stroke="#647780" stroke-width="2"/><line x1="71.9" y1="62" x2="71.9" y2="97.2" stroke="#b64f4f" stroke-width="3"/><polygon points="71.9,106 67.4,95 76.4,95" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="83.9" y="54" font-size="14" fill="#b64f4f" text-anchor="middle"><tspan>W₁</tspan></text><line x1="115.6" y1="62" x2="115.6" y2="97.2" stroke="#b64f4f" stroke-width="3"/><polygon points="115.6,106 111.1,95 120.1,95" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="115.6" y="54" font-size="14" fill="#b64f4f" text-anchor="middle"><tspan>W₂</tspan></text><line x1="161.2" y1="62" x2="161.2" y2="97.2" stroke="#b64f4f" stroke-width="3"/><polygon points="161.2,106 156.7,95 165.7,95" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="161.2" y="54" font-size="14" fill="#b64f4f" text-anchor="middle"><tspan>W₃</tspan></text><line x1="206.8" y1="62" x2="206.8" y2="97.2" stroke="#b64f4f" stroke-width="3"/><polygon points="206.8,106 202.3,95 211.3,95" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="206.8" y="54" font-size="14" fill="#b64f4f" text-anchor="middle"><tspan>W₄</tspan></text><line x1="260" y1="76" x2="238.4" y2="76" stroke="#647780" stroke-width="2"/><polygon points="229.6,76 240.6,71.5 240.6,80.5" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><polygon points="70,300 70,180 450,300 450,300" fill="#e6f1f8" stroke="none" stroke-width="2" stroke-linejoin="round"/><path d="M70 180 L450 300" stroke="#287aab" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="70" y1="300" x2="450" y2="300" stroke="#273b45" stroke-width="1.5"/><text x="58" y="305" font-size="14" fill="#647780" text-anchor="end"><tspan>ILD R</tspan><tspan dy="4" font-size="10">A</tspan></text><line x1="71.9" y1="300" x2="71.9" y2="180.6" stroke="#b64f4f" stroke-width="2"/><line x1="115.6" y1="300" x2="115.6" y2="194.4" stroke="#b64f4f" stroke-width="2"/><line x1="161.2" y1="300" x2="161.2" y2="208.8" stroke="#b64f4f" stroke-width="2"/><line x1="206.8" y1="300" x2="206.8" y2="223.2" stroke="#b64f4f" stroke-width="2"/><text x="78" y="170" font-size="15" fill="#287aab" text-anchor="start"><tspan>1</tspan></text><text x="590" y="150" font-size="16" fill="#273b45" text-anchor="middle"><tspan>S</tspan><tspan dy="4" font-size="12">A</tspan><tspan dy="-4"> = R</tspan><tspan dy="4" font-size="12">A</tspan><tspan dy="-4"> = ΣWη</tspan></text><text x="590" y="184" font-size="16" fill="#273b45" text-anchor="middle"><tspan>largest ordinates near A</tspan></text><rect x="471" y="243" width="238" height="32" rx="7" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><text x="590" y="262" font-size="16" fill="#2b7b61" text-anchor="middle"><tspan>end load of the t