<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Maximum normal stress for σx with shear τxy</title><desc id="desc">The major principal stress is the right-hand end of Mohr's circle: centre σx/2 plus radius root((σx/2) squared + τ squared). Taking 1/4 out of the root writes this as σx/2 + (1/2) root(σx squared + 4τ squared).</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="46" y1="230" x2="359.2" y2="230" stroke="#273b45" stroke-width="1.6"/><polygon points="368,230 357,234.5 357,225.5" fill="#273b45" stroke="#273b45" stroke-width="1.5" stroke-linejoin="round"/><line x1="120" y1="384" x2="120" y2="82.8" stroke="#273b45" stroke-width="1.6"/><polygon points="120,74 124.5,85 115.5,85" fill="#273b45" stroke="#273b45" stroke-width="1.5" stroke-linejoin="round"/><text x="372" y="235" font-size="17" fill="#273b45" text-anchor="start"><tspan>σ</tspan></text><text x="112" y="78" font-size="17" fill="#273b45" text-anchor="end"><tspan>τ</tspan></text><circle cx="198" cy="230" r="130" fill="#e6f1f8" stroke="#287aab" stroke-width="2.5"/><circle cx="198" cy="230" r="3.5" fill="#287aab" stroke="#287aab" stroke-width="2"/><circle cx="276" cy="126" r="5" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><text x="284" y="118" font-size="15" fill="#b64f4f" text-anchor="start"><tspan>(σ</tspan><tspan dy="4" font-size="11">x</tspan><tspan dy="-4">, τ</tspan><tspan dy="4" font-size="11">xy</tspan><tspan dy="-4">)</tspan></text><line x1="198" y1="230" x2="276" y2="126" stroke="#287aab" stroke-width="2"/><circle cx="328" cy="230" r="6" fill="#2b7b61" stroke="#2b7b61" stroke-width="2"/><text x="336" y="252" font-size="16" fill="#2b7b61" text-anchor="start"><tspan>σ</tspan><tspan dy="4" font-size="12">max</tspan></text><line x1="120" y1="382" x2="198" y2="382" stroke="#647780" stroke-width="1.5"/><line x1="120" y1="375" x2="120" y2="389" stroke="#647780" stroke-width="1.5"/><line x1="198" y1="375" x2="198" y2="389" stroke="#647780" stroke-width="1.5"/><line x1="198" y1="382" x2="328" y2="382" stroke="#647780" stroke-width="1.5"/><line x1="198" y1="375" x2="198" y2="389" stroke="#647780" stroke-width="1.5"/><line x1="328" y1="375" x2="328" y2="389" stroke="#647780" stroke-width="1.5"/><text x="159" y="406" font-size="14" fill="#647780" text-anchor="middle"><tspan>σ</tspan><tspan dy="4" font-size="10">x</tspan><tspan dy="-4">/2</tspan></text><text x="263" y="406" font-size="14" fill="#647780" text-anchor="middle"><tspan>R</tspan></text><text x="555" y="140" font-size="16" fill="#273b45" text-anchor="middle"><tspan>R = √((σ</tspan><tspan dy="4" font-size="12">x</tspan><tspan dy="-4">/2)² + τ²)</tspan></text><text x="555" y="174" font-size="16" fill="#273b45" text-anchor="middle"><tspan>= ½√(σ</tspan><tspan dy="4" font-size="12">x</tspan><tspan dy="-4">² + 4τ²)</tspan></text><rect x="452" y="231" width="206" height="32" rx="7" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><text x="555" y="250" font-size="16" fill="#2b7b61" text-anchor="middle"><tspan>σ</tspan><tspan dy="4" font-size="12">x</tspan><tspan dy="-4">/2 + ½√(σ</tspan><tspan dy="4" font-size="12">x</tspan><tspan dy="-4">² + 4τ</tspan><tspan dy="4" font-size="12">xy</tspan><tspan dy="-4">²)</tspan></text></g></svg>