<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Constant shear gives a linear moment</title><desc id="desc">A cantilever with a tip load W has the same shear W at every section. Since dM/dx = S is constant, the moment changes at a constant rate: a straight line from zero at the tip to WL at the support.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="90" y1="110" x2="440" y2="110" stroke="#273b45" stroke-width="7"/><line x1="90" y1="76" x2="90" y2="144" stroke="#273b45" stroke-width="3"/><line x1="90" y1="80" x2="79" y2="90" stroke="#647780" stroke-width="1.4"/><line x1="90" y1="92" x2="79" y2="102" stroke="#647780" stroke-width="1.4"/><line x1="90" y1="104" x2="79" y2="114" stroke="#647780" stroke-width="1.4"/><line x1="90" y1="116" x2="79" y2="126" stroke="#647780" stroke-width="1.4"/><line x1="90" y1="128" x2="79" y2="138" stroke="#647780" stroke-width="1.4"/><line x1="90" y1="140" x2="79" y2="150" stroke="#647780" stroke-width="1.4"/><line x1="440" y1="58" x2="440" y2="97.2" stroke="#b64f4f" stroke-width="3.5"/><polygon points="440,106 435.5,95 444.5,95" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="440" y="49" font-size="16" fill="#b64f4f" text-anchor="middle"><tspan>W</tspan></text><polygon points="90,230 90,196 91.46,196 92.92,196 94.38,196 95.83,196 97.29,196 98.75,196 100.21,196 101.67,196 103.13,196 104.58,196 106.04,196 107.5,196 108.96,196 110.42,196 111.88,196 113.33,196 114.79,196 116.25,196 117.71,196 119.17,196 120.63,196 122.08,196 123.54,196 125,196 126.46,196 127.92,196 129.38,196 130.83,196 132.29,196 133.75,196 135.21,196 136.67,196 138.13,196 139.58,196 141.04,196 142.5,196 143.96,196 145.42,196 146.88,196 148.33,196 149.79,196 151.25,196 152.71,196 154.17,196 155.63,196 157.08,196 158.54,196 160,196 161.46,196 162.92,196 164.38,