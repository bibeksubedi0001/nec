<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Free joint displacements of a propped cantilever</title><desc id="desc">The fixed end A cannot move or rotate. The roller at B stops vertical movement but leaves the rotation θB and, when axial deformation is counted, the horizontal movement uB free, so the kinematic indeterminacy is 2.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="70" y1="146" x2="70" y2="214" stroke="#273b45" stroke-width="3"/><line x1="70" y1="150" x2="59" y2="160" stroke="#647780" stroke-width="1.4"/><line x1="70" y1="162" x2="59" y2="172" stroke="#647780" stroke-width="1.4"/><line x1="70" y1="174" x2="59" y2="184" stroke="#647780" stroke-width="1.4"/><line x1="70" y1="186" x2="59" y2="196" stroke="#647780" stroke-width="1.4"/><line x1="70" y1="198" x2="59" y2="208" stroke="#647780" stroke-width="1.4"/><line x1="70" y1="210" x2="59" y2="220" stroke="#647780" stroke-width="1.4"/><line x1="70" y1="180" x2="380" y2="180" stroke="#273b45" stroke-width="7"/><polygon points="380,183 365,204 395,204" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><circle cx="372" cy="210" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><circle cx="388" cy="210" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><line x1="358" y1="217" x2="402" y2="217" stroke="#647780" stroke-width="2"/><path d="M352 166 Q380 108 408 166" stroke="#2b7b61" stroke-width="2.8" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="408,166 399.6,158.95 407.7,155.04" fill="#2b7b61" stroke="#2b7b61" stroke-width="1.5" stroke-linejoin="round"/><text x="380" y="130" font-size="16" fill="#2b7b61" text-anchor="middle"><tspan>θ</tspan><tspan dy="4" font-size="12">B</tspan></text><line x1="396" y1="180" x2="443.2" y2="180" stroke="#287aab" stroke-width="3"/><polygon points="452,180 441,184.5 441,175.5" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><text x="424" y="170" font-size="16" fill="#287aab" text-anchor="middle"><tspan>u</tspan><tspan dy="4" font-size="12">B</tspan></text><text x="70" y="252" font-size="14" fill="#647780" text-anchor="start"><tspan>A fixed: no freedom</tspan></text><text x="380" y="246" font-size="14" fill="#647780" text-anchor="middle"><tspan>v</tspan><tspan dy="4" font-size="10">B</tspan><tspan dy="-4"> = 0</tspan></text><text x="225" y="320" font-size="15" fill="#273b45" text-anchor="middle"><tspan>free: θ</tspan><tspan dy="4" font-size="11">B</tspan><tspan dy="-4"> and u</tspan><tspan dy="4" font-size="11">B</tspan></text><text x="585" y="150" font-size="16" fill="#273b45" text-anchor="middle"><tspan>A: 0</tspan></text><text x="585" y="184" font-size="16" fill="#273b45" text-anchor="middle"><tspan>B: rotation + axial movement</tspan></text><rect x="541.5" y="240" width="87" height="35" rx="7" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><text x="585" y="262" font-size="19" fill="#2b7b61" text-anchor="middle"><tspan>D</tspan><tspan dy="5" font-size="14">k</tspan><tspan dy="-5"> = 2</tspan></text></g></svg>