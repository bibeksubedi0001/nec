<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Critical section for two-way shear in a square footing</title><desc id="desc">The punching-shear section lies d/2 = 0.25 m from each face of the 0.5 m column, so it is a 1.0 m square with perimeter b0 = 4 m. The resisting area is b0 x d = 4 x 0.5 = 2.0 m squared.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><rect x="70" y="110" width="240" height="240" fill="#e4e8e9" stroke="#273b45" stroke-width="2.5"/><rect x="150" y="190" width="80" height="80" fill="#f2dfdf" stroke="#b64f4f" stroke-width="2.5" stroke-dasharray="8 5"/><rect x="170" y="210" width="40" height="40" fill="#d6dfe3" stroke="#273b45" stroke-width="2.5"/><line x1="70" y1="94" x2="310" y2="94" stroke="#647780" stroke-width="1.5"/><line x1="70" y1="87" x2="70" y2="101" stroke="#647780" stroke-width="1.5"/><line x1="310" y1="87" x2="310" y2="101" stroke="#647780" stroke-width="1.5"/><text x="190" y="84" font-size="14" fill="#647780" text-anchor="middle">3 m</text><line x1="150" y1="292" x2="230" y2="292" stroke="#647780" stroke-width="1.5"/><line x1="150" y1="285" x2="150" y2="299" stroke="#647780" stroke-width="1.5"/><line x1="230" y1="285" x2="230" y2="299" stroke="#647780" stroke-width="1.5"/><text x="190" y="318" font-size="14" fill="#647780" text-anchor="middle">1.0 m</text><line x1="210" y1="230" x2="230" y2="230" stroke="#647780" stroke-width="1.5"/><line x1="210" y1="226" x2="210" y2="234" stroke="#647780" stroke-width="1.5"/><line x1="230" y1="226" x2="230" y2="234" stroke="#647780" stroke-width="1.5"/><text x="238" y="235" font-size="14" fill="#b64f4f" text-anchor="start"><tspan>d/2</tspan></text><text x="190" y="180" font-size="14" fill="#273b45" text-anchor="middle"><tspan>0.5 m column</tspan></text><text x="324" y="170" font-size="14" fill="#b64f4f" text-anchor="start"><tspan>critical</tspan></text><text x="324" y="188" font-size="14" fill="#b64f4f" text-anchor="start"><tspan>perimeter</tspan></text><text x="585" y="140" font-size="16" fill="#273b45" text-anchor="middle"><tspan>side = 0.5 + 2(0.25) = 1.0 m</tspan></text><text x="585" y="172" font-size="16" fill="#273b45" text-anchor="middle"><tspan>b</tspan><tspan dy="4" font-size="12">0</tspan><tspan dy="-4"> = 4 × 1.0 = 4 m</tspan></text><text x="585" y="204" font-size="16" fill="#273b45" text-anchor="middle"><tspan>area = b</tspan><tspan dy="4" font-size="12">0</tspan><tspan dy="-4"> d = 4 × 0.5</tspan></text><rect x="541.5" y="250" width="87" height="35" rx="7" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><text x="585" y="272" font-size="19" fill="#2b7b61" text-anchor="middle"><tspan>2.0 m²</tspan></text></g></svg>