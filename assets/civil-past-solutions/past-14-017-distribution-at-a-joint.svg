<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Sharing a joint moment among the members</title><desc id="desc">A moment M applied at a rigid joint is shared among the members meeting there in proportion to their stiffnesses. Each member takes DF = k/Σk of M, and the distribution factors at a joint add up to 1.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="70" y1="200" x2="430" y2="200" stroke="#273b45" stroke-width="6"/><line x1="250" y1="200" x2="250" y2="360" stroke="#273b45" stroke-width="6"/><line x1="70" y1="166" x2="70" y2="234" stroke="#273b45" stroke-width="3"/><line x1="70" y1="170" x2="59" y2="180" stroke="#647780" stroke-width="1.4"/><line x1="70" y1="182" x2="59" y2="192" stroke="#647780" stroke-width="1.4"/><line x1="70" y1="194" x2="59" y2="204" stroke="#647780" stroke-width="1.4"/><line x1="70" y1="206" x2="59" y2="216" stroke="#647780" stroke-width="1.4"/><line x1="70" y1="218" x2="59" y2="228" stroke="#647780" stroke-width="1.4"/><line x1="70" y1="230" x2="59" y2="240" stroke="#647780" stroke-width="1.4"/><polygon points="430,203 415,227 445,227" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><line x1="408" y1="230" x2="452" y2="230" stroke="#647780" stroke-width="2"/><rect x="226" y="360" width="48" height="12" fill="#d6dfe3" stroke="#273b45" stroke-width="2"/><circle cx="250" cy="200" r="7" fill="#273b45" stroke="#273b45" stroke-width="2"/><path d="M218 184 Q250 124 282 184" stroke="#2b7b61" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="282,184 272.41,176.65 281.24,171.94" fill="#2b7b61" stroke="#2b7b61" stroke-width="1.5" stroke-linejoin="round"/><text x="250" y="140" font-size="17" fill="#2b7b61" text-anchor="middle"><tspan>M</tspan></text><text x="160" y="190" font-size="16" fill="#287aab" text-anchor="middle"><tspan>k</tspan><tspan dy="4" font-size="12">1</tspan></text><text x="340" y="190" font-size="16" fill="#287aab" text-anchor="middle"><tspan>k</tspan><tspan dy="4" font-size="12">2</tspan></text><text x="262" y="290" font-size="16" fill="#287aab" text-anchor="start"><tspan>k</tspan><tspan dy="4" font-size="12">3</tspan></text><text x="160" y="232" font-size="14" fill="#647780" text-anchor="middle"><tspan>M k</tspan><tspan dy="4" font-size="10">1</tspan><tspan dy="-4">/Σk</tspan></text><text x="340" y="232" font-size="14" fill="#647780" text-anchor="middle"><tspan>M k</tspan><tspan dy="4" font-size="10">2</tspan><tspan dy="-4">/Σk</tspan></text><text x="262" y="316" font-size="14" fill="#647780" text-anchor="start"><tspan>M k</tspan><tspan dy="4" font-size="10">3</tspan><tspan dy="-4">/Σk</tspan></text><text x="238" y="224" font-size="15" fill="#273b45" text-anchor="end"><tspan>O</tspan></text><text x="585" y="140" font-size="17" fill="#273b45" text-anchor="middle"><tspan>DF</tspan><tspan dy="5" font-size="12">i</tspan><tspan dy="-5"> = k</tspan><tspan dy="5" font-size="12">i</tspan><tspan dy="-5">/Σk</tspan></text><text x="585" y="174" font-size="17" fill="#273b45" text-anchor="middle"><tspan>ΣDF = 1 at the joint</tspan></text><rect x="489.25" y="242" width="191.5" height="33" rx="7" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><text x="585" y="262" font-size="17" fill="#2b7b61" text-anchor="middle"><tspan>member k ÷ joint Σk</tspan></text></g></svg>