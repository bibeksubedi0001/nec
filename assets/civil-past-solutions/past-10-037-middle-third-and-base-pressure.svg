<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Base pressure for a resultant inside, on and outside the middle third</title><desc id="desc">For a resultant P at eccentricity e the base pressure is (P/b)(1 ± 6e/b). Inside the middle third (e less than b/6) the whole base is in compression; at e = b/6 the pressure falls to zero at one edge; beyond it that edge goes into tension.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><text x="220" y="84" font-size="14" fill="#b98232" text-anchor="middle"><tspan>middle third</tspan></text><polygon points="100,140 340,140 340,170 100,150" fill="#e6f1f8" stroke="#287aab" stroke-width="2" stroke-linejoin="round"/><line x1="100" y1="140" x2="340" y2="140" stroke="#273b45" stroke-width="3"/><line x1="180" y1="140" x2="260" y2="140" stroke="#b98232" stroke-width="6"/><line x1="240" y1="96" x2="240" y2="127.2" stroke="#b64f4f" stroke-width="3"/><polygon points="240,136 235.5,125 244.5,125" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="90" y="145" font-size="14" fill="#273b45" text-anchor="end"><tspan>e &lt; b/6</tspan></text><text x="352" y="158" font-size="14" fill="#2b7b61" text-anchor="start"><tspan>compression only</tspan></text><polygon points="100,250 340,250 340,290 100,250" fill="#e6f1f8" stroke="#287aab" stroke-width="2" stroke-linejoin="round"/><line x1="100" y1="250" x2="340" y2="250" stroke="#273b45" stroke-width="3"/><line x1="180" y1="250" x2="260" y2="250" stroke="#b98232" stroke-width="6"/><line x1="260" y1="206" x2="260" y2="237.2" stroke="#b64f4f" stroke-width="3"/><polygon points="260,246 255.5,235 264.5,235" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="90" y="255" font-size="14" fill="#273b45" text-anchor="end"><tspan>e = b/6</tspan></text><text x="352" y="268" font-size="14" fill="#273b45" text-anchor="start"><tspan>zero at one edge</tspan></text><polygon points="140,350 340,350 340,400" fill="#e6f1f8" stroke="#287aab" stroke-width="2" stroke-linejoin="round"/><polygon points="100,350 100,340 140,350" fill="#f2dfdf" stroke="#b64f4f" stroke-width="2" stroke-linejoin="round"/><line x1="100" y1="350" x2="340" y2="350" stroke="#273b45" stroke-width="3"/><line x1="180" y1="350" x2="260" y2="350" stroke="#b98232" stroke-width="6"/><line x1="280" y1="306" x2="280" y2="337.2" stroke="#b64f4f" stroke-width="3"/><polygon points="280,346 275.5,335 284.5,335" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="90" y="355" font-size="14" fill="#273b45" text-anchor="end"><tspan>e &gt; b/6</tspan></text><text x="352" y="368" font-size="14" fill="#b64f4f" text-anchor="start"><tspan>tension at one edge</tspan></text><text x="585" y="180" font-size="17" fill="#273b45" text-anchor="middle"><tspan>p = (P/b)(1 ± 6e/b)</tspan></text><text x="585" y="214" font-size="17" fill="#273b45" text-anchor="middle"><tspan>e ≤ b/6: p</tspan><tspan dy="5" font-size="12">min</tspan><tspan dy="-5"> ≥ 0</tspan></text><rect x="494" y="268" width="182" height="35" rx="7" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><text x="585" y="290" font-size="19" fill="#2b7b61" text-anchor="middle"><tspan>to avoid tension</tspan></text></g></svg>