<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Tip deflection of a cantilever by the moment-area method</title><desc id="desc">The M/EI diagram is a triangle from WL/EI at the wall to zero at the tip. Its area WL squared/2EI acts at 2L/3 from the tip, so the tip deflection is WL squared/2EI x 2L/3 = WL cubed/3EI.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="80" y1="86" x2="80" y2="144" stroke="#273b45" stroke-width="3"/><line x1="80" y1="90" x2="69" y2="100" stroke="#647780" stroke-width="1.4"/><line x1="80" y1="102" x2="69" y2="112" stroke="#647780" stroke-width="1.4"/><line x1="80" y1="114" x2="69" y2="124" stroke="#647780" stroke-width="1.4"/><line x1="80" y1="126" x2="69" y2="136" stroke="#647780" stroke-width="1.4"/><line x1="80" y1="138" x2="69" y2="148" stroke="#647780" stroke-width="1.4"/><line x1="80" y1="115" x2="410" y2="115" stroke="#647780" stroke-width="1.5" stroke-dasharray="6 5"/><path d="M80 115 L85.5 115.02 L91 115.08 L96.5 115.18 L102 115.33 L107.5 115.51 L113 115.73 L118.5 115.98 L124 116.27 L129.5 116.6 L135 116.97 L140.5 117.37 L146 117.8 L151.5 118.27 L157 118.77 L162.5 119.3 L168 119.86 L173.5 120.45 L179 121.08 L184.5 121.73 L190 122.41 L195.5 123.12 L201 123.85 L206.5 124.61 L212 125.4 L217.5 126.21 L223 127.05 L228.5 127.91 L234 128.79 L239.5 129.7 L245 130.63 L250.5 131.57 L256 132.54 L261.5 133.53 L267 134.53 L272.5 135.56 L278 136.6 L283.5 137.66 L289 138.73 L294.5 139.82 L300 140.93 L305.5 142.04 L311 143.17 L316.5 144.32 L322 145.47 L327.5 146.64 L333 147.82 L338.5 149 L344 150.2 L349.5 151.4 L355 152.62 L360.5 153.83 L366 155.06 L371.5 156.29 L377 157.53 L382.5 158.76 L388 160.01 L393.5 161.25 L399 162.5 L404.5 163.75 L410 165" stroke="#287aab" stroke-width="4.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="410" y1="118" x2="410" y2="153.2" stroke="#b64f4f" stroke-width="3.5"/><polygon points="410,162 405.5,151 414.5,151" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="410" y="108" font-size="16" fill="#b64f4f" text-anchor="middle">W</text><line x1="426" y1="115" x2="426" y2="165" stroke="#647780" stroke-width="1.5"/><line x1="430" y1="115" x2="422" y2="115" stroke="#647780" stroke-width="1.5"/><line x1="430" y1="165" x2="422" y2="165" stroke="#647780" stroke-width="1.5"/><text x="434" y="146" font-size="16" fill="#287aab" text-anchor="start"><tspan>δ</tspan></text><polygon points="80,240 80,330 410,240" fill="#f2dfdf" stroke="#b64f4f" stroke-width="2" stroke-linejoin="round"/><text x="88" y="348" font-size="14" fill="#b64f4f" text-anchor="start"><tspan>WL/EI</tspan></text><text x="190" y="270" font-size="14" fill="#b64f4f" text-anchor="middle"><tspan>area WL²/2EI</tspan></text><circle cx="190" cy="290" r="3.5" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><line x1="190" y1="372" x2="410" y2="372" stroke="#647780" stroke-width="1.5"/><line x1="190" y1="365" x2="190" y2="379" stroke="#647780" stroke-width="1.5"/><line x1="410" y1="365" x2="410" y2="379" stroke="#647780" stroke-width="1.5"/><text x="300" y="398" font-size="14" fill="#647780" text-anchor="middle">2L/3</text><line x1="190" y1="290" x2="190" y2="372" stroke="#647780" stroke-width="1" stroke-dasharray="3 4"/><text x="590" y="150" font-size="16" fill="#273b45" text-anchor="middle"><tspan>δ = area × 2L/3</tspan></text><text x="590" y="184" font-size="16" fill="#273b45" text-anchor="middle"><tspan>= (WL²/2EI)(2L/3)</tspan></text><rect x="522.75" y="240" width="134.5" height="35" rx="7" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><text x="590" y="262" font-size="19" fill="#2b7b61" text-anchor="middle"><tspan>δ = WL³/3EI</tspan></text></g></svg>