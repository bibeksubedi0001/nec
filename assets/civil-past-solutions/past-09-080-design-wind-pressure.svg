span><tspan dy="-4"> k</tspan><tspan dy="4" font-size="12">2</tspan><tspan dy="-4"> k</tspan><tspan dy="4" font-size="12">3</tspan><tspan dy="-4"> = 55 m/s</tspan></text><text x="585" y="172" font-size="16" fill="#273b45" text-anchor="middle"><tspan>p</tspan><tspan dy="4" font-size="12">z</tspan><tspan dy="-4"> = 0.6 V</tspan><tspan dy="4" font-size="12">z</tspan><tspan dy="-4">²</tspan></text><text x="585" y="204" font-size="16" fill="#273b45" text-anchor="middle"><tspan>= 0.6 × 55² = 0.6 × 3025</tspan></text><rect x="503.5" y="250" width="163" height="35" rx="7" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><text x="585" y="272" font-size="19" fill="#2b7b61" text-anchor="middle"><tspan>p</tspan><tspan dy="5" font-size="14">z</tspan><tspan dy="-5"> = 1815 N/m²</tspan></text></g></svg>