<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Bending stress varies linearly across the depth</title><desc id="desc">Under pure bending σ = My/I, so the stress grows in proportion to the distance y from the neutral axis: compression on one side, tension on the other, zero at the axis. It is the shear stress that is parabolic.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><rect x="90" y="150" width="200" height="70" fill="#d6dfe3" stroke="#273b45" stroke-width="2"/><path d="M65.75 199 A28 28 0 1 1 114.25 199" stroke="#2b7b61" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="114.25,199 115.85,187.22 123.65,191.72" fill="#2b7b61" stroke="#2b7b61" stroke-width="1.5" stroke-linejoin="round"/><path d="M314.25 199 A28 28 0 1 0 265.75 199" stroke="#2b7b61" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="265.75,199 256.35,191.72 264.15,187.22" fill="#2b7b61" stroke="#2b7b61" stroke-width="1.5" stroke-linejoin="round"/><text x="90" y="140" font-size="16" fill="#2b7b61" text-anchor="middle"><tspan>M</tspan></text><text x="290" y="140" font-size="16" fill="#2b7b61" text-anchor="middle"><tspan>M</tspan></text><text x="190" y="250" font-size="14" fill="#647780" text-anchor="middle">pure bending</text><line x1="400" y1="110" x2="400" y2="290" stroke="#273b45" stroke-width="1.5"/><polygon points="400,110 480,110 400,200" fill="#e6f1f8" stroke="#287aab" stroke-width="2" stroke-linejoin="round"/><polygon points="400,200 400,290 320,290" fill="#f2dfdf" stroke="#b64f4f" stroke-width="2" stroke-linejoin="round"/><text x="486" y="115" font-size="14" fill="#287aab" text-anchor="start"><tspan>compression</tspan></text><text x="314" y="295" font-size="14" fill="#b64f4f" text-anchor="end"><tspan>tension</tspan></text><line x1="370" y1="200" x2="430" y2="200" stroke="#647780" stroke-width="1.2" stroke-dasharray="4 4"/><text x="436" y="205" font-size="14" fill="#647780" text-anchor="start"><tspan>NA: σ = 0</tspan></text><text x="300" y="344" font-size="19" fill="#273b45" text-anchor="middle"><tspan>σ = My/I</tspan></text><rect x="536.5" y="322" width="87" height="35" rx="7" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><text x="580" y="344" font-size="19" fill="#2b7b61" text-anchor="middle"><tspan>linear</tspan></text></g></svg>