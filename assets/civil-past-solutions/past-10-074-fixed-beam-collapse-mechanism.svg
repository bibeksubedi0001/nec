<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Collapse mechanism of a fixed beam under a central load</title><desc id="desc">Plastic hinges form at both fixed ends and under the load. If the end hinges rotate θ the centre hinge rotates 2θ and the load moves Lθ/2, so W(Lθ/2) = Mp(θ + 2θ + θ) and the collapse load is 8Mp/L.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="70" y1="96" x2="70" y2="164" stroke="#273b45" stroke-width="3"/><line x1="70" y1="100" x2="59" y2="110" stroke="#647780" stroke-width="1.4"/><line x1="70" y1="112" x2="59" y2="122" stroke="#647780" stroke-width="1.4"/><line x1="70" y1="124" x2="59" y2="134" stroke="#647780" stroke-width="1.4"/><line x1="70" y1="136" x2="59" y2="146" stroke="#647780" stroke-width="1.4"/><line x1="70" y1="148" x2="59" y2="158" stroke="#647780" stroke-width="1.4"/><line x1="70" y1="160" x2="59" y2="170" stroke="#647780" stroke-width="1.4"/><line x1="450" y1="96" x2="450" y2="164" stroke="#273b45" stroke-width="3"/><line x1="450" y1="100" x2="461" y2="110" stroke="#647780" stroke-width="1.4"/><line x1="450" y1="112" x2="461" y2="122" stroke="#647780" stroke-width="1.4"/><line x1="450" y1="124" x2="461" y2="134" stroke="#647780" stroke-width="1.4"/><line x1="450" y1="136" x2="461" y2="146" stroke="#647780" stroke-width="1.4"/><line x1="450" y1="148" x2="461" y2="158" stroke="#647780" stroke-width="1.4"/><line x1="450" y1="160" x2="461" y2="170" stroke="#647780" stroke-width="1.4"/><line x1="70" y1="130" x2="450" y2="130" stroke="#273b45" stroke-width="7"/><line x1="260" y1="67" x2="260" y2="116.2" stroke="#b64f4f" stroke-width="3.5"/><polygon points="260,125 255.5,114 264.5,114" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="260" y="57" font-size="16" fill="#b64f4f" text-anchor="middle">W</text><line x1="70" y1="186" x2="260" y2="186" stroke="#647780" stroke-width="1.5"/><line x1="70" y1="179" x2="70" y2="193" stroke="#647780" stroke-width="1.5"/><line x1="260" y1="179" x2="260" y2="193" stroke="#647780" stroke-width="1.5"/><text x="165" y="212" font-size="14" fill="#647780" text-anchor="middle">L/2</text><line x1="260" y1="186" x2="450" y2="186" stroke="#647780" stroke-width="1.5"/><line x1="260" y1="179" x2="260" y2="193" stroke="#647780" stroke-width="1.5"/><line x1="450" y1="179" x2="450" y2="193" stroke="#647780" stroke-width="1.5"/><text x="355" y="212" font-size="14" fill="#647780" text-anchor="middle">L/2</text><line x1="70" y1="250" x2="450" y2="250" stroke="#647780" stroke-width="1.2" stroke-dasharray="5 5"/><path d="M70 250 L260 330 L450 250" stroke="#273b45" stroke-width="5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="70" cy="250" r="7" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><circle cx="260" cy="330" r="7" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><circle cx="450" cy="250" r="7" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><path d="M114 250 A44 44 0 0 1 110.55 267.07" stroke="#273b45" stroke-width="1.6" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M406 250 A44 44 0 0 0 409.45 267.07" stroke="#273b45" stroke-width="1.6" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="120" y="265" font-size="16" fill="#273b45" text-anchor="start"><tspan>θ</tspan></text><text x="400" y="265" font-size="16" fill="#273b45" text-anchor="end"><tspan>θ</tspan></text><text x="260" y="360" font-size="16" fill="#273b45" text-anchor="middle"><tspan>2θ</tspan></text><line x1="238" y1="250" x2="238" y2="330" stroke="#647780" stroke-width="1.5"/><line x1="245" y1="250" x2="231" y2="250" stroke="#647780" stroke-width="1.5"/><line x1="245" y1="330" x2="231" y2="330" stroke="#647780" stroke-width="1.5"/><text x="230" y="296" font-size="14" fill="#647780" text-anchor="end">Lθ/2</text><text x="250" y="402" font-size="13" fill="#b64f4f" text-anchor="middle"><tspan>plastic hinges (M</tspan><tspan dy="4" font-size="9">p</tspan><tspan dy="-4">) at the ends and the centre</tspan></text><text x="585" y="140" font-size="17" fill="#273b45" text-anchor="middle"><tspan>external work W(Lθ/2)</tspan></text><text x="585" y="174" font-size="17" fill="#273b45" text-anchor="middle"><tspan>= M</tspan><tspan dy="5" font-size="12">p</tspan><tspan dy="-5">(θ + 2θ + θ)</tspan></text><rect x="522.5" y="240" width="125" height="35" rx="7" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><text x="585" y="262" font-size="19" fill="#2b7b61" text-anchor="middle"><tspan>W</tspan><tspan dy="5" font-size="14">c</tspan><tspan dy="-5"> = 8M</tspan><tspan dy="5" font-size="14">p</tspan><tspan dy="-5">/L</tspan></text></g></svg>