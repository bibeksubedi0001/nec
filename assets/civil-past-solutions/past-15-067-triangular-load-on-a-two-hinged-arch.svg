<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Triangular load on a two-hinged parabolic arch</title><desc id="desc">A load rising from zero to w is a uniform load of w/2 plus an antisymmetric load of -w/2 to +w/2. The antisymmetric part gives no thrust, so H is that of the uniform w/2: (w/2)l squared/8h = wl squared/16h, with h the rise.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><path d="M60 300 L64.5 294.57 L69 289.27 L73.5 284.12 L78 279.1 L82.5 274.22 L87 269.48 L91.5 264.87 L96 260.4 L100.5 256.07 L105 251.88 L109.5 247.82 L114 243.9 L118.5 240.12 L123 236.48 L127.5 232.97 L132 229.6 L136.5 226.37 L141 223.27 L145.5 220.32 L150 217.5 L154.5 214.82 L159 212.27 L163.5 209.87 L168 207.6 L172.5 205.47 L177 203.48 L181.5 201.62 L186 199.9 L190.5 198.32 L195 196.88 L199.5 195.57 L204 194.4 L208.5 193.37 L213 192.48 L217.5 191.72 L222 191.1 L226.5 190.62 L231 190.27 L235.5 190.07 L240 190 L244.5 190.07 L249 190.28 L253.5 190.62 L258 191.1 L262.5 191.72 L267 192.48 L271.5 193.37 L276 194.4 L280.5 195.57 L285 196.88 L289.5 198.32 L294 199.9 L298.5 201.62 L303 203.48 L307.5 205.47 L312 207.6 L316.5 209.87 L321 212.27 L325.5 214.82 L330 217.5 L334.5 220.32 L339 223.28 L343.5 226.37 L348 229.6 L352.5 232.97 L357 236.48 L361.5 240.12 L366 243.9 L370.5 247.82 L375 251.88 L379.5 256.07 L384 260.4 L388.5 264.87 L393 269.48 L397.5 274.22 L402 279.1 L406.5 284.12 L411 289.27 L415.5 294.57 L420 300" stroke="#273b45" stroke-width="6" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="60" cy="300" r="6.5" fill="#ffffff" stroke="#273b45" stroke-width="2.5"/><circle cx="420" cy="300" r="6.5" fill="#ffffff" stroke="#273b45" stroke-width="2.5"/><line x1="38" y1="309" x2="82" y2="309" stroke="#647780" stroke-width="2"/><line x1="44" y1="310" x2="34" y2="321" stroke="#647780" stroke-width="1.4