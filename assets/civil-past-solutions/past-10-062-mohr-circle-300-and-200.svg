<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Maximum normal stress for 300 MPa tension with 200 MPa shear</title><desc id="desc">Mohr's circle for σ = 300 MPa and τ = 200 MPa has its centre at 150 MPa and radius root(150 squared + 200 squared) = 250 MPa. The major principal stress is 150 + 250 = 400 MPa.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><rect x="88" y="108" width="84" height="84" fill="#e6f1f8" stroke="#273b45" stroke-width="2"/><line x1="176" y1="150" x2="201.2" y2="150" stroke="#b64f4f" stroke-width="3"/><polygon points="210,150 199,154.5 199,145.5" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><line x1="84" y1="150" x2="58.8" y2="150" stroke="#b64f4f" stroke-width="3"/><polygon points="50,150 61,145.5 61,154.5" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="216" y="156" font-size="16" fill="#b64f4f" text-anchor="start"><tspan>300</tspan></text><line x1="96" y1="98" x2="156.8" y2="98" stroke="#2b7b61" stroke-width="2.5"/><polygon points="164,98 155,102 155,94" fill="#2b7b61" stroke="#2b7b61" stroke-width="1.5" stroke-linejoin="round"/><line x1="164" y1="202" x2="103.2" y2="202" stroke="#2b7b61" stroke-width="2.5"/><polygon points="96,202 105,198 105,206" fill="#2b7b61" stroke="#2b7b61" stroke-width="1.5" stroke-linejoin="round"/><line x1="182" y1="184" x2="182" y2="123.2" stroke="#2b7b61" stroke-width="2.5"/><polygon points="182,116 186,125 178,125" fill="#2b7b61" stroke="#2b7b61" stroke-width="1.5" stroke-linejoin="round"/><line x1="78" y1="116" x2="78" y2="176.8" stroke="#2b7b61" stroke-width="2.5"/><polygon points="78,184 74,175 82,175" fill="#2b7b61" stroke="#2b7b61" stroke-width="1.5" stroke-linejoin="round"/><text x="72" y="100" font-size="15" fill="#2b7b61" text-anchor="end"><tspan>200</tspan></text><line x1="318" y1="230" x2="621.2" y2="230" stroke="#273b45" stroke-width="1.6"/><polygon points="630,230 619,234.5 619,225.5" fill="#273b45" stroke="#273b45" stroke-width="1.5" stroke-linejoin="round"/><line x1="390" y1="379" x2="390" y2="87.8" stroke="#273b45" stroke-width="1.6"/><polygon points="390,79 394.5,90 385.5,90" fill="#273b45" stroke="#273b45" stroke-width="1.5" stroke-linejoin="round"/><text x="634" y="235" font-size="17" fill="#273b45" text-anchor="start"><tspan>σ</tspan></text><text x="382" y="83" font-size="17" fill="#273b45" text-anchor="end"><tspan>τ</tspan></text><circle cx="465" cy="230" r="125" fill="#e6f1f8" stroke="#287aab" stroke-width="2.5"/><circle cx="465" cy="230" r="3.5" fill="#287aab" stroke="#287aab" stroke-width="2"/><line x1="540" y1="130" x2="390" y2="330" stroke="#647780" stroke-width="1.5" stroke-dasharray="5 4"/><circle cx="540" cy="130" r="5" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><circle cx="390" cy="330" r="5" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><text x="548" y="122" font-size="14" fill="#b64f4f" text-anchor="start"><tspan>(300, 200)</tspan></text><circle cx="590" cy="230" r="5" fill="#2b7b61" stroke="#2b7b61" stroke-width="2"/><circle cx="340" cy="230" r="5" fill="#2b7b61" stroke="#2b7b61" stroke-width="2"/><text x="596" y="252" font-size="15" fill="#2b7b61" text-anchor="start"><tspan>σ</tspan><tspan dy="4" font-size="11">1</tspan><tspan dy="-4"> = 400</tspan></text><text x="334" y="252" font-size="14" fill="#2b7b61" text-anchor="end"><tspan>σ</tspan><tspan dy="4" font-size="10">2</tspan><tspan dy="-4"> = −100</tspan></text><text x="130" y="276" font-size="16" fill="#273b45" text-anchor="middle"><tspan>centre = 300/2 = 150</tspan></text><text x="130" y="306" font-size="16" fill="#273b45" text-anchor="middle"><tspan>R = √(150² + 200²) = 250</tspan></text><rect x="63" y="366" width="234" height="33" rx="7" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><text x="180" y="386" font-size="17" fill="#2b7b61" text-anchor="middle"><tspan>σ</tspan><tspan dy="5" font-size="12">1</tspan><tspan dy="-5"> = 150 + 250 = 400 MPa</tspan></text></g></svg>