<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Net area of a plate across a bolt hole</title><desc id="desc">A tension plate fails across the section through the bolt hole, where the hole removes d times t of material. The net area is (400 - 18) x 10 = 3820 mm squared = 38.2 cm squared.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><rect x="90" y="110" width="300" height="240" fill="#e6f1f8" stroke="#273b45" stroke-width="2.5"/><line x1="240" y1="96" x2="240" y2="364" stroke="#b64f4f" stroke-width="1.8" stroke-dasharray="8 5"/><circle cx="240" cy="230" r="10" fill="#ffffff" stroke="#273b45" stroke-width="2"/><line x1="84" y1="230" x2="38.8" y2="230" stroke="#b64f4f" stroke-width="3.5"/><polygon points="30,230 41,225.5 41,234.5" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><line x1="396" y1="230" x2="441.2" y2="230" stroke="#b64f4f" stroke-width="3.5"/><polygon points="450,230 439,234.5 439,225.5" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="52" y="218" font-size="16" fill="#b64f4f" text-anchor="middle"><tspan>P</tspan></text><text x="428" y="218" font-size="16" fill="#b64f4f" text-anchor="middle"><tspan>P</tspan></text><line x1="120" y1="110" x2="120" y2="350" stroke="#647780" stroke-width="1.5"/><line x1="127" y1="110" x2="113" y2="110" stroke="#647780" stroke-width="1.5"/><line x1="127" y1="350" x2="113" y2="350" stroke="#647780" stroke-width="1.5"/><text x="130" y="204" font-size="14" fill="#273b45" text-anchor="start"><tspan>b = 400 mm</tspan></text><text x="130" y="224" font-size="14" fill="#273b45" text-anchor="start"><tspan>t = 10 mm</tspan></text><text x="256" y="262" font-size="14" fill="#273b45" text-anchor="start"><tspan>hole 18 mm</tspan></text><text x="240" y="86" font-size="14" fill="#b64f4f" text-anchor="middle"><tspan>section through the hole</tspan></text><text x="585" y="140" font-size="17" fill="#273b45" text-anchor="middle"><tspan>A</tspan><tspan dy="5" font-size="12">net</tspan><tspan dy="-5"> = (b − d</tspan><tspan dy="5" font-size="12">h</tspan><tspan dy="-5">)t</tspan></text><text x="585" y="172" font-size="17" fill="#273b45" text-anchor="middle"><tspan>= (400 − 18) × 10</tspan></text><text x="585" y="204" font-size="17" fill="#273b45" text-anchor="middle"><tspan>= 3820 mm²</tspan></text><rect x="532" y="250" width="106" height="35" rx="7" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><text x="585" y="272" font-size="19" fill="#2b7b61" text-anchor="middle"><tspan>38.2 cm²</tspan></text></g></svg>