<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">An influence line: the section stays fixed while the load moves</title><desc id="desc">An influence line gives one response, here the moment at a fixed section C, as a unit load moves across the span. Each ordinate is the value at C when the unit load stands directly above that point.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="70" y1="130" x2="470" y2="130" stroke="#273b45" stroke-width="6"/><polygon points="70,135 55,159 85,159" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><line x1="48" y1="162" x2="92" y2="162" stroke="#647780" stroke-width="2"/><polygon points="470,135 455,156 485,156" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><circle cx="462" cy="162" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><circle cx="478" cy="162" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><line x1="448" y1="169" x2="492" y2="169" stroke="#647780" stroke-width="2"/><line x1="230" y1="110" x2="230" y2="180" stroke="#2b7b61" stroke-width="2" stroke-dasharray="5 4"/><text x="238" y="180" font-size="14" fill="#2b7b61" text-anchor="start"><tspan>C, fixed</tspan></text><line x1="130" y1="86" x2="130" y2="113.2" stroke="#b64f4f" stroke-width="2.5" stroke-dasharray="5 3"/><polygon points="130,122 125.5,111 134.5,111" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="130" y="78" font-size="15" fill="#b64f4f" text-anchor="middle"><tspan>1</tspan></text><line x1="318" y1="86" x2="318" y2="113.2" stroke="#b64f4f" stroke-width="2.5" stroke-dasharray="5 3"/><polygon points="318,122 313.5,111 322.5,111" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="318" y="78" font-size="15" fill="#b64f4f" text-anchor="middle"><tspan>1</tspan></text><line x1="410" y1="86" x2="410" y2="113.2" stroke="#b64f4f" stroke-width="2.5" stroke-dasharray="5 3"/><polygon points="410,122 405.5,111 414.5,111" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="410" y="78" font-size="15" fill="#b64f4f" text-anchor="middle"><tspan>1</tspan></text><line x1="142" y1="64" x2="389.2" y2="64" stroke="#647780" stroke-width="2"/><polygon points="398,64 387,68.5 387,59.5" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><text x="270" y="56" font-size="14" fill="#647780" text-anchor="middle"><tspan>unit load moves</tspan></text><polygon points="70,330 70,330 230,220 470,330 470,330" fill="#e6f1f8" stroke="none" stroke-width="2" stroke-linejoin="round"/><path d="M70 330 L230 220 L470 330" stroke="#287aab" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="70" y1="330" x2="470" y2="330" stroke="#273b45" stroke-width="1.5"/><text x="58" y="335" font-size="14" fill="#647780" text-anchor="end"><tspan>ILD M</tspan><tspan dy="4" font-size="10">C</tspan></text><line x1="130" y1="330" x2="130" y2="288.75" stroke="#b64f4f" stroke-width="2"/><circle cx="130" cy="288.75" r="4" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><line x1="318" y1="330" x2="318" y2="260.33" stroke="#b64f4f" stroke-width="2"/><circle cx="318" cy="260.33" r="4" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><line x1="410" y1="330" x2="410" y2="302.5" stroke="#b64f4f" stroke-width="2"/><circle cx="410" cy="302.5" r="4" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><rect x="493" y="231" width="214" height="32" rx="7" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><text x="600" y="250" font-size="16" fill="#2b7b61" text-anchor="middle"><tspan>point fixed, load moves</tspan></text></g></svg>