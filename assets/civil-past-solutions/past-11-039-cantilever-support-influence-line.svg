<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Influence line for the reaction and shear at a cantilever support</title><desc id="desc">Wherever the unit load stands on a cantilever, the whole of it goes to the fixed support, so the reaction and the support shear are always 1. The influence line is a rectangle of unit height over the length.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="90" y1="100" x2="90" y2="160" stroke="#273b45" stroke-width="3"/><line x1="90" y1="104" x2="79" y2="114" stroke="#647780" stroke-width="1.4"/><line x1="90" y1="116" x2="79" y2="126" stroke="#647780" stroke-width="1.4"/><line x1="90" y1="128" x2="79" y2="138" stroke="#647780" stroke-width="1.4"/><line x1="90" y1="140" x2="79" y2="150" stroke="#647780" stroke-width="1.4"/><line x1="90" y1="152" x2="79" y2="162" stroke="#647780" stroke-width="1.4"/><line x1="90" y1="130" x2="450" y2="130" stroke="#273b45" stroke-width="6"/><line x1="162" y1="86" x2="162" y2="113.2" stroke="#b64f4f" stroke-width="2.5" stroke-dasharray="5 3"/><polygon points="162,122 157.5,111 166.5,111" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="162" y="78" font-size="15" fill="#b64f4f" text-anchor="middle"><tspan>1</tspan></text><line x1="288" y1="86" x2="288" y2="113.2" stroke="#b64f4f" stroke-width="2.5" stroke-dasharray="5 3"/><polygon points="288,122 283.5,111 292.5,111" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="288" y="78" font-size="15" fill="#b64f4f" text-anchor="middle"><tspan>1</tspan></text><line x1="414" y1="86" x2="414" y2="113.2" stroke="#b64f4f" stroke-width="2.5" stroke-dasharray="5 3"/><polygon points="414,122 409.5,111 418.5,111" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="414" y="78" font-size="15" fill="#b64f4f" text-anchor="middle"><tspan>1</tspan></text><polygon points="90,320 90,210 450,210 450,320" fill="#e6f1f8" stroke="none" stroke-width="2" stroke-linejoin="round"/><path d="M90 210 L450 210" stroke="#287aab" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="90" y1="320" x2="450" y2="320" stroke="#273b45" stroke-width="1.5"/><text x="78" y="325" font-size="14" fill="#647780" text-anchor="end"><tspan>ILD R</tspan><tspan dy="4" font-size="10">A</tspan></text><text x="270" y="200" font-size="15" fill="#287aab" text-anchor="middle"><tspan>1 for every position</tspan></text><rect x="542.25" y="240" width="115.5" height="35" rx="7" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><text x="600" y="262" font-size="19" fill="#2b7b61" text-anchor="middle"><tspan>rectangle</tspan></text></g></svg>