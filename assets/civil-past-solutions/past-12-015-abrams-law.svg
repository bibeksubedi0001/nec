<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Abrams' law: strength falls as the water-cement ratio rises</title><desc id="desc">Once the concrete has enough water to be fully compacted, strength follows Abrams' law, f = A/B to the power w/c. Any further water raises the w/c ratio, leaves more capillary pores when it dries out, and lowers the strength.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="70" y1="340" x2="431.2" y2="340" stroke="#273b45" stroke-width="1.6"/><polygon points="440,340 429,344.5 429,335.5" fill="#273b45" stroke="#273b45" stroke-width="1.5" stroke-linejoin="round"/><line x1="70" y1="340" x2="70" y2="108.8" stroke="#273b45" stroke-width="1.6"/><polygon points="70,100 74.5,111 65.5,111" fill="#273b45" stroke="#273b45" stroke-width="1.5" stroke-linejoin="round"/><text x="440" y="384" font-size="14" fill="#647780" text-anchor="end"><tspan>w/c ratio</tspan></text><text x="80" y="108" font-size="14" fill="#647780" text-anchor="start"><tspan>strength</tspan></text><path d="M90 124.69 L93.4 126.78 L96.8 128.84 L100.2 130.89 L103.6 132.91 L107 134.92 L110.4 136.9 L113.8 138.87 L117.2 140.82 L120.6 142.74 L124 144.65 L127.4 146.55 L130.8 148.42 L134.2 150.27 L137.6 152.11 L141 153.93 L144.4 155.73 L147.8 157.52 L151.2 159.28 L154.6 161.03 L158 162.77 L161.4 164.48 L164.8 166.18 L168.2 167.86 L171.6 169.53 L175 171.18 L178.4 172.82 L181.8 174.43 L185.2 176.04 L188.6 177.63 L192 179.2 L195.4 180.75 L198.8 182.3 L202.2 183.82 L205.6 185.34 L209 186.83 L212.4 188.32 L215.8 189.78 L219.2 191.24 L222.6 192.68 L226 194.11 L229.4 195.52 L232.8 196.92 L236.2 198.3 L239.6 199.67 L243 201.03 L246.4 202.38 L249.8 203.71 L253.2 205.03 L256.6 206.34 L260 207.63 L263.4 208.91 L266.8 210.18 L270.2 211.44 L273.6 212.68 L277 213.92 L280.4 215.14 L283.8 216.35 L287.2 217.54 L290.6 218.73 L294 219.9 L297.4 221.07 L300.8 222.22 L304.2 223.36 L307.6 224.49 L311 225.61 L314.4 226.71 L317.8 227.81 L321.2 228.9 L324.6 229.97 L328 231.04 L331.4 232.09 L334.8 233.14 L338.2 234.17 L341.6 235.2 L345 236.21 L348.4 237.22 L351.8 238.21 L355.2 239.2 L358.6 240.17 L362 241.14 L365.4 242.1 L368.8 243.05 L372.2 243.98 L375.6 244.91 L379 245.83 L382.4 246.75 L385.8 247.65 L389.2 248.54 L392.6 249.43 L396 250.31 L399.4 251.17 L402.8 252.03 L406.2 252.89 L409.6 253.73 L413 254.56 L416.4 255.39 L419.8 256.21 L423.2 257.02 L426.6 257.83 L430 258.62" stroke="#287aab" stroke-width="3.2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="158" y="360" font-size="14" fill="#273b45" text-anchor="middle"><tspan>0.4</tspan></text><text x="294" y="360" font-size="14" fill="#273b45" text-anchor="middle"><tspan>0.6</tspan></text><text x="430" y="360" font-size="14" fill="#273b45" text-anchor="middle"><tspan>0.8</tspan></text><circle cx="192" cy="179.2" r="6" fill="#2b7b61" stroke="#2b7b61" stroke-width="2"/><text x="202" y="163.2" font-size="14" fill="#2b7b61" text-anchor="start"><tspan>enough water for workability</tspan></text><path d="M205.6 207.34 Q280.4 249.14 362 265.14" stroke="#b64f4f" stroke-width="2.6" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="362,265.14 350.34,267.44 352.07,258.61" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="294" y="283.9" font-size="14" fill="#b64f4f" text-anchor="middle"><tspan>more water: more pores</tspan></text><text x="585" y="150" font-size="17" fill="#273b45" text-anchor="middle"><tspan>f = A/B</tspan><tspan dy="-7" font-size="12">w/c</tspan></text><text x="585" y="184" font-size="17" fill="#273b45" text-anchor="middle"><tspan>w/c up: strength down</tspan></text><rect x="484.5" y="240" width="201" height="35" rx="7" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><text x="585" y="262" font-size="19" fill="#2b7b61" text-anchor="middle"><tspan>strength decreases</tspan></text></g></svg>