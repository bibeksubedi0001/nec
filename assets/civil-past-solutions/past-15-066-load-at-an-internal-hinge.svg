<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">A load applied exactly at the internal hinge</title><desc id="desc">The load of 10 kN sits on the hinge at l/3. The part from the hinge to B carries no load and the hinge passes no moment, so that part is unloaded and RB = 0. The part AH works as a cantilever and the fixed end takes the whole 10 kN.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="90" y1="110" x2="450" y2="110" stroke="#273b45" stroke-width="7"/><line x1="90" y1="76" x2="90" y2="144" stroke="#273b45" stroke-width="3"/><line x1="90" y1="80" x2="79" y2="90" stroke="#647780" stroke-width="1.4"/><line x1="90" y1="92" x2="79" y2="102" stroke="#647780" stroke-width="1.4"/><line x1="90" y1="104" x2="79" y2="114" stroke="#647780" stroke-width="1.4"/><line x1="90" y1="116" x2="79" y2="126" stroke="#647780" stroke-width="1.4"/><line x1="90" y1="128" x2="79" y2="138" stroke="#647780" stroke-width="1.4"/><line x1="90" y1="140" x2="79" y2="150" stroke="#647780" stroke-width="1.4"/><polygon points="450,115 435,136 465,136" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><circle cx="442" cy="142" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><circle cx="458" cy="142" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><line x1="428" y1="149" x2="472" y2="149" stroke="#647780" stroke-width="2"/><circle cx="210" cy="110" r="6" fill="#ffffff" stroke="#273b45" stroke-width="2.5"/><line x1="210" y1="58" x2="210" y2="97.2" stroke="#b64f4f" stroke-width="3.5"/><polygon points="210,106 205.5,95 214.5,95" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="210" y="49" font-size="16" fill="#b64f4f" text-anchor="middle"><tspan>10 kN</tspan></text><line x1="90" y1="170" x2="210" y2="170" stroke="#647780" stroke-width="1.5"/><line x1="90" y1="163" x2="90" y2="177" stroke="#647780" stroke-width="1.5"/><line x1="210" y1="163" x2="210" y2="177" stroke="#647780" stroke-width="1.5"/><text x="150" y="196" font-size="14" fill="#647780" text-anchor="middle">l/3</text><text x="210" y="142" font-size="15" fill="#647780" text-anchor="middle"><tspan>H</tspan></text><line x1="90" y1="256" x2="90" y2="304" stroke="#273b45" stroke-width="3"/><line x1="90" y1="260" x2="79" y2="270" stroke="#647780" stroke-width="1.4"/><line x1="90" y1="272" x2="79" y2="282" stroke="#647780" stroke-width="1.4"/><line x1="90" y1="284" x2="79" y2="294" stroke="#647780" stroke-width="1.4"/><line x1="90" y1="296" x2="79" y2="306" stroke="#647780" stroke-width="1.4"/><line x1="90" y1="280" x2="200" y2="280" stroke="#273b45" stroke-width="6"/><line x1="200" y1="236" x2="200" y2="267.2" stroke="#b64f4f" stroke-width="3.5"/><polygon points="200,276 195.5,265 204.5,265" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="200" y="226" font-size="14" fill="#b64f4f" text-anchor="middle">10 kN</text><text x="145" y="330" font-size="14" fill="#647780" text-anchor="middle"><tspan>AH: cantilever</tspan></text><line x1="260" y1="280" x2="450" y2="280" stroke="#273b45" stroke-width="6"/><circle cx="260" cy="280" r="6" fill="#ffffff" stroke="#273b45" stroke-width="2.5"/><polygon points="450,285 435,306 465,306" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><circle cx="442" cy="312" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><circle cx="458" cy="312" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><line x1="428" y1="319" x2="472" y2="319" stroke="#647780" stroke-width="2"/><text x="355" y="262" font-size="14" fill="#647780" text-anchor="middle"><tspan>no load</tspan></text><text x="450" y="346" font-size="16" fill="#287aab" text-anchor="middle"><tspan>R</tspan><tspan dy="4" font-size="12">B</tspan><tspan dy="-4"> = 0</tspan></text><text x="590" y="150" font-size="16" fill="#273b45" text-anchor="middle"><tspan>HB carries nothing</tspan></text><text x="590" y="184" font-size="16" fill="#273b45" text-anchor="middle"><tspan>hinge: no moment</tspan></text><rect x="532.25" y="240" width="115.5" height="35" rx="7" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><text x="590" y="262" font-size="19" fill="#2b7b61" text-anchor="middle"><tspan>R</tspan><tspan dy="5" font-size="14">B</tspan><tspan dy="-5"> = 0 kN</tspan></text></g></svg>