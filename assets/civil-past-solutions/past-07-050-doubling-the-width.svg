<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Doubling the width of a beam halves its deflection</title><desc id="desc">The central deflection is WL cubed/48EI. The moment of inertia bd cubed/12 is proportional to the width b, so doubling b doubles I and halves the deflection.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="70" y1="120" x2="410" y2="120" stroke="#647780" stroke-width="1.5" stroke-dasharray="6 5"/><path d="M70 120 L75.67 122 L81.33 123.99 L87 125.98 L92.67 127.95 L98.33 129.91 L104 131.84 L109.67 133.75 L115.33 135.62 L121 137.46 L126.67 139.26 L132.33 141.01 L138 142.72 L143.67 144.37 L149.33 145.97 L155 147.5 L160.67 148.97 L166.33 150.36 L172 151.68 L177.67 152.92 L183.33 154.07 L189 155.14 L194.67 156.11 L200.33 156.99 L206 157.76 L211.67 158.43 L217.33 158.98 L223 159.42 L228.67 159.74 L234.33 159.93 L240 160 L245.67 159.93 L251.33 159.74 L257 159.42 L262.67 158.98 L268.33 158.43 L274 157.76 L279.67 156.99 L285.33 156.11 L291 155.14 L296.67 154.07 L302.33 152.92 L308 151.68 L313.67 150.36 L319.33 148.97 L325 147.5 L330.67 145.97 L336.33 144.37 L342 142.72 L347.67 141.01 L353.33 139.26 L359 137.46 L364.67 135.62 L370.33 133.75 L376 131.84 L381.67 129.91 L387.33 127.95 L393 125.98 L398.67 123.99 L404.33 122 L410 120" stroke="#287aab" stroke-width="4.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="70,125 55,149 85,149" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><line x1="48" y1="152" x2="92" y2="152" stroke="#647780" stroke-width="2"/><polygon points="410,125 395,146 425,146" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><circle cx="402" cy="152" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><circle cx="418" cy="152" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><line x1="388" y1="159" x2="432" y2="159" stroke="#647780" stroke-width="2"/><line x1="240" y1="112" x2="240" y2="147.2" stroke="#b64f4f" stroke-width="3.5"/><polygon points="240,156 235.5,145 244.5,145" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="240" y="102" font-size="16" fill="#b64f4f" text-anchor="middle">W</text><rect x="90" y="240" width="40" height="90" fill="#d6dfe3" stroke="#273b45" stroke-width="2"/><line x1="90" y1="346" x2="130" y2="346" stroke="#647780" stroke-width="1.5"/><line x1="90" y1="339" x2="90" y2="353" stroke="#647780" stroke-width="1.5"/><line x1="130" y1="339" x2="130" y2="353" stroke="#647780" stroke-width="1.5"/><text x="110" y="372" font-size="14" fill="#647780" text-anchor="middle">b</text><text x="110" y="226" font-size="16" fill="#273b45" text-anchor="middle"><tspan>I</tspan></text><rect x="240" y="240" width="80" height="90" fill="#e6f1f8" stroke="#273b45" stroke-width="2"/><line x1="240" y1="346" x2="320" y2="346" stroke="#647780" stroke-width="1.5"/><line x1="240" y1="339" x2="240" y2="353" stroke="#647780" stroke-width="1.5"/><line x1="320" y1="339" x2="320" y2="353" stroke="#647780" stroke-width="1.5"/><text x="280" y="372" font-size="14" fill="#647780" text-anchor="middle">2b</text><text x="280" y="226" font-size="16" fill="#287aab" text-anchor="middle"><tspan>2I</tspan></text><line x1="346" y1="240" x2="346" y2="330" stroke="#647780" stroke-width="1.5"/><line x1="353" y1="240" x2="339" y2="240" stroke="#647780" stroke-width="1.5"/><line x1="353" y1="330" x2="339" y2="330" stroke="#647780" stroke-width="1.5"/><text x="352" y="291" font-size="14" fill="#647780" text-anchor="start">d</text><text x="580" y="150" font-size="17" fill="#273b45" text-anchor="middle"><tspan>δ = WL³/48EI</tspan></text><text x="580" y="184" font-size="17" fill="#273b45" text-anchor="middle"><tspan>I = bd³/12 ∝ b</tspan></text><rect x="512.75" y="240" width="134.5" height="35" rx="7" fill="#deeee6" stroke="#2b