<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">A truss with 8 joints and 11 members needs 2 more members</title><desc id="desc">A stable simple plane truss needs m = 2j - 3 members. With 8 joints that is 13, so a truss with only 11 members has two panels without diagonals that can sway; two more diagonals make it stable.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="60" y1="300" x2="180" y2="300" stroke="#466d89" stroke-width="5"/><line x1="60" y1="180" x2="180" y2="180" stroke="#466d89" stroke-width="5"/><line x1="180" y1="300" x2="300" y2="300" stroke="#466d89" stroke-width="5"/><line x1="180" y1="180" x2="300" y2="180" stroke="#466d89" stroke-width="5"/><line x1="300" y1="300" x2="420" y2="300" stroke="#466d89" stroke-width="5"/><line x1="300" y1="180" x2="420" y2="180" stroke="#466d89" stroke-width="5"/><line x1="60" y1="300" x2="60" y2="180" stroke="#466d89" stroke-width="5"/><line x1="180" y1="300" x2="180" y2="180" stroke="#466d89" stroke-width="5"/><line x1="300" y1="300" x2="300" y2="180" stroke="#466d89" stroke-width="5"/><line x1="420" y1="300" x2="420" y2="180" stroke="#466d89" stroke-width="5"/><line x1="60" y1="300" x2="180" y2="180" stroke="#466d89" stroke-width="5"/><line x1="180" y1="300" x2="300" y2="180" stroke="#b64f4f" stroke-width="3" stroke-dasharray="8 6"/><line x1="300" y1="300" x2="420" y2="180" stroke="#b64f4f" stroke-width="3" stroke-dasharray="8 6"/><circle cx="60" cy="300" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><circle cx="180" cy="300" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><circle cx="300" cy="300" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><circle cx="420" cy="300" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><circle cx="60" cy="180" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><circle cx="180" cy="180" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><circle cx="300" cy="180" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><circle cx="420" cy="180" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><polygon points="60,305 45,329 75,329" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><line x1="38" y1="332" x2="82" y2="332" stroke="#647780" stroke-width="2"/><polygon points="420,305 405,326 435,326" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><circle cx="412" cy="332" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><circle cx="428" cy="332" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><line x1="398" y1="339" x2="442" y2="339" stroke="#647780" stroke-width="2"/><text x="300" y="160" font-size="14" fill="#b64f4f" text-anchor="middle"><tspan>add 2 diagonals</tspan></text><text x="240" y="372" font-size="14" fill="#647780" text-anchor="middle"><tspan>j = 8, m = 11 (solid)</tspan></text><text x="585" y="140" font-size="17" fill="#273b45" text-anchor="middle"><tspan>stable: m = 2j − 3</tspan></text><text x="585" y="172" font-size="17" fill="#273b45" text-anchor="middle"><tspan>= 2 × 8 − 3 = 13</tspan></text><text x="585" y="204" font-size="17" fill="#273b45" text-anchor="middle"><tspan>13 − 11 = 2</tspan></text><rect x="503.5" y="240" width="163" height="35" rx="7" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><text x="585" y="262" font-size="19" fill="#2b7b61" text-anchor="middle"><tspan>2 more members</tspan></text></g></svg>