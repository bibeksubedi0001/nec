<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Why shear stress peaks at the neutral axis</title><desc id="desc">τ = VQ/Ib, where Q is the first moment of the area beyond the level considered. Q grows as the level moves in from the edge and is largest at the neutral axis, so the shear stress is maximum there and zero at the top and bottom.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><rect x="90" y="100" width="110" height="220" fill="#d6dfe3" stroke="#273b45" stroke-width="2"/><rect x="90" y="100" width="110" height="110" fill="#f5ead8" stroke="#b98232" stroke-width="2"/><line x1="70" y1="210" x2="220" y2="210" stroke="#647780" stroke-width="1.2" stroke-dasharray="6 4"/><text x="226" y="214" font-size="13" fill="#647780" text-anchor="start">NA</text><text x="145" y="160" font-size="17" fill="#b98232" text-anchor="middle"><tspan>A′</tspan></text><circle cx="145" cy="180" r="3.5" fill="#b98232" stroke="#b98232" stroke-width="2"/><line x1="214" y1="180" x2="214" y2="210" stroke="#647780" stroke-width="1.5"/><line x1="218" y1="180" x2="210" y2="180" stroke="#647780" stroke-width="1.5"/><line x1="218" y1="210" x2="210" y2="210" stroke="#647780" stroke-width="1.5"/><text x="222" y="198" font-size="15" fill="#b98232" text-anchor="start"><tspan>ȳ</tspan></text><polygon points="290,100 290,100 299.75,105.5 309,111 317.75,116.5 326,122 333.75,127.5 341,133 347.75,138.5 354,144 359.75,149.5 365,155 369.75,160.5 374,166 377.75,171.5 381,177 383.75,182.5 386,188 387.75,193.5 389,199 389.75,204.5 390,210 389.75,215.5 389,221 387.75,226.5 386,232 383.75,237.5 381,243 377.75,248.5 374,254 369.75,259.5 365,265 359.75,270.5 354,276 347.75,281.5 341,287 333.75,292.5 326,298 317.75,303.5 309,309 299.75,314.5 290,320 290,320" fill="#deeee6" stroke="#2b7b61" stroke-width="2" stroke-linejoin="round"/><text x="396" y="216" font-size="16" fill="#2b7b61" text-anchor="start"><tspan>τ</tspan><tspan dy="4" font-size="12">max</tspan></text><text x="575" y="140" font-size="16" fill="#273b45" text-anchor="middle"><tspan>τ = VQ/Ib</tspan></text><text x="575" y="174" font-size="16" fill="#273b45" text-anchor="middle"><tspan>Q = A′ȳ, largest at the NA</tspan></text><rect x="479.25" y="240" width="191.5" height="35" rx="7" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><text x="575" y="262" font-size="19" fill="#2b7b61" text-anchor="middle"><tspan>maximum at the NA</tspan></text></g></svg>