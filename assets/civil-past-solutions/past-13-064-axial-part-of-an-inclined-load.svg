<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Axial and transverse parts of an inclined load</title><desc id="desc">A 20 kN load at 30 degrees to the horizontal beam has an axial component 20 cos 30 = 17.32 kN, taken by the pinned support, and a transverse component 20 sin 30 = 10 kN that bends the beam.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="70" y1="170" x2="440" y2="170" stroke="#273b45" stroke-width="7"/><polygon points="70,175 55,199 85,199" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><line x1="48" y1="202" x2="92" y2="202" stroke="#647780" stroke-width="2"/><polygon points="440,175 425,196 455,196" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><circle cx="432" cy="202" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><circle cx="448" cy="202" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><line x1="418" y1="209" x2="462" y2="209" stroke="#647780" stroke-width="2"/><line x1="178.24" y1="111" x2="265.88" y2="161.6" stroke="#b64f4f" stroke-width="3.5"/><polygon points="273.5,166 261.72,164.4 266.22,156.6" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="172.24" y="103" font-size="16" fill="#b64f4f" text-anchor="end"><tspan>20 kN</tspan></text><line x1="178.24" y1="111" x2="264.7" y2="111" stroke="#287aab" stroke-width="2.5" stroke-dasharray="5 4"/><polygon points="273.5,111 262.5,115.5 262.5,106.5" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><line x1="273.5" y1="111" x2="273.5" y2="157.2" stroke="#2b7b61" stroke-width="2.5" stroke-dasharray="5 4"/><polygon points="273.5,166 269,155 278,155" fill="#2b7b61" stroke="#2b7b61" stroke-width="1.5" stroke-linejoin="round"/><text x="225.87" y="101" font-size="15" fill="#287aab" text-anchor="middle"><tspan>17.32 kN</tspan></text><text x="283.5" y="142.5" font-size="15" fill="#2b7b61" text-anchor="start"><tspan>10 kN</tspan></text><path d="M233.5 166 A40 40 0 0 1 238.86 146" stroke="#b98232" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="221.5" y="160" font-size="14" fill="#b98232" text-anchor="end"><tspan>30°</tspan></text><line x1="64" y1="222" x2="26.8" y2="222" stroke="#287aab" stroke-width="3"/><polygon points="18,222 29,217.5 29,226.5" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><text x="40" y="246" font-size="15" fill="#287aab" text-anchor="middle"><tspan>H</tspan><tspan dy="4" font-size="11">A</tspan></text><text x="255" y="300" font-size="15" fill="#647780" text-anchor="middle">the pin at A takes the axial force</text><text x="590" y="150" font-size="16" fill="#273b45" text-anchor="middle"><tspan>axial = 20 cos 30°</tspan></text><text x="590" y="184" font-size="16" fill="#273b45" text-anchor="middle"><tspan>transverse = 20 sin 30° = 10 kN</tspan></text><rect x="481.5" y="242" width="217" height="33" rx="7" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><text x="590" y="262" font-size="17" fill="#2b7b61" text-anchor="middle"><tspan>axial force = 17.32 kN</tspan></text></g></svg>