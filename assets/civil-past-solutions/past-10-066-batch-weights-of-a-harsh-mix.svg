<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Batch weights for a harsh mix at a water-cement ratio of 0.6</title><desc id="desc">The batch has 50 + 100 = 150 kg of aggregate. A harsh mix at w/c 0.6 has an aggregate-cement ratio of about 7.5, so the cement is 150/7.5 = 20 kg and the water is 0.6 x 20 = 12 kg.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><rect x="150" y="110" width="120" height="30" fill="#f0e6d4" stroke="#b98232" stroke-width="2"/><text x="140" y="131" font-size="15" fill="#273b45" text-anchor="end"><tspan>fine aggregate</tspan></text><text x="278" y="131" font-size="15" fill="#273b45" text-anchor="start"><tspan>50 kg</tspan></text><rect x="150" y="164" width="240" height="30" fill="#f0e6d4" stroke="#b98232" stroke-width="2"/><text x="140" y="185" font-size="15" fill="#273b45" text-anchor="end"><tspan>coarse aggregate</tspan></text><text x="398" y="185" font-size="15" fill="#273b45" text-anchor="start"><tspan>100 kg</tspan></text><rect x="150" y="218" width="48" height="30" fill="#d6dfe3" stroke="#8a9aa3" stroke-width="2"/><text x="140" y="239" font-size="15" fill="#273b45" text-anchor="end"><tspan>cement</tspan></text><text x="206" y="239" font-size="15" fill="#273b45" text-anchor="start"><tspan>20 kg</tspan></text><rect x="150" y="272" width="28.8" height="30" fill="#d8edf7" stroke="#287aab" stroke-width="2"/><text x="140" y="293" font-size="15" fill="#273b45" text-anchor="end"><tspan>water</tspan></text><text x="186.8" y="293" font-size="15" fill="#2b7b61" text-anchor="start"><tspan>12 kg</tspan></text><line x1="150" y1="96" x2="150" y2="316" stroke="#273b45" stroke-width="1.5"/><text x="250" y="350" font-size="14" fill="#647780" text-anchor="middle"><tspan>harsh mix at w/c 0.6: aggregate/cement ≈ 7.5</tspan></text><text x="585" y="140" font-size="16" fill="#273b45" text-anchor="middle"><tspan>aggregate = 50 + 100 = 150 kg</tspan></text><text x="585" y="172" font-size="16" fill="#273b45" text-anchor="middle"><tspan>cement = 150/7.5 = 20 kg</tspan></text><text x="585" y="204" font-size="16" fill="#273b45" text-anchor="middle"><tspan>water = 0.6 × 20</tspan></text><rect x="508.25" y="250" width="153.5" height="35" rx="7" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><text x="585" y="272" font-size="19" fill="#2b7b61" text-anchor="middle"><tspan>water = 12 kg</tspan></text></g></svg>