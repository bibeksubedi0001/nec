<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Determinate structures have straight-line influence lines</title><desc id="desc">By the Müller-Breslau principle an influence line is the deflected shape after releasing the restraint. In a determinate structure the release leaves a mechanism of rigid parts, so the influence line is made of straight lines. An indeterminate structure bends, giving curves.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="50" y1="110" x2="330" y2="110" stroke="#273b45" stroke-width="5"/><polygon points="50,115 35,139 65,139" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><line x1="28" y1="142" x2="72" y2="142" stroke="#647780" stroke-width="2"/><polygon points="330,115 315,136 345,136" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><circle cx="322" cy="142" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><circle cx="338" cy="142" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><line x1="308" y1="149" x2="352" y2="149" stroke="#647780" stroke-width="2"/><polygon points="50,250 50,250 162,286 162,250" fill="#f2dfdf" stroke="none" stroke-width="2" stroke-linejoin="round"/><path d="M50 250 L162 286" stroke="#b64f4f" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="50" y1="250" x2="162" y2="250" stroke="#273b45" stroke-width="1.5"/><polygon points="162,250 162,196 330,250 330,250" fill="#e6f1f8" stroke="none" stroke-width="2" stroke-linejoin="round"/><path d="M162 196 L330 250" stroke="#287aab" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="162" y1="250" x2="330" y2="250" stroke="#273b45" stroke-width="1.5"/><text x="190" y="330" font-size="14" fill="#647780" text-anchor="middle">determinate: straight lines</text><line x1="400" y1="110" x2="680" y2="110" stroke="#273b45" stroke-width="5"/><line x1="400" y1="86" x2="400" y2="134" stroke="#273b45" stroke-width="3"/><line x1="400" y1="90" x2="389" y2="100" stroke="#647780" stroke-width="1.4"/><line x1="400" y1="102" x2="389" y2="112" stroke="#647780" stroke-width="1.4"/><line x1="400" y1="114" x2="389" y2="124" stroke="#647780" stroke-width="1.4"/><line x1="400" y1="126" x2="389" y2="136" stroke="#647780" stroke-width="1.4"/><polygon points="680,115 665,136 695,136" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><circle cx="672" cy="142" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><circle cx="688" cy="142" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><line x1="658" y1="149" x2="702" y2="149" stroke="#647780" stroke-width="2"/><polygon points="400,250 400,250 407,249.92 414,249.67 421,249.26 428,248.7 435,247.98 442,247.11 449,246.11 456,244.96 463,243.68 470,242.27 477,240.73 484,239.07 491,237.29 498,235.39 505,233.39 512,231.28 519,229.07 526,226.76 533,224.36 540,221.88 547,219.3 554,216.65 561,213.92 568,211.12 575,208.25 582,205.32 589,202.33 596,199.29 603,196.19 610,193.05 617,189.86 624,186.64 631,183.38 638,180.1 645,176.79 652,173.46 659,170.11 666,166.74 673,163.37 680,160 680,250" fill="#e6f1f8" stroke="none" stroke-width="2" stroke-linejoin="round"/><path d="M400 250 L407 249.92 L414 249.67 L421 249.26 L428 248.7 L435 247.98 L442 247.11 L449 246.11 L456 244.96 L463 243.68 L470 242.27 L477 240.73 L484 239.07 L491 237.29 L498 235.39 L505 233.39 L512 231.28 L519 229.07 L526 226.76 L533 224.36 L540 221.88 L547 219.3 L554 216.65 L561 213.92 L568 211.12 L575 208.25 L582 205.32 L589 202.33 L596 199.29 L603 196.19 L610 193.05 L617 189.86 L624 186.64 L631 183.38 L638 180.1 L645 176.79 L652 173.46 L659 170.11 L666 166.74 L673 163.37 L680 160" stroke="#287aab" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="400" y1="250" x2="680" y2=