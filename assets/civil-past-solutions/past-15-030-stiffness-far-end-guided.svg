<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Moment needed to rotate the near end with a guided far end</title><desc id="desc">When the far end B can slide sideways but cannot rotate, the member carries no shear, so its moment is constant along the length. A unit rotation at A then needs only EI/L, compared with 4EI/L for a fixed far end.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="80" y1="200" x2="420" y2="200" stroke="#b8c8ce" stroke-width="6"/><path d="M80 200 L84.25 201.37 L88.5 202.72 L92.75 204.05 L97 205.36 L101.25 206.66 L105.5 207.94 L109.75 209.2 L114 210.45 L118.25 211.68 L122.5 212.89 L126.75 214.09 L131 215.26 L135.25 216.42 L139.5 217.57 L143.75 218.69 L148 219.8 L152.25 220.89 L156.5 221.97 L160.75 223.02 L165 224.06 L169.25 225.09 L173.5 226.09 L177.75 227.08 L182 228.05 L186.25 229 L190.5 229.94 L194.75 230.86 L199 231.76 L203.25 232.65 L207.5 233.52 L211.75 234.37 L216 235.2 L220.25 236.02 L224.5 236.82 L228.75 237.6 L233 238.36 L237.25 239.11 L241.5 239.84 L245.75 240.55 L250 241.25 L254.25 241.93 L258.5 242.59 L262.75 243.24 L267 243.86 L271.25 244.47 L275.5 245.07 L279.75 245.64 L284 246.2 L288.25 246.74 L292.5 247.27 L296.75 247.77 L301 248.26 L305.25 248.74 L309.5 249.19 L313.75 249.63 L318 250.05 L322.25 250.45 L326.5 250.84 L330.75 251.21 L335 251.56 L339.25 251.9 L343.5 252.22 L347.75 252.52 L352 252.8 L356.25 253.07 L360.5 253.32 L364.75 253.55 L369 253.76 L373.25 253.96 L377.5 254.14 L381.75 254.3 L386 254.45 L390.25 254.58 L394.5 254.69 L398.75 254.79 L403 254.86 L407.25 254.92 L411.5 254.97 L415.75 254.99 L420 255" stroke="#287aab" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="80,203 65,227 95,227" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><line x1="58" y1="230" x2="102" y2="230" stroke="#647780" stroke-width="2"/><line x1="80" y1="200" x2="150" y2="222.65" stroke="#647780" stroke-width="1.2" stroke-dasharray="5 4"/><path d="M128 200 A48 48 0 0 1 125.67 214.78" stroke="#273b45" stroke-width="1.6" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="138" y="188" font-size="15" fill="#273b45" text-anchor="start"><tspan>θ</tspan><tspan dy="4" font-size="11">A</tspan><tspan dy="-4"> = 1</tspan></text><path d="M54 188 Q80 142 106 188" stroke="#2b7b61" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="106,188 97.16,181.51 105,177.08" fill="#2b7b61" stroke="#2b7b61" stroke-width="1.5" stroke-linejoin="round"/><text x="80" y="134" font-size="15" fill="#2b7b61" text-anchor="middle"><tspan>M</tspan><tspan dy="4" font-size="11">A</tspan></text><text x="52" y="208" font-size="16" fill="#273b45" text-anchor="end"><tspan>A</tspan></text><line x1="436" y1="160" x2="436" y2="299" stroke="#273b45" stroke-width="3"/><line x1="436" y1="164" x2="447" y2="174" stroke="#647780" stroke-width="1.4"/><line x1="436" y1="176" x2="447" y2="186" stroke="#647780" stroke-width="1.4"/><line x1="436" y1="188" x2="447" y2="198" stroke="#647780" stroke-width="1.4"/><line x1="436" y1="200" x2="447" y2="210" stroke="#647780" stroke-width="1.4"/><line x1="436" y1="212" x2="447" y2="222" stroke="#647780" stroke-width="1.4"/><line x1="436" y1="224" x2="447" y2="234" stroke="#647780" stroke-width="1.4"/><line x1="436" y1="236" x2="447" y2="246" stroke="#647780" stroke-width="1.4"/><line x1="436" y1="248" x2="447" y2="258" stroke="#647780" stroke-width="1.4"/><line x1="436" y1="260" x2="447" y2="270" stroke="#647780" stroke-width="1.4"/><line x1="436" y1="272" x2="447" y2="282" stroke="#647780" stroke-width="1.4"/><line x1="436" y1="284" x2="447" y2="294" stroke="#647780" stroke-width="1.4"/><line x1="436" y1="296" x2="447" y2="306" stroke="#647780" stroke-width="1.4"/><line x1="422" y1="238" x2="422" y2="272" str