<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">In a long column the bending stress dwarfs the direct stress</title><desc id="desc">A long column carries a small load before it buckles, so the direct stress P/A is small. The lateral deflection δ adds a moment Pδ whose bending stress Pδ/Z is much larger, which is why long columns fail by buckling.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="120" y1="90" x2="120" y2="370" stroke="#b8c8ce" stroke-width="7"/><path d="M120 370 L121.78 365.33 L123.55 360.67 L125.32 356 L127.07 351.33 L128.8 346.67 L130.51 342 L132.18 337.33 L133.83 332.67 L135.44 328 L137 323.33 L138.52 318.67 L139.98 314 L141.4 309.33 L142.75 304.67 L144.04 300 L145.27 295.33 L146.42 290.67 L147.51 286 L148.51 281.33 L149.44 276.67 L150.29 272 L151.06 267.33 L151.74 262.67 L152.34 258 L152.84 253.33 L153.26 248.67 L153.58 244 L153.81 239.33 L153.95 234.67 L154 230 L153.95 225.33 L153.81 220.67 L153.58 216 L153.26 211.33 L152.84 206.67 L152.34 202 L151.74 197.33 L151.06 192.67 L150.29 188 L149.44 183.33 L148.51 178.67 L147.51 174 L146.42 169.33 L145.27 164.67 L144.04 160 L142.75 155.33 L141.4 150.67 L139.98 146 L138.52 141.33 L137 136.67 L135.44 132 L133.83 127.33 L132.18 122.67 L130.51 118 L128.8 113.33 L127.07 108.67 L125.32 104 L123.55 99.33 L121.78 94.67 L120 90" stroke="#2b7b61" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="120,90 109,74 131,74" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><polygon points="120,370 109,386 131,386" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><line x1="120" y1="28" x2="120" y2="59.2" stroke="#b64f4f" stroke-width="3.5"/><polygon points="120,68 115.5,57 124.5,57" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="132" y="46" font-size="16" fill="#b64f4f" text-anchor="start"><tspan>P</tspan></text><line x1="120" y1="230" x2="154" y2="230" stroke="#647780" stroke-width="1.5"/><line x1="120" y1="225" x2="120" y2="235" stroke="#647780" stroke-width="1.5"/><line x1="154" y1="225" x2="154" y2="235" stroke="#647780" stroke-width="1.5"/><text x="137" y="222" font-size="15" fill="#273b45" text-anchor="middle"><tspan>δ</tspan></text><line x1="300" y1="150" x2="300" y2="310" stroke="#273b45" stroke-width="1.5"/><rect x="300" y="150" width="18" height="160" fill="#e6f1f8" stroke="#287aab" stroke-width="1.5"/><polygon points="318,150 418,150 318,230" fill="#f2dfdf" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><polygon points="318,230 218,310 318,310" fill="#f2dfdf" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="309" y="136" font-size="14" fill="#287aab" text-anchor="middle"><tspan>P/A</tspan></text><text x="424" y="156" font-size="15" fill="#b64f4f" text-anchor="start"><tspan>Pδ/Z</tspan></text><text x="300" y="344" font-size="14" fill="#647780" text-anchor="middle">stresses at mid-height</text><text x="575" y="150" font-size="16" fill="#273b45" text-anchor="middle"><tspan>direct: P/A, small</tspan></text><text x="575" y="184" font-size="16" fill="#273b45" text-anchor="middle"><tspan>bending: Pδ/Z, large</tspan></text><rect x="458" y="242" width="234" height="33" rx="7" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><text x="575" y="262" font-size="17" fill="#2b7b61" text-anchor="middle"><tspan>direct stress negligible</tspan></text></g></svg>