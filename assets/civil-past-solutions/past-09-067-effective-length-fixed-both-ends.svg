<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Effective length of a column fixed at both ends</title><desc id="desc">Fixing both ends puts points of contraflexure L/4 from each end, so the length that buckles like a pin-ended column is L/2. The theoretical effective length is L/2; design codes recommend 0.65L.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="180" y1="80" x2="180" y2="360" stroke="#b8c8ce" stroke-width="7"/><path d="M180 360 L180.09 355.33 L180.35 350.67 L180.78 346 L181.38 341.33 L182.14 336.67 L183.06 332 L184.11 327.33 L185.29 322.67 L186.6 318 L188 313.33 L189.49 308.67 L191.06 304 L192.67 299.33 L194.33 294.67 L196 290 L197.67 285.33 L199.33 280.67 L200.94 276 L202.51 271.33 L204 266.67 L205.4 262 L206.71 257.33 L207.89 252.67 L208.94 248 L209.86 243.33 L210.62 238.67 L211.22 234 L211.65 229.33 L211.91 224.67 L212 220 L211.91 215.33 L211.65 210.67 L211.22 206 L210.62 201.33 L209.86 196.67 L208.94 192 L207.89 187.33 L206.71 182.67 L205.4 178 L204 173.33 L202.51 168.67 L200.94 164 L199.33 159.33 L197.67 154.67 L196 150 L194.33 145.33 L192.67 140.67 L191.06 136 L189.49 131.33 L188 126.67 L186.6 122 L185.29 117.33 L184.11 112.67 L183.06 108 L182.14 103.33 L181.38 98.67 L180.78 94 L180.35 89.33 L180.09 84.67 L180 80" stroke="#2b7b61" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><rect x="156" y="68" width="48" height="12" fill="#d6dfe3" stroke="#273b45" stroke-width="2"/><rect x="156" y="360" width="48" height="12" fill="#d6dfe3" stroke="#273b45" stroke-width="2"/><line x1="120" y1="80" x2="120" y2="360" stroke="#647780" stroke-width="1.5"/><line x1="127" y1="80" x2="113" y2="80" stroke="#647780" stroke-width="1.5"/><line x1="127" y1="360" x2="113" y2="360" stroke="#647780" stroke-width="1.5"/><text x="112" y="226" font-size="16" fill="#647780" text-anchor="end">L</text><circle cx="196" cy="290" r="5" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><circle cx="196" cy="150" r="5" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><line x1="250" y1="150" x2="250" y2="290" stroke="#647780" stroke-width="1.5"/><line x1="257" y1="150" x2="243" y2="150" stroke="#647780" stroke-width="1.5"/><line x1="257" y1="290" x2="243" y2="290" stroke="#647780" stroke-width="1.5"/><text x="262" y="226" font-size="17" fill="#287aab" text-anchor="start"><tspan>l</tspan><tspan dy="5" font-size="12">e</tspan><tspan dy="-5"> = L/2</tspan></text><text x="250" y="116" font-size="14" fill="#647780" text-anchor="middle">L/4</text><text x="250" y="330" font-size="14" fill="#647780" text-anchor="middle">L/4</text><text x="560" y="150" font-size="17" fill="#273b45" text-anchor="middle"><tspan>P = π²EI/(L/2)²</tspan></text><text x="560" y="184" font-size="15" fill="#647780" text-anchor="middle"><tspan>design value 0.65L</tspan></text><rect x="507" y="240" width="106" height="35" rx="7" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><text x="560" y="262" font-size="19" fill="#2b7b61" text-anchor="middle"><tspan>l</tspan><tspan dy="5" font-size="14">e</tspan><tspan dy="-5"> = L/2</tspan></text></g></svg>