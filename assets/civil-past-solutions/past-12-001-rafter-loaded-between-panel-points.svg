<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Purlins placed between the panel points of a roof truss</title><desc id="desc">Truss members carry only axial force when loads act at the joints. Purlins resting between panel points load the principal rafter transversely, so besides its axial compression it bends like a continuous beam between the panel points.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="60" y1="330" x2="250" y2="330" stroke="#466d89" stroke-width="4"/><line x1="250" y1="330" x2="440" y2="330" stroke="#466d89" stroke-width="4"/><line x1="155" y1="240" x2="250" y2="330" stroke="#466d89" stroke-width="4"/><line x1="345" y1="240" x2="250" y2="330" stroke="#466d89" stroke-width="4"/><line x1="250" y1="150" x2="250" y2="330" stroke="#466d89" stroke-width="4"/><line x1="60" y1="330" x2="250" y2="150" stroke="#273b45" stroke-width="7"/><line x1="250" y1="150" x2="440" y2="330" stroke="#273b45" stroke-width="7"/><circle cx="60" cy="330" r="5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><circle cx="440" cy="330" r="5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><circle cx="250" cy="150" r="5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><circle cx="155" cy="240" r="5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><circle cx="345" cy="240" r="5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><circle cx="250" cy="330" r="5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><polygon points="60,335 45,359 75,359" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><line x1="38" y1="362" x2="82" y2="362" stroke="#647780" stroke-width="2"/><polygon points="440,335 425,356 455,356" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><circle cx="432" cy="362" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><circle cx="448" cy="362" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><line x1="418" y1="369" x2="462" y2="369" stroke="#647780" stroke-width="2"/><rect x="94.62" y="271.74" width="12" height="12" fill="#b98232" stroke="#273b45" stroke-width="1.2"/><line x1="100.62" y1="225.74" x2="100.62" y2="259.94" stroke="#b64f4f" stroke-width="2.5"/><polygon points="100.62,268.74 96.12,257.74 105.12,257.74" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><rect x="189.62" y="181.74" width="12" height="12" fill="#b98232" stroke="#273b45" stroke-width="1.2"/><line x1="195.62" y1="135.74" x2="195.62" y2="169.94" stroke="#b64f4f" stroke-width="2.5"/><polygon points="195.62,178.74 191.12,167.74 200.12,167.74" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><rect x="393.38" y="271.74" width="12" height="12" fill="#b98232" stroke="#273b45" stroke-width="1.2"/><line x1="399.38" y1="225.74" x2="399.38" y2="259.94" stroke="#b64f4f" stroke-width="2.5"/><polygon points="399.38,268.74 394.88,257.74 403.88,257.74" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><rect x="298.38" y="181.74" width="12" height="12" fill="#b98232" stroke="#273b45" stroke-width="1.2"/><line x1="304.38" y1="135.74" x2="304.38" y2="169.94" stroke="#b64f4f" stroke-width="2.5"/><polygon points="304.38,178.74 299.88,167.74 308.88,167.74" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="110" y="126" font-size="14" fill="#b64f4f" text-anchor="middle"><tspan>purlins between panel points</tspan></text><text x="585" y="150" font-size="16" fill="#273b45" text-anchor="middle"><tspan>purlin loads bend the rafter</tspan></text><text x="585" y="184" font-size="16" fill="#273b45" text-anchor="middle"><tspan>truss action: compression</tspan></text><rect x="482" y="243" width="206" height="32" rx="7" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><text x="585" y="262" font-size="16" fill="#2b7b61" text