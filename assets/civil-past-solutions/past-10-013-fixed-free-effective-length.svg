<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">A fixed-free column buckles like half of a pin-ended column of length 2L</title><desc id="desc">A column fixed at the base and free at the top bends into a quarter wave. Reflecting it about the base gives the half wave of a pin-ended column of length 2L, so the effective length is 2L and Leff/L = 2.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="190" y1="90" x2="190" y2="240" stroke="#b8c8ce" stroke-width="7"/><path d="M190 240 L190.03 236.25 L190.11 232.5 L190.25 228.75 L190.44 225 L190.69 221.25 L190.99 217.5 L191.35 213.75 L191.76 210 L192.23 206.25 L192.74 202.5 L193.31 198.75 L193.92 195 L194.59 191.25 L195.3 187.5 L196.07 183.75 L196.88 180 L197.73 176.25 L198.63 172.5 L199.56 168.75 L200.54 165 L201.56 161.25 L202.62 157.5 L203.71 153.75 L204.84 150 L206 146.25 L207.19 142.5 L208.41 138.75 L209.66 135 L210.93 131.25 L212.22 127.5 L213.54 123.75 L214.88 120 L216.23 116.25 L217.6 112.5 L218.98 108.75 L220.37 105 L221.77 101.25 L223.18 97.5 L224.59 93.75 L226 90" stroke="#2b7b61" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M190 240 L190.03 243.75 L190.11 247.5 L190.25 251.25 L190.44 255 L190.69 258.75 L190.99 262.5 L191.35 266.25 L191.76 270 L192.23 273.75 L192.74 277.5 L193.31 281.25 L193.92 285 L194.59 288.75 L195.3 292.5 L196.07 296.25 L196.88 300 L197.73 303.75 L198.63 307.5 L199.56 311.25 L200.54 315 L201.56 318.75 L202.62 322.5 L203.71 326.25 L204.84 330 L206 333.75 L207.19 337.5 L208.41 341.25 L209.66 345 L210.93 348.75 L212.22 352.5 L213.54 356.25 L214.88 360 L216.23 363.75 L217.6 367.5 L218.98 371.25 L220.37 375 L221.77 378.75 L223.18 382.5 L224.59 386.25 L226 390" stroke="#2b7b61" stroke-width="2" fill="none" stroke-dasharray="6 5" stroke-linejoin="round" stroke-linecap="round"/><rect x="164" y="234" width="52" height="12" fill="#d6dfe3" stroke="#273b45" stroke-width="2"/><line x1="226" y1="90" x2="226" y2="390" stroke="#647780" stroke-width="1" stroke-dasharray="3 4"/><line x1="226" y1="42" x2="226" y2="73.2" stroke="#b64f4f" stroke-width="3.5"/><polygon points="226,82 221.5,71 230.5,71" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="238" y="60" font-size="16" fill="#b64f4f" text-anchor="start"><tspan>P</tspan></text><line x1="120" y1="90" x2="120" y2="240" stroke="#647780" stroke-width="1.5"/><line x1="127" y1="90" x2="113" y2="90" stroke="#647780" stroke-width="1.5"/><line x1="127" y1="240" x2="113" y2="240" stroke="#647780" stroke-width="1.5"/><text x="112" y="171" font-size="16" fill="#647780" text-anchor="end">L</text><line x1="290" y1="90" x2="290" y2="390" stroke="#647780" stroke-width="1.5"/><line x1="297" y1="90" x2="283" y2="90" stroke="#647780" stroke-width="1.5"/><line x1="297" y1="390" x2="283" y2="390" stroke="#647780" stroke-width="1.5"/><text x="302" y="246" font-size="17" fill="#287aab" text-anchor="start"><tspan>l</tspan><tspan dy="5" font-size="12">e</tspan><tspan dy="-5"> = 2L</tspan></text><text x="178" y="370" font-size="13" fill="#647780" text-anchor="end">mirror image</text><rect x="512.5" y="228" width="125" height="35" rx="7" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><text x="575" y="250" font-size="19" fill="#2b7b61" text-anchor="middle"><tspan>L</tspan><tspan dy="5" font-size="14">eff</tspan><tspan dy="-5">/L = 2</tspan></text></g></svg>