<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Shape factor of a diamond section</title><desc id="desc">For a diamond of width b and depth d, I = bd cubed/48 so Ze = bd squared/24. When fully plastic each half, of area bd/4, acts at d/6 from the neutral axis, so Zp = 2(bd/4)(d/6) = bd squared/12 and the shape factor is 2.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><polygon points="110,110 170,220 110,330 50,220" fill="#d6dfe3" stroke="#273b45" stroke-width="2.5" stroke-linejoin="round"/><line x1="36" y1="220" x2="184" y2="220" stroke="#647780" stroke-width="1.2" stroke-dasharray="5 4"/><line x1="30" y1="110" x2="30" y2="330" stroke="#647780" stroke-width="1.5"/><line x1="37" y1="110" x2="23" y2="110" stroke="#647780" stroke-width="1.5"/><line x1="37" y1="330" x2="23" y2="330" stroke="#647780" stroke-width="1.5"/><text x="22" y="226" font-size="15" fill="#647780" text-anchor="end">d</text><line x1="50" y1="350" x2="170" y2="350" stroke="#647780" stroke-width="1.5"/><line x1="50" y1="343" x2="50" y2="357" stroke="#647780" stroke-width="1.5"/><line x1="170" y1="343" x2="170" y2="357" stroke="#647780" stroke-width="1.5"/><text x="110" y="376" font-size="15" fill="#647780" text-anchor="middle">b</text><line x1="250" y1="104" x2="250" y2="336" stroke="#273b45" stroke-width="1.4"/><polygon points="250,110 295,110 250,220" fill="#f2dfdf" stroke="#b64f4f" stroke-width="2" stroke-linejoin="round"/><polygon points="250,220 205,330 250,330" fill="#e6f1f8" stroke="#287aab" stroke-width="2" stroke-linejoin="round"/><text x="250" y="360" font-size="14" fill="#273b45" text-anchor="middle"><tspan>elastic</tspan></text><text x="250" y="384" font-size="14" fill="#287aab" text-anchor="middle"><tspan>Z</tspan><tspan dy="4" font-size="10">e</tspan><tspan dy="-4"> = bd²/24</tspan></text><line x1="370" y1="104" x2="370" y2="336" stroke="#273b45" stroke-width="1.4"/><rect x="370" y="110" width="40" height="110" fill="#f2dfdf" stroke="#b64f4f" stroke-width="2"/><rect x="330" y="220" width="40" height="110" fill="#e6f1f8" stroke="#287aab" stroke-width="2"/><text x="370" y="360" font-size="14" fill="#273b45" text-anchor="middle"><tspan>plastic</tspan></text><text x="370" y="384" font-size="14" fill="#287aab" text-anchor="middle"><tspan>Z</tspan><tspan dy="4" font-size="10">p</tspan><tspan dy="-4"> = bd²/12</tspan></text><text x="585" y="150" font-size="16" fill="#273b45" text-anchor="middle"><tspan>Z</tspan><tspan dy="4" font-size="12">e</tspan><tspan dy="-4"> = bd²/24</tspan></text><text x="585" y="184" font-size="16" fill="#273b45" text-anchor="middle"><tspan>Z</tspan><tspan dy="4" font-size="12">p</tspan><tspan dy="-4"> = 2(bd/4)(d/6) = bd²/12</tspan></text><rect x="508.25" y="240" width="153.5" height="35" rx="7" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><text x="585" y="262" font-size="19" fill="#2b7b61" text-anchor="middle"><tspan>S = Z</tspan><tspan dy="5" font-size="14">p</tspan><tspan dy="-5">/Z</tspan><tspan dy="5" font-size="14">e</tspan><tspan dy="-5"> = 2</tspan></text></g></svg>