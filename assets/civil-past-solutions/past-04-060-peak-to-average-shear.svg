<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Peak and average shear stress in a rectangular beam</title><desc id="desc">The average shear stress is V/bd, but the parabolic distribution peaks at the neutral axis at 3V/2bd, which is 1.5 times the average. For a solid circle the factor is 4/3.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><rect x="80" y="110" width="100" height="180" fill="#d6dfe3" stroke="#273b45" stroke-width="2"/><line x1="66" y1="200" x2="196" y2="200" stroke="#647780" stroke-width="1.2" stroke-dasharray="6 4"/><text x="180" y="194" font-size="13" fill="#647780" text-anchor="start">NA</text><polygon points="230,110 230,110 241.7,114.5 252.8,119 263.3,123.5 273.2,128 282.5,132.5 291.2,137 299.3,141.5 306.8,146 313.7,150.5 320,155 325.7,159.5 330.8,164 335.3,168.5 339.2,173 342.5,177.5 345.2,182 347.3,186.5 348.8,191 349.7,195.5 350,200 349.7,204.5 348.8,209 347.3,213.5 345.2,218 342.5,222.5 339.2,227 335.3,231.5 330.8,236 325.7,240.5 320,245 313.7,249.5 306.8,254 299.3,258.5 291.2,263 282.5,267.5 273.2,272 263.3,276.5 252.8,281 241.7,285.5 230,290 230,290" fill="#deeee6" stroke="#2b7b61" stroke-width="2" stroke-linejoin="round"/><rect x="230" y="110" width="80" height="180" fill="none" stroke="#287aab" stroke-width="2" stroke-dasharray="6 4"/><text x="356" y="205" font-size="16" fill="#2b7b61" text-anchor="start"><tspan>3V/2bd</tspan></text><text x="270" y="312" font-size="15" fill="#287aab" text-anchor="middle"><tspan>V/bd</tspan></text><text x="130" y="320" font-size="14" fill="#647780" text-anchor="middle">b × d section</text><text x="575" y="150" font-size="16" fill="#273b45" text-anchor="middle"><tspan>τ</tspan><tspan dy="4" font-size="12">max</tspan><tspan dy="-4"> = 3V/2bd</tspan></text><text x="575" y="184" font-size="16" fill="#273b45" text-anchor="middle"><tspan>τ</tspan><tspan dy="4" font-size="12">avg</tspan><tspan dy="-4"> = V/bd</tspan></text><text x="575" y="218" font-size="15" fill="#647780" text-anchor="middle"><tspan>circle: 4/3</tspan></text><rect x="488.75" y="278" width="172.5" height="35" rx="7" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><text x="575" y="300" font-size="19" fill="#2b7b61" text-anchor="middle"><tspan>τ</tspan><tspan dy="5" font-size="14">max</tspan><tspan dy="-5"> = 1.5 τ</tspan><tspan dy="5" font-size="14">avg</tspan></text></g></svg>