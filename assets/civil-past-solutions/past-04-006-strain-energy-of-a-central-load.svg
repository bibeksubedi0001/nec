<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Strain energy of a simple beam under a central load</title><desc id="desc">A central load W deflects the beam by δ = WL cubed/48EI. The load rises from zero to W, so the work stored is the triangle under the load-deflection line: U = W δ/2 = W squared L cubed/96EI.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="60" y1="110" x2="400" y2="110" stroke="#647780" stroke-width="1.5" stroke-dasharray="6 5"/><path d="M60 110 L65.67 112 L71.33 113.99 L77 115.98 L82.67 117.95 L88.33 119.91 L94 121.84 L99.67 123.75 L105.33 125.62 L111 127.46 L116.67 129.26 L122.33 131.01 L128 132.72 L133.67 134.37 L139.33 135.97 L145 137.5 L150.67 138.97 L156.33 140.36 L162 141.68 L167.67 142.92 L173.33 144.07 L179 145.14 L184.67 146.11 L190.33 146.99 L196 147.76 L201.67 148.43 L207.33 148.98 L213 149.42 L218.67 149.74 L224.33 149.93 L230 150 L235.67 149.93 L241.33 149.74 L247 149.42 L252.67 148.98 L258.33 148.43 L264 147.76 L269.67 146.99 L275.33 146.11 L281 145.14 L286.67 144.07 L292.33 142.92 L298 141.68 L303.67 140.36 L309.33 138.97 L315 137.5 L320.67 135.97 L326.33 134.37 L332 132.72 L337.67 131.01 L343.33 129.26 L349 127.46 L354.67 125.62 L360.33 123.75 L366 121.84 L371.67 119.91 L377.33 117.95 L383 115.98 L388.67 113.99 L394.33 112 L400 110" stroke="#287aab" stroke-width="5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="60,115 45,139 75,139" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><line x1="38" y1="142" x2="82" y2="142" stroke="#647780" stroke-width="2"/><polygon points="400,115 385,136 415,136" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><circle cx="392" cy="142" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><circle cx="408" cy="142" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><line x1="378" y1="149" x2="422" y2="149" stroke="#647780" stroke-width="2"/><line x1="230" y1="97" x2="230" y2="138.2" stroke="#b64f4f" stroke-width="3.5"/><polygon points="230,147 225.5,136 234.5,136" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="230" y="87" font-size="17" fill="#b64f4f" text-anchor="middle">W</text><line x1="246" y1="110" x2="246" y2="150" stroke="#647780" stroke-width="1.5"/><line x1="253" y1="110" x2="239" y2="110" stroke="#647780" stroke-width="1.5"/><line x1="253" y1="150" x2="239" y2="150" stroke="#647780" stroke-width="1.5"/><text x="252" y="136" font-size="16" fill="#647780" text-anchor="start">δ</text><polygon points="110,370 340,220 340,370" fill="#f5ead8" stroke="none" stroke-width="2" stroke-linejoin="round"/><line x1="110" y1="370" x2="340" y2="220" stroke="#b98232" stroke-width="3"/><line x1="110" y1="370" x2="361.2" y2="370" stroke="#273b45" stroke-width="1.6"/><polygon points="370,370 359,374.5 359,365.5" fill="#273b45" stroke="#273b45" stroke-width="1.5" stroke-linejoin="round"/><line x1="110" y1="370" x2="110" y2="198.8" stroke="#273b45" stroke-width="1.6"/><polygon points="110,190 114.5,201 105.5,201" fill="#273b45" stroke="#273b45" stroke-width="1.5" stroke-linejoin="round"/><line x1="340" y1="370" x2="340" y2="220" stroke="#647780" stroke-width="1.2" stroke-dasharray="4 4"/><text x="340" y="390" font-size="16" fill="#273b45" text-anchor="middle"><tspan>δ</tspan></text><text x="102" y="225" font-size="16" fill="#273b45" text-anchor="end"><tspan>W</tspan></text><text x="257.2" y="346" font-size="16" fill="#b98232" text-anchor="middle"><tspan>U = ½Wδ</tspan></text><text x="580" y="150" font-size="17" fill="#273b45" text-anchor="middle"><tspan>δ = WL³/48EI</tspan></text><text x="580" y="186" font-size="17" fill="#273b45" text-anchor="middle"><tspan>U = ½ W × WL³/48EI</tspan></text><rect x="503.25" y="240" width="153.5" height="35" rx="7" fill="#deeee6" stro