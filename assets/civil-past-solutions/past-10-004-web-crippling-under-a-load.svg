<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Web crippling under a concentrated load</title><desc id="desc">A concentrated load or reaction spreads through the flange and root fillet onto a short length of the thin web. If the bearing stress there is too high the web yields locally at the root of the flange, which is web crippling; bearing stiffeners prevent it.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><rect x="60" y="166" width="380" height="134" fill="#e6f1f8" stroke="none" stroke-width="2"/><rect x="60" y="150" width="380" height="16" fill="#d6dfe3" stroke="#273b45" stroke-width="2"/><rect x="60" y="300" width="380" height="16" fill="#d6dfe3" stroke="#273b45" stroke-width="2"/><rect x="244" y="166" width="12" height="134" fill="none" stroke="#647780" stroke-width="1.5" stroke-dasharray="5 4"/><rect x="220" y="136" width="60" height="14" fill="#8a9aa3" stroke="#273b45" stroke-width="1.5"/><line x1="250" y1="74" x2="250" y2="125.2" stroke="#b64f4f" stroke-width="4"/><polygon points="250,134 245.5,123 254.5,123" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="250" y="66" font-size="17" fill="#b64f4f" text-anchor="middle"><tspan>P</tspan></text><line x1="220" y1="150" x2="155" y2="176" stroke="#b64f4f" stroke-width="1.5" stroke-dasharray="5 4"/><line x1="280" y1="150" x2="345" y2="176" stroke="#b64f4f" stroke-width="1.5" stroke-dasharray="5 4"/><polygon points="155,166 345,166 345,184 155,184" fill="#f5ead8" stroke="none" stroke-width="2" stroke-linejoin="round"/><path d="M155 171 L165 181 L175 171 L185 181 L195 171 L205 181 L215 171 L225 181 L235 171 L245 181 L255 171 L265 181 L275 171 L285 181 L295 171 L305 181 L315 171 L325 181 L335 171 L345 181" stroke="#b98232" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="150" y="214" font-size="14" fill="#b98232" text-anchor="middle"><tspan>web crippling</tspan></text><text x="150" y="234" font-size="14" fill="#b98232" text-anchor="middle"><tspan>at the root of the flange</tspan></text><text x="250" y="344" font-size="14" fill="#647780" text-anchor="middle"><tspan>bearing stiffener (dashed) prevents it</tspan></text><text x="585" y="150" font-size="17" fill="#273b45" text-anchor="middle"><tspan>point load or reaction</tspan></text><text x="585" y="184" font-size="17" fill="#273b45" text-anchor="middle"><tspan>local yielding of the web</tspan></text><rect x="465" y="244" width="240" height="31" rx="7" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><text x="585" y="262" font-size="15" fill="#2b7b61" text-anchor="middle"><tspan>web failure under point load</tspan></text></g></svg>