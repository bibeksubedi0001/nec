<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Minimum tension steel ratio 0.85/fy for common steel grades</title><desc id="desc">The minimum tension steel ratio of IS 456 is As/bd = 0.85/fy, so it falls as the steel grade rises. For Fe415 it is 0.85/415 = 0.00205, about 0.2 percent.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><rect x="95" y="136" width="70" height="204" fill="#e6f1f8" stroke="#647780" stroke-width="2"/><text x="130" y="126" font-size="15" fill="#273b45" text-anchor="middle"><tspan>0.34%</tspan></text><text x="130" y="362" font-size="15" fill="#273b45" text-anchor="middle"><tspan>Fe250</tspan></text><rect x="215" y="217.11" width="70" height="122.89" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><text x="250" y="207.11" font-size="15" fill="#2b7b61" text-anchor="middle"><tspan>0.205%</tspan></text><text x="250" y="362" font-size="15" fill="#273b45" text-anchor="middle"><tspan>Fe415</tspan></text><rect x="335" y="238" width="70" height="102" fill="#e6f1f8" stroke="#647780" stroke-width="2"/><text x="370" y="228" font-size="15" fill="#273b45" text-anchor="middle"><tspan>0.17%</tspan></text><text x="370" y="362" font-size="15" fill="#273b45" text-anchor="middle"><tspan>Fe500</tspan></text><line x1="70" y1="340" x2="430" y2="340" stroke="#273b45" stroke-width="1.6"/><text x="250" y="100" font-size="16" fill="#273b45" text-anchor="middle"><tspan>A</tspan><tspan dy="4" font-size="12">s</tspan><tspan dy="-4">/bd = 0.85/f</tspan><tspan dy="4" font-size="12">y</tspan></text><text x="585" y="150" font-size="17" fill="#273b45" text-anchor="middle"><tspan>A</tspan><tspan dy="5" font-size="12">s</tspan><tspan dy="-5">/bd ≥ 0.85/f</tspan><tspan dy="5" font-size="12">y</tspan></text><text x="585" y="184" font-size="17" fill="#273b45" text-anchor="middle"><tspan>0.85/415 = 0.00205</tspan></text><rect x="522.5" y="240" width="125" height="35" rx="7" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><text x="585" y="262" font-size="19" fill="#2b7b61" text-anchor="middle"><tspan>about 0.2%</tspan></text></g></svg>