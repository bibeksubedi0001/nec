<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Mild and steep slopes</title><desc id="desc">A slope is mild when uniform flow is deeper than critical, so the normal flow is subcritical, and steep when uniform flow is shallower than critical, so it is supercritical.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><text x="185" y="40" font-size="18" fill="#287aab" text-anchor="middle">Mild slope</text><polygon points="50,200 320,250 320,272 50,222" fill="#f0e6d4" stroke="none" stroke-width="2" stroke-linejoin="round"/><polygon points="50,200 320,250 320,170 50,120" fill="#d8edf7" stroke="none" stroke-width="2" stroke-linejoin="round"/><line x1="50" y1="200" x2="320" y2="250" stroke="#273b45" stroke-width="3"/><line x1="50" y1="120" x2="320" y2="170" stroke="#287aab" stroke-width="2.5"/><line x1="50" y1="164" x2="320" y2="214" stroke="#b64f4f" stroke-width="2" stroke-dasharray="8 6"/><text x="326" y="175" font-size="16" fill="#287aab" text-anchor="start">yn</text><text x="326" y="219" font-size="16" fill="#b64f4f" text-anchor="start">yc</text><text x="185" y="350" font-size="16" fill="#273b45" text-anchor="middle">yn &gt; yc: subcritical, Fr &lt; 1</text><text x="535" y="40" font-size="18" fill="#b64f4f" text-anchor="middle">Steep slope</text><polygon points="400,140 670,290 670,312 400,162" fill="#f0e6d4" stroke="none" stroke-width="2" stroke-linejoin="round"/><polygon points="400,140 670,290 670,260 400,110" fill="#d8edf7" stroke="none" stroke-width="2" stroke-linejoin="round"/><line x1="400" y1="140" x2="670" y2="290" stroke="#273b45" stroke-width="3"/><line x1="400" y1="110" x2="670" y2="260" stroke="#287aab" stroke-width="2.5"/><line x1="400" y1="74" x2="670" y2="224" stroke="#b64f4f" stroke-width="2" stroke-dasharray="8 6"/><text x="676" y="265" font-size="16" fill="#287aab" text-anchor="start">yn</text><text x="676" y="229" font-size="16" fill="#b64f4f" text-anchor="start">yc</text><text x="535" y="350" font-size="16" fill="#273b45" text-anchor="middle">yn &lt; yc: supercritical, Fr &gt; 1</text><text x="360" y="396" font-size="15" fill="#647780" text-anchor="middle">Solid blue: normal depth line; dashed red: critical depth line</text></g></svg>