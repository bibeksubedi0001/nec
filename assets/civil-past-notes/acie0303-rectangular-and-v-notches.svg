<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Rectangular and V-notch weirs</title><desc id="desc">Discharge over a rectangular notch grows with the head to the power 3/2 and over a V-notch to the power 5/2, so a V-notch measures small flows more precisely.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><text x="195" y="70" font-size="18" fill="#273b45" text-anchor="middle">Rectangular notch</text><rect x="60" y="100" width="270" height="220" fill="#d6dfe3" stroke="#273b45" stroke-width="2"/><rect x="130" y="100" width="130" height="100" fill="#fbfcfd" stroke="none" stroke-width="2"/><path d="M130 100 L130 200 L260 200 L260 100" stroke="#273b45" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><rect x="131" y="140" width="128" height="59" fill="#d8edf7" stroke="none" stroke-width="2"/><line x1="100" y1="140" x2="290" y2="140" stroke="#287aab" stroke-width="1.5" stroke-dasharray="6 5"/><line x1="300" y1="140" x2="300" y2="200" stroke="#647780" stroke-width="1.5"/><line x1="307" y1="140" x2="293" y2="140" stroke="#647780" stroke-width="1.5"/><line x1="307" y1="200" x2="293" y2="200" stroke="#647780" stroke-width="1.5"/><text x="308" y="176" font-size="17" fill="#647780" text-anchor="start">H</text><line x1="130" y1="222" x2="260" y2="222" stroke="#647780" stroke-width="1.5"/><line x1="130" y1="215" x2="130" y2="229" stroke="#647780" stroke-width="1.5"/><line x1="260" y1="215" x2="260" y2="229" stroke="#647780" stroke-width="1.5"/><text x="195" y="248" font-size="17" fill="#647780" text-anchor="middle">L</text><text x="525" y="70" font-size="18" fill="#273b45" text-anchor="middle">V-notch</text><rect x="390" y="100" width="270" height="220" fill="#d6dfe3" stroke="#273b45" stroke-width="2"/><polygon points="425,100 625,100 525,200" fill="#fbfcfd" stroke="#273b45" stroke-width="2.5" stroke-linejoin="round"/><polygon points="466,141 584,141 525,199" fill="#d8edf7" stroke="none" stroke-width="2" stroke-linejoin="round"/><line x1="430" y1="140" x2="690" y2="140" stroke="#287aab" stroke-width="1.5" stroke-dasharray="6 5"/><line x1="532" y1="200" x2="690" y2="200" stroke="#647780" stroke-width="1.2" stroke-dasharray="4 4"/><line x1="680" y1="140" x2="680" y2="200" stroke="#647780" stroke-width="1.5"/><line x1="687" y1="140" x2="673" y2="140" stroke="#647780" stroke-width="1.5"/><line x1="687" y1="200" x2="673" y2="200" stroke="#647780" stroke-width="1.5"/><text x="688" y="176" font-size="17" fill="#647780" text-anchor="start">H</text><path d="M500.96 175.96 A34 34 0 0 1 549.04 175.96" stroke="#2b7b61" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="525" y="160" font-size="17" fill="#2b7b61" text-anchor="middle">θ</text><text x="295" y="372" font-size="16" fill="#273b45" text-anchor="end">Q = (2/3) Cd √(2g) L H</text><text x="297" y="364.8" font-size="12" fill="#273b45" text-anchor="start">3/2</text><text x="680" y="372" font-size="16" fill="#273b45" text-anchor="end">Q = (8/15) Cd √(2g) tan(θ/2) H</text><text x="682" y="364.8" font-size="12" fill="#273b45" text-anchor="start">5/2</text><text x="360" y="404" font-size="15" fill="#647780" text-anchor="middle">Cd, the coefficient of discharge, is about 0.6 for sharp-crested notches</text></g></svg>