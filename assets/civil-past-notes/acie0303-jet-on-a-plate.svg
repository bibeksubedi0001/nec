<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">A jet striking a flat plate</title><desc id="desc">A jet of area a and velocity V pushes on a fixed plate normal to it with ρaV²; on a plate moving away at u the relative velocity V − u replaces V, giving ρa(V − u)².</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><text x="180" y="60" font-size="18" fill="#273b45" text-anchor="middle">Fixed plate</text><rect x="40" y="165" width="36" height="30" fill="#466d89" stroke="#273b45" stroke-width="2"/><rect x="76" y="172" width="184" height="16" fill="#d8edf7" stroke="#287aab" stroke-width="1.5"/><text x="150" y="160" font-size="17" fill="#287aab" text-anchor="middle">V</text><line x1="280" y1="100" x2="280" y2="270" stroke="#273b45" stroke-width="7"/><line x1="268" y1="168" x2="268" y2="116.8" stroke="#287aab" stroke-width="3"/><polygon points="268,108 272.5,119 263.5,119" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><line x1="268" y1="192" x2="268" y2="251.2" stroke="#287aab" stroke-width="3"/><polygon points="268,260 263.5,249 272.5,249" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><line x1="290" y1="180" x2="333.2" y2="180" stroke="#b64f4f" stroke-width="4"/><polygon points="342,180 331,184.5 331,175.5" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="318" y="168" font-size="17" fill="#b64f4f" text-anchor="middle">F</text><text x="180" y="345" font-size="18" fill="#273b45" text-anchor="middle">F = ρ a V²</text><text x="540" y="60" font-size="18" fill="#273b45" text-anchor="middle">Plate moving at u</text><rect x="400" y="165" width="36" height="30" fill="#466d89" stroke="#273b45" stroke-width="2"/><rect x="436" y="172" width="184" height="16" fill="#d8edf7" stroke="#287aab" stroke-width="1.5"/><text x="510" y="160" font-size="17" fill="#287aab" text-anchor="middle">V</text><line x1="640" y1="100" x2="640" y2="270" stroke="#273b45" stroke-width="7"/><line x1="628" y1="168" x2="628" y2="116.8" stroke="#287aab" stroke-width="3"/><polygon points="628,108 632.5,119 623.5,119" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><line x1="628" y1="192" x2="628" y2="251.2" stroke="#287aab" stroke-width="3"/><polygon points="628,260 623.5,249 632.5,249" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><line x1="650" y1="180" x2="693.2" y2="180" stroke="#b64f4f" stroke-width="4"/><polygon points="702,180 691,184.5 691,175.5" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="678" y="168" font-size="17" fill="#b64f4f" text-anchor="middle">F</text><line x1="652" y1="290" x2="691.2" y2="290" stroke="#2b7b61" stroke-width="3"/><polygon points="700,290 689,294.5 689,285.5" fill="#2b7b61" stroke="#2b7b61" stroke-width="1.5" stroke-linejoin="round"/><text x="676" y="314" font-size="17" fill="#2b7b61" text-anchor="middle">u</text><text x="540" y="345" font-size="18" fill="#273b45" text-anchor="middle">F = ρ a (V − u)²</text><text x="360" y="395" font-size="16" fill="#273b45" text-anchor="middle">Force on the plate = rate of change of momentum of the jet</text></g></svg>