<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Pre-tensioning and post-tensioning</title><desc id="desc">In pre-tensioning, tendons are stretched between abutments before casting and released into the hardened concrete, which grips them by bond; in post-tensioning, tendons in ducts are stressed against the hardened concrete and anchored at its ends.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><text x="360" y="44" font-size="18" fill="#273b45" text-anchor="middle">Pre-tensioning</text><rect x="30" y="100" width="40" height="90" fill="#d6dfe3" stroke="#273b45" stroke-width="2"/><rect x="650" y="100" width="40" height="90" fill="#d6dfe3" stroke="#273b45" stroke-width="2"/><rect x="150" y="116" width="420" height="50" fill="#e4e8e9" stroke="#273b45" stroke-width="2"/><line x1="70" y1="151" x2="650" y2="151" stroke="#b64f4f" stroke-width="3"/><line x1="116" y1="132" x2="88.8" y2="132" stroke="#b64f4f" stroke-width="2.5"/><polygon points="80,132 91,127.5 91,136.5" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><line x1="604" y1="132" x2="631.2" y2="132" stroke="#b64f4f" stroke-width="2.5"/><polygon points="640,132 629,136.5 629,127.5" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="50" y="212" font-size="14" fill="#647780" text-anchor="middle">abutment</text><text x="670" y="212" font-size="14" fill="#647780" text-anchor="middle">abutment</text><text x="360" y="212" font-size="15" fill="#647780" text-anchor="middle">stretch, cast, then release: bond transfers the force</text><text x="360" y="252" font-size="18" fill="#273b45" text-anchor="middle">Post-tensioning</text><rect x="110" y="276" width="500" height="64" fill="#e4e8e9" stroke="#273b45" stroke-width="2"/><path d="M110 296 Q360 364 610 296" stroke="#647780" stroke-width="9" fill="none" stroke-linejoin="round" stroke-linecap="round" opacity="0.45"/><path d="M110 296 Q360 364 610 296" stroke="#b64f4f" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><rect x="100" y="282" width="10" height="30" fill="#466d89" stroke="#273b45" stroke-width="1.5"/><rect x="610" y="282" width="10" height="30" fill="#466d89" stroke="#273b45" stroke-width="1.5"/><rect x="620" y="286" width="40" height="22" fill="#466d89" stroke="#273b45" stroke-width="1.5"/><line x1="662" y1="297" x2="697.2" y2="297" stroke="#b64f4f" stroke-width="3"/><polygon points="706,297 695,301.5 695,292.5" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="640" y="332" font-size="14" fill="#647780" text-anchor="middle">jack</text><text x="66" y="302" font-size="14" fill="#647780" text-anchor="end">anchor</text><text x="360" y="390" font-size="15" fill="#647780" text-anchor="middle">tendon in a duct, stressed against the concrete and anchored at the ends</text></g></svg>