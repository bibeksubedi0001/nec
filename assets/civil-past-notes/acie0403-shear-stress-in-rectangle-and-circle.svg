<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Shear stress across rectangular and circular beam sections</title><desc id="desc">Shear stress in a beam follows τ = VQ/Ib: zero at the top and bottom, largest at the neutral axis. The peak is 1.5 times the average V/bd for a rectangle and 4/3 of V/A for a solid circle.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><rect x="60" y="100" width="90" height="200" fill="#d6dfe3" stroke="#273b45" stroke-width="2"/><line x1="40" y1="200" x2="170" y2="200" stroke="#647780" stroke-width="1.2" stroke-dasharray="6 4"/><polygon points="190,100 190,100 198.78,105 207.1,110 214.98,115 222.4,120 229.38,125 235.9,130 241.98,135 247.6,140 252.78,145 257.5,150 261.77,155 265.6,160 268.98,165 271.9,170 274.38,175 276.4,180 277.98,185 279.1,190 279.77,195 280,200 279.77,205 279.1,210 277.98,215 276.4,220 274.38,225 271.9,230 268.98,235 265.6,240 261.77,245 257.5,250 252.78,255 247.6,260 241.98,265 235.9,270 229.38,275 222.4,280 214.98,285 207.1,290 198.78,295 190,300 190,300" fill="#deeee6" stroke="#2b7b61" stroke-width="2" stroke-linejoin="round"/><text x="286" y="205" font-size="16" fill="#2b7b61" text-anchor="start"><tspan>1.5 V/bd</tspan></text><text x="170" y="340" font-size="16" fill="#647780" text-anchor="middle">rectangle: 1.5 × average</text><circle cx="480" cy="200" r="90" fill="#d6dfe3" stroke="#273b45" stroke-width="2"/><line x1="380" y1="200" x2="580" y2="200" stroke="#647780" stroke-width="1.2" stroke-dasharray="6 4"/><polygon points="600,110 600,110 606.83,114.5 613.3,119 619.42,123.5 625.2,128 630.63,132.5 635.7,137 640.42,141.5 644.8,146 648.83,150.5 652.5,155 655.83,159.5 658.8,164 661.43,168.5 663.7,173 665.63,177.5 667.2,182 668.43,186.5 669.3,191 669.83,195.5 670,200 669.83,204.5 669.3,209 668.43,213.5 667.2,218 665.63,222.5 663.7,227 661.43,231.5 658.8,236 655.83,240.5 652.5,245 648.83,249.5 644.8,254 640.42,258.5 635.7,263 630.63,267.5 625.2,272 619.42,276.5 613.3,281 606.83,285.5 600,290 600,290" fill="#deeee6" stroke="#2b7b61" stroke-width="2" stroke-linejoin="round"/><text x="640" y="316" font-size="16" fill="#2b7b61" text-anchor="middle"><tspan>4V/3A</tspan></text><text x="500" y="340" font-size="16" fill="#647780" text-anchor="middle">solid circle: 4/3 × average</text><text x="360" y="396" font-size="17" fill="#273b45" text-anchor="middle"><tspan>τ = VQ/Ib: zero at the edges, maximum at the neutral axis</tspan></text></g></svg>