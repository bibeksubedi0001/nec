<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Strain energy as the area under the load–deflection line</title><desc id="desc">A load raised gradually from zero to W stores the triangle of work under the line, U = Wδ/2; for a simply supported beam with a central load, δ = WL³/48EI gives U = W²L³/96EI.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="110" y1="320" x2="506" y2="320" stroke="#647780" stroke-width="2"/><polygon points="514,320 504,324 504,316" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><line x1="110" y1="320" x2="110" y2="74" stroke="#647780" stroke-width="2"/><polygon points="110,66 114,76 106,76" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><text x="305" y="360" font-size="17" fill="#273b45" text-anchor="middle">Central deflection</text><text x="116" y="56" font-size="17" fill="#273b45" text-anchor="start">Load</text><polygon points="110,320 430,320 430,130" fill="#f5ead8" stroke="none" stroke-width="2" stroke-linejoin="round"/><line x1="110" y1="320" x2="430" y2="130" stroke="#287aab" stroke-width="3.5"/><line x1="110" y1="130" x2="430" y2="130" stroke="#647780" stroke-width="1.2" stroke-dasharray="5 4"/><line x1="430" y1="130" x2="430" y2="320" stroke="#647780" stroke-width="1.2" stroke-dasharray="5 4"/><circle cx="430" cy="130" r="5" fill="#287aab" stroke="#287aab" stroke-width="2"/><text x="102" y="135" font-size="17" fill="#273b45" text-anchor="end">W</text><text x="430" y="344" font-size="17" fill="#273b45" text-anchor="middle">δ</text><text x="340" y="290" font-size="19" fill="#273b45" text-anchor="middle">U = ½ W δ</text><line x1="540" y1="110" x2="690" y2="110" stroke="#273b45" stroke-width="6"/><polygon points="540,113 525,137 555,137" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><line x1="518" y1="140" x2="562" y2="140" stroke="#647780" stroke-width="2"/><polygon points="690,113 675,134 705,134" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><circle cx="682" cy="140" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><circle cx="698" cy="140" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><line x1="668" y1="147" x2="712" y2="147" stroke="#647780" stroke-width="2"/><line x1="615" y1="66" x2="615" y2="101.2" stroke="#b64f4f" stroke-width="3.5"/><polygon points="615,110 610.5,99 619.5,99" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="615" y="56" font-size="17" fill="#b64f4f" text-anchor="middle">W</text><text x="615" y="190" font-size="16" fill="#273b45" text-anchor="middle">δ = WL³ / 48EI</text><text x="360" y="400" font-size="18" fill="#273b45" text-anchor="middle">U = ½ W δ = W²L³ / 96EI</text></g></svg>