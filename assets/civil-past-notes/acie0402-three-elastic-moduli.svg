<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">The three elastic moduli and Poisson's ratio</title><desc id="desc">E links direct stress to direct strain, with a lateral contraction of Poisson's ratio times the axial strain. G links shear stress to the change of angle, and K links an all-round pressure to the volume change. They are tied by E = 2G(1 + μ) = 3K(1 - 2μ).</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><rect x="78" y="96" width="100" height="100" fill="none" stroke="#647780" stroke-width="1.5" stroke-dasharray="5 4"/><rect x="88" y="82" width="80" height="128" fill="#e6f1f8" stroke="#273b45" stroke-width="2"/><line x1="128" y1="70" x2="128" y2="42.8" stroke="#b64f4f" stroke-width="3"/><polygon points="128,34 132.5,45 123.5,45" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><line x1="128" y1="222" x2="128" y2="249.2" stroke="#b64f4f" stroke-width="3"/><polygon points="128,258 123.5,247 132.5,247" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="144" y="50" font-size="18" fill="#b64f4f" text-anchor="start"><tspan>σ</tspan></text><text x="128" y="296" font-size="20" fill="#273b45" text-anchor="middle"><tspan>E = σ/ε</tspan></text><text x="128" y="324" font-size="14" fill="#647780" text-anchor="middle"><tspan>μ = lateral/axial strain</tspan></text><rect x="300" y="110" width="100" height="100" fill="none" stroke="#647780" stroke-width="1.5" stroke-dasharray="5 4"/><polygon points="300,210 400,210 430,110 330,110" fill="#deeee6" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><line x1="330" y1="96" x2="411.2" y2="96" stroke="#b64f4f" stroke-width="3"/><polygon points="420,96 409,100.5 409,91.5" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><line x1="400" y1="224" x2="318.8" y2="224" stroke="#b64f4f" stroke-width="3"/><polygon points="310,224 321,219.5 321,228.5" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="440" y="96" font-size="18" fill="#b64f4f" text-anchor="start"><tspan>τ</tspan></text><path d="M300 146 A64 64 0 0 1 318.39 148.7" stroke="#2b7b61" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="310" y="138" font-size="17" fill="#2b7b61" text-anchor="middle"><tspan>γ</tspan></text><text x="360" y="296" font-size="20" fill="#273b45" text-anchor="middle"><tspan>G = τ/γ</tspan></text><rect x="532" y="110" width="100" height="100" fill="none" stroke="#647780" stroke-width="1.5" stroke-dasharray="5 4"/><rect x="544" y="122" width="76" height="76" fill="#f5ead8" stroke="#273b45" stroke-width="2"/><line x1="582" y1="98" x2="582" y2="109.2" stroke="#b64f4f" stroke-width="3"/><polygon points="582,118 577.5,107 586.5,107" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><line x1="582" y1="222" x2="582" y2="210.8" stroke="#b64f4f" stroke-width="3"/><polygon points="582,202 586.5,213 577.5,213" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><line x1="508" y1="160" x2="531.2" y2="160" stroke="#b64f4f" stroke-width="3"/><polygon points="540,160 529,164.5 529,155.5" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><line x1="656" y1="160" x2="632.8" y2="160" stroke="#b64f4f" stroke-width="3"/><polygon points="624,160 635,155.5 635,164.5" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="596" y="104" font-size="18" fill="#b64f4f" text-anchor="start"><tspan>p</tspan></text><text x="582" y="296" font-size="20" fill="#273b45" text-anchor="middle"><tspan>K = p/(ΔV/V)</tspan></text><text x="360" y="380" font-size="21" fill="#273b45" text-anchor="middle"><tspan>E = 2G(1 + μ) = 3K(1 − 2μ)</tspan></text></g></svg>