<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Three reservoirs joined at a junction</title><desc id="desc">The junction head settles where the flows balance: water runs from the highest reservoir A to the junction J and on to the lowest, C, while the pipe to B flows in whichever direction the junction head requires.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><rect x="40" y="90" width="130" height="80" fill="#d8edf7" stroke="none" stroke-width="2"/><path d="M40 60 L40 170 L170 170 L170 60" stroke="#273b45" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="40" y1="90" x2="170" y2="90" stroke="#287aab" stroke-width="2"/><text x="105" y="50" font-size="19" fill="#273b45" text-anchor="middle">A</text><rect x="550" y="170" width="130" height="60" fill="#d8edf7" stroke="none" stroke-width="2"/><path d="M550 140 L550 230 L680 230 L680 140" stroke="#273b45" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="550" y1="170" x2="680" y2="170" stroke="#287aab" stroke-width="2"/><text x="615" y="130" font-size="19" fill="#273b45" text-anchor="middle">B</text><rect x="550" y="300" width="130" height="60" fill="#d8edf7" stroke="none" stroke-width="2"/><path d="M550 270 L550 360 L680 360 L680 270" stroke="#273b45" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="550" y1="300" x2="680" y2="300" stroke="#287aab" stroke-width="2"/><text x="615" y="260" font-size="19" fill="#273b45" text-anchor="middle">C</text><line x1="170" y1="160" x2="360" y2="280" stroke="#466d89" stroke-width="8"/><line x1="360" y1="280" x2="550" y2="215" stroke="#466d89" stroke-width="8"/><line x1="360" y1="280" x2="550" y2="345" stroke="#466d89" stroke-width="8"/><circle cx="360" cy="280" r="10" fill="#ffffff" stroke="#273b45" stroke-width="2.5"/><text x="360" y="314" font-size="18" fill="#273b45" text-anchor="middle">J</text><line x1="240" y1="188" x2="282.59" y2="215.26" stroke="#287aab" stroke-width="3"/><polygon points="290,220 278.31,217.86 283.16,210.28" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><line x1="420" y1="286" x2="461.62" y2="299.32" stroke="#287aab" stroke-width="3"/><polygon points="470,302 458.15,302.93 460.89,294.36" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><line x1="428.33" y1="241.17" x2="461.67" y2="229.83" stroke="#b98232" stroke-width="3"/><polygon points="470,227 461.03,234.8 458.14,226.28" fill="#b98232" stroke="#b98232" stroke-width="1.5" stroke-linejoin="round"/><polygon points="420,244 428.97,236.2 431.86,244.72" fill="#b98232" stroke="#b98232" stroke-width="1.5" stroke-linejoin="round"/><text x="445" y="212" font-size="14" fill="#b98232" text-anchor="middle">either way</text><line x1="300" y1="170" x2="420" y2="170" stroke="#b64f4f" stroke-width="2" stroke-dasharray="7 5"/><text x="360" y="160" font-size="15" fill="#b64f4f" text-anchor="middle">junction head hJ</text><text x="360" y="395" font-size="16" fill="#273b45" text-anchor="middle">Continuity at J: inflow = outflow, with hJ found by trial</text></g></svg>