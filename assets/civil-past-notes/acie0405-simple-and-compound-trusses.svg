<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Simple and compound trusses</title><desc id="desc">A simple truss starts from a triangle and adds two bars for each new joint, so m = 2j - 3. A compound truss joins two simple trusses by three bars that are neither parallel nor concurrent, so m = m1 + m2 + 3.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="50" y1="260" x2="170" y2="260" stroke="#287aab" stroke-width="3.5"/><line x1="170" y1="260" x2="110" y2="150" stroke="#287aab" stroke-width="3.5"/><line x1="110" y1="150" x2="50" y2="260" stroke="#287aab" stroke-width="3.5"/><line x1="170" y1="260" x2="290" y2="260" stroke="#273b45" stroke-width="3.5"/><line x1="290" y1="260" x2="230" y2="150" stroke="#273b45" stroke-width="3.5"/><line x1="230" y1="150" x2="170" y2="260" stroke="#273b45" stroke-width="3.5"/><line x1="110" y1="150" x2="230" y2="150" stroke="#273b45" stroke-width="3.5"/><circle cx="50" cy="260" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><circle cx="170" cy="260" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><circle cx="290" cy="260" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><circle cx="110" cy="150" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><circle cx="230" cy="150" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><text x="110" y="232" font-size="14" fill="#287aab" text-anchor="middle">start</text><text x="170" y="310" font-size="20" fill="#273b45" text-anchor="middle"><tspan>m = 2j − 3</tspan></text><text x="170" y="340" font-size="17" fill="#647780" text-anchor="middle"><tspan>7 = 2(5) − 3</tspan></text><text x="170" y="390" font-size="15" fill="#647780" text-anchor="middle">simple truss</text><line x1="390" y1="260" x2="470" y2="260" stroke="#273b45" stroke-width="3.5"/><line x1="470" y1="260" x2="430" y2="170" stroke="#273b45" stroke-width="3.5"/><line x1="430" y1="170" x2="390" y2="260" stroke="#273b45" stroke-width="3.5"/><line x1="560" y1="260" x2="640" y2="260" stroke="#273b45" stroke-width="3.5"/><line x1="640" y1="260" x2="600" y2="170" stroke="#273b45" stroke-width="3.5"/><line x1="600" y1="170" x2="560" y2="260" stroke="#273b45" stroke-width="3.5"/><line x1="470" y1="260" x2="560" y2="260" stroke="#b64f4f" stroke-width="3.5"/><line x1="430" y1="170" x2="600" y2="170" stroke="#b64f4f" stroke-width="3.5"/><line x1="470" y1="260" x2="600" y2="170" stroke="#b64f4f" stroke-width="3.5"/><circle cx="390" cy="260" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><circle cx="470" cy="260" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><circle cx="430" cy="170" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><circle cx="560" cy="260" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><circle cx="640" cy="260" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><circle cx="600" cy="170" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><text x="515" y="150" font-size="14" fill="#b64f4f" text-anchor="middle">three linking bars</text><text x="515" y="310" font-size="20" fill="#273b45" text-anchor="middle"><tspan>m = m</tspan><tspan dy="6" font-size="14">1</tspan><tspan dy="-6"> + m</tspan><tspan dy="6" font-size="14">2</tspan><tspan dy="-6"> + 3</tspan></text><text x="515" y="340" font-size="17" fill="#647780" text-anchor="middle"><tspan>9 = 3 + 3 + 3</tspan></text><text x="515" y="390" font-size="15" fill="#647780" text-anchor="middle">compound truss</text></g></svg>