<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Equivalent bending moment and torque for a shaft</title><desc id="desc">A shaft carrying M and T has a surface element with bending stress 32M/πd cubed and shear 16T/πd cubed. Its major principal stress equals the bending stress of an equivalent moment Me = (M + root(M squared + T squared))/2, and its maximum shear equals the shear of an equivalent torque Te = root(M squared + T squared).</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><rect x="80" y="130" width="300" height="70" rx="8" fill="#deeee6" stroke="#273b45" stroke-width="2"/><ellipse cx="80" cy="165" rx="12" ry="35" fill="#deeee6" stroke="#273b45" stroke-width="2"/><path d="M41.89 187 A44 44 0 1 1 118.11 187" stroke="#b64f4f" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="118.11,187 119.71,175.22 127.5,179.72" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><path d="M418.11 187 A44 44 0 1 0 341.89 187" stroke="#b64f4f" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="341.89,187 332.5,179.72 340.29,175.22" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="80" y="104" font-size="17" fill="#b64f4f" text-anchor="middle"><tspan>M, T</tspan></text><text x="380" y="104" font-size="17" fill="#b64f4f" text-anchor="middle"><tspan>M, T</tspan></text><rect x="214" y="134" width="34" height="26" fill="#ffffff" stroke="#287aab" stroke-width="2"/><line x1="231" y1="160" x2="250" y2="250" stroke="#647780" stroke-width="1"/><rect x="250" y="250" width="70" height="70" fill="#e6f1f8" stroke="#273b45" stroke-width="2"/><line x1="324" y1="285" x2="351.2" y2="285" stroke="#b64f4f" stroke-width="2.5"/><polygon points="360,285 349,289.5 349,280.5" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><line x1="246" y1="285" x2="218.8" y2="285" stroke="#b64f4f" stroke-width="2.5"/><polygon points="210,285 221,280.5 221,289.5" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><line x1="262" y1="244" x2="299.2" y2="244" stroke="#2b7b61" stroke-width="2.5"/><polygon points="308,244 297,248.5 297,239.5" fill="#2b7b61" stroke="#2b7b61" stroke-width="1.5" stroke-linejoin="round"/><line x1="326" y1="306" x2="326" y2="272.8" stroke="#2b7b61" stroke-width="2.5"/><polygon points="326,264 330.5,275 321.5,275" fill="#2b7b61" stroke="#2b7b61" stroke-width="1.5" stroke-linejoin="round"/><text x="366" y="290" font-size="16" fill="#b64f4f" text-anchor="start"><tspan>σ</tspan><tspan dy="4" font-size="12">b</tspan><tspan dy="-4"> = 32M/πd³</tspan></text><text x="334" y="238" font-size="16" fill="#2b7b61" text-anchor="start"><tspan>τ = 16T/πd³</tspan></text><text x="166" y="360" font-size="15" fill="#647780" text-anchor="middle">surface element</text><text x="560" y="150" font-size="18" fill="#273b45" text-anchor="middle"><tspan>M</tspan><tspan dy="5" font-size="13">e</tspan><tspan dy="-5"> = ½(M + √(M² + T²))</tspan></text><text x="560" y="184" font-size="16" fill="#647780" text-anchor="middle"><tspan>gives σ</tspan><tspan dy="4" font-size="12">1</tspan><tspan dy="-4"> = 32M</tspan><tspan dy="4" font-size="12">e</tspan><tspan dy="-4">/πd³</tspan></text><text x="560" y="240" font-size="18" fill="#273b45" text-anchor="middle"><tspan>T</tspan><tspan dy="5" font-size="13">e</tspan><tspan dy="-5"> = √(M² + T²)</tspan></text><text x="560" y="274" font-size="16" fill="#647780" text-anchor="middle"><tspan>gives τ</tspan><tspan dy="4" font-size="12">max</tspan><tspan dy="-4"> = 16T</tspan><tspan dy="4" font-size="12">e</tspan><tspan dy="-4">/πd³</tspan></text></g></svg>