<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Fixing both ends halves the buckling length and quadruples the load</title><desc id="desc">A pin-ended column buckles in one half sine wave over its full length L. Fixing both ends moves the points of contraflexure to L/4 from each end, so only L/2 buckles like a pinned column and the crippling load becomes 4π squared EI/L squared.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="170" y1="40" x2="170" y2="67.2" stroke="#b64f4f" stroke-width="3.5"/><polygon points="170,76 165.5,65 174.5,65" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="184" y="58" font-size="18" fill="#b64f4f" text-anchor="start"><tspan>P</tspan></text><polygon points="170,80 158,98 182,98" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><polygon points="170,342 158,324 182,324" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><line x1="170" y1="98" x2="170" y2="324" stroke="#b8c8ce" stroke-width="6"/><path d="M170 98 L171.78 101.77 L173.55 105.53 L175.32 109.3 L177.07 113.07 L178.8 116.83 L180.51 120.6 L182.18 124.37 L183.83 128.13 L185.44 131.9 L187 135.67 L188.52 139.43 L189.98 143.2 L191.4 146.97 L192.75 150.73 L194.04 154.5 L195.27 158.27 L196.42 162.03 L197.51 165.8 L198.51 169.57 L199.44 173.33 L200.29 177.1 L201.06 180.87 L201.74 184.63 L202.34 188.4 L202.84 192.17 L203.26 195.93 L203.58 199.7 L203.81 203.47 L203.95 207.23 L204 211 L203.95 214.77 L203.81 218.53 L203.58 222.3 L203.26 226.07 L202.84 229.83 L202.34 233.6 L201.74 237.37 L201.06 241.13 L200.29 244.9 L199.44 248.67 L198.51 252.43 L197.51 256.2 L196.42 259.97 L195.27 263.73 L194.04 267.5 L192.75 271.27 L191.4 275.03 L189.98 278.8 L188.52 282.57 L187 286.33 L185.44 290.1 L183.83 293.87 L182.18 297.63 L180.51 301.4 L178.8 305.17 L177.07 308.93 L175.32 312.7 L173.55 316.47 L171.78 320.23 L170 324" stroke="#2b7b61" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="110" y1="98" x2="110" y2="324" stroke="#647780" stroke-width="1.5"/><line x1="117" y1="98" x2="103" y2="98" stroke="#647780" stroke-width="1.5"/><line x1="117" y1="324" x2="103" y2="324" stroke="#647780" stroke-width="1.5"/><text x="92" y="216" font-size="16" fill="#273b45" text-anchor="end"><tspan>l</tspan><tspan dy="4" font-size="12">e</tspan><tspan dy="-4"> = L</tspan></text><text x="170" y="380" font-size="20" fill="#273b45" text-anchor="middle"><tspan>P = π²EI/L²</tspan></text><line x1="500" y1="40" x2="500" y2="67.2" stroke="#b64f4f" stroke-width="3.5"/><polygon points="500,76 495.5,65 504.5,65" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="514" y="58" font-size="18" fill="#b64f4f" text-anchor="start"><tspan>4P</tspan></text><rect x="470" y="80" width="60" height="14" fill="#d6dfe3" stroke="#273b45" stroke-width="2"/><rect x="470" y="326" width="60" height="14" fill="#d6dfe3" stroke="#273b45" stroke-width="2"/><line x1="500" y1="94" x2="500" y2="326" stroke="#b8c8ce" stroke-width="6"/><path d="M500 94 L500.09 97.87 L500.37 101.73 L500.83 105.6 L501.47 109.47 L502.28 113.33 L503.25 117.2 L504.37 121.07 L505.62 124.93 L507.01 128.8 L508.5 132.67 L510.09 136.53 L511.75 140.4 L513.47 144.27 L515.22 148.13 L517 152 L518.78 155.87 L520.53 159.73 L522.25 163.6 L523.91 167.47 L525.5 171.33 L526.99 175.2 L528.38 179.07 L529.63 182.93 L530.75 186.8 L531.72 190.67 L532.53 194.53 L533.17 198.4 L533.63 202.27 L533.91 206.13 L534 210 L533.91 213.87 L533.63 217.73 L533.17 221.6 L532.53 225.47 L531.72 229.33 L530.75 233.2 L529.63 237.07 L528.38 240.93 L526.99 244.8 L525.5 248.67 L523.91 252.53 L522.25 256.4 L520.53 260.27 L518.78 264.13 L517 268 L515.22 271.87 L513.47 275.73 L511.75 279.6 L510.09 283.47 L508.5 287.33 L507.01 291.2 L505.62 295.07 L504.37 298.93 L