<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Counting the degree of static indeterminacy</title><desc id="desc">A beam with r reactions and h internal hinges has Ds = r - 3 - h. A plane truss has Ds = m + r - 2j, and a rigid-jointed plane frame Ds = 3m + r - 3j. Each example here has redundants: 1, 1 and 3.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="40" y1="104" x2="40" y2="156" stroke="#273b45" stroke-width="3"/><line x1="40" y1="108" x2="29" y2="118" stroke="#647780" stroke-width="1.4"/><line x1="40" y1="120" x2="29" y2="130" stroke="#647780" stroke-width="1.4"/><line x1="40" y1="132" x2="29" y2="142" stroke="#647780" stroke-width="1.4"/><line x1="40" y1="144" x2="29" y2="154" stroke="#647780" stroke-width="1.4"/><line x1="40" y1="130" x2="220" y2="130" stroke="#273b45" stroke-width="6"/><polygon points="130,135 115,156 145,156" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><circle cx="122" cy="162" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><circle cx="138" cy="162" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><line x1="108" y1="169" x2="152" y2="169" stroke="#647780" stroke-width="2"/><polygon points="220,135 205,156 235,156" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><circle cx="212" cy="162" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><circle cx="228" cy="162" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><line x1="198" y1="169" x2="242" y2="169" stroke="#647780" stroke-width="2"/><circle cx="176" cy="130" r="6" fill="#ffffff" stroke="#273b45" stroke-width="2.5"/><text x="176" y="110" font-size="14" fill="#647780" text-anchor="middle">hinge</text><text x="130" y="240" font-size="16" fill="#273b45" text-anchor="middle"><tspan>r = 3 + 1 + 1 = 5, h = 1</tspan></text><text x="130" y="274" font-size="18" fill="#273b45" text-anchor="middle"><tspan>D</tspan><tspan dy="5" font-size="13">s</tspan><tspan dy="-5"> = r − 3 − h</tspan></text><text x="130" y="304" font-size="18" fill="#287aab" text-anchor="middle"><tspan>= 5 − 3 − 1 = 1</tspan></text><text x="130" y="350" font-size="15" fill="#647780" text-anchor="middle">beam with a hinge</text><line x1="280" y1="180" x2="430" y2="180" stroke="#273b45" stroke-width="3"/><line x1="430" y1="180" x2="430" y2="90" stroke="#273b45" stroke-width="3"/><line x1="430" y1="90" x2="280" y2="90" stroke="#273b45" stroke-width="3"/><line x1="280" y1="90" x2="280" y2="180" stroke="#273b45" stroke-width="3"/><line x1="280" y1="180" x2="430" y2="90" stroke="#273b45" stroke-width="3"/><line x1="430" y1="180" x2="280" y2="90" stroke="#273b45" stroke-width="3"/><circle cx="280" cy="180" r="4" fill="#ffffff" stroke="#273b45" stroke-width="2"/><circle cx="430" cy="180" r="4" fill="#ffffff" stroke="#273b45" stroke-width="2"/><circle cx="430" cy="90" r="4" fill="#ffffff" stroke="#273b45" stroke-width="2"/><circle cx="280" cy="90" r="4" fill="#ffffff" stroke="#273b45" stroke-width="2"/><polygon points="280,185 265,209 295,209" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><line x1="258" y1="212" x2="302" y2="212" stroke="#647780" stroke-width="2"/><polygon points="430,185 415,206 445,206" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><circle cx="422" cy="212" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><circle cx="438" cy="212" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><line x1="408" y1="219" x2="452" y2="219" stroke="#647780" stroke-width="2"/><text x="355" y="274" font-size="18" fill="#273b45" text-anchor="middle"><tspan>D</tspan><tspan dy="5" font-size="13">s</tspan><tspan dy="-5"> = m + r − 2j</tspan></text><text x="355" y="240" font-size="16" fill="#273b45" text-anchor="middle"><tspan>m = 6, r = 3, j = 4</tspan></text><text x="355" y="304" font-size="18" fill="#287aab" text-anchor="middle"><tspan>= 6 + 3 − 8 = 1</tspan></text><text x="355" y="350" font-size="15" fill="#647780" text-anchor="middle">truss with both diagonals</text><line x1="510" y1="190" x2="510" y2="110" stroke="#273b45" stroke-width="5"/><line x1="640" y1="190" x2="640" y2="110" stroke="#273b45" stroke-width="5"/><line x1="510" y1="110" x2="640" y2="110" stroke="#273b45" stroke-width="5"/><line x1="490" y1="192" x2="530" y2="192" stroke="#273b45" stroke-width="3"/><line x1="490" y1="193" x2="500" y2="203" stroke="#8a9aa3" stroke-width="1"/><line x1="500" y1="193" x2="510" y2="203" stroke="#8a9aa3" stroke-width="1"/><line x1="510" y1="193" x2="520" y2="203" stroke="#8a9aa3" stroke-width="1"/><line x1="520" y1="193" x2="530" y2="203" stroke="#8a9aa3" stroke-width="1"/><line x1="620" y1="192" x2="660" y2="192" stroke="#273b45" stroke-width="3"/><line x1="620" y1="193" x2="630" y2="203" stroke="#8a9aa3" stroke-width="1"/><line x1="630" y1="193" x2="640" y2="203" stroke="#8a9aa3" stroke-width="1"/><line x1="640" y1="193" x2="650" y2="203" stroke="#8a9aa3" stroke-width="1"/><line x1="650" y1="193" x2="660" y2="203" stroke="#8a9aa3" stroke-width="1"/><text x="575" y="240" font-size="16" fill="#273b45" text-anchor="middle"><tspan>m = 3, r = 6, j = 4</tspan></text><text x="575" y="274" font-size="18" fill="#273b45" text-anchor="middle"><tspan>D</tspan><tspan dy="5" font-size="13">s</tspan><tspan dy="-5"> = 3m + r − 3j</tspan></text><text x="575" y="304" font-size="18" fill="#287aab" text-anchor="middle"><tspan>= 9 + 6 − 12 = 3</tspan></text><text x="575" y="350" font-size="15" fill="#647780" text-anchor="middle">portal, fixed bases</text><text x="360" y="400" font-size="15" fill="#647780" text-anchor="middle">Ds = 0: statically determinate; Ds &gt; 0: that many redundants</text></g></svg>