<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Grading curves of aggregates</title><desc id="desc">A well-graded aggregate plots as a smooth S-shaped curve across the sieve sizes; a uniformly graded one rises steeply over a narrow range, and a gap-graded one runs flat where sizes are missing.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="100" y1="320" x2="100" y2="70" stroke="#b8c8ce" stroke-width="1"/><text x="100" y="342" font-size="13" fill="#647780" text-anchor="middle">0.15</text><line x1="164.52" y1="320" x2="164.52" y2="70" stroke="#b8c8ce" stroke-width="1"/><text x="164.52" y="342" font-size="13" fill="#647780" text-anchor="middle">0.3</text><line x1="229.05" y1="320" x2="229.05" y2="70" stroke="#b8c8ce" stroke-width="1"/><text x="229.05" y="342" font-size="13" fill="#647780" text-anchor="middle">0.6</text><line x1="292.01" y1="320" x2="292.01" y2="70" stroke="#b8c8ce" stroke-width="1"/><text x="292.01" y="342" font-size="13" fill="#647780" text-anchor="middle">1.18</text><line x1="356.54" y1="320" x2="356.54" y2="70" stroke="#b8c8ce" stroke-width="1"/><text x="356.54" y="342" font-size="13" fill="#647780" text-anchor="middle">2.36</text><line x1="421.65" y1="320" x2="421.65" y2="70" stroke="#b8c8ce" stroke-width="1"/><text x="421.65" y="342" font-size="13" fill="#647780" text-anchor="middle">4.75</text><line x1="490.95" y1="320" x2="490.95" y2="70" stroke="#b8c8ce" stroke-width="1"/><text x="490.95" y="342" font-size="13" fill="#647780" text-anchor="middle">10</text><line x1="555.48" y1="320" x2="555.48" y2="70" stroke="#b8c8ce" stroke-width="1"/><text x="555.48" y="342" font-size="13" fill="#647780" text-anchor="middle">20</text><line x1="620" y1="320" x2="620" y2="70" stroke="#b8c8ce" stroke-width="1"/><text x="620" y="342" font-size="13" fill="#647780" text-anchor="middle">40</text><line x1="100" y1="320" x2="626" y2="320" stroke="#647780" stroke-width="2"/><polygon points="634,320 624,324 624,316" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><line x1="100" y1="320" x2="100" y2="54" stroke="#647780" stroke-width="2"/><polygon points="100,46 104,56 96,56" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><text x="106" y="36" font-size="17" fill="#273b45" text-anchor="start">Percentage passing</text><text x="92" y="325" font-size="14" fill="#647780" text-anchor="end">0</text><text x="92" y="200" font-size="14" fill="#647780" text-anchor="end">50</text><text x="92" y="75" font-size="14" fill="#647780" text-anchor="end">100</text><text x="360" y="372" font-size="16" fill="#273b45" text-anchor="middle">Sieve size (mm), on a log scale</text><path d="M100 312.5 L164.52 300 L229.05 277.5 L292.01 252.5 L356.54 227.5 L421.65 200 L490.95 160 L555.48 105 L620 70" stroke="#287aab" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M100 320 L164.52 320 L229.05 320 L292.01 320 L356.54 317.5 L421.65 312.5 L490.95 282.5 L555.48 107.5 L620 70" stroke="#b64f4f" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M100 310 L164.52 290 L229.05 257.5 L292.01 245 L356.54 242.5 L421.65 240 L490.95 182.5 L555.48 107.5 L620 70" stroke="#b98232" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="413.65" y="190" font-size="15" fill="#287aab" text-anchor="end">well graded</text><text x="534" y="205" font-size="15" fill="#b64f4f" text-anchor="start">uniformly graded</text><text x="360" y="266" font-size="15" fill="#b98232" text-anchor="middle">gap graded</text></g></svg>