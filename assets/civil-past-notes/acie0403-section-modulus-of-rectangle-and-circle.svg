<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Section modulus of a rectangle and a solid circle</title><desc id="desc">Bending stress grows linearly from the neutral axis, so the extreme fibre at y max carries σ max = M/Z with Z = I/y max. A rectangle has Z = bd squared/6 and a solid circle Z = πd cubed/32.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><rect x="90" y="110" width="90" height="180" fill="#d6dfe3" stroke="#273b45" stroke-width="2"/><line x1="70" y1="200" x2="200" y2="200" stroke="#647780" stroke-width="1.2" stroke-dasharray="6 4"/><text x="186" y="194" font-size="13" fill="#647780" text-anchor="start">NA</text><line x1="90" y1="310" x2="180" y2="310" stroke="#647780" stroke-width="1.5"/><line x1="90" y1="303" x2="90" y2="317" stroke="#647780" stroke-width="1.5"/><line x1="180" y1="303" x2="180" y2="317" stroke="#647780" stroke-width="1.5"/><text x="135" y="336" font-size="16" fill="#647780" text-anchor="middle">b</text><line x1="64" y1="110" x2="64" y2="290" stroke="#647780" stroke-width="1.5"/><line x1="71" y1="110" x2="57" y2="110" stroke="#647780" stroke-width="1.5"/><line x1="71" y1="290" x2="57" y2="290" stroke="#647780" stroke-width="1.5"/><text x="42" y="206" font-size="16" fill="#647780" text-anchor="end">d</text><polygon points="220,110 270,110 220,200" fill="#e6f1f8" stroke="#287aab" stroke-width="2" stroke-linejoin="round"/><polygon points="220,200 220,290 270,290" fill="#f2dfdf" stroke="#b64f4f" stroke-width="2" stroke-linejoin="round"/><text x="276" y="114" font-size="15" fill="#287aab" text-anchor="start"><tspan>σ</tspan><tspan dy="4" font-size="11">max</tspan></text><text x="150" y="368" font-size="21" fill="#273b45" text-anchor="middle"><tspan>Z = bd²/6</tspan></text><circle cx="470" cy="200" r="88" fill="#d6dfe3" stroke="#273b45" stroke-width="2"/><line x1="360" y1="200" x2="580" y2="200" stroke="#647780" stroke-width="1.2" stroke-dasharray="6 4"/><line x1="382" y1="312" x2="558" y2="312" stroke="#647780" stroke-width="1.5"/><line x1="382" y1="305" x2="382" y2="319" stroke="#647780" stroke-width="1.5"/><line x1="558" y1="305" x2="558" y2="319" stroke="#647780" stroke-width="1.5"/><text x="470" y="338" font-size="16" fill="#647780" text-anchor="middle">d</text><polygon points="600,200 600,112 650,112" fill="#e6f1f8" stroke="#287aab" stroke-width="2" stroke-linejoin="round"/><polygon points="600,200 600,288 650,288" fill="#f2dfdf" stroke="#b64f4f" stroke-width="2" stroke-linejoin="round"/><text x="470" y="368" font-size="21" fill="#273b45" text-anchor="middle"><tspan>Z = πd³/32</tspan></text><text x="360" y="404" font-size="17" fill="#647780" text-anchor="middle"><tspan>σ</tspan><tspan dy="5" font-size="12">max</tspan><tspan dy="-5"> = M/Z,  Z = I/y</tspan><tspan dy="5" font-size="12">max</tspan><tspan dy="-5">,  y</tspan><tspan dy="5" font-size="12">max</tspan><tspan dy="-5"> = d/2</tspan></text></g></svg>