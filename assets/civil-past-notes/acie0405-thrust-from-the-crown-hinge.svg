<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Thrust of a three-hinged arch from the crown hinge</title><desc id="desc">The crown hinge carries no moment, so taking moments about it for one half gives H h = M crown, the simple-beam moment at the crown. At any other section the arch moment is the beam moment less H times the rise y there.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><path d="M60 300 L65.13 290.62 L70.25 281.48 L75.38 272.57 L80.5 263.9 L85.63 255.47 L90.75 247.28 L95.88 239.32 L101 231.6 L106.13 224.12 L111.25 216.88 L116.38 209.87 L121.5 203.1 L126.63 196.57 L131.75 190.28 L136.88 184.22 L142 178.4 L147.13 172.82 L152.25 167.48 L157.38 162.37 L162.5 157.5 L167.63 152.87 L172.75 148.48 L177.88 144.32 L183 140.4 L188.13 136.72 L193.25 133.27 L198.38 130.07 L203.5 127.1 L208.63 124.37 L213.75 121.88 L218.88 119.62 L224 117.6 L229.13 115.82 L234.25 114.28 L239.38 112.97 L244.5 111.9 L249.63 111.07 L254.75 110.48 L259.88 110.12 L265 110 L270.13 110.12 L275.25 110.48 L280.38 111.07 L285.5 111.9 L290.63 112.97 L295.75 114.28 L300.88 115.82 L306 117.6 L311.13 119.62 L316.25 121.88 L321.38 124.37 L326.5 127.1 L331.63 130.07 L336.75 133.28 L341.88 136.72 L347 140.4 L352.13 144.32 L357.25 148.48 L362.38 152.87 L367.5 157.5 L372.63 162.37 L377.75 167.48 L382.88 172.82 L388 178.4 L393.13 184.22 L398.25 190.27 L403.38 196.57 L408.5 203.1 L413.63 209.87 L418.75 216.88 L423.88 224.12 L429 231.6 L434.13 239.32 L439.25 247.28 L444.38 255.47 L449.5 263.9 L454.63 272.57 L459.75 281.47 L464.88 290.62 L470 300" stroke="#273b45" stroke-width="6" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="265" cy="110" r="7" fill="#ffffff" stroke="#273b45" stroke-width="2.5"/><circle cx="60" cy="300" r="7" fill="#ffffff" stroke="#273b45" stroke-width="2.5"/><line x1="36" y1="309" x2="84" y