<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Aggregate impact test</title><desc id="desc">A hammer of about 14 kg falls 15 times through 380 mm onto aggregate in a steel cup; the fines then passing the 2.36 mm sieve, as a percentage of the sample, give the aggregate impact value.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><rect x="90" y="330" width="260" height="18" fill="#466d89" stroke="#273b45" stroke-width="2"/><line x1="150" y1="330" x2="150" y2="70" stroke="#273b45" stroke-width="4"/><line x1="290" y1="330" x2="290" y2="70" stroke="#273b45" stroke-width="4"/><line x1="140" y1="70" x2="300" y2="70" stroke="#273b45" stroke-width="5"/><line x1="220" y1="70" x2="220" y2="120" stroke="#647780" stroke-width="2"/><rect x="185" y="120" width="70" height="44" fill="#466d89" stroke="#273b45" stroke-width="2"/><rect x="180" y="280" width="80" height="50" fill="#d6dfe3" stroke="#273b45" stroke-width="2.5"/><circle cx="190" cy="290" r="4" fill="#8a9aa3" stroke="#273b45" stroke-width="1"/><circle cx="202" cy="290" r="4" fill="#8a9aa3" stroke="#273b45" stroke-width="1"/><circle cx="214" cy="290" r="4" fill="#8a9aa3" stroke="#273b45" stroke-width="1"/><circle cx="226" cy="290" r="4" fill="#8a9aa3" stroke="#273b45" stroke-width="1"/><circle cx="238" cy="290" r="4" fill="#8a9aa3" stroke="#273b45" stroke-width="1"/><circle cx="250" cy="290" r="4" fill="#8a9aa3" stroke="#273b45" stroke-width="1"/><circle cx="195" cy="300" r="4" fill="#8a9aa3" stroke="#273b45" stroke-width="1"/><circle cx="207" cy="300" r="4" fill="#8a9aa3" stroke="#273b45" stroke-width="1"/><circle cx="219" cy="300" r="4" fill="#8a9aa3" stroke="#273b45" stroke-width="1"/><circle cx="231" cy="300" r="4" fill="#8a9aa3" stroke="#273b45" stroke-width="1"/><circle cx="243" cy="300" r="4" fill="#8a9aa3" stroke="#273b45" stroke-width="1"/><circle cx="255" cy="300" r="4" fill="#8a9aa3" stroke="#273b45" stroke-width="1"/><circle cx="190" cy="310" r="4" fill="#8a9aa3" stroke="#273b45" stroke-width="1"/><circle cx="202" cy="310" r="4" fill="#8a9aa3" stroke="#273b45" stroke-width="1"/><circle cx="214" cy="310" r="4" fill="#8a9aa3" stroke="#273b45" stroke-width="1"/><circle cx="226" cy="310" r="4" fill="#8a9aa3" stroke="#273b45" stroke-width="1"/><circle cx="238" cy="310" r="4" fill="#8a9aa3" stroke="#273b45" stroke-width="1"/><circle cx="250" cy="310" r="4" fill="#8a9aa3" stroke="#273b45" stroke-width="1"/><circle cx="195" cy="320" r="4" fill="#8a9aa3" stroke="#273b45" stroke-width="1"/><circle cx="207" cy="320" r="4" fill="#8a9aa3" stroke="#273b45" stroke-width="1"/><circle cx="219" cy="320" r="4" fill="#8a9aa3" stroke="#273b45" stroke-width="1"/><circle cx="231" cy="320" r="4" fill="#8a9aa3" stroke="#273b45" stroke-width="1"/><circle cx="243" cy="320" r="4" fill="#8a9aa3" stroke="#273b45" stroke-width="1"/><circle cx="255" cy="320" r="4" fill="#8a9aa3" stroke="#273b45" stroke-width="1"/><line x1="320" y1="164" x2="320" y2="280" stroke="#647780" stroke-width="1.5"/><line x1="327" y1="164" x2="313" y2="164" stroke="#647780" stroke-width="1.5"/><line x1="327" y1="280" x2="313" y2="280" stroke="#647780" stroke-width="1.5"/><text x="330" y="228" font-size="15" fill="#647780" text-anchor="start">380 mm</text><text x="140" y="146" font-size="15" fill="#273b45" text-anchor="end">hammer</text><text x="140" y="166" font-size="15" fill="#647780" text-anchor="end">14 kg</text><text x="140" y="186" font-size="15" fill="#647780" text-anchor="end">15 blows</text><text x="220" y="374" font-size="15" fill="#273b45" text-anchor="middle">steel cup with the aggregate sample</text><text x="555" y="150" font-size="16" fill="#273b45" text-anchor="middle">2.36 mm sieve</text><rect x="470" y="164" width="170" height="34" fill="#d6dfe3" stroke="#273b45" stroke-width="2"/><line x1="472" y1="188" x2="480" y2="196" stroke="#8a9aa3" stroke-width="1"/><line x1="476" y1="184" x2="488" y2="196" stroke="#8a9aa3" stroke-width="1"/><line x1="484" y1="184" x2="496" y2="196" stroke="#8a9aa3" stroke-width="1"/><line x1="492" y1="184" x2="504" y2="196" stroke="#8a9aa3" stroke-width="1"/><line x1="500" y1="184" x2="512" y2="196" stroke="#8a9aa3" stroke-width="1"/><line x1="508" y1="184" x2="520" y2="196" stroke="#8a9aa3" stroke-width="1"/><line x1="516" y1="184" x2="528" y2="196" stroke="#8a9aa3" stroke-width="1"/><line x1="524" y1="184" x2="536" y2="196" stroke="#8a9aa3" stroke-width="1"/><line x1="532" y1="184" x2="544" y2="196" stroke="#8a9aa3" stroke-width="1"/><line x1="540" y1="184" x2="552" y2="196" stroke="#8a9aa3" stroke-width="1"/><line x1="548" y1="184" x2="560" y2="196" stroke="#8a9aa3" stroke-width="1"/><line x1="556" y1="184" x2="568" y2="196" stroke="#8a9aa3" stroke-width="1"/><line x1="564" y1="184" x2="576" y2="196" stroke="#8a9aa3" stroke-width="1"/><line x1="572" y1="184" x2="584" y2="196" stroke="#8a9aa3" stroke-width="1"/><line x1="580" y1="184" x2="592" y2="196" stroke="#8a9aa3" stroke-width="1"/><line x1="588" y1="184" x2="600" y2="196" stroke="#8a9aa3" stroke-width="1"/><line x1="596" y1="184" x2="608" y2="196" stroke="#8a9aa3" stroke-width="1"/><line x1="604" y1="184" x2="616" y2="196" stroke="#8a9aa3" stroke-width="1"/><line x1="612" y1="184" x2="624" y2="196" stroke="#8a9aa3" stroke-width="1"/><line x1="620" y1="184" x2="632" y2="196" stroke="#8a9aa3" stroke-width="1"/><line x1="628" y1="184" x2="638" y2="194" stroke="#8a9aa3" stroke-width="1"/><line x1="636" y1="184" x2="638" y2="186" stroke="#8a9aa3" stroke-width="1"/><circle cx="500" cy="222" r="2.5" fill="#8a9aa3" stroke="none" stroke-width="2"/><circle cx="540" cy="232" r="2.5" fill="#8a9aa3" stroke="none" stroke-width="2"/><circle cx="590" cy="220" r="2.5" fill="#8a9aa3" stroke="none" stroke-width="2"/><circle cx="620" cy="240" r="2.5" fill="#8a9aa3" stroke="none" stroke-width="2"/><circle cx="520" cy="252" r="2.5" fill="#8a9aa3" stroke="none" stroke-width="2"/><circle cx="575" cy="258" r="2.5" fill="#8a9aa3" stroke="none" stroke-width="2"/><text x="555" y="300" font-size="17" fill="#273b45" text-anchor="middle">AIV = W2 / W1 × 100%</text><text x="555" y="326" font-size="14" fill="#647780" text-anchor="middle">W1: sample, W2: fines passing</text><text x="555" y="360" font-size="14" fill="#2b7b61" text-anchor="middle">at most 30% for wearing surfaces</text><text x="555" y="380" font-size="14" fill="#2b7b61" text-anchor="middle">and 45% for other concrete</text></g></svg>