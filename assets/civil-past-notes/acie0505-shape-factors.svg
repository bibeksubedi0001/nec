<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Shape factors of common sections</title><desc id="desc">The shape factor S = Zp/Ze is the ratio of the plastic to the elastic moment. It is 1.5 for a rectangle, 1.7 for a solid circle and 2.0 for a diamond, but only about 1.12 for an I-section, whose flanges already work hard in the elastic state.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><rect x="70" y="140" width="70" height="120" fill="#d6dfe3" stroke="#273b45" stroke-width="2"/><circle cx="270" cy="200" r="60" fill="#d6dfe3" stroke="#273b45" stroke-width="2"/><polygon points="430,138 490,200 430,262 370,200" fill="#d6dfe3" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><polygon points="545,140 645,140 645,156 601,156 601,244 645,244 645,260 545,260 545,244 589,244 589,156 545,156" fill="#d6dfe3" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><text x="105" y="300" font-size="15" fill="#647780" text-anchor="middle">rectangle</text><text x="105" y="336" font-size="20" fill="#287aab" text-anchor="middle"><tspan>S = 1.5</tspan></text><text x="270" y="300" font-size="15" fill="#647780" text-anchor="middle">solid circle</text><text x="270" y="336" font-size="20" fill="#287aab" text-anchor="middle"><tspan>S = 1.7</tspan></text><text x="430" y="300" font-size="15" fill="#647780" text-anchor="middle">diamond</text><text x="430" y="336" font-size="20" fill="#287aab" text-anchor="middle"><tspan>S = 2.0</tspan></text><text x="595" y="300" font-size="15" fill="#647780" text-anchor="middle">I-section</text><text x="595" y="336" font-size="20" fill="#287aab" text-anchor="middle"><tspan>S ≈ 1.12</tspan></text><text x="360" y="100" font-size="20" fill="#273b45" text-anchor="middle"><tspan>S = Z</tspan><tspan dy="6" font-size="14">p</tspan><tspan dy="-6">/Z</tspan><tspan dy="6" font-size="14">e</tspan><tspan dy="-6"> = M</tspan><tspan dy="6" font-size="14">p</tspan><tspan dy="-6">/M</tspan><tspan dy="6" font-size="14">y</tspan></text><text x="360" y="396" font-size="15" fill="#647780" text-anchor="middle">Load factor = shape factor × factor of safety</text></g></svg>