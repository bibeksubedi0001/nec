<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Normal and shear stress on a plane inclined in a bar under tension</title><desc id="desc">Cut a bar under axial stress σ by a plane whose normal makes θ with the axis. Resolving the force on the smaller wedge gives a normal stress σ cos squared θ and a shear stress (σ/2) sin 2θ on the plane; the shear peaks at σ/2 on planes at 45 degrees.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><polygon points="80,120 250,120 330,240 80,240" fill="#e6f1f8" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><polygon points="250,120 440,120 440,240 330,240" fill="#d6dfe3" stroke="#647780" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="5 4"/><line x1="80" y1="140" x2="47.2" y2="140" stroke="#b64f4f" stroke-width="2.5"/><polygon points="40,140 49,136 49,144" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><line x1="80" y1="180" x2="47.2" y2="180" stroke="#b64f4f" stroke-width="2.5"/><polygon points="40,180 49,176 49,184" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><line x1="80" y1="220" x2="47.2" y2="220" stroke="#b64f4f" stroke-width="2.5"/><polygon points="40,220 49,216 49,224" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="34" y="118" font-size="18" fill="#b64f4f" text-anchor="middle"><tspan>σ</tspan></text><line x1="290" y1="180" x2="345.91" y2="142.72" stroke="#287aab" stroke-width="3"/><polygon points="353.24,137.84 346.58,147.69 341.59,140.2" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><text x="362.56" y="131.62" font-size="18" fill="#287aab" text-anchor="start"><tspan>σ</tspan><tspan dy="5" font-size="13">n</tspan></text><line x1="273.36" y1="155.04" x2="309.53" y2="209.29" stroke="#2b7b61" stroke-width="3"/><polygon points="314.41,216.61 304.56,209.95 312.05,204.96" fill="#2b7b61" stroke="#2b7b61" stroke-width="1.5" stroke-linejoin="round"/><text x="325.74" y="229.6" font-size="18" fill="#2b7b61" text-anchor="start"><tspan>τ</tspan></text><line x1="290" y1="180" x2="360" y2="180" stroke="#647780" stroke-width="1.2" stroke-dasharray="4 4"/><path d="M330 180 A40 40 0 0 0 323.28 157.81" stroke="#b98232" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="340" y="168" font-size="17" fill="#b98232" text-anchor="start"><tspan>θ</tspan></text><text x="575" y="160" font-size="21" fill="#273b45" text-anchor="middle"><tspan>σ</tspan><tspan dy="6" font-size="15">n</tspan><tspan dy="-6"> = σ cos²θ</tspan></text><text x="575" y="200" font-size="21" fill="#273b45" text-anchor="middle"><tspan>τ = (σ/2) sin 2θ</tspan></text><text x="575" y="250" font-size="17" fill="#647780" text-anchor="middle"><tspan>τ</tspan><tspan dy="5" font-size="12">max</tspan><tspan dy="-5"> = σ/2 at θ = 45°</tspan></text><text x="260" y="290" font-size="15" fill="#647780" text-anchor="middle">θ: angle between the plane's normal and the bar axis</text><text x="360" y="395" font-size="15" fill="#647780" text-anchor="middle">The cross-section itself (θ = 0) carries σ and no shear</text></g></svg>