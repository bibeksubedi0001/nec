<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Base shear shared among the floors</title><desc id="desc">The equivalent static method applies the base shear as forces at the floor levels in proportion to each floor's weight times its height to the power k, so the forces grow up the building while the storey shear builds up towards the base.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><text x="200" y="60" font-size="15" fill="#273b45" text-anchor="middle">Floor forces for k = 1 and equal floor weights</text><line x1="60" y1="330" x2="340" y2="330" stroke="#647780" stroke-width="2"/><line x1="66" y1="331" x2="56" y2="342" stroke="#647780" stroke-width="1.4"/><line x1="80" y1="331" x2="70" y2="342" stroke="#647780" stroke-width="1.4"/><line x1="94" y1="331" x2="84" y2="342" stroke="#647780" stroke-width="1.4"/><line x1="108" y1="331" x2="98" y2="342" stroke="#647780" stroke-width="1.4"/><line x1="122" y1="331" x2="112" y2="342" stroke="#647780" stroke-width="1.4"/><line x1="136" y1="331" x2="126" y2="342" stroke="#647780" stroke-width="1.4"/><line x1="150" y1="331" x2="140" y2="342" stroke="#647780" stroke-width="1.4"/><line x1="164" y1="331" x2="154" y2="342" stroke="#647780" stroke-width="1.4"/><line x1="178" y1="331" x2="168" y2="342" stroke="#647780" stroke-width="1.4"/><line x1="192" y1="331" x2="182" y2="342" stroke="#647780" stroke-width="1.4"/><line x1="206" y1="331" x2="196" y2="342" stroke="#647780" stroke-width="1.4"/><line x1="220" y1="331" x2="210" y2="342" stroke="#647780" stroke-width="1.4"/><line x1="234" y1="331" x2="224" y2="342" stroke="#647780" stroke-width="1.4"/><line x1="248" y1="331" x2="238" y2="342" stroke="#647780" stroke-width="1.4"/><line x1="262" y1="331" x2="252" y2="342" stroke="#647780" stroke-width="1.4"/><line x1="276" y1="331" x2="266" y2="342" stroke="#647780" stroke-width="1.4"/><line x1="290" y1="331" x2="280" y2="342" stroke="#647780" stroke-width="1.4"/><line x1="304" y1="331" x2="294" y2="342" stroke="#647780" stroke-width="1.4"/><line x1="318" y1="331" x2="308" y2="342" stroke="#647780" stroke-width="1.4"/><line x1="332" y1="331" x2="322" y2="342" stroke="#647780" stroke-width="1.4"/><line x1="120" y1="330" x2="120" y2="90" stroke="#273b45" stroke-width="4"/><line x1="280" y1="330" x2="280" y2="90" stroke="#273b45" stroke-width="4"/><line x1="112" y1="270" x2="288" y2="270" stroke="#273b45" stroke-width="6"/><line x1="292" y1="270" x2="307.2" y2="270" stroke="#b64f4f" stroke-width="3.5"/><polygon points="316,270 305,274.5 305,265.5" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="324" y="276" font-size="15" fill="#b64f4f" text-anchor="start">F1 = 10 kN</text><line x1="112" y1="210" x2="288" y2="210" stroke="#273b45" stroke-width="6"/><line x1="292" y1="210" x2="331.2" y2="210" stroke="#b64f4f" stroke-width="3.5"/><polygon points="340,210 329,214.5 329,205.5" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="348" y="216" font-size="15" fill="#b64f4f" text-anchor="start">F2 = 20 kN</text><line x1="112" y1="150" x2="288" y2="150" stroke="#273b45" stroke-width="6"/><line x1="292" y1="150" x2="355.2" y2="150" stroke="#b64f4f" stroke-width="3.5"/><polygon points="364,150 353,154.5 353,145.5" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="372" y="156" font-size="15" fill="#b64f4f" text-anchor="start">F3 = 30 kN</text><line x1="112" y1="90" x2="288" y2="90" stroke="#273b45" stroke-width="6"/><line x1="292" y1="90" x2="379.2" y2="90" stroke="#b64f4f" stroke-width="3.5"/><polygon points="388,90 377,94.5 377,85.5" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="396" y="96" font-size="15" fill="#b64f4f" text-anchor="start">F4 = 40 kN</text><line x1="250" y1="352" x2="158.8" y2="352" 