<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Loss of prestress by friction along a curved duct</title><desc id="desc">The tendon force falls from the jacking end as the tendon rubs on the duct, decaying exponentially with the angle turned and the length travelled; a parabolic duct turns at a steady rate, so here the force falls almost linearly.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><rect x="120" y="70" width="500" height="60" fill="#e4e8e9" stroke="#273b45" stroke-width="2"/><path d="M120 84 Q370 156 620 84" stroke="#647780" stroke-width="8" fill="none" stroke-linejoin="round" stroke-linecap="round" opacity="0.45"/><path d="M120 84 Q370 156 620 84" stroke="#b64f4f" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><rect x="84" y="72" width="36" height="26" fill="#466d89" stroke="#273b45" stroke-width="2"/><line x1="84" y1="85" x2="48.8" y2="85" stroke="#b64f4f" stroke-width="3"/><polygon points="40,85 51,80.5 51,89.5" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="58" y="72" font-size="16" fill="#b64f4f" text-anchor="middle">P0</text><text x="640" y="128" font-size="14" fill="#647780" text-anchor="start">dead end</text><line x1="120" y1="340" x2="626" y2="340" stroke="#647780" stroke-width="2"/><polygon points="634,340 624,344 624,336" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><line x1="120" y1="340" x2="120" y2="184" stroke="#647780" stroke-width="2"/><polygon points="120,176 124,186 116,186" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><text x="370" y="376" font-size="16" fill="#273b45" text-anchor="middle">Distance from the jacking end</text><text x="126" y="176" font-size="16" fill="#273b45" text-anchor="start">Tendon force P / P0</text><line x1="120" y1="201.11" x2="620" y2="201.11" stroke="#647780" stroke-width="1.2" stroke-dasharray="5 4"/><text x="112" y="206.11" font-size="14" fill="#647780" text-anchor="end">1.0</text><text x="112" y="261.67" font-size="14" fill="#647780" text-anchor="end">0.9</text><text x="112" y="317.22" font-size="14" fill="#647780" text-anchor="end">0.8</text><path d="M120 201.11 L126.25 202.22 L132.5 203.33 L138.75 204.43 L145 205.54 L151.25 206.64 L157.5 207.74 L163.75 208.83 L170 209.93 L176.25 211.02 L182.5 212.11 L188.75 213.2 L195 214.29 L201.25 215.37 L207.5 216.45 L213.75 217.53 L220 218.61 L226.25 219.68 L232.5 220.76 L238.75 221.83 L245 222.89 L251.25 223.96 L257.5 225.03 L263.75 226.09 L270 227.15 L276.25 228.21 L282.5 229.26 L288.75 230.32 L295 231.37 L301.25 232.42 L307.5 233.46 L313.75 234.51 L320 235.55 L326.25 236.59 L332.5 237.63 L338.75 238.67 L345 239.71 L351.25 240.74 L357.5 241.77 L363.75 242.8 L370 243.82 L376.25 244.85 L382.5 245.87 L388.75 246.89 L395 247.91 L401.25 248.93 L407.5 249.94 L413.75 250.95 L420 251.96 L426.25 252.97 L432.5 253.98 L438.75 254.98 L445 255.99 L451.25 256.99 L457.5 257.98 L463.75 258.98 L470 259.98 L476.25 260.97 L482.5 261.96 L488.75 262.95 L495 263.93 L501.25 264.92 L507.5 265.9 L513.75 266.88 L520 267.86 L526.25 268.84 L532.5 269.81 L538.75 270.78 L545 271.75 L551.25 272.72 L557.5 273.69 L563.75 274.65 L570 275.62 L576.25 276.58 L582.5 277.54 L588.75 278.5 L595 279.45 L601.25 280.4 L607.5 281.36 L613.75 282.31 L620 283.25" stroke="#b64f4f" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="614" y="305" font-size="15" fill="#b64f4f" text-anchor="end">about 0.85 P0 at the far end</text><text x="400" y="406" font-size="17" fill="#273b45" text-anchor="end">Px = P0 e</text><text x="402" y="398.35" font-size="12" fill="#273b45" text-anchor="start">−(μα + kx)</text></g></svg>