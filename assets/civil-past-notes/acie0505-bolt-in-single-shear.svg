<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">A bolt in single shear, with pitch and edge distances</title><desc id="desc">A lap joint loads each bolt across one shear plane and presses its shank against the sides of the holes in bearing; the pitch and the end and edge distances keep the plate from tearing out between the holes.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><text x="240" y="60" font-size="17" fill="#273b45" text-anchor="middle">Section through a lap joint</text><rect x="70" y="150" width="230" height="24" fill="#e6f1f8" stroke="#273b45" stroke-width="2"/><rect x="180" y="174" width="230" height="24" fill="#deeee6" stroke="#273b45" stroke-width="2"/><rect x="226" y="126" width="22" height="96" fill="#466d89" stroke="#273b45" stroke-width="1.5"/><rect x="212" y="116" width="50" height="12" fill="#466d89" stroke="#273b45" stroke-width="1.5"/><rect x="212" y="220" width="50" height="12" fill="#466d89" stroke="#273b45" stroke-width="1.5"/><line x1="68" y1="162" x2="28.8" y2="162" stroke="#b64f4f" stroke-width="3"/><polygon points="20,162 31,157.5 31,166.5" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="36" y="150" font-size="17" fill="#b64f4f" text-anchor="middle">P</text><line x1="412" y1="186" x2="451.2" y2="186" stroke="#b64f4f" stroke-width="3"/><polygon points="460,186 449,190.5 449,181.5" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="444" y="174" font-size="17" fill="#b64f4f" text-anchor="middle">P</text><line x1="196" y1="174" x2="280" y2="174" stroke="#b64f4f" stroke-width="2" stroke-dasharray="5 4"/><line x1="262" y1="176" x2="292" y2="262" stroke="#b64f4f" stroke-width="1"/><text x="296" y="276" font-size="15" fill="#b64f4f" text-anchor="start">shear plane</text><text x="237" y="254" font-size="15" fill="#647780" text-anchor="middle">bolt</text><text x="120" y="230" font-size="14" fill="#647780" text-anchor="middle">bearing on the</text><text x="120" y="248" font-size="14" fill="#647780" text-anchor="middle">hole sides</text><text x="560" y="60" font-size="17" fill="#273b45" text-anchor="middle">Plan of the plate</text><line x1="500" y1="86" x2="571.2" y2="86" stroke="#b64f4f" stroke-width="2.5"/><polygon points="580,86 569,90.5 569,81.5" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="590" y="92" font-size="16" fill="#b64f4f" text-anchor="start">P</text><rect x="480" y="100" width="210" height="190" fill="#d6dfe3" stroke="#273b45" stroke-width="2"/><circle cx="530" cy="150" r="10" fill="#ffffff" stroke="#273b45" stroke-width="2"/><circle cx="600" cy="150" r="10" fill="#ffffff" stroke="#273b45" stroke-width="2"/><circle cx="530" cy="240" r="10" fill="#ffffff" stroke="#273b45" stroke-width="2"/><circle cx="600" cy="240" r="10" fill="#ffffff" stroke="#273b45" stroke-width="2"/><line x1="530" y1="318" x2="600" y2="318" stroke="#647780" stroke-width="1.5"/><line x1="530" y1="311" x2="530" y2="325" stroke="#647780" stroke-width="1.5"/><line x1="600" y1="311" x2="600" y2="325" stroke="#647780" stroke-width="1.5"/><text x="565" y="344" font-size="16" fill="#647780" text-anchor="middle">p</text><line x1="600" y1="318" x2="690" y2="318" stroke="#647780" stroke-width="1.5"/><line x1="600" y1="311" x2="600" y2="325" stroke="#647780" stroke-width="1.5"/><line x1="690" y1="311" x2="690" y2="325" stroke="#647780" stroke-width="1.5"/><text x="645" y="344" font-size="16" fill="#647780" text-anchor="middle">e</text><line x1="650" y1="150" x2="650" y2="240" stroke="#647780" stroke-width="1.5"/><line x1="657" y1="150" x2="643" y2="150" stroke="#647780" stroke-width="1.5"/><line x1="657" y1="240" x2="643" y2="240" stroke="#647780" stroke-width="1.5"/><text x="660" y="201" font-size="16" fill="#647780" text-anchor="start">g</text><line x1="505" y1="100" x2="505" y2="150" stroke="#647780" stroke-width="1.5"/><line x1="512" y1="100" x2="498" y2="100" stroke="#647780" stroke-width="1.5"/><line x1="512" y1="150" x2="498" y2="150" stroke="#647780" stroke-width="1.5"/><text x="515" y="131" font-size="14" fill="#647780" text-anchor="start">edge</text><text x="360" y="395" font-size="15" fill="#273b45" text-anchor="middle">p ≥ 2.5d; edge and end distances ≥ 1.5 to 1.7 times the hole diameter</text></g></svg>