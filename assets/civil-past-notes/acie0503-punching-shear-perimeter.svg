<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Critical perimeter for punching shear around a column</title><desc id="desc">Punching shear is checked on a perimeter d/2 from the faces of the column. For a square column of side a this perimeter is b0 = 4(a + d), the resisting area is b0 d, and the nominal stress Vu/(b0 d) must not exceed ks 0.25 root fck.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><rect x="50" y="90" width="230" height="230" fill="#d6dfe3" stroke="#273b45" stroke-width="2"/><rect x="135" y="175" width="60" height="60" fill="#466d89" stroke="#273b45" stroke-width="2"/><rect x="105" y="145" width="120" height="120" fill="none" stroke="#b64f4f" stroke-width="2.5" stroke-dasharray="7 5"/><line x1="135" y1="250" x2="195" y2="250" stroke="#647780" stroke-width="1.5"/><line x1="135" y1="245" x2="135" y2="255" stroke="#647780" stroke-width="1.5"/><line x1="195" y1="245" x2="195" y2="255" stroke="#647780" stroke-width="1.5"/><text x="165" y="246" font-size="15" fill="#273b45" text-anchor="middle"><tspan>a</tspan></text><line x1="195" y1="205" x2="225" y2="205" stroke="#647780" stroke-width="1.5"/><line x1="195" y1="200" x2="195" y2="210" stroke="#647780" stroke-width="1.5"/><line x1="225" y1="200" x2="225" y2="210" stroke="#647780" stroke-width="1.5"/><text x="210" y="200" font-size="13" fill="#647780" text-anchor="middle"><tspan>d/2</tspan></text><text x="165" y="136" font-size="14" fill="#b64f4f" text-anchor="middle"><tspan>side a + d</tspan></text><text x="165" y="350" font-size="15" fill="#647780" text-anchor="middle">plan</text><rect x="360" y="240" width="300" height="70" fill="#d6dfe3" stroke="#273b45" stroke-width="2"/><rect x="480" y="110" width="60" height="130" fill="#466d89" stroke="#273b45" stroke-width="2"/><line x1="450" y1="240" x2="450" y2="310" stroke="#b64f4f" stroke-