<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Section classes by moment–rotation behaviour</title><desc id="desc">Plastic sections reach the plastic moment and keep rotating, compact ones reach it with little rotation to spare, semi-compact ones reach only first yield, and slender ones buckle locally before they yield.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="90" y1="330" x2="626" y2="330" stroke="#647780" stroke-width="2"/><polygon points="634,330 624,334 624,326" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><line x1="90" y1="330" x2="90" y2="64" stroke="#647780" stroke-width="2"/><polygon points="90,56 94,66 86,66" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><text x="355" y="370" font-size="17" fill="#273b45" text-anchor="middle">Rotation θ</text><text x="96" y="46" font-size="17" fill="#273b45" text-anchor="start">Moment</text><line x1="90" y1="112.61" x2="620" y2="112.61" stroke="#647780" stroke-width="1.2" stroke-dasharray="6 5"/><text x="82" y="117.61" font-size="15" fill="#273b45" text-anchor="end">Mp</text><line x1="90" y1="138.7" x2="620" y2="138.7" stroke="#647780" stroke-width="1.2" stroke-dasharray="3 4"/><text x="82" y="143.7" font-size="15" fill="#273b45" text-anchor="end">My</text><path d="M90 330 L137.7 156.09 L174.8 123.48 L217.2 112.61 L588.2 112.61" stroke="#2b7b61" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M90 330 L137.7 156.09 L174.8 123.48 L217.2 112.61 L270.2 112.61 L333.8 151.74 L386.8 177.83" stroke="#287aab" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M90 330 L137.7 156.09 L158.9 138.7 L206.6 160.43 L259.6 195.22" stroke="#b98232" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M90 330 L132.4 182.17 L148.3 177.83 L185.4 210.43 L238.4 238.7" stroke="#b64f4f" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="588.2" y="102.61" font-size="15" fill="#2b7b61" text-anchor="end">plastic</text><text x="392.8" y="182.83" font-size="15" fill="#287aab" text-anchor="start">compact</text><text x="265.6" y="200.22" font-size="15" fill="#b98232" text-anchor="start">semi-compact</text><text x="244.4" y="243.7" font-size="15" fill="#b64f4f" text-anchor="start">slender</text><text x="360" y="404" font-size="15" fill="#647780" text-anchor="middle">Classes follow the width-to-thickness ratios of the plates</text></g></svg>