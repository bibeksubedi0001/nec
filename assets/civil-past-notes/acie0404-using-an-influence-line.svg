<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Using an influence line for moment at a section</title><desc id="desc">Each point load contributes its value times the ordinate under it, and a uniform load contributes w times the area of the influence line under the loaded length. For the moment at C: MC = W1η1 + W2η2 + w times the shaded area.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="110" y1="120" x2="590" y2="120" stroke="#273b45" stroke-width="6"/><polygon points="110,125 95,149 125,149" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><line x1="88" y1="152" x2="132" y2="152" stroke="#647780" stroke-width="2"/><polygon points="590,125 575,146 605,146" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><circle cx="582" cy="152" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><circle cx="598" cy="152" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><line x1="568" y1="159" x2="612" y2="159" stroke="#647780" stroke-width="2"/><line x1="196.4" y1="68" x2="196.4" y2="107.2" stroke="#b64f4f" stroke-width="3.5"/><polygon points="196.4,116 191.9,105 200.9,105" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="196.4" y="58" font-size="17" fill="#b64f4f" text-anchor="middle"><tspan>W</tspan><tspan dy="5" font-size="12">1</tspan></text><line x1="350" y1="68" x2="350" y2="107.2" stroke="#b64f4f" stroke-width="3.5"/><polygon points="350,116 345.5,105 354.5,105" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="350" y="58" font-size="17" fill="#b64f4f" text-anchor="middle"><tspan>W</tspan><tspan dy="5" font-size="12">2</tspan></text><line x1="426.8" y1="88" x2="542" y2="88" stroke="#b64f4f" stroke-width="2"/><line x1="426.8" y1="88" x2="426.8" y2="107.8" stroke="#b64f4f" stroke-width="2"/><polygon points="426.8,115 422.8,106 430.8,106" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><line x1="449.84" y1="88" x2="449.84" y2="107.8" stroke="#b64f4f" stroke-width="2"/><polygon points="449.84,115 445.84,106 453.84,106" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><line x1="472.88" y1="88" x2="472.88" y2="107.8" stroke="#b64f4f" stroke-width="2"/><polygon points="472.88,115 468.88,106 476.88,106" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><line x1="495.92" y1="88" x2="495.92" y2="107.8" stroke="#b64f4f" stroke-width="2"/><polygon points="495.92,115 491.92,106 499.92,106" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><line x1="518.96" y1="88" x2="518.96" y2="107.8" stroke="#b64f4f" stroke-width="2"/><polygon points="518.96,115 514.96,106 522.96,106" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><line x1="542" y1="88" x2="542" y2="107.8" stroke="#b64f4f" stroke-width="2"/><polygon points="542,115 538,106 546,106" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="484.4" y="78" font-size="17" fill="#b64f4f" text-anchor="middle">w</text><line x1="278" y1="104" x2="278" y2="150" stroke="#647780" stroke-width="1.5" stroke-dasharray="4 4"/><text x="286" y="150" font-size="16" fill="#273b45" text-anchor="start"><tspan>C</tspan></text><polygon points="110,330 278,220 590,330" fill="#e6f1f8" stroke="#287aab" stroke-width="2" stroke-linejoin="round"/><polygon points="426.8,330 426.8,272.46 430.64,273.82 434.48,275.17 438.32,276.52 442.16,277.88 446,279.23 449.84,280.58 453.68,281.94 457.52,283.29 461.36,284.65 465.2,286 469.04,287.35 472.88,288.71 476.72,290.06 480.56,291.42 484.4,292.77 488.24,294.12 492.08,295.48 495.92,296.83 499.76,298.18 503.6,299.54 507.44,300.89 511.28,302.25 515.12,303.6 518.96,304.95 522.8,306.31 526.64,307.66 530.48,309.02 534.