<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Base pressure inside and outside the middle third</title><desc id="desc">With the resultant inside the middle third the whole base stays in compression; outside it the loaded length shrinks to three times the distance c from the resultant to the nearer edge, and the peak pressure rises to 2P/3c.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><text x="180" y="60" font-size="17" fill="#2b7b61" text-anchor="middle">e ≤ b/6: full contact</text><rect x="60" y="170" width="240" height="40" fill="#e4e8e9" stroke="#273b45" stroke-width="2"/><line x1="140" y1="162" x2="140" y2="218" stroke="#647780" stroke-width="1.2" stroke-dasharray="4 4"/><line x1="220" y1="162" x2="220" y2="218" stroke="#647780" stroke-width="1.2" stroke-dasharray="4 4"/><text x="180" y="196" font-size="14" fill="#647780" text-anchor="middle">middle third</text><line x1="210" y1="108" x2="210" y2="161.2" stroke="#b64f4f" stroke-width="3.5"/><polygon points="210,170 205.5,159 214.5,159" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="210" y="98" font-size="17" fill="#b64f4f" text-anchor="middle">P</text><polygon points="60,210 300,210 300,254 60,216" fill="#f2dfdf" stroke="#b64f4f" stroke-width="2" stroke-linejoin="round"/><text x="180" y="300" font-size="16" fill="#273b45" text-anchor="middle">σ = (P / b)(1 ± 6e / b)</text><text x="540" y="60" font-size="17" fill="#b64f4f" text-anchor="middle">e &gt; b/6: partial contact</text><rect x="420" y="170" width="240" height="40" fill="#e4e8e9" stroke="#273b45" stroke-width="2"/><line x1="500" y1="162" x2="500" y2="218" stroke="#647780" stroke-width="1.2" stroke-dasharray="4 4"/><line x1="580" y1="162" x2="580" y2="218" stroke="#647780" stroke-width="1.2" stroke-dasharray="4 4"/><text x="540" y="196" font-size="14" fill="#647780" text-anchor="middle">middle third</text><line x1="615" y1="108" x2="615" y2="161.2" stroke="#b64f4f" stroke-width="3.5"/><polygon points="615,170 610.5,159 619.5,159" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="615" y="98" font-size="17" fill="#b64f4f" text-anchor="middle">P</text><polygon points="525,210 660,210 660,299" fill="#f2dfdf" stroke="#b64f4f" stroke-width="2" stroke-linejoin="round"/><line x1="420" y1="214" x2="525" y2="214" stroke="#647780" stroke-width="1.2" stroke-dasharray="5 4"/><text x="472" y="236" font-size="14" fill="#647780" text-anchor="middle">no contact</text><line x1="525" y1="316" x2="660" y2="316" stroke="#647780" stroke-width="1.5"/><line x1="525" y1="309" x2="525" y2="323" stroke="#647780" stroke-width="1.5"/><line x1="660" y1="309" x2="660" y2="323" stroke="#647780" stroke-width="1.5"/><text x="592.5" y="342" font-size="15" fill="#647780" text-anchor="middle">3c</text><text x="592" y="376" font-size="16" fill="#273b45" text-anchor="middle">pmax = 2P / 3c</text></g></svg>