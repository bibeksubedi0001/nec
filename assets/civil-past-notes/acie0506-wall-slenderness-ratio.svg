<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Slenderness ratio of a load-bearing wall</title><desc id="desc">A wall between floor slabs has an effective height of 0.75H when RCC slabs bear on it above and below; between cross walls it has an effective length. The slenderness ratio is the smaller of heff/teff and leff/teff, and a cavity wall with both leaves loaded counts teff = 2/3(t1 + t2).</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><rect x="90" y="90" width="300" height="18" fill="#466d89" stroke="#273b45" stroke-width="2"/><rect x="90" y="300" width="300" height="18" fill="#466d89" stroke="#273b45" stroke-width="2"/><rect x="90" y="108" width="300" height="192" fill="#f5ead8" stroke="#273b45" stroke-width="2"/><line x1="90" y1="132" x2="390" y2="132" stroke="#b98232" stroke-width="1"/><line x1="150" y1="108" x2="150" y2="132" stroke="#b98232" stroke-width="1"/><line x1="210" y1="108" x2="210" y2="132" stroke="#b98232" stroke-width="1"/><line x1="270" y1="108" x2="270" y2="132" stroke="#b98232" stroke-width="1"/><line x1="330" y1="108" x2="330" y2="132" stroke="#b98232" stroke-width="1"/><line x1="90" y1="156" x2="390" y2="156" stroke="#b98232" stroke-width="1"/><line x1="120" y1="132" x2="120" y2="156" stroke="#b98232" stroke-width="1"/><line x1="180" y1="132" x2="180" y2="156" stroke="#b98232" stroke-width="1"/><line x1="240" y1="132" x2="240" y2="156" stroke="#b98232" stroke-width="1"/><line x1="300" y1="132" x2="300" y2="156" stroke="#b98232" stroke-width="1"/><line x1="360" y1="132" x2="360" y2="156" stroke="#b98232" stroke-width="1"/><line x1="90" y1="180" x2="390" y2="180" stroke="#b98232" stroke-width="1"/><line x1="150" y1="156" x2="150" y2="180" stroke="#b98232" stroke-width="1"/><line x1="210" y1="156" x2="210" y2="180" stroke="#b98232" stroke-width="1"/><line x1="270" y1="156" 