<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Placing a short uniform load for the greatest moment at a section</title><desc id="desc">A uniform load w of length l shorter than the span gives the greatest moment at section C when it straddles C so that the part on the left, l left, is to l as a is to L. Both ends of the load then sit at equal ordinates of the influence line, and the moment is w times the shaded area.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="110" y1="120" x2="590" y2="120" stroke="#273b45" stroke-width="6"/><polygon points="110,125 95,149 125,149" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><line x1="88" y1="152" x2="132" y2="152" stroke="#647780" stroke-width="2"/><polygon points="590,125 575,146 605,146" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><circle cx="582" cy="152" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><circle cx="598" cy="152" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><line x1="568" y1="159" x2="612" y2="159" stroke="#647780" stroke-width="2"/><line x1="244.4" y1="90" x2="388.4" y2="90" stroke="#b64f4f" stroke-width="2"/><line x1="244.4" y1="90" x2="244.4" y2="107.8" stroke="#b64f4f" stroke-width="2"/><polygon points="244.4,115 240.4,106 248.4,106" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><line x1="273.2" y1="90" x2="273.2" y2="107.8" stroke="#b64f4f" stroke-width="2"/><polygon points="273.2,115 269.2,106 277.2,106" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><line x1="302" y1="90" x2="302" y2="107.8" stroke="#b64f4f" stroke-width="2"/><polygon points="302,115 298,106 306,106" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><line x1="330.8" y1="90" x2="330.8" y2="107.8" stroke="#b64f4f" stroke-width="2"/><polygon points="330.8,115 326.8,106 334.8,106" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><line x1="359.6" y1="90" x2="359.6" y2="107.8" stroke="#b64f4f" stroke-width="2"/><polygon points="359.6,115 355.6,106 363.6,106" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><line x1="388.4" y1="90" x2="388.4" y2="107.8" stroke="#b64f4f" stroke-width="2"/><polygon points="388.4,115 384.4,106 392.4,106" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="316.4" y="76" font-size="16" fill="#b64f4f" text-anchor="middle"><tspan>w over length l</tspan></text><line x1="302" y1="100" x2="302" y2="150" stroke="#647780" stroke-width="1.5" stroke-dasharray="4 4"/><text x="310" y="146" font-size="16" fill="#273b45" text-anchor="start"><tspan>C</tspan></text><line x1="244.4" y1="166" x2="302" y2="166" stroke="#647780" stroke-width="1.5"/><line x1="244.4" y1="159" x2="244.4" y2="173" stroke="#647780" stroke-width="1.5"/><line x1="302" y1="159" x2="302" y2="173" stroke="#647780" stroke-width="1.5"/><text x="236.4" y="172" font-size="15" fill="#647780" text-anchor="end"><tspan>l</tspan><tspan dy="4" font-size="11">left</tspan></text><line x1="110" y1="318" x2="302" y2="318" stroke="#647780" stroke-width="1.5"/><line x1="110" y1="311" x2="110" y2="325" stroke="#647780" stroke-width="1.5"/><line x1="302" y1="311" x2="302" y2="325" stroke="#647780" stroke-width="1.5"/><line x1="302" y1="318" x2="590" y2="318" stroke="#647780" stroke-width="1.5"/><line x1="302" y1="311" x2="302" y2="325" stroke="#647780" stroke-width="1.5"/><line x1="590" y1="311" x2="590" y2="325" stroke="#647780" stroke-width="1.5"/><text x="206" y="340" font-size="15" fill="#647780" text-anchor="middle"><tspan>a</tspan></text><text x="446" y="340" font-size="15" fill="#647780" text-anchor="middle"><tspan>L − a</tspan></text><polygon points="110,300 302,190 590,300" fill="#e6f1f8" stroke="#287aab" stroke-width="2" stroke-linejoin="round"/><polygon points="244.4,300 244.4,223 248,220.94 251.6,218.88 255.2,216.81 258.8,214.75 262.4,212.69 266,210.63 269.6,208.56 273.2,206.5 276.8,204.44 280.4,202.38 284,200.31 287.6,198.25 291.2,196.19 294.8,194.12 298.4,192.06 302,190 305.6,191.38 309.2,192.75 312.8,194.13 316.4,195.5 320,196.88 323.6,198.25 327.2,199.63 330.8,201 334.4,202.38 338,203.75 341.6,205.13 345.2,206.5 348.8,207.88 352.4,209.25 356,210.63 359.6,212 363.2,213.38 366.8,214.75 370.4,216.13 374,217.5 377.6,218.88 381.2,220.25 384.8,221.63 388.4,223 388.4,300" fill="#f5ead8" stroke="#b98232" stroke-width="2" stroke-linejoin="round"/><text x="244.4" y="213" font-size="16" fill="#b98232" text-anchor="middle"><tspan>η</tspan></text><text x="388.4" y="213" font-size="16" fill="#b98232" text-anchor="middle"><tspan>η</tspan></text><text x="98" y="305" font-size="14" fill="#647780" text-anchor="end"><tspan>ILD M</tspan><tspan dy="4" font-size="10">C</tspan></text><text x="314" y="184" font-size="15" fill="#287aab" text-anchor="start"><tspan>a(L − a)/L</tspan></text><text x="360" y="374" font-size="16" fill="#273b45" text-anchor="middle"><tspan>l</tspan><tspan dy="4" font-size="12">left</tspan><tspan dy="-4">/l = a/L puts equal ordinates η under both ends</tspan></text><text x="360" y="404" font-size="18" fill="#b98232" text-anchor="middle"><tspan>M</tspan><tspan dy="5" font-size="13">C,max</tspan><tspan dy="-5"> = w × shaded area</tspan></text></g></svg>