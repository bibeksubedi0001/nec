<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Hogging moment over the support of an overhang</title><desc id="desc">A uniform load w on an overhang of length a acts like a cantilever from support B, so the moment over B is -wa squared over 2. Between the supports the moment falls linearly to zero at A.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="80" y1="112" x2="620" y2="112" stroke="#273b45" stroke-width="7"/><polygon points="80,117 65,141 95,141" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><line x1="58" y1="144" x2="102" y2="144" stroke="#647780" stroke-width="2"/><polygon points="452.41,117 437.41,138 467.41,138" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><circle cx="444.41" cy="144" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><circle cx="460.41" cy="144" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><line x1="430.41" y1="151" x2="474.41" y2="151" stroke="#647780" stroke-width="2"/><line x1="452.41" y1="78" x2="620" y2="78" stroke="#b64f4f" stroke-width="2"/><line x1="452.41" y1="78" x2="452.41" y2="99.8" stroke="#b64f4f" stroke-width="2"/><polygon points="452.41,107 448.41,98 456.41,98" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><line x1="485.93" y1="78" x2="485.93" y2="99.8" stroke="#b64f4f" stroke-width="2"/><polygon points="485.93,107 481.93,98 489.93,98" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><line x1="519.45" y1="78" x2="519.45" y2="99.8" stroke="#b64f4f" stroke-width="2"/><polygon points="519.45,107 515.45,98 523.45,98" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><line x1="552.97" y1="78" x2="552.97" y2="99.8" stroke="#b64f4f" stroke-width="2"/><polygon points="552.97,107 548.97,98 556.97