.53 L204 144.06 L210 144.61 L216 145.2 L222 145.81 L228 146.45 L234 147.12 L240 147.81 L246 148.53 L252 149.26 L258 150.02 L264 150.8 L270 151.6 L276 152.41 L282 153.24 L288 154.09 L294 154.95 L300 155.82 L306 156.7 L312 157.6 L318 158.5 L324 159.42 L330 160.34 L336 161.26 L342 162.19 L348 163.13 L354 164.06 L360 165 L366 165.94 L372 166.87 L378 167.81 L384 168.74 L390 169.66 L396 170.58 L402 171.5 L408 172.4 L414 173.3 L420 174.18 L426 175.05 L432 175.91 L438 176.76 L444 177.59 L450 178.4 L456 179.2 L462 179.98 L468 180.74 L474 181.47 L480 182.19 L486 182.88 L492 183.55 L498 184.19 L504 184.8 L510 185.39 L516 185.94 L522 186.47 L528 186.96 L534 187.42 L540 187.85 L546 188.24 L552 188.6 L558 188.92 L564 189.2 L570 189.44 L576 189.64 L582 189.79 L588 189.91 L594 189.98 L600 190" stroke="#273b45" stroke-width="7" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="640" y1="140" x2="640" y2="190" stroke="#647780" stroke-width="1.5"/><line x1="647" y1="140" x2="633" y2="140" stroke="#647780" stroke-width="1.5"/><line x1="647" y1="190" x2="633" y2="190" stroke="#647780" stroke-width="1.5"/><text x="650" y="171" font-size="17" fill="#647780" text-anchor="start">Δ</text><text x="360" y="90" font-size="16" fill="#273b45" text-anchor="middle">No load: the right support has settled by Δ</text><polygon points="120,320 120,365 360,320" fill="#f2dfdf" stroke="none" stroke-width="2" stroke-linejoin="round"/><polygon points="360,320 600,275 600,320" fill="#e6f1f8" stroke="none" stroke-width="2" stroke-linejoin="round"/><line x1="120" y1="365" x2="600" y2="275" stroke="#287aab" stroke-width="3"/><line x1="120" y1="320" x2="600" y2="320" stroke="#273b45" stroke-width="1.5"/><text x="128" y="389" font-size="15" fill="#b64f4f" text-anchor="start">hogging 6EIΔ/L²</text><text x="592" y="265" font-size="15" fill="#287aab" text-anchor="end">sagging 6EIΔ/L²</text></g></svg>