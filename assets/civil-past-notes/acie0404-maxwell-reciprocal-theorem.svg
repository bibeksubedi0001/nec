 305.12 L470 303.94 L476 302.68 L482 301.35 L488 299.96 L494 298.51 L500 297.01 L506 295.45 L512 293.84 L518 292.18 L524 290.48 L530 288.75 L536 286.97 L542 285.17 L548 283.33 L554 281.47 L560 279.59 L566 277.7 L572 275.79 L578 273.86 L584 271.93 L590 270" stroke="#287aab" stroke-width="4.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="110,275 95,299 125,299" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><line x1="88" y1="302" x2="132" y2="302" stroke="#647780" stroke-width="2"/><polygon points="590,275 575,296 605,296" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><circle cx="582" cy="302" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><circle cx="598" cy="302" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><line x1="568" y1="309" x2="612" y2="309" stroke="#647780" stroke-width="2"/><line x1="446" y1="259.22" x2="446" y2="296.42" stroke="#b64f4f" stroke-width="3.5"/><polygon points="446,305.22 441.5,294.22 450.5,294.22" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="446" y="249.22" font-size="18" fill="#b64f4f" text-anchor="middle">P</text><line x1="254" y1="270" x2="254" y2="296.98" stroke="#647780" stroke-width="1.5"/><line x1="259" y1="270" x2="249" y2="270" stroke="#647780" stroke-width="1.5"/><line x1="259" y1="296.98" x2="249" y2="296.98" stroke="#647780" stroke-width="1.5"/><text x="244" y="291.99" font-size="18" fill="#287aab" text-anchor="end"><tspan>δ</tspan><tspan dy="5" font-size="13">AB</tspan></text><circle cx="254" cy="301.98" r="4" fill="#287aab" stroke="#287aab" stroke-width="2"/><text x="436" y="258" font-size="16" fill="#647780" text-anchor="end"><tspan>B</tspan></text><text x="254" y="256" font-size="16" fill="#647780" text-anchor="middle"><tspan>A</tspan></text><text x="360" y="380" font-size="22" fill="#273b45" text-anchor="middle"><tspan>δ</tspan><tspan dy="6" font-size="16">AB</tspan><tspan dy="-6"> = δ</tspan><tspan dy="6" font-size="16">BA</tspan></text><text x="360" y="408" font-size="15" fill="#647780" text-anchor="middle">deflection at A due to P at B = deflection at B due to P at A</text></g></svg>