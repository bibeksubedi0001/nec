<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Maxwell's reciprocal theorem on a simple beam</title><desc id="desc">Load P at A deflects point B by δBA. Moving the same load to B deflects A by δAB, and the two are equal. The theorem holds for any linear elastic structure and is why flexibility matrices are symmetric.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="110" y1="110" x2="590" y2="110" stroke="#647780" stroke-width="2" stroke-dasharray="6 5"/><path d="M110 110 L116 111.93 L122 113.86 L128 115.79 L134 117.7 L140 119.59 L146 121.47 L152 123.33 L158 125.17 L164 126.97 L170 128.75 L176 130.48 L182 132.18 L188 133.84 L194 135.45 L200 137.01 L206 138.51 L212 139.96 L218 141.35 L224 142.68 L230 143.94 L236 145.12 L242 146.23 L248 147.27 L254 148.22 L260 149.09 L266 149.87 L272 150.57 L278 151.19 L284 151.74 L290 152.2 L296 152.59 L302 152.9 L308 153.14 L314 153.31 L320 153.41 L326 153.44 L332 153.4 L338 153.3 L344 153.13 L350 152.9 L356 152.61 L362 152.26 L368 151.85 L374 151.39 L380 150.87 L386 150.3 L392 149.67 L398 149 L404 148.28 L410 147.51 L416 146.69 L422 145.83 L428 144.93 L434 143.98 L440 143 L446 141.98 L452 140.92 L458 139.83 L464 138.7 L470 137.54 L476 136.35 L482 135.14 L488 133.89 L494 132.62 L500 131.32 L506 130.01 L512 128.67 L518 127.31 L524 125.93 L530 124.53 L536 123.12 L542 121.7 L548 120.26 L554 118.82 L560 117.36 L566 115.9 L572 114.43 L578 112.96 L584 111.48 L590 110" stroke="#287aab" stroke-width="4.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="110,115 95,139 125,139" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><line x1="88" y1="142" x2="132" y2="142" stroke="#647780" stroke-width="2"/><polygon points="590,115 575,136 605,136" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/