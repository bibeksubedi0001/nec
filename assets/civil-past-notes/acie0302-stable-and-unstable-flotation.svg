<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Metacentre and centre of gravity of a heeled body</title><desc id="desc">When the body heels, the centre of buoyancy moves to B′ and the buoyant force meets the centre line at the metacentre M. With M above G the couple rights the body; with M below G it overturns it.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><text x="190" y="56" font-size="18" fill="#2b7b61" text-anchor="middle">Stable: M above G</text><polygon points="111.42,123.51 299.36,191.92 268.58,276.49 80.64,208.08" fill="#d6dfe3" stroke="#273b45" stroke-width="2.5" stroke-linejoin="round"/><rect x="30" y="205" width="320" height="110" fill="#d8edf7" stroke="none" stroke-width="2" opacity="0.75"/><line x1="30" y1="205" x2="350" y2="205" stroke="#287aab" stroke-width="2"/><line x1="222.49" y1="110.73" x2="169.48" y2="256.38" stroke="#647780" stroke-width="1.5" stroke-dasharray="6 5"/><line x1="213.94" y1="240" x2="213.94" y2="134.22" stroke="#287aab" stroke-width="1.5" stroke-dasharray="4 4"/><line x1="213.94" y1="300" x2="213.94" y2="252.8" stroke="#287aab" stroke-width="3"/><polygon points="213.94,244 218.44,255 209.44,255" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><line x1="193.42" y1="190.6" x2="193.42" y2="259.8" stroke="#b64f4f" stroke-width="3"/><polygon points="193.42,268.6 188.92,257.6 197.92,257.6" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><circle cx="213.94" cy="134.22" r="5" fill="#2b7b61" stroke="#2b7b61" stroke-width="2"/><circle cx="193.42" cy="190.6" r="5" fill="#273b45" stroke="#273b45" stroke-width="2"/><circle cx="213.94" cy="240" r="5" fill="#287aab" stroke="#287aab" stroke-width="2"/><text x="223.94" y="128.22" font-size="17" fill="#2b7b61" text-anchor="start">M</text><text x="183.42" y="192.6" font-size="17" fill="#273b45" text-anchor="end">G</text><text x="223.94" y="256" font-size="17" fill="#287aab" text-anchor="start">B′</text><text x="223.94" y="318" font-size="16" fill="#287aab" text-anchor="start">Fb</text><text x="183.42" y="264.6" font-size="16" fill="#b64f4f" text-anchor="end">W</text><text x="190" y="350" font-size="16" fill="#2b7b61" text-anchor="middle">righting couple</text><text x="530" y="56" font-size="18" fill="#b64f4f" text-anchor="middle">Unstable: M below G</text><polygon points="451.42,123.51 639.36,191.92 608.58,276.49 420.64,208.08" fill="#d6dfe3" stroke="#273b45" stroke-width="2.5" stroke-linejoin="round"/><rect x="370" y="205" width="320" height="110" fill="#d8edf7" stroke="none" stroke-width="2" opacity="0.75"/><line x1="370" y1="205" x2="690" y2="205" stroke="#287aab" stroke-width="2"/><line x1="562.49" y1="110.73" x2="509.48" y2="256.38" stroke="#647780" stroke-width="1.5" stroke-dasharray="6 5"/><line x1="536.84" y1="240" x2="536.84" y2="181.21" stroke="#287aab" stroke-width="1.5" stroke-dasharray="4 4"/><line x1="536.84" y1="300" x2="536.84" y2="252.8" stroke="#287aab" stroke-width="3"/><polygon points="536.84,244 541.34,255 532.34,255" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><line x1="553.94" y1="134.22" x2="553.94" y2="181.42" stroke="#b64f4f" stroke-width="3"/><polygon points="553.94,190.22 549.44,179.22 558.44,179.22" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><circle cx="536.84" cy="181.21" r="5" fill="#2b7b61" stroke="#2b7b61" stroke-width="2"/><circle cx="553.94" cy="134.22" r="5" fill="#273b45" stroke="#273b45" stroke-width="2"/><circle cx="536.84" cy="240" r="5" fill="#287aab" stroke="#287aab" stroke-width="2"/><text x="526.84" y="185.21" font-size="17" fill="#2b7b61" text-anchor="end">M</text><text x="543.94" y="136.22" font-size="17" fill="#273b45" text-anchor="end">G</text><text x="546.84" y="256" font-size="17" fill="#287aab" text-anchor="start">B′</text><text x="546.84" y="318" font-size="16" fill="#287aab" text-anchor="start">Fb</text><text x="563.94" y="186.22" font-size="16" fill="#b64f4f" text-anchor="start">W</text><text x="530" y="350" font-size="16" fill="#b64f4f" text-anchor="middle">overturning couple</text><text x="360" y="396" font-size="15" fill="#273b45" text-anchor="middle">GM = BM − BG, where BM = I / V and I is that of the waterplane</text></g></svg>