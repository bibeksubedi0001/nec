<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Self-weight of a beam per metre run</title><desc id="desc">One metre of a beam of width b and overall depth D holds b times D cubic metres of material, so its self-weight is w = γbD per metre. With reinforced concrete at 25 kN/m3, a 300 by 450 mm beam weighs 0.3 x 0.45 x 25 = 3.375 kN/m.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><polygon points="110,170 320,100 410,100 200,170" fill="#d6dfe3" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><polygon points="200,170 410,100 410,240 200,310" fill="#b8c8ce" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><polygon points="110,170 200,170 200,310 110,310" fill="#466d89" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><line x1="110" y1="334" x2="200" y2="334" stroke="#647780" stroke-width="1.5"/><line x1="110" y1="327" x2="110" y2="341" stroke="#647780" stroke-width="1.5"/><line x1="200" y1="327" x2="200" y2="341" stroke="#647780" stroke-width="1.5"/><text x="155" y="360" font-size="17" fill="#647780" text-anchor="middle">b</text><line x1="86" y1="170" x2="86" y2="310" stroke="#647780" stroke-width="1.5"/><line x1="93" y1="170" x2="79" y2="170" stroke="#647780" stroke-width="1.5"/><line x1="93" y1="310" x2="79" y2="310" stroke="#647780" stroke-width="1.5"/><text x="76" y="246" font-size="17" fill="#647780" text-anchor="end">D</text><line x1="214" y1="330" x2="424" y2="260" stroke="#647780" stroke-width="1.5"/><line x1="211.79" y1="323.36" x2="216.21" y2="336.64" stroke="#647780" stroke-width="1.5"/><line x1="421.79" y1="253.36" x2="426.21" y2="266.64" stroke="#647780" stroke-width="1.5"/><text x="330" y="318" font-size="17" fill="#647780" text-anchor="start"><tspan>1 m</tspan></text><text x="560" y="234" font-size="15" fill="#647780" text-anchor="middle">γ = 25 kN/m³ for RCC</text><text x="560" y="170" font-size="26" fill="#273b45" text-anchor="middle"><tspan>w = γ b D</tspan></text><text x="560" y="204" font-size="15" fill="#647780" text-anchor="middle">per metre run</text><text x="560" y="262" font-size="18" fill="#287aab" text-anchor="middle"><tspan>0.3 × 0.45 × 25</tspan></text><text x="560" y="292" font-size="18" fill="#287aab" text-anchor="middle"><tspan>= 3.375 kN/m</tspan></text><text x="560" y="322" font-size="14" fill="#647780" text-anchor="middle">300 × 450 mm beam</text><text x="360" y="400" font-size="15" fill="#647780" text-anchor="middle">Use the overall depth D, not the effective depth d</text></g></svg>