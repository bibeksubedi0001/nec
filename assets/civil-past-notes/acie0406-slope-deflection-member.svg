<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">End rotations and sway in the slope-deflection equation</title><desc id="desc">Member AB of length L turns through θA and θB at its ends while B moves sideways by Δ relative to A. The end moment is the fixed-end moment plus 2EI/L times (2θA + θB - 3Δ/L), with clockwise moments and rotations positive.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="110" y1="130" x2="550" y2="130" stroke="#647780" stroke-width="2" stroke-dasharray="6 5"/><path d="M110 130 L115.5 131.74 L121 133.42 L126.5 135.06 L132 136.66 L137.5 138.2 L143 139.7 L148.5 141.16 L154 142.58 L159.5 143.95 L165 145.28 L170.5 146.57 L176 147.82 L181.5 149.03 L187 150.2 L192.5 151.34 L198 152.44 L203.5 153.5 L209 154.53 L214.5 155.53 L220 156.49 L225.5 157.42 L231 158.32 L236.5 159.18 L242 160.02 L247.5 160.83 L253 161.61 L258.5 162.37 L264 163.1 L269.5 163.8 L275 164.48 L280.5 165.13 L286 165.76 L291.5 166.37 L297 166.96 L302.5 167.53 L308 168.08 L313.5 168.61 L319 169.12 L324.5 169.62 L330 170.1 L335.5 170.57 L341 171.02 L346.5 171.45 L352 171.88 L357.5 172.29 L363 172.69 L368.5 173.09 L374 173.47 L379.5 173.84 L385 174.21 L390.5 174.57 L396 174.93 L401.5 175.28 L407 175.62 L412.5 175.97 L418 176.31 L423.5 176.65 L429 176.98 L434.5 177.32 L440 177.66 L445.5 178 L451 178.35 L456.5 178.7 L462 179.05 L467.5 179.41 L473 179.77 L478.5 180.14 L484 180.52 L489.5 180.91 L495 181.31 L500.5 181.72 L506 182.14 L511.5 182.57 L517 183.01 L522.5 183.47 L528 183.94 L533.5 184.43 L539 184.94 L544.5 185.46 L550 186" stroke="#287aab" stroke-width="5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="110" y1="130" x2="550" y2="186" stroke="#647780" stroke-width="1.2" stroke-dasharray="3 4"/><line x1="110" y1="130" x2="220" y2="165.2" stroke="#2b7b61" stroke-width="2" stroke-dasharray="6 4"/><path d="M192 130 A82 82 0 0 1 188.1 154.99" stroke="#2b7b61" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="198" y="150" font-size="17" fill="#2b7b61" text-anchor="start"><tspan>θ</tspan><tspan dy="5" font-size="12">A</tspan></text><line x1="450" y1="176" x2="580" y2="189" stroke="#2b7b61" stroke-width="2" stroke-dasharray="6 4"/><line x1="550" y1="186" x2="610" y2="186" stroke="#647780" stroke-width="1.2" stroke-dasharray="4 4"/><text x="588" y="212" font-size="17" fill="#2b7b61" text-anchor="start"><tspan>θ</tspan><tspan dy="5" font-size="12">B</tspan></text><line x1="580" y1="130" x2="580" y2="186" stroke="#647780" stroke-width="1.5"/><line x1="587" y1="130" x2="573" y2="130" stroke="#647780" stroke-width="1.5"/><line x1="587" y1="186" x2="573" y2="186" stroke="#647780" stroke-width="1.5"/><text x="588" y="164" font-size="18" fill="#647780" text-anchor="start">Δ</text><path d="M89.22 142 A24 24 0 1 1 130.78 142" stroke="#b64f4f" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="130.78,142 132.39,130.22 140.18,134.72" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="80" y="100" font-size="17" fill="#b64f4f" text-anchor="end"><tspan>M</tspan><tspan dy="5" font-size="12">AB</tspan></text><path d="M529.22 198 A24 24 0 1 1 570.78 198" stroke="#b64f4f" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="570.78,198 572.39,186.22 580.18,190.72" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="520" y="230" font-size="17" fill="#b64f4f" text-anchor="end"><tspan>M</tspan><tspan dy="5" font-size="12">BA</tspan></text><text x="106" y="174" font-size="16" fill="#273b45" text-anchor="end">A</text><text x="554" y="152" font-size="16" fill="#273b45" text-anchor="start">B</text><line x1="110" y1="236" x2="550" y2="236" stroke="#647780" stroke-width="1.5"/><line x1="110" y1="229" x2="110" y2="243" stroke="#647780" stroke-width="1.5"/><line x1="550" y1="229" x2="550" y2="243" stroke="#647780" stroke-width="1.5"/><text x="330" y="262" font-size="16" fill="#647780" text-anchor="middle">L</text><text x="360" y="318" font-size="19" fill="#273b45" text-anchor="middle"><tspan>M</tspan><tspan dy="5" font-size="14">AB</tspan><tspan dy="-5"> = M</tspan><tspan dy="5" font-size="14">FAB</tspan><tspan dy="-5"> + (2EI/L)(2θ</tspan><tspan dy="5" font-size="14">A</tspan><tspan dy="-5"> + θ</tspan><tspan dy="5" font-size="14">B</tspan><tspan dy="-5"> − 3Δ/L)</tspan></text><text x="360" y="352" font-size="19" fill="#273b45" text-anchor="middle"><tspan>M</tspan><tspan dy="5" font-size="14">BA</tspan><tspan dy="-5"> = M</tspan><tspan dy="5" font-size="14">FBA</tspan><tspan dy="-5"> + (2EI/L)(2θ</tspan><tspan dy="5" font-size="14">B</tspan><tspan dy="-5"> + θ</tspan><tspan dy="5" font-size="14">A</tspan><tspan dy="-5"> − 3Δ/L)</tspan></text><text x="360" y="396" font-size="15" fill="#647780" text-anchor="middle">Clockwise end moments and rotations are positive</text></g></svg>