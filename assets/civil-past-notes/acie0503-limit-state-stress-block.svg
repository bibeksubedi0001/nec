<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Strain, stress block and forces in a singly reinforced section</title><desc id="desc">At the limit state the top fibre reaches a strain of 0.0035. The compression block has a resultant 0.36 fck b xu acting 0.42 xu below the top, the steel yields at 0.87 fy, and the moment of resistance is the compression times the lever arm d - 0.42 xu.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><rect x="60" y="100" width="100" height="230" fill="#d6dfe3" stroke="#273b45" stroke-width="2"/><circle cx="80" cy="300" r="7" fill="#466d89" stroke="#273b45" stroke-width="1.5"/><circle cx="110" cy="300" r="7" fill="#466d89" stroke="#273b45" stroke-width="1.5"/><circle cx="140" cy="300" r="7" fill="#466d89" stroke="#273b45" stroke-width="1.5"/><line x1="52" y1="210" x2="170" y2="210" stroke="#647780" stroke-width="1.2" stroke-dasharray="6 4"/><text x="172" y="215" font-size="13" fill="#647780" text-anchor="start">NA</text><line x1="60" y1="350" x2="160" y2="350" stroke="#647780" stroke-width="1.5"/><line x1="60" y1="343" x2="60" y2="357" stroke="#647780" stroke-width="1.5"/><line x1="160" y1="343" x2="160" y2="357" stroke="#647780" stroke-width="1.5"/><text x="110" y="376" font-size="15" fill="#647780" text-anchor="middle">b</text><line x1="36" y1="100" x2="36" y2="300" stroke="#647780" stroke-width="1.5"/><line x1="43" y1="100" x2="29" y2="100" stroke="#647780" stroke-width="1.5"/><line x1="43" y1="300" x2="29" y2="300" stroke="#647780" stroke-width="1.5"/><text x="28" y="206" font-size="15" fill="#647780" text-anchor="end">d</text><text x="110" y="396" font-size="14" fill="#647780" text-anchor="middle">section</text><polygon points="250,100 294,100 250,210" fill="#e6f1f8" stroke="#287aab" stroke-width="2" stroke-linejoin="round"/><polygon points="250,210 250,300 194,300" fill="#f2dfdf" stroke="#b64f4f" stroke-width="2" stroke-linejoin="round"/><line x1="250" y1="100" x2="250" y2="300" stroke="#273b45" stroke-width="1.5"/><text x="256" y="90" font-size="14" fill="#287aab" text-anchor="middle">0.0035</text><text x="190" y="324" font-size="13" fill="#b64f4f" text-anchor="start"><tspan>ε</tspan><tspan dy="4" font-size="9">s</tspan><tspan dy="-4"> ≥ 0.87f</tspan><tspan dy="4" font-size="9">y</tspan><tspan dy="-4">/E</tspan><tspan dy="4" font-size="9">s</tspan><tspan dy="-4"> + 0.002</tspan></text><text x="250" y="396" font-size="14" fill="#647780" text-anchor="middle">strain</text><polygon points="420,100 490,100 490,147.14 489.92,149.24 489.69,151.33 489.3,153.43 488.76,155.52 488.06,157.62 487.2,159.71 486.19,161.81 485.02,163.9 483.7,166 482.22,168.1 480.59,170.19 478.8,172.29 476.86,174.38 474.76,176.48 472.5,178.57 470.09,180.67 467.52,182.76 464.8,184.86 461.92,186.95 458.89,189.05 455.7,191.14 452.36,193.24 448.86,195.33 445.2,197.43 441.39,199.52 437.42,201.62 433.3,203.71 429.02,205.81 424.59,207.9 420,210" fill="#e6f1f8" stroke="#287aab" stroke-width="2" stroke-linejoin="round"/><line x1="420" y1="100" x2="420" y2="300" stroke="#273b45" stroke-width="1.5"/><text x="455" y="90" font-size="14" fill="#287aab" text-anchor="middle"><tspan>0.446 f</tspan><tspan dy="4" font-size="10">ck</tspan></text><line x1="550" y1="146.2" x2="434.8" y2="146.2" stroke="#287aab" stroke-width="3"/><polygon points="426,146.2 437,141.7 437,150.7" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><text x="556" y="138.2" font-size="15" fill="#287aab" text-anchor="start"><tspan>C = 0.36 f</tspan><tspan dy="4" font-size="11">ck</tspan><tspan dy="-4"> b x</tspan><tspan dy="4" font-size="11">u</tspan></text><line x1="426" y1="300" x2="541.2" y2="300" stroke="#b64f4f" stroke-width="3"/><polygon points="550,300 539,304.5 539,295.5" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="556" y="305" font-size="15" fill="#b64f4f" text-anchor="start"><tspan>T = 0.87 f</tspan><tspan dy="4" font-size="11">y</tspan><tspan dy="-4"> A</tspan><tspan dy="4" font-size="11">st</tspan></text><line x1="400" y1="100" x2="400" y2="146.2" stroke="#647780" stroke-width="1.5"/><line x1="405" y1="100" x2="395" y2="100" stroke="#647780" stroke-width="1.5"/><line x1="405" y1="146.2" x2="395" y2="146.2" stroke="#647780" stroke-width="1.5"/><text x="394" y="136.2" font-size="13" fill="#647780" text-anchor="end"><tspan>0.42x</tspan><tspan dy="4" font-size="9">u</tspan></text><line x1="530" y1="146.2" x2="530" y2="300" stroke="#647780" stroke-width="1.5"/><line x1="535" y1="146.2" x2="525" y2="146.2" stroke="#647780" stroke-width="1.5"/><line x1="535" y1="300" x2="525" y2="300" stroke="#647780" stroke-width="1.5"/><text x="538" y="228.1" font-size="15" fill="#273b45" text-anchor="start"><tspan>z = d − 0.42x</tspan><tspan dy="4" font-size="11">u</tspan></text><text x="460" y="396" font-size="14" fill="#647780" text-anchor="middle">stress and forces</text><text x="470" y="366" font-size="17" fill="#273b45" text-anchor="middle"><tspan>M</tspan><tspan dy="5" font-size="12">u</tspan><tspan dy="-5"> = 0.36 f</tspan><tspan dy="5" font-size="12">ck</tspan><tspan dy="-5"> b x</tspan><tspan dy="5" font-size="12">u</tspan><tspan dy="-5"> (d − 0.42 x</tspan><tspan dy="5" font-size="12">u</tspan><tspan dy="-5">)</tspan></text></g></svg>