<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Method of sections</title><desc id="desc">A cut through no more than three members exposes their forces; taking moments about O, where two of them meet, leaves the third alone, so its force is the moment about O divided by its lever arm d.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="100" y1="300" x2="240" y2="300" stroke="#466d89" stroke-width="6"/><line x1="240" y1="300" x2="380" y2="300" stroke="#466d89" stroke-width="6"/><line x1="380" y1="300" x2="520" y2="300" stroke="#466d89" stroke-width="6"/><line x1="520" y1="300" x2="660" y2="300" stroke="#466d89" stroke-width="6"/><line x1="240" y1="160" x2="380" y2="160" stroke="#466d89" stroke-width="6"/><line x1="380" y1="160" x2="520" y2="160" stroke="#466d89" stroke-width="6"/><line x1="100" y1="300" x2="240" y2="160" stroke="#466d89" stroke-width="6"/><line x1="660" y1="300" x2="520" y2="160" stroke="#466d89" stroke-width="6"/><line x1="240" y1="300" x2="240" y2="160" stroke="#466d89" stroke-width="6"/><line x1="380" y1="300" x2="380" y2="160" stroke="#466d89" stroke-width="6"/><line x1="520" y1="300" x2="520" y2="160" stroke="#466d89" stroke-width="6"/><line x1="240" y1="300" x2="380" y2="160" stroke="#466d89" stroke-width="6"/><line x1="520" y1="300" x2="380" y2="160" stroke="#466d89" stroke-width="6"/><polygon points="100,303 85,327 115,327" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><line x1="78" y1="330" x2="122" y2="330" stroke="#647780" stroke-width="2"/><polygon points="660,303 645,324 675,324" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><circle cx="652" cy="330" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><circle cx="668" cy="330" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><line x1="638" y1="337" x2="682" y2="337" stroke="#647780" stroke-width="2"/><line x1="240" y1="110" x2="240" y2="151.2" stroke="#b64f4f" stroke-width="3.5"/><polygon points="240,160 235.5,149 244.5,149" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="240" y="100" font-size="17" fill="#b64f4f" text-anchor="middle">W</text><line x1="380" y1="110" x2="380" y2="151.2" stroke="#b64f4f" stroke-width="3.5"/><polygon points="380,160 375.5,149 384.5,149" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="380" y="100" font-size="17" fill="#b64f4f" text-anchor="middle">W</text><line x1="520" y1="110" x2="520" y2="151.2" stroke="#b64f4f" stroke-width="3.5"/><polygon points="520,160 515.5,149 524.5,149" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="520" y="100" font-size="17" fill="#b64f4f" text-anchor="middle">W</text><line x1="298" y1="128" x2="322" y2="336" stroke="#b64f4f" stroke-width="2.5" stroke-dasharray="8 6"/><text x="280" y="136" font-size="16" fill="#b64f4f" text-anchor="end">cut</text><circle cx="380" cy="160" r="13" fill="none" stroke="#2b7b61" stroke-width="2.5"/><text x="400" y="148" font-size="17" fill="#2b7b61" text-anchor="start">O</text><line x1="392" y1="160" x2="392" y2="300" stroke="#647780" stroke-width="1.5"/><line x1="399" y1="160" x2="385" y2="160" stroke="#647780" stroke-width="1.5"/><line x1="399" y1="300" x2="385" y2="300" stroke="#647780" stroke-width="1.5"/><text x="400" y="236" font-size="17" fill="#647780" text-anchor="start">d</text><text x="336" y="324" font-size="17" fill="#b64f4f" text-anchor="start">F</text><text x="360" y="395" font-size="15" fill="#273b45" text-anchor="middle">F = MO / d, using the loads and reaction on one side of the cut</text></g></svg>