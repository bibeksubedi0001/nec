<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Vapour pressure of water against temperature</title><desc id="desc">Water boils when its vapour pressure reaches the surrounding pressure: 101.3 kPa at 100 °C at sea level, but only about 70 kPa, reached near 90 °C, at about 3000 m.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="90" y1="330" x2="626" y2="330" stroke="#647780" stroke-width="2"/><polygon points="634,330 624,334 624,326" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><line x1="90" y1="330" x2="90" y2="54" stroke="#647780" stroke-width="2"/><polygon points="90,46 94,56 86,56" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><text x="355" y="374" font-size="17" fill="#273b45" text-anchor="middle">Temperature (°C)</text><text x="96" y="36" font-size="17" fill="#273b45" text-anchor="start">Vapour pressure (kPa)</text><text x="90" y="352" font-size="14" fill="#647780" text-anchor="middle">0</text><text x="196" y="352" font-size="14" fill="#647780" text-anchor="middle">20</text><text x="302" y="352" font-size="14" fill="#647780" text-anchor="middle">40</text><text x="408" y="352" font-size="14" fill="#647780" text-anchor="middle">60</text><text x="514" y="352" font-size="14" fill="#647780" text-anchor="middle">80</text><text x="620" y="352" font-size="14" fill="#647780" text-anchor="middle">100</text><text x="82" y="273.64" font-size="14" fill="#647780" text-anchor="end">25</text><text x="82" y="212.27" font-size="14" fill="#647780" text-anchor="end">50</text><text x="82" y="150.91" font-size="14" fill="#647780" text-anchor="end">75</text><text x="82" y="89.55" font-size="14" fill="#647780" text-anchor="end">100</text><line x1="90" y1="81.35" x2="620" y2="81.35" stroke="#647780" stroke-width="1.5" stroke-dasharray="8 6"/><text x="100" y="73.35" font-size="15" fill="#647780" text-anchor="start">atmosphere at sea level, 101.3 kPa</text><line x1="90" y1="157.94" x2="620" y2="157.94" stroke="#b98232" stroke-width="1.5" stroke-dasharray="8 6"/><text x="100" y="149.94" font-size="15" fill="#b98232" text-anchor="start">atmosphere near 3000 m, about 70 kPa</text><path d="M90 328.5 L143 326.98 L196 324.26 L249 319.57 L302 311.89 L355 299.69 L408 281.06 L461 253.44 L514 213.68 L567 157.84 L620 81.28" stroke="#287aab" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="620" cy="81.35" r="5" fill="#273b45" stroke="#273b45" stroke-width="2"/><circle cx="567" cy="157.94" r="5" fill="#b98232" stroke="#b98232" stroke-width="2"/><text x="612" y="73.35" font-size="15" fill="#273b45" text-anchor="end">boils at 100 °C</text><text x="579" y="191.94" font-size="15" fill="#b98232" text-anchor="start">boils near 90 °C</text><circle cx="196" cy="324.26" r="4" fill="#287aab" stroke="#287aab" stroke-width="2"/><line x1="196" y1="324.26" x2="230" y2="290.26" stroke="#647780" stroke-width="1"/><text x="234" y="286.26" font-size="15" fill="#273b45" text-anchor="start">2.3 kPa at 20 °C</text><text x="360" y="402" font-size="15" fill="#273b45" text-anchor="middle">Cavitation begins wherever the absolute pressure falls to this value</text></g></svg>