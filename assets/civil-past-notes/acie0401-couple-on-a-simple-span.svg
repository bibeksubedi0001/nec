<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">A clockwise couple M at distance a on a simple span</title><desc id="desc">The reactions form an equal and opposite couple, M/L down at A and M/L up at B, so the shear is -M/L everywhere. The moment falls to -Ma/L just left of the couple, jumps by M, and is M(L - a)/L just right of it.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="110" y1="95" x2="590" y2="95" stroke="#273b45" stroke-width="7"/><polygon points="110,100 95,124 125,124" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><line x1="88" y1="127" x2="132" y2="127" stroke="#647780" stroke-width="2"/><polygon points="590,100 575,121 605,121" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><circle cx="582" cy="127" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><circle cx="598" cy="127" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><line x1="568" y1="134" x2="612" y2="134" stroke="#647780" stroke-width="2"/><path d="M260.68 105 A20 20 0 1 1 295.32 105" stroke="#2b7b61" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="295.32,105 296.92,93.22 304.72,97.72" fill="#2b7b61" stroke="#2b7b61" stroke-width="1.5" stroke-linejoin="round"/><text x="278" y="63" font-size="16" fill="#2b7b61" text-anchor="middle"><tspan>M</tspan></text><text x="84" y="101" font-size="17" fill="#273b45" text-anchor="end"><tspan>A</tspan></text><text x="616" y="101" font-size="17" fill="#273b45" text-anchor="start"><tspan>B</tspan></text><line x1="110" y1="142" x2="110" y2="169.2" stroke="#287aab" stroke-width="3"/><polygon points="110,178 105.5,167 114.5,167" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><text x="122" y="172" font-size="16" fill="#287aab" text-anchor="s