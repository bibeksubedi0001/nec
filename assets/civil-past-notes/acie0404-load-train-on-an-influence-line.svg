<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Placing a load train for the greatest moment at a section</title><desc id="desc">The moment at section C is the sum of each load times the influence-line ordinate under it; it peaks with a load at C and the average load to the left of C equal to the average load on the whole span.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="80" y1="150" x2="640" y2="150" stroke="#273b45" stroke-width="7"/><polygon points="80,153 65,177 95,177" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><line x1="58" y1="180" x2="102" y2="180" stroke="#647780" stroke-width="2"/><polygon points="640,153 625,174 655,174" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><circle cx="632" cy="180" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><circle cx="648" cy="180" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><line x1="618" y1="187" x2="662" y2="187" stroke="#647780" stroke-width="2"/><line x1="225.6" y1="98" x2="225.6" y2="141.2" stroke="#b64f4f" stroke-width="3.5"/><polygon points="225.6,150 221.1,139 230.1,139" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="225.6" y="88" font-size="16" fill="#b64f4f" text-anchor="middle">W1</text><line x1="304" y1="98" x2="304" y2="141.2" stroke="#b64f4f" stroke-width="3.5"/><polygon points="304,150 299.5,139 308.5,139" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="304" y="88" font-size="16" fill="#b64f4f" text-anchor="middle">W2</text><line x1="382.4" y1="98" x2="382.4" y2="141.2" stroke="#b64f4f" stroke-width="3.5"/><polygon points="382.4,150 377.9,139 386.9,139" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="382.4" y="88" font-size="16" fill="#b64f4f" text-anchor="middle">W3</text><line x1="460.8" y1="98" x2="460.8" y2="141.2" stroke="#b64f4f" stroke-width="3.5"/><polygon points="460.8,150 456.3,139 465.3,139" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="460.8" y="88" font-size="16" fill="#b64f4f" text-anchor="middle">W4</text><text x="304" y="178" font-size="17" fill="#2b7b61" text-anchor="middle">C</text><line x1="80" y1="200" x2="304" y2="200" stroke="#647780" stroke-width="1.5"/><line x1="80" y1="193" x2="80" y2="207" stroke="#647780" stroke-width="1.5"/><line x1="304" y1="193" x2="304" y2="207" stroke="#647780" stroke-width="1.5"/><text x="192" y="226" font-size="16" fill="#647780" text-anchor="middle">a</text><line x1="304" y1="200" x2="640" y2="200" stroke="#647780" stroke-width="1.5"/><line x1="304" y1="193" x2="304" y2="207" stroke="#647780" stroke-width="1.5"/><line x1="640" y1="193" x2="640" y2="207" stroke="#647780" stroke-width="1.5"/><text x="472" y="226" font-size="16" fill="#647780" text-anchor="middle">L − a</text><polygon points="80,350 304,250 640,350" fill="#deeee6" stroke="#2b7b61" stroke-width="2.5" stroke-linejoin="round"/><line x1="225.6" y1="350" x2="225.6" y2="285" stroke="#b64f4f" stroke-width="2"/><text x="231.6" y="322.5" font-size="15" fill="#b64f4f" text-anchor="start">y1</text><line x1="304" y1="350" x2="304" y2="250" stroke="#b64f4f" stroke-width="2"/><text x="310" y="305" font-size="15" fill="#b64f4f" text-anchor="start">y2</text><line x1="382.4" y1="350" x2="382.4" y2="273.33" stroke="#b64f4f" stroke-width="2"/><text x="388.4" y="316.67" font-size="15" fill="#b64f4f" text-anchor="start">y3</text><line x1="460.8" y1="350" x2="460.8" y2="296.67" stroke="#b64f4f" stroke-width="2"/><text x="466.8" y="328.33" font-size="15" fill="#b64f4f" text-anchor="start">y4</text><text x="304" y="240" font-size="15" fill="#2b7b61" text-anchor="middle">a(L − a) / L</text><text x="360" y="400" font-size="15" fill="#273b45" text-anchor="middle">MC = Σ Wi yi, greatest when (load left of C) / a = (total load) / L</text></g></svg>