<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Extension of a bar and stress in a heated bar held at its ends</title><desc id="desc">A pull P on a bar of length L, area A and modulus E stretches it by PL/AE. If a bar is held between rigid supports and heated by ΔT, the free expansion αLΔT is prevented and a compressive stress EαΔT develops.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><text x="180" y="60" font-size="18" fill="#273b45" text-anchor="middle">Axial pull</text><line x1="60" y1="112" x2="60" y2="178" stroke="#273b45" stroke-width="3"/><line x1="60" y1="116" x2="49" y2="126" stroke="#647780" stroke-width="1.4"/><line x1="60" y1="128" x2="49" y2="138" stroke="#647780" stroke-width="1.4"/><line x1="60" y1="140" x2="49" y2="150" stroke="#647780" stroke-width="1.4"/><line x1="60" y1="152" x2="49" y2="162" stroke="#647780" stroke-width="1.4"/><line x1="60" y1="164" x2="49" y2="174" stroke="#647780" stroke-width="1.4"/><line x1="60" y1="176" x2="49" y2="186" stroke="#647780" stroke-width="1.4"/><rect x="60" y="128" width="220" height="34" fill="#e6f1f8" stroke="#273b45" stroke-width="2"/><rect x="280" y="128" width="26" height="34" fill="none" stroke="#287aab" stroke-width="1.5" stroke-dasharray="4 3"/><line x1="306" y1="145" x2="341.2" y2="145" stroke="#b64f4f" stroke-width="3.5"/><polygon points="350,145 339,149.5 339,140.5" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="342" y="132" font-size="18" fill="#b64f4f" text-anchor="middle"><tspan>P</tspan></text><line x1="60" y1="202" x2="280" y2="202" stroke="#647780" stroke-width="1.5"/><line x1="60" y1="195" x2="60" y2="209" stroke="#647780" stroke-width="1.5"/><line x1="280" y1="195" x2="280" y2="209" stroke="#647780" stroke-width="1.5"/><text x="170" y="228" font-size="16" fill="#647780" text-anchor="middle">L</text><line x1="280" y1="110" x2="306" y2="110" stroke="#647780" stroke-width="1.5"/><line x1="280" y1="103" x2="280" y2="117" stroke="#647780" stroke-width="1.5"/><line x1="306" y1="103" x2="306" y2="117" stroke="#647780" stroke-width="1.5"/><text x="293" y="100" font-size="16" fill="#647780" text-anchor="middle">δ</text><text x="170" y="150" font-size="15" fill="#273b45" text-anchor="middle"><tspan>A, E</tspan></text><text x="180" y="290" font-size="22" fill="#273b45" text-anchor="middle"><tspan>δ = PL/AE</tspan></text><text x="180" y="318" font-size="15" fill="#647780" text-anchor="middle">stress P/A, strain δ/L</text><text x="530" y="60" font-size="18" fill="#273b45" text-anchor="middle">Ends held, heated by ΔT</text><line x1="410" y1="112" x2="410" y2="178" stroke="#273b45" stroke-width="3"/><line x1="410" y1="116" x2="399" y2="126" stroke="#647780" stroke-width="1.4"/><line x1="410" y1="128" x2="399" y2="138" stroke="#647780" stroke-width="1.4"/><line x1="410" y1="140" x2="399" y2="150" stroke="#647780" stroke-width="1.4"/><line x1="410" y1="152" x2="399" y2="162" stroke="#647780" stroke-width="1.4"/><line x1="410" y1="164" x2="399" y2="174" stroke="#647780" stroke-width="1.4"/><line x1="410" y1="176" x2="399" y2="186" stroke="#647780" stroke-width="1.4"/><line x1="650" y1="112" x2="650" y2="178" stroke="#273b45" stroke-width="3"/><line x1="650" y1="116" x2="661" y2="126" stroke="#647780" stroke-width="1.4"/><line x1="650" y1="128" x2="661" y2="138" stroke="#647780" stroke-width="1.4"/><line x1="650" y1="140" x2="661" y2="150" stroke="#647780" stroke-width="1.4"/><line x1="650" y1="152" x2="661" y2="162" stroke="#647780" stroke-width="1.4"/><line x1="650" y1="164" x2="661" y2="174" stroke="#647780" stroke-width="1.4"/><line x1="650" y1="176" x2="661" y2="186" stroke="#647780" stroke-width="1.4"/><rect x="410" y="128" width="240" height="34" fill="#f2dfdf" stroke="#273b45" stroke-width="2"/><line x1="452" y1="145" x2="422.8" y2="145" stroke="#b64f4f" stroke-width="2.5"/><polygon points="414,145 425,140.5 425,149.5" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><line x1="608" y1="145" x2="637.2" y2="145" stroke="#647780" stroke-width="1.8" stroke-dasharray="4 3"/><polygon points="646,145 635,149.5 635,140.5" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><line x1="646" y1="186" x2="620.8" y2="186" stroke="#287aab" stroke-width="3"/><polygon points="612,186 623,181.5 623,190.5" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><line x1="414" y1="186" x2="439.2" y2="186" stroke="#287aab" stroke-width="3"/><polygon points="448,186 437,190.5 437,181.5" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><text x="530" y="150" font-size="15" fill="#647780" text-anchor="middle">wants to grow αLΔT</text><text x="530" y="215" font-size="15" fill="#287aab" text-anchor="middle">walls push back</text><text x="530" y="290" font-size="22" fill="#273b45" text-anchor="middle"><tspan>σ = EαΔT</tspan></text><text x="530" y="318" font-size="15" fill="#647780" text-anchor="middle">compressive; independent of L</text><text x="360" y="395" font-size="15" fill="#647780" text-anchor="middle">Free expansion causes no stress; restrained expansion does</text></g></svg>