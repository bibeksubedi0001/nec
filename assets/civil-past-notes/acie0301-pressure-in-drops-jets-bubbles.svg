<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Excess pressure in a droplet, a jet and a soap bubble</title><desc id="desc">Surface tension raises the pressure inside a curved surface: by 4σ/d in a droplet, 2σ/d in a cylindrical jet and 8σ/d in a soap bubble, which has two surfaces.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><text x="130" y="70" font-size="19" fill="#273b45" text-anchor="middle">Droplet</text><circle cx="130" cy="180" r="72" fill="#d8edf7" stroke="#287aab" stroke-width="2.5"/><text x="130" y="186" font-size="18" fill="#273b45" text-anchor="middle">p + Δp</text><text x="360" y="70" font-size="19" fill="#273b45" text-anchor="middle">Cylindrical jet</text><rect x="270" y="140" width="170" height="80" fill="#d8edf7" stroke="none" stroke-width="2"/><line x1="270" y1="140" x2="440" y2="140" stroke="#287aab" stroke-width="2.5"/><line x1="270" y1="220" x2="440" y2="220" stroke="#287aab" stroke-width="2.5"/><ellipse cx="440" cy="180" rx="12" ry="40" fill="#d8edf7" stroke="#287aab" stroke-width="2.5"/><ellipse cx="270" cy="180" rx="12" ry="40" fill="none" stroke="#287aab" stroke-width="1.5" stroke-dasharray="5 4"/><text x="355" y="186" font-size="18" fill="#273b45" text-anchor="middle">p + Δp</text><text x="580" y="70" font-size="19" fill="#273b45" text-anchor="middle">Soap bubble</text><circle cx="580" cy="180" r="72" fill="#e6f1f8" stroke="#287aab" stroke-width="2.5"/><circle cx="580" cy="180" r="63" fill="#fbfcfd" stroke="#287aab" stroke-width="2"/><text x="580" y="186" font-size="18" fill="#273b45" text-anchor="middle">p + Δp</text><text x="130" y="300" font-size="19" fill="#287aab" text-anchor="middle">Δp = 4σ / d</text><text x="130" y="328" font-size="15" fill="#647780" text-anchor="middle">one surface</text><text x="360" y="300" font-size="19" fill="#287aab" text-anchor="middle">Δp = 2σ / d</text><text x="360" y="328" font-size="15" fill="#647780" text-anchor="middle">curved in one direction only</text><text x="580" y="300" font-size="19" fill="#287aab" text-anchor="middle">Δp = 8σ / d</text><text x="580" y="328" font-size="15" fill="#647780" text-anchor="middle">two surfaces</text><text x="360" y="390" font-size="16" fill="#273b45" text-anchor="middle">d is the diameter: the smaller the drop, jet or bubble, the larger Δp</text></g></svg>