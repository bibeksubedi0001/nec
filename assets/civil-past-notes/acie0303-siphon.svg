<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Flow through a siphon</title><desc id="desc">The outlet velocity comes from the drop H below the supply surface, while the pressure is lowest at the summit S; it must stay well above the vapour pressure, which limits the summit to about 7 to 8 m above the supply surface.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><rect x="40" y="170" width="190" height="170" fill="#d8edf7" stroke="none" stroke-width="2"/><path d="M40 110 L40 340 L230 340 L230 110" stroke="#273b45" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="40" y1="170" x2="230" y2="170" stroke="#287aab" stroke-width="2"/><polygon points="92,158 108,158 100,170" fill="#287aab" stroke="none" stroke-width="2" stroke-linejoin="round"/><path d="M190 310 L190 110 Q190 72 228 72 L412 72 Q450 72 450 110 L450 350" stroke="#466d89" stroke-width="14" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M190 310 L190 110 Q190 72 228 72 L412 72 Q450 72 450 110 L450 350" stroke="#e6f1f8" stroke-width="8" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="450" y1="352" x2="450" y2="389.2" stroke="#287aab" stroke-width="3"/><polygon points="450,398 445.5,387 454.5,387" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><line x1="230" y1="170" x2="640" y2="170" stroke="#647780" stroke-width="1.2" stroke-dasharray="6 5"/><line x1="460" y1="72" x2="570" y2="72" stroke="#647780" stroke-width="1.2" stroke-dasharray="6 5"/><line x1="462" y1="352" x2="630" y2="352" stroke="#647780" stroke-width="1.2" stroke-dasharray="6 5"/><circle cx="320" cy="72" r="5" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><text x="320" y="52" font-size="16" fill="#b64f4f" text-anchor="middle">S: lowest pressure</text><line x1="560" y1="72" x2="560" y2="170" stroke="#647780" stroke-width="1.5"/><line x1="567" y1="72" x2="553" y2="72" stroke="#647780" stroke-width="1.5"/><line x1="567" y1="170" x2="553" y2="170" stroke="#647780" stroke-width="1.5"/><text x="570" y="127" font-size="18" fill="#647780" text-anchor="start">hs</text><line x1="620" y1="170" x2="620" y2="352" stroke="#647780" stroke-width="1.5"/><line x1="627" y1="170" x2="613" y2="170" stroke="#647780" stroke-width="1.5"/><line x1="627" y1="352" x2="613" y2="352" stroke="#647780" stroke-width="1.5"/><text x="630" y="267" font-size="18" fill="#647780" text-anchor="start">H</text><text x="40" y="385" font-size="16" fill="#273b45" text-anchor="start">V = √(2gH), ignoring losses</text><text x="40" y="408" font-size="16" fill="#273b45" text-anchor="start">pS / γ = −(hs + V² / 2g), a gauge pressure</text></g></svg>