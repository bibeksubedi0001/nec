<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Radius of a segmental arch from its span and rise</title><desc id="desc">The centre, the mid-span point of the chord and a springing form a right triangle with sides L/2 and R - h and hypotenuse R. From R squared = (L/2) squared + (R - h) squared, the radius is R = L squared/8h + h/2.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><path d="M160 280 L162.7 274.34 L165.56 268.76 L168.58 263.26 L171.76 257.85 L175.09 252.54 L178.57 247.32 L182.19 242.2 L185.96 237.19 L189.87 232.28 L193.92 227.49 L198.11 222.82 L202.42 218.27 L206.86 213.84 L211.43 209.54 L216.12 205.38 L220.93 201.35 L225.84 197.45 L230.87 193.7 L236 190.1 L241.23 186.64 L246.56 183.33 L251.98 180.18 L257.49 177.18 L263.08 174.34 L268.75 171.65 L274.5 169.14 L280.31 166.78 L286.19 164.6 L292.13 162.58 L298.12 160.73 L304.17 159.05 L310.26 157.55 L316.38 156.22 L322.55 155.06 L328.74 154.08 L334.97 153.28 L341.21 152.66 L347.46 152.21 L353.73 151.94 L360 151.85 L366.27 151.94 L372.54 152.21 L378.79 152.66 L385.03 153.28 L391.26 154.08 L397.45 155.06 L403.62 156.22 L409.74 157.55 L415.83 159.05 L421.88 160.73 L427.87 162.58 L433.81 164.6 L439.69 166.78 L445.5 169.14 L451.25 171.65 L456.92 174.34 L462.51 177.18 L468.02 180.18 L473.44 183.33 L478.77 186.64 L484 190.1 L489.13 193.7 L494.16 197.45 L499.07 201.35 L503.88 205.38 L508.57 209.54 L513.14 213.84 L517.58 218.27 L521.89 222.82 L526.08 227.49 L530.13 232.28 L534.04 237.19 L537.81 242.2 L541.43 247.32 L544.91 252.54 L548.24 257.85 L551.42 263.26 L554.44 268.76 L557.3 274.34 L560 280" stroke="#273b45" stroke-width="6" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="160" y1="280" x2="560" y2="280" stroke="#647780" stroke-width="1.5" stroke-dasharray="6 5"/><polygon points="360,372 360,280 560,280" fill="#e6f1f8" stroke="none" stroke-width="2" stroke-linejoin="round"/><line x1="360" y1="372" x2="560" y2="280" stroke="#287aab" stroke-width="2.5"/><line x1="360" y1="372" x2="360" y2="280" stroke="#2b7b61" stroke-width="2.5"/><line x1="360" y1="280" x2="360" y2="151.85" stroke="#b64f4f" stroke-width="2.5"/><circle cx="360" cy="372" r="4" fill="#273b45" stroke="#273b45" stroke-width="2"/><text x="350" y="378" font-size="16" fill="#273b45" text-anchor="end">O</text><text x="460" y="272" font-size="17" fill="#273b45" text-anchor="middle"><tspan>L/2</tspan></text><text x="350" y="334" font-size="17" fill="#2b7b61" text-anchor="end"><tspan>R − h</tspan></text><text x="370" y="221.93" font-size="18" fill="#b64f4f" text-anchor="start"><tspan>h</tspan></text><text x="476" y="342" font-size="18" fill="#287aab" text-anchor="start"><tspan>R</tspan></text><line x1="160" y1="302" x2="560" y2="302" stroke="#647780" stroke-width="1.5"/><line x1="160" y1="295" x2="160" y2="309" stroke="#647780" stroke-width="1.5"/><line x1="560" y1="295" x2="560" y2="309" stroke="#647780" stroke-width="1.5"/><text x="250" y="328" font-size="15" fill="#647780" text-anchor="middle"><tspan>span L</tspan></text><text x="170" y="70" font-size="19" fill="#273b45" text-anchor="middle"><tspan>R² = (L/2)² + (R − h)²</tspan></text><text x="170" y="108" font-size="21" fill="#287aab" text-anchor="middle"><tspan>R = L²/8h + h/2</tspan></text></g></svg>