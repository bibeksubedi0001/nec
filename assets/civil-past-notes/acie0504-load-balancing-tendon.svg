<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Load balanced by a parabolic tendon</title><desc id="desc">A tendon with force P draped in a parabola of sag e pushes up on the concrete with a uniform load 8Pe/L squared. If this equals the applied load w, the beam carries no net bending and the concrete is under a uniform stress P/A.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><rect x="90" y="140" width="520" height="80" fill="#d6dfe3" stroke="#273b45" stroke-width="2"/><line x1="90" y1="180" x2="610" y2="180" stroke="#647780" stroke-width="1.2" stroke-dasharray="6 5"/><path d="M90 180 L98.67 182.1 L107.33 184.12 L116 186.08 L124.67 187.96 L133.33 189.78 L142 191.52 L150.67 193.19 L159.33 194.79 L168 196.32 L176.67 197.78 L185.33 199.16 L194 200.48 L202.67 201.72 L211.33 202.9 L220 204 L228.67 205.03 L237.33 205.99 L246 206.88 L254.67 207.7 L263.33 208.44 L272 209.12 L280.67 209.72 L289.33 210.26 L298 210.72 L306.67 211.11 L315.33 211.43 L324 211.68 L332.67 211.86 L341.33 211.96 L350 212 L358.67 211.96 L367.33 211.86 L376 211.68 L384.67 211.43 L393.33 211.11 L402 210.72 L410.67 210.26 L419.33 209.72 L428 209.12 L436.67 208.44 L445.33 207.7 L454 206.88 L462.67 205.99 L471.33 205.03 L480 204 L488.67 202.9 L497.33 201.72 L506 200.48 L514.67 199.16 L523.33 197.78 L532 196.32 L540.67 194.79 L549.33 193.19 L558 191.52 L566.67 189.78 L575.33 187.96 L584 186.08 L592.67 184.12 L601.33 182.1 L610 180" stroke="#b64f4f" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="40" y1="180" x2="77.2" y2="180" stroke="#b64f4f" stroke-width="3.5"/><polygon points="86,180 75,184.5 75,175.5" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="54" y="168" font-size="18" fill="#b64f4f" text-anchor="middle"><tspan>P</tspan></text><line x1="660" y1="180" x2="622.8" y2="180" stroke="#b64f4f" stroke-width="3.5"/><polygon points="614,180 625,175.5 625,184.5" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="646" y="168" font-size="18" fill="#b64f4f" text-anchor="middle"><tspan>P</tspan></text><line x1="360" y1="180" x2="360" y2="212" stroke="#647780" stroke-width="1.5"/><line x1="367" y1="180" x2="353" y2="180" stroke="#647780" stroke-width="1.5"/><line x1="367" y1="212" x2="353" y2="212" stroke="#647780" stroke-width="1.5"/><text x="368" y="202" font-size="17" fill="#647780" text-anchor="start">e</text><line x1="110" y1="272" x2="110" y2="232.4" stroke="#2b7b61" stroke-width="2"/><polygon points="110,226 113.5,234 106.5,234" fill="#2b7b61" stroke="#2b7b61" stroke-width="1.5" stroke-linejoin="round"/><line x1="170" y1="272" x2="170" y2="232.4" stroke="#2b7b61" stroke-width="2"/><polygon points="170,226 173.5,234 166.5,234" fill="#2b7b61" stroke="#2b7b61" stroke-width="1.5" stroke-linejoin="round"/><line x1="230" y1="272" x2="230" y2="232.4" stroke="#2b7b61" stroke-width="2"/><polygon points="230,226 233.5,234 226.5,234" fill="#2b7b61" stroke="#2b7b61" stroke-width="1.5" stroke-linejoin="round"/><line x1="290" y1="272" x2="290" y2="232.4" stroke="#2b7b61" stroke-width="2"/><polygon points="290,226 293.5,234 286.5,234" fill="#2b7b61" stroke="#2b7b61" stroke-width="1.5" stroke-linejoin="round"/><line x1="350" y1="272" x2="350" y2="232.4" stroke="#2b7b61" stroke-width="2"/><polygon points="350,226 353.5,234 346.5,234" fill="#2b7b61" stroke="#2b7b61" stroke-width="1.5" stroke-linejoin="round"/><line x1="410" y1="272" x2="410" y2="232.4" stroke="#2b7b61" stroke-width="2"/><polygon points="410,226 413.5,234 406.5,234" fill="#2b7b61" stroke="#2b7b61" stroke-width="1.5" stroke-linejoin="round"/><line x1="470" y1="272" x2="470" y2="232.4" stroke="#2b7b61" stroke-width="2"/><polygon points="470,226 473.5,234 466.5,234" fill="#2b7b61" stroke="#2b7b61" stroke-width="1.5" stroke-linejoin="round"/><l