 stroke-width="1.5" stroke-linejoin="round"/><line x1="454" y1="106" x2="454" y2="127.8" stroke="#b64f4f" stroke-width="2"/><polygon points="454,135 450,126 458,126" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><line x1="506" y1="106" x2="506" y2="127.8" stroke="#b64f4f" stroke-width="2"/><polygon points="506,135 502,126 510,126" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><line x1="558" y1="106" x2="558" y2="127.8" stroke="#b64f4f" stroke-width="2"/><polygon points="558,135 554,126 562,126" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><line x1="610" y1="106" x2="610" y2="127.8" stroke="#b64f4f" stroke-width="2"/><polygon points="610,135 606,126 614,126" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="360" y="96" font-size="16" fill="#b64f4f" text-anchor="middle"><tspan>applied load w</tspan></text><line x1="90" y1="330" x2="610" y2="330" stroke="#647780" stroke-width="1.5"/><line x1="90" y1="323" x2="90" y2="337" stroke="#647780" stroke-width="1.5"/><line x1="610" y1="323" x2="610" y2="337" stroke="#647780" stroke-width="1.5"/><text x="350" y="356" font-size="16" fill="#647780" text-anchor="middle">L</text><text x="360" y="400" font-size="16" fill="#647780" text-anchor="middle"><tspan>w = w</tspan><tspan dy="4" font-size="12">b</tspan><tspan dy="-4">: no deflection, uniform stress P/A</tspan></text></g></svg>