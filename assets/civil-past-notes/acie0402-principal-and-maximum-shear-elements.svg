<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Rotating a stressed element to its principal and maximum-shear planes</title><desc id="desc">Turning the element through θp, where tan 2θp = 2τxy/(σx - σy), removes the shear and leaves the principal stresses σ1 and σ2. A further 45 degrees gives the maximum shear (σ1 - σ2)/2 with the average normal stress on every face.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><polygon points="90,130 170,130 170,210 90,210" fill="#e6f1f8" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><line x1="174" y1="170" x2="205.2" y2="170" stroke="#b64f4f" stroke-width="3"/><polygon points="214,170 203,174.5 203,165.5" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><line x1="86" y1="170" x2="54.8" y2="170" stroke="#b64f4f" stroke-width="3"/><polygon points="46,170 57,165.5 57,174.5" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><line x1="130" y1="126" x2="130" y2="98.8" stroke="#b64f4f" stroke-width="3"/><polygon points="130,90 134.5,101 125.5,101" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><line x1="130" y1="214" x2="130" y2="241.2" stroke="#b64f4f" stroke-width="3"/><polygon points="130,250 125.5,239 134.5,239" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><line x1="102" y1="120" x2="149.2" y2="120" stroke="#2b7b61" stroke-width="2.5"/><polygon points="158,120 147,124.5 147,115.5" fill="#2b7b61" stroke="#2b7b61" stroke-width="1.5" stroke-linejoin="round"/><line x1="180" y1="198" x2="180" y2="150.8" stroke="#2b7b61" stroke-width="2.5"/><polygon points="180,142 184.5,153 175.5,153" fill="#2b7b61" stroke="#2b7b61" stroke-width="1.5" stroke-linejoin="round"/><text x="220" y="188" font-size="16" fill="#b64f4f" text-anchor="start"><tspan>σ</tspan><tspan dy="4" font-size="12">x</tspan></text><text x="144" y="86" font-size="16" fill="#b64f4f" text-anchor="start"><tspan>σ</tspan><tspan dy="4" font-size="12">y</tspan></text><text x="96" y="116" font-size="15" fill="#2b7b61" text-anchor="end"><tspan>τ</tspan><tspan dy="4" font-size="11">xy</tspan></text><text x="130" y="300" font-size="16" fill="#647780" text-anchor="middle"><tspan>given state</tspan></text><polygon points="306.84,150.65 379.35,116.84 413.16,189.35 340.65,223.16" fill="#e6f1f8" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><line x1="399.88" y1="151.4" x2="428.15" y2="138.22" stroke="#b64f4f" stroke-width="3"/><polygon points="436.13,134.5 428.06,143.23 424.26,135.07" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><line x1="320.12" y1="188.6" x2="291.85" y2="201.78" stroke="#b64f4f" stroke-width="3"/><polygon points="283.87,205.5 291.94,196.77 295.74,204.93" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><line x1="341.4" y1="130.12" x2="333.29" y2="112.72" stroke="#b64f4f" stroke-width="3"/><polygon points="329.57,104.75 338.3,112.81 330.14,116.62" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><line x1="378.6" y1="209.88" x2="386.71" y2="227.28" stroke="#b64f4f" stroke-width="3"/><polygon points="390.43,235.25 381.7,227.19 389.86,223.38" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="447.61" y="140.18" font-size="17" fill="#b64f4f" text-anchor="start"><tspan>σ</tspan><tspan dy="5" font-size="12">1</tspan></text><text x="343.35" y="91.7" font-size="17" fill="#b64f4f" text-anchor="start"><tspan>σ</tspan><tspan dy="5" font-size="12">2</tspan></text><text x="360" y="300" font-size="16" fill="#647780" text-anchor="middle"><tspan>rotated θ</tspan><tspan dy="4" font-size="12">p</tspan><tspan dy="-4">: no shear</tspan></text><polygon points="566.09,118.73 641.27,146.09 613.91,221.27 538.73,193.91" fill="#e6f1f8" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><line x1="580.79" y1="113.44" x2="625.14" y2="129.58" stroke="#2b7b61" stroke-width="2.5"/><polygon points="633.41,132.59 621.54,133.06 624.61,124.6" fill="#2b7b61" stroke="#2b7b61" stroke-width="1.5" stroke-linejoin="round"/><line x1="599.21" y1="226.56" x2="554.86" y2="210.42" stroke="#2b7b61" stroke-width="2.5"/><polygon points="546.59,207.41 558.46,206.94 555.39,215.4" fill="#2b7b61" stroke="#2b7b61" stroke-width="1.5" stroke-linejoin="round"/><line x1="627.41" y1="213.41" x2="643.55" y2="169.06" stroke="#2b7b61" stroke-width="2.5"/><polygon points="646.56,160.79 647.03,172.67 638.57,169.59" fill="#2b7b61" stroke="#2b7b61" stroke-width="1.5" stroke-linejoin="round"/><line x1="552.59" y1="126.59" x2="536.45" y2="170.94" stroke="#2b7b61" stroke-width="2.5"/><polygon points="533.44,179.21 532.97,167.33 541.43,170.41" fill="#2b7b61" stroke="#2b7b61" stroke-width="1.5" stroke-linejoin="round"/><text x="611.21" y="111.74" font-size="16" fill="#2b7b61" text-anchor="middle"><tspan>τ</tspan><tspan dy="4" font-size="12">max</tspan></text><text x="590" y="300" font-size="16" fill="#647780" text-anchor="middle"><tspan>θ</tspan><tspan dy="4" font-size="12">p</tspan><tspan dy="-4"> + 45°: maximum shear</tspan></text><text x="360" y="350" font-size="18" fill="#273b45" text-anchor="middle"><tspan>σ</tspan><tspan dy="5" font-size="13">1,2</tspan><tspan dy="-5"> = (σ</tspan><tspan dy="5" font-size="13">x</tspan><tspan dy="-5"> + σ</tspan><tspan dy="5" font-size="13">y</tspan><tspan dy="-5">)/2 ± √(((σ</tspan><tspan dy="5" font-size="13">x</tspan><tspan dy="-5"> − σ</tspan><tspan dy="5" font-size="13">y</tspan><tspan dy="-5">)/2)² + τ</tspan><tspan dy="5" font-size="13">xy</tspan><tspan dy="-5">²)</tspan></text><text x="360" y="390" font-size="18" fill="#273b45" text-anchor="middle"><tspan>τ</tspan><tspan dy="5" font-size="13">max</tspan><tspan dy="-5"> = (σ</tspan><tspan dy="5" font-size="13">1</tspan><tspan dy="-5"> − σ</tspan><tspan dy="5" font-size="13">2</tspan><tspan dy="-5">)/2</tspan></text></g></svg>