<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Thiessen polygons in a catchment</title><desc id="desc">Perpendicular bisectors of the lines joining neighbouring gauges divide the catchment so that each gauge stands for the area nearer to it than to any other; each reading is weighted by that area.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><polygon points="90,190 130,110 240,70 251.67,70.83 281.73,198.61 136.39,314.89 104,296" fill="#e6f1f8" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><polygon points="251.67,70.83 380,80 469.02,69.83 456.67,193.33 385,265 281.73,198.61" fill="#deeee6" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><polygon points="469.02,69.83 520,64 640,124 668,226 631.2,280.6 456.67,193.33" fill="#f5ead8" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><polygon points="631.2,280.6 606,318 470,352 385,347.14 385,265 456.67,193.33" fill="#f2dfdf" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><polygon points="385,347.14 330,344 200,352 136.39,314.89 281.73,198.61 385,265" fill="#d6dfe3" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><polygon points="90,190 130,110 240,70 380,80 520,64 640,124 668,226 606,318 470,352 330,344 200,352 104,296" fill="none" stroke="#273b45" stroke-width="3" stroke-linejoin="round"/><circle cx="190" cy="190" r="5" fill="#273b45" stroke="#273b45" stroke-width="2"/><text x="200" y="180" font-size="16" fill="#273b45" text-anchor="start">A: 42 mm</text><circle cx="360" cy="150" r="5" fill="#273b45" stroke="#273b45" stroke-width="2"/><text x="370" y="140" font-size="16" fill="#273b45" text-anchor="start">B: 55 mm</text><circle cx="560" cy="170" r="5" fill="#273b45" stroke="#273b45" stroke-width="2"/><text x="570" y="160" font-size="16" fill="#273b45" text-anchor="start">C: 61 mm</text><circle cx="500" cy="290" r="5" fill="#273b45" stroke="#273b45" stroke-width="2"/><text x="510" y="280" font-size="16" fill="#273b45" text-anchor="start">D: 48 mm</text><circle cx="270" cy="290" r="5" fill="#273b45" stroke="#273b45" stroke-width="2"/><text x="280" y="280" font-size="16" fill="#273b45" text-anchor="start">E: 37 mm</text><text x="360" y="395" font-size="16" fill="#273b45" text-anchor="middle">Mean rainfall = Σ (P × A) / Σ A over the polygons</text></g></svg>