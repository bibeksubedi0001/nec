<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">A weight dropped onto a collar at the end of a bar</title><desc id="desc">A weight W falling through h onto a collar stretches the bar by the energy balance W(h + δ) = σ squared AL/2E. A gradually applied load gives W/A, a load applied suddenly (h = 0) gives twice that, and a drop gives W/A times (1 + root(1 + 2AEh/WL)).</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="120" y1="50" x2="280" y2="50" stroke="#273b45" stroke-width="3"/><line x1="120" y1="38" x2="132" y2="50" stroke="#8a9aa3" stroke-width="1"/><line x1="132" y1="38" x2="144" y2="50" stroke="#8a9aa3" stroke-width="1"/><line x1="144" y1="38" x2="156" y2="50" stroke="#8a9aa3" stroke-width="1"/><line x1="156" y1="38" x2="168" y2="50" stroke="#8a9aa3" stroke-width="1"/><line x1="168" y1="38" x2="180" y2="50" stroke="#8a9aa3" stroke-width="1"/><line x1="180" y1="38" x2="192" y2="50" stroke="#8a9aa3" stroke-width="1"/><line x1="192" y1="38" x2="204" y2="50" stroke="#8a9aa3" stroke-width="1"/><line x1="204" y1="38" x2="216" y2="50" stroke="#8a9aa3" stroke-width="1"/><line x1="216" y1="38" x2="228" y2="50" stroke="#8a9aa3" stroke-width="1"/><line x1="228" y1="38" x2="240" y2="50" stroke="#8a9aa3" stroke-width="1"/><line x1="240" y1="38" x2="252" y2="50" stroke="#8a9aa3" stroke-width="1"/><line x1="252" y1="38" x2="264" y2="50" stroke="#8a9aa3" stroke-width="1"/><line x1="264" y1="38" x2="276" y2="50" stroke="#8a9aa3" stroke-width="1"/><line x1="276" y1="38" x2="280" y2="42" stroke="#8a9aa3" stroke-width="1"/><rect x="193" y="50" width="14" height="280" fill="#d6dfe3" stroke="#273b45" stroke-width="2"/><rect x="160" y="330" width="80" height="14" fill="#466d89" stroke="#273b45" stroke-width="2"/><rect x="168" y="176" width="64" height="34" fill="#f5ead8" stroke="#273b45" stroke-width="2"/><text x="200" y="198" font-size="18" fill="#273b45" text-anchor="middle"><tspan>W</tspan></text><line x1="262" y1="210" x2="262" y2="330" stroke="#647780" stroke-width="1.5"/><line x1="269" y1="210" x2="255" y2="210" stroke="#647780" stroke-width="1.5"/><line x1="269" y1="330" x2="255" y2="330" stroke="#647780" stroke-width="1.5"/><text x="272" y="276" font-size="18" fill="#647780" text-anchor="start">h</text><line x1="150" y1="214" x2="150" y2="253.2" stroke="#b64f4f" stroke-width="2.5"/><polygon points="150,262 145.5,251 154.5,251" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="142" y="250" font-size="15" fill="#b64f4f" text-anchor="end">falls</text><line x1="88" y1="50" x2="88" y2="330" stroke="#647780" stroke-width="1.5"/><line x1="95" y1="50" x2="81" y2="50" stroke="#647780" stroke-width="1.5"/><line x1="95" y1="330" x2="81" y2="330" stroke="#647780" stroke-width="1.5"/><text x="78" y="196" font-size="18" fill="#647780" text-anchor="end">L</text><text x="200" y="372" font-size="15" fill="#647780" text-anchor="middle">bar of area A, modulus E</text><text x="510" y="120" font-size="19" fill="#273b45" text-anchor="middle"><tspan>gradual: σ = W/A</tspan></text><text x="510" y="170" font-size="19" fill="#273b45" text-anchor="middle"><tspan>sudden (h = 0): σ = 2W/A</tspan></text><text x="510" y="220" font-size="19" fill="#273b45" text-anchor="middle"><tspan>dropped through h:</tspan></text><text x="510" y="256" font-size="18" fill="#273b45" text-anchor="middle"><tspan>σ = (W/A)(1 + √(1 + 2AEh/WL))</tspan></text><text x="510" y="320" font-size="18" fill="#647780" text-anchor="middle"><tspan>U = σ²AL/2E = W(h + δ)</tspan></text></g></svg>