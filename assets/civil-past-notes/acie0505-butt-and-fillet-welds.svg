<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Butt welds, fillet welds and effective length</title><desc id="desc">A full-penetration butt weld joins plates edge to edge and is as strong as the plate; a fillet weld is designed on its throat, 0.7 times its size for a right-angled weld, over its effective length L − 2s.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><text x="130" y="90" font-size="17" fill="#273b45" text-anchor="middle">Butt weld</text><polygon points="30,200 115,200 125,230 30,230" fill="#d6dfe3" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><polygon points="155,200 230,200 230,230 145,230" fill="#d6dfe3" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><polygon points="115,200 155,200 145,230 125,230" fill="#f5ead8" stroke="#b98232" stroke-width="2" stroke-linejoin="round"/><path d="M113 200 Q135 188 157 200" stroke="#b98232" stroke-width="2" fill="#f5ead8" stroke-linejoin="round" stroke-linecap="round"/><text x="130" y="262" font-size="14" fill="#647780" text-anchor="middle">single-V, full penetration</text><text x="370" y="90" font-size="17" fill="#273b45" text-anchor="middle">Fillet weld: size and throat</text><rect x="270" y="250" width="200" height="24" fill="#d6dfe3" stroke="#273b45" stroke-width="2"/><rect x="358" y="120" width="24" height="130" fill="#d6dfe3" stroke="#273b45" stroke-width="2"/><polygon points="358,250 358,214 322,250" fill="#f5ead8" stroke="#b98232" stroke-width="2" stroke-linejoin="round"/><polygon points="382,250 382,214 418,250" fill="#f5ead8" stroke="#b98232" stroke-width="2" stroke-linejoin="round"/><line x1="382" y1="250" x2="400" y2="232" stroke="#b64f4f" stroke-width="2.5"/><line x1="400" y1="232" x2="408" y2="204" stroke="#b64f4f" stroke-width="1"/><text x="398" y="196" font-size="15" fill="#b64f4f" text-anchor="start">throat t = 0.7s</text><line x1="322" y1="292" x2="358" y2="292" stroke="#647780" stroke-width="1.5"/><line x1="322" y1="285" x2="322" y2="299" stroke="#647780" stroke-width="1.5"/><line x1="358" y1="285" x2="358" y2="299" stroke="#647780" stroke-width="1.5"/><text x="340" y="318" font-size="15" fill="#647780" text-anchor="middle">s</text><text x="575" y="104" font-size="17" fill="#273b45" text-anchor="middle">Side fillets</text><rect x="500" y="120" width="150" height="170" fill="#d6dfe3" stroke="#273b45" stroke-width="2"/><rect x="560" y="180" width="152" height="50" fill="#e6f1f8" stroke="#273b45" stroke-width="2"/><line x1="560" y1="180" x2="650" y2="180" stroke="#b98232" stroke-width="5"/><line x1="560" y1="230" x2="650" y2="230" stroke="#b98232" stroke-width="5"/><line x1="560" y1="256" x2="650" y2="256" stroke="#647780" stroke-width="1.5"/><line x1="560" y1="249" x2="560" y2="263" stroke="#647780" stroke-width="1.5"/><line x1="650" y1="249" x2="650" y2="263" stroke="#647780" stroke-width="1.5"/><text x="605" y="282" font-size="15" fill="#647780" text-anchor="middle">L</text><text x="600" y="330" font-size="15" fill="#273b45" text-anchor="middle">effective length = L − 2s</text><text x="360" y="395" font-size="15" fill="#273b45" text-anchor="middle">Design strength = fu / (√3 γmw) × throat × effective length</text></g></svg>