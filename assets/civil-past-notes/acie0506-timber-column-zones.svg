"18" fill="#273b45" text-anchor="middle"><tspan>K</tspan><tspan dy="5" font-size="13">8</tspan><tspan dy="-5"> = 0.702√(E/f</tspan><tspan dy="5" font-size="13">cp</tspan><tspan dy="-5">),  S/d ≤ 50</tspan></text></g></svg>