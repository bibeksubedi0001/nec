<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Short, intermediate and long timber columns</title><desc id="desc">A solid timber column with S/d up to 11 is short and takes the full stress fcp. Between 11 and K8 it is intermediate and the stress falls by a fourth-power term to 2/3 fcp. Beyond K8, up to the limit of 50, it is long and follows the Euler-type 0.329E/(S/d) squared.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><rect x="90" y="104" width="116.6" height="216" fill="#deeee6" stroke="none" stroke-width="2"/><text x="148.3" y="96" font-size="15" fill="#647780" text-anchor="middle">short</text><rect x="206.6" y="104" width="95.4" height="216" fill="#f5ead8" stroke="none" stroke-width="2"/><text x="254.3" y="96" font-size="15" fill="#647780" text-anchor="middle">intermediate</text><rect x="302" y="104" width="318" height="216" fill="#f2dfdf" stroke="none" stroke-width="2"/><text x="461" y="96" font-size="15" fill="#647780" text-anchor="middle">long</text><line x1="90" y1="320" x2="632.4" y2="320" stroke="#273b45" stroke-width="1.8"/><polygon points="641.2,320 630.2,324.5 630.2,315.5" fill="#273b45" stroke="#273b45" stroke-width="1.5" stroke-linejoin="round"/><line x1="90" y1="320" x2="90" y2="88.8" stroke="#273b45" stroke-width="1.8"/><polygon points="90,80 94.5,91 85.5,91" fill="#273b45" stroke="#273b45" stroke-width="1.5" stroke-linejoin="round"/><path d="M90 120 L92.65 120 L95.3 120 L97.95 120 L100.6 120 L103.25 120 L105.9 120 L108.55 120 L111.2 120 L113.85 120 L116.5 120 L119.15 120 L121.8 120 L124.45 120 L127.1 120 L129.75 120 L132.4 120 L135.05 120 L137.7 120 L140.35 120 L143 120 L145.65 120 L148.3 120 L150.95 120 L153.6 120 L156.25 120 L158.9 120 L161.55 120 L164.2 120 L166.85 120 L169.5 120 L172.15 120 L174.8 120 L177.45 120 L180.1 120 L182.75 120 L185.4 120 L188.05 120 L190.7 120 L