<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Anchorage value of bends and hooks</title><desc id="desc">A bend or hook counts towards the development length. Each 45 degree bend is worth 4φ, a right-angle bend 8φ, and a standard U-hook 16φ, which is also the upper limit for any bend.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="40" y1="220" x2="170" y2="220" stroke="#466d89" stroke-width="9"/><line x1="170" y1="220" x2="205.36" y2="184.64" stroke="#466d89" stroke-width="9"/><text x="120" y="290" font-size="16" fill="#647780" text-anchor="middle"><tspan>45° bend</tspan></text><text x="120" y="330" font-size="26" fill="#287aab" text-anchor="middle"><tspan>4φ</tspan></text><line x1="270" y1="220" x2="400" y2="220" stroke="#466d89" stroke-width="9"/><line x1="400" y1="220" x2="400" y2="150" stroke="#466d89" stroke-width="9"/><text x="350" y="290" font-size="16" fill="#647780" text-anchor="middle"><tspan>90° bend</tspan></text><text x="350" y="330" font-size="26" fill="#287aab" text-anchor="middle"><tspan>8φ</tspan></text><line x1="480" y1="220" x2="610" y2="220" stroke="#466d89" stroke-width="9"/><path d="M610 220 A30 30 0 0 0 610 160" stroke="#466d89" stroke-width="9" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="610" y1="160" x2="570" y2="160" stroke="#466d89" stroke-width="9"/><text x="575" y="290" font-size="16" fill="#647780" text-anchor="middle"><tspan>U-hook</tspan></text><text x="575" y="330" font-size="26" fill="#287aab" text-anchor="middle"><tspan>16φ</tspan></text><text x="360" y="110" font-size="17" fill="#273b45" text-anchor="middle">4φ for each 45° of bend, up to 16φ</text><text x="360" y="396" font-size="16" fill="#647780" text-anchor="middle"><tspan>L</tspan><tspan dy="4" font-size="12">d</tspan><tspan dy="-4"> = φσ</tspan><tspan dy="4" font-size="12">s</tspan><tspan dy="-4">/4τ</tspan><tspan dy="4" font-size="12">bd</tspan><tspan dy="-4">: bends reduce the straight length needed</tspan></text></g></svg>