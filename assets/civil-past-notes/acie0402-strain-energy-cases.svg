<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Strain energy in a bar, a shaft and a cantilever</title><desc id="desc">Strain energy is half the load times its own displacement. For an axial bar it is P squared L/2AE, for a shaft T squared L/2GJ, and in bending the integral of M squared over 2EI along the member, which gives W squared L cubed/6EI for a cantilever with a tip load.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><rect x="40" y="132" width="170" height="30" fill="#e6f1f8" stroke="#273b45" stroke-width="2"/><line x1="40" y1="147" x2="20.8" y2="147" stroke="#b64f4f" stroke-width="3"/><polygon points="12,147 23,142.5 23,151.5" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><line x1="210" y1="147" x2="229.2" y2="147" stroke="#b64f4f" stroke-width="3"/><polygon points="238,147 227,151.5 227,142.5" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="22" y="132" font-size="17" fill="#b64f4f" text-anchor="middle"><tspan>P</tspan></text><text x="228" y="132" font-size="17" fill="#b64f4f" text-anchor="middle"><tspan>P</tspan></text><text x="125" y="250" font-size="20" fill="#273b45" text-anchor="middle"><tspan>U = P²L/2AE</tspan></text><text x="125" y="290" font-size="15" fill="#647780" text-anchor="middle">axial bar</text><rect x="290" y="128" width="150" height="38" rx="6" fill="#deeee6" stroke="#273b45" stroke-width="2"/><ellipse cx="290" cy="147" rx="8" ry="19" fill="#deeee6" stroke="#273b45" stroke-width="2"/><path d="M267.48 160 A26 26 0 1 1 312.52 160" stroke="#b64f4f" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="312.52,160 314.12,148.22 321.91,152.72" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><path d="M462.52 160 A26 26 0 1 0 417.48 160" stroke="#b64f4f" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="417.48,160 408.09,152.72 415.88,148.22" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="290" y="104" font-size="17" fill="#b64f4f" text-anchor="middle"><tspan>T</tspan></text><text x="440" y="104" font-size="17" fill="#b64f4f" text-anchor="middle"><tspan>T</tspan></text><text x="365" y="250" font-size="20" fill="#273b45" text-anchor="middle"><tspan>U = T²L/2GJ</tspan></text><text x="365" y="290" font-size="15" fill="#647780" text-anchor="middle">shaft in torsion</text><line x1="480" y1="120" x2="480" y2="176" stroke="#273b45" stroke-width="3"/><line x1="480" y1="124" x2="469" y2="134" stroke="#647780" stroke-width="1.4"/><line x1="480" y1="136" x2="469" y2="146" stroke="#647780" stroke-width="1.4"/><line x1="480" y1="148" x2="469" y2="158" stroke="#647780" stroke-width="1.4"/><line x1="480" y1="160" x2="469" y2="170" stroke="#647780" stroke-width="1.4"/><line x1="480" y1="172" x2="469" y2="182" stroke="#647780" stroke-width="1.4"/><line x1="480" y1="148" x2="610" y2="148" stroke="#273b45" stroke-width="6"/><line x1="610" y1="108" x2="610" y2="139.2" stroke="#b64f4f" stroke-width="3.5"/><polygon points="610,148 605.5,137 614.5,137" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="610" y="98" font-size="17" fill="#b64f4f" text-anchor="middle">W</text><line x1="480" y1="196" x2="610" y2="196" stroke="#273b45" stroke-width="1.5"/><polygon points="480,196 480,236 610,196" fill="#f2dfdf" stroke="#b64f4f" stroke-width="2" stroke-linejoin="round"/><text x="486" y="256" font-size="14" fill="#b64f4f" text-anchor="start"><tspan>M = Wx</tspan></text><text x="560" y="290" font-size="18" fill="#273b45" text-anchor="middle"><tspan>U = ∫M²dx/2EI</tspan></text><text x="560" y="318" font-size="18" fill="#273b45" text-anchor="middle"><tspan>= W²L³/6EI</tspan></text><text x="560" y="344" font-size="15" fill="#647780" text-anchor="middle">cantilever, tip load</text><text x="360" y="396" font-size="17" fill="#287aab" text-anchor="middle"><tspan>Central load on a simple beam: U = ½Wδ = W²L³/96EI</tspan></text></g></svg>