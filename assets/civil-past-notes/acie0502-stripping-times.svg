<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Stripping times with ordinary Portland cement</title><desc id="desc">Vertical faces can be struck within a day, soffits after 3 or 7 days if the props are refixed at once, and the props themselves stay 7 to 21 days depending on the member and its span.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><text x="20" y="66" font-size="14" fill="#273b45" text-anchor="start">Vertical faces of columns, walls, beams</text><rect x="340" y="48" width="14.5" height="24" fill="#deeee6" stroke="#2b7b61" stroke-width="1.5"/><text x="362.5" y="66" font-size="14" fill="#273b45" text-anchor="start">16 to 24 h</text><text x="20" y="106" font-size="14" fill="#273b45" text-anchor="start">Slab soffits, props refixed</text><rect x="340" y="88" width="43.5" height="24" fill="#e6f1f8" stroke="#287aab" stroke-width="1.5"/><text x="391.5" y="106" font-size="14" fill="#273b45" text-anchor="start">3 days</text><text x="20" y="146" font-size="14" fill="#273b45" text-anchor="start">Beam soffits, props refixed</text><rect x="340" y="128" width="101.5" height="24" fill="#e6f1f8" stroke="#287aab" stroke-width="1.5"/><text x="449.5" y="146" font-size="14" fill="#273b45" text-anchor="start">7 days</text><text x="20" y="186" font-size="14" fill="#273b45" text-anchor="start">Props to slabs up to 4.5 m</text><rect x="340" y="168" width="101.5" height="24" fill="#f5ead8" stroke="#b98232" stroke-width="1.5"/><text x="449.5" y="186" font-size="14" fill="#273b45" text-anchor="start">7 days</text><text x="20" y="226" font-size="14" fill="#273b45" text-anchor="start">Props to slabs over 4.5 m</text><rect x="340" y="208" width="203" height="24" fill="#f5ead8" stroke="#b98232" stroke-width="1.5"/><text x="551" y="226" font-size="14" fill="#273b45" text-anchor="start">14 days</text><text x="20" y="266" font-size="14" fill="#273b45" text-anchor="start">Props to beams and arches up to 6 m</text><rect x="340" y="248" width="203" height="24" fill="#f5ead8" stroke="#b98232" stroke-width="1.5"/><text x="551" y="266" font-size="14" fill="#273b45" text-anchor="start">14 days</text><text x="20" y="306" font-size="14" fill="#273b45" text-anchor="start">Props to beams and arches over 6 m</text><rect x="340" y="288" width="304.5" height="24" fill="#f5ead8" stroke="#b98232" stroke-width="1.5"/><text x="652.5" y="306" font-size="14" fill="#273b45" text-anchor="start">21 days</text><line x1="340" y1="334" x2="644.5" y2="334" stroke="#647780" stroke-width="1.5"/><line x1="340" y1="334" x2="340" y2="340" stroke="#647780" stroke-width="1.5"/><text x="340" y="358" font-size="14" fill="#647780" text-anchor="middle">0</text><line x1="441.5" y1="334" x2="441.5" y2="340" stroke="#647780" stroke-width="1.5"/><text x="441.5" y="358" font-size="14" fill="#647780" text-anchor="middle">7</text><line x1="543" y1="334" x2="543" y2="340" stroke="#647780" stroke-width="1.5"/><text x="543" y="358" font-size="14" fill="#647780" text-anchor="middle">14</text><line x1="644.5" y1="334" x2="644.5" y2="340" stroke="#647780" stroke-width="1.5"/><text x="644.5" y="358" font-size="14" fill="#647780" text-anchor="middle">21</text><text x="492.25" y="384" font-size="15" fill="#273b45" text-anchor="middle">days after casting</text><text x="20" y="408" font-size="14" fill="#647780" text-anchor="start">Other cements and cold weather need longer</text></g></svg>