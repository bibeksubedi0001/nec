<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Compacting factor test</title><desc id="desc">Concrete drops from the upper hopper to the lower hopper and then into the cylinder, compacting under its own weight. Its mass Wp is compared with the mass Wf of the same cylinder fully compacted: CF = Wp/Wf, closer to 1 for a more workable mix.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><polygon points="135,56 265,56 230,136 170,136" fill="#f5ead8" stroke="#273b45" stroke-width="2.5" stroke-linejoin="round"/><line x1="170" y1="136" x2="230" y2="136" stroke="#b64f4f" stroke-width="3" stroke-dasharray="5 3"/><polygon points="145,170 255,170 225,240 175,240" fill="#f5ead8" stroke="#273b45" stroke-width="2.5" stroke-linejoin="round"/><line x1="175" y1="240" x2="225" y2="240" stroke="#b64f4f" stroke-width="3" stroke-dasharray="5 3"/><rect x="162" y="276" width="76" height="84" fill="#d6dfe3" stroke="#273b45" stroke-width="2.5"/><rect x="165" y="286" width="70" height="71" fill="#f5ead8" stroke="none" stroke-width="2"/><line x1="200" y1="136" x2="200" y2="145.2" stroke="#b64f4f" stroke-width="2"/><polygon points="200,154 195.5,143 204.5,143" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><line x1="200" y1="240" x2="200" y2="257.2" stroke="#b64f4f" stroke-width="2"/><polygon points="200,266 195.5,255 204.5,255" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><line x1="262" y1="96" x2="330" y2="96" stroke="#647780" stroke-width="1"/><text x="336" y="101" font-size="15" fill="#273b45" text-anchor="start">upper hopper, filled loosely</text><line x1="252" y1="136" x2="330" y2="140" stroke="#647780" stroke-width="1"/><text x="336" y="145" font-size="15" fill="#b64f4f" text-anchor="start">trap door opened</text><line x1="252" y1="205" x2="330" y2="205" stroke="#647780" stroke-width="1"/><text x="336" y="210" font-size="15" fill="#273b45" text-anchor="start">lower hopper</text><line x1="238" y1="318" x2="330" y2="318" stroke="#647780" stroke-width="1"/><text x="336" y="323" font-size="15" fill="#273b45" text-anchor="start"><tspan>cylinder: weigh W</tspan><tspan dy="4" font-size="11">p</tspan></text><text x="560" y="264" font-size="24" fill="#273b45" text-anchor="middle"><tspan>CF = W</tspan><tspan dy="7" font-size="17">p</tspan><tspan dy="-7">/W</tspan><tspan dy="7" font-size="17">f</tspan></text><text x="560" y="296" font-size="14" fill="#647780" text-anchor="middle"><tspan>W</tspan><tspan dy="4" font-size="10">f</tspan><tspan dy="-4">: same cylinder fully compacted</tspan></text><text x="360" y="400" font-size="15" fill="#647780" text-anchor="middle">Closer to 1 means more workable; suits low-slump mixes</text></g></svg>