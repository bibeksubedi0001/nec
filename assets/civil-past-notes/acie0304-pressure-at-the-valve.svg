<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Pressure at a valve after sudden closure</title><desc id="desc">Closing faster than 2L/C raises the head by CV/g; the wave runs to the reservoir and back, so the pressure at the valve swings between high and low every 2L/C, a full cycle taking 4L/C, until friction damps it.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="110" y1="330" x2="646" y2="330" stroke="#647780" stroke-width="2"/><polygon points="654,330 644,334 644,326" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><line x1="110" y1="330" x2="110" y2="64" stroke="#647780" stroke-width="2"/><polygon points="110,56 114,66 106,66" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><text x="375" y="374" font-size="17" fill="#273b45" text-anchor="middle">Time after closure</text><text x="116" y="50" font-size="17" fill="#273b45" text-anchor="start">Pressure head at the valve</text><line x1="110" y1="100" x2="640" y2="100" stroke="#b8c8ce" stroke-width="1" stroke-dasharray="4 4"/><line x1="110" y1="300" x2="640" y2="300" stroke="#b8c8ce" stroke-width="1" stroke-dasharray="4 4"/><line x1="110" y1="200" x2="640" y2="200" stroke="#647780" stroke-width="1.5" stroke-dasharray="7 5"/><path d="M110 200 L110 100 L227.78 100 L227.78 285 L345.56 285 L345.56 128 L463.33 128 L463.33 261 L581.11 261 L581.11 148 L640 148" stroke="#287aab" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="102" y="105" font-size="15" fill="#b64f4f" text-anchor="end">h0 + CV/g</text><text x="102" y="205" font-size="15" fill="#273b45" text-anchor="end">h0</text><text x="102" y="305" font-size="15" fill="#b64f4f" text-anchor="end">h0 − CV/g</text><text x="110" y="352" font-size="14" fill="#647780" text-anchor="middle">0</text><text x="227.78" y="352" font-size="14" fill="#647780" text-anchor="middle">2L/C</text><text x="345.56" y="352" font-size="14" fill="#647780" text-anchor="middle">4L/C</text><text x="463.33" y="352" font-size="14" fill="#647780" text-anchor="middle">6L/C</text><text x="581.11" y="352" font-size="14" fill="#647780" text-anchor="middle">8L/C</text><text x="375" y="404" font-size="15" fill="#273b45" text-anchor="middle">A closure slower than 2L/C is gradual and gives a smaller rise</text></g></svg>