<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Pressure of fresh concrete on a column form</title><desc id="desc">Concrete poured quickly acts like a fluid of about 25 kN/m³, so its pressure on the form grows linearly with depth; a slower pour lets the lower concrete stiffen and caps the peak.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><rect x="210" y="60" width="100" height="300" fill="#e4e8e9" stroke="none" stroke-width="2"/><rect x="200" y="50" width="10" height="320" fill="#f5ead8" stroke="#b98232" stroke-width="2"/><rect x="310" y="50" width="10" height="320" fill="#f5ead8" stroke="#b98232" stroke-width="2"/><line x1="185" y1="110" x2="335" y2="110" stroke="#273b45" stroke-width="2"/><line x1="185" y1="190" x2="335" y2="190" stroke="#273b45" stroke-width="2"/><line x1="185" y1="270" x2="335" y2="270" stroke="#273b45" stroke-width="2"/><line x1="185" y1="340" x2="335" y2="340" stroke="#273b45" stroke-width="2"/><line x1="140" y1="370" x2="380" y2="370" stroke="#647780" stroke-width="2"/><line x1="146" y1="371" x2="136" y2="382" stroke="#647780" stroke-width="1.4"/><line x1="160" y1="371" x2="150" y2="382" stroke="#647780" stroke-width="1.4"/><line x1="174" y1="371" x2="164" y2="382" stroke="#647780" stroke-width="1.4"/><line x1="188" y1="371" x2="178" y2="382" stroke="#647780" stroke-width="1.4"/><line x1="202" y1="371" x2="192" y2="382" stroke="#647780" stroke-width="1.4"/><line x1="216" y1="371" x2="206" y2="382" stroke="#647780" stroke-width="1.4"/><line x1="230" y1="371" x2="220" y2="382" stroke="#647780" stroke-width="1.4"/><line x1="244" y1="371" x2="234" y2="382" stroke="#647780" stroke-width="1.4"/><line x1="258" y1="371" x2="248" y2="382" stroke="#647780" stroke-width="1.4"/><line x1="272" y1="371" x2="262" y2="382" stroke="#647780" stroke-width="1.4"/><line x1="286" y1="371" x2="276" y2="382" stroke="#647780" stroke-width="1.4"/><line x1="300" y1="371" x2="290" y2="382" stroke="#647780" stroke-width="1.4"/><line x1="314" y1="371" x2="304" y2="382" stroke="#647780" stroke-width="1.4"/><line x1="328" y1="371" x2="318" y2="382" stroke="#647780" stroke-width="1.4"/><line x1="342" y1="371" x2="332" y2="382" stroke="#647780" stroke-width="1.4"/><line x1="356" y1="371" x2="346" y2="382" stroke="#647780" stroke-width="1.4"/><line x1="370" y1="371" x2="360" y2="382" stroke="#647780" stroke-width="1.4"/><line x1="160" y1="60" x2="160" y2="360" stroke="#647780" stroke-width="1.5"/><line x1="167" y1="60" x2="153" y2="60" stroke="#647780" stroke-width="1.5"/><line x1="167" y1="360" x2="153" y2="360" stroke="#647780" stroke-width="1.5"/><text x="150" y="216" font-size="18" fill="#647780" text-anchor="end">h</text><polygon points="340,60 340,360 490,360" fill="#f2dfdf" stroke="#b64f4f" stroke-width="2" stroke-linejoin="round"/><line x1="370" y1="120" x2="350.4" y2="120" stroke="#b64f4f" stroke-width="1.6"/><polygon points="344,120 352,116.5 352,123.5" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><line x1="400" y1="180" x2="350.4" y2="180" stroke="#b64f4f" stroke-width="1.6"/><polygon points="344,180 352,176.5 352,183.5" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><line x1="430" y1="240" x2="350.4" y2="240" stroke="#b64f4f" stroke-width="1.6"/><polygon points="344,240 352,236.5 352,243.5" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><line x1="460" y1="300" x2="350.4" y2="300" stroke="#b64f4f" stroke-width="1.6"/><polygon points="344,300 352,296.5 352,303.5" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><path d="M340 60 L420 140 L420 360" stroke="#287aab" stroke-width="2.5" fill="none" stroke-dasharray="8 6" stroke-linejoin="round" stroke-linecap="round"/><text x="498" y="365" font-size="15" fill="#b64f4f" text-anchor="start">25h kN/m²</text><text x="452" y="246" font-size="15" fill="#b64f4f" text-anchor="start">fluid pressure, 25 kN/m³ × h</text><text x="428" y="150" font-size="15" fill="#287aab" text-anchor="start">slow pour: capped</text><text x="255" y="40" font-size="15" fill="#647780" text-anchor="middle">column form</text><text x="560" y="400" font-size="15" fill="#273b45" text-anchor="middle">Tall forms need ties sized for the peak</text></g></svg>