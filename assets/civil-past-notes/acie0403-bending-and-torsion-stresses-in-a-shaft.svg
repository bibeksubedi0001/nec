<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Bending and torsional stresses across a solid shaft</title><desc id="desc">Across a shaft of diameter d, the bending stress grows linearly to 32M/πd cubed at the top and bottom fibres, and the torsional shear grows linearly from zero at the axis to 16T/πd cubed at the surface, so their peak ratio is 2M/T.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><circle cx="200" cy="200" r="90" fill="#d6dfe3" stroke="#273b45" stroke-width="2"/><line x1="90" y1="200" x2="310" y2="200" stroke="#647780" stroke-width="1.2" stroke-dasharray="6 4"/><polygon points="330,200 330,110 400,110" fill="#e6f1f8" stroke="#287aab" stroke-width="2" stroke-linejoin="round"/><polygon points="330,200 330,290 400,290" fill="#f2dfdf" stroke="#b64f4f" stroke-width="2" stroke-linejoin="round"/><text x="404" y="114" font-size="16" fill="#287aab" text-anchor="start"><tspan>32M/πd³</tspan></text><text x="330" y="330" font-size="15" fill="#647780" text-anchor="middle">bending stress</text><line x1="200" y1="200" x2="200" y2="112" stroke="#2b7b61" stroke-width="1.5"/><line x1="200" y1="170" x2="220.6" y2="170" stroke="#2b7b61" stroke-width="2"/><polygon points="227,170 219,173.5 219,166.5" fill="#2b7b61" stroke="#2b7b61" stroke-width="1.5" stroke-linejoin="round"/><line x1="200" y1="145" x2="243.1" y2="145" stroke="#2b7b61" stroke-width="2"/><polygon points="249.5,145 241.5,148.5 241.5,141.5" fill="#2b7b61" stroke="#2b7b61" stroke-width="1.5" stroke-linejoin="round"/><line x1="200" y1="120" x2="265.6" y2="120" stroke="#2b7b61" stroke-width="2"/><polygon points="272,120 264,123.5 264,116.5" fill="#2b7b61" stroke="#2b7b61" stroke-width="1.5" stroke-linejoin="round"/><text x="200" y="316" font-size="15" fill="#2b7b61" text-anchor="middle">shear grows with radius</text><polygon points="520,200 590,110 520,110" fill="#deeee6" stroke="#2b7b61" stroke-width="2" stroke-linejoin="round"/><polygon points="520,200 590,290 520,290" fill="#deeee6" stroke="#2b7b61" stroke-width="2" stroke-linejoin="round"/><text x="594" y="114" font-size="16" fill="#2b7b61" text-anchor="start"><tspan>16T/πd³</tspan></text><text x="540" y="330" font-size="15" fill="#647780" text-anchor="middle">torsional shear</text><text x="360" y="392" font-size="19" fill="#273b45" text-anchor="middle"><tspan>σ</tspan><tspan dy="5" font-size="14">b</tspan><tspan dy="-5">/τ = (32M/πd³)/(16T/πd³) = 2M/T</tspan></text></g></svg>