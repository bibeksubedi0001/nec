<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Contour spacing and slope</title><desc id="desc">Closely spaced contours indicate a steeper surface for the same vertical interval; contours are elevation lines.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="Verdana, sans-serif" letter-spacing="0"><ellipse cx="330" cy="225" rx="235" ry="143" fill="none" stroke="#647780" stroke-width="2"/><ellipse cx="342" cy="216" rx="200" ry="123" fill="none" stroke="#2b7b61" stroke-width="2"/><ellipse cx="354" cy="207" rx="165" ry="103" fill="none" stroke="#647780" stroke-width="2"/><ellipse cx="366" cy="198" rx="130" ry="83" fill="none" stroke="#2b7b61" stroke-width="2"/><ellipse cx="378" cy="189" rx="95" ry="63" fill="none" stroke="#647780" stroke-width="2"/><ellipse cx="390" cy="180" rx="60" ry="43" fill="none" stroke="#2b7b61" stroke-width="2"/><text x="60" y="58" font-size="23" fill="#273b45" text-anchor="start">Elevation contours</text><text x="509" y="128" font-size="21" fill="#273b45" text-anchor="start">Steeper</text><text x="111" y="352" font-size="21" fill="#273b45" text-anchor="start">Gentler</text></g></svg>
