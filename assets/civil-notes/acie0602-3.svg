<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Atmospheric pressure break</title><desc id="desc">An open tank resets the downstream supply head to its water-surface elevation; it is not complete transient protection.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="Verdana, sans-serif" letter-spacing="0"><rect x="60" y="80" width="140" height="170" fill="#d8edf7" stroke="#287aab" stroke-width="2"/><path d="M200 214 H335 V264 H436 L621 344" stroke="#287aab" stroke-width="8" fill="none" stroke-linejoin="round" stroke-linecap="round"/><rect x="335" y="144" width="102" height="122" fill="#ffffff" stroke="#287aab" stroke-width="2"/><rect x="336" y="180" width="100" height="85" fill="#d8edf7" stroke="#287aab" stroke-width="2"/><line x1="336" y1="180" x2="436" y2="180" stroke="#287aab" stroke-width="3"/><line x1="201" y1="80" x2="335" y2="80" stroke="#b64f4f" stroke-width="2" stroke-dasharray="6 5"/><line x1="437" y1="180" x2="640" y2="180" stroke="#2b7b61" stroke-width="2" stroke-dasharray="6 5"/><text x="278" y="113" font-size="24" fill="#273b45" text-anchor="start">Open tank</text><text x="456" y="135" font-size="21" fill="#2b7b61" text-anchor="start">Downstream head</text><line x1="664" y1="180" x2="664" y2="344" stroke="#647780" stroke-width="1.5"/><line x1="657" y1="180" x2="671" y2="180" stroke="#647780" stroke-width="1.5"/><line x1="657" y1="344" x2="671" y2="344" stroke="#647780" stroke-width="1.5"/><text x="594" y="267" font-size="19" fill="#647780" text-anchor="middle">Static head</text><text x="60" y="40" font-size="23" fill="#273b45" text-anchor="start">Higher source</text></g></svg>
