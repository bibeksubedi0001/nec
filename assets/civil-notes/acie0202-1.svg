<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Total and effective stress</title><desc id="desc">In a saturated layer, total vertical stress is partitioned into pore-water pressure and effective stress.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="Verdana, sans-serif" letter-spacing="0"><line x1="100" y1="90" x2="100" y2="334" stroke="#647780" stroke-width="2"/><line x1="100" y1="334" x2="253" y2="334" stroke="#647780" stroke-width="2"/><polygon points="100,90 240,334 100,334" fill="#d6dfe3" stroke="#647780" stroke-width="2" stroke-linejoin="round"/><text x="155" y="60" font-size="19" fill="#273b45" text-anchor="middle">Total stress</text><line x1="316" y1="90" x2="316" y2="334" stroke="#647780" stroke-width="2"/><line x1="316" y1="334" x2="469" y2="334" stroke="#647780" stroke-width="2"/><polygon points="316,90 376,334 316,334" fill="#d8edf7" stroke="#647780" stroke-width="2" stroke-linejoin="round"/><text x="371" y="60" font-size="19" fill="#273b45" text-anchor="middle">Pore pressure</text><line x1="532" y1="90" x2="532" y2="334" stroke="#647780" stroke-width="2"/><line x1="532" y1="334" x2="685" y2="334" stroke="#647780" stroke-width="2"/><polygon points="532,90 612,334 532,334" fill="#deeee6" stroke="#647780" stroke-width="2" stroke-linejoin="round"/><text x="587" y="60" font-size="19" fill="#273b45" text-anchor="middle">Effective stress</text><text x="200" y="386" font-size="21" fill="#273b45" text-anchor="start">Total = pore pressure + effective stress</text></g></svg>
