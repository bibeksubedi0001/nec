<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Sign shapes convey purpose</title><desc id="desc">Illustrative regulatory, warning and information families show shape distinctions without replacing the Nepal sign manual.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="Verdana, sans-serif" letter-spacing="0"><circle cx="140" cy="198" r="66" fill="#ffffff" stroke="#b64f4f" stroke-width="10"/><text x="140" y="218" font-size="40" fill="#273b45" text-anchor="middle">40</text><polygon points="363,110 439,258 287,258" fill="#ffffff" stroke="#b64f4f" stroke-width="2" stroke-linejoin="round"/><line x1="363" y1="159" x2="363" y2="208" stroke="#273b45" stroke-width="10"/><circle cx="363" cy="231" r="5" fill="#273b45" stroke="#273b45" stroke-width="2"/><rect x="528" y="139" width="126" height="126" fill="#287aab" stroke="#287aab" stroke-width="2"/><text x="591" y="232" font-size="70" fill="#ffffff" text-anchor="middle">P</text><text x="139" y="333" font-size="21" fill="#273b45" text-anchor="middle">Regulatory</text><text x="364" y="333" font-size="21" fill="#273b45" text-anchor="middle">Warning</text><text x="591" y="333" font-size="21" fill="#273b45" text-anchor="middle">Information</text></g></svg>
