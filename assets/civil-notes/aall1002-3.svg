<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Incremental alternative comparison</title><desc id="desc">Compare the added benefits and added cost of the larger option; the highest individual ratio need not maximize net benefit.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="Verdana, sans-serif" letter-spacing="0"><rect x="90" y="254" width="65" height="65" fill="#f2dfdf" stroke="#b64f4f" stroke-width="2"/><rect x="160" y="221.5" width="65" height="97.5" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><text x="155" y="365" font-size="21" fill="#273b45" text-anchor="middle">Option A</text><text x="123" y="242" font-size="18" fill="#b64f4f" text-anchor="middle">100</text><text x="193" y="209.5" font-size="18" fill="#2b7b61" text-anchor="middle">150</text><rect x="307" y="189" width="65" height="130" fill="#f2dfdf" stroke="#b64f4f" stroke-width="2"/><rect x="377" y="137" width="65" height="182" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><text x="372" y="365" font-size="21" fill="#273b45" text-anchor="middle">Option B</text><text x="340" y="177" font-size="18" fill="#b64f4f" text-anchor="middle">200</text><text x="410" y="125" font-size="18" fill="#2b7b61" text-anchor="middle">280</text><rect x="524" y="254" width="65" height="65" fill="#f2dfdf" stroke="#b64f4f" stroke-width="2"/><rect x="594" y="234.5" width="65" height="84.5" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><text x="589" y="365" font-size="21" fill="#273b45" text-anchor="middle">B minus A</text><text x="557" y="242" font-size="18" fill="#b64f4f" text-anchor="middle">100</text><text x="627" y="222.5" font-size="18" fill="#2b7b61" text-anchor="middle">130</text><text x="136" y="50" font-size="23" fill="#273b45" text-anchor="start">Hypothetical cost and benefit amounts</text></g></svg>
