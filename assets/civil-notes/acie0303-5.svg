<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc">
  <title id="title">Pipe contraction: half the diameter gives four times the velocity</title>
  <desc id="desc">For steady incompressible flow without branches or leakage, a pipe diameter reducing from d to d over 2 reduces area from A to A over 4. Continuity keeps Q fixed, so mean velocity rises from v to 4v. Example 0.20 m and 2 m per second gives 0.10 m and 8 m per second.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs>
  <rect width="720" height="420" fill="#fbfcfd"/>
  <g font-family="Verdana, sans-serif" font-weight="400" letter-spacing="0" fill="#273b45">
    <text x="26" y="34" font-size="21">Continuity: diameter is not area</text>
    <path d="M66 118H308L438 163H659V253H438L308 298H66Z" fill="#d8edf7" stroke="#287aab" stroke-width="2"/>
    <path d="M100 208H246" stroke="#2b7b61" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M466 208H633" stroke="#2b7b61" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M86 121V295" stroke="#647780" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <path d="M643 166V250" stroke="#647780" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="148" y="94" font-size="18">A1 = &#960;d&#178;/4</text><text x="460" y="131" font-size="18">A2 = A1/4</text>
    <text x="38" y="216" font-size="18">d</text><text x="662" y="216" font-size="18">d/2</text>
    <text x="176" y="241" font-size="18">v</text><text x="527" y="242" font-size="18">4v</text>
    <text x="81" y="340" font-size="18">A1 v1 = A2 v2; v2/v1 = (d1/d2)&#178; = 4</text>
    <text x="28" y="382" font-size="16">Illustration: d1 = 0.20 m, v1 = 2 m/s; d2 = 0.10 m, v2 = 8 m/s.</text>
    <text x="28" y="408" font-size="14" fill="#647780">Steady incompressible flow, one unbranched pipe, no leakage.</text>
  </g>
</svg>