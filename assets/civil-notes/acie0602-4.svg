 text-anchor="start">-16</text><text x="82" y="359" font-size="16" fill="#647780" text-anchor="middle">0</text><text x="175" y="359" font-size="16" fill="#647780" text-anchor="middle">4</text><text x="268" y="359" font-size="16" fill="#647780" text-anchor="middle">8</text><text x="361" y="359" font-size="16" fill="#647780" text-anchor="middle">12</text><text x="454" y="359" font-size="16" fill="#647780" text-anchor="middle">16</text><text x="547" y="359" font-size="16" fill="#647780" text-anchor="middle">20</text><text x="640" y="359" font-size="16" fill="#647780" text-anchor="middle">24</text></g></svg>
