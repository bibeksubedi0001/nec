<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Different pavement distress patterns</title><desc id="desc">Cracking, rutting and surface loss can have different causes; the pattern guides investigation rather than proving a diagnosis.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="Verdana, sans-serif" letter-spacing="0"><rect x="50" y="117" width="200" height="204" fill="#d6dfe3" stroke="#273b45" stroke-width="2"/><path d="M70 295 L103 251 L160 237 L140 191 L195 143" stroke="#273b45" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M103 251 L79 191 M160 237 L225 269 M140 191 L98 155" stroke="#273b45" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="150" y="371" font-size="20" fill="#273b45" text-anchor="middle">Cracking</text><rect x="281" y="117" width="200" height="204" fill="#d6dfe3" stroke="#273b45" stroke-width="2"/><line x1="341" y1="136" x2="341" y2="304" stroke="#647780" stroke-width="19"/><line x1="418" y1="136" x2="418" y2="304" stroke="#647780" stroke-width="19"/><text x="381" y="371" font-size="20" fill="#273b45" text-anchor="middle">Wheel-path rutting</text><rect x="512" y="117" width="200" height="204" fill="#d6dfe3" stroke="#273b45" stroke-width="2"/><polygon points="555,177 605,150 671,192 651,263 572,277 532,230" fill="#273b45" stroke="#647780" stroke-width="2" stroke-linejoin="round"/><text x="612" y="371" font-size="20" fill="#273b45" text-anchor="middle">Surface loss</text></g></svg>
