<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Support restraints</title><desc id="desc">Roller, pin and fixed supports restrain different planar degrees of freedom; restraint count alone does not ensure stability.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="Verdana, sans-serif" letter-spacing="0"><polygon points="151,205 136,229 166,229" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><line x1="129" y1="232" x2="173" y2="232" stroke="#647780" stroke-width="2"/><circle cx="142" cy="238" r="4" fill="#ffffff" stroke="#273b45" stroke-width="2"/><circle cx="160" cy="238" r="4" fill="#ffffff" stroke="#273b45" stroke-width="2"/><line x1="127" y1="244" x2="175" y2="244" stroke="#647780" stroke-width="2"/><polygon points="360,205 345,229 375,229" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><line x1="338" y1="232" x2="382" y2="232" stroke="#647780" stroke-width="2"/><rect x="570" y="160" width="16" height="90" fill="#d6dfe3" stroke="#273b45" stroke-width="2"/><line x1="570" y1="160" x2="558" y2="170" stroke="#647780" stroke-width="1.5"/><line x1="570" y1="170" x2="558" y2="180" stroke="#647780" stroke-width="1.5"/><line x1="570" y1="180" x2="558" y2="190" stroke="#647780" stroke-width="1.5"/><line x1="570" y1="190" x2="558" y2="200" stroke="#647780" stroke-width="1.5"/><line x1="570" y1="200" x2="558" y2="210" stroke="#647780" stroke-width="1.5"/><line x1="570" y1="210" x2="558" y2="220" stroke="#647780" stroke-width="1.5"/><line x1="570" y1="220" x2="558" y2="230" stroke="#647780" stroke-width="1.5"/><line x1="570" y1="230" x2="558" y2="240" stroke="#647780" stroke-width="1.5"/><line x1="570" y1="240" x2="558" y2="250" stroke="#647780" stroke-width="1.5"/><text x="151" y="298" font-size="24" fill="#273b45" text-anchor="middle">Roller</text><text x="360" y="298" font-size="24" fill="#273b45" text-anchor="middle">Pin</text><text x="578" y="298" font-size="24" fill="#273b45" text-anchor="middle">Fixed</text><text x="151" y="60" font-size="19" fill="#647780" text-anchor="middle">One restraint</text><text x="360" y="60" font-size="19" fill="#647780" text-anchor="middle">Two restraints</text><text x="578" y="60" font-size="19" fill="#647780" text-anchor="middle">Three restraints</text></g></svg>
