<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Initial floating stability</title><desc id="desc">For a small heel, the new buoyancy line locates the metacentre; its position relative to G controls the initial restoring sense.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="Verdana, sans-serif" letter-spacing="0"><rect x="80" y="210" width="560" height="145" fill="#d8edf7" stroke="#287aab" stroke-width="2"/><g transform="rotate(10 330 190)"><rect x="220" y="126" width="220" height="153" fill="#d6dfe3" stroke="#273b45" stroke-width="2"/><line x1="330" y1="62" x2="330" y2="334" stroke="#647780" stroke-width="1.5" stroke-dasharray="5 5"/></g><circle cx="330" cy="190" r="5" fill="#2b7b61" stroke="#2b7b61" stroke-width="2"/><text x="294" y="186" font-size="19" fill="#273b45" text-anchor="start">G</text><circle cx="350" cy="260" r="5" fill="#2b7b61" stroke="#2b7b61" stroke-width="2"/><text x="368" y="281" font-size="19" fill="#273b45" text-anchor="start">B shifted</text><circle cx="350" cy="77" r="5" fill="#2b7b61" stroke="#2b7b61" stroke-width="2"/><text x="368" y="77" font-size="19" fill="#273b45" text-anchor="start">M</text><line x1="350" y1="260" x2="350" y2="60" stroke="#2b7b61" stroke-width="3"/><polygon points="350,60 354.0776045305957,69.13088940312308 345.9223954694043,69.13088940312308" fill="#2b7b61" stroke="#2b7b61" stroke-width="2" stroke-linejoin="round"/><line x1="330" y1="190" x2="330" y2="332" stroke="#b64f4f" stroke-width="3"/><polygon points="330,332 325.9223954694043,322.8691105968769 334.0776045305957,322.8691105968769" fill="#b64f4f" stroke="#b64f4f" stroke-width="2" stroke-linejoin="round"/><text x="439" y="120" font-size="22" fill="#273b45" text-anchor="start">Small heel</text><text x="452" y="163" font-size="22" fill="#2b7b61" text-anchor="start">M above G</text></g></svg>
