<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Root-zone water storage</title><desc id="desc">Field capacity and permanent wilting point bound an elementary available-water store; allowable depletion is crop- and condition-dependent.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="Verdana, sans-serif" letter-spacing="0"><rect x="266" y="64" width="190" height="294" fill="#f0e6d4" stroke="#b8c8ce" stroke-width="2"/><rect x="267" y="145" width="188" height="135" fill="#d8edf7" stroke="#d8edf7" stroke-width="2"/><line x1="248" y1="78" x2="477" y2="78" stroke="#2b7b61" stroke-width="2"/><text x="490" y="85" font-size="19" fill="#273b45" text-anchor="start">Saturation</text><line x1="248" y1="145" x2="477" y2="145" stroke="#2b7b61" stroke-width="2"/><text x="490" y="152" font-size="19" fill="#273b45" text-anchor="start">Field capacity</text><line x1="248" y1="280" x2="477" y2="280" stroke="#2b7b61" stroke-width="2"/><text x="490" y="287" font-size="19" fill="#273b45" text-anchor="start">Wilting point</text><line x1="208" y1="145" x2="208" y2="280" stroke="#287aab" stroke-width="3"/><text x="84" y="203" font-size="21" fill="#287aab" text-anchor="start">Available</text><text x="84" y="229" font-size="21" fill="#287aab" text-anchor="start">water</text><text x="318" y="394" font-size="21" fill="#273b45" text-anchor="start">Storage concept</text></g></svg>
