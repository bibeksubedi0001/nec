<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc">
  <title id="title">Steel plate: gross and net area at one bolt hole</title>
  <desc id="desc">A steel plate 400 mm wide and 10 mm thick has one 18 mm hole across its straight rupture section. Gross area is 4000 square mm and net geometric area is 3820 square mm, or 38.2 square cm. The circle at right is an enlarged hole detail.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs>
  <rect width="720" height="420" fill="#fbfcfd"/>
  <g font-family="Verdana, sans-serif" font-weight="400" letter-spacing="0" fill="#273b45">
    <text x="26" y="33" font-size="21">Straight net section: subtract the hole once</text>
    <rect x="81" y="110" width="350" height="200" fill="#d8edf7" stroke="#273b45" stroke-width="2"/>
    <path d="M256 89V333" stroke="#a84940" stroke-width="2" stroke-dasharray="5 5"/>
    <circle cx="256" cy="210" r="4.5" fill="white" stroke="#273b45" stroke-width="1.5"/>
    <path d="M100 210H37" stroke="#287aab" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M411 210H470" stroke="#287aab" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="41" y="190" font-size="17">T</text><text x="453" y="190" font-size="17">T</text>
    <path d="M64 110V310" stroke="#647780" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="100" y="95" font-size="17">Width b = 400 mm</text><text x="116" y="340" font-size="17">Plate thickness t = 10 mm</text>
    <circle cx="595" cy="159" r="32" fill="white" stroke="#273b45" stroke-width="2"/>
    <path d="M563 159H627" stroke="#a84940" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="515" y="104" font-size="16">Enlarged hole</text><text x="517" y="220" font-size="17">d(h) = 18 mm</text>
    <text x="478" y="278" font-size="17">Use hole diameter,</text><text x="478" y="304" font-size="17">not bolt diameter.</text>
    <path d="M28 359H692" stroke="#d6dfe3"/>
    <text x="28" y="386" font-size="18">An = (400 - 18)10 = 3820 mm&#178; = 38.2 cm&#178;</text>
    <text x="28" y="411" font-size="14" fill="#647780">Geometric net area; code-specific design deductions are a separate check.</text>
  </g>
</svg>