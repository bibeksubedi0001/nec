<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">SPT penetration increments</title><desc id="desc">The seating increment is excluded from N; the following two increments contribute their recorded blow counts.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="Verdana, sans-serif" letter-spacing="0"><rect x="160" y="65" width="430" height="290" fill="#f0e6d4" stroke="#b8c8ce" stroke-width="2"/><rect x="286" y="58" width="70" height="287" fill="#ffffff" stroke="#273b45" stroke-width="2"/><line x1="322" y1="22" x2="322" y2="62" stroke="#273b45" stroke-width="9"/><rect x="290" y="80" width="62" height="82" fill="#d6dfe3" stroke="#647780" stroke-width="2"/><text x="396" y="112" font-size="22" fill="#273b45" text-anchor="start">Seating</text><text x="397" y="140" font-size="18" fill="#647780" text-anchor="start">First 150 mm</text><rect x="290" y="170" width="62" height="82" fill="#d8edf7" stroke="#647780" stroke-width="2"/><text x="396" y="202" font-size="22" fill="#273b45" text-anchor="start">N1</text><text x="397" y="230" font-size="18" fill="#647780" text-anchor="start">Next 150 mm</text><rect x="290" y="260" width="62" height="82" fill="#deeee6" stroke="#647780" stroke-width="2"/><text x="396" y="292" font-size="22" fill="#273b45" text-anchor="start">N2</text><text x="397" y="320" font-size="18" fill="#647780" text-anchor="start">Next 150 mm</text><text x="85" y="391" font-size="22" fill="#273b45" text-anchor="start">N uses N1 + N2, not the seating increment</text></g></svg>
