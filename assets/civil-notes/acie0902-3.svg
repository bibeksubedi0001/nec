<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Parabolic vertical curve</title><desc id="desc">BVC, PVI and EVC are different locations; the curve joins the entering and leaving grades smoothly.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="Verdana, sans-serif" letter-spacing="0"><path d="M70 319 L360 120 L650 319" stroke="#b8c8ce" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M200 230 Q360 120 520 230" stroke="#287aab" stroke-width="5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="200" cy="230" r="5" fill="#2b7b61" stroke="#2b7b61" stroke-width="2"/><text x="160" y="260" font-size="19" fill="#273b45" text-anchor="start">BVC</text><circle cx="520" cy="230" r="5" fill="#2b7b61" stroke="#2b7b61" stroke-width="2"/><text x="528" y="260" font-size="19" fill="#273b45" text-anchor="start">EVC</text><circle cx="360" cy="120" r="5" fill="#2b7b61" stroke="#2b7b61" stroke-width="2"/><text x="380" y="108" font-size="19" fill="#273b45" text-anchor="start">PVI</text><line x1="360" y1="128" x2="360" y2="355" stroke="#647780" stroke-width="1.5" stroke-dasharray="5 5"/><line x1="200" y1="350" x2="520" y2="350" stroke="#647780" stroke-width="1.5"/><line x1="200" y1="343" x2="200" y2="357" stroke="#647780" stroke-width="1.5"/><line x1="520" y1="343" x2="520" y2="357" stroke="#647780" stroke-width="1.5"/><text x="360" y="338" font-size="19" fill="#647780" text-anchor="middle">Curve length L</text><text x="80" y="70" font-size="24" fill="#273b45" text-anchor="start">Two grades joined by a parabola</text></g></svg>
