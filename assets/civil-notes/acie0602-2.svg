aab" stroke-width="5"/><line x1="655" y1="100" x2="655" y2="210" stroke="#287aab" stroke-width="5"/><line x1="655" y1="210" x2="655" y2="320" stroke="#287aab" stroke-width="5"/><circle cx="425" cy="210" r="5" fill="#ffffff" stroke="#2b7b61" stroke-width="2"/><circle cx="515" cy="100" r="5" fill="#ffffff" stroke="#2b7b61" stroke-width="2"/><circle cx="515" cy="210" r="5" fill="#ffffff" stroke="#2b7b61" stroke-width="2"/><circle cx="515" cy="320" r="5" fill="#ffffff" stroke="#2b7b61" stroke-width="2"/><circle cx="655" cy="100" r="5" fill="#ffffff" stroke="#2b7b61" stroke-width="2"/><circle cx="655" cy="210" r="5" fill="#ffffff" stroke="#2b7b61" stroke-width="2"/><circle cx="655" cy="320" r="5" fill="#ffffff" stroke="#2b7b61" stroke-width="2"/><text x="544" y="382" font-size="21" fill="#273b45" text-anchor="middle">Looped network</text></g></svg>
