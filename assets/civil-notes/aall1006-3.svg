<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Qualification versus individual status</title><desc id="desc">Recognition of a programme or qualification does not by itself register an individual engineer.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="Verdana, sans-serif" letter-spacing="0"><rect x="65" y="85" width="265" height="80" fill="#deeee6" stroke="#b8c8ce" stroke-width="2"/><text x="197.5" y="132" font-size="19" fill="#273b45" text-anchor="middle">Recognized qualification</text><rect x="390" y="85" width="265" height="80" fill="#d8edf7" stroke="#b8c8ce" stroke-width="2"/><text x="522.5" y="132" font-size="19" fill="#273b45" text-anchor="middle">Individual registration</text><text x="198" y="215" font-size="18" fill="#273b45" text-anchor="middle">Institution + programme</text><text x="198" y="270" font-size="18" fill="#273b45" text-anchor="middle">Academic standards</text><text x="198" y="325" font-size="18" fill="#273b45" text-anchor="middle">Recognition evidence</text><text x="522" y="215" font-size="18" fill="#273b45" text-anchor="middle">Application + eligibility</text><text x="522" y="270" font-size="18" fill="#273b45" text-anchor="middle">Examination route</text><text x="522" y="325" font-size="18" fill="#273b45" text-anchor="middle">Council registration</text><line x1="360" y1="85" x2="360" y2="360" stroke="#b8c8ce" stroke-width="2" stroke-dasharray="5 7"/></g></svg>
