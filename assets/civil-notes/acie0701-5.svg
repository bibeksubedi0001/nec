<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc">
  <title id="title">Irrigation interval: 55 percent remaining after 12 days</title>
  <desc id="desc">Available root-zone water begins at 80 mm and falls at 3 mm per day. Irrigation is triggered at 55 percent of 80 mm, or 44 mm remaining. Allowed depletion is 36 mm and the interval is 36 over 3 or 12 days.</desc>
  <rect width="720" height="420" fill="#fbfcfd"/>
  <g font-family="Verdana, sans-serif" font-weight="400" letter-spacing="0" fill="#273b45">
    <text x="26" y="33" font-size="21">55% remaining means 45% has been depleted</text>
    <text x="28" y="75" font-size="16">Available water (mm)</text>
    <path d="M93 93V319H627" stroke="#647780" stroke-width="1.5" fill="none"/>
    <path d="M93 118H611M93 179H611M93 240H611M93 301H611" stroke="#dce5dc"/>
    <text x="55" y="124" font-size="17">80</text><text x="55" y="185" font-size="17">68</text><text x="55" y="246" font-size="17">56</text><text x="55" y="307" font-size="17">44</text>
    <path d="M100 118L610 301" stroke="#287aab" stroke-width="3"/>
    <path d="M93 301H627M610 301V322" stroke="#a84940" stroke-width="2" stroke-dasharray="5 5"/>
    <circle cx="100" cy="118" r="5" fill="#287aab"/><circle cx="610" cy="301" r="5" fill="#a84940"/>
    <text x="96" y="344" font-size="16">0</text><text x="265" y="344" font-size="16">4</text><text x="435" y="344" font-size="16">8</text><text x="599" y="344" font-size="16">12 days</text>
    <text x="303" y="112" font-size="17">Consumption = 3 mm/day</text><text x="303" y="142" font-size="17">Depletion = 80 - 44 = 36 mm</text>
    <text x="141" y="289" font-size="16" fill="#a84940">Trigger: 0.55(80) = 44 mm remaining</text>
    <text x="28" y="382" font-size="18">Interval = 36/3 = 12 days</text>
    <text x="28" y="410" font-size="14" fill="#647780">Constant use, initially full available store, no rainfall or other gains/losses.</text>
  </g>
</svg>