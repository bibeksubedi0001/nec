<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Asphalt volume accounting</title><desc id="desc">VMA includes air and effective binder; absorbed binder is accounted for inside the aggregate envelope.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="Verdana, sans-serif" letter-spacing="0"><rect x="158" y="80" width="300" height="55" fill="#ffffff" stroke="#273b45" stroke-width="2"/><text x="308" y="115.5" font-size="22" fill="#273b45" text-anchor="middle">Air voids</text><rect x="158" y="135" width="300" height="70" fill="#f2dfdf" stroke="#273b45" stroke-width="2"/><text x="308" y="178" font-size="22" fill="#273b45" text-anchor="middle">Effective binder</text><rect x="158" y="205" width="300" height="144" fill="#d6dfe3" stroke="#273b45" stroke-width="2"/><text x="308" y="285" font-size="22" fill="#273b45" text-anchor="middle">Aggregate envelope</text><line x1="493" y1="80" x2="493" y2="205" stroke="#2b7b61" stroke-width="3"/><line x1="482" y1="80" x2="504" y2="80" stroke="#2b7b61" stroke-width="3"/><line x1="482" y1="205" x2="504" y2="205" stroke="#2b7b61" stroke-width="3"/><text x="520" y="145" font-size="23" fill="#2b7b61" text-anchor="start">VMA</text></g></svg>
