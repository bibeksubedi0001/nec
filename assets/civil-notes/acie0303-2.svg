<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Continuity through a contraction</title><desc id="desc">For steady incompressible flow without branches, the same discharge passes both areas and the narrower section has greater mean speed.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="Verdana, sans-serif" letter-spacing="0"><polygon points="75,110 244,110 354,164 627,164 627,256 354,256 244,310 75,310" fill="#d8edf7" stroke="#287aab" stroke-width="2" stroke-linejoin="round"/><line x1="111" y1="210" x2="208" y2="210" stroke="#287aab" stroke-width="3"/><polygon points="208,210 198.8691105968769,214.0776045305957 198.8691105968769,205.9223954694043" fill="#287aab" stroke="#287aab" stroke-width="2" stroke-linejoin="round"/><line x1="427" y1="210" x2="592" y2="210" stroke="#287aab" stroke-width="3"/><polygon points="592,210 582.8691105968769,214.0776045305957 582.8691105968769,205.9223954694043" fill="#287aab" stroke="#287aab" stroke-width="2" stroke-linejoin="round"/><text x="165" y="157" font-size="23" fill="#287aab" text-anchor="middle">A1</text><text x="499" y="138" font-size="23" fill="#287aab" text-anchor="middle">A2</text><text x="170" y="367" font-size="23" fill="#273b45" text-anchor="start">Same discharge; different mean speeds</text></g></svg>
