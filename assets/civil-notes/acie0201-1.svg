<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Three-phase soil diagram</title><desc id="desc">Air, water and solids occupy volumes, but air mass is usually neglected in elementary phase accounting.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="Verdana, sans-serif" letter-spacing="0"><rect x="210" y="75" width="200" height="68" fill="#ffffff" stroke="#273b45" stroke-width="2"/><text x="310" y="117" font-size="22" fill="#273b45" text-anchor="middle">Air</text><rect x="210" y="143" width="200" height="90" fill="#d8edf7" stroke="#273b45" stroke-width="2"/><text x="310" y="196" font-size="22" fill="#273b45" text-anchor="middle">Water</text><rect x="210" y="233" width="200" height="112" fill="#f0e6d4" stroke="#273b45" stroke-width="2"/><text x="310" y="297" font-size="22" fill="#273b45" text-anchor="middle">Solids</text><text x="88" y="58" font-size="23" fill="#273b45" text-anchor="start">Volume</text><text x="465" y="58" font-size="23" fill="#273b45" text-anchor="start">Mass</text><text x="111" y="109" font-size="22" fill="#273b45" text-anchor="start">Va</text><text x="465" y="109" font-size="18" fill="#273b45" text-anchor="start">Approximately zero</text><line x1="411" y1="102" x2="449" y2="102" stroke="#b8c8ce" stroke-width="1.5" stroke-dasharray="4 4"/><text x="111" y="188" font-size="22" fill="#273b45" text-anchor="start">Vw</text><text x="465" y="188" font-size="18" fill="#273b45" text-anchor="start">Water mass Mw</text><line x1="411" y1="181" x2="449" y2="181" stroke="#b8c8ce" stroke-width="1.5" stroke-dasharray="4 4"/><text x="111" y="289" font-size="22" fill="#273b45" text-anchor="start">Vs</text><text x="465" y="289" font-size="18" fill="#273b45" text-anchor="start">Solids mass Ms</text><line x1="411" y1="282" x2="449" y2="282" stroke="#b8c8ce" stroke-width="1.5" stroke-dasharray="4 4"/></g></svg>
