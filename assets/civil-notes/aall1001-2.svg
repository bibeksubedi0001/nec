<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">First-angle versus third-angle layout</title><desc id="desc">The same top and side views occupy different positions around the front view under the two conventions.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="Verdana, sans-serif" letter-spacing="0"><rect x="95" y="170" width="150" height="70" fill="#d8edf7" stroke="#b8c8ce" stroke-width="2"/><text x="170" y="212" font-size="19" fill="#273b45" text-anchor="middle">Front</text><rect x="95" y="273" width="150" height="60" fill="#deeee6" stroke="#b8c8ce" stroke-width="2"/><text x="170" y="310" font-size="19" fill="#273b45" text-anchor="middle">Top</text><rect x="25" y="175" width="60" height="60" fill="#f0e6d4" stroke="#b8c8ce" stroke-width="2"/><text x="55" y="212" font-size="19" fill="#273b45" text-anchor="middle">R side</text><text x="170" y="30" font-size="23" fill="#273b45" text-anchor="middle">First angle</text><rect x="443" y="170" width="150" height="70" fill="#d8edf7" stroke="#b8c8ce" stroke-width="2"/><text x="518" y="212" font-size="19" fill="#273b45" text-anchor="middle">Front</text><rect x="443" y="70" width="150" height="60" fill="#deeee6" stroke="#b8c8ce" stroke-width="2"/><text x="518" y="107" font-size="19" fill="#273b45" text-anchor="middle">Top</text><rect x="604" y="175" width="60" height="60" fill="#f0e6d4" stroke="#b8c8ce" stroke-width="2"/><text x="634" y="212" font-size="19" fill="#273b45" text-anchor="middle">R side</text><text x="518" y="30" font-size="23" fill="#273b45" text-anchor="middle">Third angle</text></g></svg>
