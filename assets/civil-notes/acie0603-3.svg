<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Slow sand filter section</title><desc id="desc">Supernatant water lies above the biological surface and fine sand, with graded support and collection below.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="Verdana, sans-serif" letter-spacing="0"><rect x="180" y="85" width="290" height="80" fill="#d8edf7" stroke="#b8c8ce" stroke-width="2"/><line x1="472" y1="125" x2="495" y2="125" stroke="#647780" stroke-width="1"/><text x="505" y="131" font-size="17" fill="#273b45" text-anchor="start">Supernatant water</text><rect x="180" y="165" width="290" height="8" fill="#2b7b61" stroke="#b8c8ce" stroke-width="2"/><line x1="472" y1="169" x2="495" y2="169" stroke="#647780" stroke-width="1"/><text x="505" y="175" font-size="17" fill="#273b45" text-anchor="start">Biological surface</text><rect x="180" y="173" width="290" height="94" fill="#f0e6d4" stroke="#b8c8ce" stroke-width="2"/><line x1="472" y1="220" x2="495" y2="220" stroke="#647780" stroke-width="1"/><text x="505" y="226" font-size="17" fill="#273b45" text-anchor="start">Fine sand</text><rect x="180" y="267" width="290" height="52" fill="#d6dfe3" stroke="#b8c8ce" stroke-width="2"/><line x1="472" y1="293" x2="495" y2="293" stroke="#647780" stroke-width="1"/><text x="505" y="299" font-size="17" fill="#273b45" text-anchor="start">Graded support</text><rect x="180" y="319" width="290" height="25" fill="#d8edf7" stroke="#b8c8ce" stroke-width="2"/><line x1="472" y1="331.5" x2="495" y2="331.5" stroke="#647780" stroke-width="1"/><text x="505" y="337.5" font-size="17" fill="#273b45" text-anchor="start">Collection drain</text><line x1="130" y1="135" x2="130" y2="300" stroke="#287aab" stroke-width="3"/><polygon points="130,300 125.9223954694043,290.8691105968769 134.0776045305957,290.8691105968769" fill="#287aab" stroke="#287aab" stroke-width="2" stroke-linejoin="round"/><t