<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Separate and combined systems</title><desc id="desc">Separate networks keep intended sanitary and storm flows distinct; a combined network conveys both in one system.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="Verdana, sans-serif" letter-spacing="0"><text x="185" y="58" font-size="24" fill="#273b45" text-anchor="middle">Separate</text><text x="543" y="58" font-size="24" fill="#273b45" text-anchor="middle">Combined</text><rect x="98" y="91" width="172" height="50" fill="#deeee6" stroke="#b8c8ce" stroke-width="2"/><text x="184" y="123" font-size="19" fill="#273b45" text-anchor="middle">Catchment</text><rect x="448" y="91" width="172" height="50" fill="#deeee6" stroke="#b8c8ce" stroke-width="2"/><text x="534" y="123" font-size="19" fill="#273b45" text-anchor="middle">Catchment</text><line x1="114" y1="168" x2="114" y2="333" stroke="#287aab" stroke-width="7"/><line x1="235" y1="168" x2="235" y2="333" stroke="#b98232" stroke-width="7"/><text x="111" y="367" font-size="19" fill="#287aab" text-anchor="middle">Storm</text><text x="239" y="367" font-size="19" fill="#b98232" text-anchor="middle">Sanitary</text><line x1="469" y1="167" x2="469" y2="239" stroke="#287aab" stroke-width="7"/><line x1="591" y1="167" x2="591" y2="239" stroke="#b98232" stroke-width="7"/><line x1="469" y1="239" x2="591" y2="239" stroke="#647780" stroke-width="6"/><line x1="530" y1="239" x2="530" y2="333" stroke="#287aab" stroke-width="9"/><text x="532" y="367" font-size="20" fill="#273b45" text-anchor="middle">Combined flow</text></g></svg>
