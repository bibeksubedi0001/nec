<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Temperature-gradient curling</title><desc id="desc">Different top and bottom strains tend to curve a slab; restraint and support determine the resulting stresses.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="Verdana, sans-serif" letter-spacing="0"><path d="M60 239 Q195 151 330 239" stroke="#d6dfe3" stroke-width="24" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M60 239 Q195 151 330 239" stroke="#b64f4f" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="60" y1="302" x2="330" y2="302" stroke="#647780" stroke-width="3"/><text x="195" y="90" font-size="24" fill="#273b45" text-anchor="middle">Top warmer</text><text x="195" y="373" font-size="19" fill="#273b45" text-anchor="middle">Edges tend downward</text><path d="M412 175 Q547 264 682 175" stroke="#d6dfe3" stroke-width="24" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M412 175 Q547 264 682 175" stroke="#b64f4f" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="412" y1="302" x2="682" y2="302" stroke="#647780" stroke-width="3"/><text x="547" y="90" font-size="24" fill="#273b45" text-anchor="middle">Top cooler</text><text x="547" y="373" font-size="19" fill="#273b45" text-anchor="middle">Edges tend upward</text></g></svg>
