<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Alignment alternatives</title><desc id="desc">Illustrative routes trade length against terrain, crossings and receptors; the shortest line is not automatically preferable.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="Verdana, sans-serif" letter-spacing="0"><ellipse cx="370" cy="210" rx="80" ry="40" fill="none" stroke="#b8c8ce" stroke-width="1.5"/><ellipse cx="370" cy="210" rx="122" ry="65" fill="none" stroke="#b8c8ce" stroke-width="1.5"/><ellipse cx="370" cy="210" rx="164" ry="90" fill="none" stroke="#b8c8ce" stroke-width="1.5"/><ellipse cx="370" cy="210" rx="206" ry="115" fill="none" stroke="#b8c8ce" stroke-width="1.5"/><ellipse cx="370" cy="210" rx="248" ry="140" fill="none" stroke="#b8c8ce" stroke-width="1.5"/><circle cx="72" cy="310" r="5" fill="#2b7b61" stroke="#2b7b61" stroke-width="2"/><text x="47" y="343" font-size="19" fill="#273b45" text-anchor="start">Start</text><circle cx="650" cy="80" r="5" fill="#2b7b61" stroke="#2b7b61" stroke-width="2"/><text x="625" y="67" font-size="19" fill="#273b45" text-anchor="start">End</text><path d="M72 310 L650 80" stroke="#b64f4f" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 5"/><path d="M72 310 Q340 370 650 80" stroke="#287aab" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M72 310 Q78 20 650 80" stroke="#2b7b61" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="367" y="230" font-size="21" fill="#647780" text-anchor="middle">Terrain constraint</text><line x1="115" y1="359" x2="139" y2="359" stroke="#b64f4f" stroke-width="3"/><text x="147" y="365" font-size="16" fill="#273b45" text-anchor="start">Short crossing</text><line x1="295" y1="359" x2="319" y2="359" stroke="#287aab" stroke-width="3"/><text x="327" y="365" font-size="16" fil