<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Flexible and rigid load paths</title><desc id="desc">Layered load distribution and slab bending are different structural mechanisms; both need suitable foundation support.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="Verdana, sans-serif" letter-spacing="0"><rect x="60" y="133" width="270" height="40" fill="#273b45" stroke="#b8c8ce" stroke-width="2"/><text x="195" y="160" font-size="18" fill="#ffffff" text-anchor="middle">Asphalt</text><rect x="60" y="173" width="270" height="60" fill="#d6dfe3" stroke="#b8c8ce" stroke-width="2"/><text x="195" y="210" font-size="18" fill="#273b45" text-anchor="middle">Base</text><rect x="60" y="233" width="270" height="50" fill="#f0e6d4" stroke="#b8c8ce" stroke-width="2"/><text x="195" y="265" font-size="18" fill="#273b45" text-anchor="middle">Subbase</text><rect x="60" y="283" width="270" height="50" fill="#deeee6" stroke="#b8c8ce" stroke-width="2"/><text x="195" y="315" font-size="18" fill="#273b45" text-anchor="middle">Subgrade</text><line x1="195" y1="50" x2="195" y2="123" stroke="#b64f4f" stroke-width="4"/><polygon points="195,123 190.9223954694043,113.86911059687692 199.0776045305957,113.86911059687692" fill="#b64f4f" stroke="#b64f4f" stroke-width="2" stroke-linejoin="round"/><text x="195" y="384" font-size="23" fill="#273b45" text-anchor="middle">Flexible</text><rect x="412" y="133" width="270" height="65" fill="#d6dfe3" stroke="#b8c8ce" stroke-width="2"/><text x="547" y="172.5" font-size="18" fill="#273b45" text-anchor="middle">Concrete slab</text><rect x="412" y="198" width="270" height="65" fill="#f0e6d4" stroke="#b8c8ce" stroke-width="2"/><text x="547" y="237.5" font-size="18" fill="#273b45" text-anchor="middle">Support layer</text><rect x="412" y="263" width="270" height="70" fill="#deeee6" stroke="#b8c8ce" stroke-width="2"/><text x="547" y="305" font-size="18" fill="#273b45" text-anchor="middle">Subgrade</text><line x1="547" y1="50" x2="547" y2="123" stroke="#b64f4f" stroke-width="4"/><polygon points="547,123 542.9223954694043,113.86911059687692 551.0776045305957,113.86911059687692" fill="#b64f4f" stroke="#b64f4f" stroke-width="2" stroke-linejoin="round"/><text x="547" y="384" font-size="23" fill="#273b45" text-anchor="middle">Rigid</text></g></svg>
