<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Head loss along a pipe</title><desc id="desc">For a uniform pipe without a machine, friction lowers both grade lines while their separation reflects velocity head.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="Verdana, sans-serif" letter-spacing="0"><rect x="85" y="304" width="555" height="20" fill="#d6dfe3" stroke="#273b45" stroke-width="2"/><line x1="80" y1="153" x2="642" y2="218" stroke="#287aab" stroke-width="3"/><line x1="80" y1="100" x2="642" y2="165" stroke="#2b7b61" stroke-width="3"/><line x1="192" y1="166" x2="192" y2="304" stroke="#647780" stroke-width="1.5"/><line x1="185" y1="166" x2="199" y2="166" stroke="#647780" stroke-width="1.5"/><line x1="185" y1="304" x2="199" y2="304" stroke="#647780" stroke-width="1.5"/><text x="145" y="235" font-size="19" fill="#647780" text-anchor="middle">Pressure head</text><line x1="522" y1="151" x2="522" y2="204" stroke="#647780" stroke-width="1.5"/><line x1="515" y1="151" x2="529" y2="151" stroke="#647780" stroke-width="1.5"/><line x1="515" y1="204" x2="529" y2="204" stroke="#647780" stroke-width="1.5"/><text x="592" y="177.5" font-size="19" fill="#647780" text-anchor="middle">Velocity head</text><text x="271" y="101" font-size="21" fill="#2b7b61" text-anchor="start">Energy grade line</text><text x="380" y="264" font-size="21" fill="#287aab" text-anchor="start">Hydraulic grade line</text><text x="272" y="386" font-size="22" fill="#273b45" text-anchor="start">Distance along pipe</text></g></svg>
