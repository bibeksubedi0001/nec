<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Crown and crossfall</title><desc id="desc">Crossfall drains each side from its controlling high point; crown rise depends on the width drained on that side.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="Verdana, sans-serif" letter-spacing="0"><polygon points="90,280 357,219 630,280 630,318 90,318" fill="#d6dfe3" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><line x1="347" y1="208" x2="177" y2="248" stroke="#287aab" stroke-width="3"/><polygon points="177,248 184.95423268227123,241.9394569190304 186.82209633203905,249.87787743054366" fill="#287aab" stroke="#287aab" stroke-width="2" stroke-linejoin="round"/><line x1="368" y1="208" x2="546" y2="248" stroke="#287aab" stroke-width="3"/><polygon points="546,248 536.1972594019899,249.97643030945298 537.9852998274268,242.01965041625863" fill="#287aab" stroke="#287aab" stroke-width="2" stroke-linejoin="round"/><text x="319" y="171" font-size="24" fill="#273b45" text-anchor="start">Crown</text><line x1="90" y1="358" x2="357" y2="358" stroke="#647780" stroke-width="1.5"/><line x1="90" y1="351" x2="90" y2="365" stroke="#647780" stroke-width="1.5"/><line x1="357" y1="351" x2="357" y2="365" stroke="#647780" stroke-width="1.5"/><text x="223.5" y="346" font-size="19" fill="#647780" text-anchor="middle">Half width</text><line x1="357" y1="358" x2="630" y2="358" stroke="#647780" stroke-width="1.5"/><line x1="357" y1="351" x2="357" y2="365" stroke="#647780" stroke-width="1.5"/><line x1="630" y1="351" x2="630" y2="365" stroke="#647780" stroke-width="1.5"/><text x="493.5" y="346" font-size="19" fill="#647780" text-anchor="middle">Half width</text><text x="121" y="80" font-size="23" fill="#273b45" text-anchor="start">Crossfall directs runoff toward the edges</text></g></svg>
