<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Section through a hollow sleeve</title><desc id="desc">Hatching identifies cut material; the bore remains an unhatched void in the sectional views.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="Verdana, sans-serif" letter-spacing="0"><defs><pattern id="hatch" width="16" height="16" patternUnits="userSpaceOnUse"><rect width="16" height="16" fill="#f0e6d4"/><path d="M-4 12 L12 -4 M0 16 L16 0 M12 20 L20 12" stroke="#b98232" stroke-width="1.5"/></pattern></defs><rect x="100" y="100" width="270" height="215" fill="url(#hatch)" stroke="#273b45" stroke-width="2"/><rect x="100" y="164" width="270" height="86" fill="#ffffff" stroke="#273b45" stroke-width="2"/><circle cx="544" cy="208" r="114" fill="url(#hatch)" stroke="#273b45" stroke-width="2"/><circle cx="544" cy="208" r="46" fill="#ffffff" stroke="#273b45" stroke-width="2"/><line x1="409" y1="208" x2="678" y2="208" stroke="#647780" stroke-width="1.5" stroke-dasharray="6 5"/><text x="234" y="367" font-size="21" fill="#273b45" text-anchor="middle">Longitudinal section</text><text x="544" y="367" font-size="21" fill="#273b45" text-anchor="middle">Cross-section</text></g></svg>
