<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc">
  <title id="title">8 m simply supported beam with 1 kN per metre UDL</title>
  <desc id="desc">Each reaction is 4 kN. Shear falls linearly from plus 4 to minus 4 kN and crosses zero at midspan. The sagging moment parabola is zero at the supports, 6 kN m at x equals 2 m and 8 kN m at midspan.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs>
  <rect width="720" height="420" fill="#fbfcfd"/>
  <g font-family="Verdana, sans-serif" font-weight="400" letter-spacing="0" fill="#273b45">
    <text x="26" y="30" font-size="21">Uniform load: reactions, shear and moment</text>
    <text x="294" y="58" font-size="18">w = 1 kN/m</text>
    <path d="M120 72H600M120 72V97M180 72V97M240 72V97M300 72V97M360 72V97M420 72V97M480 72V97M540 72V97M600 72V97" stroke="#a84940" stroke-width="2" fill="none"/>
    <path d="M116 92L120 99L124 92M176 92L180 99L184 92M236 92L240 99L244 92M296 92L300 99L304 92M356 92L360 99L364 92M416 92L420 99L424 92M476 92L480 99L484 92M536 92L540 99L544 92M596 92L600 99L604 92" stroke="#a84940" fill="none"/>
    <path d="M120 105H600" stroke="#273b45" stroke-width="6"/>
    <path d="M120 109L108 127H132ZM600 109L588 125H612Z" fill="#d6dfe3" stroke="#273b45" stroke-width="1.5"/>
    <circle cx="594" cy="130" r="3" stroke="#273b45" fill="white"/><circle cx="606" cy="130" r="3" stroke="#273b45" fill="white"/>
    <text x="73" y="154" font-size="17">A: 4 kN</text><text x="560" y="154" font-size="17">B: 4 kN</text>
    <text x="324" y="145" font-size="17">L = 8 m</text>
    <text x="26" y="213" font-size="18">V (kN)</text>
    <path d="M120 210H620" stroke="#647780" marker-end="url(#arrow)"/>
    <path d="M120 210V174L600 246V210" fill="#d8edf7" stroke="#287aab" stroke-width="2"/>
    <text x="82" y="177" font-size="17">+4</text><text x="615" y="250" font-size="17">-4</text><text x="357" y="200" font-size="16">0</text>
    <text x="26" y="326" font-size="18">M</text><text x="15" y="348" font-size="15">(kN m)</text>
    <path d="M120 360H620" stroke="#647780" marker-end="url(#arrow)"/>
    <path d="M120 360Q360 232 600 360Z" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/>
    <path d="M240 360V312M360 360V296" stroke="#647780" stroke-dasharray="4 4"/>
    <circle cx="240" cy="312" r="4" fill="#a84940"/><circle cx="360" cy="296" r="4" fill="#2b7b61"/>
    <text x="191" y="298" font-size="17">M(2) = 6</text><text x="354" y="281" font-size="17">M(4) = 8</text>
    <text x="114" y="386" font-size="16">0</text><text x="222" y="386" font-size="16">2 m</text><text x="343" y="386" font-size="16">4 m</text><text x="583" y="386" font-size="16">8 m</text>
    <text x="184" y="413" font-size="14" fill="#647780">Sagging moment is plotted above the baseline.</text>
  </g>
</svg>