<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc">
  <title id="title">Minimum column eccentricity: unsupported length and lower bound</title>
  <desc id="desc">For a 400 mm square RCC column, IS 456 minimum eccentricity uses unsupported length l. A 5 m column gives 23.33 mm, exceeding the 20 mm floor. A 3 m column gives 19.33 mm, so the 20 mm floor controls. The eccentricity arrow is exaggerated for clarity.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs>
  <rect width="720" height="420" fill="#fbfcfd"/>
  <g font-family="Verdana, sans-serif" font-weight="400" letter-spacing="0" fill="#273b45">
    <text x="26" y="34" font-size="21">Minimum eccentricity: evaluate both limits</text>
    <rect x="114" y="145" width="160" height="160" fill="#deeee6" stroke="#273b45" stroke-width="2"/>
    <path d="M194 110V327" stroke="#647780" stroke-dasharray="6 4"/>
    <path d="M233 78V204" stroke="#a84940" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M194 123H233" stroke="#287aab" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="209" y="111" font-size="17">e</text><text x="247" y="97" font-size="18">P</text>
    <text x="118" y="341" font-size="17">D = 400 mm</text>
    <text x="330" y="100" font-size="18">e(min) = max(l/500 + D/30, 20)</text>
    <text x="330" y="133" font-size="16">All lengths in mm; l is unsupported.</text>
    <text x="330" y="190" font-size="18">l = 5000 mm</text>
    <text x="330" y="220" font-size="18">10 + 13.33 = 23.33 mm</text>
    <text x="330" y="282" font-size="18">l = 3000 mm</text>
    <text x="330" y="312" font-size="18">6 + 13.33 = 19.33 mm</text>
    <text x="330" y="342" font-size="18" fill="#2b7b61">Adopt the 20 mm minimum.</text>
    <path d="M28 363H692" stroke="#d6dfe3"/>
    <text x="28" y="391" font-size="15" fill="#647780">Load offset exaggerated. Minimum eccentricity is not a complete column design.</text>
  </g>
</svg>