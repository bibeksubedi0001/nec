<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Faces of a brick</title><desc id="desc">A schematic brick identifies the bed, stretcher face, header face and frog; dimensions depend on the specified unit.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="Verdana, sans-serif" letter-spacing="0"><rect x="180" y="160" width="270" height="115" fill="#f0e6d4" stroke="#273b45" stroke-width="2"/><polygon points="180,160 245,121 515,121 450,160" fill="#f0e6d4" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><polygon points="450,160 515,121 515,236 450,275" fill="#d6dfe3" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><polygon points="260,149 292,130 424,130 392,149" fill="#d6dfe3" stroke="#b98232" stroke-width="2" stroke-linejoin="round"/><text x="120" y="90" font-size="21" fill="#273b45" text-anchor="start">Bed and frog</text><line x1="275" y1="99" x2="304" y2="155" stroke="#647780" stroke-width="1.5"/><text x="515" y="270" font-size="21" fill="#273b45" text-anchor="start">Header</text><line x1="508" y1="246" x2="495" y2="218" stroke="#647780" stroke-width="1.5"/><text x="245" y="333" font-size="21" fill="#273b45" text-anchor="start">Stretcher face</text><line x1="330" y1="310" x2="330" y2="275" stroke="#647780" stroke-width="1.5"/><line x1="180" y1="365" x2="450" y2="365" stroke="#647780" stroke-width="1.5"/><line x1="180" y1="358" x2="180" y2="372" stroke="#647780" stroke-width="1.5"/><line x1="450" y1="358" x2="450" y2="372" stroke="#647780" stroke-width="1.5"/><text x="315" y="353" font-size="19" fill="#647780" text-anchor="middle">Length</text></g></svg>
