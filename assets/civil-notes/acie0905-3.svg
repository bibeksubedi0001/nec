<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Dowel and tie-bar functions</title><desc id="desc">Dowels transfer load across a transverse joint while permitting intended movement; ties restrain separation at a longitudinal joint.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="Verdana, sans-serif" letter-spacing="0"><rect x="70" y="131" width="585" height="221" fill="#d6dfe3" stroke="#273b45" stroke-width="2"/><line x1="361" y1="131" x2="361" y2="352" stroke="#ffffff" stroke-width="8"/><line x1="70" y1="242" x2="655" y2="242" stroke="#ffffff" stroke-width="8"/><line x1="315" y1="168" x2="405" y2="168" stroke="#287aab" stroke-width="7"/><line x1="315" y1="208" x2="405" y2="208" stroke="#287aab" stroke-width="7"/><line x1="315" y1="278" x2="405" y2="278" stroke="#287aab" stroke-width="7"/><line x1="315" y1="320" x2="405" y2="320" stroke="#287aab" stroke-width="7"/><line x1="170" y1="208" x2="170" y2="279" stroke="#2b7b61" stroke-width="7"/><line x1="254" y1="208" x2="254" y2="279" stroke="#2b7b61" stroke-width="7"/><line x1="478" y1="208" x2="478" y2="279" stroke="#2b7b61" stroke-width="7"/><line x1="560" y1="208" x2="560" y2="279" stroke="#2b7b61" stroke-width="7"/><text x="267" y="80" font-size="22" fill="#287aab" text-anchor="start">Transverse joint</text><line x1="360" y1="87" x2="360" y2="125" stroke="#287aab" stroke-width="2"/><text x="80" y="399" font-size="20" fill="#287aab" text-anchor="start">Blue: dowels</text><text x="437" y="399" font-size="20" fill="#2b7b61" text-anchor="start">Green: ties</text></g></svg>
