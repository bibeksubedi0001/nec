<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc">
  <title id="title">Soil water weight: moist minus oven-dry weight</title>
  <desc id="desc">Total moist weight 190 kN is separated into 150 kN dry solids and 40 kN water. The bars show weights, not phase volumes. Gravimetric water content is 40 over 150 or 26.67 percent, not 40 over 190.</desc>
  <rect width="720" height="420" fill="#fbfcfd"/>
  <g font-family="Verdana, sans-serif" font-weight="400" letter-spacing="0" fill="#273b45">
    <text x="26" y="34" font-size="21">Soil sample: conserve the dry solids</text>
    <text x="65" y="91" font-size="18">Moist: 190 kN</text><text x="317" y="91" font-size="18">Oven dry: 150 kN</text>
    <rect x="98" y="178" width="123" height="150" fill="#deeee6" stroke="#273b45" stroke-width="2"/>
    <rect x="98" y="138" width="123" height="40" fill="#d8edf7" stroke="#287aab" stroke-width="2"/>
    <rect x="349" y="178" width="123" height="150" fill="#deeee6" stroke="#273b45" stroke-width="2"/>
    <text x="115" y="165" font-size="16">Water: 40</text><text x="112" y="258" font-size="17">Solids: 150</text><text x="361" y="258" font-size="17">Solids: 150</text>
    <path d="M248 240H319M309 234L319 240L309 246" stroke="#647780" stroke-width="2" fill="none"/>
    <text x="245" y="219" font-size="15">Drying</text>
    <text x="508" y="160" font-size="18">Water removed</text><text x="508" y="198" font-size="18">190 - 150</text><text x="508" y="230" font-size="18" fill="#287aab">= 40 kN</text>
    <text x="508" y="289" font-size="17">w = 40/150</text><text x="508" y="316" font-size="17">= 26.67%</text>
    <path d="M28 355H692" stroke="#d6dfe3"/>
    <text x="28" y="382" font-size="16">Water-content denominator: dry solids, not the moist total.</text>
    <text x="28" y="409" font-size="14" fill="#647780">Weight bars only. The data do not determine phase volumes or porosity.</text>
  </g>
</svg>