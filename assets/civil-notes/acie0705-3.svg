<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Free versus submerged outlet</title><desc id="desc">A free outlet is referenced to its discharge condition; a submerged outlet depends on both upstream and downstream heads.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="Verdana, sans-serif" letter-spacing="0"><rect x="90" y="62" width="146" height="136" fill="#d8edf7" stroke="#287aab" stroke-width="2"/><rect x="236" y="153" width="255" height="22" fill="#d6dfe3" stroke="#273b45" stroke-width="2"/><line x1="236" y1="164" x2="504" y2="164" stroke="#287aab" stroke-width="8"/><line x1="323" y1="164" x2="447" y2="164" stroke="#287aab" stroke-width="3"/><polygon points="447,164 437.8691105968769,168.0776045305957 437.8691105968769,159.9223954694043" fill="#287aab" stroke="#287aab" stroke-width="2" stroke-linejoin="round"/><text x="516" y="116" font-size="21" fill="#273b45" text-anchor="start">Free outlet</text><text x="102" y="50" font-size="18" fill="#647780" text-anchor="start">Upstream head</text><rect x="90" y="247" width="146" height="136" fill="#d8edf7" stroke="#287aab" stroke-width="2"/><rect x="236" y="338" width="255" height="22" fill="#d6dfe3" stroke="#273b45" stroke-width="2"/><line x1="236" y1="349" x2="504" y2="349" stroke="#287aab" stroke-width="8"/><line x1="323" y1="349" x2="447" y2="349" stroke="#287aab" stroke-width="3"/><polygon points="447,349 437.8691105968769,353.0776045305957 437.8691105968769,344.9223954694043" fill="#287aab" stroke="#287aab" stroke-width="2" stroke-linejoin="round"/><rect x="491" y="315" width="130" height="70" fill="#d8edf7" stroke="#287aab" stroke-width="2"/><text x="516" y="301" font-size="21" fill="#273b45" text-anchor="start">Submerged</text><text x="102" y="235" font-size="18" fill="#647780" text-anchor="start">Two water levels</text></g></svg>
