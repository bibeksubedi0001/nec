<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Traverse closure</title><desc id="desc">Successive eastings and northings should close for a closed traverse; the exaggerated gap illustrates misclosure.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="Verdana, sans-serif" letter-spacing="0"><path d="M151,307 L182,105 L431,67 L583,253 L180,323" stroke="#287aab" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="151" cy="307" r="5" fill="#2b7b61" stroke="#2b7b61" stroke-width="2"/><text x="159" y="295" font-size="19" fill="#273b45" text-anchor="start">A</text><circle cx="182" cy="105" r="5" fill="#2b7b61" stroke="#2b7b61" stroke-width="2"/><text x="190" y="93" font-size="19" fill="#273b45" text-anchor="start">B</text><circle cx="431" cy="67" r="5" fill="#2b7b61" stroke="#2b7b61" stroke-width="2"/><text x="439" y="55" font-size="19" fill="#273b45" text-anchor="start">C</text><circle cx="583" cy="253" r="5" fill="#2b7b61" stroke="#2b7b61" stroke-width="2"/><text x="591" y="241" font-size="19" fill="#273b45" text-anchor="start">D</text><circle cx="180" cy="323" r="5" fill="#2b7b61" stroke="#2b7b61" stroke-width="2"/><text x="188" y="311" font-size="19" fill="#273b45" text-anchor="start">E</text><line x1="180" y1="323" x2="151" y2="307" stroke="#b64f4f" stroke-width="3"/><polygon points="151,307 160.9646013587747,307.8406662600018 157.0250046346079,314.9811853225541" fill="#b64f4f" stroke="#b64f4f" stroke-width="2" stroke-linejoin="round"/><text x="204" y="367" font-size="23" fill="#b64f4f" text-anchor="start">Exaggerated closure gap</text></g></svg>
