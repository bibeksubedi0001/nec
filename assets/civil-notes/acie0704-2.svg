<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Spur orientation</title><desc id="desc">Upstream-pointing, normal and downstream-pointing spurs are distinguished relative to the actual flow direction.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="Verdana, sans-serif" letter-spacing="0"><rect x="70" y="130" width="580" height="220" fill="#d8edf7" stroke="#287aab" stroke-width="2"/><line x1="70" y1="350" x2="650" y2="350" stroke="#647780" stroke-width="5"/><line x1="140" y1="80" x2="580" y2="80" stroke="#287aab" stroke-width="3"/><polygon points="580,80 570.8691105968769,84.0776045305957 570.8691105968769,75.9223954694043" fill="#287aab" stroke="#287aab" stroke-width="2" stroke-linejoin="round"/><text x="300" y="50" font-size="23" fill="#287aab" text-anchor="start">River flow</text><line x1="200" y1="349" x2="143" y2="228" stroke="#2b7b61" stroke-width="9"/><line x1="360" y1="349" x2="360" y2="228" stroke="#2b7b61" stroke-width="9"/><line x1="516" y1="349" x2="578" y2="228" stroke="#2b7b61" stroke-width="9"/><text x="180" y="382" font-size="17" fill="#273b45" text-anchor="middle">Upstream</text><text x="180" y="404" font-size="17" fill="#273b45" text-anchor="middle">pointing</text><text x="360" y="389" font-size="19" fill="#273b45" text-anchor="middle">Normal</text><text x="551" y="382" font-size="17" fill="#273b45" text-anchor="middle">Downstream</text><text x="551" y="404" font-size="17" fill="#273b45" text-anchor="middle">pointing</text></g></svg>
