<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc">
  <title id="title">Cantilever stress: load, section and fixed-end fibres</title>
  <desc id="desc">A 2 m cantilever carries a downward 2.4 kN tip load. Its section is 40 mm wide and 60 mm deep. The fixed-end moment magnitude is 4.8 kN m; elastic stresses are 200 MPa tension at the top and 200 MPa compression at the bottom.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs>
  <rect width="720" height="420" fill="#fbfcfd"/>
  <g font-family="Verdana, sans-serif" font-weight="400" letter-spacing="0" fill="#273b45">
    <text x="28" y="34" font-size="21">Cantilever: elastic stress at the fixed end</text>
    <rect x="40" y="76" width="24" height="142" fill="#d6dfe3" stroke="#273b45" stroke-width="2"/>
    <path d="M64 143H355" stroke="#273b45" stroke-width="9"/>
    <path d="M355 82V133" stroke="#a84940" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="272" y="68" font-size="18">P = 2.4 kN</text>
    <path d="M66 203H355" stroke="#647780" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="174" y="231" font-size="18">L = 2 m</text>
    <text x="45" y="269" font-size="17">|M| = PL = 4.8 kN m</text>
    <text x="440" y="68" font-size="18">Cross-section</text>
    <rect x="470" y="91" width="80" height="120" fill="#deeee6" stroke="#273b45" stroke-width="2"/>
    <path d="M454 151H568" stroke="#647780" stroke-dasharray="5 4"/>
    <path d="M470 232H550" stroke="#647780" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <path d="M584 91V211" stroke="#647780" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
    <text x="480" y="257" font-size="17">40 mm</text>
    <text x="599" y="159" font-size="17">60 mm</text>
    <text x="445" y="286" font-size="17">Top: tension (+200 MPa)</text>
    <text x="395" y="315" font-size="17">Bottom: compression (-200 MPa)</text>
    <path d="M28 338H692" stroke="#d6dfe3"/>
    <text x="28" y="365" font-size="17">Z = bd&#178;/6 = 24,000 mm&#179;; stress magnitude = |M|/Z.</text>
    <text x="28" y="394" font-size="15" fill="#647780">60 mm is the vertical depth. These data alone do not establish collapse.</text>
  </g>
</svg>