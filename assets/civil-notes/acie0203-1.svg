<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Mohr circle and strength envelope</title><desc id="desc">The tangent envelope relates normal and shear stress at failure under the stated effective-stress model.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="Verdana, sans-serif" letter-spacing="0"><line x1="95" y1="242" x2="658" y2="242" stroke="#647780" stroke-width="2"/><polygon points="658,242 648.8691105968769,246.0776045305957 648.8691105968769,237.9223954694043" fill="#647780" stroke="#647780" stroke-width="2" stroke-linejoin="round"/><line x1="95" y1="360" x2="95" y2="48" stroke="#647780" stroke-width="2"/><polygon points="95,48 99.0776045305957,57.130889403123085 90.9223954694043,57.130889403123085" fill="#647780" stroke="#647780" stroke-width="2" stroke-linejoin="round"/><text x="102" y="30" font-size="21" fill="#273b45" text-anchor="start">Shear stress</text><text x="365" y="398" font-size="21" fill="#273b45" text-anchor="middle">Normal stress</text><circle cx="350" cy="242" r="105" fill="none" stroke="#287aab" stroke-width="3"/><circle cx="245" cy="242" r="5" fill="#2b7b61" stroke="#2b7b61" stroke-width="2"/><text x="218" y="270" font-size="19" fill="#273b45" text-anchor="start">s3</text><circle cx="455" cy="242" r="5" fill="#2b7b61" stroke="#2b7b61" stroke-width="2"/><text x="467" y="270" font-size="19" fill="#273b45" text-anchor="start">s1</text><circle cx="350" cy="242" r="5" fill="#2b7b61" stroke="#2b7b61" stroke-width="2"/><text x="322" y="278" font-size="19" fill="#273b45" text-anchor="start">Centre</text><line x1="132" y1="188.2684773275364" x2="630" y2="63.7684773275364" stroke="#2b7b61" stroke-width="3"/><text x="440" y="50" font-size="21" fill="#2b7b61" text-anchor="start">Strength envelope</text><circle cx="324.53375937118506" cy="140.13503748474017" r="5" fill="#2b7b61" stroke="#2b7b61" stroke-width="2"/><text x="372.53375937118