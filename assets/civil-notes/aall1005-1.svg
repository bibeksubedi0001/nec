<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Hierarchy of hazard controls</title><desc id="desc">Elimination and substitution address the source; engineering, administrative and personal protection have different remaining dependencies.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="Verdana, sans-serif" letter-spacing="0"><polygon points="70,55 650,55 626,103 94,103" fill="#deeee6" stroke="#b8c8ce" stroke-width="2" stroke-linejoin="round"/><text x="360" y="86" font-size="21" fill="#273b45" text-anchor="middle">Eliminate</text><polygon points="102.5,116 617.5,116 593.5,164 126.5,164" fill="#d8edf7" stroke="#b8c8ce" stroke-width="2" stroke-linejoin="round"/><text x="360" y="147" font-size="21" fill="#273b45" text-anchor="middle">Substitute</text><polygon points="135,177 585,177 561,225 159,225" fill="#f0e6d4" stroke="#b8c8ce" stroke-width="2" stroke-linejoin="round"/><text x="360" y="208" font-size="21" fill="#273b45" text-anchor="middle">Engineering controls</text><polygon points="167.5,238 552.5,238 528.5,286 191.5,286" fill="#f2dfdf" stroke="#b8c8ce" stroke-width="2" stroke-linejoin="round"/><text x="360" y="269" font-size="21" fill="#273b45" text-anchor="middle">Administrative controls</text><polygon points="200,299 520,299 496,347 224,347" fill="#d6dfe3" stroke="#b8c8ce" stroke-width="2" stroke-linejoin="round"/><text x="360" y="330" font-size="21" fill="#273b45" text-anchor="middle">Personal protection</text></g></svg>
