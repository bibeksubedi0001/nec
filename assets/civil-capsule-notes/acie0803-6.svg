<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Gated outlet below the crest, and level from a pressure sensor</title><desc id="desc">With turbines shut and the reservoir below the crest, a gated sluiceway releases water downstream. A gauge reading of 98.1 kPa is 10 m of water, so a sensor 2 m above datum shows a surface at 12 m.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><rect x="40" y="114" width="290" height="216" fill="#d8edf7" stroke="none" stroke-width="2"/><line x1="40" y1="114" x2="330" y2="114" stroke="#287aab" stroke-width="2"/><polygon points="330,80 370,80 520,330 330,330" fill="#e4e8e9" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><text x="350" y="70" font-size="13" fill="#273b45" text-anchor="middle">overflow crest</text><text x="150" y="104" font-size="14" fill="#287aab" text-anchor="middle">reservoir below the crest</text><rect x="330" y="262" width="154" height="16" fill="#d8edf7" stroke="#273b45" stroke-width="1.5"/><rect x="336" y="254" width="8" height="32" fill="#466d89" stroke="#273b45" stroke-width="1"/><line x1="486" y1="270" x2="551.2" y2="270" stroke="#287aab" stroke-width="3"/><polygon points="560,270 549,274.5 549,265.5" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><text x="610" y="296" font-size="14" fill="#287aab" text-anchor="middle">routine release</text><line x1="20" y1="330" x2="700" y2="330" stroke="#273b45" stroke-width="2"/><text x="30" y="348" font-size="13" fill="#273b45" text-anchor="start">datum</text><circle cx="300" cy="294" r="6" fill="#b98232" stroke="#273b45" stroke-width="2"/><line x1="200" y1="294" x2="294" y2="294" stroke="#647780" stroke-width="1" stroke-dasharray="3 3"/><line x1="200" y1="114" x2="200" y2="294" stroke="#647780" stroke-width="1.5"/><line x1="207" y1="114" x2="193" y2="114" stroke="#647780" stroke-width="1.5"/><line x1="207" y1="294" x2="193" y2="294" stroke="#647780" stroke-width="1.5"/><text x="192" y="210" font-size="14" fill="#647780" text-anchor="end">p/ρg = 10 m</text><line x1="240" y1="294" x2="240" y2="330" stroke="#647780" stroke-width="1.5"/><line x1="247" y1="294" x2="233" y2="294" stroke="#647780" stroke-width="1.5"/><line x1="247" y1="330" x2="233" y2="330" stroke="#647780" stroke-width="1.5"/><text x="232" y="318" font-size="13" fill="#647780" text-anchor="end">zs = 2 m</text><text x="600" y="140" font-size="16" fill="#273b45" text-anchor="middle">zws = zs + p/ρg</text><text x="600" y="168" font-size="15" fill="#273b45" text-anchor="middle">p = 98.1 kPa → 10 m</text><text x="600" y="196" font-size="15" fill="#287aab" text-anchor="middle">zws = 2 + 10 = 12 m</text><text x="600" y="224" font-size="13" fill="#647780" text-anchor="middle">use gauge pressure;</text><text x="600" y="244" font-size="13" fill="#647780" text-anchor="middle">correct absolute readings</text><text x="360" y="372" font-size="14" fill="#273b45" text-anchor="middle">Spillway routes floods; a gated outlet makes routine releases below the crest</text><text x="360" y="396" font-size="13" fill="#647780" text-anchor="middle">Foundation drains and a closed power intake release nothing downstream</text></g></svg>