<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Gradual against sudden loading of a spring</title><desc id="desc">A suddenly applied 2 kN force on a 100 kN/m spring overshoots to twice the static displacement, storing four times the energy of gradual loading at that peak.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="100" y1="320" x2="466" y2="320" stroke="#647780" stroke-width="2"/><polygon points="474,320 464,324 464,316" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><line x1="100" y1="320" x2="100" y2="64" stroke="#647780" stroke-width="2"/><polygon points="100,56 104,66 96,66" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><text x="280" y="360" font-size="16" fill="#273b45" text-anchor="middle">Displacement, m</text><text x="106" y="46" font-size="16" fill="#273b45" text-anchor="start">Spring force, kN</text><polygon points="100,320 388,320 388,120" fill="#f5ead8" stroke="none" stroke-width="2" stroke-linejoin="round"/><polygon points="100,320 244,320 244,220" fill="#deeee6" stroke="#2b7b61" stroke-width="1.5" stroke-linejoin="round"/><line x1="100" y1="320" x2="424" y2="95" stroke="#287aab" stroke-width="3"/><line x1="100" y1="220" x2="388" y2="220" stroke="#b64f4f" stroke-width="2" stroke-dasharray="8 5"/><text x="394" y="225" font-size="14" fill="#b64f4f" text-anchor="start">P = 2 kN</text><line x1="244" y1="320" x2="244" y2="220" stroke="#647780" stroke-width="1.2" stroke-dasharray="4 4"/><text x="244" y="338" font-size="13" fill="#647780" text-anchor="middle">0.02</text><line x1="388" y1="320" x2="388" y2="120" stroke="#647780" stroke-width="1.2" stroke-dasharray="4 4"/><text x="388" y="338" font-size="13" fill="#647780" text-anchor="middle">0.04</text><text x="200.8" y="302.5" font-size="14" fill="#2b7b61" text-anchor="middle">20 J</text><text x="330.4" y="280" font-size="15" fill="#b98232" text-anchor="middle">80 J</text><text x="490" y="110" font-size="15" fill="#273b45" text-anchor="start">k = 100 kN/m</text><text x="490" y="144" font-size="14" fill="#273b45" text-anchor="start">Gradual: δ = P/k = 0.02 m</text><text x="490" y="170" font-size="14" fill="#2b7b61" text-anchor="start">U = 20 J</text><text x="490" y="210" font-size="14" fill="#273b45" text-anchor="start">Sudden: δmax = 2P/k = 0.04 m</text><text x="490" y="236" font-size="14" fill="#b98232" text-anchor="start">U max = 80 J, stress × 2</text><text x="490" y="284" font-size="13" fill="#647780" text-anchor="start">Transient peak of an</text><text x="490" y="302" font-size="13" fill="#647780" text-anchor="start">undamped model</text></g></svg>