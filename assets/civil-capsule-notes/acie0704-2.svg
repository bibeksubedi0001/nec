<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Scour depth measured below the high flood level</title><desc id="desc">Lacey scour depth is measured below HFL: 5 m below RL 100 puts the scoured bed at RL 95, 2 m below an existing bed at RL 97. At a right-angle bend, twice a 3.0 m mean depth below HFL 104.0 gives RL 98.0.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><text x="360" y="36" font-size="16" fill="#273b45" text-anchor="middle">Scour depth is measured below HFL, not below the bed</text><polygon points="20,60 130,60 180,200 540,200 590,60 700,60 700,310 20,310" fill="#f0e6d4" stroke="none" stroke-width="2" stroke-linejoin="round"/><polygon points="137,80 583,80 540,200 180,200" fill="#d8edf7" stroke="none" stroke-width="2" stroke-linejoin="round"/><path d="M20 60 L130 60 L180 200 L540 200 L590 60 L700 60" stroke="#273b45" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="130" y1="80" x2="600" y2="80" stroke="#287aab" stroke-width="2"/><path d="M180 200 L230 280 L490 280 L540 200" stroke="#b64f4f" stroke-width="2.5" fill="none" stroke-dasharray="7 4" stroke-linejoin="round" stroke-linecap="round"/><text x="600" y="85" font-size="14" fill="#287aab" text-anchor="start">HFL RL 100.0</text><text x="548" y="214" font-size="14" fill="#273b45" text-anchor="start">bed RL 97.0</text><text x="498" y="294" font-size="14" fill="#b64f4f" text-anchor="start">scour bed RL 95.0</text><line x1="260" y1="80" x2="260" y2="280" stroke="#647780" stroke-width="1.5"/><line x1="267" y1="80" x2="253" y2="80" stroke="#647780" stroke-width="1.5"/><line x1="267" y1="280" x2="253" y2="280" stroke="#647780" stroke-width="1.5"/><text x="250" y="186" font-size="15" fill="#647780" text-anchor="end">D = 5 m</text><line x1="420" y1="200" x2="420" y2="280" stroke="#647780" stroke-width="1.5"/><line x1="427" y1="200" x2="413" y2="200" stroke="#647780" stroke-width="1.5"/><line x1="427" y1="280" x2="413" y2="280" stroke="#647780" stroke-width="1.5"/><text x="430" y="246" font-size="15" fill="#647780" text-anchor="start">Δz = 2 m</text><text x="360" y="334" font-size="14" fill="#273b45" text-anchor="middle">RL scour = HFL − D = 100 − 5 = 95 m; extra lowering = 97 − 95 = 2 m</text><text x="360" y="358" font-size="13" fill="#273b45" text-anchor="middle">Right-angle bend (IRC 89): Dmax = 2 × 3.0 = 6.0 m below HFL 104.0 → RL 98.0</text><text x="360" y="382" font-size="13" fill="#647780" text-anchor="middle">Subtracting D from the old bed would count the flow depth twice</text></g></svg>