<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Channelised junction and rotary weaving</title><desc id="desc">Channelisation guides vehicles along defined paths with islands, medians and turning lanes, without vertical separation. A rotary replaces direct crossings with gradual weaving along a shared length.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><text x="180" y="30" font-size="15" fill="#273b45" text-anchor="middle">Channelised junction</text><rect x="20" y="170" width="320" height="60" fill="#e4e8e9" stroke="none" stroke-width="2"/><rect x="150" y="40" width="60" height="290" fill="#e4e8e9" stroke="none" stroke-width="2"/><polygon points="212,168 252,168 212,134" fill="#deeee6" stroke="#2b7b61" stroke-width="1.5" stroke-linejoin="round"/><polygon points="148,168 108,168 148,134" fill="#deeee6" stroke="#2b7b61" stroke-width="1.5" stroke-linejoin="round"/><polygon points="212,232 252,232 212,266" fill="#deeee6" stroke="#2b7b61" stroke-width="1.5" stroke-linejoin="round"/><polygon points="148,232 108,232 148,266" fill="#deeee6" stroke="#2b7b61" stroke-width="1.5" stroke-linejoin="round"/><rect x="60" y="196" width="50" height="8" rx="4" fill="#deeee6" stroke="#2b7b61" stroke-width="1.5"/><rect x="250" y="196" width="50" height="8" rx="4" fill="#deeee6" stroke="#2b7b61" stroke-width="1.5"/><path d="M40 218 Q150 218 166 320" stroke="#287aab" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="166,320 159.85,309.83 168.74,308.44" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><text x="180" y="352" font-size="13" fill="#273b45" text-anchor="middle">islands, medians and turning lanes</text><text x="180" y="374" font-size="13" fill="#647780" text-anchor="middle">define paths; no vertical separation</text><line x1="360" y1="20" x2="360" y2="390" stroke="#b8c8ce" stroke-width="1.5" stroke-dasharray="6 5"/><text x="530" y="30" font-size="15" fill="#273b45" text-anchor="middle">Rotary</text><rect x="380" y="178" width="320" height="44" fill="#e4e8e9" stroke="none" stroke-width="2"/><rect x="508" y="50" width="44" height="280" fill="#e4e8e9" stroke="none" stroke-width="2"/><circle cx="530" cy="200" r="90" fill="none" stroke="#e4e8e9" stroke-width="44"/><circle cx="530" cy="200" r="60" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><path d="M545.63 111.37 A90 90 0 0 1 618.63 184.37" stroke="#b64f4f" stroke-width="5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="650" y="104" font-size="13" fill="#b64f4f" text-anchor="middle">weaving section</text><path d="M514.37 288.63 A90 90 0 0 1 441.37 215.63" stroke="#287aab" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="540" y="352" font-size="13" fill="#273b45" text-anchor="middle">gradual, shallow lateral exchange</text><text x="540" y="374" font-size="13" fill="#647780" text-anchor="middle">30 km/h target shapes geometry; not a legal limit</text></g></svg>