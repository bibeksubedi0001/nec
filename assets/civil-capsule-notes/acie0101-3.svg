<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Two independent ways to classify stone</title><desc id="desc">Origin (rows) and chemical composition (columns) are separate bases: quartzite is metamorphic by origin and siliceous by composition.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><text x="447" y="26" font-size="16" fill="#647780" text-anchor="middle">Chemical composition</text><text x="96" y="80" font-size="17" fill="#647780" text-anchor="middle">Origin</text><rect x="184" y="38" width="170" height="58" rx="6" fill="#d6dfe3" stroke="#647780" stroke-width="1.5"/><text x="269" y="62" font-size="18" fill="#273b45" text-anchor="middle">Siliceous</text><text x="269" y="86" font-size="15" fill="#647780" text-anchor="middle">silica-rich</text><rect x="362" y="38" width="170" height="58" rx="6" fill="#d6dfe3" stroke="#647780" stroke-width="1.5"/><text x="447" y="62" font-size="18" fill="#273b45" text-anchor="middle">Calcareous</text><text x="447" y="86" font-size="15" fill="#647780" text-anchor="middle">carbonate-rich</text><rect x="540" y="38" width="170" height="58" rx="6" fill="#d6dfe3" stroke="#647780" stroke-width="1.5"/><text x="625" y="62" font-size="18" fill="#273b45" text-anchor="middle">Argillaceous</text><text x="625" y="86" font-size="15" fill="#647780" text-anchor="middle">clay-rich</text><rect x="20" y="108" width="152" height="86" rx="6" fill="#d6dfe3" stroke="#647780" stroke-width="1.5"/><text x="96" y="158" font-size="18" fill="#273b45" text-anchor="middle">Igneous</text><rect x="184" y="108" width="170" height="86" rx="6" fill="#ffffff" stroke="#b8c8ce" stroke-width="1.5"/><text x="269" y="158" font-size="19" fill="#273b45" text-anchor="middle">Granite</text><rect x="362" y="108" width="170" height="86" rx="6" fill="#f2f5f6" stroke="#b8c8ce" stroke-width="1.5"/><text x="447" y="158" font-size="19" fill="#b8c8ce" text-anchor="middle">—</text><rect x="540" y="108" width="170" height="86" rx="6" fill="#f2f5f6" stroke="#b8c8ce" stroke-width="1.5"/><text x="625" y="158" font-size="19" fill="#b8c8ce" text-anchor="middle">—</text><rect x="20" y="202" width="152" height="86" rx="6" fill="#d6dfe3" stroke="#647780" stroke-width="1.5"/><text x="96" y="252" font-size="18" fill="#273b45" text-anchor="middle">Sedimentary</text><rect x="184" y="202" width="170" height="86" rx="6" fill="#ffffff" stroke="#b8c8ce" stroke-width="1.5"/><text x="269" y="252" font-size="19" fill="#273b45" text-anchor="middle">Sandstone</text><rect x="362" y="202" width="170" height="86" rx="6" fill="#ffffff" stroke="#b8c8ce" stroke-width="1.5"/><text x="447" y="252" font-size="19" fill="#273b45" text-anchor="middle">Limestone</text><rect x="540" y="202" width="170" height="86" rx="6" fill="#ffffff" stroke="#b8c8ce" stroke-width="1.5"/><text x="625" y="252" font-size="19" fill="#273b45" text-anchor="middle">Shale</text><rect x="20" y="296" width="152" height="86" rx="6" fill="#d6dfe3" stroke="#647780" stroke-width="1.5"/><text x="96" y="346" font-size="18" fill="#273b45" text-anchor="middle">Metamorphic</text><rect x="184" y="296" width="170" height="86" rx="6" fill="#deeee6" stroke="#2b7b61" stroke-width="2.5"/><text x="269" y="346" font-size="19" fill="#273b45" text-anchor="middle">Quartzite</text><rect x="362" y="296" width="170" height="86" rx="6" fill="#ffffff" stroke="#b8c8ce" stroke-width="1.5"/><text x="447" y="346" font-size="19" fill="#273b45" text-anchor="middle">Marble</text><rect x="540" y="296" width="170" height="86" rx="6" fill="#ffffff" stroke="#b8c8ce" stroke-width="1.5"/><text x="625" y="346" font-size="19" fill="#273b45" text-anchor="middle">Slate</text></g></svg>