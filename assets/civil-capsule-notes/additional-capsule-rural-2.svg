<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Orienting a long animal house</title><desc id="desc">In a hot, sunny, low-latitude region a long animal house commonly runs east-west, so its long walls face north and south and the low morning and evening sun falls mainly on the short end walls.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><rect x="200" y="170" width="320" height="90" fill="#f0e6d4" stroke="#273b45" stroke-width="2.5"/><text x="360" y="222" font-size="15" fill="#273b45" text-anchor="middle">long axis east-west</text><text x="360" y="160" font-size="13" fill="#273b45" text-anchor="middle">long wall faces north</text><text x="360" y="282" font-size="13" fill="#273b45" text-anchor="middle">long wall faces south</text><circle cx="70" cy="200" r="20" fill="#f5ead8" stroke="#b98232" stroke-width="2"/><circle cx="650" cy="200" r="20" fill="#f5ead8" stroke="#b98232" stroke-width="2"/><line x1="94" y1="180" x2="187.6" y2="178.13" stroke="#b98232" stroke-width="2"/><polygon points="194,178 186.07,181.66 185.93,174.66" fill="#b98232" stroke="#b98232" stroke-width="1.5" stroke-linejoin="round"/><line x1="626" y1="180" x2="532.4" y2="178.13" stroke="#b98232" stroke-width="2"/><polygon points="526,178 534.07,174.66 533.93,181.66" fill="#b98232" stroke="#b98232" stroke-width="1.5" stroke-linejoin="round"/><line x1="94" y1="200" x2="187.63" y2="209.36" stroke="#b98232" stroke-width="2"/><polygon points="194,210 185.69,212.69 186.39,205.72" fill="#b98232" stroke="#b98232" stroke-width="1.5" stroke-linejoin="round"/><line x1="626" y1="200" x2="532.37" y2="209.36" stroke="#b98232" stroke-width="2"/><polygon points="526,210 533.61,205.72 534.31,212.69" fill="#b98232" stroke="#b98232" stroke-width="1.5" stroke-linejoin="round"/><line x1="94" y1="220" x2="187.75" y2="240.62" stroke="#b98232" stroke-width="2"/><polygon points="194,242 185.43,243.7 186.94,236.86" fill="#b98232" stroke="#b98232" stroke-width="1.5" stroke-linejoin="round"/><line x1="626" y1="220" x2="532.25" y2="240.62" stroke="#b98232" stroke-width="2"/><polygon points="526,242 533.06,236.86 534.57,243.7" fill="#b98232" stroke="#b98232" stroke-width="1.5" stroke-linejoin="round"/><text x="80" y="248" font-size="13" fill="#273b45" text-anchor="middle">evening sun (west)</text><text x="640" y="248" font-size="13" fill="#273b45" text-anchor="middle">morning sun (east)</text><line x1="640" y1="110" x2="640" y2="64.8" stroke="#273b45" stroke-width="2.5"/><polygon points="640,56 644.5,67 635.5,67" fill="#273b45" stroke="#273b45" stroke-width="1.5" stroke-linejoin="round"/><text x="640" y="48" font-size="15" fill="#273b45" text-anchor="middle">N</text><text x="360" y="340" font-size="15" fill="#273b45" text-anchor="middle">Hot, sunny, low latitude: run the long axis east-west</text><text x="360" y="364" font-size="13" fill="#647780" text-anchor="middle">Still assess wind, latitude, shading, roof form and drainage</text></g></svg>