<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Risk assessment steps, and noise from a treatment plant</title><desc id="desc">Hazard identification, dose-response, exposure assessment and risk characterisation are assessment steps; risk management is the policy decision. Blowers, pumps and generators make plant noise a real impact.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><rect x="20" y="50" width="155" height="60" rx="8" fill="#e6f1f8" stroke="#287aab" stroke-width="2"/><text x="97.5" y="76.25" font-size="15" fill="#273b45" text-anchor="middle"><tspan x="97.5" dy="0">Hazard</tspan><tspan x="97.5" dy="18.3">identification</tspan></text><rect x="195" y="50" width="155" height="60" rx="8" fill="#f5ead8" stroke="#b98232" stroke-width="2"/><text x="272.5" y="76.25" font-size="15" fill="#273b45" text-anchor="middle"><tspan x="272.5" dy="0">Toxicity /</tspan><tspan x="272.5" dy="18.3">dose-response</tspan></text><line x1="177" y1="80" x2="186.6" y2="80" stroke="#647780" stroke-width="2"/><polygon points="193,80 185,83.5 185,76.5" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><rect x="370" y="50" width="155" height="60" rx="8" fill="#e6f1f8" stroke="#287aab" stroke-width="2"/><text x="447.5" y="76.25" font-size="15" fill="#273b45" text-anchor="middle"><tspan x="447.5" dy="0">Exposure</tspan><tspan x="447.5" dy="18.3">assessment</tspan></text><line x1="352" y1="80" x2="361.6" y2="80" stroke="#647780" stroke-width="2"/><polygon points="368,80 360,83.5 360,76.5" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><rect x="545" y="50" width="155" height="60" rx="8" fill="#e6f1f8" stroke="#287aab" stroke-width="2"/><text x="622.5" y="76.25" font-size="15" fill="#273b45" text-anchor="middle"><tspan x="622.5" dy="0">Risk</tspan><tspan x="622.5" dy="18.3">characterisation</tspan></text><line x1="527" y1="80" x2="536.6" y2="80" stroke="#647780" stroke-width="2"/><polygon points="543,80 535,83.5 535,76.5" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><text x="272" y="132" font-size="13" fill="#b98232" text-anchor="middle">how much does what harm</text><line x1="622" y1="112" x2="622" y2="143.6" stroke="#647780" stroke-width="2"/><polygon points="622,150 618.5,142 625.5,142" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><rect x="545" y="152" width="155" height="50" rx="8" fill="#f5ead8" stroke="#b98232" stroke-width="2" stroke-dasharray="6 4"/><text x="622" y="172" font-size="14" fill="#273b45" text-anchor="middle">Risk management</text><text x="622" y="192" font-size="13" fill="#647780" text-anchor="middle">(policy decision)</text><line x1="70" y1="330" x2="316" y2="330" stroke="#647780" stroke-width="2"/><polygon points="324,330 314,334 314,326" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><line x1="70" y1="330" x2="70" y2="194" stroke="#647780" stroke-width="2"/><polygon points="70,186 74,196 66,196" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><text x="190" y="356" font-size="14" fill="#273b45" text-anchor="middle">dose × duration</text><text x="76" y="176" font-size="14" fill="#273b45" text-anchor="start">harm</text><path d="M70 329.68 L73 329.63 L76 329.57 L79 329.5 L82 329.42 L85 329.32 L88 329.21 L91 329.09 L94 328.94 L97 328.77 L100 328.57 L103 328.34 L106 328.08 L109 327.77 L112 327.42 L115 327.01 L118 326.54 L121 326 L124 325.38 L127 324.66 L130 323.83 L133 322.89 L136 321.81 L139 320.58 L142 319.19 L145 317.6 L148 315.82 L151 313.81 L154 311.56 L157 309.06 L160 306.28 L163 303.24 L166 299.91 L169 296.3 L172 292.42 L175 288.29 L178 283.94 L181 279.38 L184 274.68 L187 269.87 L190 265 L193 260.13 L196 255.32 L199 250.62 L202 246.06 L205 241.71 L208 237.58 L211 233.7 L214 230.09 L217 226.76 L220 223.72 L223 220.94 L226 218.44 L229 216.19 L232 214.18 L235 212.4 L238 210.81 L241 209.42 L244 208.19 L247 207.11 L250 206.17 L253 205.34 L256 204.62 L259 204 L262 203.46 L265 202.99 L268 202.58 L271 202.23 L274 201.92 L277 201.66 L280 201.43 L283 201.23 L286 201.06 L289 200.91 L292 200.79 L295 200.68 L298 200.58 L301 200.5 L304 200.43 L307 200.37 L310 200.32" stroke="#b64f4f" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="195" y="396" font-size="13" fill="#647780" text-anchor="middle">severity and probability rise with dose</text><rect x="390" y="250" width="130" height="80" rx="8" fill="#d6dfe3" stroke="#273b45" stroke-width="2"/><text x="455" y="277.96" font-size="14" fill="#273b45" text-anchor="middle"><tspan x="455" dy="0">blowers,</tspan><tspan x="455" dy="17.08">pumps,</tspan><tspan x="455" dy="17.08">generators</tspan></text><path d="M536.85 275.86 A22 22 0 0 1 536.85 304.14" stroke="#b64f4f" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M549.11 265.57 A38 38 0 0 1 549.11 314.43" stroke="#b64f4f" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M561.37 255.29 A54 54 0 0 1 561.37 324.71" stroke="#b64f4f" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><rect x="620" y="285" width="40" height="35" fill="#ffffff" stroke="#273b45" stroke-width="1.5"/><polygon points="614,285 640,264 666,285" fill="#e4e8e9" stroke="#273b45" stroke-width="1.5" stroke-linejoin="round"/><text x="640" y="342" font-size="14" fill="#273b45" text-anchor="middle">receptor</text><text x="545" y="376" font-size="14" fill="#273b45" text-anchor="middle">noise and vibration belong in scoping</text><text x="545" y="398" font-size="13" fill="#647780" text-anchor="middle">buried gravity sewers contribute little</text></g></svg>