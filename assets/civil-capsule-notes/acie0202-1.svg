<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Hydraulic gradient along a seepage path</title><desc id="desc">Water flows from higher to lower total head; the head lost divided by the path length is the gradient, and Darcy's law gives q = kiA through the gross area.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="60" y1="330" x2="660" y2="330" stroke="#647780" stroke-width="1.5" stroke-dasharray="8 6"/><text x="640" y="350" font-size="15" fill="#647780" text-anchor="end">datum</text><rect x="170" y="220" width="380" height="60" fill="#f0e6d4" stroke="#b98232" stroke-width="2.5"/><rect x="184" y="90" width="12" height="130" fill="#d8edf7" stroke="#287aab" stroke-width="2"/><rect x="524" y="160" width="12" height="60" fill="#d8edf7" stroke="#287aab" stroke-width="2"/><line x1="176" y1="90" x2="640" y2="90" stroke="#287aab" stroke-width="1.2" stroke-dasharray="4 5"/><line x1="516" y1="160" x2="640" y2="160" stroke="#287aab" stroke-width="1.2" stroke-dasharray="4 5"/><line x1="260" y1="250" x2="451.2" y2="250" stroke="#287aab" stroke-width="3"/><polygon points="460,250 449,254.5 449,245.5" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><text x="360" y="238" font-size="16" fill="#273b45" text-anchor="middle">Soil, gross area A</text><line x1="150" y1="330" x2="150" y2="90" stroke="#647780" stroke-width="1.5"/><line x1="143" y1="330" x2="157" y2="330" stroke="#647780" stroke-width="1.5"/><line x1="143" y1="90" x2="157" y2="90" stroke="#647780" stroke-width="1.5"/><text x="142" y="216" font-size="18" fill="#647780" text-anchor="end">h1</text><line x1="572" y1="330" x2="572" y2="160" stroke="#647780" stroke-width="1.5"/><line x1="565" y1="330" x2="579" y2="330" stroke="#647780" stroke-width="1.5"/><line x1="565" y1="160" x2="579" y2="160" stroke="#647780" stroke-width="1.5"/><text x="582" y="251" font-size="18" fill="#647780" text-anchor="start">h2</text><line x1="630" y1="90" x2="630" y2="160" stroke="#647780" stroke-width="1.5"/><line x1="637" y1="90" x2="623" y2="90" stroke="#647780" stroke-width="1.5"/><line x1="637" y1="160" x2="623" y2="160" stroke="#647780" stroke-width="1.5"/><text x="640" y="131" font-size="18" fill="#647780" text-anchor="start">Δh</text><line x1="190" y1="300" x2="530" y2="300" stroke="#647780" stroke-width="1.5"/><line x1="190" y1="293" x2="190" y2="307" stroke="#647780" stroke-width="1.5"/><line x1="530" y1="293" x2="530" y2="307" stroke="#647780" stroke-width="1.5"/><text x="360" y="316" font-size="16" fill="#647780" text-anchor="middle">L, path length</text><text x="360" y="372" font-size="18" fill="#273b45" text-anchor="middle">i = Δh / L,   q = k i A</text><text x="360" y="400" font-size="15" fill="#647780" text-anchor="middle">v = k i over the gross area;  vs = v / ne in the pores</text></g></svg>