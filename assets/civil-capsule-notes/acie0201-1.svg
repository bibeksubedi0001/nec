<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Core cutter and density bottle</title><desc id="desc">A cutter of known volume gives bulk density M/V, converted to dry density with the water content; a density bottle compares dry solids with the water they displace.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="370" y1="36" x2="370" y2="400" stroke="#b8c8ce" stroke-width="1.5" stroke-dasharray="6 6"/><polygon points="20,170 360,170 360,300 20,300" fill="#f0e6d4" stroke="none" stroke-width="2" stroke-linejoin="round"/><line x1="20" y1="170" x2="360" y2="170" stroke="#647780" stroke-width="2"/><line x1="26" y1="171" x2="16" y2="182" stroke="#647780" stroke-width="1.4"/><line x1="40" y1="171" x2="30" y2="182" stroke="#647780" stroke-width="1.4"/><line x1="54" y1="171" x2="44" y2="182" stroke="#647780" stroke-width="1.4"/><line x1="68" y1="171" x2="58" y2="182" stroke="#647780" stroke-width="1.4"/><line x1="82" y1="171" x2="72" y2="182" stroke="#647780" stroke-width="1.4"/><line x1="96" y1="171" x2="86" y2="182" stroke="#647780" stroke-width="1.4"/><line x1="110" y1="171" x2="100" y2="182" stroke="#647780" stroke-width="1.4"/><line x1="124" y1="171" x2="114" y2="182" stroke="#647780" stroke-width="1.4"/><line x1="138" y1="171" x2="128" y2="182" stroke="#647780" stroke-width="1.4"/><line x1="152" y1="171" x2="142" y2="182" stroke="#647780" stroke-width="1.4"/><line x1="166" y1="171" x2="156" y2="182" stroke="#647780" stroke-width="1.4"/><line x1="180" y1="171" x2="170" y2="182" stroke="#647780" stroke-width="1.4"/><line x1="194" y1="171" x2="184" y2="182" stroke="#647780" stroke-width="1.4"/><line x1="208" y1="171" x2="198" y2="182" stroke="#647780" stroke-width="1.4"/><line x1="222" y1="171" x2="212" y2="182" stroke="#647780" stroke-width="1.4"/><line x1="236" y1="171" x2="226" y2="182" stroke="#647780" stroke-width="1.4"/><line x1="250" y1="171" x2="240" y2="182" stroke="#647780" stroke-width="1.4"/><line x1="264" y1="171" x2="254" y2="182" stroke="#647780" stroke-width="1.4"/><line x1="278" y1="171" x2="268" y2="182" stroke="#647780" stroke-width="1.4"/><line x1="292" y1="171" x2="282" y2="182" stroke="#647780" stroke-width="1.4"/><line x1="306" y1="171" x2="296" y2="182" stroke="#647780" stroke-width="1.4"/><line x1="320" y1="171" x2="310" y2="182" stroke="#647780" stroke-width="1.4"/><line x1="334" y1="171" x2="324" y2="182" stroke="#647780" stroke-width="1.4"/><line x1="348" y1="171" x2="338" y2="182" stroke="#647780" stroke-width="1.4"/><rect x="130" y="120" width="100" height="170" fill="#e7d6b9" stroke="#466d89" stroke-width="3"/><rect x="140" y="90" width="80" height="30" fill="#d6dfe3" stroke="#647780" stroke-width="2"/><line x1="180" y1="36" x2="180" y2="77.2" stroke="#b64f4f" stroke-width="3"/><polygon points="180,86 175.5,75 184.5,75" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="232" y="108" font-size="16" fill="#273b45" text-anchor="start">Dolly</text><text x="242" y="230" font-size="16" fill="#273b45" text-anchor="start">Cutter,</text><text x="242" y="252" font-size="16" fill="#273b45" text-anchor="start">volume V</text><text x="185" y="334" font-size="16" fill="#273b45" text-anchor="middle">ρ = M / V = 1800 / 1000 = 1.80</text><text x="185" y="362" font-size="16" fill="#273b45" text-anchor="middle">ρd = ρ / (1 + w) = 1.80 / 1.20 = 1.50</text><text x="185" y="390" font-size="15" fill="#647780" text-anchor="middle">g/cm³, with w = 0.20</text><rect x="522" y="70" width="36" height="70" fill="#d8edf7" stroke="#287aab" stroke-width="2"/><path d="M522 140 C440 160 440 310 540 312 C640 310 640 160 558 140 Z" stroke="#287aab" stroke-width="2" fill="#d8edf7" stroke-linejoin="round" stroke-linecap="round"/><circle cx="508" cy="300" r="6" fill="#f0e6d4" stroke="#b98232" stroke-width="1.2"/><circle cx="520" c