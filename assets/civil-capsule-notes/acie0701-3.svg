<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Gravitational, capillary and hygroscopic soil water</title><desc id="desc">Gravitational water drains from large pores; capillary water is held by meniscus suction in fine pores and is largely available between field capacity and wilting; hygroscopic films are unavailable.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><circle cx="90" cy="110" r="32" fill="#f0e6d4" stroke="#273b45" stroke-width="2"/><circle cx="178" cy="110" r="32" fill="#f0e6d4" stroke="#273b45" stroke-width="2"/><line x1="134" y1="66" x2="134" y2="156.2" stroke="#287aab" stroke-width="3"/><polygon points="134,165 129.5,154 138.5,154" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><text x="134" y="190" font-size="14" fill="#287aab" text-anchor="middle">large pore: gravitational</text><rect x="220" y="180" width="100" height="20" fill="#d8edf7" stroke="none" stroke-width="2"/><line x1="220" y1="180" x2="320" y2="180" stroke="#287aab" stroke-width="2"/><rect x="263" y="108" width="12" height="72" fill="#d8edf7" stroke="none" stroke-width="2"/><line x1="262" y1="70" x2="262" y2="186" stroke="#273b45" stroke-width="2"/><line x1="276" y1="70" x2="276" y2="186" stroke="#273b45" stroke-width="2"/><path d="M263 108 Q269 117 275 108" stroke="#287aab" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="270" y="222" font-size="14" fill="#2b7b61" text-anchor="middle">fine pore: meniscus suction</text><circle cx="110" cy="280" r="36" fill="none" stroke="#287aab" stroke-width="4"/><circle cx="110" cy="280" r="30" fill="#f0e6d4" stroke="#273b45" stroke-width="2"/><text x="160" y="285" font-size="14" fill="#b64f4f" text-anchor="start">adsorbed film: hygroscopic</text><rect x="420" y="60" width="50" height="80" fill="#e6f1f8" stroke="#287aab" stroke-width="1.5"/><text x="480" y="105" font-size="14" fill="#287aab" text-anchor="start">gravitational: drains away</text><rect x="420" y="140" width="50" height="110" fill="#deeee6" stroke="#2b7b61" stroke-width="1.5"/><text x="480" y="200" font-size="14" fill="#2b7b61" text-anchor="start">capillary, available</text><rect x="420" y="250" width="50" height="50" fill="#f5ead8" stroke="#b98232" stroke-width="1.5"/><text x="480" y="280" font-size="14" fill="#b98232" text-anchor="start">capillary, held too tightly</text><rect x="420" y="300" width="50" height="30" fill="#f2dfdf" stroke="#b64f4f" stroke-width="1.5"/><text x="480" y="320" font-size="14" fill="#b64f4f" text-anchor="start">hygroscopic: unavailable</text><line x1="410" y1="60" x2="470" y2="60" stroke="#273b45" stroke-width="2"/><text x="404" y="65" font-size="14" fill="#273b45" text-anchor="end">saturation</text><line x1="410" y1="140" x2="470" y2="140" stroke="#273b45" stroke-width="2"/><text x="404" y="145" font-size="14" fill="#273b45" text-anchor="end">field capacity</text><line x1="410" y1="250" x2="470" y2="250" stroke="#273b45" stroke-width="2"/><text x="404" y="255" font-size="14" fill="#273b45" text-anchor="end">wilting point</text><line x1="410" y1="300" x2="470" y2="300" stroke="#273b45" stroke-width="2"/><text x="404" y="305" font-size="14" fill="#273b45" text-anchor="end">hygroscopic coeff.</text><text x="360" y="372" font-size="14" fill="#273b45" text-anchor="middle">Field capacity depends on pore-size distribution, not total porosity</text><text x="360" y="396" font-size="13" fill="#647780" text-anchor="middle">At wilting point some capillary water remains that roots cannot extract</text></g></svg>