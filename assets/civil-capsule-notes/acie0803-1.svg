<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Overflow sections, the dam axis and a cofferdam</title><desc id="desc">One dam can be classed by hydraulic role, structural action, material and service life. The dam axis is commonly the upstream crest line; a cofferdam temporarily excludes the river so work proceeds in the dry.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><text x="185" y="50" font-size="16" fill="#273b45" text-anchor="middle">Elevation: hydraulic role</text><polygon points="60,100 150,100 150,130 230,130 230,100 320,100 300,160 250,300 140,300 90,160" fill="#e4e8e9" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><rect x="150" y="122" width="80" height="8" fill="#d8edf7" stroke="#287aab" stroke-width="1"/><line x1="105" y1="100" x2="105" y2="270" stroke="#8a9aa3" stroke-width="1" stroke-dasharray="4 4"/><line x1="150" y1="130" x2="150" y2="270" stroke="#8a9aa3" stroke-width="1" stroke-dasharray="4 4"/><line x1="190" y1="100" x2="190" y2="270" stroke="#8a9aa3" stroke-width="1" stroke-dasharray="4 4"/><line x1="230" y1="130" x2="230" y2="270" stroke="#8a9aa3" stroke-width="1" stroke-dasharray="4 4"/><line x1="275" y1="100" x2="275" y2="270" stroke="#8a9aa3" stroke-width="1" stroke-dasharray="4 4"/><text x="100" y="88" font-size="14" fill="#273b45" text-anchor="middle">non-overflow</text><text x="280" y="88" font-size="14" fill="#273b45" text-anchor="middle">non-overflow</text><text x="190" y="170" font-size="14" fill="#287aab" text-anchor="middle">overflow</text><text x="190" y="330" font-size="13" fill="#647780" text-anchor="middle">joints between monoliths</text><line x1="355" y1="30" x2="355" y2="340" stroke="#b8c8ce" stroke-width="1.5" stroke-dasharray="6 5"/><text x="535" y="50" font-size="16" fill="#273b45" text-anchor="middle">Plan: axis and cofferdam</text><rect x="430" y="70" width="210" height="260" fill="#d8edf7" stroke="none" stroke-width="2"/><line x1="430" y1="70" x2="430" y2="330" stroke="#273b45" stroke-width="2"/><line x1="640" y1="70" x2="640" y2="330" stroke="#273b45" stroke-width="2"/><rect x="537" y="122" width="101" height="136" fill="#f0e6d4" stroke="none" stroke-width="2"/><rect x="430" y="170" width="210" height="40" fill="#e4e8e9" stroke="#273b45" stroke-width="1.5" opacity="0.9"/><line x1="410" y1="170" x2="660" y2="170" stroke="#b64f4f" stroke-width="2" stroke-dasharray="8 4"/><text x="395" y="164" font-size="13" fill="#b64f4f" text-anchor="middle">dam axis</text><path d="M640 120 L535 120 L535 260 L640 260" stroke="#b98232" stroke-width="5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="480" y1="80" x2="480" y2="141.2" stroke="#287aab" stroke-width="2.5"/><polygon points="480,150 475.5,139 484.5,139" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><text x="535" y="346" font-size="13" fill="#b98232" text-anchor="middle">cofferdam: work in the dry</text><text x="360" y="366" font-size="14" fill="#273b45" text-anchor="middle">Classes by role, action (gravity, arch, buttress), material and service life</text><text x="360" y="390" font-size="13" fill="#647780" text-anchor="middle">Contraction joints let arch monoliths shrink before any grouting</text></g></svg>