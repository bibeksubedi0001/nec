68 119.66 L473.75 118.42 L479.5 117.22 L485.25 116.04 L491 114.89 L496.75 113.77 L502.5 112.68 L508.25 111.62 L514 110.58 L519.75 109.57 L525.5 108.58 L531.25 107.62 L537 106.68 L542.75 105.76 L548.5 104.87 L554.25 104 L560 103.15" stroke="#b64f4f" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="568" y="108.15" font-size="15" fill="#b64f4f" text-anchor="start">T = 50 years</text><path d="M100 320 L105.75 316.88 L111.5 313.8 L117.25 310.75 L123 307.75 L128.75 304.78 L134.5 301.85 L140.25 298.95 L146 296.1 L151.75 293.27 L157.5 290.49 L163.25 287.73 L169 285.01 L174.75 282.33 L180.5 279.68 L186.25 277.06 L192 274.48 L197.75 271.92 L203.5 269.4 L209.25 266.91 L215 264.46 L220.75 262.03 L226.5 259.63 L232.25 257.26 L238 254.93 L243.75 252.62 L249.5 250.34 L255.25 248.09 L261 245.86 L266.75 243.67 L272.5 241.5 L278.25 239.36 L284 237.24 L289.75 235.16 L295.5 233.09 L301.25 231.06 L307 229.05 L312.75 227.06 L318.5 225.1 L324.25 223.16 L330 221.25 L335.75 219.36 L341.5 217.5 L347.25 215.66 L353 213.84 L358.75 212.04 L364.5 210.27 L370.25 208.52 L376 206.79 L381.75 205.08 L387.5 203.4 L393.25 201.73 L399 200.09 L404.75 198.46 L410.5 196.86 L416.25 195.27 L422 193.71 L427.75 192.17 L433.5 190.64 L439.25 189.13 L445 187.65 L450.75 186.18 L456.5 184.73 L462.25 183.3 L468 181.88 L473.75 180.48 L479.5 179.1 L485.25 177.74 L491 176.4 L496.75 175.07 L502.5 173.76 L508.25 172.46 L514 171.18 L519.75 169.92 L525.5 168.67 L531.25 167.44 L537 166.22 L542.75 165.02 L548.5 163.84 L554.25 162.66 L560 161.51" stroke="#287aab" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="568" y="166.51" font-size="15" fill="#287aab" text-anchor="start">T = 100 years</text><line x1="215" y1="320" x2="215" y2="220.87" stroke="#647780" stroke-width="1.2" stroke-dasharray="4 4"/><circle cx="215" cy="220.87" r="5" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><text x="205" y="200" font-size="15" fill="#b64f4f" text-anchor="end">P25 ≈ 0.40</text><text x="215" y="340" font-size="13" fill="#647780" text-anchor="middle">25</text><text x="330" y="340" font-size="13" fill="#647780" text-anchor="middle">50</text><text x="560" y="340" font-size="13" fill="#647780" text-anchor="middle">100</text><text x="92" y="200" font-size="13" fill="#647780" text-anchor="end">0.5</text><text x="92" y="75" font-size="13" fill="#647780" text-anchor="end">1.0</text><text x="340" y="270" font-size="17" fill="#273b45" text-anchor="start">Pn = 1 − (1 − 1/T)^n</text><text x="340" y="296" font-size="15" fill="#273b45" text-anchor="start">p = 1/T: a 2-year flood has p = 0.50</text><text x="360" y="404" font-size="14" fill="#273b45" text-anchor="middle">Quoted relation: Q2 = 1.8767 (A3000 + 1)^0.8783 = 107.15 m³/s for 99 km²</text></g></svg>