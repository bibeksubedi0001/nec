<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Reaction locus of a two-hinged semicircular arch</title><desc id="desc">For a moving point load the two reaction lines meet directly above the load at a constant height πR/2, so their intersection travels along a horizontal line.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><path d="M200 340 A160 160 0 0 1 520 340" stroke="#273b45" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="200,345 185,369 215,369" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><line x1="178" y1="372" x2="222" y2="372" stroke="#647780" stroke-width="2"/><polygon points="520,345 505,369 535,369" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><line x1="498" y1="372" x2="542" y2="372" stroke="#647780" stroke-width="2"/><circle cx="200" cy="340" r="6" fill="#ffffff" stroke="#273b45" stroke-width="2"/><circle cx="520" cy="340" r="6" fill="#ffffff" stroke="#273b45" stroke-width="2"/><line x1="280" y1="145.44" x2="280" y2="188.64" stroke="#b64f4f" stroke-width="3"/><polygon points="280,197.44 275.5,186.44 284.5,186.44" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="288" y="161.44" font-size="17" fill="#b64f4f" text-anchor="start">P</text><line x1="200" y1="340" x2="280" y2="88.67" stroke="#287aab" stroke-width="1.8" stroke-dasharray="7 5"/><line x1="520" y1="340" x2="280" y2="88.67" stroke="#287aab" stroke-width="1.8" stroke-dasharray="7 5"/><line x1="120" y1="88.67" x2="620" y2="88.67" stroke="#2b7b61" stroke-width="2" stroke-dasharray="10 6"/><circle cx="280" cy="88.67" r="5" fill="#287aab" stroke="#287aab" stroke-width="2"/><line x1="640" y1="340" x2="640" y2="88.67" stroke="#647780" stroke-width="1.5"/><line x1="633" y1="340" x2="647" y2="340" stroke="#647780" stroke-width="1.5"/><line x1="633" y1="88.67" x2="647" y2="88.67" stroke="#647780" stroke-width="1.5"/><text x="650" y="220.34" font-size="16" fill="#647780" text-anchor="start">πR/2</text><text x="130" y="78.67" font-size="14" fill="#2b7b61" text-anchor="start">locus of the intersection</text><text x="360" y="392" font-size="15" fill="#273b45" text-anchor="middle">Crown load: H = P/π, the same for any radius (constant EI, bending only)</text></g></svg>