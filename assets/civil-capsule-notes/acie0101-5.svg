<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Balancing clay and sand in brick earth</title><desc id="desc">Clay-rich earth shrinks and warps on drying, a controlled addition of clean sand gives a stable skeleton, and excess sand weakens cohesion.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="110" y1="64" x2="601.2" y2="64" stroke="#b98232" stroke-width="2.5"/><polygon points="610,64 599,68.5 599,59.5" fill="#b98232" stroke="#b98232" stroke-width="1.5" stroke-linejoin="round"/><text x="360" y="46" font-size="17" fill="#b98232" text-anchor="middle">Sand content increases</text><path d="M50 164 Q130 136 210 164 L212 228 Q130 206 48 228 Z" stroke="#b64f4f" stroke-width="2" fill="#f2dfdf" stroke-linejoin="round" stroke-linecap="round"/><path d="M104 172 L114 188 L106 204" stroke="#b64f4f" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M160 168 L150 184 L158 200" stroke="#b64f4f" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><rect x="280" y="156" width="160" height="70" fill="#f0e6d4" stroke="#b98232" stroke-width="2"/><rect x="510" y="156" width="160" height="70" fill="#fbfcfd" stroke="#647780" stroke-width="2" stroke-dasharray="6 6"/><circle cx="528" cy="244" r="4" fill="#f0e6d4" stroke="#647780" stroke-width="1"/><circle cx="556" cy="252" r="3" fill="#f0e6d4" stroke="#647780" stroke-width="1"/><circle cx="602" cy="246" r="4" fill="#f0e6d4" stroke="#647780" stroke-width="1"/><circle cx="640" cy="256" r="3" fill="#f0e6d4" stroke="#647780" stroke-width="1"/><circle cx="585" cy="262" r="3" fill="#f0e6d4" stroke="#647780" stroke-width="1"/><text x="130" y="300" font-size="19" fill="#273b45" text-anchor="middle">Too much clay</text><text x="130" y="326" font-size="16" fill="#647780" text-anchor="middle">shrinks, cracks, warps</text><text x="360" y="300" font-size="19" fill="#273b45" text-anchor="middle">Balanced</text><text x="360" y="326" font-size="16" fill="#647780" text-anchor="middle">clay with clean sand</text><text x="590" y="300" font-size="19" fill="#273b45" text-anchor="middle">Too much sand</text><text x="590" y="326" font-size="16" fill="#647780" text-anchor="middle">weak cohesion</text><text x="360" y="388" font-size="16" fill="#647780" text-anchor="middle">Sand is neither a binder nor a substitute for firing</text></g></svg>