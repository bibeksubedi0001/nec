<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Water held after gravity drainage</title><desc id="desc">Adsorbed film water clings to grain surfaces by molecular attraction, while capillary water is held in small pores by surface tension across curved menisci.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><circle cx="200" cy="180" r="87" fill="none" stroke="#287aab" stroke-width="2.5"/><circle cx="200" cy="180" r="80" fill="#f0e6d4" stroke="#b98232" stroke-width="2"/><circle cx="390" cy="200" r="87" fill="none" stroke="#287aab" stroke-width="2.5"/><circle cx="390" cy="200" r="80" fill="#f0e6d4" stroke="#b98232" stroke-width="2"/><circle cx="300" cy="344" r="63" fill="none" stroke="#287aab" stroke-width="2.5"/><circle cx="300" cy="344" r="56" fill="#f0e6d4" stroke="#b98232" stroke-width="2"/><path d="M270 141 Q295 168 329.6 147.5 L320 238.8 Q290 212 260.4 232.5 Z" stroke="#287aab" stroke-width="2" fill="#d8edf7" stroke-linejoin="round" stroke-linecap="round"/><text x="96" y="70" font-size="17" fill="#287aab" text-anchor="middle">Adsorbed film</text><line x1="116" y1="76" x2="150" y2="116" stroke="#287aab" stroke-width="1.2"/><text x="318" y="104" font-size="17" fill="#287aab" text-anchor="middle">Capillary water</text><line x1="318" y1="110" x2="298" y2="156" stroke="#287aab" stroke-width="1.2"/><text x="504" y="332" font-size="17" fill="#647780" text-anchor="middle">Air in the pore</text><text x="390" y="206" font-size="16" fill="#b98232" text-anchor="middle">grain</text><text x="200" y="186" font-size="16" fill="#b98232" text-anchor="middle">grain</text><text x="560" y="120" font-size="16" fill="#273b45" text-anchor="start">Both resist</text><text x="560" y="144" font-size="16" fill="#273b45" text-anchor="start">gravity drainage</text></g></svg>