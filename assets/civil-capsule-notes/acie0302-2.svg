<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Hydrostatic force on an inclined plane gate</title><desc id="desc">The resultant equals the centroid pressure times the area, but it acts at the centre of pressure, deeper than the centroid by IG sin²θ / (A h̄).</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><polygon points="60,80 536,80 240,330 60,330" fill="#d8edf7" stroke="none" stroke-width="2" stroke-linejoin="round"/><line x1="60" y1="80" x2="536" y2="80" stroke="#287aab" stroke-width="2"/><polygon points="112,68 128,68 120,80" fill="#287aab" stroke="none" stroke-width="2" stroke-linejoin="round"/><path d="M60 60 L60 330 L240 330" stroke="#273b45" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="240" y1="330" x2="560" y2="60" stroke="#273b45" stroke-width="3"/><line x1="304" y1="276" x2="438.4" y2="162.6" stroke="#466d89" stroke-width="7"/><line x1="267.37" y1="219.63" x2="306.27" y2="265.71" stroke="#647780" stroke-width="1.5"/><polygon points="310.4,270.6 302.56,266.74 307.91,262.23" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><line x1="297.85" y1="203.81" x2="331.87" y2="244.11" stroke="#647780" stroke-width="1.5"/><polygon points="336,249 328.16,245.14 333.51,240.63" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><line x1="328.32" y1="187.99" x2="357.47" y2="222.51" stroke="#647780" stroke-width="1.5"/><polygon points="361.6,227.4 353.76,223.54 359.11,219.03" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><line x1="358.8" y1="172.16" x2="383.07" y2="200.91" stroke="#647780" stroke-width="1.5"/><polygon points="387.2,205.8 379.36,201.94 384.71,197.43" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><line x1="389.28" y1="156.34" x2="408.67" y2="179.31" stroke="#647780" stroke-width="1.5"/><polygon points="412.8,184.2 404.96,180.34 410.31,175.83" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><line x1="412.13" y1="144.47" x2="427.87" y2="163.11" stroke="#647780" stroke-width="1.5"/><polygon points="432,168 424.16,164.14 429.51,159.63" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><path d="M267.37 219.63 L297.85 203.81 L328.32 187.99 L358.8 172.16 L389.28 156.34 L412.13 144.47" stroke="#647780" stroke-width="1.2" fill="none" stroke-dasharray="4 4" stroke-linejoin="round" stroke-linecap="round"/><line x1="300.84" y1="154.39" x2="356.44" y2="220.24" stroke="#b64f4f" stroke-width="3.5"/><polygon points="362.11,226.97 351.58,221.47 358.45,215.66" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="294.84" y="148.39" font-size="18" fill="#b64f4f" text-anchor="end">F</text><circle cx="371.2" cy="219.3" r="5" fill="#273b45" stroke="#273b45" stroke-width="2"/><circle cx="362.11" cy="226.97" r="5" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><text x="385.2" y="215.3" font-size="15" fill="#273b45" text-anchor="start">G, centroid</text><text x="378.11" y="252.97" font-size="15" fill="#b64f4f" text-anchor="start">P, centre of pressure</text><line x1="371.2" y1="219.3" x2="150" y2="219.3" stroke="#647780" stroke-width="1" stroke-dasharray="4 4"/><line x1="362.11" y1="226.97" x2="100" y2="226.97" stroke="#647780" stroke-width="1" stroke-dasharray="4 4"/><line x1="160" y1="80" x2="160" y2="219.3" stroke="#647780" stroke-width="1.5"/><line x1="167" y1="80" x2="153" y2="80" stroke="#647780" stroke-width="1.5"/><line x1="167" y1="219.3" x2="153" y2="219.3" stroke="#647780" stroke-width="1.5"/><text x="168" y="155.65" font-size="16" fill="#647780" text-anchor="start">h̄</text><line x1="110" y1="80" x2="110" y2="226.97" stroke="#647780" stroke-width="1.5"/><line x1="117" y1="80" x2="103" y2="80" stroke="#647780" stroke-width="1