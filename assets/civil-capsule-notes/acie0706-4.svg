<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Leaching with drainage versus flooding without an outlet</title><desc id="desc">Salts leave a saline, non-sodic soil only when good water carries them below the root zone and a working drain removes it. Flooding without an outlet raises the water table and salts reconcentrate at the surface.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><text x="185" y="36" font-size="15" fill="#2b7b61" text-anchor="middle">Controlled leaching + drainage</text><rect x="20" y="110" width="330" height="210" fill="#f0e6d4" stroke="none" stroke-width="2"/><line x1="20" y1="110" x2="350" y2="110" stroke="#273b45" stroke-width="2"/><line x1="20" y1="190" x2="350" y2="190" stroke="#2b7b61" stroke-width="1.5" stroke-dasharray="6 4"/><text x="28" y="184" font-size="13" fill="#2b7b61" text-anchor="start">root zone</text><line x1="100" y1="72" x2="100" y2="241.2" stroke="#287aab" stroke-width="2.5"/><polygon points="100,250 95.5,239 104.5,239" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><circle cx="110" cy="140" r="3" fill="#ffffff" stroke="#647780" stroke-width="1"/><circle cx="110" cy="175" r="3" fill="#ffffff" stroke="#647780" stroke-width="1"/><circle cx="110" cy="220" r="3" fill="#ffffff" stroke="#647780" stroke-width="1"/><line x1="180" y1="72" x2="180" y2="241.2" stroke="#287aab" stroke-width="2.5"/><polygon points="180,250 175.5,239 184.5,239" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><circle cx="190" cy="140" r="3" fill="#ffffff" stroke="#647780" stroke-width="1"/><circle cx="190" cy="175" r="3" fill="#ffffff" stroke="#647780" stroke-width="1"/><circle cx="190" cy="220" r="3" fill="#ffffff" stroke="#647780" stroke-width="1"/><line x1="260" y1="72" x2="260" y2="241.2" stroke="#287aab" stroke-width="2.5"/><polygon points="260,250 255.5,239 264.5,239" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><circle cx="270" cy="140" r="3" fill="#ffffff" stroke="#647780" stroke-width="1"/><circle cx="270" cy="175" r="3" fill="#ffffff" stroke="#647780" stroke-width="1"/><circle cx="270" cy="220" r="3" fill="#ffffff" stroke="#647780" stroke-width="1"/><text x="185" y="64" font-size="13" fill="#287aab" text-anchor="middle">good-quality water</text><line x1="20" y1="280" x2="350" y2="280" stroke="#466d89" stroke-width="3"/><circle cx="180" cy="280" r="10" fill="#ffffff" stroke="#466d89" stroke-width="3"/><line x1="290" y1="280" x2="337.2" y2="280" stroke="#466d89" stroke-width="3"/><polygon points="346,280 335,284.5 335,275.5" fill="#466d89" stroke="#466d89" stroke-width="1.5" stroke-linejoin="round"/><text x="185" y="308" font-size="13" fill="#273b45" text-anchor="middle">drain and outlet remove saline water</text><line x1="360" y1="30" x2="360" y2="330" stroke="#b8c8ce" stroke-width="1.5" stroke-dasharray="6 5"/><text x="530" y="36" font-size="15" fill="#b64f4f" text-anchor="middle">Flooding with no outlet</text><rect x="370" y="110" width="330" height="210" fill="#f0e6d4" stroke="none" stroke-width="2"/><rect x="370" y="170" width="330" height="150" fill="#d8edf7" stroke="none" stroke-width="2" opacity="0.7"/><line x1="370" y1="110" x2="700" y2="110" stroke="#273b45" stroke-width="2"/><line x1="370" y1="170" x2="700" y2="170" stroke="#287aab" stroke-width="2.5"/><line x1="660" y1="290" x2="660" y2="186.8" stroke="#287aab" stroke-width="2.5"/><polygon points="660,178 664.5,189 655.5,189" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><text x="652" y="240" font-size="13" fill="#287aab" text-anchor="end">table rises</text><line x1="420" y1="166" x2="420" y2="122.4" stroke="#b98232" stroke-width="2" stroke-dasharray="4 3"/><polygon points="420,116 423.5,124 416.5,124" fill="#b98232" stroke="#b98232" stroke-width="1.5" stroke-linejoin="round"/><line x1="480" y1="166" x2="480" y2="122.4" stroke="#b98232" stroke-width="2" stroke-dasharray="4 3"/><polygon points="480,116 483.5,124 476.5,124" fill="#b98232" stroke="#b98232" stroke-width="1.5" stroke-linejoin="round"/><line x1="540" y1="166" x2="540" y2="122.4" stroke="#b98232" stroke-width="2" stroke-dasharray="4 3"/><polygon points="540,116 543.5,124 536.5,124" fill="#b98232" stroke="#b98232" stroke-width="1.5" stroke-linejoin="round"/><circle cx="380" cy="105" r="3" fill="#ffffff" stroke="#647780" stroke-width="1"/><circle cx="392" cy="105" r="3" fill="#ffffff" stroke="#647780" stroke-width="1"/><circle cx="404" cy="105" r="3" fill="#ffffff" stroke="#647780" stroke-width="1"/><circle cx="416" cy="105" r="3" fill="#ffffff" stroke="#647780" stroke-width="1"/><circle cx="428" cy="105" r="3" fill="#ffffff" stroke="#647780" stroke-width="1"/><circle cx="440" cy="105" r="3" fill="#ffffff" stroke="#647780" stroke-width="1"/><circle cx="452" cy="105" r="3" fill="#ffffff" stroke="#647780" stroke-width="1"/><circle cx="464" cy="105" r="3" fill="#ffffff" stroke="#647780" stroke-width="1"/><circle cx="476" cy="105" r="3" fill="#ffffff" stroke="#647780" stroke-width="1"/><circle cx="488" cy="105" r="3" fill="#ffffff" stroke="#647780" stroke-width="1"/><circle cx="500" cy="105" r="3" fill="#ffffff" stroke="#647780" stroke-width="1"/><circle cx="512" cy="105" r="3" fill="#ffffff" stroke="#647780" stroke-width="1"/><circle cx="524" cy="105" r="3" fill="#ffffff" stroke="#647780" stroke-width="1"/><circle cx="536" cy="105" r="3" fill="#ffffff" stroke="#647780" stroke-width="1"/><circle cx="548" cy="105" r="3" fill="#ffffff" stroke="#647780" stroke-width="1"/><circle cx="560" cy="105" r="3" fill="#ffffff" stroke="#647780" stroke-width="1"/><circle cx="572" cy="105" r="3" fill="#ffffff" stroke="#647780" stroke-width="1"/><circle cx="584" cy="105" r="3" fill="#ffffff" stroke="#647780" stroke-width="1"/><circle cx="596" cy="105" r="3" fill="#ffffff" stroke="#647780" stroke-width="1"/><circle cx="608" cy="105" r="3" fill="#ffffff" stroke="#647780" stroke-width="1"/><circle cx="620" cy="105" r="3" fill="#ffffff" stroke="#647780" stroke-width="1"/><circle cx="632" cy="105" r="3" fill="#ffffff" stroke="#647780" stroke-width="1"/><circle cx="644" cy="105" r="3" fill="#ffffff" stroke="#647780" stroke-width="1"/><circle cx="656" cy="105" r="3" fill="#ffffff" stroke="#647780" stroke-width="1"/><circle cx="668" cy="105" r="3" fill="#ffffff" stroke="#647780" stroke-width="1"/><circle cx="680" cy="105" r="3" fill="#ffffff" stroke="#647780" stroke-width="1"/><text x="530" y="90" font-size="13" fill="#647780" text-anchor="middle">salt crust at the surface</text><text x="556" y="150" font-size="13" fill="#b98232" text-anchor="start">capillary rise</text><text x="360" y="360" font-size="14" fill="#273b45" text-anchor="middle">pH 11: strongly alkaline; measure ECe and ESP separately</text><text x="360" y="384" font-size="13" fill="#647780" text-anchor="middle">Sodic soils also need amendment assessment</text></g></svg>