<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Slenderness of a solid timber column</title><desc id="desc">IS 883:2016 limits the unsupported length over the least lateral dimension, S/d, to 50 for pin-ended solid columns: a 3.6 m post of 100 × 150 mm gives 36.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><rect x="150" y="60" width="40" height="300" fill="#f5ead8" stroke="#b98232" stroke-width="2"/><line x1="156" y1="70" x2="184" y2="76" stroke="#b98232" stroke-width="0.8"/><line x1="156" y1="88" x2="184" y2="94" stroke="#b98232" stroke-width="0.8"/><line x1="156" y1="106" x2="184" y2="112" stroke="#b98232" stroke-width="0.8"/><line x1="156" y1="124" x2="184" y2="130" stroke="#b98232" stroke-width="0.8"/><line x1="156" y1="142" x2="184" y2="148" stroke="#b98232" stroke-width="0.8"/><line x1="156" y1="160" x2="184" y2="166" stroke="#b98232" stroke-width="0.8"/><line x1="156" y1="178" x2="184" y2="184" stroke="#b98232" stroke-width="0.8"/><line x1="156" y1="196" x2="184" y2="202" stroke="#b98232" stroke-width="0.8"/><line x1="156" y1="214" x2="184" y2="220" stroke="#b98232" stroke-width="0.8"/><line x1="156" y1="232" x2="184" y2="238" stroke="#b98232" stroke-width="0.8"/><line x1="156" y1="250" x2="184" y2="256" stroke="#b98232" stroke-width="0.8"/><line x1="156" y1="268" x2="184" y2="274" stroke="#b98232" stroke-width="0.8"/><line x1="156" y1="286" x2="184" y2="292" stroke="#b98232" stroke-width="0.8"/><line x1="156" y1="304" x2="184" y2="310" stroke="#b98232" stroke-width="0.8"/><line x1="156" y1="322" x2="184" y2="328" stroke="#b98232" stroke-width="0.8"/><line x1="156" y1="340" x2="184" y2="346" stroke="#b98232" stroke-width="0.8"/><polygon points="170,363 155,387 185,387" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><line x1="148" y1="390" x2="192" y2="390" stroke="#647780" stroke-width="2"/><circle cx="170" cy="56" r="5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><line x1="120" y1="60" x2="120" y2="360" stroke="#647780" stroke-width="1.5"/><line x1="127" y1="60" x2="113" y2="60" stroke="#647780" stroke-width="1.5"/><line x1="127" y1="360" x2="113" y2="360" stroke="#647780" stroke-width="1.5"/><text x="112" y="216" font-size="14" fill="#647780" text-anchor="end">S = 3600 mm</text><rect x="290" y="150" width="100" height="150" fill="#f5ead8" stroke="#b98232" stroke-width="2"/><line x1="290" y1="320" x2="390" y2="320" stroke="#647780" stroke-width="1.5"/><line x1="290" y1="313" x2="290" y2="327" stroke="#647780" stroke-width="1.5"/><line x1="390" y1="313" x2="390" y2="327" stroke="#647780" stroke-width="1.5"/><text x="340" y="336" font-size="14" fill="#647780" text-anchor="middle">d = 100 (least)</text><line x1="410" y1="150" x2="410" y2="300" stroke="#647780" stroke-width="1.5"/><line x1="417" y1="150" x2="403" y2="150" stroke="#647780" stroke-width="1.5"/><line x1="417" y1="300" x2="403" y2="300" stroke="#647780" stroke-width="1.5"/><text x="418" y="231" font-size="14" fill="#647780" text-anchor="start">150</text><text x="470" y="150" font-size="16" fill="#2b7b61" text-anchor="start">S/d = 3600 / 100 = 36 ≤ 50</text><text x="470" y="190" font-size="14" fill="#647780" text-anchor="start">Not 3600 / 150 = 24</text><text x="470" y="214" font-size="14" fill="#647780" text-anchor="start">Not L/r ≈ 124.7, another definition</text><text x="470" y="262" font-size="14" fill="#273b45" text-anchor="start">Circular post: no more than</text><text x="470" y="284" font-size="14" fill="#273b45" text-anchor="start">the square of equal area</text></g></svg>