<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Well-conditioned and ill-conditioned triangles</title><desc id="desc">Every angle of a well-conditioned triangle lies between 30 and 120 degrees; a very small or very large angle makes the computed position sensitive to errors.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><polygon points="60,320 330,320 182,109" fill="#deeee6" stroke="#2b7b61" stroke-width="2" stroke-linejoin="round"/><text x="100" y="306" font-size="16" fill="#273b45" text-anchor="middle">60°</text><text x="290" y="306" font-size="16" fill="#273b45" text-anchor="middle">55°</text><text x="182" y="146" font-size="16" fill="#273b45" text-anchor="middle">65°</text><text x="195" y="64" font-size="18" fill="#2b7b61" text-anchor="middle">Well-conditioned</text><text x="195" y="88" font-size="15" fill="#647780" text-anchor="middle">each angle 30° to 120°</text><polygon points="400,320 690,320 567,275" fill="#f2dfdf" stroke="#b64f4f" stroke-width="2" stroke-linejoin="round"/><text x="438" y="344" font-size="16" fill="#273b45" text-anchor="middle">15°</text><text x="652" y="344" font-size="16" fill="#273b45" text-anchor="middle">20°</text><text x="567" y="262" font-size="16" fill="#273b45" text-anchor="middle">145°</text><text x="545" y="190" font-size="18" fill="#b64f4f" text-anchor="middle">Ill-conditioned</text><text x="545" y="214" font-size="15" fill="#647780" text-anchor="middle">one angle outside the range</text></g></svg>