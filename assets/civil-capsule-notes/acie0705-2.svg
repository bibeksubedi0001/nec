<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Superpassage and canal siphon</title><desc id="desc">In a superpassage the drain crosses in a trough over a canal that keeps a free surface; clearance = trough underside - FSL = 99.8 - 99.0 = 0.8 m. In a canal siphon the canal dips into barrels that run full.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><text x="180" y="60" font-size="16" fill="#273b45" text-anchor="middle">Superpassage</text><rect x="30" y="220" width="300" height="60" fill="#d8edf7" stroke="none" stroke-width="2"/><line x1="30" y1="220" x2="330" y2="220" stroke="#287aab" stroke-width="2"/><line x1="30" y1="280" x2="330" y2="280" stroke="#273b45" stroke-width="2"/><rect x="130" y="150" width="100" height="40" fill="#ffffff" stroke="#273b45" stroke-width="3"/><rect x="133" y="156" width="94" height="31" fill="#d8edf7" stroke="none" stroke-width="2"/><text x="180" y="140" font-size="14" fill="#273b45" text-anchor="middle">drain in a trough</text><line x1="250" y1="190" x2="250" y2="220" stroke="#647780" stroke-width="1.5"/><line x1="257" y1="190" x2="243" y2="190" stroke="#647780" stroke-width="1.5"/><line x1="257" y1="220" x2="243" y2="220" stroke="#647780" stroke-width="1.5"/><text x="260" y="211" font-size="14" fill="#647780" text-anchor="start">c = 0.8 m</text><text x="125" y="196" font-size="13" fill="#273b45" text-anchor="end">underside RL 99.8</text><text x="40" y="238" font-size="13" fill="#287aab" text-anchor="start">FSL RL 99.0</text><text x="180" y="318" font-size="14" fill="#273b45" text-anchor="middle">canal passes under with a free surface</text><text x="180" y="342" font-size="14" fill="#2b7b61" text-anchor="middle">0.8 m &gt; 0.5 m required: met</text><line x1="355" y1="40" x2="355" y2="370" stroke="#b8c8ce" stroke-width="1.5" stroke-dasharray="6 5"/><text x="535" y="60" font-size="16" fill="#273b45" text-anchor="middle">Canal siphon (inverted siphon)</text><rect x="455" y="215" width="170" height="110" fill="#f0e6d4" stroke="none" stroke-width="2"/><rect x="480" y="195" width="110" height="20" fill="#d8edf7" stroke="none" stroke-width="2"/><line x1="455" y1="215" x2="625" y2="215" stroke="#273b45" stroke-width="1.5"/><text x="535" y="186" font-size="14" fill="#273b45" text-anchor="middle">drain on top</text><rect x="370" y="200" width="90" height="40" fill="#d8edf7" stroke="none" stroke-width="2"/><rect x="612" y="205" width="88" height="40" fill="#d8edf7" stroke="none" stroke-width="2"/><path d="M462 228 L482 298 L588 298 L608 232" stroke="#466d89" stroke-width="22" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M462 228 L482 298 L588 298 L608 232" stroke="#d8edf7" stroke-width="15" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="380" y1="220" x2="431.2" y2="220" stroke="#287aab" stroke-width="2.5"/><polygon points="440,220 429,224.5 429,215.5" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><text x="535" y="346" font-size="14" fill="#273b45" text-anchor="middle">canal barrels run full under pressure</text><text x="360" y="396" font-size="13" fill="#647780" text-anchor="middle">Clearance = trough underside − canal FSL, not water levels alone</text></g></svg>