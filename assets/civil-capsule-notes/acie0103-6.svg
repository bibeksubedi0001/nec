<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Nominal door size versus clear opening</title><desc id="desc">A door drawn as 750 mm may describe the leaf or frame; the usable clear opening with the leaf open, here 710 mm, is what an access requirement checks.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><rect x="60" y="120" width="160" height="40" fill="#d6dfe3" stroke="#647780" stroke-width="2"/><rect x="472" y="120" width="188" height="40" fill="#d6dfe3" stroke="#647780" stroke-width="2"/><rect x="220" y="116" width="16" height="48" fill="#f5ead8" stroke="#b98232" stroke-width="2"/><rect x="456" y="116" width="16" height="48" fill="#f5ead8" stroke="#b98232" stroke-width="2"/><rect x="236" y="160" width="12" height="212" fill="#f5ead8" stroke="#b98232" stroke-width="2"/><path d="M448 160 A212 212 0 0 1 236 372" stroke="#647780" stroke-width="1.5" fill="none" stroke-dasharray="6 6" stroke-linejoin="round" stroke-linecap="round"/><text x="226" y="290" font-size="16" fill="#273b45" text-anchor="end">Open leaf</text><line x1="220" y1="92" x2="472" y2="92" stroke="#647780" stroke-width="1.5"/><line x1="220" y1="85" x2="220" y2="99" stroke="#647780" stroke-width="1.5"/><line x1="472" y1="85" x2="472" y2="99" stroke="#647780" stroke-width="1.5"/><text x="346" y="84" font-size="18" fill="#647780" text-anchor="middle">drawn as 750 mm</text><line x1="248" y1="196" x2="456" y2="196" stroke="#2b7b61" stroke-width="1.5"/><line x1="248" y1="189" x2="248" y2="203" stroke="#2b7b61" stroke-width="1.5"/><line x1="456" y1="189" x2="456" y2="203" stroke="#2b7b61" stroke-width="1.5"/><text x="352" y="218" font-size="17" fill="#2b7b61" text-anchor="middle">clear 710 mm</text><text x="565" y="300" font-size="16" fill="#273b45" text-anchor="middle">Check the clear opening</text><text x="565" y="324" font-size="16" fill="#273b45" text-anchor="middle">with the leaf open</text></g></svg>