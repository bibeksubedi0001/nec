<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Couples on cantilevers: moment without shear</title><desc id="desc">A couple at the tip puts the same moment on every section with zero shear; a couple at midspan loads only the segment between it and the root.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="110" y1="50" x2="110" y2="110" stroke="#273b45" stroke-width="3"/><line x1="110" y1="54" x2="99" y2="64" stroke="#647780" stroke-width="1.4"/><line x1="110" y1="66" x2="99" y2="76" stroke="#647780" stroke-width="1.4"/><line x1="110" y1="78" x2="99" y2="88" stroke="#647780" stroke-width="1.4"/><line x1="110" y1="90" x2="99" y2="100" stroke="#647780" stroke-width="1.4"/><line x1="110" y1="102" x2="99" y2="112" stroke="#647780" stroke-width="1.4"/><line x1="110" y1="80" x2="400" y2="80" stroke="#273b45" stroke-width="7"/><path d="M419.05 91 A22 22 0 1 0 380.95 91" stroke="#2b7b61" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="380.95,91 371.55,83.72 379.34,79.22" fill="#2b7b61" stroke="#2b7b61" stroke-width="1.5" stroke-linejoin="round"/><text x="400" y="48" font-size="15" fill="#2b7b61" text-anchor="middle">12 kN·m at the tip</text><rect x="110" y="140" width="290" height="36" fill="#f2dfdf" stroke="#b64f4f" stroke-width="2"/><line x1="110" y1="140" x2="400" y2="140" stroke="#647780" stroke-width="1.5"/><text x="90" y="164" font-size="13" fill="#647780" text-anchor="end">BMD</text><line x1="110" y1="220" x2="110" y2="280" stroke="#273b45" stroke-width="3"/><line x1="110" y1="224" x2="99" y2="234" stroke="#647780" stroke-width="1.4"/><line x1="110" y1="236" x2="99" y2="246" stroke="#647780" stroke-width="1.4"/><line x1="110" y1="248" x2="99" y2="258" stroke="#647780" stroke-width="1.4"/><line x1="110" y1="260" x2="99" y2="270" stroke="#647780" stroke-width="1.4"/><line x1="110" y1="272" x2="99" y2="282" stroke="#647780" stroke-width="1.4"/><line x1="110" y1="250" x2="400" y2="250" stroke="#273b45" stroke-width="7"/><path d="M274.05 261 A22 22 0 1 0 235.95 261" stroke="#2b7b61" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="235.95,261 226.55,253.72 234.34,249.22" fill="#2b7b61" stroke="#2b7b61" stroke-width="1.5" stroke-linejoin="round"/><text x="255" y="218" font-size="15" fill="#2b7b61" text-anchor="middle">9 kN·m at midspan</text><rect x="110" y="310" width="145" height="27" fill="#f2dfdf" stroke="#b64f4f" stroke-width="2"/><line x1="110" y1="310" x2="400" y2="310" stroke="#647780" stroke-width="1.5"/><text x="90" y="329.5" font-size="13" fill="#647780" text-anchor="end">BMD</text><text x="440" y="100" font-size="15" fill="#273b45" text-anchor="start">V = 0 at every section</text><text x="440" y="126" font-size="15" fill="#b64f4f" text-anchor="start">M = 12 kN·m from root to tip</text><text x="440" y="270" font-size="15" fill="#273b45" text-anchor="start">V = 0; fixed-end shear 0 kN</text><text x="440" y="296" font-size="15" fill="#b64f4f" text-anchor="start">M = 9 kN·m root to couple,</text><text x="440" y="320" font-size="15" fill="#b64f4f" text-anchor="start">zero beyond it</text><text x="360" y="396" font-size="15" fill="#647780" text-anchor="middle">The moment does not grow with span: a couple is not a force</text></g></svg>