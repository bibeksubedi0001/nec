<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Parabolic two-hinged arch under a full-span UDL</title><desc id="desc">Under a uniform load over the full horizontal span the parabola is funicular: H = wL²/8h, zero bending and zero radial shear, so the rib carries pure compression.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="120" y1="80" x2="600" y2="80" stroke="#b64f4f" stroke-width="2"/><line x1="120" y1="80" x2="120" y2="101.8" stroke="#b64f4f" stroke-width="2"/><polygon points="120,109 116,100 124,100" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><line x1="163.64" y1="80" x2="163.64" y2="101.8" stroke="#b64f4f" stroke-width="2"/><polygon points="163.64,109 159.64,100 167.64,100" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><line x1="207.27" y1="80" x2="207.27" y2="101.8" stroke="#b64f4f" stroke-width="2"/><polygon points="207.27,109 203.27,100 211.27,100" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><line x1="250.91" y1="80" x2="250.91" y2="101.8" stroke="#b64f4f" stroke-width="2"/><polygon points="250.91,109 246.91,100 254.91,100" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><line x1="294.55" y1="80" x2="294.55" y2="101.8" stroke="#b64f4f" stroke-width="2"/><polygon points="294.55,109 290.55,100 298.55,100" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><line x1="338.18" y1="80" x2="338.18" y2="101.8" stroke="#b64f4f" stroke-width="2"/><polygon points="338.18,109 334.18,100 342.18,100" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><line x1="381.82" y1="80" x2="381.82" y2="101.8" stroke="#b64f4f" stroke-width="2"/><polygon points="381.82,109 377.82,100 385.82,100" fill="#b64f4f" stroke="#b64f4f" stroke-