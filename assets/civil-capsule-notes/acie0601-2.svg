<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Nephelometer for turbidity, tintometer for colour</title><desc id="desc">A nephelometer reads light scattered at 90 degrees and reports NTU; a tintometer matches filtered water against platinum-cobalt standards for true colour. Neither is a mass concentration.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><text x="185" y="30" font-size="17" fill="#273b45" text-anchor="middle">Nephelometer: turbidity</text><circle cx="60" cy="200" r="16" fill="#f5ead8" stroke="#b98232" stroke-width="2"/><line x1="80" y1="200" x2="139.2" y2="200" stroke="#b98232" stroke-width="3"/><polygon points="148,200 137,204.5 137,195.5" fill="#b98232" stroke="#b98232" stroke-width="1.5" stroke-linejoin="round"/><rect x="150" y="160" width="90" height="80" fill="#d8edf7" stroke="#273b45" stroke-width="2"/><circle cx="165" cy="178" r="3" fill="#8a9aa3" stroke="#8a9aa3" stroke-width="2"/><circle cx="190" cy="214" r="3" fill="#8a9aa3" stroke="#8a9aa3" stroke-width="2"/><circle cx="214" cy="184" r="3" fill="#8a9aa3" stroke="#8a9aa3" stroke-width="2"/><circle cx="226" cy="222" r="3" fill="#8a9aa3" stroke="#8a9aa3" stroke-width="2"/><circle cx="176" cy="228" r="3" fill="#8a9aa3" stroke="#8a9aa3" stroke-width="2"/><circle cx="204" cy="200" r="3" fill="#8a9aa3" stroke="#8a9aa3" stroke-width="2"/><line x1="242" y1="200" x2="321.2" y2="200" stroke="#647780" stroke-width="2" stroke-dasharray="6 4"/><polygon points="330,200 319,204.5 319,195.5" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><text x="290" y="188" font-size="14" fill="#647780" text-anchor="middle">transmitted</text><line x1="195" y1="158" x2="195" y2="106.8" stroke="#b98232" stroke-width="3"/><polygon points="195,98 199.5,109 190.5,109" fill="#b98232" stroke="#b98232" stroke-width="1.5" stroke-linejoin="round"/><rect x="145" y="50" width="100" height="44" rx="8" fill="#f5ead8" stroke="#b98232" stroke-width="2"/><text x="195" y="77.4" font-size="15" fill="#273b45" text-anchor="middle">detector 90°</text><text x="195" y="262" font-size="14" fill="#273b45" text-anchor="middle">sample cell</text><text x="185" y="310" font-size="16" fill="#287aab" text-anchor="middle">scattered light → NTU</text><text x="185" y="336" font-size="14" fill="#273b45" text-anchor="middle">suspended solids: mg/L, filter and weigh</text><text x="185" y="358" font-size="14" fill="#b64f4f" text-anchor="middle">no universal NTU to mg/L factor</text><line x1="360" y1="20" x2="360" y2="410" stroke="#b8c8ce" stroke-width="1.5" stroke-dasharray="6 5"/><text x="535" y="30" font-size="17" fill="#273b45" text-anchor="middle">Tintometer: colour</text><rect x="390" y="90" width="34" height="170" rx="6" fill="#ffffff" stroke="#273b45" stroke-width="2"/><rect x="393" y="120" width="28" height="137" rx="4" fill="#b98232" stroke="none" stroke-width="2" opacity="0.15"/><text x="407" y="282" font-size="14" fill="#273b45" text-anchor="middle">5</text><rect x="440" y="90" width="34" height="170" rx="6" fill="#ffffff" stroke="#273b45" stroke-width="2"/><rect x="443" y="120" width="28" height="137" rx="4" fill="#b98232" stroke="none" stroke-width="2" opacity="0.3"/><text x="457" y="282" font-size="14" fill="#273b45" text-anchor="middle">10</text><rect x="490" y="90" width="34" height="170" rx="6" fill="#ffffff" stroke="#273b45" stroke-width="2"/><rect x="493" y="120" width="28" height="137" rx="4" fill="#b98232" stroke="none" stroke-width="2" opacity="0.5"/><text x="507" y="282" font-size="14" fill="#273b45" text-anchor="middle">20</text><rect x="540" y="90" width="34" height="170" rx="6" fill="#ffffff" stroke="#273b45" stroke-width="2"/><rect x="543" y="120" width="28" height="137" rx="4" fill="#b98232" stroke="none" stroke-width="2" opacity="0.75"/><text x="557" y="282" font-size="14" fill="#273b45" text-anchor="middle">40</text><rect x="620" y="90" width="34" height="170" rx="6" fill="#ffffff" stroke="#287aab" stroke-width="3"/><rect x="623" y="120" width="28" height="137" rx="4" fill="#b98232" stroke="none" stroke-width="2" opacity="0.5"/><text x="637" y="282" font-size="14" fill="#287aab" text-anchor="middle">sample</text><path d="M637 86 Q572 40 507 86" stroke="#287aab" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="507,86 513.38,75.97 518.58,83.32" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><text x="572" y="52" font-size="14" fill="#287aab" text-anchor="middle">match</text><text x="465" y="305" font-size="14" fill="#273b45" text-anchor="middle">Pt-Co standards (units)</text><text x="545" y="340" font-size="14" fill="#273b45" text-anchor="middle">1 unit = colour of the standard with 1 mg Pt/L</text><text x="545" y="364" font-size="14" fill="#647780" text-anchor="middle">true colour: remove turbidity first</text></g></svg>