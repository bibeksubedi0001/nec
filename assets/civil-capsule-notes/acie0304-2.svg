<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Sudden expansion and sudden contraction</title><desc id="desc">At an expansion the jet separates and re-attaches, losing (V1 − V2)²/2g; at a contraction most of the loss comes from re-expansion after the vena contracta.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><polygon points="60,80 300,80 300,50 660,50 660,150 300,150 300,120 60,120" fill="#d8edf7" stroke="none" stroke-width="2" stroke-linejoin="round"/><path d="M60 80 L300 80 L300 50 L660 50" stroke="#273b45" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M60 120 L300 120 L300 150 L660 150" stroke="#273b45" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M300 80 Q390 76 480 52" stroke="#287aab" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M300 120 Q390 124 480 148" stroke="#287aab" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="345" cy="62" rx="30" ry="8" fill="none" stroke="#647780" stroke-width="1.2" stroke-dasharray="4 3"/><ellipse cx="345" cy="138" rx="30" ry="8" fill="none" stroke="#647780" stroke-width="1.2" stroke-dasharray="4 3"/><text x="180" y="106" font-size="15" fill="#273b45" text-anchor="middle">V1 = 6 m/s</text><text x="590" y="106" font-size="15" fill="#273b45" text-anchor="middle">V2 = 2 m/s</text><text x="360" y="180" font-size="14" fill="#273b45" text-anchor="middle">hL = (V1 − V2)² / 2g = 16 / 19.62 = 0.815 m, not the difference of velocity heads</text><polygon points="60,210 300,210 300,240 660,240 660,280 300,280 300,310 60,310" fill="#d8edf7" stroke="none" stroke-width="2" stroke-linejoin="round"/><path d="M60 210 L300 210 L300 240 L660 240" stroke="#273b45" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M60 310 L300 310 L300 280 L660 280" stroke="#273b45" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M300 240 Q318 248 336 248 Q372 248 420 240" stroke="#287aab" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M300 280 Q318 272 336 272 Q372 272 420 280" stroke="#287aab" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="360" cy="243" rx="16" ry="3.5" fill="none" stroke="#647780" stroke-width="1.2" stroke-dasharray="3 3"/><ellipse cx="360" cy="277" rx="16" ry="3.5" fill="none" stroke="#647780" stroke-width="1.2" stroke-dasharray="3 3"/><line x1="100" y1="260" x2="191.2" y2="260" stroke="#287aab" stroke-width="2.5"/><polygon points="200,260 189,264.5 189,255.5" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><line x1="336" y1="262" x2="336" y2="330" stroke="#647780" stroke-width="1.2"/><text x="336" y="346" font-size="15" fill="#273b45" text-anchor="middle">vena contracta</text><text x="360" y="372" font-size="14" fill="#273b45" text-anchor="middle">Loss comes mainly from re-expansion and mixing after the vena contracta</text><text x="360" y="400" font-size="14" fill="#647780" text-anchor="middle">A pipe exit into a large reservoir loses the whole V²/2g (K = 1)</text></g></svg>