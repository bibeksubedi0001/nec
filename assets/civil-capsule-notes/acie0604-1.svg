<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Sewer network roles and an interceptor</title><desc id="desc">House connections serve one premises and feed street laterals; laterals feed mains, which lead on to trunks and treatment. An interceptor along the river collects old outfalls and sends dry-weather flow to treatment.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><text x="150" y="46" font-size="14" fill="#273b45" text-anchor="middle">house connections</text><rect x="70" y="58" width="24" height="20" fill="#d6dfe3" stroke="#273b45" stroke-width="1.5"/><line x1="82" y1="78" x2="82" y2="100" stroke="#647780" stroke-width="2"/><rect x="120" y="58" width="24" height="20" fill="#d6dfe3" stroke="#273b45" stroke-width="1.5"/><line x1="132" y1="78" x2="132" y2="100" stroke="#647780" stroke-width="2"/><rect x="170" y="58" width="24" height="20" fill="#d6dfe3" stroke="#273b45" stroke-width="1.5"/><line x1="182" y1="78" x2="182" y2="100" stroke="#647780" stroke-width="2"/><rect x="220" y="58" width="24" height="20" fill="#d6dfe3" stroke="#273b45" stroke-width="1.5"/><line x1="232" y1="78" x2="232" y2="100" stroke="#647780" stroke-width="2"/><rect x="70" y="190" width="24" height="20" fill="#d6dfe3" stroke="#273b45" stroke-width="1.5"/><line x1="82" y1="190" x2="82" y2="170" stroke="#647780" stroke-width="2"/><rect x="120" y="190" width="24" height="20" fill="#d6dfe3" stroke="#273b45" stroke-width="1.5"/><line x1="132" y1="190" x2="132" y2="170" stroke="#647780" stroke-width="2"/><rect x="170" y="190" width="24" height="20" fill="#d6dfe3" stroke="#273b45" stroke-width="1.5"/><line x1="182" y1="190" x2="182" y2="170" stroke="#647780" stroke-width="2"/><rect x="220" y="190" width="24" height="20" fill="#d6dfe3" stroke="#273b45" stroke-width="1.5"/><line x1="232" y1="190" x2="232" y2="170" stroke="#647780" stroke-width="2"/><line x1="60" y1="100" x2="300" y2="100" stroke="#466d89" stroke-width="3"/><line x1="60" y1="170" x2="300" y2="170" stroke="#466d89" stroke-width="3"/><line x1="400" y1="100" x2="480" y2="100" stroke="#466d89" stroke-width="3"/><line x1="400" y1="170" x2="480" y2="170" stroke="#466d89" stroke-width="3"/><text x="64" y="124" font-size="14" fill="#466d89" text-anchor="start">lateral (street)</text><rect x="410" y="60" width="22" height="18" fill="#d6dfe3" stroke="#273b45" stroke-width="1.5"/><line x1="421" y1="78" x2="421" y2="100" stroke="#647780" stroke-width="2"/><rect x="440" y="60" width="22" height="18" fill="#d6dfe3" stroke="#273b45" stroke-width="1.5"/><line x1="451" y1="78" x2="451" y2="100" stroke="#647780" stroke-width="2"/><line x1="300" y1="100" x2="300" y2="260" stroke="#466d89" stroke-width="5"/><line x1="300" y1="262" x2="300" y2="330" stroke="#647780" stroke-width="2" stroke-dasharray="6 4"/><line x1="480" y1="100" x2="480" y2="260" stroke="#466d89" stroke-width="5"/><line x1="480" y1="262" x2="480" y2="330" stroke="#647780" stroke-width="2" stroke-dasharray="6 4"/><text x="310" y="222" font-size="14" fill="#466d89" text-anchor="start">main</text><text x="490" y="222" font-size="14" fill="#466d89" text-anchor="start">main</text><rect x="20" y="330" width="680" height="50" fill="#d8edf7" stroke="none" stroke-width="2"/><text x="660" y="362" font-size="15" fill="#287aab" text-anchor="middle">river</text><line x1="300" y1="260" x2="600" y2="260" stroke="#2b7b61" stroke-width="6"/><text x="390" y="252" font-size="15" fill="#2b7b61" text-anchor="middle">interceptor sewer</text><text x="390" y="318" font-size="13" fill="#647780" text-anchor="middle">old outfalls, now intercepted</text><rect x="600" y="232" width="96" height="56" rx="8" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><text x="648" y="265.4" font-size="15" fill="#273b45" text-anchor="middle">treatment</text><text x="360" y="404" font-size="14" fill="#273b45" text-anchor=