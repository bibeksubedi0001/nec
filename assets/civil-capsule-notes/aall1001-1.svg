<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Lettering height and inclined lettering</title><desc id="desc">Lettering size is the nominal capital height: a narrow I and a broad M are both 5 mm tall. Inclined lettering slopes 75 degrees to the baseline, a lean of 15 degrees from the vertical toward the right.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><text x="160" y="60" font-size="15" fill="#273b45" text-anchor="middle">Nominal capital height</text><line x1="80" y1="100" x2="80" y2="220" stroke="#273b45" stroke-width="8" stroke-linecap="round"/><path d="M140 220 L140 100 L185 170 L230 100 L230 220" stroke="#273b45" stroke-width="8" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="50" y1="100" x2="50" y2="220" stroke="#647780" stroke-width="1.5"/><line x1="57" y1="100" x2="43" y2="100" stroke="#647780" stroke-width="1.5"/><line x1="57" y1="220" x2="43" y2="220" stroke="#647780" stroke-width="1.5"/><text x="42" y="166" font-size="15" fill="#647780" text-anchor="end">5 mm</text><line x1="60" y1="100" x2="250" y2="100" stroke="#647780" stroke-width="1" stroke-dasharray="4 4"/><line x1="60" y1="220" x2="250" y2="220" stroke="#647780" stroke-width="1" stroke-dasharray="4 4"/><text x="160" y="260" font-size="14" fill="#287aab" text-anchor="middle">same height, different widths</text><line x1="360" y1="40" x2="360" y2="300" stroke="#b8c8ce" stroke-width="1.5" stroke-dasharray="6 5"/><text x="530" y="60" font-size="15" fill="#273b45" text-anchor="middle">Inclined lettering</text><line x1="380" y1="220" x2="680" y2="220" stroke="#647780" stroke-width="2"/><line x1="440" y1="220" x2="440" y2="96" stroke="#647780" stroke-width="1.2" stroke-dasharray="5 4"/><line x1="440" y1="220" x2="472.2" y2="100" stroke="#273b45" stroke-width="8" stroke-linecap="round"/><line x1="500" y1="220" x2="532.2" y2="100" stroke="#273b45" stroke-width="8" stroke-linecap="round"/><line x1="456" y1="160" x2="516" y2="160" stroke="#273b45" stroke-width="8" stroke-linecap="round"/><path d="M451.39 177.5 A44 44 0 0 1 484 220" stroke="#b64f4f" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="468" y="206" font-size="14" fill="#b64f4f" text-anchor="start">75°</text><path d="M440 124 A96 96 0 0 1 464.85 127.27" stroke="#287aab" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="430" y="128" font-size="14" fill="#287aab" text-anchor="end">15°</text><text x="600" y="150" font-size="14" fill="#273b45" text-anchor="middle">leans right</text><text x="360" y="330" font-size="14" fill="#273b45" text-anchor="middle">Size = nominal capital height; widths follow the adopted style's proportions</text><text x="360" y="354" font-size="14" fill="#273b45" text-anchor="middle">75° to the baseline = 15° lean from the vertical, toward the right</text><text x="360" y="378" font-size="13" fill="#647780" text-anchor="middle">Not every permitted style is inclined</text></g></svg>