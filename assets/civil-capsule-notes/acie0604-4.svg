<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Inverted siphon beneath a river</title><desc id="desc">A depressed sewer carries flow under a river in barrels that run full under pressure, driven by upstream head. It is not a true siphon over a summit, and solids can settle in the low barrels.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><text x="360" y="40" font-size="16" fill="#273b45" text-anchor="middle">Inverted siphon (depressed sewer) under a river</text><polygon points="248,175 472,175 450,240 270,240" fill="#d8edf7" stroke="none" stroke-width="2" stroke-linejoin="round"/><path d="M20 150 L240 150 L270 240 L450 240 L480 150 L700 150" stroke="#647780" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="360" y="222" font-size="15" fill="#287aab" text-anchor="middle">river</text><line x1="20" y1="190" x2="180" y2="196" stroke="#466d89" stroke-width="9"/><rect x="180" y="150" width="40" height="72" fill="#ffffff" stroke="#273b45" stroke-width="2"/><path d="M205 222 L230 290 L490 290 L515 232" stroke="#466d89" stroke-width="12" fill="none" stroke-linejoin="round" stroke-linecap="round"/><rect x="500" y="150" width="40" height="82" fill="#ffffff" stroke="#273b45" stroke-width="2"/><line x1="540" y1="216" x2="700" y2="222" stroke="#466d89" stroke-width="9"/><line x1="200" y1="186" x2="520" y2="206" stroke="#287aab" stroke-width="2" stroke-dasharray="7 5"/><line x1="360" y1="118" x2="360" y2="192" stroke="#287aab" stroke-width="1.2"/><text x="360" y="110" font-size="15" fill="#287aab" text-anchor="middle">upstream head drives full-bore flow</text><text x="200" y="138" font-size="14" fill="#273b45" text-anchor="middle">inlet chamber</text><text x="520" y="138" font-size="14" fill="#273b45" text-anchor="middle">outlet chamber</text><text x="360" y="318" font-size="14" fill="#273b45" text-anchor="middle">barrels flow full, under pressure</text><text x="360" y="360" font-size="14" fill="#273b45" text-anchor="middle">Called an inverted siphon, but not a true siphon over a summit</text><text x="360" y="386" font-size="14" fill="#647780" text-anchor="middle">Solids settle in low barrels: cleaning access and minimum-flow checks</text></g></svg>