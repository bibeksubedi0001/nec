<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Two-hinged arch thrust from compatibility</title><desc id="desc">Releasing the thrust lets one springing slide; the thrust that restores zero spread is one value for the whole arch, 25WL/128h for a shallow parabola with a crown load.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><path d="M120 300 L128 290.17 L136 280.67 L144 271.5 L152 262.67 L160 254.17 L168 246 L176 238.17 L184 230.67 L192 223.5 L200 216.67 L208 210.17 L216 204 L224 198.17 L232 192.67 L240 187.5 L248 182.67 L256 178.17 L264 174 L272 170.17 L280 166.67 L288 163.5 L296 160.67 L304 158.17 L312 156 L320 154.17 L328 152.67 L336 151.5 L344 150.67 L352 150.17 L360 150 L368 150.17 L376 150.67 L384 151.5 L392 152.67 L400 154.17 L408 156 L416 158.17 L424 160.67 L432 163.5 L440 166.67 L448 170.17 L456 174 L464 178.17 L472 182.67 L480 187.5 L488 192.67 L496 198.17 L504 204 L512 210.17 L520 216.67 L528 223.5 L536 230.67 L544 238.17 L552 246 L560 254.17 L568 262.67 L576 271.5 L584 280.67 L592 290.17 L600 300" stroke="#273b45" stroke-width="5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="120" cy="300" r="6" fill="#ffffff" stroke="#273b45" stroke-width="2"/><circle cx="600" cy="300" r="6" fill="#ffffff" stroke="#273b45" stroke-width="2"/><polygon points="120,307 105,331 135,331" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><line x1="98" y1="334" x2="142" y2="334" stroke="#647780" stroke-width="2"/><polygon points="600,307 585,331 615,331" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><line x1="578" y1="334" x2="622" y2="334" stroke="#647780" stroke-width="2"/><line x1="360" y1="90" x2="360" y2="137.2" stroke="#b64f4f" stroke-width="3.5"/><polygon points="360,146 355.5,135 364.5,135" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="360" y="80" font-size="15" fill="#b64f4f" text-anchor="middle">W = 32 kN</text><line x1="60" y1="300" x2="101.2" y2="300" stroke="#287aab" stroke-width="3"/><polygon points="110,300 99,304.5 99,295.5" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><line x1="660" y1="300" x2="618.8" y2="300" stroke="#287aab" stroke-width="3"/><polygon points="610,300 621,295.5 621,304.5" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><text x="64" y="288" font-size="16" fill="#287aab" text-anchor="middle">H</text><text x="656" y="288" font-size="16" fill="#287aab" text-anchor="middle">H</text><line x1="360" y1="300" x2="360" y2="150" stroke="#647780" stroke-width="1.5"/><line x1="353" y1="300" x2="367" y2="300" stroke="#647780" stroke-width="1.5"/><line x1="353" y1="150" x2="367" y2="150" stroke="#647780" stroke-width="1.5"/><text x="370" y="231" font-size="15" fill="#647780" text-anchor="start">h = 2 m</text><line x1="120" y1="352" x2="600" y2="352" stroke="#647780" stroke-width="1.5"/><line x1="120" y1="345" x2="120" y2="359" stroke="#647780" stroke-width="1.5"/><line x1="600" y1="345" x2="600" y2="359" stroke="#647780" stroke-width="1.5"/><text x="360" y="366" font-size="15" fill="#647780" text-anchor="middle">L = 16 m</text><text x="460" y="90" font-size="16" fill="#273b45" text-anchor="start">H = ∫ M0 y dμ / ∫ y² dμ</text><text x="460" y="118" font-size="15" fill="#273b45" text-anchor="start">Crown load: 25WL / 128h</text><text x="460" y="144" font-size="15" fill="#2b7b61" text-anchor="start">= 25 × 32 × 16 / 256 = 50 kN</text><text x="360" y="404" font-size="14" fill="#647780" text-anchor="middle">A load rising from zero to w gives H = wL² / 16h, half the full-UDL thrust</text></g></svg>