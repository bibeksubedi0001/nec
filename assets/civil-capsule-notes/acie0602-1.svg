<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Where valves sit on a supply main</title><desc id="desc">An air-release valve vents air at the summit, a scour valve drains the low point to a protected discharge, an altitude valve shuts the tank inlet at the top level and a foot valve keeps the pump primed.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><rect x="30" y="270" width="70" height="70" fill="#d8edf7" stroke="#273b45" stroke-width="2"/><path d="M110 245 L65 245 L65 318" stroke="#466d89" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><rect x="58" y="318" width="14" height="12" fill="#b98232" stroke="#273b45" stroke-width="1.2"/><rect x="110" y="230" width="40" height="30" rx="8" fill="#d6dfe3" stroke="#273b45" stroke-width="2"/><text x="130" y="250.76" font-size="16" fill="#273b45" text-anchor="middle">P</text><text x="30" y="362" font-size="14" fill="#273b45" text-anchor="start">foot valve keeps pump prime</text><path d="M150 245 C190 150 220 118 260 118 C320 118 360 285 430 285 C500 285 560 200 600 175 L600 130" stroke="#466d89" stroke-width="5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="260" y1="116" x2="260" y2="100" stroke="#273b45" stroke-width="3"/><circle cx="260" cy="93" r="7" fill="#e6f1f8" stroke="#287aab" stroke-width="2"/><text x="260" y="72" font-size="14" fill="#287aab" text-anchor="middle">air-release valve at summit</text><line x1="430" y1="288" x2="430" y2="304" stroke="#273b45" stroke-width="3"/><polygon points="422,300 438,310 438,300 422,310" fill="#f2dfdf" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><line x1="438" y1="306" x2="477.65" y2="319.22" stroke="#647780" stroke-width="2" stroke-dasharray="5 4"/><polygon points="486,322 474.14,322.79 476.99,314.25" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><text x="430" y="345" font-size="14" fill="#b64f4f" text-anchor="middle">scour / blow-off valve at low point</text><text x="430" y="367" font-size="13" fill="#647780" text-anchor="middle">protected discharge, no backflow</text><line x1="585" y1="130" x2="575" y2="330" stroke="#273b45" stroke-width="3"/><line x1="655" y1="130" x2="665" y2="330" stroke="#273b45" stroke-width="3"/><line x1="580" y1="230" x2="660" y2="230" stroke="#647780" stroke-width="1.5"/><rect x="575" y="60" width="90" height="70" fill="#ffffff" stroke="#273b45" stroke-width="2"/><rect x="577" y="78" width="86" height="50" fill="#d8edf7" stroke="none" stroke-width="2"/><text x="620" y="50" font-size="14" fill="#273b45" text-anchor="middle">elevated tank</text><rect x="594" y="144" width="12" height="12" fill="#2b7b61" stroke="#273b45" stroke-width="1.2"/><line x1="562" y1="120" x2="592" y2="146" stroke="#647780" stroke-width="1.2"/><text x="560" y="110" font-size="14" fill="#2b7b61" text-anchor="end"><tspan x="560" dy="0">altitude valve:</tspan><tspan x="560" dy="17.08">shuts inflow at top level</tspan></text><line x1="550" y1="330" x2="690" y2="330" stroke="#647780" stroke-width="2"/><line x1="556" y1="331" x2="546" y2="342" stroke="#647780" stroke-width="1.4"/><line x1="570" y1="331" x2="560" y2="342" stroke="#647780" stroke-width="1.4"/><line x1="584" y1="331" x2="574" y2="342" stroke="#647780" stroke-width="1.4"/><line x1="598" y1="331" x2="588" y2="342" stroke="#647780" stroke-width="1.4"/><line x1="612" y1="331" x2="602" y2="342" stroke="#647780" stroke-width="1.4"/><line x1="626" y1="331" x2="616" y2="342" stroke="#647780" stroke-width="1.4"/><line x1="640" y1="331" x2="630" y2="342" stroke="#647780" stroke-width="1.4"/><line x1="654" y1="331" x2="644" y2="342" stroke="#647780" stroke-width="1.4"/><line x1="668" y1="331" x2="658" y2="342" stroke="#647780" stroke-width="1.4"/><line x1="682" y1="331" x2="672" y2="342" stroke="#647780" stroke-width="1.4"/><text x="360" y="404" font-size="15" fill="#273b45" text-anchor="middle">Each valve's position follows its single duty</text></g></svg>