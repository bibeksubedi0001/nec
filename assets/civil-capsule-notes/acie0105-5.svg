<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Reducing a total-station observation</title><desc id="desc">The slope distance S and vertical angle α give H = S cos α and V = S sin α; the target ground RL adds the instrument height and V and subtracts the target height.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><path d="M40 340 L300 340 L460 280 L700 280" stroke="#647780" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><rect x="88" y="244" width="24" height="18" fill="#466d89" stroke="#466d89" stroke-width="2"/><line x1="100" y1="262" x2="80" y2="340" stroke="#647780" stroke-width="2"/><line x1="100" y1="262" x2="120" y2="340" stroke="#647780" stroke-width="2"/><line x1="560" y1="280" x2="560" y2="200" stroke="#273b45" stroke-width="3"/><polygon points="560,186 570,198 560,210 550,198" fill="#b64f4f" stroke="#b64f4f" stroke-width="2" stroke-linejoin="round"/><line x1="100" y1="260" x2="560" y2="200" stroke="#287aab" stroke-width="3"/><text x="330" y="216" font-size="19" fill="#287aab" text-anchor="middle">S</text><line x1="100" y1="260" x2="560" y2="260" stroke="#647780" stroke-width="1.5" stroke-dasharray="6 5"/><line x1="560" y1="260" x2="560" y2="200" stroke="#647780" stroke-width="1.5" stroke-dasharray="6 5"/><path d="M169.42 250.98 A70 70 0 0 1 170 260" stroke="#2b7b61" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="182" y="256" font-size="18" fill="#2b7b61" text-anchor="middle">α</text><text x="330" y="284" font-size="17" fill="#273b45" text-anchor="middle">H = S cos α</text><text x="548" y="250" font-size="17" fill="#273b45" text-anchor="end">V = S sin α</text><line x1="72" y1="340" x2="72" y2="260" stroke="#647780" stroke-width="1.5"/><line x1="65" y1="340" x2="79" y2="340" stroke="#647780" stroke-width="1.5"/><line x1="65" y1="260" x2="79" y2="260" stroke="#647780" stroke-width="1.5"/><text x="64" y="306" font-size="17" fill="#647780" text-anchor="end">hi</text><line x1="600" y1="280" x2="600" y2="200" stroke="#647780" stroke-width="1.5"/><line x1="593" y1="280" x2="607" y2="280" stroke="#647780" stroke-width="1.5"/><line x1="593" y1="200" x2="607" y2="200" stroke="#647780" stroke-width="1.5"/><text x="610" y="246" font-size="17" fill="#647780" text-anchor="start">ht</text><text x="100" y="372" font-size="16" fill="#647780" text-anchor="middle">Station</text><text x="560" y="312" font-size="16" fill="#647780" text-anchor="middle">Target</text><text x="360" y="400" font-size="18" fill="#273b45" text-anchor="middle">RLt = RLs + hi + V − ht</text></g></svg>