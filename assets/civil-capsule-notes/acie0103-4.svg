<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Three carpentry joints</title><desc id="desc">Tongue and groove uses a continuous edge ridge, mortise and tenon a localised end projection in a socket, and a half lap removes half of each member so faces stay flush.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><rect x="30" y="150" width="88" height="40" fill="#f5ead8" stroke="#b98232" stroke-width="2"/><rect x="118" y="162" width="20" height="16" fill="#f5ead8" stroke="#b98232" stroke-width="2"/><polygon points="146,150 226,150 226,190 146,190 146,178 166,178 166,162 146,162" fill="#e8d3a6" stroke="#b98232" stroke-width="2" stroke-linejoin="round"/><text x="128" y="290" font-size="18" fill="#273b45" text-anchor="middle">Tongue and groove</text><text x="128" y="316" font-size="15" fill="#647780" text-anchor="middle">continuous edge ridge</text><rect x="290" y="100" width="44" height="150" fill="#e8d3a6" stroke="#b98232" stroke-width="2"/><rect x="354" y="150" width="110" height="42" fill="#f5ead8" stroke="#b98232" stroke-width="2"/><rect x="300" y="157" width="54" height="28" fill="#f5ead8" stroke="#b98232" stroke-width="2" stroke-dasharray="5 4"/><text x="377" y="290" font-size="18" fill="#273b45" text-anchor="middle">Mortise and tenon</text><text x="377" y="316" font-size="15" fill="#647780" text-anchor="middle">end projection into a socket</text><polygon points="498,150 598,150 598,170 638,170 638,190 498,190" fill="#f5ead8" stroke="#b98232" stroke-width="2" stroke-linejoin="round"/><polygon points="598,150 700,150 700,190 638,190 638,170 598,170" fill="#e8d3a6" stroke="#b98232" stroke-width="2" stroke-linejoin="round"/><text x="600" y="290" font-size="18" fill="#273b45" text-anchor="middle">Half lap</text><text x="600" y="316" font-size="15" fill="#647780" text-anchor="middle">faces stay flush</text></g></svg>