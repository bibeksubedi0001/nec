<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Roof rainwater harvesting and a stepwell</title><desc id="desc">Direct roof harvesting is recognised by its pathway: roof catchment, gutter and downpipe, first-flush diverter and covered tank. A stepwell is named for steps down to a changing water level, whatever its source.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="50" y1="70" x2="42" y2="110" stroke="#287aab" stroke-width="1.5" stroke-dasharray="5 5"/><line x1="74" y1="70" x2="66" y2="110" stroke="#287aab" stroke-width="1.5" stroke-dasharray="5 5"/><line x1="98" y1="70" x2="90" y2="110" stroke="#287aab" stroke-width="1.5" stroke-dasharray="5 5"/><line x1="122" y1="70" x2="114" y2="110" stroke="#287aab" stroke-width="1.5" stroke-dasharray="5 5"/><line x1="146" y1="70" x2="138" y2="110" stroke="#287aab" stroke-width="1.5" stroke-dasharray="5 5"/><line x1="170" y1="70" x2="162" y2="110" stroke="#287aab" stroke-width="1.5" stroke-dasharray="5 5"/><text x="110" y="55" font-size="15" fill="#287aab" text-anchor="middle">rain on the roof catchment</text><rect x="40" y="205" width="140" height="125" fill="#d6dfe3" stroke="#273b45" stroke-width="2"/><polygon points="30,205 110,150 190,205" fill="#e4e8e9" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><rect x="186" y="203" width="14" height="10" fill="#ffffff" stroke="#273b45" stroke-width="1.5"/><text x="206" y="196" font-size="14" fill="#273b45" text-anchor="start">gutter</text><path d="M193 213 L193 240 L290 240" stroke="#466d89" stroke-width="5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><rect x="244" y="240" width="14" height="70" fill="#ffffff" stroke="#273b45" stroke-width="1.5"/><text x="251" y="228" font-size="14" fill="#273b45" text-anchor="middle">first flush</text><rect x="290" y="230" width="80" height="100" fill="#ffffff" stroke="#273b45" stroke-width="2"/><rect x="292" y="262" width="76" height="66" fill="#d8edf7" stroke="none" stroke-width="2"/><line x1="286" y1="230" x2="374" y2="230" stroke="#273b45" stroke-width="5"/><line x1="370" y1="315" x2="384" y2="315" stroke="#466d89" stroke-width="4"/><text x="330" y="212" font-size="14" fill="#273b45" text-anchor="middle">covered tank</text><line x1="20" y1="330" x2="380" y2="330" stroke="#647780" stroke-width="2"/><line x1="26" y1="331" x2="16" y2="342" stroke="#647780" stroke-width="1.4"/><line x1="40" y1="331" x2="30" y2="342" stroke="#647780" stroke-width="1.4"/><line x1="54" y1="331" x2="44" y2="342" stroke="#647780" stroke-width="1.4"/><line x1="68" y1="331" x2="58" y2="342" stroke="#647780" stroke-width="1.4"/><line x1="82" y1="331" x2="72" y2="342" stroke="#647780" stroke-width="1.4"/><line x1="96" y1="331" x2="86" y2="342" stroke="#647780" stroke-width="1.4"/><line x1="110" y1="331" x2="100" y2="342" stroke="#647780" stroke-width="1.4"/><line x1="124" y1="331" x2="114" y2="342" stroke="#647780" stroke-width="1.4"/><line x1="138" y1="331" x2="128" y2="342" stroke="#647780" stroke-width="1.4"/><line x1="152" y1="331" x2="142" y2="342" stroke="#647780" stroke-width="1.4"/><line x1="166" y1="331" x2="156" y2="342" stroke="#647780" stroke-width="1.4"/><line x1="180" y1="331" x2="170" y2="342" stroke="#647780" stroke-width="1.4"/><line x1="194" y1="331" x2="184" y2="342" stroke="#647780" stroke-width="1.4"/><line x1="208" y1="331" x2="198" y2="342" stroke="#647780" stroke-width="1.4"/><line x1="222" y1="331" x2="212" y2="342" stroke="#647780" stroke-width="1.4"/><line x1="236" y1="331" x2="226" y2="342" stroke="#647780" stroke-width="1.4"/><line x1="250" y1="331" x2="240" y2="342" stroke="#647780" stroke-width="1.4"/><line x1="264" y1="331" x2="254" y2="342" stroke="#647780" stroke-width="1.4"/><line x1="278" y1="331" x2="268" y2="342" stroke="#647780" stroke-width="1.4"/><line x1="292" y1="331" x2="282" y2="342" 