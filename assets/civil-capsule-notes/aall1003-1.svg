<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Activity-on-arrow network with a dummy</title><desc id="desc">In AOA notation arrows are activities and nodes are events that take no time. When C needs both A and B but D needs only A, a zero-duration dummy from the end of A to the start of C keeps the logic.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><text x="360" y="40" font-size="16" fill="#273b45" text-anchor="middle">Activity-on-arrow with a dummy</text><line x1="97.36" y1="192.28" x2="236.06" y2="130.64" stroke="#287aab" stroke-width="2.5"/><polygon points="242.64,127.72 236.04,135.03 232.79,127.72" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><line x1="97.36" y1="207.72" x2="236.06" y2="269.36" stroke="#287aab" stroke-width="2.5"/><polygon points="242.64,272.28 232.79,272.28 236.04,264.97" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><line x1="279" y1="120" x2="443.8" y2="120" stroke="#287aab" stroke-width="2.5"/><polygon points="451,120 442,124 442,116" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><line x1="279" y1="280" x2="443.8" y2="280" stroke="#287aab" stroke-width="2.5"/><polygon points="451,280 442,284 442,276" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><line x1="260" y1="139" x2="260" y2="253.8" stroke="#b64f4f" stroke-width="2" stroke-dasharray="6 4"/><polygon points="260,261 256,252 264,252" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><circle cx="80" cy="200" r="18" fill="#ffffff" stroke="#273b45" stroke-width="2"/><text x="80" y="205" font-size="15" fill="#273b45" text-anchor="middle">1</text><circle cx="260" cy="120" r="18" fill="#ffffff" stroke="#273b45" stroke-width="2"/><text x="260" y="125" font-size="15" fill="#273b45" text-anchor="middle">2</text><circle cx="260" cy="280" r="18" fill="#ffffff" stroke="#273b45" stroke-width="2"/><text x="260" y="285" font-size="15" fill="#273b45" text-anchor="middle">3</text><circle cx="470" cy="280" r="18" fill="#ffffff" stroke="#273b45" stroke-width="2"/><text x="470" y="285" font-size="15" fill="#273b45" text-anchor="middle">4</text><circle cx="470" cy="120" r="18" fill="#ffffff" stroke="#273b45" stroke-width="2"/><text x="470" y="125" font-size="15" fill="#273b45" text-anchor="middle">5</text><text x="160" y="150" font-size="16" fill="#287aab" text-anchor="middle">A</text><text x="160" y="262" font-size="16" fill="#287aab" text-anchor="middle">B</text><text x="365" y="110" font-size="14" fill="#287aab" text-anchor="middle">D (needs A only)</text><text x="365" y="304" font-size="14" fill="#287aab" text-anchor="middle">C (needs A and B)</text><text x="272" y="205" font-size="13" fill="#b64f4f" text-anchor="start">dummy: 0 days, no resources</text><text x="360" y="340" font-size="14" fill="#273b45" text-anchor="middle">Arrow = activity; node = event, an instant with no time or resources</text><text x="360" y="364" font-size="14" fill="#273b45" text-anchor="middle">C follows A and B, D follows A only: the dummy 2 → 3 keeps that logic</text><text x="360" y="388" font-size="13" fill="#647780" text-anchor="middle">Event numbers identify logic, not calendar days</text></g></svg>