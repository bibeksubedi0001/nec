<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Effective rainfall and the net irrigation requirement</title><desc id="desc">Only the part of rain the crop can use counts: of 80 mm, 50 mm is effective. With crop ET of 150 mm, the net irrigation requirement is 150 - 50 = 100 mm, not 70 mm.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="80" y1="310" x2="480" y2="310" stroke="#647780" stroke-width="2"/><rect x="110" y="235" width="90" height="75" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><rect x="110" y="190" width="90" height="45" fill="#d6dfe3" stroke="#273b45" stroke-width="2" stroke-dasharray="5 4"/><text x="155" y="278" font-size="15" fill="#2b7b61" text-anchor="middle">Pe 50</text><text x="208" y="216" font-size="14" fill="#647780" text-anchor="start">runoff + drainage 30</text><rect x="380" y="235" width="90" height="75" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><rect x="380" y="85" width="90" height="150" fill="#e6f1f8" stroke="#287aab" stroke-width="2"/><text x="425" y="278" font-size="15" fill="#2b7b61" text-anchor="middle">Pe 50</text><text x="425" y="165" font-size="16" fill="#287aab" text-anchor="middle">NIR 100</text><line x1="200" y1="235" x2="380" y2="235" stroke="#2b7b61" stroke-width="1.5" stroke-dasharray="6 4"/><text x="155" y="334" font-size="15" fill="#273b45" text-anchor="middle">rain 80 mm</text><text x="425" y="334" font-size="15" fill="#273b45" text-anchor="middle">crop ET 150 mm</text><text x="600" y="150" font-size="17" fill="#273b45" text-anchor="middle">NIR = ETc − Pe</text><text x="600" y="178" font-size="16" fill="#287aab" text-anchor="middle">= 150 − 50 = 100 mm</text><text x="600" y="206" font-size="15" fill="#b64f4f" text-anchor="middle">not 150 − 80 = 70 mm</text><text x="600" y="234" font-size="14" fill="#647780" text-anchor="middle">gross supply adds losses</text><text x="360" y="380" font-size="14" fill="#273b45" text-anchor="middle">Hydrology's effective rainfall (rainfall excess) means runoff: check the meaning</text></g></svg>