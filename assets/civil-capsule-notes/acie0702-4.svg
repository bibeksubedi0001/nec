<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Lined canal sections sized with Manning</title><desc id="desc">Hydraulic radius uses the wetted perimeter only: a 4 m by 2 m rectangle has R = 8/8 = 1 m and carries 8.00 cumecs. For 90 cumecs at 2 m/s, A = 45 m² and a 3 m deep, 1.5:1 trapezoid needs b = 10.5 m.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><text x="170" y="60" font-size="15" fill="#273b45" text-anchor="middle">Rectangle: R from wetted perimeter</text><rect x="80" y="180" width="160" height="80" fill="#d8edf7" stroke="none" stroke-width="2"/><line x1="80" y1="180" x2="240" y2="180" stroke="#287aab" stroke-width="2" stroke-dasharray="6 4"/><path d="M80 140 L80 260 L240 260 L240 140" stroke="#273b45" stroke-width="5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M84 180 L84 256 L236 256 L236 180" stroke="#b64f4f" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="160" y="172" font-size="13" fill="#287aab" text-anchor="middle">free surface excluded</text><line x1="80" y1="276" x2="240" y2="276" stroke="#647780" stroke-width="1.5"/><line x1="80" y1="269" x2="80" y2="283" stroke="#647780" stroke-width="1.5"/><line x1="240" y1="269" x2="240" y2="283" stroke="#647780" stroke-width="1.5"/><text x="160" y="302" font-size="14" fill="#647780" text-anchor="middle">b = 4 m</text><line x1="60" y1="180" x2="60" y2="260" stroke="#647780" stroke-width="1.5"/><line x1="67" y1="180" x2="53" y2="180" stroke="#647780" stroke-width="1.5"/><line x1="67" y1="260" x2="53" y2="260" stroke="#647780" stroke-width="1.5"/><text x="52" y="226" font-size="14" fill="#647780" text-anchor="end">y = 2 m</text><text x="170" y="330" font-size="14" fill="#273b45" text-anchor="middle">A = 8, P = 4 + 2 × 2 = 8, R = 1 m</text><text x="170" y="354" font-size="14" fill="#2b7b61" text-anchor="middle">Q = (1/0.020) × 8 × 1 × 0.02 = 8.00 m³/s</text><line x1="350" y1="40" x2="350" y2="370" stroke="#b8c8ce" stroke-width="1.5" stroke-dasharray="6 5"/><text x="540" y="60" font-size="15" fill="#273b45" text-anchor="middle">Trial trapezoid for 90 m³/s</text><polygon points="394,205 686,205 619,250 461,250" fill="#d8edf7" stroke="none" stroke-width="2" stroke-linejoin="round"/><path d="M380 196 L461 250 L619 250 L700 196" stroke="#273b45" stroke-width="5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="540" y1="205" x2="540" y2="250" stroke="#647780" stroke-width="1.5"/><line x1="547" y1="205" x2="533" y2="205" stroke="#647780" stroke-width="1.5"/><line x1="547" y1="250" x2="533" y2="250" stroke="#647780" stroke-width="1.5"/><text x="548" y="233.5" font-size="14" fill="#647780" text-anchor="start">y = 3 m</text><line x1="461" y1="266" x2="619" y2="266" stroke="#647780" stroke-width="1.5"/><line x1="461" y1="259" x2="461" y2="273" stroke="#647780" stroke-width="1.5"/><line x1="619" y1="259" x2="619" y2="273" stroke="#647780" stroke-width="1.5"/><text x="540" y="292" font-size="14" fill="#647780" text-anchor="middle">b = 10.5 m</text><text x="420" y="240" font-size="13" fill="#273b45" text-anchor="end">z = 1.5</text><text x="540" y="330" font-size="14" fill="#273b45" text-anchor="middle">A = Q/V = 90/2 = 45 m²</text><text x="540" y="354" font-size="14" fill="#2b7b61" text-anchor="middle">b = A/y − zy = 15 − 4.5 = 10.5 m</text><text x="360" y="396" font-size="13" fill="#647780" text-anchor="middle">IS 10430: trapezoids permitted for all lined canals; Manning, not regime theory</text></g></svg>