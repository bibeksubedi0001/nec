<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Broad-crested weir and the 3/2 power law</title><desc id="desc">Critical depth forms on a broad crest, about 2H/3 for an ideal weir, and discharge grows as H to the power 3/2, so four times the head gives eight times the flow.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><polygon points="40,150 220,150 270,160 320,178 440,184 470,210 500,258 530,290 680,290 680,330 40,330" fill="#d8edf7" stroke="none" stroke-width="2" stroke-linejoin="round"/><path d="M40 150 L220 150 L270 160 L320 178 L440 184 L470 210 L500 258 L530 290 L680 290" stroke="#287aab" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M260 330 L260 256 Q260 240 276 240 L460 240 L460 330 Z" stroke="#273b45" stroke-width="2" fill="#e4e8e9" stroke-linejoin="round" stroke-linecap="round"/><line x1="40" y1="330" x2="680" y2="330" stroke="#273b45" stroke-width="3"/><line x1="42" y1="330" x2="56" y2="344" stroke="#8a9aa3" stroke-width="1"/><line x1="58" y1="330" x2="72" y2="344" stroke="#8a9aa3" stroke-width="1"/><line x1="74" y1="330" x2="88" y2="344" stroke="#8a9aa3" stroke-width="1"/><line x1="90" y1="330" x2="104" y2="344" stroke="#8a9aa3" stroke-width="1"/><line x1="106" y1="330" x2="120" y2="344" stroke="#8a9aa3" stroke-width="1"/><line x1="122" y1="330" x2="136" y2="344" stroke="#8a9aa3" stroke-width="1"/><line x1="138" y1="330" x2="152" y2="344" stroke="#8a9aa3" stroke-width="1"/><line x1="154" y1="330" x2="168" y2="344" stroke="#8a9aa3" stroke-width="1"/><line x1="170" y1="330" x2="184" y2="344" stroke="#8a9aa3" stroke-width="1"/><line x1="186" y1="330" x2="200" y2="344" stroke="#8a9aa3" stroke-width="1"/><line x1="202" y1="330" x2="216" y2="344" stroke="#8a9aa3" stroke-width="1"/><line x1="218" y1="330" x2="232" y2="344" stroke="#8a9aa3" stroke-wi