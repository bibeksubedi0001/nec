<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">From raw meal to Portland cement</title><desc id="desc">Limestone and clay or shale form the raw meal; kiln burning produces clinker, and gypsum joins only when the clinker is ground.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><rect x="20" y="40" width="220" height="72" rx="8" fill="#f0e6d4" stroke="#b98232" stroke-width="2"/><text x="130" y="71.5" font-size="18" fill="#273b45" text-anchor="middle"><tspan x="130" dy="0">Limestone</tspan><tspan x="130" dy="21.96">calcium carbonate</tspan></text><rect x="20" y="130" width="220" height="96" rx="8" fill="#f0e6d4" stroke="#b98232" stroke-width="2"/><text x="130" y="162.52" font-size="18" fill="#273b45" text-anchor="middle"><tspan x="130" dy="0">Clay or shale</tspan><tspan x="130" dy="21.96">silica, alumina,</tspan><tspan x="130" dy="21.96">iron oxide</tspan></text><rect x="300" y="100" width="150" height="66" rx="8" fill="#e6f1f8" stroke="#287aab" stroke-width="2"/><text x="375" y="139.48" font-size="18" fill="#273b45" text-anchor="middle">Raw meal</text><rect x="505" y="92" width="195" height="82" rx="8" fill="#f2dfdf" stroke="#b64f4f" stroke-width="2"/><text x="602.5" y="128.5" font-size="18" fill="#273b45" text-anchor="middle"><tspan x="602.5" dy="0">Kiln burning</tspan><tspan x="602.5" dy="21.96">to clinker</tspan></text><rect x="505" y="262" width="195" height="102" rx="8" fill="#d6dfe3" stroke="#647780" stroke-width="2"/><text x="602.5" y="297.52" font-size="18" fill="#273b45" text-anchor="middle"><tspan x="602.5" dy="0">Clinker phases</tspan><tspan x="602.5" dy="21.96">C3S   C2S</tspan><tspan x="602.5" dy="21.96">C3A   C4AF</tspan></text><rect x="300" y="196" width="150" height="44" rx="8" fill="#f5ead8" stroke="#b98232" stroke-width="2"/><text x="375" y="224.48" font-size="18" fill="#273b45" text-anchor="middle">Gypsum</text><rect x="300" y="280" width="150" height="66" rx="8" fill="#e6f1f8" stroke="#287aab" stroke-width="2"/><text x="375" y="319.48" font-size="18" fill="#273b45" text-anchor="middle">Grinding</text><rect x="20" y="280" width="220" height="66" rx="8" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><text x="130" y="319.48" font-size="18" fill="#273b45" text-anchor="middle">Portland cement</text><line x1="240" y1="76" x2="290.99" y2="114.68" stroke="#287aab" stroke-width="3"/><polygon points="298,120 286.52,116.94 291.96,109.77" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><line x1="240" y1="178" x2="290.29" y2="150.25" stroke="#287aab" stroke-width="3"/><polygon points="298,146 290.54,155.25 286.19,147.37" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><line x1="450" y1="133" x2="494.2" y2="133" stroke="#287aab" stroke-width="3"/><polygon points="503,133 492,137.5 492,128.5" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><line x1="602" y1="174" x2="602" y2="251.2" stroke="#287aab" stroke-width="3"/><polygon points="602,260 597.5,249 606.5,249" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><line x1="505" y1="313" x2="460.8" y2="313" stroke="#287aab" stroke-width="3"/><polygon points="452,313 463,308.5 463,317.5" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><line x1="375" y1="240" x2="375" y2="269.2" stroke="#b98232" stroke-width="3"/><polygon points="375,278 370.5,267 379.5,267" fill="#b98232" stroke="#b98232" stroke-width="1.5" stroke-linejoin="round"/><line x1="300" y1="313" x2="250.8" y2="313" stroke="#287aab" stroke-width="3"/><polygon points="242,313 253,308.5 253,317.5" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/></g></svg>