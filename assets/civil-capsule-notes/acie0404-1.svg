<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Resilience and toughness on a stress-strain curve</title><desc id="desc">The area under the elastic part up to the elastic limit is the modulus of resilience; the whole area to fracture is toughness, which includes plastic work.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="90" y1="320" x2="466" y2="320" stroke="#647780" stroke-width="2"/><polygon points="474,320 464,324 464,316" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><line x1="90" y1="320" x2="90" y2="64" stroke="#647780" stroke-width="2"/><polygon points="90,56 94,66 86,66" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><text x="275" y="360" font-size="16" fill="#273b45" text-anchor="middle">Strain</text><text x="96" y="46" font-size="16" fill="#273b45" text-anchor="start">Stress</text><polygon points="90,320 119.6,182.5 164,180 201,165 256.5,125 312,107.5 367.5,112.5 423,145 423,320" fill="#f5ead8" stroke="none" stroke-width="2" stroke-linejoin="round"/><polygon points="90,320 119.6,182.5 119.6,320" fill="#deeee6" stroke="#2b7b61" stroke-width="1.5" stroke-linejoin="round"/><path d="M90 320 L119.6 182.5 L164 180 L201 165 L256.5 125 L312 107.5 L367.5 112.5 L423 145" stroke="#287aab" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="125.6" y="172.5" font-size="15" fill="#273b45" text-anchor="start">σe</text><line x1="108.5" y1="290" x2="150" y2="362" stroke="#2b7b61" stroke-width="1.2"/><text x="150" y="378" font-size="14" fill="#2b7b61" text-anchor="middle">σe² / 2E per unit volume</text><text x="275" y="232.5" font-size="15" fill="#b98232" text-anchor="middle">toughness: energy to fracture</text><text x="490" y="110" font-size="16" fill="#273b45" text-anchor="start">Proof resilience</text><text x="490" y="134" font-size="16" fill="#273b45" text-anchor="start">= σe² V / 2E</text><text x="490" y="172" font-size="13" fill="#647780" text-anchor="start">σe: elastic-limit stress</text><text x="490" y="204" font-size="14" fill="#273b45" text-anchor="start">σe = 250 MPa, E = 200 GPa:</text><text x="490" y="228" font-size="14" fill="#273b45" text-anchor="start">σe² / 2E = 0.15625 N/mm²</text><text x="490" y="252" font-size="14" fill="#273b45" text-anchor="start">× 10⁶ mm³ = 156.25 J</text><text x="490" y="292" font-size="15" fill="#b64f4f" text-anchor="start">An energy, not a load</text></g></svg>