<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Creep length: Bligh and Lane</title><desc id="desc">For a 42 m floor with thin cutoffs 4 m and 7 m deep, both faces of each cutoff count: Bligh gives 8 + 42 + 14 = 64 m, while Lane counts the floor at one-third, 22 + 14 = 36 m.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><rect x="20" y="170" width="680" height="100" fill="#f0e6d4" stroke="none" stroke-width="2"/><rect x="20" y="100" width="90" height="70" fill="#d8edf7" stroke="none" stroke-width="2"/><line x1="20" y1="170" x2="700" y2="170" stroke="#273b45" stroke-width="1.5"/><rect x="110" y="150" width="440" height="20" fill="#e4e8e9" stroke="#273b45" stroke-width="2"/><rect x="116" y="170" width="8" height="40" fill="#466d89" stroke="#273b45" stroke-width="1"/><rect x="536" y="170" width="8" height="70" fill="#466d89" stroke="#273b45" stroke-width="1"/><path d="M112 172 L112 214 L128 214 L128 174 L532 174 L532 244 L548 244 L548 172" stroke="#b64f4f" stroke-width="2.5" fill="none" stroke-dasharray="6 4" stroke-linejoin="round" stroke-linecap="round"/><line x1="120" y1="132" x2="540" y2="132" stroke="#647780" stroke-width="1.5"/><line x1="120" y1="125" x2="120" y2="139" stroke="#647780" stroke-width="1.5"/><line x1="540" y1="125" x2="540" y2="139" stroke="#647780" stroke-width="1.5"/><text x="330" y="122" font-size="15" fill="#647780" text-anchor="middle">L = 42 m</text><text x="104" y="200" font-size="14" fill="#273b45" text-anchor="end">d1 = 4 m</text><text x="556" y="218" font-size="14" fill="#273b45" text-anchor="start">d2 = 7 m</text><text x="330" y="196" font-size="14" fill="#b64f4f" text-anchor="middle">creep path along the contact</text><text x="360" y="296" font-size="16" fill="#287aab" text-anchor="middle">Bligh: LB = 2(4) + 42 + 2(7) = 64 m</text><text x="360" y="322" font-size="16" fill="#b64f4f" text-anchor="middle">Lane: Lw = 2(4) + 2(7) + 42/3 = 36 m</text><text x="360" y="348" font-size="14" fill="#273b45" text-anchor="middle">Lane counts horizontal contact at one-third, vertical in full</text><text x="360" y="374" font-size="13" fill="#647780" text-anchor="middle">Khosla replaces creep length with potential flow</text></g></svg>