<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Act, rules, policy and contract</title><desc id="desc">The Electricity Act 2049 is the principal Act; the Electricity Rules 2050 were made by the Government under its section 40. The Hydropower Development Policy 2058 is Government policy; a PPA is a contract.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><rect x="40" y="60" width="300" height="64" rx="8" fill="#e6f1f8" stroke="#287aab" stroke-width="2"/><text x="190" y="88.25" font-size="15" fill="#273b45" text-anchor="middle"><tspan x="190" dy="0">Electricity Act, 2049 (1992)</tspan><tspan x="190" dy="18.3">principal Act, by the legislature</tspan></text><line x1="190" y1="128" x2="190" y2="177.2" stroke="#287aab" stroke-width="3"/><polygon points="190,186 185.5,175 194.5,175" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><text x="200" y="160" font-size="13" fill="#287aab" text-anchor="start">section 40: delegated power</text><rect x="40" y="190" width="300" height="64" rx="8" fill="#e6f1f8" stroke="#287aab" stroke-width="2"/><text x="190" y="218.25" font-size="15" fill="#273b45" text-anchor="middle"><tspan x="190" dy="0">Electricity Rules, 2050 (1993)</tspan><tspan x="190" dy="18.3">subordinate legislation, by GoN</tspan></text><rect x="380" y="60" width="300" height="64" rx="8" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><text x="530" y="88.5" font-size="14" fill="#273b45" text-anchor="middle"><tspan x="530" dy="0">Hydropower Development Policy, 2058 (2001)</tspan><tspan x="530" dy="17.08">Government policy, not NEA</tspan></text><text x="530" y="146" font-size="14" fill="#2b7b61" text-anchor="middle">objective (s. 3): reliable electricity</text><text x="530" y="166" font-size="14" fill="#2b7b61" text-anchor="middle">for consumers at low cost</text><rect x="380" y="190" width="300" height="64" rx="8" fill="#f5ead8" stroke="#b98232" stroke-width="2"/><text x="530" y="218.25" font-size="15" fill="#273b45" text-anchor="middle"><tspan x="530" dy="0">Power purchase agreement</tspan><tspan x="530" dy="18.3">contract between the parties</tspan></text><text x="360" y="310" font-size="14" fill="#273b45" text-anchor="middle">Rules are not a utility board decision; a PPA is not a regulation</text><text x="360" y="336" font-size="13" fill="#647780" text-anchor="middle">MW installed, exports or speed are different measures from the objective</text><text x="360" y="360" font-size="13" fill="#647780" text-anchor="middle">Historical framework: check the edition in force</text></g></svg>