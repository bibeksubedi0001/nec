<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Draft tube pressure recovery</title><desc id="desc">The draft tube runs from the runner outlet to the submerged tailwater. Slowing from 8 to 4 m/s over a 3 m drop with 0.40 m loss raises the pressure head by 5.05 m; total head still falls by the loss.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><rect x="150" y="250" width="400" height="90" fill="#d8edf7" stroke="none" stroke-width="2"/><line x1="150" y1="250" x2="550" y2="250" stroke="#287aab" stroke-width="2"/><text x="500" y="276" font-size="14" fill="#287aab" text-anchor="middle">tailwater</text><polygon points="310,120 370,120 410,300 270,300" fill="#d8edf7" stroke="none" stroke-width="2" stroke-linejoin="round"/><line x1="310" y1="120" x2="270" y2="300" stroke="#273b45" stroke-width="4"/><line x1="370" y1="120" x2="410" y2="300" stroke="#273b45" stroke-width="4"/><rect x="295" y="70" width="90" height="50" rx="8" fill="#d6dfe3" stroke="#273b45" stroke-width="2"/><text x="340" y="100.4" font-size="15" fill="#273b45" text-anchor="middle">runner</text><line x1="300" y1="128" x2="380" y2="128" stroke="#b64f4f" stroke-width="1.5" stroke-dasharray="4 3"/><line x1="262" y1="300" x2="418" y2="300" stroke="#b64f4f" stroke-width="1.5" stroke-dasharray="4 3"/><text x="296" y="144" font-size="14" fill="#273b45" text-anchor="end">1: V1 = 8 m/s</text><text x="262" y="318" font-size="14" fill="#273b45" text-anchor="end">2: V2 = 4 m/s</text><line x1="340" y1="150" x2="340" y2="191.2" stroke="#287aab" stroke-width="4"/><polygon points="340,200 335.5,189 344.5,189" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><line x1="340" y1="230" x2="340" y2="247.2" stroke="#287aab" stroke-width="2.5"/><polygon points="340,256 335.5,245 344.5,245" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><line x1="450" y1="128" x2="450" y2="300" stroke="#647780" stroke-width="1.5"/><line x1="457" y1="128" x2="443" y2="128" stroke="#647780" stroke-width="1.5"/><line x1="457" y1="300" x2="443" y2="300" stroke="#647780" stroke-width="1.5"/><text x="460" y="220" font-size="14" fill="#647780" text-anchor="start">z1 − z2 = 3 m</text><text x="580" y="140" font-size="14" fill="#273b45" text-anchor="middle">expanding passage recovers</text><text x="580" y="160" font-size="14" fill="#273b45" text-anchor="middle">velocity head as pressure</text><text x="360" y="362" font-size="14" fill="#287aab" text-anchor="middle">Δ(p/ρg) = (z1 − z2) + (V1² − V2²)/2g − hL = 3 + 2.446 − 0.40 = 5.05 m</text><text x="360" y="384" font-size="13" fill="#273b45" text-anchor="middle">Cavitation: local absolute pressure against vapour pressure; less margin at altitude</text><text x="360" y="406" font-size="13" fill="#647780" text-anchor="middle">σ = (Hatm − Hv − Hs)/H must exceed the machine's critical value</text></g></svg>