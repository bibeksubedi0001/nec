<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Perpendicular axes and section modulus</title><desc id="desc">For a plane area the polar moment about the normal axis equals Ix + Iy; the elastic section modulus divides I by the distance to the extreme fibre.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="380" y1="40" x2="380" y2="396" stroke="#b8c8ce" stroke-width="1.5" stroke-dasharray="6 6"/><rect x="90" y="150" width="200" height="140" fill="#e6f1f8" stroke="#287aab" stroke-width="2"/><line x1="60" y1="220" x2="325.2" y2="220" stroke="#273b45" stroke-width="2"/><polygon points="334,220 323,224.5 323,215.5" fill="#273b45" stroke="#273b45" stroke-width="1.5" stroke-linejoin="round"/><text x="340" y="226" font-size="18" fill="#273b45" text-anchor="start">x</text><line x1="190" y1="330" x2="190" y2="112.8" stroke="#273b45" stroke-width="2"/><polygon points="190,104 194.5,115 185.5,115" fill="#273b45" stroke="#273b45" stroke-width="1.5" stroke-linejoin="round"/><text x="198" y="104" font-size="18" fill="#273b45" text-anchor="start">y</text><circle cx="190" cy="220" r="9" fill="#ffffff" stroke="#b64f4f" stroke-width="2"/><circle cx="190" cy="220" r="3" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><text x="40" y="72" font-size="15" fill="#b64f4f" text-anchor="start">z: normal to the plane at O</text><line x1="96" y1="78" x2="184" y2="212" stroke="#b64f4f" stroke-width="1.2" stroke-dasharray="3 4"/><line x1="190" y1="220" x2="256" y2="176" stroke="#647780" stroke-width="1.5" stroke-dasharray="4 4"/><rect x="254" y="170" width="9" height="9" fill="#287aab" stroke="#287aab" stroke-width="1"/><text x="266" y="168" font-size="15" fill="#273b45" text-anchor="start">dA</text><text x="214" y="188" font-size="16" fill="#647780" text-anchor="middle">r</text><text x="190" y="380" font-size="20" fill="#273b45" text-anchor="middle">J = Ix + Iy</text><rect x="470" y="110" width="120" height="200" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><line x1="440" y1="210" x2="640" y2="210" stroke="#273b45" stroke-width="2" stroke-dasharray="9 6"/><text x="446" y="202" font-size="15" fill="#647780" text-anchor="start">NA</text><line x1="620" y1="210" x2="620" y2="110" stroke="#647780" stroke-width="1.5"/><line x1="613" y1="210" x2="627" y2="210" stroke="#647780" stroke-width="1.5"/><line x1="613" y1="110" x2="627" y2="110" stroke="#647780" stroke-width="1.5"/><text x="632" y="166" font-size="16" fill="#647780" text-anchor="start">ymax</text><text x="530" y="360" font-size="20" fill="#273b45" text-anchor="middle">Z = I / ymax</text></g></svg>