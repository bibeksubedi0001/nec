<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Canal inlet and level crossing</title><desc id="desc">A canal inlet admits a small hillside drain so the flows mix, if the canal has spare capacity and the water is acceptable. A level crossing joins a large canal and a flashy drain at nearly equal bed levels, with gates.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><text x="180" y="40" font-size="16" fill="#273b45" text-anchor="middle">Canal inlet</text><path d="M110 70 Q150 110 140 140 Q134 164 170 176" stroke="#d8edf7" stroke-width="12" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M110 70 Q150 110 140 140 Q134 164 170 176" stroke="#287aab" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="160" y="84" font-size="14" fill="#273b45" text-anchor="start">small hillside drain</text><rect x="20" y="180" width="320" height="40" fill="#d8edf7" stroke="none" stroke-width="2"/><line x1="20" y1="180" x2="340" y2="180" stroke="#273b45" stroke-width="2"/><line x1="20" y1="220" x2="340" y2="220" stroke="#273b45" stroke-width="2"/><line x1="40" y1="200" x2="101.2" y2="200" stroke="#287aab" stroke-width="2.5"/><polygon points="110,200 99,204.5 99,195.5" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><line x1="230" y1="200" x2="311.2" y2="200" stroke="#287aab" stroke-width="2.5"/><polygon points="320,200 309,204.5 309,195.5" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><text x="250" y="160" font-size="14" fill="#287aab" text-anchor="middle">flows mix</text><text x="180" y="246" font-size="14" fill="#273b45" text-anchor="middle">canal with spare capacity</text><text x="180" y="300" font-size="14" fill="#273b45" text-anchor="middle">small drain, acceptable quality</text><text x="180" y="324" font-size="13" fill="#647780" text-anchor="middle">release surplus downstream if needed</text><line x1="355" y1="30" x2="355" y2="400" stroke="#b8c8ce" stroke-width="1.5" stroke-dasharray="6 5"/><text x="540" y="40" font-size="16" fill="#273b45" text-anchor="middle">Level crossing</text><rect x="520" y="60" width="40" height="280" fill="#d8edf7" stroke="none" stroke-width="2"/><rect x="370" y="180" width="330" height="40" fill="#d8edf7" stroke="none" stroke-width="2"/><line x1="370" y1="180" x2="520" y2="180" stroke="#273b45" stroke-width="2"/><line x1="560" y1="180" x2="700" y2="180" stroke="#273b45" stroke-width="2"/><line x1="370" y1="220" x2="520" y2="220" stroke="#273b45" stroke-width="2"/><line x1="560" y1="220" x2="700" y2="220" stroke="#273b45" stroke-width="2"/><line x1="520" y1="60" x2="520" y2="180" stroke="#273b45" stroke-width="2"/><line x1="560" y1="60" x2="560" y2="180" stroke="#273b45" stroke-width="2"/><line x1="520" y1="220" x2="520" y2="340" stroke="#273b45" stroke-width="2"/><line x1="560" y1="220" x2="560" y2="340" stroke="#273b45" stroke-width="2"/><line x1="630" y1="180" x2="630" y2="220" stroke="#b64f4f" stroke-width="5"/><text x="630" y="170" font-size="13" fill="#b64f4f" text-anchor="middle">canal gate</text><line x1="520" y1="262" x2="560" y2="262" stroke="#b64f4f" stroke-width="5"/><text x="570" y="267" font-size="13" fill="#b64f4f" text-anchor="start">drain exit gates</text><text x="440" y="170" font-size="14" fill="#273b45" text-anchor="middle">large canal</text><text x="570" y="84" font-size="14" fill="#273b45" text-anchor="start">flashy drain</text><text x="540" y="370" font-size="14" fill="#273b45" text-anchor="middle">Nearly equal bed levels, gated control</text><text x="540" y="392" font-size="13" fill="#647780" text-anchor="middle">check flood routing, sediment and mixing</text></g></svg>