<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Dissolved-oxygen sag and the self-purification zones</title><desc id="desc">Below a large biodegradable discharge the idealised zones are degradation, active decomposition where DO can fall to nearly zero, recovery and clean water.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><rect x="118.5" y="90" width="96.9" height="200" fill="#f5ead8" stroke="none" stroke-width="2" opacity="0.8"/><text x="166.95" y="108" font-size="14" fill="#273b45" text-anchor="middle">degradation</text><rect x="215.4" y="90" width="171" height="200" fill="#f2dfdf" stroke="none" stroke-width="2" opacity="0.8"/><text x="300.9" y="108" font-size="14" fill="#273b45" text-anchor="middle">active decomposition</text><rect x="386.4" y="90" width="159.6" height="200" fill="#e6f1f8" stroke="none" stroke-width="2" opacity="0.8"/><text x="466.2" y="108" font-size="14" fill="#273b45" text-anchor="middle">recovery</text><rect x="546" y="90" width="114" height="200" fill="#deeee6" stroke="none" stroke-width="2" opacity="0.8"/><text x="603" y="108" font-size="14" fill="#273b45" text-anchor="middle">clean water</text><line x1="90" y1="290" x2="666" y2="290" stroke="#647780" stroke-width="2"/><polygon points="674,290 664,294 664,286" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><line x1="90" y1="290" x2="90" y2="84" stroke="#647780" stroke-width="2"/><polygon points="90,76 94,86 86,86" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><text x="375" y="320" font-size="15" fill="#273b45" text-anchor="middle">distance downstream</text><text x="84" y="66" font-size="15" fill="#273b45" text-anchor="end">DO (mg/L)</text><line x1="85" y1="290" x2="90" y2="290" stroke="#647780" stroke-width="1.5"/><text x="80" y="295" font-size="14" fill="#273b4