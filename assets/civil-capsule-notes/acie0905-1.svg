ke-width="1"/><line x1="659" y1="128" x2="662" y2="282" stroke="#273b45" stroke-width="1"/><text x="590" y="308" font-size="13" fill="#273b45" text-anchor="middle">interconnected cracks in the wheel paths</text><text x="360" y="356" font-size="14" fill="#273b45" text-anchor="middle">Perpetual pavement: deep layers kept sound, surface renewed periodically</text><text x="360" y="380" font-size="13" fill="#647780" text-anchor="middle">Not maintenance-free; no universal 20-year life</text></g></svg>