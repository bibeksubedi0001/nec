<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Bottom-up fatigue cracking</title><desc id="desc">Each wheel pass bends the bound layer and puts its bottom in horizontal tension; repeated strain beyond the fatigue resistance starts cracks there that grow up into interconnected wheel-path cracking.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><rect x="40" y="150" width="420" height="50" fill="#d6dfe3" stroke="#273b45" stroke-width="1.5"/><rect x="40" y="200" width="420" height="60" fill="#e4e8e9" stroke="#273b45" stroke-width="1.5"/><rect x="40" y="260" width="420" height="80" fill="#f0e6d4" stroke="#273b45" stroke-width="1.5"/><text x="50" y="180" font-size="13" fill="#273b45" text-anchor="start">asphalt</text><text x="50" y="236" font-size="13" fill="#273b45" text-anchor="start">granular base</text><text x="50" y="316" font-size="13" fill="#273b45" text-anchor="start">subgrade</text><circle cx="250" cy="122" r="26" fill="#273b45" stroke="#273b45" stroke-width="2"/><line x1="250" y1="60" x2="250" y2="85.2" stroke="#b64f4f" stroke-width="3"/><polygon points="250,94 245.5,83 254.5,83" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><line x1="201.4" y1="194" x2="298.6" y2="194" stroke="#b64f4f" stroke-width="2.5"/><polygon points="305,194 297,197.5 297,190.5" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><polygon points="195,194 203,190.5 203,197.5" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="318" y="190" font-size="13" fill="#b64f4f" text-anchor="start">εt tensile at the bottom</text><path d="M250 200 L246 188 L253 176 L248 164" stroke="#273b45" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="290" y="168" font-size="13" fill="#273b45" text-anchor="start">crack g