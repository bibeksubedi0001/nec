<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Grade compensation on curves, NRS 2070</title><desc id="desc">Compensation is the smaller of (30 + R)/R and 75/R percent; above R = 45 m the 75/R term governs. At R = 600 m it is 0.125 percentage point, so a 6 percent grade becomes 5.875 percent.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="90" y1="290" x2="646" y2="290" stroke="#647780" stroke-width="2"/><polygon points="654,290 644,294 644,286" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><line x1="90" y1="290" x2="90" y2="74" stroke="#647780" stroke-width="2"/><polygon points="90,66 94,76 86,76" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><text x="365" y="330" font-size="15" fill="#273b45" text-anchor="middle">curve radius R (m)</text><text x="96" y="56" font-size="15" fill="#273b45" text-anchor="start">compensation (%)</text><text x="90" y="310" font-size="13" fill="#273b45" text-anchor="middle">0</text><text x="200" y="310" font-size="13" fill="#273b45" text-anchor="middle">200</text><text x="310" y="310" font-size="13" fill="#273b45" text-anchor="middle">400</text><text x="420" y="310" font-size="13" fill="#273b45" text-anchor="middle">600</text><text x="530" y="310" font-size="13" fill="#273b45" text-anchor="middle">800</text><text x="640" y="310" font-size="13" fill="#273b45" text-anchor="middle">1000</text><text x="82" y="253" font-size="13" fill="#273b45" text-anchor="end">0.5</text><text x="82" y="211" font-size="13" fill="#273b45" text-anchor="end">1</text><text x="82" y="169" font-size="13" fill="#273b45" text-anchor="end">1.5</text><text x="82" y="127" font-size="13" fill="#273b45" text-anchor="end">2</text><path d="M106.5 122 L110.95 139.83 L115.39 151.42 L119.84 159.55 L124.28 165.57 L128.73 170.21 L133.18 173.9