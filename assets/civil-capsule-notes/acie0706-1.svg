<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Waterlogging as a groundwater balance</title><desc id="desc">The water table rises while recharge from rain, canal seepage and deep percolation exceeds removal by outflow, drainage, evaporation and pumping. Persistent seepage from an unlined canal can tip the balance.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><rect x="20" y="120" width="680" height="220" fill="#f0e6d4" stroke="none" stroke-width="2"/><rect x="20" y="175" width="680" height="165" fill="#d8edf7" stroke="none" stroke-width="2" opacity="0.7"/><line x1="20" y1="120" x2="700" y2="120" stroke="#273b45" stroke-width="2"/><polygon points="60,120 80,150 140,150 160,120" fill="#d8edf7" stroke="#273b45" stroke-width="1.5" stroke-linejoin="round"/><text x="110" y="104" font-size="14" fill="#273b45" text-anchor="middle">unlined canal</text><line x1="90" y1="154" x2="90" y2="193.6" stroke="#287aab" stroke-width="2" stroke-dasharray="4 3"/><polygon points="90,200 86.5,192 93.5,192" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><line x1="130" y1="154" x2="130" y2="193.6" stroke="#287aab" stroke-width="2" stroke-dasharray="4 3"/><polygon points="130,200 126.5,192 133.5,192" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><line x1="280" y1="50" x2="274" y2="96" stroke="#287aab" stroke-width="1.5" stroke-dasharray="5 5"/><line x1="300" y1="50" x2="294" y2="96" stroke="#287aab" stroke-width="1.5" stroke-dasharray="5 5"/><line x1="320" y1="50" x2="314" y2="96" stroke="#287aab" stroke-width="1.5" stroke-dasharray="5 5"/><text x="300" y="40" font-size="14" fill="#287aab" text-anchor="middle">rain</text><line x1="300" y1="124" x2="300" y2="163.2" stroke="#287aab" stroke-width="2.5"/><polygon points="300,172 295.5,161 304.5,161" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><line x1="430" y1="124" x2="430" y2="163.2" stroke="#287aab" stroke-width="2.5"/><polygon points="430,172 425.5,161 434.5,161" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><text x="430" y="110" font-size="14" fill="#287aab" text-anchor="middle">deep percolation</text><line x1="530" y1="118" x2="530" y2="78.8" stroke="#b64f4f" stroke-width="2.5"/><polygon points="530,70 534.5,81 525.5,81" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="530" y="58" font-size="14" fill="#b64f4f" text-anchor="middle">evaporation</text><rect x="610" y="80" width="10" height="170" fill="#ffffff" stroke="#273b45" stroke-width="1.5"/><line x1="615" y1="84" x2="615" y2="52.8" stroke="#b64f4f" stroke-width="2.5"/><polygon points="615,44 619.5,55 610.5,55" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="640" y="40" font-size="14" fill="#b64f4f" text-anchor="start">pumping</text><line x1="625" y1="290" x2="689.2" y2="290" stroke="#b64f4f" stroke-width="2.5"/><polygon points="698,290 687,294.5 687,285.5" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="660" y="280" font-size="14" fill="#b64f4f" text-anchor="middle">outflow</text><line x1="20" y1="160" x2="700" y2="160" stroke="#2b7b61" stroke-width="1.5" stroke-dasharray="6 4"/><text x="200" y="154" font-size="13" fill="#2b7b61" text-anchor="middle">root zone</text><line x1="20" y1="175" x2="700" y2="175" stroke="#287aab" stroke-width="2.5"/><text x="240" y="196" font-size="14" fill="#287aab" text-anchor="middle">water table rising</text><line x1="20" y1="300" x2="600" y2="300" stroke="#647780" stroke-width="1.5" stroke-dasharray="6 4"/><text x="300" y="322" font-size="13" fill="#647780" text-anchor="middle">earlier water table</text><text x="360" y="372" font-size="16" fill="#273b45" text-anchor="middle">ΔS = recharge − removal &gt; 0 → water table rises</text><text x="360" y="398" font-size="13" fill="#647780" text-anchor="middle">Lining or interceptor drains cut canal seepage; the whole balance decides</text></g></svg>