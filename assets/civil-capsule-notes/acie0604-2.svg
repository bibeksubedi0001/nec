<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Choosing the invert gradient and checking self-cleansing</title><desc id="desc">The invert follows falling ground to save excavation, with a drop where the ground is too steep. At 0.30 m³/s through 0.50 m² the velocity is 0.60 m/s, failing an adopted 0.75 m/s check.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><text x="360" y="40" font-size="16" fill="#273b45" text-anchor="middle">Profile follows falling ground; drops where it is too steep</text><path d="M40 100 L200 120 L300 130 L380 200 L460 215 L680 235" stroke="#b98232" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="48" y="92" font-size="14" fill="#b98232" text-anchor="start">ground</text><path d="M40 150 L330 181 L330 240 L680 272" stroke="#466d89" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="60" y="176" font-size="14" fill="#466d89" text-anchor="start">sewer invert</text><rect x="318" y="150" width="24" height="96" fill="none" stroke="#273b45" stroke-width="1.5"/><text x="350" y="150" font-size="14" fill="#273b45" text-anchor="start">drop manhole where ground falls too fast</text><line x1="560" y1="226" x2="560" y2="262" stroke="#647780" stroke-width="1.5"/><line x1="567" y1="226" x2="553" y2="226" stroke="#647780" stroke-width="1.5"/><line x1="567" y1="262" x2="553" y2="262" stroke="#647780" stroke-width="1.5"/><text x="572" y="250" font-size="18" fill="#647780" text-anchor="start">cover</text><text x="360" y="310" font-size="16" fill="#b64f4f" text-anchor="middle">V = Q/A = 0.30/0.50 = 0.60 m/s &lt; 0.75 m/s → fails</text><text x="360" y="338" font-size="15" fill="#273b45" text-anchor="middle">At this Q, A ≤ Q/Vmin = 0.30/0.75 = 0.40 m² would be needed</text><text x="360" y="366" font-size="14" fill="#647780" text-anchor="middle">Also check capacity, abrasion on steep reaches, cover and outfall level</text></g></svg>