<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Plasticity chart with the A-line</title><desc id="desc">The A-line separates clay-like C from silt-like M behaviour and LL = 50 separates L from H; an inorganic soil at LL 60 and PI 20 plots as MH.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="90" y1="330" x2="646" y2="330" stroke="#647780" stroke-width="2"/><polygon points="654,330 644,334 644,326" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><line x1="90" y1="330" x2="90" y2="54" stroke="#647780" stroke-width="2"/><polygon points="90,46 94,56 86,56" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><text x="365" y="374" font-size="19" fill="#273b45" text-anchor="middle">Liquid limit LL, %</text><text x="96" y="36" font-size="19" fill="#273b45" text-anchor="start">Plasticity index PI, %</text><text x="200" y="350" font-size="14" fill="#647780" text-anchor="middle">20</text><text x="365" y="350" font-size="14" fill="#647780" text-anchor="middle">50</text><text x="640" y="350" font-size="14" fill="#647780" text-anchor="middle">100</text><text x="82" y="245" font-size="14" fill="#647780" text-anchor="end">20</text><text x="82" y="155" font-size="14" fill="#647780" text-anchor="end">40</text><line x1="200" y1="330" x2="640" y2="67.2" stroke="#287aab" stroke-width="3"/><line x1="365" y1="330" x2="365" y2="69" stroke="#273b45" stroke-width="2" stroke-dasharray="8 6"/><text x="600" y="70" font-size="16" fill="#287aab" text-anchor="end">A-line</text><text x="373" y="76" font-size="15" fill="#273b45" text-anchor="start">LL = 50</text><text x="277" y="195" font-size="20" fill="#273b45" text-anchor="middle">CL</text><text x="486" y="105" font-size="20" fill="#273b45" text-anchor="middle">CH</text><text x="310" y="316.5" font-size="17" fill="#273b45" text-anchor="middle">ML or OL</text><text x="541" y="262.5" font-size="17" fill="#273b45" text-anchor="middle">MH or OH</text><circle cx="420" cy="240" r="6" fill="#2b7b61" stroke="#2b7b61" stroke-width="2"/><text x="432" y="224" font-size="16" fill="#2b7b61" text-anchor="start">LL 60, PI 20: MH</text><text x="365" y="400" font-size="16" fill="#287aab" text-anchor="middle">A-line: PI = 0.73 (LL − 20)</text></g></svg>