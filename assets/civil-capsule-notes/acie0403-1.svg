<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Shear stress across a rectangular beam section</title><desc id="desc">Transverse shear stress is parabolic over a solid rectangle, zero at the extreme fibres and 1.5 times the average at the neutral axis.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><rect x="120" y="80" width="100" height="200" fill="#d6dfe3" stroke="#273b45" stroke-width="2"/><line x1="104" y1="180" x2="236" y2="180" stroke="#647780" stroke-width="1.5" stroke-dasharray="6 4"/><text x="242" y="185" font-size="14" fill="#647780" text-anchor="start">NA</text><line x1="120" y1="300" x2="220" y2="300" stroke="#647780" stroke-width="1.5"/><line x1="120" y1="293" x2="120" y2="307" stroke="#647780" stroke-width="1.5"/><line x1="220" y1="293" x2="220" y2="307" stroke="#647780" stroke-width="1.5"/><text x="170" y="316" font-size="14" fill="#647780" text-anchor="middle">b = 100 mm</text><line x1="100" y1="80" x2="100" y2="280" stroke="#647780" stroke-width="1.5"/><line x1="107" y1="80" x2="93" y2="80" stroke="#647780" stroke-width="1.5"/><line x1="107" y1="280" x2="93" y2="280" stroke="#647780" stroke-width="1.5"/><text x="92" y="186" font-size="14" fill="#647780" text-anchor="end">d = 200 mm</text><polygon points="320,80 320,80 337.55,85 354.2,90 369.95,95 384.8,100 398.75,105 411.8,110 423.95,115 435.2,120 445.55,125 455,130 463.55,135 471.2,140 477.95,145 483.8,150 488.75,155 492.8,160 495.95,165 498.2,170 499.55,175 500,180 499.55,185 498.2,190 495.95,195 492.8,200 488.75,205 483.8,210 477.95,215 471.2,220 463.55,225 455,230 445.55,235 435.2,240 423.95,245 411.8,250 398.75,255 384.8,260 369.95,265 354.2,270 337.55,275 320,280 320,280" fill="#e6f1f8" stroke="none" stroke-width="2" stroke-linejoin="round"/><path d="M320 80 L337.55 85 L354.2 90 L369.95 95 L384.8 100 L398.75 105 L411.8 110 L423.95 115 L435.2 120 L445.55 125 L455 130 L463.55 135 L471.2 140 L477.95 145 L483.8 150 L488.75 155 L492.8 160 L495.95 165 L498.2 170 L499.55 175 L500 180 L499.55 185 L498.2 190 L495.95 195 L492.8 200 L488.75 205 L483.8 210 L477.95 215 L471.2 220 L463.55 225 L455 230 L445.55 235 L435.2 240 L423.95 245 L411.8 250 L398.75 255 L384.8 260 L369.95 265 L354.2 270 L337.55 275 L320 280" stroke="#287aab" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="320" y1="70" x2="320" y2="290" stroke="#273b45" stroke-width="2"/><line x1="440" y1="80" x2="440" y2="280" stroke="#647780" stroke-width="1.5" stroke-dasharray="6 5"/><text x="448" y="76" font-size="14" fill="#647780" text-anchor="start">τavg = V / (b d) = 2 MPa</text><circle cx="500" cy="180" r="5" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><text x="510" y="176" font-size="15" fill="#b64f4f" text-anchor="start">τmax = 3.0 MPa</text><text x="312" y="84" font-size="13" fill="#273b45" text-anchor="end">0</text><text x="312" y="284" font-size="13" fill="#273b45" text-anchor="end">0</text><text x="360" y="350" font-size="16" fill="#273b45" text-anchor="middle">τmax = 3V / (2 b d) = 1.5 × 2 = 3.0 MPa for V = 40 kN</text><text x="360" y="378" font-size="14" fill="#647780" text-anchor="middle">Also where the bending stress is zero, in a homogeneous rectangle</text></g></svg>