<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Energy and hydraulic grade lines through a diffuser</title><desc id="desc">Slowing from 5 to 2 m/s frees 1.07 m of velocity head; after a 0.30 m loss the static pressure head rises 0.77 m while the total head falls.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><polygon points="80,280 250,280 420,250 640,250 640,350 420,350 250,320 80,320" fill="#d8edf7" stroke="none" stroke-width="2" stroke-linejoin="round"/><path d="M80 280 L250 280 L420 250 L640 250" stroke="#273b45" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M80 320 L250 320 L420 350 L640 350" stroke="#273b45" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M80 134 L250 134 L420 158 L640 158" stroke="#b64f4f" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M80 236 L250 236 L420 174 L640 174" stroke="#287aab" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="86" y="126" font-size="15" fill="#b64f4f" text-anchor="start">EGL, total head</text><text x="86" y="228" font-size="15" fill="#287aab" text-anchor="start">HGL, piezometric head</text><text x="165" y="306" font-size="15" fill="#273b45" text-anchor="middle">V1 = 5 m/s</text><text x="530" y="306" font-size="15" fill="#273b45" text-anchor="middle">V2 = 2 m/s</text><line x1="240" y1="236" x2="240" y2="134" stroke="#647780" stroke-width="1.5"/><line x1="233" y1="236" x2="247" y2="236" stroke="#647780" stroke-width="1.5"/><line x1="233" y1="134" x2="247" y2="134" stroke="#647780" stroke-width="1.5"/><text x="250" y="191" font-size="15" fill="#647780" text-anchor="start">V1²/2g = 1.27 m</text><line x1="420" y1="134" x2="668" y2="134" stroke="#647780" stroke-width="1" stroke-dasharray="4 4"/><line x1="660" y1="134" x2="660" y2="158" stroke="#647780" stroke-width="1.5"/><line x1="667" y1="134" x2="653" y2="134" stroke="#647780" stroke-width="1.5"/><line x1="667" y1="158" x2="653" y2="158" stroke="#647780" stroke-width="1.5"/><text x="652" y="152" font-size="14" fill="#647780" text-anchor="end">hL = 0.30 m</text><line x1="420" y1="236" x2="608" y2="236" stroke="#647780" stroke-width="1" stroke-dasharray="4 4"/><line x1="600" y1="236" x2="600" y2="174" stroke="#647780" stroke-width="1.5"/><line x1="593" y1="236" x2="607" y2="236" stroke="#647780" stroke-width="1.5"/><line x1="593" y1="174" x2="607" y2="174" stroke="#647780" stroke-width="1.5"/><text x="592" y="211" font-size="14" fill="#647780" text-anchor="end">+0.77 m pressure head</text><text x="360" y="384" font-size="16" fill="#273b45" text-anchor="middle">Fluid moves from higher to lower total head: H1 = H2 + hL</text></g></svg>