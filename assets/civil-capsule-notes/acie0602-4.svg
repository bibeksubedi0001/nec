<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Continuity through pipes in series</title><desc id="desc">The same discharge passes every section. Halving the diameter quarters the area and multiplies the velocity by four; a valve adds a local loss K V²/2g in metres of head.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><text x="360" y="60" font-size="16" fill="#273b45" text-anchor="middle">Q = A1 V1 = A2 V2, the same discharge</text><rect x="60" y="130" width="240" height="80" fill="#d8edf7" stroke="none" stroke-width="2"/><rect x="300" y="150" width="360" height="40" fill="#d8edf7" stroke="none" stroke-width="2"/><path d="M60 130 L300 130 L300 150 L660 150" stroke="#273b45" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M60 210 L300 210 L300 190 L660 190" stroke="#273b45" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="180" y="118" font-size="15" fill="#273b45" text-anchor="middle">D1, area A</text><text x="420" y="138" font-size="15" fill="#273b45" text-anchor="middle">D2 = D1/2, area A/4</text><line x1="150" y1="178" x2="177.2" y2="178" stroke="#287aab" stroke-width="3"/><polygon points="186,178 175,182.5 175,173.5" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><text x="168" y="164" font-size="15" fill="#287aab" text-anchor="middle">V1</text><line x1="330" y1="170" x2="461.2" y2="170" stroke="#287aab" stroke-width="3"/><polygon points="470,170 459,174.5 459,165.5" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><text x="410" y="214" font-size="15" fill="#287aab" text-anchor="middle">V2 = 4 V1</text><circle cx="560" cy="170" r="18" fill="#ffffff" stroke="#273b45" stroke-width="2"/><line x1="548" y1="184" x2="572" y2="156" stroke="#b64f4f" stroke-width="4"/><text x="560" y="232" font-size="15" fill="#b64f4f" text-anchor="middle">valve: hL = K V²/2g</text><text x="360" y="290" font-size="16" fill="#273b45" text-anchor="middle">Diameter halves → area quarters → velocity × 4; Q unchanged</text><text x="360" y="320" font-size="15" fill="#273b45" text-anchor="middle">K = 0.40, V = 3.0 m/s: hL = 0.40 × 9 / 19.62 = 0.183 m of head</text><text x="360" y="350" font-size="14" fill="#647780" text-anchor="middle">K is tied to its reference velocity and to the actual valve</text></g></svg>