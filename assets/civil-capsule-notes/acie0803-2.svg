<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Shear-friction sliding check of a gravity section</title><desc id="desc">Sliding resistance is friction on the effective normal force plus mobilisable cohesion: (0.6 × 1000 + 200)/400 = 2.0. A shear key helps by bearing and interlock, not by adding friction area.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><rect x="20" y="300" width="680" height="60" fill="#d6dfe3" stroke="none" stroke-width="2"/><line x1="20" y1="342" x2="38" y2="360" stroke="#8a9aa3" stroke-width="1"/><line x1="20" y1="324" x2="56" y2="360" stroke="#8a9aa3" stroke-width="1"/><line x1="20" y1="306" x2="74" y2="360" stroke="#8a9aa3" stroke-width="1"/><line x1="32" y1="300" x2="92" y2="360" stroke="#8a9aa3" stroke-width="1"/><line x1="50" y1="300" x2="110" y2="360" stroke="#8a9aa3" stroke-width="1"/><line x1="68" y1="300" x2="128" y2="360" stroke="#8a9aa3" stroke-width="1"/><line x1="86" y1="300" x2="146" y2="360" stroke="#8a9aa3" stroke-width="1"/><line x1="104" y1="300" x2="164" y2="360" stroke="#8a9aa3" stroke-width="1"/><line x1="122" y1="300" x2="182" y2="360" stroke="#8a9aa3" stroke-width="1"/><line x1="140" y1="300" x2="200" y2="360" stroke="#8a9aa3" stroke-width="1"/><line x1="158" y1="300" x2="218" y2="360" stroke="#8a9aa3" stroke-width="1"/><line x1="176" y1="300" x2="236" y2="360" stroke="#8a9aa3" stroke-width="1"/><line x1="194" y1="300" x2="254" y2="360" stroke="#8a9aa3" stroke-width="1"/><line x1="212" y1="300" x2="272" y2="360" stroke="#8a9aa3" stroke-width="1"/><line x1="230" y1="300" x2="290" y2="360" stroke="#8a9aa3" stroke-width="1"/><line x1="248" y1="300" x2="308" y2="360" stroke="#8a9aa3" stroke-width="1"/><line x1="266" y1="300" x2="326" y2="360" stroke="#8a9aa3" stroke-width="1"/><line x1="284" y1="300" x2="344" y2="360" stroke="#8a9aa3" stroke-width="1"/><line x1="302" y1="300" x2="362" y2="360" stroke="#8a9aa3" stroke-width="1"/><line x1="320" y1="300" x2="380" y2="360" stroke="#8a9aa3" stroke-width="1"/><line x1="338" y1="300" x2="398" y2="360" stroke="#8a9aa3" stroke-width="1"/><line x1="356" y1="300" x2="416" y2="360" stroke="#8a9aa3" stroke-width="1"/><line x1="374" y1="300" x2="434" y2="360" stroke="#8a9aa3" stroke-width="1"/><line x1="392" y1="300" x2="452" y2="360" stroke="#8a9aa3" stroke-width="1"/><line x1="410" y1="300" x2="470" y2="360" stroke="#8a9aa3" stroke-width="1"/><line x1="428" y1="300" x2="488" y2="360" stroke="#8a9aa3" stroke-width="1"/><line x1="446" y1="300" x2="506" y2="360" stroke="#8a9aa3" stroke-width="1"/><line x1="464" y1="300" x2="524" y2="360" stroke="#8a9aa3" stroke-width="1"/><line x1="482" y1="300" x2="542" y2="360" stroke="#8a9aa3" stroke-width="1"/><line x1="500" y1="300" x2="560" y2="360" stroke="#8a9aa3" stroke-width="1"/><line x1="518" y1="300" x2="578" y2="360" stroke="#8a9aa3" stroke-width="1"/><line x1="536" y1="300" x2="596" y2="360" stroke="#8a9aa3" stroke-width="1"/><line x1="554" y1="300" x2="614" y2="360" stroke="#8a9aa3" stroke-width="1"/><line x1="572" y1="300" x2="632" y2="360" stroke="#8a9aa3" stroke-width="1"/><line x1="590" y1="300" x2="650" y2="360" stroke="#8a9aa3" stroke-width="1"/><line x1="608" y1="300" x2="668" y2="360" stroke="#8a9aa3" stroke-width="1"/><line x1="626" y1="300" x2="686" y2="360" stroke="#8a9aa3" stroke-width="1"/><line x1="644" y1="300" x2="700" y2="356" stroke="#8a9aa3" stroke-width="1"/><line x1="662" y1="300" x2="700" y2="338" stroke="#8a9aa3" stroke-width="1"/><line x1="680" y1="300" x2="700" y2="320" stroke="#8a9aa3" stroke-width="1"/><line x1="698" y1="300" x2="700" y2="302" stroke="#8a9aa3" stroke-width="1"/><rect x="40" y="100" width="160" height="200" fill="#d8edf7" stroke="none" stroke-width="2"/><polygon points="200,80 250,80 400,300 200,300" fill="#e4e8e9" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><rect x="330" y="300" width="24" height="26" fill="#e4e8e9" stroke="#273b45" stroke-width="2"/><line x1="20" y1="300" x2="700" y2="300" stroke="#273b45" stroke-width="2"/><line x1="262" y1="190" x2="262" y2="241.2" stroke="#273b45" stroke-width="3.5"/><polygon points="262,250 257.5,239 266.5,239" fill="#273b45" stroke="#273b45" stroke-width="1.5" stroke-linejoin="round"/><text x="272" y="228" font-size="16" fill="#273b45" text-anchor="start">W</text><line x1="110" y1="240" x2="187.2" y2="240" stroke="#287aab" stroke-width="3.5"/><polygon points="196,240 185,244.5 185,235.5" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><text x="110" y="228" font-size="15" fill="#287aab" text-anchor="start">T = 400 kN</text><line x1="230" y1="350" x2="230" y2="311.2" stroke="#b64f4f" stroke-width="2.5"/><polygon points="230,304 234,313 226,313" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><line x1="280" y1="350" x2="280" y2="311.2" stroke="#b64f4f" stroke-width="2.5"/><polygon points="280,304 284,313 276,313" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><line x1="380" y1="350" x2="380" y2="311.2" stroke="#b64f4f" stroke-width="2.5"/><polygon points="380,304 384,313 376,313" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="412" y="344" font-size="16" fill="#b64f4f" text-anchor="start">U</text><line x1="385" y1="288" x2="223.8" y2="288" stroke="#2b7b61" stroke-width="3"/><polygon points="215,288 226,283.5 226,292.5" fill="#2b7b61" stroke="#2b7b61" stroke-width="1.5" stroke-linejoin="round"/><text x="300" y="278" font-size="14" fill="#2b7b61" text-anchor="middle">μN + cA</text><text x="342" y="346" font-size="13" fill="#273b45" text-anchor="middle">key</text><text x="560" y="110" font-size="16" fill="#273b45" text-anchor="middle">N = W − U</text><text x="560" y="140" font-size="16" fill="#273b45" text-anchor="middle">FS = (μN + cA) / T</text><text x="560" y="170" font-size="15" fill="#287aab" text-anchor="middle">= (0.6 × 1000 + 200)/400 = 2.0</text><text x="560" y="220" font-size="14" fill="#273b45" text-anchor="middle">shear key: bearing and interlock,</text><text x="560" y="242" font-size="14" fill="#647780" text-anchor="middle">not extra friction area</text><text x="360" y="392" font-size="13" fill="#647780" text-anchor="middle">Judge FS against the governing standard; cohesion must really act on the plane</text></g></svg>