 574.04,175.04 570.04,181.96" fill="#2b7b61" stroke="#2b7b61" stroke-width="1.5" stroke-linejoin="round"/><line x1="540" y1="236" x2="540" y2="195.2" stroke="#2b7b61" stroke-width="2.5"/><polygon points="540,188 544,197 536,197" fill="#2b7b61" stroke="#2b7b61" stroke-width="1.5" stroke-linejoin="round"/><line x1="474.18" y1="198" x2="509.52" y2="177.6" stroke="#2b7b61" stroke-width="2.5"/><polygon points="515.75,174 509.96,181.96 505.96,175.04" fill="#2b7b61" stroke="#2b7b61" stroke-width="1.5" stroke-linejoin="round"/><line x1="474.18" y1="122" x2="509.52" y2="142.4" stroke="#2b7b61" stroke-width="2.5"/><polygon points="515.75,146 505.96,144.96 509.96,138.04" fill="#2b7b61" stroke="#2b7b61" stroke-width="1.5" stroke-linejoin="round"/><line x1="540" y1="84" x2="540" y2="124.8" stroke="#2b7b61" stroke-width="2.5"/><polygon points="540,132 536,123 544,123" fill="#2b7b61" stroke="#2b7b61" stroke-width="1.5" stroke-linejoin="round"/><line x1="605.82" y1="122" x2="570.48" y2="142.4" stroke="#2b7b61" stroke-width="2.5"/><polygon points="564.25,146 570.04,138.04 574.04,144.96" fill="#2b7b61" stroke="#2b7b61" stroke-width="1.5" stroke-linejoin="round"/><line x1="298.8" y1="160" x2="421.2" y2="160" stroke="#647780" stroke-width="2"/><polygon points="430,160 419,164.5 419,155.5" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><polygon points="290,160 301,155.5 301,164.5" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><text x="360" y="148" font-size="14" fill="#647780" text-anchor="middle">reverse</text><text x="180" y="268" font-size="15" fill="#287aab" text-anchor="middle">pump: eye → outward,</text><text x="180" y="288" font-size="14" fill="#273b45" text-anchor="middle">shaft work raises energy</text><text x="540" y="268" font-size="15" fill="#2b7b61" text-anchor="middle">turbine: inward flow,</text><text x="540" y="288" font-size="14" fill="#273b45" text-anchor="middle">water drives the shaft</text><text x="360" y="322" font-size="14" fill="#273b45" text-anchor="middle">ρgQH = 1000 × 9.81 × 0.040 × 25 = 9810 W</text><text x="360" y="346" font-size="14" fill="#287aab" text-anchor="middle">Ps = ρgQH / ηp = 9.81 / 0.80 = 12.26 kW; motor input is higher still</text><text x="360" y="370" font-size="14" fill="#273b45" text-anchor="middle">A reversible pump-turbine with motor-generator serves pumped storage</text><text x="360" y="394" font-size="13" fill="#647780" text-anchor="middle">check efficiency and stability in both modes</text></g></svg>