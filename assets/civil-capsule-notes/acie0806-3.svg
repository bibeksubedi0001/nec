<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Centrifugal pump as a reversed inward-flow turbine</title><desc id="desc">In a centrifugal pump water enters at the eye and moves outward while shaft work raises its energy; in an inward radial-flow turbine it moves inward and drives the shaft. Shaft input = 9.81 kW / 0.80 = 12.26 kW.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><circle cx="180" cy="160" r="80" fill="#ffffff" stroke="#273b45" stroke-width="3"/><circle cx="180" cy="160" r="20" fill="#d8edf7" stroke="#273b45" stroke-width="1.5"/><path d="M202.0 160.0 Q225.4 191.1 222.1 225.6" stroke="#8a9aa3" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M191.0 179.1 Q175.8 214.8 144.2 229.3" stroke="#8a9aa3" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M169.0 179.1 Q130.4 183.8 102.1 163.7" stroke="#8a9aa3" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M158.0 160.0 Q134.6 128.9 137.9 94.4" stroke="#8a9aa3" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M169.0 140.9 Q184.2 105.2 215.8 90.7" stroke="#8a9aa3" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M191.0 140.9 Q229.6 136.2 257.9 156.3" stroke="#8a9aa3" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="540" cy="160" r="80" fill="#ffffff" stroke="#273b45" stroke-width="3"/><circle cx="540" cy="160" r="20" fill="#d8edf7" stroke="#273b45" stroke-width="1.5"/><path d="M562.0 160.0 Q585.4 191.1 582.1 225.6" stroke="#8a9aa3" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M551.0 179.1 Q535.8 214.8 504.2 229.3" stroke="#8a9aa3" stroke-width="1.5" fill="none" stroke-lin