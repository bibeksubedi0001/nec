<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Bacterial temperature classes</title><desc id="desc">Bacteria are grouped by the temperature at which they grow best. An organism with a growth optimum near 55 °C is thermophilic; the quoted bands are approximate and overlap.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><rect x="80" y="120" width="145" height="38" rx="6" fill="#e6f1f8" stroke="#287aab" stroke-width="2" stroke-dasharray="6 4"/><text x="152.5" y="145" font-size="15" fill="#287aab" text-anchor="middle">psychrophiles: cold</text><rect x="225" y="168" width="181.25" height="38" rx="6" fill="#deeee6" stroke="#2b7b61" stroke-width="2" stroke-dasharray="6 4"/><text x="315.63" y="193" font-size="15" fill="#2b7b61" text-anchor="middle">mesophiles: moderate</text><rect x="370" y="216" width="217.5" height="38" rx="6" fill="#f2dfdf" stroke="#b64f4f" stroke-width="2" stroke-dasharray="6 4"/><text x="478.75" y="241" font-size="15" fill="#b64f4f" text-anchor="middle">thermophiles: high</text><line x1="478.75" y1="108" x2="478.75" y2="212" stroke="#b64f4f" stroke-width="2.5" stroke-dasharray="7 4"/><line x1="478.75" y1="258" x2="478.75" y2="280" stroke="#b64f4f" stroke-width="2.5" stroke-dasharray="7 4"/><circle cx="478.75" cy="280" r="5" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><text x="478.75" y="96" font-size="15" fill="#b64f4f" text-anchor="middle">optimum 55 °C → thermophilic</text><line x1="70" y1="280" x2="682" y2="280" stroke="#647780" stroke-width="2"/><polygon points="690,280 680,284 680,276" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><line x1="80" y1="280" x2="80" y2="285" stroke="#647780" stroke-width="1.5"/><text x="80" y="302" font-size="14" fill="#273b45" text-anchor="middle">0</text><line x1="152.5" y1="280" x2="152.5" y2="285" stroke="#647780" stroke-width="1.5"/><text x="152.5" y="302" font-size="14" fill="#273b45" text-anchor="middle">10</text><line x1="225" y1="280" x2="225" y2="285" stroke="#647780" stroke-width="1.5"/><text x="225" y="302" font-size="14" fill="#273b45" text-anchor="middle">20</text><line x1="297.5" y1="280" x2="297.5" y2="285" stroke="#647780" stroke-width="1.5"/><text x="297.5" y="302" font-size="14" fill="#273b45" text-anchor="middle">30</text><line x1="370" y1="280" x2="370" y2="285" stroke="#647780" stroke-width="1.5"/><text x="370" y="302" font-size="14" fill="#273b45" text-anchor="middle">40</text><line x1="442.5" y1="280" x2="442.5" y2="285" stroke="#647780" stroke-width="1.5"/><text x="442.5" y="302" font-size="14" fill="#273b45" text-anchor="middle">50</text><line x1="515" y1="280" x2="515" y2="285" stroke="#647780" stroke-width="1.5"/><text x="515" y="302" font-size="14" fill="#273b45" text-anchor="middle">60</text><line x1="587.5" y1="280" x2="587.5" y2="285" stroke="#647780" stroke-width="1.5"/><text x="587.5" y="302" font-size="14" fill="#273b45" text-anchor="middle">70</text><line x1="660" y1="280" x2="660" y2="285" stroke="#647780" stroke-width="1.5"/><text x="660" y="302" font-size="14" fill="#273b45" text-anchor="middle">80</text><text x="360" y="330" font-size="15" fill="#273b45" text-anchor="middle">growth-optimum temperature (°C)</text><text x="360" y="370" font-size="14" fill="#273b45" text-anchor="middle">Bands are approximate: 40-70 °C is often quoted for thermophiles</text><text x="360" y="396" font-size="14" fill="#647780" text-anchor="middle">A growth optimum is not the temperature that kills</text></g></svg>