<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Two equal loads at the third points</title><desc id="desc">Each reaction equals one load; the shear is zero between the loads, so the middle third carries a constant moment WL/3, a zone of pure bending.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="100" y1="92" x2="620" y2="92" stroke="#273b45" stroke-width="7"/><polygon points="100,99 85,123 115,123" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><line x1="78" y1="126" x2="122" y2="126" stroke="#647780" stroke-width="2"/><polygon points="620,99 605,120 635,120" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><circle cx="612" cy="126" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><circle cx="628" cy="126" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><line x1="598" y1="133" x2="642" y2="133" stroke="#647780" stroke-width="2"/><line x1="273.33" y1="42" x2="273.33" y2="79.2" stroke="#b64f4f" stroke-width="3.5"/><polygon points="273.33,88 268.83,77 277.83,77" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="273.33" y="32" font-size="15" fill="#b64f4f" text-anchor="middle">30 kN</text><line x1="446.67" y1="42" x2="446.67" y2="79.2" stroke="#b64f4f" stroke-width="3.5"/><polygon points="446.67,88 442.17,77 451.17,77" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="446.67" y="32" font-size="15" fill="#b64f4f" text-anchor="middle">30 kN</text><text x="360" y="40" font-size="15" fill="#647780" text-anchor="middle">9 m simple span</text><text x="40" y="210" font-size="15" fill="#647780" text-anchor="start">SFD</text><polygon points="100,205 100,169 273.33,169 273.33,205 446.67,205 446.67,241 620,241 620,205" fill="#e6f1f8" stroke="none" stroke-width="2" stroke-linejoin="round"/><line x1="100" y1="205" x2="620" y2="205" stroke="#647780" stroke-width="1.5"/><path d="M100 169 L273.33 169 L273.33 205 L446.67 205 L446.67 241 L620 241" stroke="#287aab" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="186.67" y="199" font-size="14" fill="#287aab" text-anchor="middle">+30 kN</text><text x="533.33" y="224" font-size="14" fill="#287aab" text-anchor="middle">−30 kN</text><text x="360" y="198" font-size="14" fill="#287aab" text-anchor="middle">V = 0</text><text x="40" y="340" font-size="15" fill="#647780" text-anchor="start">BMD</text><polygon points="100,335 100,335 273.33,272 446.67,272 620,335 620,335" fill="#f2dfdf" stroke="none" stroke-width="2" stroke-linejoin="round"/><line x1="100" y1="335" x2="620" y2="335" stroke="#647780" stroke-width="1.5"/><path d="M100 335 L273.33 272 L446.67 272 L620 335" stroke="#b64f4f" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="360" y="305" font-size="15" fill="#b64f4f" text-anchor="middle">M = WL/3 = 90 kN·m</text><text x="360" y="390" font-size="15" fill="#647780" text-anchor="middle">W is each load (30 kN), not the total 2W</text></g></svg>