<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Compound interest and the effective annual rate</title><desc id="desc">NRs 20000 at 10 percent compound grows to 22000 and then 24200, so the interest is 2000 then 2200, 4200 in all. A nominal 12 percent compounded monthly is an effective 12.6825 percent a year.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><text x="270" y="40" font-size="16" fill="#273b45" text-anchor="middle">Interest joins the balance</text><line x1="70" y1="300" x2="470" y2="300" stroke="#647780" stroke-width="2"/><rect x="100" y="100" width="80" height="200" fill="#d6dfe3" stroke="#273b45" stroke-width="1.5"/><text x="140" y="322" font-size="13" fill="#273b45" text-anchor="middle">start</text><rect x="230" y="100" width="80" height="200" fill="#d6dfe3" stroke="#273b45" stroke-width="1.5"/><rect x="230" y="80" width="80" height="20" fill="#f5ead8" stroke="#b98232" stroke-width="1.5"/><text x="270" y="322" font-size="13" fill="#273b45" text-anchor="middle">year 1</text><rect x="360" y="100" width="80" height="200" fill="#d6dfe3" stroke="#273b45" stroke-width="1.5"/><rect x="360" y="80" width="80" height="20" fill="#f5ead8" stroke="#b98232" stroke-width="1.5"/><rect x="360" y="58" width="80" height="22" fill="#f2dfdf" stroke="#b64f4f" stroke-width="1.5"/><text x="400" y="322" font-size="13" fill="#273b45" text-anchor="middle">year 2</text><text x="140" y="210" font-size="14" fill="#273b45" text-anchor="middle">20,000</text><text x="270" y="210" font-size="14" fill="#273b45" text-anchor="middle">20,000</text><text x="400" y="210" font-size="14" fill="#273b45" text-anchor="middle">20,000</text><text x="270" y="72" font-size="13" fill="#b98232" text-anchor="middle">+2,000</text><text x="400" y="50" font-size="13" fill="#b64f4f" text-anchor="middle">+2,000 +2,200</text><text x="140" y="92" font-size="13" fill="#647780" text-anchor="middle">principal</text><text x="590" y="130" font-size="15" fill="#273b45" text-anchor="middle">12% nominal, monthly:</text><text x="590" y="158" font-size="15" fill="#287aab" text-anchor="middle">(1 + 0.01)¹² − 1 = 12.6825%</text><text x="590" y="186" font-size="13" fill="#647780" text-anchor="middle">equal only with annual</text><text x="590" y="204" font-size="13" fill="#647780" text-anchor="middle">compounding</text><text x="360" y="356" font-size="13" fill="#273b45" text-anchor="middle">Interest = 24,200 − 20,000 = 4,200 (2,000 then 2,200); the principal is not interest</text></g></svg>