<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Sections of a right circular double cone</title><desc id="desc">A plane parallel to the axis but offset from it cuts a hyperbola on both nappes; a plane through the axis gives two crossing generators; a plane parallel to the base cuts a smaller circle.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="130" y1="60" x2="370" y2="340" stroke="#273b45" stroke-width="2.5"/><line x1="370" y1="60" x2="130" y2="340" stroke="#273b45" stroke-width="2.5"/><line x1="250" y1="48" x2="250" y2="352" stroke="#2b7b61" stroke-width="3"/><line x1="310" y1="40" x2="310" y2="360" stroke="#b64f4f" stroke-width="3"/><line x1="150" y1="110" x2="350" y2="110" stroke="#287aab" stroke-width="3"/><text x="318" y="376" font-size="14" fill="#b64f4f" text-anchor="start">x = c ≠ 0</text><text x="242" y="376" font-size="14" fill="#2b7b61" text-anchor="end">through the axis</text><text x="356" y="104" font-size="14" fill="#287aab" text-anchor="start">parallel to base</text><line x1="450" y1="40" x2="450" y2="370" stroke="#b8c8ce" stroke-width="1.5" stroke-dasharray="6 5"/><path d="M520 63.29 L523 65.05 L526 66.81 L529 68.56 L532 70.31 L535 72.06 L538 73.79 L541 75.52 L544 77.23 L547 78.93 L550 80.61 L553 82.27 L556 83.9 L559 85.49 L562 87.02 L565 88.47 L568 89.82 L571 91 L574 91.95 L577 92.58 L580 92.8 L583 92.58 L586 91.95 L589 91 L592 89.82 L595 88.47 L598 87.02 L601 85.49 L604 83.9 L607 82.27 L610 80.61 L613 78.93 L616 77.23 L619 75.52 L622 73.79 L625 72.06 L628 70.31 L631 68.56 L634 66.81 L637 65.05 L640 63.29" stroke="#b64f4f" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M520 136.71 L523 134.95 L526 133.19 L529 131.44 L532 129.69 L535 127.94 L538 126.21 L541 124.48 L544 122.77 L547 121.07 L550 119.39 L553 117.73 L556 116.1 L559 114.51 L562 112.98 L565 111.53 L568 110.18 L571 109 L574 108.05 L577 107.42 L580 107.2 L583 107.42 L586 108.05 L589 109 L592 110.18 L595 111.53 L598 112.98 L601 114.51 L604 116.1 L607 117.73 L610 119.39 L613 121.07 L616 122.77 L619 124.48 L622 126.21 L625 127.94 L628 129.69 L631 131.44 L634 133.19 L637 134.95 L640 136.71" stroke="#b64f4f" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="580" y="158" font-size="13" fill="#b64f4f" text-anchor="middle">hyperbola, both branches</text><line x1="535" y1="180" x2="625" y2="250" stroke="#2b7b61" stroke-width="3"/><line x1="625" y1="180" x2="535" y2="250" stroke="#2b7b61" stroke-width="3"/><text x="580" y="268" font-size="13" fill="#2b7b61" text-anchor="middle">two generators y = ±kz</text><circle cx="580" cy="318" r="30" fill="none" stroke="#287aab" stroke-width="3"/><text x="580" y="368" font-size="13" fill="#287aab" text-anchor="middle">circle of smaller radius</text><text x="360" y="400" font-size="14" fill="#273b45" text-anchor="middle">x² + y² = k²z²; the plane x = c gives k²z² − y² = c²</text></g></svg>