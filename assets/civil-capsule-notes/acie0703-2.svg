<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Piping and uplift under a floor on sand</title><desc id="desc">Seepage emerging at an unprotected exit can wash out grains and open channels backwards under the floor (piping). Separately, pressure beneath an intact floor can exceed its weight and lift it (uplift).</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><text x="360" y="40" font-size="16" fill="#273b45" text-anchor="middle">Two failure modes on pervious foundations</text><rect x="20" y="180" width="680" height="160" fill="#f0e6d4" stroke="none" stroke-width="2"/><polygon points="20,90 200,90 200,180 20,180" fill="#d8edf7" stroke="none" stroke-width="2" stroke-linejoin="round"/><rect x="500" y="160" width="200" height="20" fill="#d8edf7" stroke="none" stroke-width="2"/><line x1="20" y1="180" x2="700" y2="180" stroke="#273b45" stroke-width="1.5"/><rect x="200" y="150" width="300" height="30" fill="#e4e8e9" stroke="#273b45" stroke-width="2"/><path d="M120 182 Q350 340 590 182" stroke="#287aab" stroke-width="2" fill="none" stroke-dasharray="7 5" stroke-linejoin="round" stroke-linecap="round"/><path d="M165 182 Q350 280 545 182" stroke="#287aab" stroke-width="2" fill="none" stroke-dasharray="7 5" stroke-linejoin="round" stroke-linecap="round"/><line x1="260" y1="218" x2="260" y2="191.2" stroke="#b64f4f" stroke-width="2.5"/><polygon points="260,184 264,193 256,193" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><line x1="320" y1="218" x2="320" y2="191.2" stroke="#b64f4f" stroke-width="2.5"/><polygon points="320,184 324,193 316,193" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><line x1="380" y1="218" x2="380" y2="191.2" stroke="#b64f4f" stroke-width="2.5"/><polygon points="380,184 384,193 376,193" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><line x1="440" y1="218" x2="440" y2="191.2" stroke="#b64f4f" stroke-width="2.5"/><polygon points="440,184 444,193 436,193" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="350" y="135" font-size="14" fill="#b64f4f" text-anchor="middle">uplift: seepage pressure exceeds floor weight</text><path d="M522 184 Q490 196 468 190 Q444 186 420 198" stroke="#273b45" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="560" cy="172" r="3" fill="#b98232" stroke="#b98232" stroke-width="2"/><circle cx="575" cy="164" r="3" fill="#b98232" stroke="#b98232" stroke-width="2"/><circle cx="590" cy="170" r="3" fill="#b98232" stroke="#b98232" stroke-width="2"/><circle cx="545" cy="166" r="3" fill="#b98232" stroke="#b98232" stroke-width="2"/><text x="610" y="152" font-size="14" fill="#b98232" text-anchor="start">grains washed out</text><text x="200" y="364" font-size="14" fill="#b64f4f" text-anchor="middle">uplift: pressure under the floor &gt; its weight</text><text x="530" y="364" font-size="14" fill="#b98232" text-anchor="middle">piping: erosion works back from the exit</text><text x="360" y="398" font-size="13" fill="#647780" text-anchor="middle">Loose fine sand at an unprotected exit is most at risk; filters and seepage control stop piping</text></g></svg>