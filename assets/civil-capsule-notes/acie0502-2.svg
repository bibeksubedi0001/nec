<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Concrete grade groups and a minimum grade</title><desc id="desc">A grade such as M20 names the characteristic 28-day cube strength; IS 456:2000 groups standard grades M25 to M55 and high-strength grades M60 to M80.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><rect x="140.24" y="150" width="84.24" height="40" rx="6" fill="#d6dfe3" stroke="#647780" stroke-width="1.5"/><text x="182.35" y="138" font-size="15" fill="#647780" text-anchor="middle">ordinary M10 to M20</text><rect x="242.59" y="150" width="220.71" height="40" rx="6" fill="#e6f1f8" stroke="#287aab" stroke-width="1.5"/><text x="352.94" y="138" font-size="15" fill="#287aab" text-anchor="middle">standard M25 to M55</text><rect x="481.41" y="150" width="152.47" height="40" rx="6" fill="#f2dfdf" stroke="#b64f4f" stroke-width="1.5"/><text x="557.65" y="138" font-size="15" fill="#b64f4f" text-anchor="middle">high strength M60 to M80</text><line x1="80" y1="210" x2="660" y2="210" stroke="#273b45" stroke-width="2"/><line x1="148.24" y1="204" x2="148.24" y2="216" stroke="#273b45" stroke-width="1.5"/><text x="148.24" y="234" font-size="13" fill="#647780" text-anchor="middle">10</text><line x1="182.35" y1="204" x2="182.35" y2="216" stroke="#273b45" stroke-width="1.5"/><text x="182.35" y="234" font-size="13" fill="#647780" text-anchor="middle">15</text><line x1="216.47" y1="204" x2="216.47" y2="216" stroke="#273b45" stroke-width="1.5"/><text x="216.47" y="234" font-size="13" fill="#647780" text-anchor="middle">20</text><line x1="250.59" y1="204" x2="250.59" y2="216" stroke="#273b45" stroke-width="1.5"/><text x="250.59" y="234" font-size="13" fill="#647780" text-anchor="middle">25</text><line x1="284.71" y1="204" x2="284.71" y2="216" stroke="#273b45" stroke-width="1.5"/><text x="284.71" y="234" font-size="13" fill="#647780" text-anchor="middle">30</text><line x1="318.82" y1="204" x2="318.82" y2="216" stroke="#273b45" stroke-width="1.5"/><text x="318.82" y="234" font-size="13" fill="#647780" text-anchor="middle">35</text><line x1="352.94" y1="204" x2="352.94" y2="216" stroke="#273b45" stroke-width="1.5"/><text x="352.94" y="234" font-size="13" fill="#647780" text-anchor="middle">40</text><line x1="387.06" y1="204" x2="387.06" y2="216" stroke="#273b45" stroke-width="1.5"/><text x="387.06" y="234" font-size="13" fill="#647780" text-anchor="middle">45</text><line x1="421.18" y1="204" x2="421.18" y2="216" stroke="#273b45" stroke-width="1.5"/><text x="421.18" y="234" font-size="13" fill="#647780" text-anchor="middle">50</text><line x1="455.29" y1="204" x2="455.29" y2="216" stroke="#273b45" stroke-width="1.5"/><text x="455.29" y="234" font-size="13" fill="#647780" text-anchor="middle">55</text><line x1="489.41" y1="204" x2="489.41" y2="216" stroke="#273b45" stroke-width="1.5"/><text x="489.41" y="234" font-size="13" fill="#647780" text-anchor="middle">60</text><line x1="523.53" y1="204" x2="523.53" y2="216" stroke="#273b45" stroke-width="1.5"/><text x="523.53" y="234" font-size="13" fill="#647780" text-anchor="middle">65</text><line x1="557.65" y1="204" x2="557.65" y2="216" stroke="#273b45" stroke-width="1.5"/><text x="557.65" y="234" font-size="13" fill="#647780" text-anchor="middle">70</text><line x1="591.76" y1="204" x2="591.76" y2="216" stroke="#273b45" stroke-width="1.5"/><text x="591.76" y="234" font-size="13" fill="#647780" text-anchor="middle">75</text><line x1="625.88" y1="204" x2="625.88" y2="216" stroke="#273b45" stroke-width="1.5"/><text x="625.88" y="234" font-size="13" fill="#647780" text-anchor="middle">80</text><text x="660" y="254" font-size="13" fill="#647780" text-anchor="end">fck, MPa</text><line x1="216.47" y1="194" x2="216.47" y2="250" stroke="#2b7b61" stroke-width="2" stroke-dasharray="6 4"/><text x="224.47" y="276" font-size="15" fill="#2b7b61" text-anchor="start">M20: minimum for RC in mild exposure (Table 5)</text><text x="360" y="70" font-size="17" fill="#273b45" text-anchor="middle">IS 456:2000 Table 2 grade groups</text><text x="360" y="330" font-size="15" fill="#273b45" text-anchor="middle">7-day 12.5 MPa ÷ 20 MPa = 62.5%: a monitoring ratio, not acceptance</text><text x="360" y="358" font-size="15" fill="#647780" text-anchor="middle">M20 = characteristic 28-day cube strength of 20 MPa</text></g></svg>