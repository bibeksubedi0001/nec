<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Pondage for a peak, and pumped-storage round trip</title><desc id="desc">Pondage supplies only the deficit: releasing 5 m³/s against 2 m³/s inflow for 2 h needs 21,600 m³. Pumped storage at 90 percent each way returns 81 MWh from 100 MWh, a round trip of 0.81.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><text x="200" y="50" font-size="16" fill="#273b45" text-anchor="middle">Pondage for a 2 h peak</text><rect x="156.67" y="131.67" width="86.67" height="95" fill="#f5ead8" stroke="#b98232" stroke-width="1.5"/><text x="200" y="184.17" font-size="14" fill="#b98232" text-anchor="middle">pondage</text><line x1="70" y1="226.67" x2="330" y2="226.67" stroke="#287aab" stroke-width="3"/><path d="M70 223.67 L156.67 223.67 L156.67 131.67 L243.33 131.67 L243.33 223.67 L330 223.67" stroke="#b64f4f" stroke-width="2.5" fill="none" stroke-dasharray="7 4" stroke-linejoin="round" stroke-linecap="round"/><text x="326" y="246.67" font-size="14" fill="#287aab" text-anchor="end">inflow 2</text><text x="200" y="123.67" font-size="14" fill="#b64f4f" text-anchor="middle">release 5</text><line x1="70" y1="290" x2="336" y2="290" stroke="#647780" stroke-width="2"/><polygon points="344,290 334,294 334,286" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><line x1="70" y1="290" x2="70" y2="94" stroke="#647780" stroke-width="2"/><polygon points="70,86 74,96 66,96" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><text x="200" y="326" font-size="14" fill="#273b45" text-anchor="middle">hour</text><text x="76" y="76" font-size="14" fill="#273b45" text-anchor="start">Q (m³/s)</text><text x="70" y="308" font-size="13" fill="#273b45" text-anchor="middle">0</text><text x="156.67" y="308" font-size="13" fill="#273b45" text-anchor="middle">2</text><text x="243.33" y="308" font-size="13" fill="#273b45" text-anchor="middle">4</text><text x="330" y="308" font-size="13" fill="#273b45" text-anchor="middle">6</text><text x="200" y="350" font-size="15" fill="#273b45" text-anchor="middle">V = (5 − 2) × 2 × 3600 = 21,600 m³</text><text x="200" y="374" font-size="13" fill="#647780" text-anchor="middle">the deficit only, not the whole release</text><line x1="370" y1="30" x2="370" y2="390" stroke="#b8c8ce" stroke-width="1.5" stroke-dasharray="6 5"/><text x="550" y="50" font-size="16" fill="#273b45" text-anchor="middle">Pumped storage</text><rect x="420" y="90" width="260" height="44" rx="8" fill="#e6f1f8" stroke="#287aab" stroke-width="2"/><text x="550" y="117.4" font-size="15" fill="#273b45" text-anchor="middle">pump in 100 MWh</text><rect x="420" y="170" width="260" height="44" rx="8" fill="#e6f1f8" stroke="#287aab" stroke-width="2"/><text x="550" y="197.4" font-size="15" fill="#273b45" text-anchor="middle">90 MWh stored (η pump 0.90)</text><line x1="550" y1="136" x2="550" y2="162.6" stroke="#647780" stroke-width="2"/><polygon points="550,169 546.5,161 553.5,161" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><rect x="420" y="250" width="260" height="44" rx="8" fill="#e6f1f8" stroke="#287aab" stroke-width="2"/><text x="550" y="277.4" font-size="15" fill="#273b45" text-anchor="middle">81 MWh back (η gen 0.90)</text><line x1="550" y1="216" x2="550" y2="242.6" stroke="#647780" stroke-width="2"/><polygon points="550,249 546.5,241 553.5,241" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><text x="550" y="330" font-size="15" fill="#2b7b61" text-anchor="middle">round trip = 0.90 × 0.90 = 0.81</text><text x="550" y="354" font-size="13" fill="#647780" text-anchor="middle">the product, not the average</text><text x="550" y="376" font-size="13" fill="#647780" text-anchor="middle">it shifts energy in time; it creates none</text></g></svg>