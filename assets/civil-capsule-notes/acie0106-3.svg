<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Deviation against a named base</title><desc id="desc">A percentage deviation is the change divided by the stated base, such as the sanctioned estimate; read the governing procedure for any revision threshold.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="120" y1="340" x2="600" y2="340" stroke="#647780" stroke-width="2"/><rect x="180" y="140" width="110" height="200" fill="#e6f1f8" stroke="#287aab" stroke-width="2"/><rect x="400" y="110" width="110" height="230" fill="#f5ead8" stroke="#b98232" stroke-width="2"/><text x="235" y="366" font-size="16" fill="#273b45" text-anchor="middle">Sanctioned</text><text x="235" y="390" font-size="16" fill="#273b45" text-anchor="middle">estimate, base</text><text x="455" y="366" font-size="16" fill="#273b45" text-anchor="middle">Revised</text><text x="455" y="390" font-size="16" fill="#273b45" text-anchor="middle">forecast, new</text><line x1="290" y1="140" x2="540" y2="140" stroke="#647780" stroke-width="1.2" stroke-dasharray="5 5"/><line x1="540" y1="140" x2="540" y2="110" stroke="#647780" stroke-width="1.5"/><line x1="534" y1="140" x2="546" y2="140" stroke="#647780" stroke-width="1.5"/><line x1="534" y1="110" x2="546" y2="110" stroke="#647780" stroke-width="1.5"/><text x="556" y="132" font-size="16" fill="#273b45" text-anchor="start">change</text><text x="360" y="60" font-size="19" fill="#273b45" text-anchor="middle">Δ% = 100 × (new − base) / base</text></g></svg>