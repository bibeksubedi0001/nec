<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Needle penetration test</title><desc id="desc">A standard needle loaded to 100 g sinks into the binder for 5 s at 25 °C; the depth is reported in 0.1 mm units, so 62 units is 6.2 mm. Readings are spaced from earlier points and the wall.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><text x="200" y="40" font-size="16" fill="#273b45" text-anchor="middle">25 °C, 100 g, 5 s</text><rect x="70" y="190" width="260" height="140" fill="#d8edf7" stroke="#287aab" stroke-width="1.5"/><text x="115" y="322" font-size="13" fill="#287aab" text-anchor="middle">25 °C bath</text><rect x="100" y="220" width="200" height="90" fill="#273b45" stroke="#273b45" stroke-width="2" opacity="0.85"/><rect x="180" y="60" width="40" height="40" rx="8" fill="#d6dfe3" stroke="#273b45" stroke-width="2"/><text x="200" y="84.32" font-size="12" fill="#273b45" text-anchor="middle">100 g</text><line x1="200" y1="100" x2="200" y2="245" stroke="#466d89" stroke-width="2.5"/><line x1="236" y1="220" x2="236" y2="245" stroke="#647780" stroke-width="1.5"/><line x1="243" y1="220" x2="229" y2="220" stroke="#647780" stroke-width="1.5"/><line x1="243" y1="245" x2="229" y2="245" stroke="#647780" stroke-width="1.5"/><text x="244" y="212" font-size="13" fill="#273b45" text-anchor="start">d = 6.2 mm</text><line x1="360" y1="30" x2="360" y2="340" stroke="#b8c8ce" stroke-width="1.5" stroke-dasharray="6 5"/><text x="540" y="60" font-size="15" fill="#273b45" text-anchor="middle">Plan of the sample cup</text><circle cx="540" cy="200" r="100" fill="#273b45" stroke="#273b45" stroke-width="2"/><circle cx="540" cy="200" r="76" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="5 4"/><circle cx="510" cy="170" r="16" fill="none" stroke="#b98232" stroke-width="1.5" stroke-dasharray="3 3"/><circle cx="510" cy="170" r="3" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><circle cx="575" cy="185" r="16" fill="none" stroke="#b98232" stroke-width="1.5" stroke-dasharray="3 3"/><circle cx="575" cy="185" r="3" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><circle cx="530" cy="240" r="16" fill="none" stroke="#b98232" stroke-width="1.5" stroke-dasharray="3 3"/><circle cx="530" cy="240" r="3" fill="#ffffff" stroke="#ffffff" stroke-width="2"/><text x="540" y="322" font-size="13" fill="#273b45" text-anchor="middle">space readings from earlier points and the wall</text><text x="360" y="362" font-size="15" fill="#287aab" text-anchor="middle">d = 0.1 P mm: 62 units = 6.2 mm</text><text x="360" y="386" font-size="13" fill="#647780" text-anchor="middle">A consistency index, not a viscosity; 60 °C and 135 °C belong to other tests</text></g></svg>