<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Absolute and gauge pressure references</title><desc id="desc">Absolute pressure is measured from a perfect vacuum and gauge pressure from the local atmosphere; with signed gauge readings the atmosphere is always added.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="60" y1="360" x2="680" y2="360" stroke="#273b45" stroke-width="3"/><text x="64" y="382" font-size="15" fill="#273b45" text-anchor="start">perfect vacuum: absolute zero</text><line x1="60" y1="200" x2="680" y2="200" stroke="#287aab" stroke-width="2" stroke-dasharray="10 6"/><text x="64" y="190" font-size="15" fill="#287aab" text-anchor="start">local atmosphere: 95 kPa abs</text><line x1="280" y1="360" x2="280" y2="107.75" stroke="#2b7b61" stroke-width="3"/><polygon points="280,98.95 284.5,109.95 275.5,109.95" fill="#2b7b61" stroke="#2b7b61" stroke-width="1.5" stroke-linejoin="round"/><text x="270" y="250" font-size="15" fill="#2b7b61" text-anchor="end">155 kPa abs</text><line x1="350" y1="200" x2="350" y2="107.75" stroke="#287aab" stroke-width="3"/><polygon points="350,98.95 354.5,109.95 345.5,109.95" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><text x="360" y="150" font-size="15" fill="#287aab" text-anchor="start">+60 kPa gauge</text><line x1="266" y1="98.95" x2="364" y2="98.95" stroke="#647780" stroke-width="1.2" stroke-dasharray="4 4"/><circle cx="315" cy="98.95" r="5" fill="#273b45" stroke="#273b45" stroke-width="2"/><text x="315" y="86.95" font-size="17" fill="#273b45" text-anchor="middle">A</text><line x1="500" y1="360" x2="500" y2="250.91" stroke="#2b7b61" stroke-width="3"/><polygon points="500,242.11 504.5,253.11 495.5,253.11" fill="#2b7b61" stroke="#2b7b61" stroke-width="1.5" stroke-linejoin="round"/><text x="490" y="318" font-size="15" fill="#2b7b61" text-anchor="end">70 kPa abs</text><line x1="570" y1="200" x2="570" y2="233.31" stroke="#b64f4f" stroke-width="3"/><polygon points="570,242.11 565.5,231.11 574.5,231.11" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="580" y="226" font-size="15" fill="#b64f4f" text-anchor="start">−25 kPa gauge</text><line x1="486" y1="242.11" x2="584" y2="242.11" stroke="#647780" stroke-width="1.2" stroke-dasharray="4 4"/><circle cx="535" cy="242.11" r="5" fill="#273b45" stroke="#273b45" stroke-width="2"/><text x="535" y="266.11" font-size="17" fill="#273b45" text-anchor="middle">B</text><text x="520" y="70" font-size="17" fill="#273b45" text-anchor="middle">p abs = p atm + p gauge (signed)</text><text x="360" y="408" font-size="15" fill="#647780" text-anchor="middle">A vented-case Bourdon gauge reads gauge pressure</text></g></svg>