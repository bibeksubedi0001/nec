<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Time-mean and space-mean speed</title><desc id="desc">With equal flows at 30 and 60 km/h, the slow vehicles are twice as dense on the road. The time mean at a point is 45 km/h and the space mean, the harmonic mean, is 40 km/h; TMS is never below SMS.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><text x="360" y="50" font-size="16" fill="#273b45" text-anchor="middle">One traffic stream, two averages</text><rect x="40" y="90" width="640" height="60" fill="#d6dfe3" stroke="#273b45" stroke-width="1.5"/><line x1="40" y1="120" x2="680" y2="120" stroke="#ffffff" stroke-width="2" stroke-dasharray="10 8"/><rect x="50" y="99" width="24" height="12" rx="3" fill="#287aab" stroke="#287aab" stroke-width="2"/><rect x="110" y="99" width="24" height="12" rx="3" fill="#287aab" stroke="#287aab" stroke-width="2"/><rect x="170" y="99" width="24" height="12" rx="3" fill="#287aab" stroke="#287aab" stroke-width="2"/><rect x="230" y="99" width="24" height="12" rx="3" fill="#287aab" stroke="#287aab" stroke-width="2"/><rect x="290" y="99" width="24" height="12" rx="3" fill="#287aab" stroke="#287aab" stroke-width="2"/><rect x="350" y="99" width="24" height="12" rx="3" fill="#287aab" stroke="#287aab" stroke-width="2"/><rect x="410" y="99" width="24" height="12" rx="3" fill="#287aab" stroke="#287aab" stroke-width="2"/><rect x="470" y="99" width="24" height="12" rx="3" fill="#287aab" stroke="#287aab" stroke-width="2"/><rect x="530" y="99" width="24" height="12" rx="3" fill="#287aab" stroke="#287aab" stroke-width="2"/><rect x="590" y="99" width="24" height="12" rx="3" fill="#287aab" stroke="#287aab" stroke-width="2"/><rect x="650" y="99" width="24" height="12" rx="3" fill="#287aab" stroke="#287aab" stroke-width="2"/><rect x="70" y="129" width="24" height="12" rx="3" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><rect x="190" y="129" width="24" height="12" rx="3" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><rect x="310" y="129" width="24" height="12" rx="3" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><rect x="430" y="129" width="24" height="12" rx="3" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><rect x="550" y="129" width="24" height="12" rx="3" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><line x1="360" y1="80" x2="360" y2="160" stroke="#b98232" stroke-width="2.5" stroke-dasharray="5 4"/><text x="360" y="178" font-size="13" fill="#b98232" text-anchor="middle">detector: equal counts per hour</text><text x="200" y="206" font-size="14" fill="#287aab" text-anchor="middle">30 km/h: 2/3 of vehicles on the road</text><text x="530" y="206" font-size="14" fill="#b64f4f" text-anchor="middle">60 km/h: 1/3 on the road</text><text x="360" y="252" font-size="15" fill="#273b45" text-anchor="middle">TMS = (30 + 60)/2 = 45 km/h, arithmetic mean at a point</text><text x="360" y="280" font-size="15" fill="#273b45" text-anchor="middle">SMS = 2 / (1/30 + 1/60) = 40 km/h, harmonic mean</text><text x="360" y="308" font-size="14" fill="#287aab" text-anchor="middle">vt = vs + σs²/vs = 40 + 200/40 = 45</text><text x="360" y="340" font-size="14" fill="#2b7b61" text-anchor="middle">TMS ≥ SMS, equal only when every vehicle has the same speed</text><text x="360" y="366" font-size="13" fill="#647780" text-anchor="middle">Compare one population observed two ways, not unrelated surveys</text></g></svg>