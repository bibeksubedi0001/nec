<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Reading the design intensity at the time of concentration</title><desc id="desc">The rational-method peak uses the intensity for a duration equal to the time of concentration, the travel time from the most remote point to the outlet.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="100" y1="320" x2="506" y2="320" stroke="#647780" stroke-width="2"/><polygon points="514,320 504,324 504,316" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><line x1="100" y1="320" x2="100" y2="64" stroke="#647780" stroke-width="2"/><polygon points="100,56 104,66 96,66" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><text x="300" y="360" font-size="16" fill="#273b45" text-anchor="middle">Storm duration t, min</text><text x="106" y="46" font-size="16" fill="#273b45" text-anchor="start">Intensity I, mm/h</text><path d="M100 82.5 L105 99.07 L110 113.48 L115 126.12 L120 137.31 L125 147.27 L130 156.21 L135 164.26 L140 171.56 L145 178.21 L150 184.29 L155 189.86 L160 195 L165 199.75 L170 204.15 L175 208.24 L180 212.05 L185 215.6 L190 218.94 L195 222.06 L200 225 L205 227.77 L210 230.38 L215 232.84 L220 235.18 L225 237.39 L230 239.49 L235 241.49 L240 243.39 L245 245.2 L250 246.92 L255 248.57 L260 250.15 L265 251.65 L270 253.1 L275 254.48 L280 255.81 L285 257.09 L290 258.31 L295 259.49 L300 260.63 L305 261.72 L310 262.77 L315 263.79 L320 264.77 L325 265.71 L330 266.63 L335 267.51 L340 268.37 L345 269.2 L350 270 L355 270.78 L360 271.53 L365 272.26 L370 272.97 L375 273.66 L380 274.33 L385 274.98 L390 275.61 L395 276.22 L400 276.82 L405 277.4 L410 277.96 L415 278.52 L420 279.05 L425 279.57 L430 280.08 L435 280.58 L440 281.07 L445 281.54 L450 282 L455 282.45 L460 282.89 L465 283.32 L470 283.74 L475 284.15 L480 284.55 L485 284.94 L490 285.33 L495 285.7 L500 286.07" stroke="#287aab" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="170" y="96" font-size="15" fill="#287aab" text-anchor="start">assumed fit I = 760 / (t + 10)</text><line x1="166.67" y1="320" x2="166.67" y2="201.25" stroke="#647780" stroke-width="1.2" stroke-dasharray="4 4"/><line x1="100" y1="201.25" x2="166.67" y2="201.25" stroke="#647780" stroke-width="1.2" stroke-dasharray="4 4"/><circle cx="166.67" cy="201.25" r="5" fill="#647780" stroke="#647780" stroke-width="2"/><text x="176.67" y="195.25" font-size="15" fill="#647780" text-anchor="start">t = 10 min: 38 mm/h</text><line x1="266.67" y1="320" x2="266.67" y2="252.14" stroke="#2b7b61" stroke-width="1.2" stroke-dasharray="4 4"/><line x1="100" y1="252.14" x2="266.67" y2="252.14" stroke="#2b7b61" stroke-width="1.2" stroke-dasharray="4 4"/><circle cx="266.67" cy="252.14" r="5" fill="#2b7b61" stroke="#2b7b61" stroke-width="2"/><text x="276.67" y="246.14" font-size="15" fill="#2b7b61" text-anchor="start">tc = 25 min: 21.7 mm/h</text><text x="520" y="120" font-size="17" fill="#273b45" text-anchor="start">Q = C I A / 36</text><text x="520" y="144" font-size="14" fill="#647780" text-anchor="start">I in cm/h, A in ha</text><text x="520" y="190" font-size="15" fill="#273b45" text-anchor="start">C = 0.60, I = 3 cm/h,</text><text x="520" y="212" font-size="15" fill="#273b45" text-anchor="start">A = 120 ha: Q = 6.0 m³/s</text><text x="520" y="262" font-size="15" fill="#273b45" text-anchor="start">tc = Te + Tf</text><text x="520" y="286" font-size="15" fill="#273b45" text-anchor="start">= 7 + 18 = 25 min</text><text x="360" y="404" font-size="15" fill="#273b45" text-anchor="middle">Design intensity is read for a duration equal to the time of concentration</text></g></svg>