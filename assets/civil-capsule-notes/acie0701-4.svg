<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Consumptive use: evaporation plus transpiration</title><desc id="desc">Consumptive use counts water returned to the atmosphere: 2 mm/day evaporation plus 4 mm/day transpiration gives 6 mm/day. Deep percolation leaves the root zone but is not consumed.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><text x="360" y="40" font-size="17" fill="#2b7b61" text-anchor="middle">CU = E + T = 2 + 4 = 6 mm/day</text><rect x="40" y="250" width="640" height="100" fill="#f0e6d4" stroke="none" stroke-width="2"/><line x1="40" y1="250" x2="680" y2="250" stroke="#273b45" stroke-width="2"/><line x1="40" y1="320" x2="680" y2="320" stroke="#2b7b61" stroke-width="1.5" stroke-dasharray="6 4"/><text x="48" y="314" font-size="14" fill="#2b7b61" text-anchor="start">root zone</text><line x1="150" y1="245" x2="150" y2="140.8" stroke="#287aab" stroke-width="3"/><polygon points="150,132 154.5,143 145.5,143" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><text x="150" y="120" font-size="16" fill="#287aab" text-anchor="middle">E = 2</text><line x1="360" y1="250" x2="360" y2="180" stroke="#2b7b61" stroke-width="3"/><ellipse cx="340" cy="200" rx="18" ry="8" fill="#deeee6" stroke="#2b7b61" stroke-width="1.5" transform="rotate(-30 340 200)"/><ellipse cx="380" cy="190" rx="18" ry="8" fill="#deeee6" stroke="#2b7b61" stroke-width="1.5" transform="rotate(30 380 190)"/><ellipse cx="345" cy="175" rx="18" ry="8" fill="#deeee6" stroke="#2b7b61" stroke-width="1.5" transform="rotate(-20 345 175)"/><line x1="360" y1="252" x2="360" y2="300" stroke="#b98232" stroke-width="1.5"/><line x1="360" y1="252" x2="340" y2="290" stroke="#b98232" stroke-width="1.5"/><line x1="360" y1="252" x2="380" y2="292" stroke="#b98232" stroke-width="1.5"/><line x1="360" y1="166" x2="360" y2="100.8" stroke="#2b7b61" stroke-width="3"/><polygon points="360,92 364.5,103 355.5,103" fill="#2b7b61" stroke="#2b7b61" stroke-width="1.5" stroke-linejoin="round"/><text x="360" y="80" font-size="16" fill="#2b7b61" text-anchor="middle">T = 4</text><line x1="560" y1="262" x2="560" y2="337.2" stroke="#b64f4f" stroke-width="2.5" stroke-dasharray="6 4"/><polygon points="560,346 555.5,335 564.5,335" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="548" y="340" font-size="14" fill="#b64f4f" text-anchor="end">deep percolation 3: not consumed</text><text x="360" y="380" font-size="14" fill="#273b45" text-anchor="middle">Counting percolation would give 9 mm/day and overstate consumption</text><text x="360" y="404" font-size="13" fill="#647780" text-anchor="middle">It may recharge groundwater or return downstream</text></g></svg>