<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Plinth area and carpet area</title><desc id="desc">Plinth area is measured to the outer faces of the walls at plinth level; carpet area is the usable room floor, often assumed as a fraction of the plinth area.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><rect x="130" y="70" width="460" height="270" fill="#d6dfe3" stroke="#273b45" stroke-width="2.5"/><rect x="146" y="86" width="198" height="164" fill="#deeee6" stroke="#2b7b61" stroke-width="1.5"/><rect x="356" y="86" width="218" height="164" fill="#deeee6" stroke="#2b7b61" stroke-width="1.5"/><rect x="146" y="262" width="428" height="62" fill="#eef3f5" stroke="#647780" stroke-width="1.5"/><text x="245" y="174" font-size="18" fill="#2b7b61" text-anchor="middle">Room</text><text x="465" y="174" font-size="18" fill="#2b7b61" text-anchor="middle">Room</text><text x="360" y="300" font-size="17" fill="#647780" text-anchor="middle">Passage</text><line x1="130" y1="48" x2="590" y2="48" stroke="#647780" stroke-width="1.5"/><line x1="130" y1="41" x2="130" y2="55" stroke="#647780" stroke-width="1.5"/><line x1="590" y1="41" x2="590" y2="55" stroke="#647780" stroke-width="1.5"/><text x="360" y="42" font-size="16" fill="#647780" text-anchor="middle">L, outer faces</text><line x1="108" y1="70" x2="108" y2="340" stroke="#647780" stroke-width="1.5"/><line x1="115" y1="70" x2="101" y2="70" stroke="#647780" stroke-width="1.5"/><line x1="115" y1="340" x2="101" y2="340" stroke="#647780" stroke-width="1.5"/><text x="100" y="211" font-size="17" fill="#647780" text-anchor="end">B</text><text x="360" y="374" font-size="17" fill="#273b45" text-anchor="middle">Plinth area Ap = L × B at plinth level</text><text x="360" y="400" font-size="15" fill="#2b7b61" text-anchor="middle">Carpet area: usable room floor, Ac = k × Ap if assumed</text></g></svg>