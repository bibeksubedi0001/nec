<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Two layers of building regulation in Nepal</title><desc id="desc">The Building Act and its implementation framework supply the legal basis, while the Nepal National Building Code organizes the technical provisions.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><rect x="160" y="70" width="400" height="80" rx="8" fill="#e6f1f8" stroke="#287aab" stroke-width="2"/><text x="360" y="105.75" font-size="17" fill="#273b45" text-anchor="middle"><tspan x="360" dy="0">Building Act and implementation framework</tspan><tspan x="360" dy="20.74">legal basis</tspan></text><rect x="160" y="220" width="400" height="80" rx="8" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><text x="360" y="255.75" font-size="17" fill="#273b45" text-anchor="middle"><tspan x="360" dy="0">Nepal National Building Code</tspan><tspan x="360" dy="20.74">technical provisions</tspan></text><line x1="360" y1="150" x2="360" y2="207.2" stroke="#647780" stroke-width="2.5"/><polygon points="360,216 355.5,205 364.5,205" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><text x="380" y="190" font-size="14" fill="#647780" text-anchor="start">applied together</text><text x="360" y="350" font-size="15" fill="#273b45" text-anchor="middle">Approved drawings do not replace the Act or the NBC requirements</text><text x="360" y="378" font-size="14" fill="#647780" text-anchor="middle">A code title alone does not show that a project complies</text></g></svg>