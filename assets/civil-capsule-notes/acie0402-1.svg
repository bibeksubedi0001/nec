<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Young's modulus and shear modulus from test data</title><desc id="desc">Each modulus is a stress over its own matching strain in the linear range: 120 MPa at 0.0006 gives E = 200 GPa, and 30 MPa at 0.0004 rad gives G = 75 GPa.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="90" y1="300" x2="336" y2="300" stroke="#647780" stroke-width="2"/><polygon points="344,300 334,304 334,296" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><line x1="90" y1="300" x2="90" y2="84" stroke="#647780" stroke-width="2"/><polygon points="90,76 94,86 86,86" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><text x="210" y="344" font-size="16" fill="#273b45" text-anchor="middle">Axial strain ε</text><text x="96" y="66" font-size="16" fill="#273b45" text-anchor="start">σ, MPa</text><line x1="90" y1="300" x2="297" y2="118.88" stroke="#287aab" stroke-width="3"/><line x1="270" y1="300" x2="270" y2="142.5" stroke="#647780" stroke-width="1.2" stroke-dasharray="4 4"/><line x1="90" y1="142.5" x2="270" y2="142.5" stroke="#647780" stroke-width="1.2" stroke-dasharray="4 4"/><circle cx="270" cy="142.5" r="5" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><text x="270" y="318" font-size="13" fill="#647780" text-anchor="middle">0.0006</text><text x="84" y="147.5" font-size="13" fill="#647780" text-anchor="end">120</text><text x="210" y="48" font-size="17" fill="#2b7b61" text-anchor="middle">E = σ / ε = 200 GPa</text><line x1="440" y1="300" x2="686" y2="300" stroke="#647780" stroke-width="2"/><polygon points="694,300 684,304 684,296" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><line x1="440" y1="300" x2="440" y2="84" stroke="#647780" stroke-width="2"/><polygon points="440,76 444,86 436,86" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><text x="560" y="344" font-size="16" fill="#273b45" text-anchor="middle">Engineering shear strain γ</text><text x="446" y="66" font-size="16" fill="#273b45" text-anchor="start">τ, MPa</text><line x1="440" y1="300" x2="660.8" y2="118.88" stroke="#287aab" stroke-width="3"/><line x1="632" y1="300" x2="632" y2="142.5" stroke="#647780" stroke-width="1.2" stroke-dasharray="4 4"/><line x1="440" y1="142.5" x2="632" y2="142.5" stroke="#647780" stroke-width="1.2" stroke-dasharray="4 4"/><circle cx="632" cy="142.5" r="5" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><text x="632" y="318" font-size="13" fill="#647780" text-anchor="middle">0.0004</text><text x="434" y="147.5" font-size="13" fill="#647780" text-anchor="end">30</text><text x="560" y="48" font-size="17" fill="#2b7b61" text-anchor="middle">G = τ / γ = 75 GPa</text><text x="360" y="390" font-size="14" fill="#647780" text-anchor="middle">Use γ, the total change of a right angle: the tensor value γ/2 would double G</text></g></svg>