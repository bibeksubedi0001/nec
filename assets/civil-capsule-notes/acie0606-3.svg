<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Hazard chains: geological and climatic</title><desc id="desc">An earthquake that triggers a landslide is a chain of two geological hazards and the blocked road is the exposed asset. Drought is climatic, but wildfire risk also depends on fuel, wind, ignition and land management.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><text x="360" y="52" font-size="15" fill="#273b45" text-anchor="middle">Chain of two geological hazards</text><rect x="30" y="70" width="180" height="64" rx="8" fill="#f2dfdf" stroke="#b64f4f" stroke-width="2"/><text x="120" y="98.25" font-size="15" fill="#273b45" text-anchor="middle"><tspan x="120" dy="0">Earthquake</tspan><tspan x="120" dy="18.3">(geological)</tspan></text><rect x="270" y="70" width="180" height="64" rx="8" fill="#f2dfdf" stroke="#b64f4f" stroke-width="2"/><text x="360" y="98.25" font-size="15" fill="#273b45" text-anchor="middle"><tspan x="360" dy="0">Landslide</tspan><tspan x="360" dy="18.3">(geological)</tspan></text><line x1="214" y1="102" x2="257.2" y2="102" stroke="#647780" stroke-width="2.5"/><polygon points="266,102 255,106.5 255,97.5" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><rect x="510" y="70" width="180" height="64" rx="8" fill="#d6dfe3" stroke="#273b45" stroke-width="2"/><text x="600" y="98.25" font-size="15" fill="#273b45" text-anchor="middle"><tspan x="600" dy="0">Road blocked</tspan><tspan x="600" dy="18.3">(exposed asset)</tspan></text><line x1="454" y1="102" x2="497.2" y2="102" stroke="#647780" stroke-width="2.5"/><polygon points="506,102 495,106.5 495,97.5" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><text x="360" y="182" font-size="15" fill="#273b45" text-anchor="middle">Climatic chain</text><rect x="30" y="200" width="180" height="64" rx="8" fill="#f5ead8" stroke="#b98232" stroke-width="2"/><text x="120" y="228.25" font-size="15" fill="#273b45" text-anchor="middle"><tspan x="120" dy="0">Drought</tspan><tspan x="120" dy="18.3">(slow-onset climatic)</tspan></text><rect x="270" y="200" width="180" height="64" rx="8" fill="#f5ead8" stroke="#b98232" stroke-width="2"/><text x="360" y="228.25" font-size="15" fill="#273b45" text-anchor="middle"><tspan x="360" dy="0">Dry vegetation,</tspan><tspan x="360" dy="18.3">high fire danger</tspan></text><line x1="214" y1="232" x2="257.2" y2="232" stroke="#647780" stroke-width="2.5"/><polygon points="266,232 255,236.5 255,227.5" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><rect x="510" y="200" width="180" height="64" rx="8" fill="#f2dfdf" stroke="#b64f4f" stroke-width="2"/><text x="600" y="228.25" font-size="15" fill="#273b45" text-anchor="middle"><tspan x="600" dy="0">Wildfire</tspan><tspan x="600" dy="18.3">(climatological)</tspan></text><line x1="454" y1="232" x2="497.2" y2="232" stroke="#647780" stroke-width="2.5"/><polygon points="506,232 495,236.5 495,227.5" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><text x="360" y="300" font-size="14" fill="#273b45" text-anchor="middle">fire risk = weather + fuel condition + wind + ignition + land management</text><text x="360" y="350" font-size="14" fill="#273b45" text-anchor="middle">Classify the physical process; triggers and exposure are separate</text><text x="360" y="376" font-size="13" fill="#647780" text-anchor="middle">Jajarkot, Karnali Province: western Nepal (verify local damage)</text></g></svg>