<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Venturi and orifice meters compared</title><desc id="desc">A Venturi accelerates the flow smoothly into its throat and recovers it gently; an orifice jet contracts to a vena contracta and mixes violently, so its Cd is much lower.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><polygon points="60,70 180,70 300,95 340,95 560,70 660,70 660,160 560,160 340,135 300,135 180,160 60,160" fill="#d8edf7" stroke="none" stroke-width="2" stroke-linejoin="round"/><path d="M60 70 L180 70 L300 95 L340 95 L560 70 L660 70" stroke="#273b45" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M60 160 L180 160 L300 135 L340 135 L560 160 L660 160" stroke="#273b45" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="60" y="56" font-size="17" fill="#273b45" text-anchor="start">Venturi</text><line x1="80" y1="115" x2="151.2" y2="115" stroke="#287aab" stroke-width="2.5"/><polygon points="160,115 149,119.5 149,110.5" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><text x="320" y="184" font-size="15" fill="#273b45" text-anchor="middle">throat: highest V, lowest p</text><text x="570" y="184" font-size="15" fill="#273b45" text-anchor="middle">gentle recovery, small loss</text><rect x="60" y="250" width="600" height="100" fill="#d8edf7" stroke="none" stroke-width="2"/><line x1="60" y1="250" x2="660" y2="250" stroke="#273b45" stroke-width="3"/><line x1="60" y1="350" x2="660" y2="350" stroke="#273b45" stroke-width="3"/><rect x="256" y="250" width="8" height="30" fill="#466d89" stroke="#466d89" stroke-width="2"/><rect x="256" y="320" width="8" height="30" fill="#466d89" stroke="#466d89" stroke-width="2"/><path d="M264 281 Q286 288 310 288 Q380 288 470 252" stroke="#287aab" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M264 319 Q286 312 310 312 Q380 312 470 348" stroke="#287aab" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="330" cy="262" rx="20" ry="6" fill="none" stroke="#647780" stroke-width="1.2" stroke-dasharray="4 3"/><ellipse cx="330" cy="338" rx="20" ry="6" fill="none" stroke="#647780" stroke-width="1.2" stroke-dasharray="4 3"/><ellipse cx="390" cy="264" rx="20" ry="6" fill="none" stroke="#647780" stroke-width="1.2" stroke-dasharray="4 3"/><ellipse cx="390" cy="336" rx="20" ry="6" fill="none" stroke="#647780" stroke-width="1.2" stroke-dasharray="4 3"/><text x="60" y="238" font-size="17" fill="#273b45" text-anchor="start">Orifice plate</text><text x="560" y="238" font-size="15" fill="#b64f4f" text-anchor="middle">Cd about 0.62 to 0.65</text><line x1="310" y1="300" x2="310" y2="362" stroke="#647780" stroke-width="1.2"/><text x="310" y="378" font-size="15" fill="#273b45" text-anchor="middle">vena contracta</text><text x="500" y="378" font-size="15" fill="#273b45" text-anchor="middle">eddies and mixing: larger loss</text><text x="360" y="406" font-size="16" fill="#273b45" text-anchor="middle">Q = Cd A1 A2 √(2g Δh) / √(A1² − A2²)</text></g></svg>