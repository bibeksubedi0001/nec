<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Reservoir storage zones and bank storage</title><desc id="desc">Flood surcharge sits above full level, active storage between minimum operating and full levels, and dead storage below the minimum level, often the sediment allowance. Bank storage is a groundwater exchange.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><polygon points="20,90 40,90 300,320 300,340 20,340" fill="#f0e6d4" stroke="none" stroke-width="2" stroke-linejoin="round"/><rect x="300" y="320" width="400" height="20" fill="#f0e6d4" stroke="none" stroke-width="2"/><polygon points="51,100 520,100 520,130 85,130" fill="#f5ead8" stroke="#b98232" stroke-width="1" stroke-linejoin="round" stroke-dasharray="5 4"/><polygon points="85,130 520,130 520,230 198,230" fill="#e6f1f8" stroke="#287aab" stroke-width="1" stroke-linejoin="round"/><polygon points="198,230 520,230 520,320 300,320" fill="#d6dfe3" stroke="#8a9aa3" stroke-width="1" stroke-linejoin="round"/><circle cx="310" cy="306" r="3" fill="#b98232" stroke="#b98232" stroke-width="2"/><circle cx="324" cy="312" r="3" fill="#b98232" stroke="#b98232" stroke-width="2"/><circle cx="338" cy="306" r="3" fill="#b98232" stroke="#b98232" stroke-width="2"/><circle cx="352" cy="312" r="3" fill="#b98232" stroke="#b98232" stroke-width="2"/><circle cx="366" cy="306" r="3" fill="#b98232" stroke="#b98232" stroke-width="2"/><circle cx="380" cy="312" r="3" fill="#b98232" stroke="#b98232" stroke-width="2"/><circle cx="394" cy="306" r="3" fill="#b98232" stroke="#b98232" stroke-width="2"/><circle cx="408" cy="312" r="3" fill="#b98232" stroke="#b98232" stroke-width="2"/><circle cx="422" cy="306" r="3" fill="#b98232" stroke="#b98232" stroke-width="2"/><circle cx="436" cy="312" r="3" fill="#b98232" stroke="#b98232" stroke-width="2"/><circle cx="450" cy="306" r="3" fill="#b98232" stroke="#b98232" stroke-width="2"/><circle cx="464" cy="312" r="3" fill="#b98232" stroke="#b98232" stroke-width="2"/><circle cx="478" cy="306" r="3" fill="#b98232" stroke="#b98232" stroke-width="2"/><circle cx="492" cy="312" r="3" fill="#b98232" stroke="#b98232" stroke-width="2"/><circle cx="506" cy="306" r="3" fill="#b98232" stroke="#b98232" stroke-width="2"/><path d="M40 90 L300 320 L520 320" stroke="#273b45" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="520,90 560,90 650,320 520,320" fill="#e4e8e9" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><line x1="520" y1="234" x2="700" y2="234" stroke="#466d89" stroke-width="5"/><text x="700" y="224" font-size="13" fill="#466d89" text-anchor="end">outlet</text><text x="300" y="121" font-size="14" fill="#b98232" text-anchor="middle">flood surcharge</text><text x="340" y="186" font-size="16" fill="#287aab" text-anchor="middle">active (live) storage</text><text x="420" y="286" font-size="14" fill="#273b45" text-anchor="middle">dead: sediment allowance</text><text x="510" y="96" font-size="12" fill="#273b45" text-anchor="end">MFL</text><text x="510" y="126" font-size="12" fill="#273b45" text-anchor="end">FRL</text><text x="510" y="226" font-size="12" fill="#273b45" text-anchor="end">MOL</text><line x1="110" y1="152" x2="92.23" y2="172.2" stroke="#287aab" stroke-width="2"/><polygon points="88,177 90.66,168.68 95.91,173.31" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><line x1="150" y1="188" x2="132.23" y2="208.2" stroke="#287aab" stroke-width="2"/><polygon points="128,213 130.66,204.68 135.91,209.31" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><text x="30" y="250" font-size="13" fill="#287aab" text-anchor="start">bank storage:</text><text x="30" y="268" font-size="13" fill="#287aab" text-anchor="start">groundwater exchange</text><text x="360" y="364" font-size="14" fill="#273b45" text-anchor="middle">Sediment life T = 0.20 × 30 / 0.10 = 60 years (constant rate, no removal)</text><text x="360" y="388" font-size="13" fill="#647780" text-anchor="middle">Dead storage is a volume below MOL; bank storage does not raise surveyed capacity</text></g></svg>