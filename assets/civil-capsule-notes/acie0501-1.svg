287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><line x1="495" y1="66" x2="495" y2="169.1" stroke="#287aab" stroke-width="1.8"/><polygon points="495,175.5 491.5,167.5 498.5,167.5" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><line x1="540" y1="66" x2="540" y2="191.6" stroke="#287aab" stroke-width="1.8"/><polygon points="540,198 536.5,190 543.5,190" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><text x="360" y="50" font-size="16" fill="#287aab" text-anchor="middle">S = μ S0 = 0.75 × 2.4 = 1.80 kN/m² on plan area</text><text x="40" y="360" font-size="15" fill="#273b45" text-anchor="start">ground snow S0 = 2.4 kN/m²</text><text x="680" y="360" font-size="15" fill="#273b45" text-anchor="end">roof: thinner layer, μ = 0.75</text><text x="360" y="400" font-size="14" fill="#647780" text-anchor="middle">Dividing by μ instead would give 3.20 kN/m², overstating the load</text></g></svg>