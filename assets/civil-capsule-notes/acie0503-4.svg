<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Two deflection limits of IS 456:2000 clause 23.2</title><desc id="desc">Total final deflection is limited to span/250, while the increment after partitions and finishes is limited to the smaller of span/350 and 20 mm.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="80" y1="120" x2="440" y2="120" stroke="#647780" stroke-width="1.5" stroke-dasharray="8 5"/><polygon points="80,125 65,149 95,149" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><line x1="58" y1="152" x2="102" y2="152" stroke="#647780" stroke-width="2"/><polygon points="440,125 425,146 455,146" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><circle cx="432" cy="152" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><circle cx="448" cy="152" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><line x1="418" y1="159" x2="462" y2="159" stroke="#647780" stroke-width="2"/><path d="M80 120 L86 121.6 L92 123.19 L98 124.78 L104 126.35 L110 127.89 L116 129.42 L122 130.91 L128 132.38 L134 133.8 L140 135.19 L146 136.53 L152 137.82 L158 139.06 L164 140.25 L170 141.38 L176 142.44 L182 143.45 L188 144.39 L194 145.27 L200 146.07 L206 146.81 L212 147.47 L218 148.06 L224 148.57 L230 149 L236 149.36 L242 149.64 L248 149.84 L254 149.96 L260 150 L266 149.96 L272 149.84 L278 149.64 L284 149.36 L290 149 L296 148.57 L302 148.06 L308 147.47 L314 146.81 L320 146.07 L326 145.27 L332 144.39 L338 143.45 L344 142.44 L350 141.38 L356 140.25 L362 139.06 L368 137.82 L374 136.53 L380 135.19 L386 133.8 L392 132.38 L398 130.91 L404 129.42 L410 127.89 L416 126.35 L422 124.78 L428 123.19 L434 121.6 L440 120" stroke="#647780" stroke-width="2" fill="none" stroke-dasharray="5 4" stroke-linejoin="round" stroke-linecap="round"/><path d="M80 120 L86 123.84 L92 127.66 L98 131.46 L104 135.23 L110 138.94 L116 142.6 L122 146.19 L128 149.7 L134 153.12 L140 156.44 L146 159.66 L152 162.76 L158 165.74 L164 168.59 L170 171.3 L176 173.87 L182 176.28 L188 178.54 L194 180.64 L200 182.58 L206 184.34 L212 185.93 L218 187.34 L224 188.57 L230 189.61 L236 190.47 L242 191.14 L248 191.62 L254 191.9 L260 192 L266 191.9 L272 191.62 L278 191.14 L284 190.47 L290 189.61 L296 188.57 L302 187.34 L308 185.93 L314 184.34 L320 182.58 L326 180.64 L332 178.54 L338 176.28 L344 173.87 L350 171.3 L356 168.59 L362 165.74 L368 162.76 L374 159.66 L380 156.44 L386 153.12 L392 149.7 L398 146.19 L404 142.6 L410 138.94 L416 135.23 L422 131.46 L428 127.66 L434 123.84 L440 120" stroke="#287aab" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="440" y1="120" x2="488" y2="120" stroke="#647780" stroke-width="1" stroke-dasharray="3 3"/><line x1="260" y1="150" x2="528" y2="150" stroke="#647780" stroke-width="1" stroke-dasharray="3 3"/><line x1="260" y1="192" x2="528" y2="192" stroke="#647780" stroke-width="1" stroke-dasharray="3 3"/><line x1="480" y1="120" x2="480" y2="192" stroke="#647780" stroke-width="1.5"/><line x1="487" y1="120" x2="473" y2="120" stroke="#647780" stroke-width="1.5"/><line x1="487" y1="192" x2="473" y2="192" stroke="#647780" stroke-width="1.5"/><line x1="520" y1="150" x2="520" y2="192" stroke="#647780" stroke-width="1.5"/><line x1="527" y1="150" x2="513" y2="150" stroke="#647780" stroke-width="1.5"/><line x1="527" y1="192" x2="513" y2="192" stroke="#647780" stroke-width="1.5"/><text x="492" y="110" font-size="15" fill="#287aab" text-anchor="start">total final ≤ span/250</text><text x="532" y="170" font-size="14" fill="#273b45" text-anchor="start">increment after finishes</text><text x="532" y="188" font-size="14" fill="#273b45" text-anchor="start">≤ span/350 and ≤ 20 mm</text><text x="260" y="142" font-size="13" fill="#647780" text-anchor="middle">at finishes</text><text x="260" y="214" font-size="13" fill="#287aab" text-anchor="middle">final</text><text x="360" y="290" font-size="16" fill="#273b45" text-anchor="middle">6.0 m beam, total: 6000/250 = 24 mm</text><text x="360" y="320" font-size="16" fill="#273b45" text-anchor="middle">9 m beam, after finishes: 9000/350 = 25.71 mm, so 20 mm governs</text><text x="360" y="360" font-size="14" fill="#647780" text-anchor="middle">The two limits answer different questions and are not interchangeable</text></g></svg>