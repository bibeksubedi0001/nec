</text><text x="430" y="300" font-size="13" fill="#273b45" text-anchor="middle">10</text><text x="500" y="300" font-size="13" fill="#273b45" text-anchor="middle">12</text><text x="570" y="300" font-size="13" fill="#273b45" text-anchor="middle">14</text><text x="640" y="300" font-size="13" fill="#273b45" text-anchor="middle">16</text><line x1="150" y1="280" x2="150" y2="256" stroke="#2b7b61" stroke-width="1.5" stroke-dasharray="5 4"/><text x="144" y="250" font-size="14" fill="#2b7b61" text-anchor="end">to = 2</text><line x1="255" y1="280" x2="255" y2="106" stroke="#273b45" stroke-width="1.5" stroke-dasharray="5 4"/><text x="249" y="100" font-size="14" fill="#273b45" text-anchor="end">tm = 5</text><line x1="290" y1="280" x2="290" y2="76" stroke="#b64f4f" stroke-width="1.5" stroke-dasharray="5 4"/><text x="296" y="70" font-size="14" fill="#b64f4f" text-anchor="start">te = 6</text><line x1="570" y1="280" x2="570" y2="256" stroke="#b98232" stroke-width="1.5" stroke-dasharray="5 4"/><text x="576" y="250" font-size="14" fill="#b98232" text-anchor="start">tp = 14</text><text x="360" y="340" font-size="15" fill="#273b45" text-anchor="middle">te = (to + 4tm + tp)/6 = (2 + 20 + 14)/6 = 6 days</text><text x="360" y="364" font-size="14" fill="#273b45" text-anchor="middle">σ = √σ²: a variance of 16 days² gives σ = 4 days</text><text x="360" y="388" font-size="13" fill="#647780" text-anchor="middle">Beta-type for one activity; a normal approximation applies to a path total</text></g></svg>