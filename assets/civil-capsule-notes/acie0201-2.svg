<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Size names and the 75 micrometre sieve</title><desc id="desc">On an IS-style size scale the 0.075 mm sieve separates fines from the coarse fraction; a 0.06 mm grain is silt-sized, but its behaviour needs plasticity tests.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><rect x="60" y="160" width="71.1" height="56" fill="#f2dfdf" stroke="#b64f4f" stroke-width="1.5"/><text x="95.55" y="195" font-size="18" fill="#273b45" text-anchor="middle">Clay</text><rect x="131.1" y="160" width="185.89" height="56" fill="#f5ead8" stroke="#b98232" stroke-width="1.5"/><text x="224.05" y="195" font-size="18" fill="#273b45" text-anchor="middle">Silt</text><rect x="316.99" y="160" width="212.77" height="56" fill="#f0e6d4" stroke="#b98232" stroke-width="1.5"/><text x="423.38" y="195" font-size="18" fill="#273b45" text-anchor="middle">Sand</text><rect x="529.77" y="160" width="130.08" height="56" fill="#d6dfe3" stroke="#647780" stroke-width="1.5"/><text x="594.81" y="195" font-size="18" fill="#273b45" text-anchor="middle">Gravel</text><line x1="131.1" y1="216" x2="131.1" y2="232" stroke="#273b45" stroke-width="2"/><text x="131.1" y="252" font-size="15" fill="#273b45" text-anchor="middle">0.002 mm</text><line x1="316.99" y1="216" x2="316.99" y2="232" stroke="#273b45" stroke-width="2"/><text x="316.99" y="252" font-size="15" fill="#287aab" text-anchor="middle">0.075 mm</text><line x1="529.77" y1="216" x2="529.77" y2="232" stroke="#273b45" stroke-width="2"/><text x="529.77" y="252" font-size="15" fill="#273b45" text-anchor="middle">4.75 mm</text><line x1="316.99" y1="110" x2="316.99" y2="232" stroke="#287aab" stroke-width="3"/><line x1="64" y1="128" x2="310.99" y2="128" stroke="#647780" stroke-width="1.5"/><text x="190.5" y="116" font-size="16" fill="#647780" text-anchor="middle">Fines: pass 75 µm</text><line x1="322.99" y1="128" x2="656" y2="128" stroke="#647780" stroke-width="1.5"/><text x="486.5" y="116" font-size="16" fill="#647780" text-anchor="middle">Coarse fraction: retained</text><circle cx="305.55" cy="204" r="4" fill="#273b45" stroke="#273b45" stroke-width="2"/><line x1="305.55" y1="208" x2="230.55" y2="290" stroke="#647780" stroke-width="1.2"/><text x="226.55" y="306" font-size="15" fill="#273b45" text-anchor="end">0.06 mm grain: silt-sized</text><text x="360" y="350" font-size="16" fill="#273b45" text-anchor="middle">USCS: more than half passing 75 µm means fine-grained</text><text x="360" y="378" font-size="15" fill="#647780" text-anchor="middle">A size name does not fix the behaviour symbol</text><text x="360" y="60" font-size="16" fill="#647780" text-anchor="middle">Particle size, logarithmic scale</text></g></svg>