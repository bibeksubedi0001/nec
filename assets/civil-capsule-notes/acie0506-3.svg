<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Effective thickness of a tied cavity wall</title><desc id="desc">In the exercise model the effective thickness is the larger of the stronger leaf and two-thirds of both leaves combined; the cavity itself is not added.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><rect x="120" y="110" width="150" height="200" fill="#e4e8e9" stroke="#273b45" stroke-width="2"/><rect x="330" y="110" width="100" height="200" fill="#e4e8e9" stroke="#273b45" stroke-width="2"/><line x1="120" y1="140" x2="270" y2="140" stroke="#647780" stroke-width="1"/><line x1="120" y1="170" x2="270" y2="170" stroke="#647780" stroke-width="1"/><line x1="120" y1="200" x2="270" y2="200" stroke="#647780" stroke-width="1"/><line x1="120" y1="230" x2="270" y2="230" stroke="#647780" stroke-width="1"/><line x1="120" y1="260" x2="270" y2="260" stroke="#647780" stroke-width="1"/><line x1="120" y1="290" x2="270" y2="290" stroke="#647780" stroke-width="1"/><line x1="330" y1="125" x2="430" y2="125" stroke="#647780" stroke-width="1"/><line x1="330" y1="155" x2="430" y2="155" stroke="#647780" stroke-width="1"/><line x1="330" y1="185" x2="430" y2="185" stroke="#647780" stroke-width="1"/><line x1="330" y1="215" x2="430" y2="215" stroke="#647780" stroke-width="1"/><line x1="330" y1="245" x2="430" y2="245" stroke="#647780" stroke-width="1"/><line x1="330" y1="275" x2="430" y2="275" stroke="#647780" stroke-width="1"/><line x1="330" y1="305" x2="430" y2="305" stroke="#647780" stroke-width="1"/><path d="M262 150 L285 144 L300 156 L315 144 L338 150" stroke="#466d89" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M262 210 L285 204 L300 216 L315 204 L338 210" stroke="#466d89" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M262 270 L285 264 L300 276 L315 264 L338 270" stroke="#466d89" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="120" y1="330" x2="270" y2="330" stroke="#647780" stroke-width="1.5"/><line x1="120" y1="323" x2="120" y2="337" stroke="#647780" stroke-width="1.5"/><line x1="270" y1="323" x2="270" y2="337" stroke="#647780" stroke-width="1.5"/><text x="195" y="346" font-size="14" fill="#647780" text-anchor="middle">150</text><line x1="270" y1="330" x2="330" y2="330" stroke="#647780" stroke-width="1.5"/><line x1="270" y1="323" x2="270" y2="337" stroke="#647780" stroke-width="1.5"/><line x1="330" y1="323" x2="330" y2="337" stroke="#647780" stroke-width="1.5"/><text x="300" y="346" font-size="13" fill="#647780" text-anchor="middle">cavity</text><line x1="330" y1="330" x2="430" y2="330" stroke="#647780" stroke-width="1.5"/><line x1="330" y1="323" x2="330" y2="337" stroke="#647780" stroke-width="1.5"/><line x1="430" y1="323" x2="430" y2="337" stroke="#647780" stroke-width="1.5"/><text x="380" y="346" font-size="14" fill="#647780" text-anchor="middle">100</text><text x="300" y="96" font-size="14" fill="#466d89" text-anchor="middle">ties</text><text x="470" y="150" font-size="16" fill="#273b45" text-anchor="start">teff = max(ts, 2/3 (t1 + t2))</text><text x="470" y="186" font-size="15" fill="#273b45" text-anchor="start">2/3 × (150 + 100) = 166.7 mm</text><text x="470" y="212" font-size="15" fill="#2b7b61" text-anchor="start">&gt; 150 mm, so 166.7 mm</text><text x="470" y="256" font-size="14" fill="#b64f4f" text-anchor="start">The cavity width is not added</text><text x="360" y="392" font-size="14" fill="#647780" text-anchor="middle">An exercise model: the governing standard and ties decide the real rule</text></g></svg>