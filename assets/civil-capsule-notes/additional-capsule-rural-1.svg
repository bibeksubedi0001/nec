<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Farmstead zoning</title><desc id="desc">A farmstead layout separates the home's food preparation and sanitation from animal areas and from the storage and mixing of pesticides and other farm chemicals.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><text x="360" y="40" font-size="16" fill="#273b45" text-anchor="middle">Separate home, animals and farm chemicals</text><rect x="40" y="60" width="640" height="280" rx="10" fill="#deeee6" stroke="#2b7b61" stroke-width="1.5" opacity="0.6"/><rect x="70" y="90" width="200" height="120" fill="#ffffff" stroke="#273b45" stroke-width="2"/><line x1="170" y1="90" x2="170" y2="210" stroke="#273b45" stroke-width="1.5"/><text x="120" y="145" font-size="14" fill="#273b45" text-anchor="middle">kitchen</text><text x="220" y="145" font-size="14" fill="#273b45" text-anchor="middle">bathroom</text><text x="170" y="232" font-size="15" fill="#273b45" text-anchor="middle">home</text><rect x="420" y="90" width="230" height="110" fill="#f0e6d4" stroke="#b98232" stroke-width="2"/><text x="535" y="150" font-size="15" fill="#b98232" text-anchor="middle">animal shed</text><rect x="500" y="250" width="140" height="60" fill="#f2dfdf" stroke="#b64f4f" stroke-width="2"/><text x="570" y="285" font-size="14" fill="#b64f4f" text-anchor="middle">chemical store</text><circle cx="200" cy="285" r="26" fill="#d8edf7" stroke="#287aab" stroke-width="2"/><text x="200" y="330" font-size="13" fill="#287aab" text-anchor="middle">water tank</text><line x1="284.8" y1="150" x2="405.2" y2="150" stroke="#647780" stroke-width="2.5"/><polygon points="414,150 403,154.5 403,145.5" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><polygon points="276,150 287,145.5 287,154.5" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><text x="345" y="138" font-size="13" fill="#273b45" text-anchor="middle">separate</text><line x1="240.8" y1="284.9" x2="485.2" y2="282.1" stroke="#b64f4f" stroke-width="2" stroke-dasharray="6 4"/><polygon points="494,282 483.05,286.63 482.95,277.63" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><polygon points="232,285 242.95,280.37 243.05,289.37" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="363" y="274" font-size="13" fill="#b64f4f" text-anchor="middle">keep chemicals away</text><text x="360" y="366" font-size="13" fill="#273b45" text-anchor="middle">Avoid shared food and chemical shelving, a common animal-wash and cooking area,</text><text x="360" y="388" font-size="13" fill="#273b45" text-anchor="middle">or mixing chemicals above the household water tank</text></g></svg>