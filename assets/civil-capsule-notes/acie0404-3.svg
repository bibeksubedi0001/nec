<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">A three-hinged arch under uniform heating</title><desc id="desc">The determinate three-hinged arch accommodates a uniform temperature change by small hinge rotations, so first-order analysis adds no thermal stress.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><path d="M120 320 L128 307.15 L136 294.74 L144 282.76 L152 271.22 L160 260.11 L168 249.44 L176 239.2 L184 229.4 L192 220.04 L200 211.11 L208 202.62 L216 194.56 L224 186.94 L232 179.75 L240 173 L248 166.68 L256 160.8 L264 155.36 L272 150.35 L280 145.78 L288 141.64 L296 137.94 L304 134.67 L312 131.84 L320 129.44 L328 127.48 L336 125.96 L344 124.87 L352 124.22 L360 124 L368 124.22 L376 124.87 L384 125.96 L392 127.48 L400 129.44 L408 131.84 L416 134.67 L424 137.94 L432 141.64 L440 145.78 L448 150.35 L456 155.36 L464 160.8 L472 166.68 L480 173 L488 179.75 L496 186.94 L504 194.56 L512 202.62 L520 211.11 L528 220.04 L536 229.4 L544 239.2 L552 249.44 L560 260.11 L568 271.22 L576 282.76 L584 294.74 L592 307.15 L600 320" stroke="#b64f4f" stroke-width="2" fill="none" stroke-dasharray="8 5" stroke-linejoin="round" stroke-linecap="round"/><path d="M120 320 L128 308.2 L136 296.8 L144 285.8 L152 275.2 L160 265 L168 255.2 L176 245.8 L184 236.8 L192 228.2 L200 220 L208 212.2 L216 204.8 L224 197.8 L232 191.2 L240 185 L248 179.2 L256 173.8 L264 168.8 L272 164.2 L280 160 L288 156.2 L296 152.8 L304 149.8 L312 147.2 L320 145 L328 143.2 L336 141.8 L344 140.8 L352 140.2 L360 140 L368 140.2 L376 140.8 L384 141.8 L392 143.2 L400 145 L408 147.2 L416 149.8 L424 152.8 L432 156.2 L440 160 L448 164.2 L456 168.8 L464 173.8 L472 179.2 L480 185 L488 191.2 L496 197.8 L504 204.8 L512 212.2 L520 220 L528 228.2 L536 236.8 L544 245.8 L552 255.2 L560 265 L568 275.2 L576 285.8 L584 296.8 L592 308.2 L600 320" stroke="#273b45" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="120" cy="320" r="7" fill="#ffffff" stroke="#273b45" stroke-width="2"/><circle cx="600" cy="320" r="7" fill="#ffffff" stroke="#273b45" stroke-width="2"/><circle cx="360" cy="140" r="7" fill="#ffffff" stroke="#273b45" stroke-width="2"/><circle cx="360" cy="124" r="6" fill="#ffffff" stroke="#b64f4f" stroke-width="1.5"/><polygon points="120,327 105,351 135,351" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><line x1="98" y1="354" x2="142" y2="354" stroke="#647780" stroke-width="2"/><polygon points="600,327 585,351 615,351" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><line x1="578" y1="354" x2="622" y2="354" stroke="#647780" stroke-width="2"/><line x1="390" y1="138" x2="390" y2="121.6" stroke="#b64f4f" stroke-width="2"/><polygon points="390,116 393,123 387,123" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="400" y="116" font-size="14" fill="#b64f4f" text-anchor="start">crown lifts slightly</text><text x="360" y="250" font-size="16" fill="#273b45" text-anchor="middle">hinges rotate freely: no thermal stress</text><text x="360" y="60" font-size="16" fill="#b64f4f" text-anchor="middle">Uniform temperature rise ΔT</text><text x="360" y="390" font-size="15" fill="#647780" text-anchor="middle">A two-hinged arch, being indeterminate, does develop a thermal thrust</text></g></svg>