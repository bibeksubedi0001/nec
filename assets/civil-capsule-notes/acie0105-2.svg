<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Double reflection in an optical square</title><desc id="desc">Two plane mirrors at 45 degrees deviate the ray from rod A through 90 degrees, so its image lines up with rod B seen directly: the deviation is twice the mirror angle.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="60" y1="230" x2="60" y2="290" stroke="#b64f4f" stroke-width="4"/><text x="60" y="316" font-size="16" fill="#b64f4f" text-anchor="middle">Rod A</text><line x1="66" y1="260" x2="309.2" y2="260" stroke="#287aab" stroke-width="2.5"/><polygon points="318,260 307,264.5 307,255.5" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><line x1="277.5" y1="277.6" x2="362.5" y2="242.4" stroke="#466d89" stroke-width="6" stroke-linecap="round"/><line x1="402.4" y1="202.5" x2="437.6" y2="117.5" stroke="#466d89" stroke-width="6" stroke-linecap="round"/><line x1="322" y1="258" x2="411.78" y2="168.22" stroke="#287aab" stroke-width="2.5"/><polygon points="418,162 413.4,172.96 407.04,166.6" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><line x1="420" y1="158" x2="420" y2="72.8" stroke="#287aab" stroke-width="2.5"/><polygon points="420,64 424.5,75 415.5,75" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><text x="436" y="70" font-size="16" fill="#273b45" text-anchor="start">To the observer</text><line x1="420" y1="170" x2="420" y2="350" stroke="#647780" stroke-width="1.5" stroke-dasharray="5 5"/><line x1="420" y1="350" x2="420" y2="398" stroke="#2b7b61" stroke-width="4"/><text x="434" y="390" font-size="16" fill="#2b7b61" text-anchor="start">Rod B, seen directly</text><text x="250" y="300" font-size="16" fill="#466d89" text-anchor="middle">Mirror 1</text><text x="476" y="196" font-size="16" fill="#466d89" text-anchor="start">Mirror 2</text><text x="520" y="280" font-size="20" fill="#273b45" text-anchor="middle">δ = 2θ</text><text x="520" y="308" font-size="17" fill="#647780" text-anchor="middle">θ = 45°, δ = 90°</text></g></svg>