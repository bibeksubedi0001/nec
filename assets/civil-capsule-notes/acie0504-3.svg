<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Superposing prestress and load stresses</title><desc id="desc">An eccentric prestress stores compression, strongest at the bottom; load stresses then cancel part of it, so the section can stay entirely in compression.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><rect x="120" y="40" width="480" height="40" fill="#e4e8e9" stroke="#273b45" stroke-width="2"/><line x1="126" y1="70" x2="594" y2="70" stroke="#b64f4f" stroke-width="2" stroke-dasharray="8 5"/><line x1="80" y1="70" x2="109.2" y2="70" stroke="#b64f4f" stroke-width="2.5"/><polygon points="118,70 107,74.5 107,65.5" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><line x1="640" y1="70" x2="610.8" y2="70" stroke="#b64f4f" stroke-width="2.5"/><polygon points="602,70 613,65.5 613,74.5" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="360" y="100" font-size="13" fill="#b64f4f" text-anchor="middle">eccentric tendon, force P</text><line x1="120" y1="130" x2="120" y2="290" stroke="#273b45" stroke-width="2"/><polygon points="120,130 80,130 80,290 120,290" fill="#f2dfdf" stroke="#273b45" stroke-width="1.5" stroke-linejoin="round"/><text x="120" y="316" font-size="14" fill="#273b45" text-anchor="middle">P/A</text><line x1="280" y1="130" x2="280" y2="290" stroke="#273b45" stroke-width="2"/><polygon points="280,130 312,130 248,290 280,290" fill="#d6dfe3" stroke="#273b45" stroke-width="1.5" stroke-linejoin="round"/><text x="280" y="316" font-size="14" fill="#273b45" text-anchor="middle">P e / Z</text><line x1="440" y1="130" x2="440" y2="290" stroke="#273b45" stroke-width="2"/><polygon points="440,130 384,130 496,290 440,290" fill="#d6dfe3" stroke="#273b45" stroke-width="1.5" stroke-linejoin="round"/><text x="440" y="316" font-size="14" fill="#273b45" text-anchor="middle">M / Z, loads</text><line x1="610" y1="130" x2="610" y2="290" stroke="#273b45" stroke-width="2"/><polygon points="610,130 546,130 594,290 610,290" fill="#f2dfdf" stroke="#273b45" stroke-width="1.5" stroke-linejoin="round"/><text x="610" y="316" font-size="14" fill="#273b45" text-anchor="middle">final</text><text x="200" y="214" font-size="24" fill="#273b45" text-anchor="middle">+</text><text x="360" y="214" font-size="24" fill="#273b45" text-anchor="middle">+</text><text x="525" y="214" font-size="24" fill="#273b45" text-anchor="middle">=</text><text x="610" y="340" font-size="14" fill="#b64f4f" text-anchor="middle">all compression</text><text x="360" y="372" font-size="14" fill="#647780" text-anchor="middle">Compression plotted left; later loads must cancel it before tension appears</text><text x="360" y="398" font-size="15" fill="#273b45" text-anchor="middle">IS 1343: minimum M40 pre-tensioned, M30 post-tensioned</text></g></svg>