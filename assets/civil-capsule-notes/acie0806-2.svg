<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Efficiency boundaries from water to shaft</title><desc id="desc">With 1000 kW supplied, 900 kW reaching the runner and 855 kW at the shaft, hydraulic efficiency is 90 percent, mechanical 95 percent and overall 85.5 percent. Unit power 800/16^(3/2) = 12.5 kW.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><text x="360" y="50" font-size="16" fill="#273b45" text-anchor="middle">Efficiencies must name their boundaries</text><rect x="60" y="100" width="140" height="150" rx="8" fill="#e6f1f8" stroke="#287aab" stroke-width="2"/><text x="130" y="171" font-size="16" fill="#273b45" text-anchor="middle"><tspan x="130" dy="0">water power</tspan><tspan x="130" dy="19.52">1000 kW</tspan></text><rect x="290" y="107" width="140" height="135" rx="8" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><text x="360" y="170.5" font-size="16" fill="#273b45" text-anchor="middle"><tspan x="360" dy="0">runner</tspan><tspan x="360" dy="19.52">900 kW</tspan></text><rect x="520" y="111" width="140" height="128" rx="8" fill="#f5ead8" stroke="#b98232" stroke-width="2"/><text x="590" y="171" font-size="16" fill="#273b45" text-anchor="middle"><tspan x="590" dy="0">shaft</tspan><tspan x="590" dy="19.52">855 kW</tspan></text><line x1="204" y1="175" x2="277.2" y2="175" stroke="#647780" stroke-width="3"/><polygon points="286,175 275,179.5 275,170.5" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><text x="245" y="162" font-size="15" fill="#2b7b61" text-anchor="middle">ηh = 90%</text><line x1="434" y1="175" x2="507.2" y2="175" stroke="#647780" stroke-width="3"/><polygon points="516,175 505,179.5 505,170.5" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><text x="475" y="162" font-size="15" fill="#b98232" text-anchor="middle">ηm = 95%</text><line x1="245" y1="182" x2="245" y2="239.6" stroke="#b64f4f" stroke-width="2"/><polygon points="245,246 241.5,238 248.5,238" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="245" y="266" font-size="13" fill="#b64f4f" text-anchor="middle">100 kW loss</text><line x1="475" y1="182" x2="475" y2="239.6" stroke="#b64f4f" stroke-width="2"/><polygon points="475,246 471.5,238 478.5,238" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="475" y="266" font-size="13" fill="#b64f4f" text-anchor="middle">45 kW loss</text><text x="360" y="300" font-size="16" fill="#2b7b61" text-anchor="middle">ηo = ηh ηm = 0.90 × 0.95 = 85.5%</text><text x="360" y="334" font-size="14" fill="#273b45" text-anchor="middle">1 m³/s through 1 m: ρgQH = 9.81 kW of hydraulic power</text><text x="360" y="358" font-size="14" fill="#273b45" text-anchor="middle">Unit power Pu = P / H^(3/2) = 800/64 = 12.5 kW at 1 m head</text><text x="360" y="382" font-size="13" fill="#647780" text-anchor="middle">Unit power is not universally 9.81 kW</text></g></svg>