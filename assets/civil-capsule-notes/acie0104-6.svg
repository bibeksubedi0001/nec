<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Radius of gyration</title><desc id="desc">k is the distance at which the whole area, concentrated in a thin strip, would give the same second moment about the stated axis: I = Ak².</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><rect x="110" y="120" width="160" height="200" fill="#e6f1f8" stroke="#287aab" stroke-width="2"/><line x1="70" y1="220" x2="310" y2="220" stroke="#273b45" stroke-width="2" stroke-dasharray="9 6"/><text x="190" y="350" font-size="17" fill="#273b45" text-anchor="middle">Actual area A</text><text x="360" y="206" font-size="17" fill="#2b7b61" text-anchor="middle">same I</text><line x1="338.8" y1="222" x2="383.2" y2="222" stroke="#2b7b61" stroke-width="2.5"/><polygon points="392,222 381,226.5 381,217.5" fill="#2b7b61" stroke="#2b7b61" stroke-width="1.5" stroke-linejoin="round"/><polygon points="330,222 341,217.5 341,226.5" fill="#2b7b61" stroke="#2b7b61" stroke-width="1.5" stroke-linejoin="round"/><line x1="420" y1="220" x2="670" y2="220" stroke="#273b45" stroke-width="2" stroke-dasharray="9 6"/><rect x="460" y="157" width="160" height="10" fill="#287aab" stroke="#287aab" stroke-width="1"/><line x1="644" y1="220" x2="644" y2="162" stroke="#647780" stroke-width="1.5"/><line x1="637" y1="220" x2="651" y2="220" stroke="#647780" stroke-width="1.5"/><line x1="637" y1="162" x2="651" y2="162" stroke="#647780" stroke-width="1.5"/><text x="656" y="197" font-size="18" fill="#647780" text-anchor="start">k</text><text x="540" y="142" font-size="16" fill="#273b45" text-anchor="middle">Area A in a thin strip</text><text x="360" y="392" font-size="20" fill="#273b45" text-anchor="middle">I = A k², so k = √(I / A)</text></g></svg>