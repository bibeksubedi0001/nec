<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Overhead clearance and the catch drain</title><desc id="desc">Under NRS 2070 section 11.9.3 the vertical clearance under an overhang is a minimum 5.0 m measured from the crown over the whole roadway width. A catch drain above the cutting intercepts uphill runoff.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><polygon points="20,60 330,60 330,110 196,110 196,284 20,284" fill="#f0e6d4" stroke="#273b45" stroke-width="1.5" stroke-linejoin="round"/><polygon points="196,284 338,272 480,284 700,350 700,360 196,360" fill="#f0e6d4" stroke="none" stroke-width="2" stroke-linejoin="round"/><path d="M196 284 L338 272 L480 284 L700 350" stroke="#273b45" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><rect x="200" y="122" width="276" height="150" fill="#e6f1f8" stroke="#287aab" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.8"/><text x="338" y="200" font-size="14" fill="#287aab" text-anchor="middle">clearance envelope, full width</text><line x1="520" y1="272" x2="520" y2="122" stroke="#647780" stroke-width="1.5"/><line x1="513" y1="272" x2="527" y2="272" stroke="#647780" stroke-width="1.5"/><line x1="513" y1="122" x2="527" y2="122" stroke="#647780" stroke-width="1.5"/><text x="534" y="203" font-size="14" fill="#647780" text-anchor="start">min 5.0 m from crown</text><text x="265" y="90" font-size="13" fill="#273b45" text-anchor="middle">overhanging rock</text><line x1="40" y1="52" x2="247.2" y2="52" stroke="#287aab" stroke-width="2" stroke-dasharray="5 4"/><polygon points="256,52 245,56.5 245,47.5" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><path d="M262 60 L270 70 L278 60" stroke="#287aab" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="150" y="40" font-size="13" fill="#287aab" text-anchor="middle">catch drain intercepts uphill runoff</text><path d="M198 286 L204 294 L212 285" stroke="#287aab" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="206" y="312" font-size="13" fill="#273b45" text-anchor="start">side gutter</text><text x="360" y="386" font-size="13" fill="#273b45" text-anchor="middle">Catch drain above the cut; side gutter at road level; a culvert crosses beneath</text><text x="360" y="408" font-size="13" fill="#647780" text-anchor="middle">5.0 m is a minimum over the full width; 4.75 m is the design-vehicle height</text></g></svg>