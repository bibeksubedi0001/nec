<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Dewatering conserves the dry solids</title><desc id="desc">Dewatering 1000 kg of sludge from 95 to 90 percent water keeps the 50 kg of dry solids, so the wet mass halves to 500 kg; the volume halves only if bulk density is unchanged.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><text x="220" y="40" font-size="15" fill="#273b45" text-anchor="middle">1000 kg at 95% water</text><rect x="160" y="50" width="120" height="237.5" fill="#d8edf7" stroke="#273b45" stroke-width="2"/><rect x="160" y="287.5" width="120" height="12.5" fill="#b98232" stroke="#273b45" stroke-width="2"/><text x="220" y="175" font-size="15" fill="#287aab" text-anchor="middle">water 950 kg</text><text x="290" y="298" font-size="14" fill="#b98232" text-anchor="start">50 kg solids</text><text x="500" y="165" font-size="15" fill="#273b45" text-anchor="middle">500 kg at 90% water</text><rect x="440" y="175" width="120" height="112.5" fill="#d8edf7" stroke="#273b45" stroke-width="2"/><rect x="440" y="287.5" width="120" height="12.5" fill="#b98232" stroke="#273b45" stroke-width="2"/><text x="500" y="236" font-size="15" fill="#287aab" text-anchor="middle">water 450 kg</text><text x="570" y="298" font-size="14" fill="#b98232" text-anchor="start">50 kg solids</text><line x1="290" y1="200" x2="421.2" y2="200" stroke="#647780" stroke-width="3"/><polygon points="430,200 419,204.5 419,195.5" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><text x="360" y="190" font-size="15" fill="#273b45" text-anchor="middle">dewater</text><text x="360" y="226" font-size="14" fill="#647780" text-anchor="middle">500 kg water removed</text><text x="360" y="336" font-size="15" fill="#273b45" text-anchor="middle">M2 = M1 (1 − w1)/(1 − w2) = 1000 × 0.05 / 0.10 = 500 kg</text><text x="360" y="362" font-size="14" fill="#273b45" text-anchor="middle">Volume falls 50% only if bulk density is unchanged</text><text x="360" y="388" font-size="14" fill="#647780" text-anchor="middle">Ignition: 1.00 g dry → 0.35 g left: 35% fixed, 65% volatile</text></g></svg>