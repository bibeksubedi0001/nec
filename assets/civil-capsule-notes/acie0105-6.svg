<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Stadia intercept and subtense bar</title><desc id="desc">With a level sight the stadia intercept s gives D = Ks + C; a subtense bar of length b subtending angle α gives D = (b/2) / tan(α/2).</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="390" y1="40" x2="390" y2="396" stroke="#b8c8ce" stroke-width="1.5" stroke-dasharray="6 6"/><rect x="56" y="222" width="26" height="16" fill="#466d89" stroke="#466d89" stroke-width="2"/><line x1="69" y1="238" x2="50" y2="330" stroke="#647780" stroke-width="2"/><line x1="69" y1="238" x2="88" y2="330" stroke="#647780" stroke-width="2"/><line x1="330" y1="110" x2="330" y2="330" stroke="#b98232" stroke-width="5"/><line x1="82" y1="226" x2="328" y2="150" stroke="#287aab" stroke-width="2"/><line x1="82" y1="234" x2="328" y2="270" stroke="#287aab" stroke-width="2"/><line x1="82" y1="230" x2="328" y2="210" stroke="#647780" stroke-width="1.2" stroke-dasharray="5 5"/><line x1="350" y1="150" x2="350" y2="270" stroke="#647780" stroke-width="1.5"/><line x1="357" y1="150" x2="343" y2="150" stroke="#647780" stroke-width="1.5"/><line x1="357" y1="270" x2="343" y2="270" stroke="#647780" stroke-width="1.5"/><text x="360" y="216" font-size="18" fill="#647780" text-anchor="start">s</text><line x1="69" y1="352" x2="330" y2="352" stroke="#647780" stroke-width="1.5"/><line x1="69" y1="345" x2="69" y2="359" stroke="#647780" stroke-width="1.5"/><line x1="330" y1="345" x2="330" y2="359" stroke="#647780" stroke-width="1.5"/><text x="199.5" y="370" font-size="18" fill="#647780" text-anchor="middle">D</text><text x="200" y="400" font-size="18" fill="#273b45" text-anchor="middle">D = Ks + C</text><rect x="416" y="222" width="24" height="16" fill="#466d89" stroke="#466d89" stroke-width="2"/><line x1="680" y1="160" x2="680" y2="300" stroke="#b64f4f" stroke-width="6" stroke-linecap="round"/><text x="694" y="236" font-size="18" fill="#b64f4f" text-anchor="start">b</text><line x1="440" y1="230" x2="678" y2="162" stroke="#287aab" stroke-width="2"/><line x1="440" y1="230" x2="678" y2="298" stroke="#287aab" stroke-width="2"/><line x1="440" y1="230" x2="680" y2="230" stroke="#647780" stroke-width="1.2" stroke-dasharray="5 5"/><path d="M526.51 205.19 A90 90 0 0 1 526.51 254.81" stroke="#2b7b61" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="548" y="222" font-size="18" fill="#2b7b61" text-anchor="start">α</text><line x1="440" y1="330" x2="680" y2="330" stroke="#647780" stroke-width="1.5"/><line x1="440" y1="323" x2="440" y2="337" stroke="#647780" stroke-width="1.5"/><line x1="680" y1="323" x2="680" y2="337" stroke="#647780" stroke-width="1.5"/><text x="560" y="348" font-size="18" fill="#647780" text-anchor="middle">D</text><text x="555" y="400" font-size="18" fill="#273b45" text-anchor="middle">D = (b/2) / tan(α/2)</text></g></svg>