<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Capillary rise against tube size</title><desc id="desc">With the same liquid and wetting, rise varies inversely with tube size, so h d is constant: an 18 mm rise falls to 6 mm when the radius is tripled.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><rect x="60" y="250" width="600" height="100" fill="#d8edf7" stroke="none" stroke-width="2"/><line x1="60" y1="250" x2="660" y2="250" stroke="#287aab" stroke-width="2"/><path d="M60 200 L60 350 L660 350 L660 200" stroke="#273b45" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><rect x="185" y="106" width="10" height="224" fill="#d8edf7" stroke="none" stroke-width="2"/><path d="M185 106 Q190 111 195 106" stroke="#287aab" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="185" y1="70" x2="185" y2="330" stroke="#466d89" stroke-width="3"/><line x1="195" y1="70" x2="195" y2="330" stroke="#466d89" stroke-width="3"/><line x1="211" y1="250" x2="211" y2="106" stroke="#647780" stroke-width="1.5"/><line x1="204" y1="250" x2="218" y2="250" stroke="#647780" stroke-width="1.5"/><line x1="204" y1="106" x2="218" y2="106" stroke="#647780" stroke-width="1.5"/><text x="221" y="184" font-size="16" fill="#647780" text-anchor="start">18 mm</text><text x="190" y="58" font-size="17" fill="#273b45" text-anchor="middle">d</text><rect x="352.5" y="154" width="15" height="176" fill="#d8edf7" stroke="none" stroke-width="2"/><path d="M352.5 154 Q360 161.5 367.5 154" stroke="#287aab" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="352.5" y1="70" x2="352.5" y2="330" stroke="#466d89" stroke-width="3"/><line x1="367.5" y1="70" x2="367.5" y2="330" stroke="#466d89" stroke-width="3"/><line x1="383.5" y1="250" x2="383.5" y2="154" stroke="#647780" stroke-width="1.5"/><line x1="376.5" y1="250" x2="390.5" y2="250" stroke="#647780" stroke-width="1.5"/><line x1="376.5" y1="154" x2="390.5" y2="154" stroke="#647780" stroke-width="1.5"/><text x="393.5" y="208" font-size="16" fill="#647780" text-anchor="start">12 mm</text><text x="360" y="58" font-size="17" fill="#273b45" text-anchor="middle">1.5 d</text><rect x="515" y="202" width="30" height="128" fill="#d8edf7" stroke="none" stroke-width="2"/><path d="M515 202 Q530 217 545 202" stroke="#287aab" stroke-width="1.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="515" y1="70" x2="515" y2="330" stroke="#466d89" stroke-width="3"/><line x1="545" y1="70" x2="545" y2="330" stroke="#466d89" stroke-width="3"/><line x1="561" y1="250" x2="561" y2="202" stroke="#647780" stroke-width="1.5"/><line x1="554" y1="250" x2="568" y2="250" stroke="#647780" stroke-width="1.5"/><line x1="554" y1="202" x2="568" y2="202" stroke="#647780" stroke-width="1.5"/><text x="571" y="232" font-size="16" fill="#647780" text-anchor="start">6 mm</text><text x="530" y="58" font-size="17" fill="#273b45" text-anchor="middle">3 d</text><text x="360" y="392" font-size="16" fill="#273b45" text-anchor="middle">Same liquid and wetting: h ∝ 1 / d, so h × d is constant</text></g></svg>