<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Laboratory CBR apparatus</title><desc id="desc">Under IS 2720 Part 16 the plunger is circular, 50 mm in diameter, driven at 1.25 mm/min into a specimen in a 150 mm mould; CBR compares the test load with the standard load at the same penetration.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><rect x="160" y="150" width="240" height="150" fill="#f0e6d4" stroke="#273b45" stroke-width="3"/><rect x="150" y="300" width="260" height="12" fill="#d6dfe3" stroke="#273b45" stroke-width="1.5"/><rect x="170" y="138" width="60" height="12" fill="#f5ead8" stroke="#b98232" stroke-width="1.5"/><rect x="330" y="138" width="60" height="12" fill="#f5ead8" stroke="#b98232" stroke-width="1.5"/><text x="200" y="128" font-size="13" fill="#b98232" text-anchor="middle">surcharge</text><rect x="240" y="70" width="80" height="95" fill="#466d89" stroke="#273b45" stroke-width="1.5"/><line x1="240" y1="55" x2="320" y2="55" stroke="#647780" stroke-width="1.5"/><line x1="240" y1="48" x2="240" y2="62" stroke="#647780" stroke-width="1.5"/><line x1="320" y1="48" x2="320" y2="62" stroke="#647780" stroke-width="1.5"/><text x="280" y="45" font-size="14" fill="#647780" text-anchor="middle">plunger 50 mm</text><line x1="340" y1="70" x2="340" y2="105.2" stroke="#287aab" stroke-width="2.5"/><polygon points="340,114 335.5,103 344.5,103" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><text x="348" y="96" font-size="14" fill="#287aab" text-anchor="start">1.25 mm/min</text><line x1="160" y1="326" x2="400" y2="326" stroke="#647780" stroke-width="1.5"/><line x1="160" y1="319" x2="160" y2="333" stroke="#647780" stroke-width="1.5"/><line x1="400" y1="319" x2="400" y2="333" stroke="#647780" stroke-width="1.5"/><text x="280" y="352" font-size="14" fill="#647780" text-anchor="middle">mould and specimen 150 mm</text><text x="580" y="120" font-size="16" fill="#273b45" text-anchor="middle">CBR = PT / PS × 100</text><text x="580" y="146" font-size="13" fill="#647780" text-anchor="middle">same penetration, standard load</text><text x="580" y="190" font-size="14" fill="#273b45" text-anchor="middle">heavy compaction (IS 2720 Pt 8):</text><text x="580" y="212" font-size="14" fill="#273b45" text-anchor="middle">4.9 kg rammer, 450 mm drop</text><text x="580" y="256" font-size="13" fill="#b64f4f" text-anchor="middle">misread per second:</text><text x="580" y="276" font-size="13" fill="#b64f4f" text-anchor="middle">1.25 × 60 = 75 mm/min, a different test</text><text x="360" y="396" font-size="13" fill="#647780" text-anchor="middle">IS 2720 Part 16:1987; the preparation method fixes the rammer, not the CBR test</text></g></svg>