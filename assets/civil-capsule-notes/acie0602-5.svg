<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Loop energy balance and a Hardy Cross correction</title><desc id="desc">Signed head drops around a closed loop sum to zero, so +8 m and +5 m need -13 m on the third side. For two identical parallel pipes with trial flows 6 and 4, the correction -1 gives 5 and 5.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><text x="190" y="50" font-size="16" fill="#273b45" text-anchor="middle">Loop energy balance: Σh = 0</text><polygon points="90,300 190,110 290,300" fill="none" stroke="#466d89" stroke-width="4" stroke-linejoin="round"/><text x="128" y="210" font-size="16" fill="#287aab" text-anchor="end">+8 m</text><text x="252" y="210" font-size="16" fill="#287aab" text-anchor="start">+5 m</text><text x="190" y="328" font-size="16" fill="#b64f4f" text-anchor="middle">x = −13 m</text><circle cx="90" cy="300" r="12" fill="#ffffff" stroke="#273b45" stroke-width="2"/><text x="90" y="305" font-size="14" fill="#273b45" text-anchor="middle">A</text><circle cx="290" cy="300" r="12" fill="#ffffff" stroke="#273b45" stroke-width="2"/><text x="290" y="305" font-size="14" fill="#273b45" text-anchor="middle">B</text><circle cx="190" cy="110" r="12" fill="#ffffff" stroke="#273b45" stroke-width="2"/><text x="190" y="115" font-size="14" fill="#273b45" text-anchor="middle">C</text><path d="M167.48 253 A26 26 0 1 1 212.52 253" stroke="#2b7b61" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="212.52,253 214.12,241.22 221.91,245.72" fill="#2b7b61" stroke="#2b7b61" stroke-width="1.5" stroke-linejoin="round"/><text x="190" y="360" font-size="15" fill="#273b45" text-anchor="middle">8 + 5 + x = 0 → x = −13 m</text><text x="190" y="384" font-size="14" fill="#647780" text-anchor="middle">negative: a head rise along the traversal</text><line x1="370" y1="20" x2="370" y2="390" stroke="#b8c8ce" stroke-width="1.5" stroke-dasharray="6 5"/><text x="545" y="50" font-size="16" fill="#273b45" text-anchor="middle">Hardy Cross on two parallel pipes</text><line x1="395" y1="220" x2="423.2" y2="220" stroke="#647780" stroke-width="2.5"/><polygon points="432,220 421,224.5 421,215.5" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><text x="405" y="208" font-size="14" fill="#273b45" text-anchor="middle">10</text><line x1="658" y1="220" x2="691.2" y2="220" stroke="#647780" stroke-width="2.5"/><polygon points="700,220 689,224.5 689,215.5" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><text x="688" y="208" font-size="14" fill="#273b45" text-anchor="middle">10</text><path d="M440 220 Q545 110 650 220" stroke="#466d89" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M440 220 Q545 330 650 220" stroke="#466d89" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="552,165 541,169.5 541,160.5" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><polygon points="552,275 541,279.5 541,270.5" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><text x="545" y="150" font-size="15" fill="#287aab" text-anchor="middle">trial 6 → 5</text><text x="545" y="300" font-size="15" fill="#287aab" text-anchor="middle">trial 4 → 5</text><circle cx="440" cy="220" r="7" fill="#ffffff" stroke="#273b45" stroke-width="2"/><circle cx="650" cy="220" r="7" fill="#ffffff" stroke="#273b45" stroke-width="2"/><path d="M524.22 232 A24 24 0 1 1 565.78 232" stroke="#2b7b61" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="565.78,232 567.39,220.22 575.18,224.72" fill="#2b7b61" stroke="#2b7b61" stroke-width="1.5" stroke-linejoin="round"/><text x="545" y="336" font-size="14" fill="#273b45" text-anchor="middle">clockwise: +6 and −4; Σh = 36 − 16 = 20</text><text x="545" y="360" font-size="14" fill="#273b45" text-anchor="middle">Σ 2|q| = 20, Δq = −20/20 = −1</text><text x="545" y="384" font-size="14" fill="#2b7b61" text-anchor="middle">flows become 5 and 5; total stays 10</text></g></svg>