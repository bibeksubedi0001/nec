<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Peak-hour factor bounds</title><desc id="desc">PHF = V/(4 V15). If all 600 vehicles arrive in one quarter the PHF is 0.25, its minimum for positive traffic; spread evenly at 150 per quarter it is 1. An empty hour gives 0/0, undefined.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><text x="180" y="60" font-size="16" fill="#273b45" text-anchor="middle">All in one quarter</text><line x1="50" y1="280" x2="310" y2="280" stroke="#647780" stroke-width="2"/><rect x="70" y="100" width="44" height="180" fill="#f2dfdf" stroke="#b64f4f" stroke-width="2"/><text x="92" y="92" font-size="13" fill="#273b45" text-anchor="middle">600</text><text x="92" y="298" font-size="13" fill="#273b45" text-anchor="middle">Q1</text><text x="152" y="272" font-size="13" fill="#273b45" text-anchor="middle">0</text><text x="152" y="298" font-size="13" fill="#273b45" text-anchor="middle">Q2</text><text x="212" y="272" font-size="13" fill="#273b45" text-anchor="middle">0</text><text x="212" y="298" font-size="13" fill="#273b45" text-anchor="middle">Q3</text><text x="272" y="272" font-size="13" fill="#273b45" text-anchor="middle">0</text><text x="272" y="298" font-size="13" fill="#273b45" text-anchor="middle">Q4</text><text x="180" y="322" font-size="15" fill="#b64f4f" text-anchor="middle">PHF = 600/(4 × 600) = 0.25</text><text x="540" y="60" font-size="16" fill="#273b45" text-anchor="middle">Evenly spread</text><line x1="410" y1="280" x2="670" y2="280" stroke="#647780" stroke-width="2"/><rect x="430" y="235" width="44" height="45" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><text x="452" y="227" font-size="13" fill="#273b45" text-anchor="middle">150</text><text x="452" y="298" font-size="13" fill="#273b45" text-anchor="middle">Q1</text><rect x="490" y="235" width="44" height="45" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><text x="512" y="227" font-size="13" fill="#273b45" text-anchor="middle">150</text><text x="512" y="298" font-size="13" fill="#273b45" text-anchor="middle">Q2</text><rect x="550" y="235" width="44" height="45" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><text x="572" y="227" font-size="13" fill="#273b45" text-anchor="middle">150</text><text x="572" y="298" font-size="13" fill="#273b45" text-anchor="middle">Q3</text><rect x="610" y="235" width="44" height="45" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><text x="632" y="227" font-size="13" fill="#273b45" text-anchor="middle">150</text><text x="632" y="298" font-size="13" fill="#273b45" text-anchor="middle">Q4</text><text x="540" y="322" font-size="15" fill="#2b7b61" text-anchor="middle">PHF = 600/(4 × 150) = 1.00</text><text x="360" y="360" font-size="14" fill="#273b45" text-anchor="middle">0.25 ≤ PHF ≤ 1 for positive traffic; an empty hour gives 0/0, undefined</text><text x="360" y="384" font-size="13" fill="#647780" text-anchor="middle">A low PHF means sharp peaking: size for the busiest quarter</text></g></svg>