<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Pitot-static tube at one point of a pipe</title><desc id="desc">The nose senses stagnation pressure and the side holes static pressure; their difference gives the local speed at the probe, not the mean velocity.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><rect x="40" y="150" width="640" height="140" fill="#d8edf7" stroke="none" stroke-width="2"/><line x1="40" y1="150" x2="680" y2="150" stroke="#273b45" stroke-width="3"/><line x1="40" y1="290" x2="680" y2="290" stroke="#273b45" stroke-width="3"/><line x1="60" y1="158" x2="118.4" y2="158" stroke="#287aab" stroke-width="1.8"/><polygon points="124.8,158 116.8,161.5 116.8,154.5" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><line x1="60" y1="175" x2="134.99" y2="175" stroke="#287aab" stroke-width="1.8"/><polygon points="141.39,175 133.39,178.5 133.39,171.5" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><line x1="60" y1="195" x2="145.14" y2="195" stroke="#287aab" stroke-width="1.8"/><polygon points="151.54,195 143.54,198.5 143.54,191.5" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><line x1="60" y1="220" x2="153.6" y2="220" stroke="#287aab" stroke-width="1.8"/><polygon points="160,220 152,223.5 152,216.5" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><line x1="60" y1="245" x2="145.14" y2="245" stroke="#287aab" stroke-width="1.8"/><polygon points="151.54,245 143.54,248.5 143.54,241.5" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><line x1="60" y1="265" x2="134.99" y2="265" stroke="#287aab" stroke-width="1.8"/><polygon points="141.39,265 133.39,268.5 133.39,261.5" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><line x1="60" y1="282" x2="118.4" y2="282" stroke="#287aab" stroke-width="1.8"/><polygon points="124.8,282 116.8,285.5 116.8,278.5" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><line x1="60" y1="152" x2="60" y2="288" stroke="#647780" stroke-width="1.2"/><path d="M60 150 L124.8 158 L141.39 175 L151.54 195 L160 220 L151.54 245 L141.39 265 L124.8 282 L60 290" stroke="#287aab" stroke-width="1.5" fill="none" stroke-dasharray="5 4" stroke-linejoin="round" stroke-linecap="round"/><rect x="330" y="195" width="100" height="10" rx="5" fill="#d6dfe3" stroke="#466d89" stroke-width="2"/><rect x="425" y="90" width="10" height="115" fill="#d6dfe3" stroke="#466d89" stroke-width="2"/><circle cx="372" cy="195" r="2" fill="#273b45" stroke="#273b45" stroke-width="1"/><circle cx="390" cy="195" r="2" fill="#273b45" stroke="#273b45" stroke-width="1"/><text x="322" y="186" font-size="15" fill="#b64f4f" text-anchor="end">stagnation at the nose</text><circle cx="332" cy="200" r="4" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><text x="381" y="226" font-size="15" fill="#273b45" text-anchor="middle">static holes</text><text x="446" y="94" font-size="15" fill="#273b45" text-anchor="start">to a differential gauge: Δp</text><line x1="520" y1="250" x2="631.2" y2="250" stroke="#287aab" stroke-width="2.5"/><polygon points="640,250 629,254.5 629,245.5" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><text x="580" y="240" font-size="15" fill="#287aab" text-anchor="middle">flow</text><text x="360" y="330" font-size="16" fill="#273b45" text-anchor="middle">V = Cv √(2 Δp / ρ) = √(2 × 2000 / 1000) = 2.0 m/s</text><text x="360" y="358" font-size="15" fill="#273b45" text-anchor="middle">Each reading is a local speed; discharge needs a traverse, Q ≈ Σ Vi ΔAi</text><text x="360" y="386" font-size="14" fill="#647780" text-anchor="middle">Convert kPa to Pa before substituting</text></g></svg>