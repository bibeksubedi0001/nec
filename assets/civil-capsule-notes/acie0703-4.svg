<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Khosla exit gradient for a floor with an end pile</title><desc id="desc">For an ideal floor of length b with one downstream pile of depth d, GE = H/(π d √λ) with λ set by b/d. With H = 6 m, d = 4 m and λ = 1.5, GE = 0.390; as d tends to zero it grows without bound.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><rect x="20" y="170" width="680" height="110" fill="#f0e6d4" stroke="none" stroke-width="2"/><rect x="20" y="80" width="120" height="90" fill="#d8edf7" stroke="none" stroke-width="2"/><line x1="20" y1="80" x2="140" y2="80" stroke="#287aab" stroke-width="2"/><rect x="520" y="140" width="180" height="30" fill="#d8edf7" stroke="none" stroke-width="2"/><line x1="520" y1="140" x2="700" y2="140" stroke="#287aab" stroke-width="2"/><line x1="20" y1="170" x2="700" y2="170" stroke="#273b45" stroke-width="1.5"/><rect x="140" y="150" width="380" height="20" fill="#e4e8e9" stroke="#273b45" stroke-width="2"/><rect x="512" y="170" width="8" height="80" fill="#466d89" stroke="#273b45" stroke-width="1"/><path d="M70 172 C70 300 516 300 516 256 C522 228 540 196 566 172" stroke="#287aab" stroke-width="2" fill="none" stroke-dasharray="7 5" stroke-linejoin="round" stroke-linecap="round"/><path d="M110 172 C110 270 500 280 510 254" stroke="#287aab" stroke-width="2" fill="none" stroke-dasharray="7 5" stroke-linejoin="round" stroke-linecap="round"/><line x1="566" y1="196" x2="566" y2="157.2" stroke="#b64f4f" stroke-width="2.5"/><polygon points="566,150 570,159 562,159" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="576" y="190" font-size="14" fill="#b64f4f" text-anchor="start">exit gradient GE</text><line x1="60" y1="80" x2="60" y2="140" stroke="#647780" stroke-width="1.5"/><line x1="67" y1="80" x2="53" y2="80" stroke="#647780" stroke-width="1.5"/><line x1="67" y1="140" x2="53" y2="140" stroke="#647780" stroke-width="1.5"/><text x="52" y="116" font-size="14" fill="#647780" text-anchor="end">H = 6 m</text><line x1="52" y1="140" x2="140" y2="140" stroke="#647780" stroke-width="1" stroke-dasharray="3 3"/><line x1="140" y1="130" x2="520" y2="130" stroke="#647780" stroke-width="1.5"/><line x1="140" y1="123" x2="140" y2="137" stroke="#647780" stroke-width="1.5"/><line x1="520" y1="123" x2="520" y2="137" stroke="#647780" stroke-width="1.5"/><text x="330" y="120" font-size="15" fill="#647780" text-anchor="middle">b</text><line x1="540" y1="170" x2="540" y2="250" stroke="#647780" stroke-width="1.5"/><line x1="547" y1="170" x2="533" y2="170" stroke="#647780" stroke-width="1.5"/><line x1="547" y1="250" x2="533" y2="250" stroke="#647780" stroke-width="1.5"/><text x="552" y="236" font-size="14" fill="#273b45" text-anchor="start">d = 4 m</text><text x="360" y="306" font-size="15" fill="#273b45" text-anchor="middle">GE = H / (π d √λ),  λ = (1 + √(1 + α²))/2,  α = b/d</text><text x="360" y="332" font-size="15" fill="#287aab" text-anchor="middle">H = 6, d = 4, λ = 1.5: GE = 6/(π × 4 × √1.5) = 0.390</text><text x="360" y="358" font-size="14" fill="#b64f4f" text-anchor="middle">d → 0: GE unbounded at the edge, so a toe cutoff is needed</text><text x="360" y="382" font-size="13" fill="#647780" text-anchor="middle">λ describes geometry, not soil permeability</text></g></svg>