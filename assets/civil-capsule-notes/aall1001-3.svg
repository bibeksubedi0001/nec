<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Set-square angles in steps of 15 degrees</title><desc id="desc">The 45 and 30-60 set squares combine only into multiples of 15 degrees, such as 105 = 60 + 45, 75 = 45 + 30 and 150 = 180 - 30. An angle of 115 degrees needs an adjustable clinograph.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><polygon points="60,300 220,300 60,140" fill="#e6f1f8" stroke="#287aab" stroke-width="2" stroke-linejoin="round"/><text x="190" y="292" font-size="14" fill="#273b45" text-anchor="middle">45°</text><text x="72" y="172" font-size="14" fill="#273b45" text-anchor="start">45°</text><rect x="60" y="286" width="14" height="14" fill="none" stroke="#287aab" stroke-width="1.2"/><polygon points="250,300 423,300 250,200" fill="#deeee6" stroke="#2b7b61" stroke-width="2" stroke-linejoin="round"/><text x="392" y="292" font-size="14" fill="#273b45" text-anchor="middle">30°</text><text x="258" y="226" font-size="14" fill="#273b45" text-anchor="start">60°</text><rect x="250" y="286" width="14" height="14" fill="none" stroke="#2b7b61" stroke-width="1.2"/><text x="240" y="100" font-size="15" fill="#273b45" text-anchor="middle">fixed set squares</text><line x1="560" y1="300" x2="680" y2="300" stroke="#b8c8ce" stroke-width="1"/><line x1="560" y1="300" x2="675.91" y2="268.94" stroke="#b8c8ce" stroke-width="1"/><line x1="560" y1="300" x2="663.92" y2="240" stroke="#b8c8ce" stroke-width="1"/><line x1="560" y1="300" x2="644.85" y2="215.15" stroke="#b8c8ce" stroke-width="1"/><line x1="560" y1="300" x2="620" y2="196.08" stroke="#b8c8ce" stroke-width="1"/><line x1="560" y1="300" x2="591.06" y2="184.09" stroke="#b8c8ce" stroke-width="1"/><line x1="560" y1="300" x2="560" y2="180" stroke="#b8c8ce" stroke-width="1"/><line x1="560" y1="300" x2="528.94" y2="184.09" stroke="#b8c8ce" stroke-width="1"/><line x1="560" y1="300" x2="500" y2="196.08" stroke="#b8c8ce" stroke-width="1"/><line x1="560" y1="300" x2="475.15" y2="215.15" stroke="#b8c8ce" stroke-width="1"/><line x1="560" y1="300" x2="456.08" y2="240" stroke="#b8c8ce" stroke-width="1"/><line x1="560" y1="300" x2="444.09" y2="268.94" stroke="#b8c8ce" stroke-width="1"/><line x1="560" y1="300" x2="440" y2="300" stroke="#b8c8ce" stroke-width="1"/><line x1="560" y1="300" x2="591.06" y2="184.09" stroke="#2b7b61" stroke-width="3"/><text x="594.68" y="175.57" font-size="13" fill="#2b7b61" text-anchor="middle">75°</text><line x1="560" y1="300" x2="528.94" y2="184.09" stroke="#2b7b61" stroke-width="3"/><text x="525.32" y="175.57" font-size="13" fill="#2b7b61" text-anchor="middle">105°</text><line x1="560" y1="300" x2="456.08" y2="240" stroke="#2b7b61" stroke-width="3"/><text x="443.95" y="238" font-size="13" fill="#2b7b61" text-anchor="middle">150°</text><line x1="560" y1="300" x2="509.29" y2="191.24" stroke="#b64f4f" stroke-width="2.5" stroke-dasharray="5 4"/><text x="495.76" y="162.24" font-size="13" fill="#b64f4f" text-anchor="middle">115°?</text><line x1="430" y1="300" x2="690" y2="300" stroke="#647780" stroke-width="2"/><text x="560" y="100" font-size="15" fill="#273b45" text-anchor="middle">multiples of 15°</text><text x="360" y="340" font-size="14" fill="#273b45" text-anchor="middle">105 = 60 + 45, 75 = 45 + 30, 150 = 180 − 30: all multiples of 15°</text><text x="360" y="364" font-size="14" fill="#b64f4f" text-anchor="middle">115° is not a multiple of 15°: use an adjustable clinograph</text><text x="360" y="388" font-size="13" fill="#647780" text-anchor="middle">A D1 board 1000 × 700 × 25 mm gives board length, width and thickness</text></g></svg>