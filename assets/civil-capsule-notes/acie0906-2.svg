<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Reading mass-haul ordinates</title><desc id="desc">A rising ordinate means net cut and a falling one net fill; a positive ordinate is cumulative surplus. A curve still above zero but falling is consuming earlier surplus, and ending at -250 m³ means 250 m³ of borrow.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><rect x="227.5" y="70" width="187.92" height="110" fill="#f5ead8" stroke="none" stroke-width="2" opacity="0.8"/><line x1="90" y1="290" x2="646" y2="290" stroke="#647780" stroke-width="2"/><polygon points="654,290 644,294 644,286" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><line x1="90" y1="290" x2="90" y2="64" stroke="#647780" stroke-width="2"/><polygon points="90,56 94,66 86,66" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><text x="365" y="328" font-size="15" fill="#273b45" text-anchor="middle">chainage (m)</text><text x="96" y="46" font-size="15" fill="#273b45" text-anchor="start">cumulative volume (m³)</text><text x="90" y="310" font-size="13" fill="#273b45" text-anchor="middle">0</text><text x="273.33" y="310" font-size="13" fill="#273b45" text-anchor="middle">200</text><text x="456.67" y="310" font-size="13" fill="#273b45" text-anchor="middle">400</text><text x="640" y="310" font-size="13" fill="#273b45" text-anchor="middle">600</text><text x="82" y="253.75" font-size="13" fill="#273b45" text-anchor="end">-250</text><text x="82" y="185" font-size="13" fill="#273b45" text-anchor="end">0</text><text x="82" y="102.5" font-size="13" fill="#273b45" text-anchor="end">300</text><line x1="90" y1="180" x2="640" y2="180" stroke="#273b45" stroke-width="1.5"/><path d="M90 180 L227.5 97.5 L319.17 125 L415.42 180 L502.5 221.25 L640 248.75" stroke="#287aab" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="145" y="116.75" font-size="13" fill="#287aab" text-anchor="middle">rising: net cut</text><text x="321" y="89.25" font-size="13" fill="#b98232" text-anchor="middle">above zero but falling:</text><text x="321" y="104.45" font-size="13" fill="#b98232" text-anchor="middle">surplus used by fill</text><circle cx="640" cy="248.75" r="5" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><text x="632" y="270.75" font-size="14" fill="#b64f4f" text-anchor="end">−250 m³: borrow needed</text><text x="360" y="350" font-size="14" fill="#273b45" text-anchor="middle">Ordinate = accumulated balance; slope = the current reach</text><text x="360" y="374" font-size="13" fill="#647780" text-anchor="middle">The endpoint is a compacted volume, not a haul distance; convert for bulking</text></g></svg>