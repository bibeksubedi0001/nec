<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">The 100/30 rule for orthogonal earthquake effects</title><desc id="desc">For non-parallel lateral systems the full effect of one direction is combined with 30 percent of the other, axes interchanged, taking the most adverse case.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><text x="360" y="50" font-size="16" fill="#273b45" text-anchor="middle">Seismic axial effects Ex = 80 kN, Ey = 30 kN</text><rect x="80" y="110" width="180" height="150" fill="#d6dfe3" stroke="#273b45" stroke-width="2"/><line x1="140" y1="110" x2="140" y2="260" stroke="#647780" stroke-width="1"/><line x1="200" y1="110" x2="200" y2="260" stroke="#647780" stroke-width="1"/><line x1="80" y1="185" x2="260" y2="185" stroke="#647780" stroke-width="1"/><line x1="170" y1="185" x2="271.2" y2="185" stroke="#b64f4f" stroke-width="3.5"/><polygon points="280,185 269,189.5 269,180.5" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><line x1="170" y1="185" x2="170" y2="160.8" stroke="#287aab" stroke-width="3.5"/><polygon points="170,152 174.5,163 165.5,163" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><text x="286" y="180" font-size="15" fill="#b64f4f" text-anchor="start">X</text><text x="178" y="148" font-size="15" fill="#287aab" text-anchor="start">Y</text><text x="170" y="296" font-size="16" fill="#273b45" text-anchor="middle">100% X + 30% Y</text><text x="170" y="322" font-size="16" fill="#b64f4f" text-anchor="middle">80 + 0.3 × 30 = 89 kN</text><rect x="440" y="110" width="180" height="150" fill="#d6dfe3" stroke="#273b45" stroke-width="2"/><line x1="500" y1="110" x2="500" y2="260" stroke="#647780" stroke-width="1"/><line x1="560" y1="110" x2="560" y2="260" stroke="#647780" stroke-width="1"/><line x1="440" y1="185" x2="620" y2="185" stroke="#647780" stroke-width="1"/><line x1="530" y1="185" x2="554.2" y2="185" stroke="#b64f4f" stroke-width="3.5"/><polygon points="563,185 552,189.5 552,180.5" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><line x1="530" y1="185" x2="530" y2="83.8" stroke="#287aab" stroke-width="3.5"/><polygon points="530,75 534.5,86 525.5,86" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><text x="569" y="180" font-size="15" fill="#b64f4f" text-anchor="start">X</text><text x="538" y="71" font-size="15" fill="#287aab" text-anchor="start">Y</text><text x="530" y="296" font-size="16" fill="#273b45" text-anchor="middle">30% X + 100% Y</text><text x="530" y="322" font-size="16" fill="#287aab" text-anchor="middle">0.3 × 80 + 30 = 54 kN</text><text x="360" y="370" font-size="15" fill="#273b45" text-anchor="middle">89 kN governs the positive envelope; reverse signs are checked too</text><text x="360" y="398" font-size="14" fill="#647780" text-anchor="middle">Wind and earthquake are alternative cases, not added together (IS 800)</text></g></svg>