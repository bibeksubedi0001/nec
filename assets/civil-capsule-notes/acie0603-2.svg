<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Bleaching powder versus chlorine gas, and available chlorine</title><desc id="desc">Hypochlorite hydrolysis releases hydroxide, so bleaching powder tends to raise the pH of weakly buffered water, while chlorine gas forms acid and lowers it. 10 kg at 35 percent holds 3.5 kg as Cl2.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><rect x="40" y="60" width="300" height="90" rx="8" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><text x="190" y="101" font-size="16" fill="#273b45" text-anchor="middle"><tspan x="190" dy="0">Bleaching powder, CaOCl2</tspan><tspan x="190" dy="19.52">OCl⁻ + H2O ⇌ HOCl + OH⁻</tspan></text><rect x="380" y="60" width="300" height="90" rx="8" fill="#f2dfdf" stroke="#b64f4f" stroke-width="2"/><text x="530" y="101" font-size="16" fill="#273b45" text-anchor="middle"><tspan x="530" dy="0">Chlorine gas</tspan><tspan x="530" dy="19.52">Cl2 + H2O → HOCl + H⁺ + Cl⁻</tspan></text><line x1="190" y1="250" x2="190" y2="178.8" stroke="#2b7b61" stroke-width="4"/><polygon points="190,170 194.5,181 185.5,181" fill="#2b7b61" stroke="#2b7b61" stroke-width="1.5" stroke-linejoin="round"/><text x="190" y="272" font-size="16" fill="#2b7b61" text-anchor="middle">pH tends to rise</text><line x1="530" y1="170" x2="530" y2="241.2" stroke="#b64f4f" stroke-width="4"/><polygon points="530,250 525.5,239 534.5,239" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="530" y="272" font-size="16" fill="#b64f4f" text-anchor="middle">pH tends to fall</text><text x="360" y="300" font-size="14" fill="#647780" text-anchor="middle">weakly buffered water; the size depends on dose</text><rect x="120" y="330" width="480" height="30" fill="#d6dfe3" stroke="#273b45" stroke-width="1.5"/><rect x="120" y="330" width="168" height="30" fill="#deeee6" stroke="#2b7b61" stroke-width="1.5"/><text x="204" y="351" font-size="14" fill="#2b7b61" text-anchor="middle">3.5 kg as Cl2</text><text x="444" y="351" font-size="14" fill="#273b45" text-anchor="middle">10 kg product, 35% available chlorine</text><text x="360" y="398" font-size="14" fill="#273b45" text-anchor="middle">Available chlorine = oxidising capacity as Cl2, not free gas</text></g></svg>