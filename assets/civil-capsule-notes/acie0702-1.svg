<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Canal network roles, and inundation versus perennial supply</title><desc id="desc">The main canal conveys bulk supply from the headworks to branches and distributaries, which feed minors, watercourses and farms. An inundation canal runs only when flood stages lift the river above its sill.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><rect x="30" y="36" width="230" height="36" rx="8" fill="#d6dfe3" stroke="#8a9aa3" stroke-width="2"/><text x="145" y="59.4" font-size="15" fill="#273b45" text-anchor="middle">Headworks</text><rect x="30" y="86" width="230" height="36" rx="8" fill="#e6f1f8" stroke="#287aab" stroke-width="2"/><text x="145" y="109.4" font-size="15" fill="#273b45" text-anchor="middle">Main canal: bulk conveyance</text><line x1="145" y1="73" x2="145" y2="78.6" stroke="#647780" stroke-width="2"/><polygon points="145,85 141.5,77 148.5,77" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><rect x="30" y="136" width="230" height="36" rx="8" fill="#d6dfe3" stroke="#8a9aa3" stroke-width="2"/><text x="145" y="159.4" font-size="15" fill="#273b45" text-anchor="middle">Branch canals</text><line x1="145" y1="123" x2="145" y2="128.6" stroke="#647780" stroke-width="2"/><polygon points="145,135 141.5,127 148.5,127" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><rect x="30" y="186" width="230" height="36" rx="8" fill="#d6dfe3" stroke="#8a9aa3" stroke-width="2"/><text x="145" y="209.4" font-size="15" fill="#273b45" text-anchor="middle">Distributaries</text><line x1="145" y1="173" x2="145" y2="178.6" stroke="#647780" stroke-width="2"/><polygon points="145,185 141.5,177 148.5,177" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><rect x="30" y="236" width="230" height="36" rx="8" fill="#d6dfe3" stroke="#8a9aa3" stroke-width="2"/><text x="145" y="259.4" font-size="15" fill="#273b45" text-anchor="middle">Minors</text><line x1="145" y1="223" x2="145" y2="228.6" stroke="#647780" stroke-width="2"/><polygon points="145,235 141.5,227 148.5,227" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><rect x="30" y="286" width="230" height="36" rx="8" fill="#d6dfe3" stroke="#8a9aa3" stroke-width="2"/><text x="145" y="309.4" font-size="15" fill="#273b45" text-anchor="middle">Watercourses</text><line x1="145" y1="273" x2="145" y2="278.6" stroke="#647780" stroke-width="2"/><polygon points="145,285 141.5,277 148.5,277" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><rect x="30" y="336" width="230" height="36" rx="8" fill="#d6dfe3" stroke="#8a9aa3" stroke-width="2"/><text x="145" y="359.4" font-size="15" fill="#273b45" text-anchor="middle">Farms</text><line x1="145" y1="323" x2="145" y2="328.6" stroke="#647780" stroke-width="2"/><polygon points="145,335 141.5,327 148.5,327" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><line x1="360" y1="290" x2="686" y2="290" stroke="#647780" stroke-width="2"/><polygon points="694,290 684,294 684,286" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><line x1="360" y1="290" x2="360" y2="84" stroke="#647780" stroke-width="2"/><polygon points="360,76 364,86 356,86" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><text x="520" y="320" font-size="15" fill="#273b45" text-anchor="middle">month</text><text x="366" y="66" font-size="15" fill="#273b45" text-anchor="start">river stage</text><line x1="360" y1="180" x2="680" y2="180" stroke="#647780" stroke-width="2" stroke-dasharray="6 4"/><text x="676" y="174" font-size="14" fill="#647780" text-anchor="end">intake sill</text><line x1="360" y1="150" x2="680" y2="150" stroke="#2b7b61" stroke-width="2.5"/><text x="366" y="142" font-size="14" fill="#