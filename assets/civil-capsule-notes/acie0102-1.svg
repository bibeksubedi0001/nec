<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Le Chatelier mould and tension briquette</title><desc id="desc">Expansion widens the indicator-arm tips of the split mould after heating; a necked briquette pulled apart gives tensile strength as P divided by the neck area.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="360" y1="36" x2="360" y2="396" stroke="#b8c8ce" stroke-width="1.5" stroke-dasharray="6 6"/><rect x="95" y="250" width="110" height="80" fill="#d6dfe3" stroke="#273b45" stroke-width="2"/><line x1="150" y1="250" x2="150" y2="330" stroke="#fbfcfd" stroke-width="5"/><line x1="143" y1="252" x2="112" y2="96" stroke="#466d89" stroke-width="3.5"/><line x1="157" y1="252" x2="188" y2="96" stroke="#466d89" stroke-width="3.5"/><circle cx="112" cy="92" r="6" fill="#466d89" stroke="#466d89" stroke-width="2"/><circle cx="188" cy="92" r="6" fill="#466d89" stroke="#466d89" stroke-width="2"/><line x1="112" y1="68" x2="188" y2="68" stroke="#647780" stroke-width="1.5"/><line x1="112" y1="61" x2="112" y2="75" stroke="#647780" stroke-width="1.5"/><line x1="188" y1="61" x2="188" y2="75" stroke="#647780" stroke-width="1.5"/><text x="150" y="52" font-size="18" fill="#647780" text-anchor="middle">tip separation</text><text x="150" y="362" font-size="16" fill="#273b45" text-anchor="middle">Split mould with paste;</text><text x="150" y="386" font-size="16" fill="#273b45" text-anchor="middle">expansion widens the tips</text><path d="M465 80 L615 80 L615 130 Q560 160 562 205 Q560 250 615 280 L615 330 L465 330 L465 280 Q520 250 518 205 Q520 160 465 130 Z" stroke="#b98232" stroke-width="2" fill="#f0e6d4" stroke-linejoin="round" stroke-linecap="round"/><line x1="455" y1="104" x2="625" y2="104" stroke="#647780" stroke-width="4"/><line x1="455" y1="306" x2="625" y2="306" stroke="#647780" stroke-width="4"/><line x1="540" y1="78" x2="540" y2="38.8" stroke="#b64f4f" stroke-width="3"/><polygon points="540,30 544.5,41 535.5,41" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="556" y="46" font-size="20" fill="#b64f4f" text-anchor="start">P</text><line x1="540" y1="332" x2="540" y2="375.2" stroke="#b64f4f" stroke-width="3"/><polygon points="540,384 535.5,373 544.5,373" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="556" y="376" font-size="20" fill="#b64f4f" text-anchor="start">P</text><line x1="514" y1="205" x2="450" y2="205" stroke="#647780" stroke-width="1.5"/><text x="444" y="200" font-size="16" fill="#273b45" text-anchor="end">neck</text><text x="444" y="222" font-size="16" fill="#273b45" text-anchor="end">area A</text><text x="668" y="212" font-size="18" fill="#273b45" text-anchor="middle">f = P / A</text></g></svg>