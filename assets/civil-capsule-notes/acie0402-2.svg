<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Measuring ductility from a tensile specimen</title><desc id="desc">Ductility shows as large permanent elongation of the gauge length and a large reduction of area at the neck, not as recoverable elastic stretch.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><polygon points="80,80 160,80 190,92 530,92 560,80 640,80 640,140 560,140 530,128 190,128 160,140 80,140" fill="#d6dfe3" stroke="#466d89" stroke-width="2" stroke-linejoin="round"/><line x1="240" y1="86" x2="240" y2="134" stroke="#b64f4f" stroke-width="2"/><line x1="480" y1="86" x2="480" y2="134" stroke="#b64f4f" stroke-width="2"/><line x1="240" y1="64" x2="480" y2="64" stroke="#647780" stroke-width="1.5"/><line x1="240" y1="57" x2="240" y2="71" stroke="#647780" stroke-width="1.5"/><line x1="480" y1="57" x2="480" y2="71" stroke="#647780" stroke-width="1.5"/><text x="360" y="60" font-size="16" fill="#647780" text-anchor="middle">L0</text><text x="360" y="115" font-size="15" fill="#273b45" text-anchor="middle">A0 = 100 mm²</text><text x="60" y="115" font-size="14" fill="#647780" text-anchor="end">before</text><polygon points="40,230 120,230 150,242 330,242 372,254 372,266 330,278 150,278 120,290 40,290" fill="#d6dfe3" stroke="#466d89" stroke-width="2" stroke-linejoin="round"/><polygon points="382,254 424,242 590,242 620,230 700,230 700,290 620,290 590,278 424,278 382,266" fill="#d6dfe3" stroke="#466d89" stroke-width="2" stroke-linejoin="round"/><line x1="200" y1="236" x2="200" y2="284" stroke="#b64f4f" stroke-width="2"/><line x1="540" y1="236" x2="540" y2="284" stroke="#b64f4f" stroke-width="2"/><line x1="200" y1="214" x2="540" y2="214" stroke="#647780" stroke-width="1.5"/><line x1="200" y1="207" x2="200" y2="221" stroke="#647780" stroke-width="1.5"/><line x1="540" y1="207" x2="540" y2="221" stroke="#647780" stroke-width="1.5"/><text x="370" y="210" font-size="16" fill="#647780" text-anchor="middle">Lf</text><line x1="377" y1="250" x2="377" y2="310" stroke="#647780" stroke-width="1.2"/><text x="377" y="326" font-size="15" fill="#273b45" text-anchor="middle">neck: Af = 60 mm²</text><text x="360" y="366" font-size="16" fill="#273b45" text-anchor="middle">EL = (Lf − L0) / L0 × 100%</text><text x="360" y="394" font-size="16" fill="#273b45" text-anchor="middle">RA = (A0 − Af) / A0 × 100% = (100 − 60) / 100 = 40%</text></g></svg>