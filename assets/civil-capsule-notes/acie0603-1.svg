<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Coarse bar screen: inclination, bars and open area</title><desc id="desc">A coarse screen of 15 mm bars with 50 mm clear gaps at 55 degrees lies inside all three bands; only the gap of each 65 mm pitch is open, an open fraction of 76.9 percent.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><text x="185" y="50" font-size="16" fill="#273b45" text-anchor="middle">Section: 45-60° to horizontal</text><rect x="40" y="180" width="290" height="120" fill="#d8edf7" stroke="none" stroke-width="2"/><line x1="40" y1="180" x2="330" y2="180" stroke="#287aab" stroke-width="1.5" stroke-dasharray="6 4"/><line x1="40" y1="300" x2="330" y2="300" stroke="#647780" stroke-width="2"/><line x1="46" y1="301" x2="36" y2="312" stroke="#647780" stroke-width="1.4"/><line x1="60" y1="301" x2="50" y2="312" stroke="#647780" stroke-width="1.4"/><line x1="74" y1="301" x2="64" y2="312" stroke="#647780" stroke-width="1.4"/><line x1="88" y1="301" x2="78" y2="312" stroke="#647780" stroke-width="1.4"/><line x1="102" y1="301" x2="92" y2="312" stroke="#647780" stroke-width="1.4"/><line x1="116" y1="301" x2="106" y2="312" stroke="#647780" stroke-width="1.4"/><line x1="130" y1="301" x2="120" y2="312" stroke="#647780" stroke-width="1.4"/><line x1="144" y1="301" x2="134" y2="312" stroke="#647780" stroke-width="1.4"/><line x1="158" y1="301" x2="148" y2="312" stroke="#647780" stroke-width="1.4"/><line x1="172" y1="301" x2="162" y2="312" stroke="#647780" stroke-width="1.4"/><line x1="186" y1="301" x2="176" y2="312" stroke="#647780" stroke-width="1.4"/><line x1="200" y1="301" x2="190" y2="312" stroke="#647780" stroke-width="1.4"/><line x1="214" y1="301" x2="204" y2="312" stroke="#647780" stroke-width="1.4"/><line x1="228" y1="301" x2="218" y2="312" stroke="#647780" stroke-width="1.4"/><line x1="242" y1="301" x2="232" y2="312" stroke="#647780" stroke-width="1.4"/><line x1="256" y1="301" x2="246" y2="312" stroke="#647780" stroke-width="1.4"/><line x1="270" y1="301" x2="260" y2="312" stroke="#647780" stroke-width="1.4"/><line x1="284" y1="301" x2="274" y2="312" stroke="#647780" stroke-width="1.4"/><line x1="298" y1="301" x2="288" y2="312" stroke="#647780" stroke-width="1.4"/><line x1="312" y1="301" x2="302" y2="312" stroke="#647780" stroke-width="1.4"/><line x1="326" y1="301" x2="316" y2="312" stroke="#647780" stroke-width="1.4"/><line x1="170" y1="300" x2="296" y2="120" stroke="#466d89" stroke-width="6"/><path d="M195.81 263.14 A45 45 0 0 1 215 300" stroke="#b64f4f" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="232" y="288" font-size="15" fill="#b64f4f" text-anchor="middle">55°</text><line x1="56" y1="240" x2="131.2" y2="240" stroke="#287aab" stroke-width="3"/><polygon points="140,240 129,244.5 129,235.5" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><text x="96" y="228" font-size="14" fill="#287aab" text-anchor="middle">flow</text><text x="185" y="350" font-size="14" fill="#647780" text-anchor="middle">coarse objects only;</text><text x="185" y="370" font-size="14" fill="#647780" text-anchor="middle">nothing dissolved is removed</text><line x1="360" y1="30" x2="360" y2="380" stroke="#b8c8ce" stroke-width="1.5" stroke-dasharray="6 5"/><text x="540" y="50" font-size="16" fill="#273b45" text-anchor="middle">Plan: bars and clear gaps</text><rect x="380" y="110" width="24" height="140" fill="#466d89" stroke="#273b45" stroke-width="1.5"/><rect x="484" y="110" width="24" height="140" fill="#466d89" stroke="#273b45" stroke-width="1.5"/><rect x="588" y="110" width="24" height="140" fill="#466d89" stroke="#273b45" stroke-width="1.5"/><rect x="404" y="110" width="80" height="140" fill="#d8edf7" stroke="none" stroke-width="2"/><rect x="508" y="110" width="80" height="140" fill="#d8edf7" stroke="none" stroke-width="2"/><line x1="380" y1="95" x2="404" y2="95" stroke="#647780" stroke-width="1.5"/><line x1="380" y1="88" x2="380" y2="102" stroke="#647780" stroke-width="1.5"/><line x1="404" y1="88" x2="404" y2="102" stroke="#647780" stroke-width="1.5"/><text x="392" y="85" font-size="14" fill="#647780" text-anchor="middle">b = 15</text><line x1="404" y1="95" x2="484" y2="95" stroke="#647780" stroke-width="1.5"/><line x1="404" y1="88" x2="404" y2="102" stroke="#647780" stroke-width="1.5"/><line x1="484" y1="88" x2="484" y2="102" stroke="#647780" stroke-width="1.5"/><text x="444" y="85" font-size="14" fill="#647780" text-anchor="middle">s = 50</text><line x1="380" y1="272" x2="484" y2="272" stroke="#647780" stroke-width="1.5"/><line x1="380" y1="265" x2="380" y2="279" stroke="#647780" stroke-width="1.5"/><line x1="484" y1="265" x2="484" y2="279" stroke="#647780" stroke-width="1.5"/><text x="432" y="298" font-size="18" fill="#647780" text-anchor="middle">pitch 65 mm</text><text x="540" y="340" font-size="16" fill="#287aab" text-anchor="middle">φ = s/(b + s) = 50/65 = 76.9% open</text><text x="540" y="368" font-size="14" fill="#647780" text-anchor="middle">bands: bars 10-25, gaps 20-100 mm</text></g></svg>