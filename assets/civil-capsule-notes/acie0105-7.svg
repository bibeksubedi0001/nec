<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">GIS layers overlaid for analysis</title><desc id="desc">Georeferenced layers such as terrain, streams, roads and buildings can be overlaid and queried together; the survey supplies their positions.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><polygon points="90,340 390,340 470,296 170,296" fill="#f0e6d4" stroke="#b98232" stroke-width="2" stroke-linejoin="round"/><text x="500" y="324" font-size="17" fill="#b98232" text-anchor="start">Terrain and contours</text><ellipse cx="280" cy="318" rx="80" ry="13" fill="none" stroke="#b98232" stroke-width="1.5"/><ellipse cx="280" cy="318" rx="44" ry="7" fill="none" stroke="#b98232" stroke-width="1.5"/><polygon points="90,264 390,264 470,220 170,220" fill="#d8edf7" stroke="#287aab" stroke-width="2" stroke-linejoin="round"/><text x="500" y="248" font-size="17" fill="#287aab" text-anchor="start">Streams</text><path d="M150 256 Q220 228 290 246 T430 230" stroke="#287aab" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="90,188 390,188 470,144 170,144" fill="#e9eef0" stroke="#647780" stroke-width="2" stroke-linejoin="round"/><text x="500" y="172" font-size="17" fill="#647780" text-anchor="start">Roads</text><line x1="140" y1="174" x2="420" y2="158" stroke="#647780" stroke-width="4"/><line x1="250" y1="184" x2="300" y2="148" stroke="#647780" stroke-width="4"/><polygon points="90,112 390,112 470,68 170,68" fill="#deeee6" stroke="#2b7b61" stroke-width="2" stroke-linejoin="round"/><text x="500" y="96" font-size="17" fill="#2b7b61" text-anchor="start">Buildings</text><rect x="200" y="88" width="22" height="12" fill="#2b7b61" stroke="#2b7b61" stroke-width="1"/><rect x="260" y="82" width="22" height="12" fill="#2b7b61" stroke="#2b7b61" stroke-width="1"/><rect x="330" y="90" width="22" height="12" fill="#2b7b61" stroke="#2b7b61" stroke-width="1"/><rect x="380" y="80" width="22" height="12" fill="#2b7b61" stroke="#2b7b61" stroke-width="1"/><line x1="690" y1="330" x2="690" y2="118.8" stroke="#273b45" stroke-width="2"/><polygon points="690,110 694.5,121 685.5,121" fill="#273b45" stroke="#273b45" stroke-width="1.5" stroke-linejoin="round"/><text x="684" y="96" font-size="16" fill="#273b45" text-anchor="middle">overlay</text></g></svg>