<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Full cloverleaf interchange</title><desc id="desc">A full cloverleaf uses four loop ramps so the main roads never cross at grade, but vehicles still merge, diverge and weave where a loop entry lies upstream of the next loop exit.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><text x="360" y="30" font-size="16" fill="#273b45" text-anchor="middle">Full cloverleaf interchange</text><rect x="40" y="188" width="640" height="24" fill="#e4e8e9" stroke="none" stroke-width="2"/><line x1="40" y1="188" x2="680" y2="188" stroke="#273b45" stroke-width="2"/><line x1="40" y1="212" x2="680" y2="212" stroke="#273b45" stroke-width="2"/><circle cx="290" cy="130" r="60" fill="none" stroke="#466d89" stroke-width="5"/><circle cx="430" cy="130" r="60" fill="none" stroke="#466d89" stroke-width="5"/><circle cx="290" cy="270" r="60" fill="none" stroke="#466d89" stroke-width="5"/><circle cx="430" cy="270" r="60" fill="none" stroke="#466d89" stroke-width="5"/><rect x="348" y="50" width="24" height="300" fill="#e4e8e9" stroke="none" stroke-width="2"/><line x1="348" y1="50" x2="348" y2="350" stroke="#273b45" stroke-width="2"/><line x1="372" y1="50" x2="372" y2="350" stroke="#273b45" stroke-width="2"/><text x="360" y="44" font-size="12" fill="#647780" text-anchor="middle">bridge over</text><line x1="300" y1="216" x2="420" y2="216" stroke="#b64f4f" stroke-width="4"/><line x1="300" y1="184" x2="420" y2="184" stroke="#b64f4f" stroke-width="4"/><line x1="344" y1="140" x2="344" y2="260" stroke="#b64f4f" stroke-width="4"/><line x1="376" y1="140" x2="376" y2="260" stroke="#b64f4f" stroke-width="4"/><text x="600" y="250" font-size="13" fill="#b64f4f" text-anchor="middle">weaving: loop entry to next exit</text><text x="150" y="60" font-size="14" fill="#466d89" text-anchor="middle">loop ramp</text><line x1="190" y1="66" x2="240" y2="96" stroke="#647780" stroke-width="1.2"/><text x="360" y="380" font-size="13" fill="#273b45" text-anchor="middle">No at-grade crossing of the main roads; merging, diverging and weaving remain</text><text x="360" y="402" font-size="13" fill="#647780" text-anchor="middle">A bridge without ramps is grade separation, not an interchange</text></g></svg>