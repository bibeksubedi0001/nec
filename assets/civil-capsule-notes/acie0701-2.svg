<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Net irrigation delta of four crops</title><desc id="desc">Net delta is crop ET minus effective rain over matched periods: rice 1.20 m, tobacco 0.50 m, wheat 0.45 m and banana 1.40 m, so banana governs this illustrative budget.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><text x="360" y="50" font-size="16" fill="#273b45" text-anchor="middle">Net delta = crop ET − effective rain (m)</text><text x="150" y="104" font-size="15" fill="#273b45" text-anchor="end">Rice</text><rect x="160" y="80" width="62.5" height="36" fill="#deeee6" stroke="#2b7b61" stroke-width="1.5"/><text x="191.25" y="103" font-size="13" fill="#2b7b61" text-anchor="middle">0.25</text><rect x="222.5" y="80" width="300" height="36" fill="#e6f1f8" stroke="#287aab" stroke-width="1.5"/><text x="372.5" y="104" font-size="15" fill="#287aab" text-anchor="middle">net 1.20</text><text x="530.5" y="104" font-size="14" fill="#273b45" text-anchor="start">ET 1.45</text><text x="150" y="164" font-size="15" fill="#273b45" text-anchor="end">Tobacco</text><rect x="160" y="140" width="50" height="36" fill="#deeee6" stroke="#2b7b61" stroke-width="1.5"/><text x="185" y="163" font-size="13" fill="#2b7b61" text-anchor="middle">0.20</text><rect x="210" y="140" width="125" height="36" fill="#e6f1f8" stroke="#287aab" stroke-width="1.5"/><text x="272.5" y="164" font-size="15" fill="#287aab" text-anchor="middle">net 0.50</text><text x="343" y="164" font-size="14" fill="#273b45" text-anchor="start">ET 0.70</text><text x="150" y="224" font-size="15" fill="#273b45" text-anchor="end">Wheat</text><rect x="160" y="200" width="37.5" height="36" fill="#deeee6" stroke="#2b7b61" stroke-width="1.5"/><text x="178.75" y="223" font-size="13" fill="#2b7b61" text-anchor="middle">0.15</text><rect x="197.5" y="200" width="112.5" height="36" fill="#e6f1f8" stroke="#287aab" stroke-width="1.5"/><text x="253.75" y="224" font-size="15" fill="#287aab" text-anchor="middle">net 0.45</text><text x="318" y="224" font-size="14" fill="#273b45" text-anchor="start">ET 0.60</text><text x="150" y="284" font-size="15" fill="#273b45" text-anchor="end">Banana</text><rect x="160" y="260" width="112.5" height="36" fill="#deeee6" stroke="#2b7b61" stroke-width="1.5"/><text x="216.25" y="283" font-size="13" fill="#2b7b61" text-anchor="middle">0.45</text><rect x="272.5" y="260" width="350" height="36" fill="#e6f1f8" stroke="#b64f4f" stroke-width="3"/><text x="447.5" y="284" font-size="15" fill="#287aab" text-anchor="middle">net 1.40</text><text x="630.5" y="284" font-size="14" fill="#273b45" text-anchor="start">ET 1.85</text><rect x="250" y="318" width="18" height="14" fill="#deeee6" stroke="#2b7b61" stroke-width="1.5"/><text x="274" y="330" font-size="14" fill="#273b45" text-anchor="start">effective rain</text><rect x="400" y="318" width="18" height="14" fill="#e6f1f8" stroke="#287aab" stroke-width="1.5"/><text x="424" y="330" font-size="14" fill="#273b45" text-anchor="start">net irrigation</text><text x="360" y="372" font-size="15" fill="#b64f4f" text-anchor="middle">Banana governs this budget with 1.40 m, ahead of rice at 1.20 m</text><text x="360" y="396" font-size="13" fill="#647780" text-anchor="middle">Illustrative inputs; ranking by ET alone says nothing about irrigation demand</text></g></svg>