<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Governing canal capacity and the crop ratio</title><desc id="desc">With non-overlapping seasons, capacity follows the larger concurrent total: Rabi 2.4 + 0.6 = 3.0 and Kharif 3.0 + 0.8 = 3.8 cumecs, so 3.8 governs, not 6.8. The crop ratio 2400/1600 = 1.5.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="110" y1="300" x2="430" y2="300" stroke="#647780" stroke-width="2"/><rect x="140" y="156" width="100" height="144" fill="#e6f1f8" stroke="#287aab" stroke-width="2"/><rect x="140" y="120" width="100" height="36" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><text x="190" y="232" font-size="15" fill="#287aab" text-anchor="middle">Rabi 2.4</text><text x="190" y="143" font-size="13" fill="#2b7b61" text-anchor="middle">perennial 0.6</text><rect x="300" y="120" width="100" height="180" fill="#f5ead8" stroke="#b98232" stroke-width="2"/><rect x="300" y="72" width="100" height="48" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><text x="350" y="215" font-size="15" fill="#b98232" text-anchor="middle">Kharif 3.0</text><text x="350" y="101" font-size="13" fill="#2b7b61" text-anchor="middle">perennial 0.8</text><text x="190" y="112" font-size="15" fill="#273b45" text-anchor="middle">3.0</text><text x="350" y="64" font-size="15" fill="#273b45" text-anchor="middle">3.8</text><line x1="120" y1="72" x2="440" y2="72" stroke="#b64f4f" stroke-width="2" stroke-dasharray="7 4"/><text x="448" y="77" font-size="15" fill="#b64f4f" text-anchor="start">design 3.8 cumecs</text><text x="190" y="322" font-size="15" fill="#273b45" text-anchor="middle">Rabi season</text><text x="350" y="322" font-size="15" fill="#273b45" text-anchor="middle">Kharif season</text><text x="585" y="150" font-size="15" fill="#273b45" text-anchor="middle">Seasons do not overlap:</text><text x="585" y="176" font-size="15" fill="#273b45" text-anchor="middle">take the larger total,</text><text x="585" y="202" font-size="15" fill="#b64f4f" text-anchor="middle">not the sum 6.8</text><text x="585" y="260" font-size="15" fill="#273b45" text-anchor="middle">Crop ratio (Rabi/Kharif)</text><text x="585" y="286" font-size="15" fill="#287aab" text-anchor="middle">= 2400/1600 = 1.5 (3:2)</text><text x="585" y="312" font-size="14" fill="#647780" text-anchor="middle">reversed definition: 2:3</text><text x="360" y="380" font-size="14" fill="#273b45" text-anchor="middle">Include perennial crops in both seasons; ignoring them undersizes the canal</text></g></svg>