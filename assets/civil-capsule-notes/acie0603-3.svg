<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Oxygen saturation falls as water warms</title><desc id="desc">Air-saturated fresh water at sea level holds about 14.6 mg/L of oxygen near 0 °C, 9.1 mg/L at 20 °C and 7.6 mg/L at 30 °C. The gap between saturation and the present value drives aeration.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="100" y1="300" x2="626" y2="300" stroke="#647780" stroke-width="2"/><polygon points="634,300 624,304 624,296" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><line x1="100" y1="300" x2="100" y2="84" stroke="#647780" stroke-width="2"/><polygon points="100,76 104,86 96,86" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><text x="360" y="348" font-size="16" fill="#273b45" text-anchor="middle">temperature (°C)</text><text x="106" y="66" font-size="16" fill="#273b45" text-anchor="start">O2 saturation Cs (mg/L)</text><line x1="100" y1="300" x2="100" y2="305" stroke="#647780" stroke-width="1.5"/><text x="100" y="322" font-size="14" fill="#273b45" text-anchor="middle">0</text><line x1="273.33" y1="300" x2="273.33" y2="305" stroke="#647780" stroke-width="1.5"/><text x="273.33" y="322" font-size="14" fill="#273b45" text-anchor="middle">10</text><line x1="446.67" y1="300" x2="446.67" y2="305" stroke="#647780" stroke-width="1.5"/><text x="446.67" y="322" font-size="14" fill="#273b45" text-anchor="middle">20</text><line x1="620" y1="300" x2="620" y2="305" stroke="#647780" stroke-width="1.5"/><text x="620" y="322" font-size="14" fill="#273b45" text-anchor="middle">30</text><line x1="95" y1="300" x2="100" y2="300" stroke="#647780" stroke-width="1.5"/><text x="90" y="305" font-size="14" fill="#273b45" text-anchor="end">4</text><line x1="95" y1="230" x2="100" y2="230" stroke="#647780" stroke-width="1.5"/><text x="90" y="235" font-size="14" fill="#273b45" text-anchor="end">8</text><line x1="95" y1="160" x2="100" y2="160" stroke="#647780" stroke-width="1.5"/><text x="90" y="165" font-size="14" fill="#273b45" text-anchor="end">12</text><line x1="95" y1="90" x2="100" y2="90" stroke="#647780" stroke-width="1.5"/><text x="90" y="95" font-size="14" fill="#273b45" text-anchor="end">16</text><path d="M100 114.5 L186.67 146 L273.33 172.25 L360 193.25 L446.67 210.75 L533.33 224.75 L620 237" stroke="#287aab" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="100" cy="114.5" r="5" fill="#287aab" stroke="#287aab" stroke-width="2"/><circle cx="446.67" cy="210.75" r="5" fill="#287aab" stroke="#287aab" stroke-width="2"/><circle cx="620" cy="237" r="5" fill="#287aab" stroke="#287aab" stroke-width="2"/><text x="112" y="106.5" font-size="15" fill="#273b45" text-anchor="start">14.6 mg/L at 0 °C</text><text x="456.67" y="198.75" font-size="15" fill="#273b45" text-anchor="start">9.1 at 20 °C</text><text x="612" y="282" font-size="15" fill="#273b45" text-anchor="end">7.6 at 30 °C</text><circle cx="446.67" cy="265" r="5" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><text x="436.67" y="270" font-size="14" fill="#b64f4f" text-anchor="end">C present</text><line x1="446.67" y1="252.6" x2="446.67" y2="223.15" stroke="#b64f4f" stroke-width="2"/><polygon points="446.67,216.75 450.17,224.75 443.17,224.75" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><polygon points="446.67,259 443.17,251 450.17,251" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="456.67" y="248" font-size="14" fill="#b64f4f" text-anchor="start">Cs − C drives aeration</text><text x="360" y="380" font-size="15" fill="#273b45" text-anchor="middle">Warm water holds less oxygen: aeration approaches a lower ceiling</text><text x="360" y="404" font-size="14" fill="#647780" text-anchor="middle">Copper sulphate algicide: authorised, site-specific use only</text></g></svg>