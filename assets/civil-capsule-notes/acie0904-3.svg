<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Flow of a uniform stream and PCU totals</title><desc id="desc">Vehicles 5 m long with 25 m clear gaps occupy 30 m each, so at 54 km/h the idealised flow is 1000 × 54/30 = 1800 veh/h. With 6 PCU per cart, 20 carts and 80 cars make 200 PCU/h.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><text x="360" y="50" font-size="16" fill="#273b45" text-anchor="middle">Idealised uniform stream</text><rect x="40" y="110" width="640" height="40" fill="#d6dfe3" stroke="#273b45" stroke-width="1.5"/><rect x="60" y="120" width="20" height="20" rx="3" fill="#287aab" stroke="#287aab" stroke-width="2"/><rect x="180" y="120" width="20" height="20" rx="3" fill="#287aab" stroke="#287aab" stroke-width="2"/><rect x="300" y="120" width="20" height="20" rx="3" fill="#287aab" stroke="#287aab" stroke-width="2"/><rect x="420" y="120" width="20" height="20" rx="3" fill="#287aab" stroke="#287aab" stroke-width="2"/><rect x="540" y="120" width="20" height="20" rx="3" fill="#287aab" stroke="#287aab" stroke-width="2"/><rect x="660" y="120" width="20" height="20" rx="3" fill="#287aab" stroke="#287aab" stroke-width="2"/><line x1="60" y1="100" x2="80" y2="100" stroke="#647780" stroke-width="1.5"/><line x1="60" y1="93" x2="60" y2="107" stroke="#647780" stroke-width="1.5"/><line x1="80" y1="93" x2="80" y2="107" stroke="#647780" stroke-width="1.5"/><text x="70" y="90" font-size="14" fill="#647780" text-anchor="middle">L</text><line x1="80" y1="100" x2="180" y2="100" stroke="#647780" stroke-width="1.5"/><line x1="80" y1="93" x2="80" y2="107" stroke="#647780" stroke-width="1.5"/><line x1="180" y1="93" x2="180" y2="107" stroke="#647780" stroke-width="1.5"/><text x="130" y="90" font-size="14" fill="#647780" text-anchor="middle">S = 25 m</text><line x1="60" y1="166" x2="180" y2="166" stroke="#647780" stroke-width="1.5"/><line x1="60" y1="159" x2="60" y2="173" stroke="#647780" stroke-width="1.5"/><line x1="180" y1="159" x2="180" y2="173" stroke="#647780" stroke-width="1.5"/><text x="120" y="192" font-size="14" fill="#647780" text-anchor="middle">L + S = 30 m at 54 km/h</text><text x="360" y="236" font-size="15" fill="#287aab" text-anchor="middle">q = 1000 V / (L + S) = 1000 × 54 / 30 = 1800 veh/h</text><text x="360" y="260" font-size="13" fill="#647780" text-anchor="middle">treating S as the gross spacing counts L twice</text><rect x="160" y="296" width="240" height="30" fill="#f5ead8" stroke="#b98232" stroke-width="2"/><rect x="400" y="296" width="160" height="30" fill="#e6f1f8" stroke="#287aab" stroke-width="2"/><text x="280" y="316" font-size="14" fill="#b98232" text-anchor="middle">20 carts × 6 = 120</text><text x="480" y="316" font-size="14" fill="#287aab" text-anchor="middle">80 cars × 1 = 80</text><text x="150" y="316" font-size="14" fill="#273b45" text-anchor="end">PCU/h</text><text x="360" y="356" font-size="14" fill="#273b45" text-anchor="middle">= 200 PCU/h from only 100 vehicles</text><text x="360" y="380" font-size="13" fill="#647780" text-anchor="middle">Capacity is the maximum sustainable flow; PCU factors are stream effects, not axle damage</text></g></svg>