<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Water-to-wire efficiency and governor action</title><desc id="desc">Net output is hydraulic input times turbine and generator efficiency minus auxiliaries: 88 percent at full load but 72 percent at quarter load. After load loss, the governor cuts admitted water to restore speed.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><text x="200" y="50" font-size="15" fill="#273b45" text-anchor="middle">Water-to-wire efficiency</text><line x1="70" y1="290" x2="330" y2="290" stroke="#647780" stroke-width="2"/><rect x="95" y="114" width="70" height="176" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><text x="130" y="106" font-size="15" fill="#2b7b61" text-anchor="middle">88%</text><text x="130" y="308" font-size="13" fill="#273b45" text-anchor="middle">full load</text><rect x="215" y="146" width="70" height="144" fill="#f2dfdf" stroke="#b64f4f" stroke-width="2"/><text x="250" y="138" font-size="15" fill="#b64f4f" text-anchor="middle">72%</text><text x="250" y="308" font-size="13" fill="#273b45" text-anchor="middle">quarter load</text><text x="200" y="336" font-size="13" fill="#273b45" text-anchor="middle">10 × 0.92 × 0.97 − 0.1 = 8.82 MW</text><text x="200" y="356" font-size="13" fill="#273b45" text-anchor="middle">2.5 × 0.80 × 0.95 − 0.1 = 1.8 MW</text><text x="200" y="378" font-size="13" fill="#647780" text-anchor="middle">part-load turbine η and auxiliaries dominate</text><line x1="370" y1="30" x2="370" y2="390" stroke="#b8c8ce" stroke-width="1.5" stroke-dasharray="6 5"/><text x="540" y="40" font-size="15" fill="#273b45" text-anchor="middle">Governor action (isolated unit)</text><rect x="390" y="60" width="300" height="34" rx="8" fill="#e6f1f8" stroke="#287aab" stroke-width="2"/><text x="540" y="82.04" font-size="14" fill="#273b45" text-anchor="middle">unit sheds part of its load</text><rect x="390" y="110" width="300" height="34" rx="8" fill="#e6f1f8" stroke="#287aab" stroke-width="2"/><text x="540" y="132.04" font-size="14" fill="#273b45" text-anchor="middle">turbine torque &gt; generator torque</text><line x1="540" y1="96" x2="540" y2="102.6" stroke="#647780" stroke-width="2"/><polygon points="540,109 536.5,101 543.5,101" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><rect x="390" y="160" width="300" height="34" rx="8" fill="#e6f1f8" stroke="#287aab" stroke-width="2"/><text x="540" y="182.04" font-size="14" fill="#273b45" text-anchor="middle">unit accelerates: frequency error</text><line x1="540" y1="146" x2="540" y2="152.6" stroke="#647780" stroke-width="2"/><polygon points="540,159 536.5,151 543.5,151" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><rect x="390" y="210" width="300" height="34" rx="8" fill="#f5ead8" stroke="#b98232" stroke-width="2"/><text x="540" y="232.04" font-size="14" fill="#273b45" text-anchor="middle">governor reduces admitted water</text><line x1="540" y1="196" x2="540" y2="202.6" stroke="#647780" stroke-width="2"/><polygon points="540,209 536.5,201 543.5,201" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><rect x="390" y="260" width="300" height="34" rx="8" fill="#e6f1f8" stroke="#287aab" stroke-width="2"/><text x="540" y="282.04" font-size="14" fill="#273b45" text-anchor="middle">power balance back at setpoint</text><line x1="540" y1="246" x2="540" y2="252.6" stroke="#647780" stroke-width="2"/><polygon points="540,259 536.5,251 543.5,251" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><text x="540" y="336" font-size="13" fill="#647780" text-anchor="middle">excitation sets voltage; inertia only slows it</text><text x="540" y="358" font-size="13" fill="#647780" text-anchor="middle">droop alone may leave a frequency offset</text></g></svg>