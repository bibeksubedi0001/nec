<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Plate load test and its scaling</title><desc id="desc">A plate loaded at founding level gives an ultimate plate pressure; clay carries the pressure across unchanged, while sand scales roughly with width, before load is pressure times area.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="370" y1="36" x2="370" y2="380" stroke="#b8c8ce" stroke-width="1.5" stroke-dasharray="6 6"/><polygon points="30,160 100,160 100,260 280,260 280,160 350,160 350,320 30,320" fill="#f0e6d4" stroke="none" stroke-width="2" stroke-linejoin="round"/><path d="M30 160 L100 160 L100 260 L280 260 L280 160 L350 160" stroke="#647780" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><rect x="150" y="250" width="80" height="10" fill="#466d89" stroke="#466d89" stroke-width="2"/><rect x="182" y="110" width="16" height="140" fill="#d6dfe3" stroke="#273b45" stroke-width="2"/><rect x="80" y="88" width="220" height="22" fill="#c9d0d3" stroke="#273b45" stroke-width="2"/><rect x="100" y="58" width="60" height="30" fill="#d6dfe3" stroke="#647780" stroke-width="2"/><rect x="220" y="58" width="60" height="30" fill="#d6dfe3" stroke="#647780" stroke-width="2"/><text x="190" y="44" font-size="15" fill="#647780" text-anchor="middle">Reaction load</text><text x="206" y="170" font-size="15" fill="#273b45" text-anchor="start">jack</text><text x="190" y="290" font-size="15" fill="#273b45" text-anchor="middle">plate, width Bp</text><line x1="400" y1="90" x2="682" y2="90" stroke="#647780" stroke-width="2"/><polygon points="690,90 680,94 680,86" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><line x1="400" y1="90" x2="400" y2="342" stroke="#647780" stroke-width="2"/><polygon points="400,350 396,340 404,340" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><text x="690" y="76" font-size="15" fill="#273b45" text-anchor="end">pressure q</text><text x="410" y="364" font-size="15" fill="#273b45" text-anchor="start">settlement</text><path d="M400 90 Q540 110 590 180 Q612 230 616 340" stroke="#287aab" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="620" y1="96" x2="620" y2="344" stroke="#b64f4f" stroke-width="1.5" stroke-dasharray="6 5"/><text x="626" y="250" font-size="16" fill="#b64f4f" text-anchor="start">qu</text><text x="360" y="400" font-size="15" fill="#273b45" text-anchor="middle">Clay: quf = qup.  Sand: quf ≈ qup × Bf / Bp.  Qu = quf × Af</text></g></svg>