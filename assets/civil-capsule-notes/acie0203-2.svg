<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Unconfined compression and the undrained circle</title><desc id="desc">With zero lateral stress the failure circle runs from 0 to qu, so under the φu = 0 idealization the undrained strength is its radius qu/2.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><rect x="100" y="118" width="100" height="12" fill="#647780" stroke="#647780" stroke-width="2"/><rect x="100" y="300" width="100" height="12" fill="#647780" stroke="#647780" stroke-width="2"/><rect x="110" y="130" width="80" height="170" fill="#f0e6d4" stroke="#b98232" stroke-width="2"/><line x1="150" y1="48" x2="150" y2="107.2" stroke="#b64f4f" stroke-width="3"/><polygon points="150,116 145.5,105 154.5,105" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="166" y="70" font-size="19" fill="#b64f4f" text-anchor="start">P</text><text x="150" y="344" font-size="15" fill="#273b45" text-anchor="middle">No lateral</text><text x="150" y="366" font-size="15" fill="#273b45" text-anchor="middle">total stress</text><line x1="300" y1="330" x2="682" y2="330" stroke="#647780" stroke-width="2"/><polygon points="690,330 680,334 680,326" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><line x1="300" y1="330" x2="300" y2="68" stroke="#647780" stroke-width="2"/><polygon points="300,60 304,70 296,70" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><text x="684" y="350" font-size="18" fill="#273b45" text-anchor="middle">σ</text><text x="310" y="66" font-size="18" fill="#273b45" text-anchor="start">τ</text><path d="M300 330 A153 153 0 0 1 606 330" stroke="#287aab" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="300" y1="177" x2="680" y2="177" stroke="#b64f4f" stroke-width="2.5" stroke-dasharray="10 6"/><text x="680" y="165" font-size="16" fill="#b64f4f" text-anchor="end">τf = cu, φu = 0</text><line x1="453" y1="330" x2="453" y2="177" stroke="#647780" stroke-width="1.5"/><line x1="446" y1="330" x2="460" y2="330" stroke="#647780" stroke-width="1.5"/><line x1="446" y1="177" x2="460" y2="177" stroke="#647780" stroke-width="1.5"/><text x="463" y="259.5" font-size="16" fill="#647780" text-anchor="start">su = 45 kPa</text><text x="300" y="354" font-size="15" fill="#273b45" text-anchor="middle">0</text><text x="606" y="354" font-size="15" fill="#273b45" text-anchor="middle">qu = 90 kPa</text></g></svg>