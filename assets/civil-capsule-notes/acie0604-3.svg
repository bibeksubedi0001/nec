<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Egg-shaped and circular sewers at low flow</title><desc id="desc">At the same small dry-weather flow, the narrow invert of an egg-shaped sewer keeps the flow deeper than a circular sewer does, helping solids transport; the wide top carries storm flow.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><defs><clipPath id="acie0604-egg-clip"><path d="M120 140 A60 60 0 0 1 240 140 C240 200 205 275 180 290 C155 275 120 200 120 140 Z"/></clipPath><clipPath id="acie0604-circle-clip"><circle cx="500" cy="200" r="80"/></clipPath></defs><text x="180" y="50" font-size="17" fill="#273b45" text-anchor="middle">Egg-shaped</text><path d="M120 140 A60 60 0 0 1 240 140 C240 200 205 275 180 290 C155 275 120 200 120 140 Z" stroke="#e4e8e9" stroke-width="1" fill="#ffffff" stroke-linejoin="round" stroke-linecap="round"/><rect x="110" y="262" width="140" height="40" fill="#d8edf7" clip-path="url(#acie0604-egg-clip)"/><path d="M120 140 A60 60 0 0 1 240 140 C240 200 205 275 180 290 C155 275 120 200 120 140 Z" stroke="#273b45" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="122" y1="150" x2="238" y2="150" stroke="#287aab" stroke-width="1.5" stroke-dasharray="6 4"/><line x1="245" y1="262" x2="245" y2="290" stroke="#647780" stroke-width="1.5"/><line x1="252" y1="262" x2="238" y2="262" stroke="#647780" stroke-width="1.5"/><line x1="252" y1="290" x2="238" y2="290" stroke="#647780" stroke-width="1.5"/><text x="257" y="282" font-size="18" fill="#647780" text-anchor="start">deeper low flow</text><text x="500" y="50" font-size="17" fill="#273b45" text-anchor="middle">Circular</text><circle cx="500" cy="200" r="80" fill="#ffffff" stroke="none" stroke-width="2"/><rect x="410" y="268" width="180" height="20" fill="#d8edf7" clip-path="url(#acie0604-circle-clip)"/><circle cx="500" cy="200" r="80" fill="none" stroke="#273b45" stroke-width="4"/><line x1="598" y1="268" x2="598" y2="280" stroke="#647780" stroke-width="1.5"/><line x1="605" y1="268" x2="591" y2="268" stroke="#647780" stroke-width="1.5"/><line x1="605" y1="280" x2="591" y2="280" stroke="#647780" stroke-width="1.5"/><text x="610" y="280" font-size="18" fill="#647780" text-anchor="start">shallow</text><text x="180" y="340" font-size="14" fill="#273b45" text-anchor="middle">narrow invert concentrates dry-weather flow</text><text x="180" y="362" font-size="14" fill="#287aab" text-anchor="middle">wide top carries the storm flow</text><text x="500" y="340" font-size="14" fill="#273b45" text-anchor="middle">same small flow spreads thin</text><text x="500" y="362" font-size="14" fill="#647780" text-anchor="middle">less depth, more deposition</text><text x="360" y="400" font-size="14" fill="#647780" text-anchor="middle">Traditional for combined sewers; not a guarantee of self-cleansing</text></g></svg>