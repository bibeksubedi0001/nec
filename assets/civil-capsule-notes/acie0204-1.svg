<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Sampler area ratio and cone tip angle</title><desc id="desc">The area ratio divides the cutting-edge annulus by the inside area, 21 percent for 55 and 50 mm; a 60 degree Dutch cone has a 30 degree semi-angle from its axis.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="380" y1="36" x2="380" y2="400" stroke="#b8c8ce" stroke-width="1.5" stroke-dasharray="6 6"/><circle cx="215" cy="190" r="121" fill="#d6dfe3" stroke="#466d89" stroke-width="2"/><circle cx="215" cy="190" r="110" fill="#f0e6d4" stroke="#466d89" stroke-width="2"/><text x="215" y="150" font-size="16" fill="#273b45" text-anchor="middle">sample area</text><text x="215" y="174" font-size="16" fill="#273b45" text-anchor="middle">π Di² / 4</text><line x1="105" y1="190" x2="325" y2="190" stroke="#647780" stroke-width="1.5"/><line x1="105" y1="183" x2="105" y2="197" stroke="#647780" stroke-width="1.5"/><line x1="325" y1="183" x2="325" y2="197" stroke="#647780" stroke-width="1.5"/><text x="215" y="208" font-size="16" fill="#647780" text-anchor="middle">Di</text><line x1="215" y1="69" x2="52" y2="69" stroke="#647780" stroke-width="1.2" stroke-dasharray="4 4"/><line x1="215" y1="311" x2="52" y2="311" stroke="#647780" stroke-width="1.2" stroke-dasharray="4 4"/><line x1="60" y1="69" x2="60" y2="311" stroke="#647780" stroke-width="1.5"/><line x1="67" y1="69" x2="53" y2="69" stroke="#647780" stroke-width="1.5"/><line x1="67" y1="311" x2="53" y2="311" stroke="#647780" stroke-width="1.5"/><text x="52" y="196" font-size="16" fill="#647780" text-anchor="end">Do</text><text x="215" y="346" font-size="16" fill="#273b45" text-anchor="middle">Do = 55 mm, Di = 50 mm</text><text x="215" y="372" font-size="16" fill="#273b45" text-anchor="middle">Ar = (Do² − Di²) / Di²</text><text x="215" y="398" font-size="16" fill="#2b7b61" text-anchor="middle">= 525 / 2500 = 21%</text><rect x="525" y="60" width="30" height="150" fill="#d6dfe3" stroke="#466d89" stroke-width="2"/><polygon points="465,210 615,210 540,340" fill="#c9d6de" stroke="#466d89" stroke-width="2" stroke-linejoin="round"/><line x1="540" y1="50" x2="540" y2="372" stroke="#647780" stroke-width="1.2" stroke-dasharray="6 5"/><path d="M540 284 A56 56 0 0 1 568 291.5" stroke="#2b7b61" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="578" y="304" font-size="16" fill="#2b7b61" text-anchor="start">30°</text><path d="M499 268.99 A82 82 0 0 1 581 268.99" stroke="#287aab" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="478" y="280" font-size="16" fill="#287aab" text-anchor="end">60°</text><text x="540" y="398" font-size="16" fill="#273b45" text-anchor="middle">Dutch cone tip</text></g></svg>