<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Active pressure in cohesive backfill</title><desc id="desc">The cohesion term makes the ideal pressure negative above z0 = 2c'/(γ√Ka), a potential tension-crack zone; it is never counted as a stabilizing force.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><rect x="130" y="60" width="30" height="300" fill="#d6dfe3" stroke="#273b45" stroke-width="2"/><polygon points="160,60 300,60 300,360 160,360" fill="#f0e6d4" stroke="none" stroke-width="2" stroke-linejoin="round"/><path d="M182 60 L188 92 L183 124 L189 150 L185 171" stroke="#b64f4f" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="210" y="110" font-size="15" fill="#b64f4f" text-anchor="start">crack</text><line x1="420" y1="50" x2="420" y2="372" stroke="#273b45" stroke-width="2"/><polygon points="420,60 340,60 420,171" fill="#f2dfdf" stroke="#b64f4f" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 5"/><polygon points="420,171 420,360 556,360" fill="#e6f1f8" stroke="#287aab" stroke-width="2" stroke-linejoin="round"/><text x="336" y="50" font-size="16" fill="#b64f4f" text-anchor="end">−2c'√Ka</text><text x="430" y="110" font-size="15" fill="#b64f4f" text-anchor="start">tension zone</text><text x="560" y="384" font-size="16" fill="#287aab" text-anchor="middle">Ka γ z − 2c'√Ka</text><line x1="612" y1="60" x2="612" y2="171" stroke="#647780" stroke-width="1.5"/><line x1="619" y1="60" x2="605" y2="60" stroke="#647780" stroke-width="1.5"/><line x1="619" y1="171" x2="605" y2="171" stroke="#647780" stroke-width="1.5"/><text x="622" y="121.5" font-size="18" fill="#647780" text-anchor="start">z0</text><text x="428" y="334" font-size="15" fill="#287aab" text-anchor="start">compressive</text><text x="622" y="146" font-size="14" fill="#647780" text-anchor="start">2c' / (γ √Ka)</text></g></svg>