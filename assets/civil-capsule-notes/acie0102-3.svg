<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Gauge length and neck area in a tensile test</title><desc id="desc">Elongation compares the fractured gauge length with the original; reduction in area compares the neck area with the original area.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><text x="60" y="72" font-size="17" fill="#273b45" text-anchor="start">Before test</text><rect x="60" y="86" width="400" height="30" fill="#cfdbe2" stroke="#466d89" stroke-width="2"/><line x1="120" y1="80" x2="120" y2="122" stroke="#273b45" stroke-width="2.5"/><line x1="400" y1="80" x2="400" y2="122" stroke="#273b45" stroke-width="2.5"/><line x1="120" y1="140" x2="400" y2="140" stroke="#647780" stroke-width="1.5"/><line x1="120" y1="133" x2="120" y2="147" stroke="#647780" stroke-width="1.5"/><line x1="400" y1="133" x2="400" y2="147" stroke="#647780" stroke-width="1.5"/><text x="260" y="164" font-size="18" fill="#647780" text-anchor="middle">L0, original gauge length</text><text x="60" y="214" font-size="17" fill="#273b45" text-anchor="start">After fracture</text><polygon points="60,230 236,230 262,239 266,245 262,251 236,260 60,260" fill="#cfdbe2" stroke="#466d89" stroke-width="2" stroke-linejoin="round"/><polygon points="480,230 304,230 278,239 274,245 278,251 304,260 480,260" fill="#cfdbe2" stroke="#466d89" stroke-width="2" stroke-linejoin="round"/><line x1="120" y1="224" x2="120" y2="266" stroke="#273b45" stroke-width="2.5"/><line x1="420" y1="224" x2="420" y2="266" stroke="#273b45" stroke-width="2.5"/><line x1="270" y1="226" x2="270" y2="196" stroke="#647780" stroke-width="1.5"/><text x="282" y="194" font-size="16" fill="#273b45" text-anchor="start">neck: minimum area Af</text><line x1="120" y1="282" x2="420" y2="282" stroke="#647780" stroke-width="1.5"/><line x1="120" y1="275" x2="120" y2="289" stroke="#647780" stroke-width="1.5"/><line x1="420" y1="275" x2="420" y2="289" stroke="#647780" stroke-width="1.5"/><text x="270" y="306" font-size="18" fill="#647780" text-anchor="middle">Lf, after fracture</text><text x="505" y="96" font-size="17" fill="#273b45" text-anchor="start">A0 = 100 mm²</text><text x="505" y="122" font-size="17" fill="#273b45" text-anchor="start">Af = 64 mm²</text><text x="505" y="148" font-size="17" fill="#2b7b61" text-anchor="start">RA = 36%</text><text x="300" y="356" font-size="17" fill="#273b45" text-anchor="middle">Elongation e = (Lf − L0) / L0 × 100%</text><text x="300" y="386" font-size="17" fill="#273b45" text-anchor="middle">Reduction of area RA = (A0 − Af) / A0 × 100%</text></g></svg>