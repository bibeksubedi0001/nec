294" y1="121" x2="284" y2="132" stroke="#647780" stroke-width="1.4"/><line x1="308" y1="121" x2="298" y2="132" stroke="#647780" stroke-width="1.4"/><line x1="322" y1="121" x2="312" y2="132" stroke="#647780" stroke-width="1.4"/><line x1="336" y1="121" x2="326" y2="132" stroke="#647780" stroke-width="1.4"/><line x1="350" y1="121" x2="340" y2="132" stroke="#647780" stroke-width="1.4"/><line x1="364" y1="121" x2="354" y2="132" stroke="#647780" stroke-width="1.4"/><line x1="378" y1="121" x2="368" y2="132" stroke="#647780" stroke-width="1.4"/><line x1="392" y1="121" x2="382" y2="132" stroke="#647780" stroke-width="1.4"/><line x1="406" y1="121" x2="396" y2="132" stroke="#647780" stroke-width="1.4"/><line x1="420" y1="121" x2="410" y2="132" stroke="#647780" stroke-width="1.4"/><line x1="434" y1="121" x2="424" y2="132" stroke="#647780" stroke-width="1.4"/><line x1="250" y1="34" x2="250" y2="250" stroke="#466d89" stroke-width="5"/><ellipse cx="250" cy="58" rx="44" ry="11" fill="none" stroke="#b64f4f" stroke-width="2.5"/><polygon points="294,60 289.5,49 298.5,49" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="304" y="50" font-size="19" fill="#b64f4f" text-anchor="start">T</text><rect x="200" y="200" width="100" height="100" fill="#c9d6de" stroke="#466d89" stroke-width="2"/><line x1="250" y1="200" x2="250" y2="300" stroke="#466d89" stroke-width="4"/><ellipse cx="250" cy="200" rx="50" ry="10" fill="none" stroke="#287aab" stroke-width="2" stroke-dasharray="6 5"/><ellipse cx="250" cy="300" rx="50" ry="10" fill="none" stroke="#287aab" stroke-width="2" stroke-dasharray="6 5"/><line x1="200" y1="332" x2="300" y2="332" stroke="#647780" stroke-width="1.5"/><line x1="200" y1="325" x2="200" y2="339" stroke="#647780" stroke-width="1.5"/><line x1="300" y1="325" x2="300" y2="339" stroke="#647780" stroke-width="1.5"/><text x="250" y="348" font-size="18" fill="#647780" text-anchor="middle">D</text><line x1="176" y1="200" x2="176" y2="300" stroke="#647780"