<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Storage needed to bridge a dry-season deficit</title><desc id="desc">Active storage is the demand minus inflow summed over the deficit period; a reservoir can only redistribute water it is able to refill in the wet season.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="100" y1="320" x2="626" y2="320" stroke="#647780" stroke-width="2"/><polygon points="634,320 624,324 624,316" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><line x1="100" y1="320" x2="100" y2="64" stroke="#647780" stroke-width="2"/><polygon points="100,56 104,66 96,66" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><text x="360" y="360" font-size="16" fill="#273b45" text-anchor="middle">Time, days</text><text x="106" y="46" font-size="16" fill="#273b45" text-anchor="start">Flow, m³/s</text><rect x="282" y="170" width="130" height="100" fill="#f2dfdf" stroke="none" stroke-width="2"/><path d="M100 95 L276.8 95 L282 270 L412 270 L417.2 120 L620 120" stroke="#287aab" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="100" y1="170" x2="620" y2="170" stroke="#b64f4f" stroke-width="2.5" stroke-dasharray="10 6"/><text x="347" y="226" font-size="15" fill="#b64f4f" text-anchor="middle">active storage</text><text x="160" y="88" font-size="15" fill="#287aab" text-anchor="middle">inflow</text><text x="620" y="162" font-size="15" fill="#b64f4f" text-anchor="end">demand 3 m³/s</text><text x="347" y="300" font-size="15" fill="#287aab" text-anchor="middle">dry spell: inflow 1 m³/s for 10 days</text><text x="360" y="384" font-size="16" fill="#273b45" text-anchor="middle">V = (3 − 1) × 10 × 86400 = 1.728 × 10⁶ m³ before losses</text><text x="360" y="408" font-size="14" fill="#647780" text-anchor="middle">Evaporation, seepage and dead storage raise the gross capacity</text></g></svg>