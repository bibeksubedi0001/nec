<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Tendon stress from initial to effective prestress</title><desc id="desc">Elastic shortening, duct friction and anchorage seating act during tensioning and transfer; creep, shrinkage and relaxation reduce the stress further with time.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="100" y1="320" x2="626" y2="320" stroke="#647780" stroke-width="2"/><polygon points="634,320 624,324 624,316" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><line x1="100" y1="320" x2="100" y2="64" stroke="#647780" stroke-width="2"/><polygon points="100,56 104,66 96,66" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><text x="360" y="360" font-size="16" fill="#273b45" text-anchor="middle">Time after tensioning</text><text x="106" y="46" font-size="16" fill="#273b45" text-anchor="start">Tendon stress, MPa</text><path d="M100 105.71 L162.4 105.71 L172.8 170 L172.8 170 L183.2 177.82 L193.6 184.96 L204 191.48 L214.4 197.44 L224.8 202.87 L235.2 207.84 L245.6 212.37 L256 216.51 L266.4 220.29 L276.8 223.74 L287.2 226.89 L297.6 229.77 L308 232.4 L318.4 234.79 L328.8 236.98 L339.2 238.98 L349.6 240.81 L360 242.48 L370.4 244 L380.8 245.39 L391.2 246.66 L401.6 247.82 L412 248.88 L422.4 249.84 L432.8 250.73 L443.2 251.53 L453.6 252.27 L464 252.94 L474.4 253.55 L484.8 254.11 L495.2 254.63 L505.6 255.09 L516 255.52 L526.4 255.91 L536.8 256.26 L547.2 256.59 L557.6 256.89 L568 257.16 L578.4 257.4 L588.8 257.63 L599.2 257.83 L609.6 258.02 L620 258.19" stroke="#287aab" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="100" y1="260" x2="620" y2="260" stroke="#647780" stroke-width="1.2" stroke-dasharray="5 4"/><text x="94" y="110.71" font-size="13" fill="#647780" text-anchor="end">1200</text><text x="94" y="265" font-size="13" fill="#647780" text-anchor="end">984</text><text x="183.2" y="112.86" font-size="14" fill="#b64f4f" text-anchor="start">immediate: elastic shortening,</text><text x="183.2" y="132.86" font-size="14" fill="#b64f4f" text-anchor="start">duct friction, anchorage seating</text><text x="386" y="212.86" font-size="14" fill="#b98232" text-anchor="start">with time: creep, shrinkage, relaxation</text><text x="360" y="384" font-size="15" fill="#273b45" text-anchor="middle">fpe = (1 − 0.18) × 1200 = 984 MPa; the 216 MPa difference is the loss</text><text x="360" y="408" font-size="14" fill="#647780" text-anchor="middle">Actual losses depend on the system, materials and sequence</text></g></svg>