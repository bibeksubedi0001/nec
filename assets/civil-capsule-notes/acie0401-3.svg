<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">A concentrated couple on a simple beam</title><desc id="desc">A couple adds no net force: the reactions form an opposing couple, the shear stays constant and continuous, and the moment diagram jumps by the couple's value.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="100" y1="110" x2="620" y2="110" stroke="#273b45" stroke-width="7"/><polygon points="100,117 85,141 115,141" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><line x1="78" y1="144" x2="122" y2="144" stroke="#647780" stroke-width="2"/><polygon points="620,117 605,138 635,138" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><circle cx="612" cy="144" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><circle cx="628" cy="144" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><line x1="598" y1="151" x2="642" y2="151" stroke="#647780" stroke-width="2"/><path d="M250.82 123 A26 26 0 1 1 295.85 123" stroke="#2b7b61" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="295.85,123 297.45,111.22 305.25,115.72" fill="#2b7b61" stroke="#2b7b61" stroke-width="1.5" stroke-linejoin="round"/><text x="273.33" y="74" font-size="16" fill="#2b7b61" text-anchor="middle">M0 = 12 kN·m</text><text x="100" y="172" font-size="14" fill="#287aab" text-anchor="middle">RA = 2 kN down</text><text x="620" y="172" font-size="14" fill="#287aab" text-anchor="middle">RB = 2 kN up</text><text x="40" y="215" font-size="15" fill="#647780" text-anchor="start">SFD</text><polygon points="100,210 100,234 620,234 620,210" fill="#e6f1f8" stroke="none" stroke-width="2" stroke-linejoin="round"/><line x1="100" y1="210" x2="620" y2="210" stroke="#647780" stroke-width="1.5"/><path d="M100 234 L620 234" stroke="#287aab" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="360" y="252" font-size="14" fill="#287aab" text-anchor="middle">V = −M0 / L = −2 kN everywhere</text><text x="40" y="325" font-size="15" fill="#647780" text-anchor="start">BMD</text><polygon points="100,320 100,320 273.33,344 273.33,272 620,320 620,320" fill="#f2dfdf" stroke="none" stroke-width="2" stroke-linejoin="round"/><line x1="100" y1="320" x2="620" y2="320" stroke="#647780" stroke-width="1.5"/><path d="M100 320 L273.33 344 L273.33 272 L620 320" stroke="#b64f4f" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="289.33" y1="337.6" x2="289.33" y2="278.4" stroke="#2b7b61" stroke-width="2"/><polygon points="289.33,272 292.83,280 285.83,280" fill="#2b7b61" stroke="#2b7b61" stroke-width="1.5" stroke-linejoin="round"/><polygon points="289.33,344 285.83,336 292.83,336" fill="#2b7b61" stroke="#2b7b61" stroke-width="1.5" stroke-linejoin="round"/><text x="299.33" y="300" font-size="14" fill="#2b7b61" text-anchor="start">jump = M0</text><text x="265.33" y="362" font-size="14" fill="#b64f4f" text-anchor="end">−4</text><text x="265.33" y="276" font-size="14" fill="#b64f4f" text-anchor="end">+8</text><text x="360" y="396" font-size="14" fill="#647780" text-anchor="middle">Equal and opposite end couples instead give zero shear and a constant moment</text></g></svg>