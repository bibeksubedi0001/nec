<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Purlins at panel points versus between them</title><desc id="desc">Purlins placed at the top-chord joints keep the ideal truss members axial; a purlin between joints bends the rafter, which must then be designed as a beam-column.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><path d="M60 260 L195 140 L330 260 L60 260" stroke="#273b45" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="127.5" y1="200" x2="127.5" y2="260" stroke="#273b45" stroke-width="2"/><line x1="195" y1="140" x2="195" y2="260" stroke="#273b45" stroke-width="2"/><line x1="262.5" y1="200" x2="262.5" y2="260" stroke="#273b45" stroke-width="2"/><line x1="127.5" y1="200" x2="195" y2="260" stroke="#273b45" stroke-width="2"/><line x1="262.5" y1="200" x2="195" y2="260" stroke="#273b45" stroke-width="2"/><rect x="120.5" y="184" width="14" height="12" fill="#b98232" stroke="#273b45" stroke-width="1"/><line x1="127.5" y1="152" x2="127.5" y2="176.4" stroke="#b64f4f" stroke-width="2"/><polygon points="127.5,182 124.5,175 130.5,175" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><rect x="188" y="124" width="14" height="12" fill="#b98232" stroke="#273b45" stroke-width="1"/><line x1="195" y1="92" x2="195" y2="116.4" stroke="#b64f4f" stroke-width="2"/><polygon points="195,122 192,115 198,115" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><rect x="255.5" y="184" width="14" height="12" fill="#b98232" stroke="#273b45" stroke-width="1"/><line x1="262.5" y1="152" x2="262.5" y2="176.4" stroke="#b64f4f" stroke-width="2"/><polygon points="262.5,182 259.5,175 265.5,175" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><path d="M390 260 L525 140 L660 260 L390 260" stroke="#273b45" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="457.5" y1="200" x2="457.5" y2="260" stroke="#273b45" stroke-width="2"/><line x1="525" y1="140" x2="525" y2="260" stroke="#273b45" stroke-width="2"/><line x1="592.5" y1="200" x2="592.5" y2="260" stroke="#273b45" stroke-width="2"/><line x1="457.5" y1="200" x2="525" y2="260" stroke="#273b45" stroke-width="2"/><line x1="592.5" y1="200" x2="525" y2="260" stroke="#273b45" stroke-width="2"/><rect x="416.75" y="214" width="14" height="12" fill="#b98232" stroke="#273b45" stroke-width="1"/><line x1="423.75" y1="182" x2="423.75" y2="206.4" stroke="#b64f4f" stroke-width="2"/><polygon points="423.75,212 420.75,205 426.75,205" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><rect x="484.25" y="154" width="14" height="12" fill="#b98232" stroke="#273b45" stroke-width="1"/><line x1="491.25" y1="122" x2="491.25" y2="146.4" stroke="#b64f4f" stroke-width="2"/><polygon points="491.25,152 488.25,145 494.25,145" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><rect x="551.75" y="154" width="14" height="12" fill="#b98232" stroke="#273b45" stroke-width="1"/><line x1="558.75" y1="122" x2="558.75" y2="146.4" stroke="#b64f4f" stroke-width="2"/><polygon points="558.75,152 555.75,145 561.75,145" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><rect x="619.25" y="214" width="14" height="12" fill="#b98232" stroke="#273b45" stroke-width="1"/><line x1="626.25" y1="182" x2="626.25" y2="206.4" stroke="#b64f4f" stroke-width="2"/><polygon points="626.25,212 623.25,205 629.25,205" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="195" y="300" font-size="14" fill="#273b45" text-anchor="middle">purlins at panel points:</text><text x="195" y="322" font-size="14" fill="#2b7b61" text-anchor="middle">members stay axial</text><text x="525" y="300" font-size="14" fill="#273b45" text-anchor="middle">purlins between joints:</text><text x="525" y="322" font-size="14" fill="#b64f4f" text-anchor="middle">rafter becomes a beam-column</text><text x="360" y="372" font-size="15" fill="#273b45" text-anchor="middle">Purlin as a simple beam: M = wL²/8 = 2 × 4² / 8 = 4.0 kN·m</text><text x="360" y="398" font-size="14" fill="#647780" text-anchor="middle">Another coefficient needs its own continuity and loading assumptions</text></g></svg>