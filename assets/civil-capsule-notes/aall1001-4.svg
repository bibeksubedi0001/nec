<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Representative fraction and the radius symbol</title><desc id="desc">Both lengths must be in one unit: 5 cm for 250 m = 25000 cm is RF 1:5000, not 1:50; a 600 mm part drawn 60 mm long is at 1:10. A curve marked R25 has the curvature of a 50 mm diameter circle.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><text x="205" y="70" font-size="15" fill="#273b45" text-anchor="middle">Representative fraction</text><rect x="80" y="110" width="50" height="14" fill="#273b45" stroke="#273b45" stroke-width="1.5"/><rect x="130" y="110" width="50" height="14" fill="#ffffff" stroke="#273b45" stroke-width="1.5"/><rect x="180" y="110" width="50" height="14" fill="#273b45" stroke="#273b45" stroke-width="1.5"/><rect x="230" y="110" width="50" height="14" fill="#ffffff" stroke="#273b45" stroke-width="1.5"/><rect x="280" y="110" width="50" height="14" fill="#273b45" stroke="#273b45" stroke-width="1.5"/><text x="80" y="144" font-size="12" fill="#273b45" text-anchor="middle">0</text><text x="130" y="144" font-size="12" fill="#273b45" text-anchor="middle">50</text><text x="180" y="144" font-size="12" fill="#273b45" text-anchor="middle">100</text><text x="230" y="144" font-size="12" fill="#273b45" text-anchor="middle">150</text><text x="280" y="144" font-size="12" fill="#273b45" text-anchor="middle">200</text><text x="330" y="144" font-size="12" fill="#273b45" text-anchor="middle">250</text><text x="340" y="144" font-size="12" fill="#273b45" text-anchor="start">m</text><text x="205" y="180" font-size="14" fill="#273b45" text-anchor="middle">5 cm on the map = 250 m = 25000 cm</text><text x="205" y="206" font-size="15" fill="#287aab" text-anchor="middle">RF = 5/25000 = 1:5000, not 1:50</text><text x="205" y="250" font-size="14" fill="#273b45" text-anchor="middle">600 mm drawn 60 mm long: 60/600 = 1:10</text><text x="205" y="274" font-size="13" fill="#647780" text-anchor="middle">a reducing scale; 10:1 would enlarge</text><line x1="380" y1="40" x2="380" y2="320" stroke="#b8c8ce" stroke-width="1.5" stroke-dasharray="6 5"/><text x="560" y="70" font-size="15" fill="#273b45" text-anchor="middle">Radius symbol</text><circle cx="560" cy="200" r="60" fill="none" stroke="#273b45" stroke-width="3"/><line x1="560" y1="200" x2="597.31" y2="162.69" stroke="#b64f4f" stroke-width="2.5"/><polygon points="602.4,157.6 598.86,166.79 593.21,161.14" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="612" y="152" font-size="16" fill="#b64f4f" text-anchor="start">R25</text><line x1="500" y1="284" x2="620" y2="284" stroke="#647780" stroke-width="1.5"/><line x1="500" y1="277" x2="500" y2="291" stroke="#647780" stroke-width="1.5"/><line x1="620" y1="277" x2="620" y2="291" stroke="#647780" stroke-width="1.5"/><text x="560" y="310" font-size="14" fill="#647780" text-anchor="middle">D = 2R = 50 mm</text><text x="360" y="370" font-size="14" fill="#273b45" text-anchor="middle">Dimensions state the object's size, whatever the scale</text></g></svg>