<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Load dispersion into a steel beam web</title><desc id="desc">A concentrated load spreads through the flange and web; at 45 degrees the spread on each side equals the depth travelled, giving b + 2h for an 80 mm bearing and 120 mm depth.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><rect x="80" y="116" width="560" height="184" fill="#d6dfe3" stroke="none" stroke-width="2"/><rect x="80" y="100" width="560" height="16" fill="#466d89" stroke="#273b45" stroke-width="2"/><rect x="80" y="300" width="560" height="16" fill="#466d89" stroke="#273b45" stroke-width="2"/><rect x="320" y="86" width="80" height="14" fill="#b98232" stroke="#273b45" stroke-width="2"/><line x1="360" y1="40" x2="360" y2="75.2" stroke="#b64f4f" stroke-width="3.5"/><polygon points="360,84 355.5,73 364.5,73" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="360" y="30" font-size="14" fill="#b64f4f" text-anchor="middle">concentrated load</text><line x1="320" y1="100" x2="200" y2="220" stroke="#b64f4f" stroke-width="2" stroke-dasharray="6 4"/><line x1="400" y1="100" x2="520" y2="220" stroke="#b64f4f" stroke-width="2" stroke-dasharray="6 4"/><line x1="200" y1="238" x2="520" y2="238" stroke="#647780" stroke-width="1.5"/><line x1="200" y1="231" x2="200" y2="245" stroke="#647780" stroke-width="1.5"/><line x1="520" y1="231" x2="520" y2="245" stroke="#647780" stroke-width="1.5"/><text x="360" y="254" font-size="15" fill="#647780" text-anchor="middle">b + 2h = 80 + 2 × 120 = 320 mm</text><line x1="560" y1="100" x2="560" y2="220" stroke="#647780" stroke-width="1.5"/><line x1="567" y1="100" x2="553" y2="100" stroke="#647780" stroke-width="1.5"/><line x1="567" y1="220" x2="553" y2="220" stroke="#647780" stroke-width="1.5"/><text x="568" y="166" font-size="14" fill="#647780" text-anchor="start">h = 120</text><text x="250" y="140" font-size="14" fill="#b64f4f" text-anchor="middle">45°</text><text x="360" y="350" font-size="14" fill="#273b45" text-anchor="middle">Web crippling: local yielding or crushing next to the load</text><text x="360" y="374" font-size="14" fill="#273b45" text-anchor="middle">Local web buckling: a slender web bows sideways under local compression</text><text x="360" y="398" font-size="14" fill="#647780" text-anchor="middle">Shear buckling: a deep panel under in-plane shear, away from the load</text></g></svg>