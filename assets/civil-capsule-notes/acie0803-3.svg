<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Phreatic line through an earth dam, and sloughing</title><desc id="desc">The phreatic surface is the surface of zero gauge pore pressure; under the Dupuit idealisation h² varies linearly with distance, a parabola. If saturation reaches the downstream face, shallow slips cause sloughing.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><polygon points="80,300 300,90 360,90 640,300" fill="#f0e6d4" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><polygon points="20,120 269,120 80,300 20,300" fill="#d8edf7" stroke="none" stroke-width="2" stroke-linejoin="round"/><line x1="20" y1="120" x2="269" y2="120" stroke="#287aab" stroke-width="2"/><polygon points="540,300 590,262 640,300" fill="#d6dfe3" stroke="#273b45" stroke-width="1.5" stroke-linejoin="round"/><path d="M269 120 L273.85 121.5 L278.7 123.01 L283.55 124.54 L288.4 126.08 L293.25 127.64 L298.1 129.2 L302.95 130.79 L307.8 132.38 L312.65 134 L317.5 135.63 L322.35 137.27 L327.2 138.93 L332.05 140.61 L336.9 142.31 L341.75 144.03 L346.6 145.76 L351.45 147.52 L356.3 149.29 L361.15 151.09 L366 152.9 L370.85 154.75 L375.7 156.61 L380.55 158.5 L385.4 160.41 L390.25 162.35 L395.1 164.32 L399.95 166.32 L404.8 168.35 L409.65 170.41 L414.5 172.5 L419.35 174.63 L424.2 176.8 L429.05 179 L433.9 181.24 L438.75 183.53 L443.6 185.87 L448.45 188.25 L453.3 190.68 L458.15 193.17 L463 195.72 L467.85 198.33 L472.7 201.02 L477.55 203.77 L482.4 206.61 L487.25 209.54 L492.1 212.56 L496.95 215.7 L501.8 218.95 L506.65 222.34 L511.5 225.89 L516.35 229.61 L521.2 233.55 L526.05 237.73 L530.9 242.21 L535.75 247.07 L540.6 252.42 L545.45 258.46 L550.3 265.54 L555.15 274.52 L560 289.47" stroke="#287aab" stroke-width="2.5" fill="none" stroke-dasharray="8 4" stroke-linejoin="round" stroke-linecap="round"/><path d="M269 120 Q430 150 556 238" stroke="#b64f4f" stroke-width="2" fill="none" stroke-dasharray="4 4" stroke-linejoin="round" stroke-linecap="round"/><path d="M548 234 Q572 262 600 262" stroke="#b64f4f" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M580 256 Q602 280 626 284" stroke="#b64f4f" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="360" y="236" font-size="14" fill="#287aab" text-anchor="middle">phreatic line (zero gauge pressure)</text><text x="590" y="318" font-size="13" fill="#273b45" text-anchor="middle">toe drain</text><line x1="20" y1="300" x2="700" y2="300" stroke="#273b45" stroke-width="2"/><text x="360" y="344" font-size="14" fill="#287aab" text-anchor="middle">h² varies linearly with x: an idealised parabola (Dupuit)</text><text x="360" y="368" font-size="14" fill="#b64f4f" text-anchor="middle">Saturation reaching the face → repeated shallow slips: sloughing</text><text x="360" y="392" font-size="13" fill="#647780" text-anchor="middle">Piping is a different mechanism: an internal erosion path</text></g></svg>