<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Cube, cylinder and pullout tests</title><desc id="desc">Platen friction confines more of a short cube, so cubes read higher than cylinders; a pullout test measures a resistance that must be correlated with compressive strength.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><rect x="70" y="138" width="140" height="12" fill="#466d89" stroke="#466d89" stroke-width="2"/><rect x="70" y="270" width="140" height="12" fill="#466d89" stroke="#466d89" stroke-width="2"/><rect x="80" y="150" width="120" height="120" fill="#e4e8e9" stroke="#273b45" stroke-width="2"/><polygon points="80,150 200,150 140,210" fill="#f5ead8" stroke="#b98232" stroke-width="1.2" stroke-linejoin="round"/><polygon points="80,270 200,270 140,210" fill="#f5ead8" stroke="#b98232" stroke-width="1.2" stroke-linejoin="round"/><rect x="250" y="84" width="110" height="12" fill="#466d89" stroke="#466d89" stroke-width="2"/><rect x="250" y="276" width="110" height="12" fill="#466d89" stroke="#466d89" stroke-width="2"/><rect x="260" y="96" width="90" height="180" fill="#e4e8e9" stroke="#273b45" stroke-width="2"/><polygon points="260,96 350,96 305,141" fill="#f5ead8" stroke="#b98232" stroke-width="1.2" stroke-linejoin="round"/><polygon points="260,276 350,276 305,231" fill="#f5ead8" stroke="#b98232" stroke-width="1.2" stroke-linejoin="round"/><text x="140" y="306" font-size="15" fill="#273b45" text-anchor="middle">cube 150 mm</text><text x="305" y="306" font-size="15" fill="#273b45" text-anchor="middle">cylinder</text><text x="215" y="70" font-size="14" fill="#b98232" text-anchor="middle">shaded: platen-restrained zones</text><rect x="450" y="170" width="230" height="150" fill="#e4e8e9" stroke="#273b45" stroke-width="2"/><line x1="565" y1="170" x2="565" y2="246" stroke="#466d89" stroke-width="6"/><rect x="545" y="246" width="40" height="8" fill="#466d89" stroke="#466d89" stroke-width="2"/><rect x="490" y="158" width="24" height="12" fill="#d6dfe3" stroke="#273b45" stroke-width="2"/><rect x="616" y="158" width="24" height="12" fill="#d6dfe3" stroke="#273b45" stroke-width="2"/><line x1="490" y1="158" x2="640" y2="158" stroke="#273b45" stroke-width="2"/><line x1="545" y1="254" x2="514" y2="170" stroke="#b64f4f" stroke-width="1.5" stroke-dasharray="5 4"/><line x1="585" y1="254" x2="616" y2="170" stroke="#b64f4f" stroke-width="1.5" stroke-dasharray="5 4"/><line x1="565" y1="154" x2="565" y2="98.8" stroke="#b64f4f" stroke-width="3"/><polygon points="565,90 569.5,101 560.5,101" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="575" y="104" font-size="14" fill="#b64f4f" text-anchor="start">pull</text><text x="565" y="344" font-size="14" fill="#273b45" text-anchor="middle">pullout: correlate with compressive strength</text><text x="360" y="380" font-size="14" fill="#647780" text-anchor="middle">Destructive: cube crushing. Indirect: rebound hammer, pulse velocity</text><text x="360" y="404" font-size="14" fill="#273b45" text-anchor="middle">14 N/mm² per min × 22500 mm² = 315 kN/min = 5.25 kN/s</text></g></svg>