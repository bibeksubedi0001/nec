<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Which CBR value to report</title><desc id="desc">The 2.5 mm CBR is ordinarily reported. If the 5 mm ratio is higher, repeat the test; adopt the 5 mm value only if the repeat confirms it, otherwise report the 2.5 mm value.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><rect x="210" y="36" width="300" height="40" rx="8" fill="#e6f1f8" stroke="#287aab" stroke-width="2"/><text x="360" y="61.4" font-size="15" fill="#273b45" text-anchor="middle">CBR at 2.5 mm and at 5 mm</text><line x1="360" y1="78" x2="360" y2="99.2" stroke="#647780" stroke-width="2"/><polygon points="360,108 355.5,97 364.5,97" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><polygon points="360,110 450,140 360,170 270,140" fill="#f5ead8" stroke="#b98232" stroke-width="2" stroke-linejoin="round"/><text x="360" y="145" font-size="14" fill="#273b45" text-anchor="middle">CBR5 &gt; CBR2.5?</text><line x1="450" y1="140" x2="509.2" y2="140" stroke="#647780" stroke-width="2"/><polygon points="518,140 507,144.5 507,135.5" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><text x="484" y="130" font-size="13" fill="#273b45" text-anchor="middle">no</text><rect x="520" y="118" width="170" height="44" rx="8" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><text x="605" y="145.04" font-size="14" fill="#273b45" text-anchor="middle">report the 2.5 mm value</text><line x1="360" y1="170" x2="360" y2="189.2" stroke="#647780" stroke-width="2"/><polygon points="360,198 355.5,187 364.5,187" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><text x="370" y="190" font-size="13" fill="#273b45" text-anchor="start">yes</text><rect x="270" y="200" width="180" height="40" rx="8" fill="#e6f1f8" stroke="#287aab" stroke-width="2"/><text x="360" y="225.4" font-size="15" fill="#273b45" text-anchor="middle">repeat the test</text><line x1="360" y1="242" x2="360" y2="259.2" stroke="#647780" stroke-width="2"/><polygon points="360,268 355.5,257 364.5,257" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><polygon points="360,270 450,300 360,330 270,300" fill="#f5ead8" stroke="#b98232" stroke-width="2" stroke-linejoin="round"/><text x="360" y="305" font-size="14" fill="#273b45" text-anchor="middle">still higher?</text><line x1="270" y1="300" x2="222.8" y2="300" stroke="#647780" stroke-width="2"/><polygon points="214,300 225,295.5 225,304.5" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><text x="244" y="290" font-size="13" fill="#273b45" text-anchor="middle">yes</text><rect x="20" y="278" width="190" height="44" rx="8" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><text x="115" y="304.68" font-size="13" fill="#273b45" text-anchor="middle">adopt the confirmed 5 mm value</text><line x1="450" y1="300" x2="509.2" y2="300" stroke="#647780" stroke-width="2"/><polygon points="518,300 507,304.5 507,295.5" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><text x="484" y="290" font-size="13" fill="#273b45" text-anchor="middle">no</text><rect x="520" y="278" width="170" height="44" rx="8" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><text x="605" y="305.04" font-size="14" fill="#273b45" text-anchor="middle">report the 2.5 mm value</text><text x="360" y="380" font-size="13" fill="#647780" text-anchor="middle">Not averaging, not the difference, not the first-run larger value</text></g></svg>