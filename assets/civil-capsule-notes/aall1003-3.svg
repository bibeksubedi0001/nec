<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Total float and free float on a bar chart</title><desc id="desc">With ES 4, duration 5 and LF 12, the activity can slip from EF 9 to LF 12: total float 3 days. An activity ending on day 7 whose earliest successor starts on day 10 has 3 days of free float.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><rect x="240" y="90" width="200" height="28" rx="4" fill="#e6f1f8" stroke="#287aab" stroke-width="2"/><text x="340" y="109" font-size="13" fill="#287aab" text-anchor="middle">early: ES 4 → EF 9</text><rect x="360" y="136" width="200" height="28" rx="4" fill="#fbfcfd" stroke="#287aab" stroke-width="2" stroke-dasharray="6 4"/><text x="460" y="155" font-size="13" fill="#287aab" text-anchor="middle">late: LS 7 → LF 12</text><line x1="440" y1="178" x2="560" y2="178" stroke="#b64f4f" stroke-width="1.5"/><line x1="440" y1="171" x2="440" y2="185" stroke="#b64f4f" stroke-width="1.5"/><line x1="560" y1="171" x2="560" y2="185" stroke="#b64f4f" stroke-width="1.5"/><text x="500" y="204" font-size="14" fill="#b64f4f" text-anchor="middle">TF = 3</text><rect x="160" y="214" width="200" height="28" rx="4" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><text x="260" y="233" font-size="13" fill="#2b7b61" text-anchor="middle">activity, EF 7</text><rect x="480" y="214" width="120" height="28" rx="4" fill="#f5ead8" stroke="#b98232" stroke-width="2"/><text x="540" y="233" font-size="12" fill="#b98232" text-anchor="middle">successor ES 10</text><line x1="360" y1="256" x2="480" y2="256" stroke="#b64f4f" stroke-width="1.5"/><line x1="360" y1="249" x2="360" y2="263" stroke="#b64f4f" stroke-width="1.5"/><line x1="480" y1="249" x2="480" y2="263" stroke="#b64f4f" stroke-width="1.5"/><text x="420" y="282" font-size="14" fill="#b64f4f" text-anchor="middle">FF = 3</text><line x1="80" y1="300" x2="640" y2="300" stroke="#647780" stroke-width="2"/><line x1="80" y1="300" x2="80" y2="306" stroke="#647780" stroke-width="1.5"/><text x="80" y="322" font-size="13" fill="#273b45" text-anchor="middle">0</text><line x1="160" y1="300" x2="160" y2="306" stroke="#647780" stroke-width="1.5"/><text x="160" y="322" font-size="13" fill="#273b45" text-anchor="middle">2</text><line x1="240" y1="300" x2="240" y2="306" stroke="#647780" stroke-width="1.5"/><text x="240" y="322" font-size="13" fill="#273b45" text-anchor="middle">4</text><line x1="320" y1="300" x2="320" y2="306" stroke="#647780" stroke-width="1.5"/><text x="320" y="322" font-size="13" fill="#273b45" text-anchor="middle">6</text><line x1="400" y1="300" x2="400" y2="306" stroke="#647780" stroke-width="1.5"/><text x="400" y="322" font-size="13" fill="#273b45" text-anchor="middle">8</text><line x1="480" y1="300" x2="480" y2="306" stroke="#647780" stroke-width="1.5"/><text x="480" y="322" font-size="13" fill="#273b45" text-anchor="middle">10</text><line x1="560" y1="300" x2="560" y2="306" stroke="#647780" stroke-width="1.5"/><text x="560" y="322" font-size="13" fill="#273b45" text-anchor="middle">12</text><line x1="640" y1="300" x2="640" y2="306" stroke="#647780" stroke-width="1.5"/><text x="640" y="322" font-size="13" fill="#273b45" text-anchor="middle">14</text><text x="650" y="322" font-size="13" fill="#273b45" text-anchor="start">day</text><text x="360" y="350" font-size="14" fill="#273b45" text-anchor="middle">TF = LF − EF = 12 − 9 = 3 = LS − ES = 7 − 4</text><text x="360" y="374" font-size="13" fill="#273b45" text-anchor="middle">FF = earliest successor ES − EF = 10 − 7 = 3; TF ≥ FF, both zero when critical</text><text x="360" y="398" font-size="13" fill="#647780" text-anchor="middle">Event slack = latest − earliest event time: 11 − 8 = 3 days</text></g></svg>