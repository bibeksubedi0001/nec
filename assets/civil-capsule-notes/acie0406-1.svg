<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Near-end rotational stiffness and the far-end condition</title><desc id="desc">The more freedom the far end has, the smaller the moment needed per unit near-end rotation: 4EI/L with the far end fixed, 3EI/L hinged and EI/L guided.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><text x="360" y="44" font-size="16" fill="#647780" text-anchor="middle">EI = 16000 kN·m², L = 4 m</text><line x1="120" y1="110" x2="400" y2="110" stroke="#273b45" stroke-width="7"/><polygon points="120,115 105,139 135,139" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><line x1="98" y1="142" x2="142" y2="142" stroke="#647780" stroke-width="2"/><path d="M139.05 121 A22 22 0 1 0 100.95 121" stroke="#2b7b61" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="100.95,121 91.55,113.72 99.34,109.22" fill="#2b7b61" stroke="#2b7b61" stroke-width="1.5" stroke-linejoin="round"/><line x1="400" y1="82" x2="400" y2="138" stroke="#273b45" stroke-width="3"/><line x1="400" y1="86" x2="411" y2="96" stroke="#647780" stroke-width="1.4"/><line x1="400" y1="98" x2="411" y2="108" stroke="#647780" stroke-width="1.4"/><line x1="400" y1="110" x2="411" y2="120" stroke="#647780" stroke-width="1.4"/><line x1="400" y1="122" x2="411" y2="132" stroke="#647780" stroke-width="1.4"/><line x1="400" y1="134" x2="411" y2="144" stroke="#647780" stroke-width="1.4"/><text x="440" y="106" font-size="15" fill="#273b45" text-anchor="start">far end fixed</text><text x="440" y="130" font-size="15" fill="#2b7b61" text-anchor="start">4EI/L = 16000 kN·m/rad</text><line x1="120" y1="210" x2="400" y2="210" stroke="#273b45" stroke-width="7"/><polygon points="120,215 105,239 135,239" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><line x1="98" y1="242" x2="142" y2="242" stroke="#647780" stroke-width="2"/><path d="M139.05 221 A22 22 0 1 0 100.95 221" stroke="#2b7b61" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="100.95,221 91.55,213.72 99.34,209.22" fill="#2b7b61" stroke="#2b7b61" stroke-width="1.5" stroke-linejoin="round"/><polygon points="400,215 385,239 415,239" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><line x1="378" y1="242" x2="422" y2="242" stroke="#647780" stroke-width="2"/><text x="440" y="206" font-size="15" fill="#273b45" text-anchor="start">far end hinged</text><text x="440" y="230" font-size="15" fill="#2b7b61" text-anchor="start">3EI/L = 12000 kN·m/rad</text><line x1="120" y1="310" x2="400" y2="310" stroke="#273b45" stroke-width="7"/><polygon points="120,315 105,339 135,339" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><line x1="98" y1="342" x2="142" y2="342" stroke="#647780" stroke-width="2"/><path d="M139.05 321 A22 22 0 1 0 100.95 321" stroke="#2b7b61" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="100.95,321 91.55,313.72 99.34,309.22" fill="#2b7b61" stroke="#2b7b61" stroke-width="1.5" stroke-linejoin="round"/><line x1="400" y1="292" x2="400" y2="328" stroke="#273b45" stroke-width="3"/><circle cx="408" cy="301" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><circle cx="408" cy="319" r="4.5" fill="#ffffff" stroke="#273b45" stroke-width="2"/><line x1="416" y1="286" x2="416" y2="334" stroke="#273b45" stroke-width="3"/><line x1="416" y1="290" x2="427" y2="300" stroke="#647780" stroke-width="1.4"/><line x1="416" y1="302" x2="427" y2="312" stroke="#647780" stroke-width="1.4"/><line x1="416" y1="314" x2="427" y2="324" stroke="#647780" stroke-width="1.4"/><line x1="416" y1="326" x2="427" y2="336" stroke="#647780" stroke-width="1.4"/><text x="440" y="306" font-size="15" fill="#273b45" text-anchor="start">far end guided</text><text x="440" y="330" font-size="15" fill="#2b7b61" text-anchor="start">EI/L = 4000 kN·m/rad</text><text x="360" y="392" font-size="14" fill="#647780" text-anchor="middle">MA = (2EI/L)(2θA + θB) with no chord rotation or span load</text></g></svg>