<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Handling crush and machine milking</title><desc id="desc">A crush restrains one animal at a time for treatment. A cow milking cluster has four teat cups; a controlled vacuum draws milk while pulsating liners alternate milking and rest phases.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><text x="180" y="60" font-size="15" fill="#273b45" text-anchor="middle">Handling crush</text><line x1="60" y1="140" x2="300" y2="140" stroke="#273b45" stroke-width="5"/><line x1="60" y1="240" x2="300" y2="240" stroke="#273b45" stroke-width="5"/><rect x="55" y="135" width="10" height="10" fill="#273b45" stroke="#273b45" stroke-width="2"/><rect x="55" y="235" width="10" height="10" fill="#273b45" stroke="#273b45" stroke-width="2"/><rect x="135" y="135" width="10" height="10" fill="#273b45" stroke="#273b45" stroke-width="2"/><rect x="135" y="235" width="10" height="10" fill="#273b45" stroke="#273b45" stroke-width="2"/><rect x="215" y="135" width="10" height="10" fill="#273b45" stroke="#273b45" stroke-width="2"/><rect x="215" y="235" width="10" height="10" fill="#273b45" stroke="#273b45" stroke-width="2"/><rect x="295" y="135" width="10" height="10" fill="#273b45" stroke="#273b45" stroke-width="2"/><rect x="295" y="235" width="10" height="10" fill="#273b45" stroke="#273b45" stroke-width="2"/><line x1="310" y1="140" x2="310" y2="155" stroke="#466d89" stroke-width="4"/><line x1="310" y1="160" x2="310" y2="175" stroke="#466d89" stroke-width="4"/><line x1="310" y1="180" x2="310" y2="195" stroke="#466d89" stroke-width="4"/><line x1="310" y1="200" x2="310" y2="215" stroke="#466d89" stroke-width="4"/><line x1="310" y1="220" x2="310" y2="235" stroke="#466d89" stroke-width="4"/><ellipse cx="180" cy="190" rx="110" ry="38" fill="#d6dfe3" stroke="#273b45" stroke-width="1.5"/><circle cx="300" cy="190" r="16" fill="#d6dfe3" stroke="#273b45" stroke-width="1.5"/><text x="330" y="194" font-size="13" fill="#273b45" text-anchor="start">head gate</text><text x="180" y="280" font-size="13" fill="#273b45" text-anchor="middle">restrains one animal for treatment</text><line x1="375" y1="40" x2="375" y2="320" stroke="#b8c8ce" stroke-width="1.5" stroke-dasharray="6 5"/><text x="545" y="60" font-size="15" fill="#273b45" text-anchor="middle">Machine milking</text><rect x="423" y="84" width="14" height="30" rx="4" fill="#466d89" stroke="#273b45" stroke-width="1"/><line x1="430" y1="114" x2="475" y2="150" stroke="#647780" stroke-width="1.5"/><rect x="453" y="84" width="14" height="30" rx="4" fill="#466d89" stroke="#273b45" stroke-width="1"/><line x1="460" y1="114" x2="475" y2="150" stroke="#647780" stroke-width="1.5"/><rect x="483" y="84" width="14" height="30" rx="4" fill="#466d89" stroke="#273b45" stroke-width="1"/><line x1="490" y1="114" x2="475" y2="150" stroke="#647780" stroke-width="1.5"/><rect x="513" y="84" width="14" height="30" rx="4" fill="#466d89" stroke="#273b45" stroke-width="1"/><line x1="520" y1="114" x2="475" y2="150" stroke="#647780" stroke-width="1.5"/><circle cx="475" cy="156" r="10" fill="#ffffff" stroke="#273b45" stroke-width="2"/><text x="600" y="110" font-size="13" fill="#273b45" text-anchor="start">4 teat cups,</text><text x="600" y="128" font-size="13" fill="#273b45" text-anchor="start">one per teat</text><path d="M410 286 L410 232 L435.3 232 L435.3 286 L456 286 L456 232 L481.3 232 L481.3 286 L502 286 L502 232 L527.3 232 L527.3 286 L548 286 L548 232 L573.3 232 L573.3 286 L594 286 L594 232 L619.3 232 L619.3 286 L640 286 L640 232 L665.3 232 L665.3 286 L686 286" stroke="#287aab" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="410" y1="300" x2="686" y2="300" stroke="#647780" stroke-width="1.5"/><text x="422.42" y="224" font-size="12" fill="#287aab" text-anchor="middle">milk</text><text x="445.88" y="278" font-size="12" fill="#2b7b61" text-anchor="middle">rest</text><text x="545" y="202" font-size="13" fill="#273b45" text-anchor="middle">pulsation phases</text><text x="360" y="340" font-size="13" fill="#273b45" text-anchor="middle">Controlled vacuum with pulsation alternating milking and rest; not continuous suction</text><text x="360" y="364" font-size="13" fill="#647780" text-anchor="middle">Excess vacuum or faulty pulsation can injure teat tissue</text></g></svg>