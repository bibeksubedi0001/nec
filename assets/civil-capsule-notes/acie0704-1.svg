<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Dominant discharge: rate times duration</title><desc id="desc">A frequent class carrying 10 kg/s for 100 hours a year moves 3.6 million kg, twice the 1.8 million kg of a rarer 50 kg/s class lasting 10 hours, so frequent moderate flows do more channel-forming work.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><rect x="230" y="40" width="18" height="14" fill="#e6f1f8" stroke="#287aab" stroke-width="1.5"/><text x="254" y="52" font-size="14" fill="#273b45" text-anchor="start">frequent class</text><rect x="400" y="40" width="18" height="14" fill="#f5ead8" stroke="#b98232" stroke-width="1.5"/><text x="424" y="52" font-size="14" fill="#273b45" text-anchor="start">rare class</text><line x1="60" y1="280" x2="670" y2="280" stroke="#647780" stroke-width="2"/><rect x="100" y="244" width="44" height="36" fill="#e6f1f8" stroke="#287aab" stroke-width="2"/><rect x="156" y="100" width="44" height="180" fill="#f5ead8" stroke="#b98232" stroke-width="2"/><text x="122" y="236" font-size="15" fill="#287aab" text-anchor="middle">10</text><text x="178" y="92" font-size="15" fill="#b98232" text-anchor="middle">50</text><text x="150" y="302" font-size="14" fill="#273b45" text-anchor="middle">transport rate (kg/s)</text><rect x="310" y="100" width="44" height="180" fill="#e6f1f8" stroke="#287aab" stroke-width="2"/><rect x="366" y="262" width="44" height="18" fill="#f5ead8" stroke="#b98232" stroke-width="2"/><text x="332" y="92" font-size="15" fill="#287aab" text-anchor="middle">100</text><text x="388" y="254" font-size="15" fill="#b98232" text-anchor="middle">10</text><text x="360" y="302" font-size="14" fill="#273b45" text-anchor="middle">duration (h/yr)</text><rect x="520" y="100" width="44" height="180" fill="#e6f1f8" stroke="#287aab" stroke-width="2"/><rect x="576" y="190" width="44" height="90" fill="#f5ead8" stroke="#b98232" stroke-width="2"/><text x="542" y="92" font-size="15" fill="#287aab" text-anchor="middle">3.6</text><text x="598" y="182" font-size="15" fill="#b98232" text-anchor="middle">1.8</text><text x="570" y="302" font-size="14" fill="#273b45" text-anchor="middle">mass moved (million kg)</text><text x="360" y="340" font-size="14" fill="#273b45" text-anchor="middle">M = qs t: 10 × 100 × 3600 = 3.6 × 10⁶ kg against 50 × 10 × 3600 = 1.8 × 10⁶ kg</text><text x="360" y="366" font-size="14" fill="#2b7b61" text-anchor="middle">Magnitude × duration: the frequent flow does more channel-forming work</text><text x="360" y="390" font-size="13" fill="#647780" text-anchor="middle">Not the largest flood, the median flow or the mean daily flow</text></g></svg>