<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Backward pass: the minimum rule</title><desc id="desc">Each outgoing activity gives a candidate latest time for its start event: successor latest time minus duration. With 15 - 4 = 11 and 18 - 5 = 13, event J's latest allowable time is day 11.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><text x="360" y="40" font-size="16" fill="#273b45" text-anchor="middle">Backward pass: take the minimum</text><line x1="218.2" y1="194.54" x2="474.9" y2="117.53" stroke="#287aab" stroke-width="2.5"/><polygon points="481.8,115.46 474.33,121.88 472.03,114.21" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><line x1="218.2" y1="205.46" x2="474.9" y2="282.47" stroke="#287aab" stroke-width="2.5"/><polygon points="481.8,284.54 472.03,285.79 474.33,278.12" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><circle cx="200" cy="200" r="18" fill="#f5ead8" stroke="#b98232" stroke-width="2"/><text x="200" y="205" font-size="15" fill="#273b45" text-anchor="middle">J</text><circle cx="500" cy="110" r="18" fill="#ffffff" stroke="#273b45" stroke-width="2"/><text x="500" y="115" font-size="15" fill="#273b45" text-anchor="middle">K1</text><circle cx="500" cy="290" r="18" fill="#ffffff" stroke="#273b45" stroke-width="2"/><text x="500" y="295" font-size="14" fill="#273b45" text-anchor="middle">K2</text><text x="528" y="115" font-size="15" fill="#273b45" text-anchor="start">L = 15</text><text x="528" y="295" font-size="15" fill="#273b45" text-anchor="start">L = 18</text><text x="300" y="122" font-size="14" fill="#287aab" text-anchor="middle">d = 4 → 15 − 4 = 11</text><text x="280" y="272" font-size="14" fill="#287aab" text-anchor="middle">d = 5 → 18 − 5 = 13</text><text x="200" y="246" font-size="15" fill="#b64f4f" text-anchor="middle">LJ = min(11, 13) = day 11</text><text x="360" y="342" font-size="14" fill="#273b45" text-anchor="middle">Successors with LS 18 and 15: LF = min(18, 15) = day 15</text><text x="360" y="366" font-size="13" fill="#647780" text-anchor="middle">LS = LF − D: LS 9 with D 4 means LF 13</text><text x="360" y="390" font-size="13" fill="#647780" text-anchor="middle">The forward pass usually supplies the finish boundary for this pass</text></g></svg>