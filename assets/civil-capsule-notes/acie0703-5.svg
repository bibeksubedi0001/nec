<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Downstream sheet pile and design scour</title><desc id="desc">A downstream sheet pile lengthens the seepage emergence path so the toe exit gradient falls. Its depth is set by the permissible exit gradient and by embedment below the design scour level.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><rect x="20" y="170" width="680" height="130" fill="#f0e6d4" stroke="none" stroke-width="2"/><rect x="20" y="100" width="120" height="70" fill="#d8edf7" stroke="none" stroke-width="2"/><line x1="20" y1="170" x2="700" y2="170" stroke="#273b45" stroke-width="1.5"/><rect x="140" y="150" width="380" height="20" fill="#e4e8e9" stroke="#273b45" stroke-width="2"/><rect x="512" y="170" width="8" height="110" fill="#466d89" stroke="#273b45" stroke-width="1"/><line x1="520" y1="225" x2="700" y2="225" stroke="#b64f4f" stroke-width="2" stroke-dasharray="7 4"/><text x="690" y="218" font-size="14" fill="#b64f4f" text-anchor="end">design scour level</text><path d="M80 172 C80 250 480 250 522 176" stroke="#647780" stroke-width="2" fill="none" stroke-dasharray="4 4" stroke-linejoin="round" stroke-linecap="round"/><text x="300" y="264" font-size="13" fill="#647780" text-anchor="middle">without pile: short, steep exit</text><path d="M60 172 C60 330 516 330 516 286 C524 250 560 200 610 172" stroke="#287aab" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="640" y="262" font-size="14" fill="#287aab" text-anchor="middle">longer path,</text><text x="640" y="280" font-size="14" fill="#287aab" text-anchor="middle">gentler exit</text><line x1="500" y1="225" x2="500" y2="280" stroke="#647780" stroke-width="1.5"/><line x1="507" y1="225" x2="493" y2="225" stroke="#647780" stroke-width="1.5"/><line x1="507" y1="280" x2="493" y2="280" stroke="#647780" stroke-width="1.5"/><text x="492" y="258.5" font-size="14" fill="#647780" text-anchor="end">embedment</text><text x="360" y="326" font-size="15" fill="#273b45" text-anchor="middle">The pile lengthens the emergence path: toe exit gradient falls</text><text x="360" y="352" font-size="14" fill="#273b45" text-anchor="middle">Depth set by permissible exit gradient and embedment below design scour</text><text x="360" y="378" font-size="13" fill="#647780" text-anchor="middle">It does not remove uplift: uplift and filters are still checked</text></g></svg>