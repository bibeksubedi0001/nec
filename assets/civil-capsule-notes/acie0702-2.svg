<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Ridge, contour and side-slope canal alignments</title><desc id="desc">A ridge canal on the watershed commands both banks while natural drains fall away from it; a contour canal crosses every drain; a side-slope canal runs roughly parallel to the drainage.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><text x="360" y="50" font-size="15" fill="#b98232" text-anchor="middle">ridge (watershed)</text><line x1="345" y1="90" x2="86.96" y2="158.16" stroke="#287aab" stroke-width="2"/><polygon points="80,160 87.68,153.83 89.72,161.57" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><line x1="375" y1="90" x2="633.04" y2="158.16" stroke="#287aab" stroke-width="2"/><polygon points="640,160 630.28,161.57 632.32,153.83" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><line x1="345" y1="160" x2="86.96" y2="228.16" stroke="#287aab" stroke-width="2"/><polygon points="80,230 87.68,223.83 89.72,231.57" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><line x1="375" y1="160" x2="633.04" y2="228.16" stroke="#287aab" stroke-width="2"/><polygon points="640,230 630.28,231.57 632.32,223.83" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><line x1="345" y1="230" x2="86.96" y2="298.16" stroke="#287aab" stroke-width="2"/><polygon points="80,300 87.68,293.83 89.72,301.57" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><line x1="375" y1="230" x2="633.04" y2="298.16" stroke="#287aab" stroke-width="2"/><polygon points="640,300 630.28,301.57 632.32,293.83" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><line x1="360" y1="64" x2="360" y2="330" stroke="#2b7b61" stroke-width="6"/><line x1="200" y1="80" x2="200" y2="330" stroke="#b64f4f" stroke-width="4"/><circle cx="200" cy="128" r="7" fill="#ffffff" stroke="#b64f4f" stroke-width="2"/><circle cx="200" cy="198" r="7" fill="#ffffff" stroke="#b64f4f" stroke-width="2"/><circle cx="200" cy="268" r="7" fill="#ffffff" stroke="#b64f4f" stroke-width="2"/><line x1="420" y1="141" x2="640" y2="199" stroke="#b98232" stroke-width="4"/><text x="90" y="118" font-size="14" fill="#287aab" text-anchor="middle">natural drains</text><text x="180" y="350" font-size="14" fill="#b64f4f" text-anchor="middle">contour canal: crosses every drain</text><text x="540" y="350" font-size="14" fill="#b98232" text-anchor="middle">side-slope canal: parallel to drains</text><text x="360" y="380" font-size="15" fill="#2b7b61" text-anchor="middle">Ridge canal: commands both banks, few crossings</text><text x="360" y="404" font-size="13" fill="#647780" text-anchor="middle">Still check grade, head at the fields and local gullies</text></g></svg>