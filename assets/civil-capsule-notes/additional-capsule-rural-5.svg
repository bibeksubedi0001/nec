<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Intercultural operations and a biosecure footbath</title><desc id="desc">Intercultural operations such as weeding, hoeing and earthing-up are done in the growing crop between establishment and harvest. A poultry footbath works only with cleaned footwear and correct disinfectant strength and contact.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><rect x="220" y="100" width="300" height="40" fill="#deeee6" stroke="#2b7b61" stroke-width="1.5"/><line x1="40" y1="120" x2="681.2" y2="120" stroke="#273b45" stroke-width="2.5"/><polygon points="690,120 679,124.5 679,115.5" fill="#273b45" stroke="#273b45" stroke-width="1.5" stroke-linejoin="round"/><line x1="90" y1="112" x2="90" y2="128" stroke="#273b45" stroke-width="2"/><text x="90" y="160" font-size="13" fill="#273b45" text-anchor="middle">sowing</text><line x1="220" y1="112" x2="220" y2="128" stroke="#273b45" stroke-width="2"/><text x="220" y="160" font-size="13" fill="#273b45" text-anchor="middle">establishment</text><line x1="520" y1="112" x2="520" y2="128" stroke="#273b45" stroke-width="2"/><text x="520" y="160" font-size="13" fill="#273b45" text-anchor="middle">harvest</text><line x1="640" y1="112" x2="640" y2="128" stroke="#273b45" stroke-width="2"/><text x="640" y="160" font-size="13" fill="#273b45" text-anchor="middle">storage</text><text x="370" y="90" font-size="14" fill="#2b7b61" text-anchor="middle">intercultural: weeding, hoeing, earthing-up</text><text x="360" y="210" font-size="15" fill="#273b45" text-anchor="middle">Poultry-farm entrance footbath</text><rect x="30" y="230" width="140" height="54" rx="8" fill="#e6f1f8" stroke="#287aab" stroke-width="2"/><text x="100" y="253.75" font-size="13" fill="#273b45" text-anchor="middle"><tspan x="100" dy="0">clean footwear</tspan><tspan x="100" dy="15.86">first</tspan></text><rect x="205" y="230" width="140" height="54" rx="8" fill="#e6f1f8" stroke="#287aab" stroke-width="2"/><text x="275" y="253.75" font-size="13" fill="#273b45" text-anchor="middle"><tspan x="275" dy="0">disinfectant at</tspan><tspan x="275" dy="15.86">correct strength</tspan></text><line x1="172" y1="257" x2="195.6" y2="257" stroke="#647780" stroke-width="2"/><polygon points="202,257 194,260.5 194,253.5" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><rect x="380" y="230" width="140" height="54" rx="8" fill="#e6f1f8" stroke="#287aab" stroke-width="2"/><text x="450" y="253.75" font-size="13" fill="#273b45" text-anchor="middle"><tspan x="450" dy="0">adequate</tspan><tspan x="450" dy="15.86">contact time</tspan></text><line x1="347" y1="257" x2="370.6" y2="257" stroke="#647780" stroke-width="2"/><polygon points="377,257 369,260.5 369,253.5" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><rect x="555" y="230" width="140" height="54" rx="8" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><text x="625" y="253.75" font-size="13" fill="#273b45" text-anchor="middle"><tspan x="625" dy="0">one part of</tspan><tspan x="625" dy="15.86">biosecurity</tspan></text><line x1="522" y1="257" x2="545.6" y2="257" stroke="#647780" stroke-width="2"/><polygon points="552,257 544,260.5 544,253.5" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><text x="360" y="318" font-size="13" fill="#b64f4f" text-anchor="middle">Mud, dilution or a depleted solution undermine it; access controls are still needed</text><text x="360" y="342" font-size="13" fill="#647780" text-anchor="middle">Not work before sowing or on stored produce</text></g></svg>