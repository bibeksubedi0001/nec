<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Matching the barrier to the transmission route</title><desc id="desc">Cholera spreads by ingestion and needs source protection, treatment and safe storage; trachoma is water-washed and needs enough clean water for washing. Pandemic describes extent, not severity.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><rect x="40" y="70" width="200" height="70" rx="8" fill="#f2dfdf" stroke="#b64f4f" stroke-width="2"/><text x="140" y="101" font-size="16" fill="#273b45" text-anchor="middle"><tspan x="140" dy="0">Waterborne (ingestion)</tspan><tspan x="140" dy="19.52">e.g. cholera</tspan></text><line x1="244" y1="105" x2="287.2" y2="105" stroke="#647780" stroke-width="2.5"/><polygon points="296,105 285,109.5 285,100.5" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><rect x="300" y="70" width="380" height="70" rx="8" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><text x="490" y="101" font-size="16" fill="#273b45" text-anchor="middle"><tspan x="490" dy="0">Barrier: protected source,</tspan><tspan x="490" dy="19.52">treatment, safe storage</tspan></text><text x="490" y="164" font-size="14" fill="#647780" text-anchor="middle">softening, aeration, colour removal: no effect</text><rect x="40" y="180" width="200" height="70" rx="8" fill="#f5ead8" stroke="#b98232" stroke-width="2"/><text x="140" y="211" font-size="16" fill="#273b45" text-anchor="middle"><tspan x="140" dy="0">Water-washed (hygiene)</tspan><tspan x="140" dy="19.52">e.g. trachoma</tspan></text><line x1="244" y1="215" x2="287.2" y2="215" stroke="#647780" stroke-width="2.5"/><polygon points="296,215 285,219.5 285,210.5" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><rect x="300" y="180" width="380" height="70" rx="8" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><text x="490" y="211" font-size="16" fill="#273b45" text-anchor="middle"><tspan x="490" dy="0">Barrier: enough clean water,</tspan><tspan x="490" dy="19.52">convenient for washing</tspan></text><text x="490" y="274" font-size="14" fill="#647780" text-anchor="middle">disinfecting the same small allocation is not enough</text><line x1="50" y1="320" x2="671.2" y2="320" stroke="#287aab" stroke-width="2.5"/><polygon points="680,320 669,324.5 669,315.5" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><circle cx="110" cy="320" r="5" fill="#287aab" stroke="#287aab" stroke-width="2"/><text x="110" y="308" font-size="15" fill="#273b45" text-anchor="middle">sporadic</text><text x="110" y="344" font-size="13" fill="#647780" text-anchor="middle">irregular cases</text><circle cx="270" cy="320" r="5" fill="#287aab" stroke="#287aab" stroke-width="2"/><text x="270" y="308" font-size="15" fill="#273b45" text-anchor="middle">endemic</text><text x="270" y="344" font-size="13" fill="#647780" text-anchor="middle">expected, continuing</text><circle cx="430" cy="320" r="5" fill="#287aab" stroke="#287aab" stroke-width="2"/><text x="430" y="308" font-size="15" fill="#273b45" text-anchor="middle">epidemic</text><text x="430" y="344" font-size="13" fill="#647780" text-anchor="middle">more than expected</text><circle cx="600" cy="320" r="5" fill="#287aab" stroke="#287aab" stroke-width="2"/><text x="600" y="308" font-size="15" fill="#273b45" text-anchor="middle">pandemic</text><text x="600" y="344" font-size="13" fill="#647780" text-anchor="middle">international spread</text><text x="360" y="390" font-size="14" fill="#273b45" text-anchor="middle">Epidemiological terms describe pattern and extent, not severity</text></g></svg>