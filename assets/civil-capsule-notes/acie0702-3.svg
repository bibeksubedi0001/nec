<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Aggradation and the modes of sediment transport</title><desc id="desc">When more sediment enters a reach than leaves, storage grows and the bed rises. Bed load rolls, slides and saltates along the bed; suspended load is held up by turbulence; dissolved load is in solution.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><text x="360" y="50" font-size="16" fill="#273b45" text-anchor="middle">ΔS = Gin − Gout &gt; 0 → bed rises</text><line x1="40" y1="80" x2="131.2" y2="80" stroke="#b98232" stroke-width="5"/><polygon points="140,80 129,84.5 129,75.5" fill="#b98232" stroke="#b98232" stroke-width="1.5" stroke-linejoin="round"/><text x="90" y="70" font-size="15" fill="#b98232" text-anchor="middle">Gin</text><line x1="590" y1="80" x2="651.2" y2="80" stroke="#b98232" stroke-width="2.5"/><polygon points="660,80 649,84.5 649,75.5" fill="#b98232" stroke="#b98232" stroke-width="1.5" stroke-linejoin="round"/><text x="625" y="70" font-size="15" fill="#b98232" text-anchor="middle">Gout</text><rect x="40" y="110" width="640" height="180" fill="#d8edf7" stroke="none" stroke-width="2"/><line x1="40" y1="110" x2="680" y2="110" stroke="#287aab" stroke-width="2"/><polygon points="40,290 200,290 300,262 480,262 580,290 680,290 680,340 40,340" fill="#f0e6d4" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><line x1="200" y1="290" x2="580" y2="290" stroke="#647780" stroke-width="1.5" stroke-dasharray="6 4"/><text x="390" y="312" font-size="14" fill="#647780" text-anchor="middle">original bed</text><text x="390" y="252" font-size="14" fill="#b98232" text-anchor="middle">raised bed: aggradation</text><circle cx="80" cy="284" r="5" fill="#b98232" stroke="#273b45" stroke-width="1"/><circle cx="102" cy="284" r="5" fill="#b98232" stroke="#273b45" stroke-width="1"/><circle cx="150" cy="284" r="5" fill="#b98232" stroke="#273b45" stroke-width="1"/><path d="M112 284 Q128 258 144 284" stroke="#b98232" stroke-width="1.5" fill="none" stroke-dasharray="4 3" stroke-linejoin="round" stroke-linecap="round"/><path d="M156 284 Q172 258 188 284" stroke="#b98232" stroke-width="1.5" fill="none" stroke-dasharray="4 3" stroke-linejoin="round" stroke-linecap="round"/><text x="130" y="240" font-size="14" fill="#273b45" text-anchor="middle">bed load: rolling,</text><text x="130" y="258" font-size="14" fill="#273b45" text-anchor="middle">sliding, saltation</text><circle cx="500" cy="160" r="3" fill="#8a9aa3" stroke="#8a9aa3" stroke-width="2"/><circle cx="540" cy="190" r="3" fill="#8a9aa3" stroke="#8a9aa3" stroke-width="2"/><circle cx="580" cy="150" r="3" fill="#8a9aa3" stroke="#8a9aa3" stroke-width="2"/><circle cx="620" cy="200" r="3" fill="#8a9aa3" stroke="#8a9aa3" stroke-width="2"/><circle cx="520" cy="220" r="3" fill="#8a9aa3" stroke="#8a9aa3" stroke-width="2"/><circle cx="600" cy="230" r="3" fill="#8a9aa3" stroke="#8a9aa3" stroke-width="2"/><circle cx="650" cy="170" r="3" fill="#8a9aa3" stroke="#8a9aa3" stroke-width="2"/><text x="560" y="136" font-size="14" fill="#273b45" text-anchor="middle">suspended load (turbulence)</text><text x="360" y="372" font-size="14" fill="#273b45" text-anchor="middle">Degradation is the reverse: net erosion lowers the bed</text><text x="360" y="396" font-size="13" fill="#647780" text-anchor="middle">Dissolved load is carried in solution</text></g></svg>