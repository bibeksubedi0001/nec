<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Moving a single sum through time</title><desc id="desc">A present sum grows by (1 + i) each period: NRs 100000 at 10 percent becomes 133100 after three years, and 133100 due then is worth 100000 now. At 8 percent, 100000 today equals 108000 in a year.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><text x="360" y="40" font-size="16" fill="#273b45" text-anchor="middle">One sum moved through time at i = 10%</text><line x1="80" y1="220" x2="660" y2="220" stroke="#273b45" stroke-width="2.5"/><line x1="100" y1="214" x2="100" y2="226" stroke="#273b45" stroke-width="2"/><text x="108" y="246" font-size="13" fill="#273b45" text-anchor="start">year 0</text><line x1="280" y1="214" x2="280" y2="226" stroke="#273b45" stroke-width="2"/><text x="280" y="246" font-size="13" fill="#273b45" text-anchor="middle">year 1</text><line x1="460" y1="214" x2="460" y2="226" stroke="#273b45" stroke-width="2"/><text x="460" y="246" font-size="13" fill="#273b45" text-anchor="middle">year 2</text><line x1="640" y1="214" x2="640" y2="226" stroke="#273b45" stroke-width="2"/><text x="640" y="246" font-size="13" fill="#273b45" text-anchor="middle">year 3</text><line x1="100" y1="222" x2="100" y2="291.2" stroke="#b64f4f" stroke-width="3.5"/><polygon points="100,300 95.5,289 104.5,289" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="100" y="320" font-size="15" fill="#b64f4f" text-anchor="middle">P = 100,000</text><line x1="640" y1="218" x2="640" y2="120.8" stroke="#2b7b61" stroke-width="3.5"/><polygon points="640,112 644.5,123 635.5,123" fill="#2b7b61" stroke="#2b7b61" stroke-width="1.5" stroke-linejoin="round"/><text x="640" y="100" font-size="15" fill="#2b7b61" text-anchor="middle">F = 133,100</text><path d="M112 200 Q370 120 626 200" stroke="#287aab" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="626,200 614.16,201.01 616.84,192.42" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><text x="370" y="150" font-size="14" fill="#287aab" text-anchor="middle">compound: F = P (1 + i)ⁿ = 100,000 × 1.331</text><path d="M626 262 Q370 330 116 262" stroke="#b98232" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="116,262 127.79,260.5 125.46,269.19" fill="#b98232" stroke="#b98232" stroke-width="1.5" stroke-linejoin="round"/><text x="370" y="318" font-size="14" fill="#b98232" text-anchor="middle">discount: P = F / (1 + i)ⁿ</text><text x="360" y="360" font-size="13" fill="#273b45" text-anchor="middle">At 8%: 100,000 today = 108,000 in a year; PV of a future 100,000 = 92,592.59</text><text x="360" y="384" font-size="13" fill="#647780" text-anchor="middle">Discounting compounds period by period; subtracting simple percentages is wrong</text></g></svg>