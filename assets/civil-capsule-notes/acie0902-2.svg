<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Simple-curve chainage and the clothoid transition</title><desc id="desc">For R = 100 m and a 60 degree deflection, the IP is stationed along the tangent at 1057.735 m while the arc midpoint is at 1052.360 m. A clothoid's curvature rises linearly with distance: r s = R Ls.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="30" y1="300" x2="215.5" y2="300" stroke="#647780" stroke-width="2"/><line x1="215.5" y1="300" x2="313" y2="131" stroke="#647780" stroke-width="2"/><path d="M100 300 A200 200 0 0 0 273.21 200" stroke="#287aab" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="100" cy="300" r="4.5" fill="#273b45" stroke="#273b45" stroke-width="2"/><circle cx="215.5" cy="300" r="4.5" fill="#273b45" stroke="#273b45" stroke-width="2"/><circle cx="273.2" cy="200" r="4.5" fill="#273b45" stroke="#273b45" stroke-width="2"/><circle cx="200" cy="273.2" r="4.5" fill="#273b45" stroke="#273b45" stroke-width="2"/><text x="100" y="322" font-size="13" fill="#273b45" text-anchor="middle">PC 1000.000</text><text x="236" y="322" font-size="13" fill="#b64f4f" text-anchor="start">IP 1057.735 (tangent)</text><text x="192" y="258" font-size="13" fill="#287aab" text-anchor="end">M 1052.360 (arc)</text><text x="282" y="204" font-size="13" fill="#273b45" text-anchor="start">PT</text><text x="226" y="290" font-size="13" fill="#273b45" text-anchor="start">Δ = 60°</text><text x="185" y="60" font-size="14" fill="#273b45" text-anchor="middle">T = R tan(Δ/2) = 57.735 m</text><text x="185" y="82" font-size="14" fill="#273b45" text-anchor="middle">L/2 = R Δ/2 = 52.360 m</text><line x1="360" y1="30" x2="360" y2="340" stroke="#b8c8ce" stroke-width="1.5" stroke-dasharray="6 5"/><text x="550" y="60" font-size="15" fill="#273b45" text-anchor="middle">Clothoid transition</text><line x1="410" y1="280" x2="686" y2="280" stroke="#647780" stroke-width="2"/><polygon points="694,280 684,284 684,276" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><line x1="410" y1="280" x2="410" y2="104" stroke="#647780" stroke-width="2"/><polygon points="410,96 414,106 406,106" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><text x="545" y="312" font-size="13" fill="#273b45" text-anchor="middle">distance along path</text><text x="416" y="86" font-size="13" fill="#273b45" text-anchor="start">curvature 1/r</text><path d="M410 280 L464 280 L572 138.33 L680 138.33" stroke="#2b7b61" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="437" y="272" font-size="12" fill="#273b45" text-anchor="middle">straight</text><text x="512" y="203.17" font-size="12" fill="#2b7b61" text-anchor="end">clothoid</text><text x="626" y="130.33" font-size="12" fill="#273b45" text-anchor="middle">arc 1/R</text><text x="550" y="342" font-size="13" fill="#273b45" text-anchor="middle">r s = R Ls: curvature ∝ distance</text><text x="360" y="372" font-size="13" fill="#273b45" text-anchor="middle">IP lies on the tangent: tan(Δ/2) &gt; Δ/2, so IP chainage exceeds the arc midpoint by 5.375 m</text><text x="360" y="396" font-size="13" fill="#647780" text-anchor="middle">Constant rate of change of lateral acceleration holds at constant speed</text></g></svg>