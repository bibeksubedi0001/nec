<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Total and differential settlement</title><desc id="desc">Total settlement, the difference between supports and angular distortion are separate serviceability checks; passing one does not establish the others.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="60" y1="250" x2="660" y2="250" stroke="#647780" stroke-width="1.5" stroke-dasharray="8 6"/><text x="640" y="240" font-size="14" fill="#647780" text-anchor="end">original level</text><path d="M60 252 C140 262 170 270 180 270 C300 276 440 300 540 310 C600 316 640 300 660 290" stroke="#287aab" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><rect x="170" y="120" width="20" height="140" fill="#d6dfe3" stroke="#273b45" stroke-width="2"/><rect x="146" y="260" width="68" height="14" fill="#c9d0d3" stroke="#273b45" stroke-width="2"/><rect x="530" y="160" width="20" height="140" fill="#d6dfe3" stroke="#273b45" stroke-width="2"/><rect x="506" y="300" width="68" height="14" fill="#c9d0d3" stroke="#273b45" stroke-width="2"/><line x1="180" y1="120" x2="540" y2="160" stroke="#273b45" stroke-width="6"/><line x1="120" y1="250" x2="120" y2="270" stroke="#647780" stroke-width="1.5"/><line x1="126" y1="250" x2="114" y2="250" stroke="#647780" stroke-width="1.5"/><line x1="126" y1="270" x2="114" y2="270" stroke="#647780" stroke-width="1.5"/><text x="120" y="240" font-size="16" fill="#647780" text-anchor="middle">δ1</text><line x1="600" y1="250" x2="600" y2="310" stroke="#647780" stroke-width="1.5"/><line x1="607" y1="250" x2="593" y2="250" stroke="#647780" stroke-width="1.5"/><line x1="607" y1="310" x2="593" y2="310" stroke="#647780" stroke-width="1.5"/><text x="610" y="286" font-size="16" fill="#647780" text-anchor="start">δ2</text><line x1="180" y1="270" x2="500" y2="270" stroke="#647780" stroke-width="1.2" stroke-dasharray="4 5"/><line x1="496" y1="270" x2="496" y2="310" stroke="#647780" stroke-width="1.5"/><line x1="503" y1="270" x2="489" y2="270" stroke="#647780" stroke-width="1.5"/><line x1="503" y1="310" x2="489" y2="310" stroke="#647780" stroke-width="1.5"/><text x="488" y="296" font-size="16" fill="#647780" text-anchor="end">Δ</text><line x1="180" y1="348" x2="540" y2="348" stroke="#647780" stroke-width="1.5"/><line x1="180" y1="341" x2="180" y2="355" stroke="#647780" stroke-width="1.5"/><line x1="540" y1="341" x2="540" y2="355" stroke="#647780" stroke-width="1.5"/><text x="360" y="364" font-size="18" fill="#647780" text-anchor="middle">L</text><text x="360" y="404" font-size="15" fill="#273b45" text-anchor="middle">Differential Δ = δ2 − δ1;  angular distortion β = Δ / L</text></g></svg>