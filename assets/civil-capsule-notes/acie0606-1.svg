<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Strategic and project assessment</title><desc id="desc">SEA evaluates policies, plans and programmes before schemes are chosen; project EIA assesses a specific proposal, comparing alternatives, predicting effects and designing mitigation before the decision.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><rect x="60" y="70" width="200" height="44" rx="8" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><text x="160" y="97.76" font-size="16" fill="#273b45" text-anchor="middle">Policy</text><rect x="60" y="130" width="200" height="44" rx="8" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><text x="160" y="157.76" font-size="16" fill="#273b45" text-anchor="middle">Plan</text><rect x="60" y="190" width="200" height="44" rx="8" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><text x="160" y="217.76" font-size="16" fill="#273b45" text-anchor="middle">Programme</text><rect x="60" y="250" width="200" height="44" rx="8" fill="#e6f1f8" stroke="#287aab" stroke-width="2"/><text x="160" y="277.76" font-size="16" fill="#273b45" text-anchor="middle">Project</text><path d="M270 70 L282 70 L282 234 L270 234" stroke="#2b7b61" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M270 250 L282 250 L282 294 L270 294" stroke="#287aab" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="292" y="158" font-size="17" fill="#2b7b61" text-anchor="start">SEA</text><text x="292" y="278" font-size="17" fill="#287aab" text-anchor="start">EIA</text><text x="160" y="330" font-size="14" fill="#273b45" text-anchor="middle">SEA: before schemes are chosen</text><text x="160" y="352" font-size="14" fill="#273b45" text-anchor="middle">EIA: a specific proposal, e.g. an outfall</text><line x1="350" y1="40" x2="350" y2="360" stroke="#b8c8ce" stroke-width="1.5" stroke-dasharray="6 5"/><rect x="390" y="60" width="290" height="36" rx="8" fill="#e6f1f8" stroke="#287aab" stroke-width="2"/><text x="535" y="83.4" font-size="15" fill="#273b45" text-anchor="middle">compare alternatives</text><rect x="390" y="108" width="290" height="36" rx="8" fill="#e6f1f8" stroke="#287aab" stroke-width="2"/><text x="535" y="131.4" font-size="15" fill="#273b45" text-anchor="middle">predict downstream effects</text><line x1="535" y1="96" x2="535" y2="100.6" stroke="#647780" stroke-width="2"/><polygon points="535,107 531.5,99 538.5,99" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><rect x="390" y="156" width="290" height="36" rx="8" fill="#e6f1f8" stroke="#287aab" stroke-width="2"/><text x="535" y="179.4" font-size="15" fill="#273b45" text-anchor="middle">design mitigation</text><line x1="535" y1="144" x2="535" y2="148.6" stroke="#647780" stroke-width="2"/><polygon points="535,155 531.5,147 538.5,147" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><rect x="390" y="204" width="290" height="36" rx="8" fill="#e6f1f8" stroke="#287aab" stroke-width="2"/><text x="535" y="227.4" font-size="15" fill="#273b45" text-anchor="middle">state residual impacts</text><line x1="535" y1="192" x2="535" y2="196.6" stroke="#647780" stroke-width="2"/><polygon points="535,203 531.5,195 538.5,195" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><rect x="390" y="252" width="290" height="36" rx="8" fill="#f5ead8" stroke="#b98232" stroke-width="2"/><text x="535" y="275.4" font-size="15" fill="#273b45" text-anchor="middle">inform the decision</text><line x1="535" y1="240" x2="535" y2="244.6" stroke="#647780" stroke-width="2"/><polygon points="535,251 531.5,243 538.5,243" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><rect x="390" y="300" width="290" height="36" rx="8" fill="#e6f1f8" stroke="#287aab" stroke-width="2"/><text x="535" y="323.4" font-size="15" fill="#273b45" text-anchor="middle">implement and monitor</text><line x1="535" y1="288" x2="535" y2="292.6" stroke="#647780" stroke-width="2"/><polygon points="535,299 531.5,291 538.5,291" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><text x="360" y="382" font-size="14" fill="#273b45" text-anchor="middle">EIA informs decision and design; it does not guarantee approval</text><text x="360" y="404" font-size="13" fill="#647780" text-anchor="middle">2030 Agenda (2015): 17 SDGs and 169 targets; the MDGs were 8; SDG 6 is water</text></g></svg>