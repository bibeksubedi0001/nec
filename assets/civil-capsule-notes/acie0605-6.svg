<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Raw biogas and upgraded biomethane</title><desc id="desc">Raw digester gas is roughly 65 percent methane and 35 percent carbon dioxide by volume. Upgrading removes CO2 and specified impurities to give methane-rich biomethane.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><text x="360" y="60" font-size="16" fill="#273b45" text-anchor="middle">Anaerobic digestion gas, by volume</text><text x="130" y="142" font-size="15" fill="#273b45" text-anchor="end">raw biogas</text><rect x="140" y="110" width="312" height="50" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><rect x="452" y="110" width="168" height="50" fill="#d6dfe3" stroke="#273b45" stroke-width="2"/><text x="296" y="141" font-size="16" fill="#2b7b61" text-anchor="middle">CH4 ≈ 65%</text><text x="536" y="141" font-size="16" fill="#273b45" text-anchor="middle">CO2 ≈ 35%</text><line x1="380" y1="168" x2="380" y2="213.2" stroke="#647780" stroke-width="3"/><polygon points="380,222 375.5,211 384.5,211" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><text x="392" y="200" font-size="14" fill="#273b45" text-anchor="start">upgrading removes CO2 and impurities</text><text x="130" y="262" font-size="15" fill="#273b45" text-anchor="end">biomethane</text><rect x="140" y="230" width="456" height="50" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><rect x="596" y="230" width="24" height="50" fill="#d6dfe3" stroke="#273b45" stroke-width="2"/><text x="368" y="261" font-size="15" fill="#2b7b61" text-anchor="middle">methane share raised; quality set by the end use</text><text x="360" y="322" font-size="14" fill="#273b45" text-anchor="middle">Adding CO2, air or water vapour lowers the methane fraction</text><text x="360" y="348" font-size="14" fill="#273b45" text-anchor="middle">Raising the pressure does not change the composition</text><text x="360" y="374" font-size="14" fill="#647780" text-anchor="middle">Grid or fuel suitability depends on use-specific quality rules</text></g></svg>