<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Coincidence of feeder peaks</title><desc id="desc">Feeder maxima of 12, 18 and 30 kW sum to 60 kW, but their simultaneous maximum is 45 kW: coincidence factor 0.75, diversity factor 1.33. An isolated microhydro must cover the coincident peak.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="110" y1="300" x2="450" y2="300" stroke="#647780" stroke-width="2"/><rect x="150" y="252" width="90" height="48" fill="#e6f1f8" stroke="#287aab" stroke-width="2"/><text x="195" y="281" font-size="15" fill="#287aab" text-anchor="middle">12 kW</text><rect x="150" y="180" width="90" height="72" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><text x="195" y="221" font-size="15" fill="#2b7b61" text-anchor="middle">18 kW</text><rect x="150" y="60" width="90" height="120" fill="#f5ead8" stroke="#b98232" stroke-width="2"/><text x="195" y="125" font-size="15" fill="#b98232" text-anchor="middle">30 kW</text><text x="195" y="52" font-size="15" fill="#273b45" text-anchor="middle">60</text><rect x="330" y="120" width="90" height="180" fill="#f2dfdf" stroke="#b64f4f" stroke-width="2"/><text x="375" y="112" font-size="15" fill="#273b45" text-anchor="middle">45</text><line x1="240" y1="120" x2="330" y2="120" stroke="#b64f4f" stroke-width="1.5" stroke-dasharray="6 4"/><text x="195" y="322" font-size="14" fill="#273b45" text-anchor="middle">sum of maxima</text><text x="375" y="322" font-size="14" fill="#273b45" text-anchor="middle">combined max</text><text x="585" y="120" font-size="16" fill="#b64f4f" text-anchor="middle">Cf = 45/60 = 0.75</text><text x="585" y="148" font-size="16" fill="#273b45" text-anchor="middle">Df = 60/45 ≈ 1.33</text><text x="585" y="176" font-size="14" fill="#647780" text-anchor="middle">Cf ≤ 1, Df ≥ 1</text><text x="585" y="230" font-size="15" fill="#273b45" text-anchor="middle">CF = 30/60 = 0.50</text><text x="585" y="258" font-size="15" fill="#273b45" text-anchor="middle">LF = 30/60 = 0.50</text><text x="585" y="286" font-size="15" fill="#287aab" text-anchor="middle">CF/LF = Pmax/Pinst = 1.00</text><text x="360" y="356" font-size="14" fill="#273b45" text-anchor="middle">Isolated microhydro without storage: cover the coincident peak, 45 kW</text><text x="360" y="380" font-size="13" fill="#647780" text-anchor="middle">then add losses, motor starting and reserve, and check the hydrology</text></g></svg>