<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Chilled fresh fish versus frozen storage</title><desc id="desc">Melting ice holds fresh fish near 0 °C; frozen storage keeps an already frozen product well below freezing, and -25 °C is one such set point. They are different product states, not one process.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><rect x="190" y="70" width="20" height="270" rx="10" fill="#ffffff" stroke="#273b45" stroke-width="2"/><rect x="194" y="145" width="12" height="191" fill="#287aab" stroke="none" stroke-width="2" opacity="0.35"/><line x1="210" y1="80" x2="222" y2="80" stroke="#273b45" stroke-width="1.5"/><text x="180" y="85" font-size="13" fill="#273b45" text-anchor="end">10 °C</text><line x1="210" y1="145" x2="222" y2="145" stroke="#273b45" stroke-width="1.5"/><text x="180" y="150" font-size="13" fill="#273b45" text-anchor="end">0 °C</text><line x1="210" y1="210" x2="222" y2="210" stroke="#273b45" stroke-width="1.5"/><text x="180" y="215" font-size="13" fill="#273b45" text-anchor="end">-10 °C</text><line x1="210" y1="275" x2="222" y2="275" stroke="#273b45" stroke-width="1.5"/><text x="180" y="280" font-size="13" fill="#273b45" text-anchor="end">-20 °C</text><line x1="210" y1="340" x2="222" y2="340" stroke="#273b45" stroke-width="1.5"/><text x="180" y="345" font-size="13" fill="#273b45" text-anchor="end">-30 °C</text><circle cx="200" cy="145" r="6" fill="#287aab" stroke="#287aab" stroke-width="2"/><circle cx="200" cy="307.5" r="6" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><line x1="214" y1="145" x2="278" y2="138" stroke="#647780" stroke-width="1.2"/><line x1="214" y1="307.5" x2="278" y2="300" stroke="#647780" stroke-width="1.2"/><rect x="280" y="110" width="330" height="56" rx="8" fill="#e6f1f8" stroke="#287aab" stroke-width="2"/><text x="445" y="134.25" font-size="15" fill="#273b45" text-anchor="middle"><tspan x="445" dy="0">Chilling: fresh fish in melting ice</tspan><tspan x="445" dy="18.3">stays near 0 °C</tspan></text><rect x="280" y="272" width="330" height="56" rx="8" fill="#f2dfdf" stroke="#b64f4f" stroke-width="2"/><text x="445" y="296.25" font-size="15" fill="#273b45" text-anchor="middle"><tspan x="445" dy="0">Frozen storage of a frozen product</tspan><tspan x="445" dy="18.3">set point −25 °C, one specification</tspan></text><text x="445" y="222" font-size="14" fill="#647780" text-anchor="middle">different product states</text><text x="360" y="372" font-size="13" fill="#273b45" text-anchor="middle">Melting ice cannot reach −25 °C at atmospheric pressure</text><text x="360" y="396" font-size="13" fill="#647780" text-anchor="middle">Freezing does not give unlimited shelf life; keep hygiene, cold chain and monitoring</text></g></svg>