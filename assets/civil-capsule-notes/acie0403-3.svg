<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Translating supports to the conjugate beam</title><desc id="desc">Conjugate shear equals real slope and conjugate moment equals real deflection, so a fixed end becomes free, a free end becomes fixed and a simple end stays simple.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><text x="190" y="56" font-size="17" fill="#273b45" text-anchor="middle">Real beam end</text><text x="530" y="56" font-size="17" fill="#273b45" text-anchor="middle">Conjugate beam end</text><line x1="130" y1="74" x2="130" y2="126" stroke="#273b45" stroke-width="3"/><line x1="130" y1="78" x2="119" y2="88" stroke="#647780" stroke-width="1.4"/><line x1="130" y1="90" x2="119" y2="100" stroke="#647780" stroke-width="1.4"/><line x1="130" y1="102" x2="119" y2="112" stroke="#647780" stroke-width="1.4"/><line x1="130" y1="114" x2="119" y2="124" stroke="#647780" stroke-width="1.4"/><line x1="130" y1="100" x2="250" y2="100" stroke="#273b45" stroke-width="7"/><line x1="470" y1="100" x2="590" y2="100" stroke="#273b45" stroke-width="7"/><circle cx="470" cy="100" r="3" fill="#273b45" stroke="#273b45" stroke-width="2"/><line x1="300" y1="100" x2="411.2" y2="100" stroke="#647780" stroke-width="2"/><polygon points="420,100 409,104.5 409,95.5" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><text x="190" y="150" font-size="13" fill="#647780" text-anchor="middle">slope 0, deflection 0</text><text x="530" y="150" font-size="13" fill="#647780" text-anchor="middle">V̄ = 0, M̄ = 0</text><line x1="130" y1="180" x2="250" y2="180" stroke="#273b45" stroke-width="7"/><circle cx="130" cy="180" r="3" fill="#273b45" stroke="#273b45" stroke-width="2"/><line x1="470" y1="154" x2="470" y2="206" stroke="#273b45" stroke-width="3"/><line x1="470" y1="158" x2="459" y2="168" stroke="#647780" stroke-width="1.4"/><line x1="470" y1="170" x2="459" y2="180" stroke="#647780" stroke-width="1.4"/><line x1="470" y1="182" x2="459" y2="192" stroke="#647780" stroke-width="1.4"/><line x1="470" y1="194" x2="459" y2="204" stroke="#647780" stroke-width="1.4"/><line x1="470" y1="180" x2="590" y2="180" stroke="#273b45" stroke-width="7"/><line x1="300" y1="180" x2="411.2" y2="180" stroke="#647780" stroke-width="2"/><polygon points="420,180 409,184.5 409,175.5" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><text x="190" y="230" font-size="13" fill="#647780" text-anchor="middle">slope and deflection nonzero</text><text x="530" y="230" font-size="13" fill="#647780" text-anchor="middle">V̄ and M̄ nonzero</text><line x1="130" y1="262" x2="250" y2="262" stroke="#273b45" stroke-width="7"/><polygon points="130,267 115,291 145,291" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><line x1="108" y1="294" x2="152" y2="294" stroke="#647780" stroke-width="2"/><line x1="470" y1="262" x2="590" y2="262" stroke="#273b45" stroke-width="7"/><polygon points="470,267 455,291 485,291" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><line x1="448" y1="294" x2="492" y2="294" stroke="#647780" stroke-width="2"/><line x1="300" y1="262" x2="411.2" y2="262" stroke="#647780" stroke-width="2"/><polygon points="420,262 409,266.5 409,257.5" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><text x="190" y="312" font-size="13" fill="#647780" text-anchor="middle">slope nonzero, deflection 0</text><text x="530" y="312" font-size="13" fill="#647780" text-anchor="middle">V̄ nonzero, M̄ = 0</text><text x="360" y="392" font-size="15" fill="#273b45" text-anchor="middle">The conjugate of a cantilever is a cantilever fixed at the opposite end</text></g></svg>