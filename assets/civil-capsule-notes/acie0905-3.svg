<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Benkelman beam test position</title><desc id="desc">A test path 0.60 m in from the edge of a 3.75 m carriageway lies 1.875 - 0.60 = 1.275 m from the centreline. Rebound readings are normalised to a reference temperature, conventionally 35 °C.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><text x="360" y="50" font-size="16" fill="#273b45" text-anchor="middle">Benkelman beam test position</text><rect x="120" y="200" width="450" height="30" fill="#d6dfe3" stroke="#273b45" stroke-width="1.5"/><rect x="120" y="230" width="450" height="40" fill="#e4e8e9" stroke="none" stroke-width="2"/><line x1="345" y1="140" x2="345" y2="300" stroke="#647780" stroke-width="1.5" stroke-dasharray="8 4"/><text x="353" y="300" font-size="13" fill="#273b45" text-anchor="start">CL</text><rect x="170" y="160" width="18" height="40" rx="4" fill="#273b45" stroke="#273b45" stroke-width="2"/><rect x="196" y="160" width="18" height="40" rx="4" fill="#273b45" stroke="#273b45" stroke-width="2"/><circle cx="192" cy="198" r="4" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><text x="192" y="110" font-size="13" fill="#b64f4f" text-anchor="middle">probe between dual wheels</text><line x1="120" y1="150" x2="345" y2="150" stroke="#647780" stroke-width="1.5"/><line x1="120" y1="143" x2="120" y2="157" stroke="#647780" stroke-width="1.5"/><line x1="345" y1="143" x2="345" y2="157" stroke="#647780" stroke-width="1.5"/><text x="232.5" y="140" font-size="14" fill="#647780" text-anchor="middle">W/2 = 1.875 m</text><line x1="120" y1="250" x2="192" y2="250" stroke="#647780" stroke-width="1.5"/><line x1="120" y1="243" x2="120" y2="257" stroke="#647780" stroke-width="1.5"/><line x1="192" y1="243" x2="192" y2="257" stroke="#647780" stroke-width="1.5"/><text x="156" y="276" font-size="14" fill="#647780" text-anchor="middle">0.60 m</text><line x1="192" y1="290" x2="345" y2="290" stroke="#647780" stroke-width="1.5"/><line x1="192" y1="283" x2="192" y2="297" stroke="#647780" stroke-width="1.5"/><line x1="345" y1="283" x2="345" y2="297" stroke="#647780" stroke-width="1.5"/><text x="268.5" y="316" font-size="14" fill="#647780" text-anchor="middle">1.275 m from centreline</text><text x="360" y="348" font-size="15" fill="#287aab" text-anchor="middle">xCL = W/2 − xedge = 1.875 − 0.60 = 1.275 m</text><text x="360" y="372" font-size="14" fill="#273b45" text-anchor="middle">Readings normalised to 35 °C: asphalt stiffness depends on temperature</text><text x="360" y="396" font-size="13" fill="#647780" text-anchor="middle">State the datum: edge offset and centreline offset differ</text></g></svg>