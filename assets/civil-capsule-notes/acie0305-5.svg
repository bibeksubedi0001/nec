<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">A grain on a sloping channel bank</title><desc id="desc">On a bank the downslope pull of the submerged weight uses part of the grain's frictional resistance, so less flow drag is needed to start motion than on the bed.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><polygon points="30,215 200,300 340,300 460,240 460,350 30,350" fill="#f0e6d4" stroke="none" stroke-width="2" stroke-linejoin="round"/><polygon points="92,246 448,246 340,300 200,300" fill="#d8edf7" stroke="none" stroke-width="2" stroke-linejoin="round"/><line x1="92" y1="246" x2="448" y2="246" stroke="#287aab" stroke-width="2"/><path d="M30 215 L200 300 L340 300 L460 240" stroke="#273b45" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="200" y1="300" x2="120" y2="300" stroke="#647780" stroke-width="1.2" stroke-dasharray="4 4"/><path d="M150 300 A50 50 0 0 1 155.28 277.64" stroke="#2b7b61" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="136" y="292" font-size="17" fill="#2b7b61" text-anchor="middle">φ</text><circle cx="168" cy="269.5" r="12" fill="#f5ead8" stroke="#b98232" stroke-width="1.5"/><line x1="168" y1="269.5" x2="210.23" y2="290.57" stroke="#b64f4f" stroke-width="2.5"/><polygon points="218.1,294.5 206.25,293.62 210.27,285.56" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="224" y="292" font-size="15" fill="#b64f4f" text-anchor="start">W' sin φ</text><circle cx="196" cy="258" r="8" fill="none" stroke="#287aab" stroke-width="1.5"/><line x1="190" y1="252" x2="202" y2="264" stroke="#287aab" stroke-width="1.5"/><line x1="202" y1="252" x2="190" y2="264" stroke="#287aab" stroke-width="1.5"/><text x="212" y="263" font-size="15" fill="#287aab" text-anchor="start">drag along the channel</text><text x="250" y="190" font-size="16" fill="#273b45" text-anchor="middle">Bank angle φ, repose angle θ</text><text x="480" y="110" font-size="17" fill="#273b45" text-anchor="start">K = τbank / τbed</text><text x="480" y="138" font-size="17" fill="#273b45" text-anchor="start">= √(1 − sin²φ / sin²θ)</text><text x="480" y="190" font-size="15" fill="#273b45" text-anchor="start">θ = 35°:</text><text x="480" y="216" font-size="15" fill="#273b45" text-anchor="start">3H:1V bank, K ≈ 0.83</text><text x="480" y="242" font-size="15" fill="#273b45" text-anchor="start">2H:1V bank, K ≈ 0.63</text><text x="480" y="294" font-size="15" fill="#647780" text-anchor="start">Stipulated factor:</text><text x="480" y="318" font-size="15" fill="#647780" text-anchor="start">0.75 × 4 Pa = 3 Pa</text></g></svg>