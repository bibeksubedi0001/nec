<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Grit particle path in an ideal chamber</title><desc id="desc">A particle starting 1.0 m up and settling at 0.020 m/s takes 50 s to land, drifting 0.30 × 50 = 15 m along the chamber. Quartz-like grit of G = 2.65 has a density of 2650 kg/m³.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><text x="360" y="60" font-size="16" fill="#273b45" text-anchor="middle">t = h / vs = 1.0 / 0.020 = 50 s</text><text x="360" y="86" font-size="15" fill="#273b45" text-anchor="middle">grit G = 2.65: ρp = 2650 kg/m³, excess over water 1650</text><text x="360" y="112" font-size="14" fill="#647780" text-anchor="middle">0.20 mm target: a chosen performance goal, not a cut-off</text><rect x="100" y="150" width="520" height="150" fill="#d8edf7" stroke="#273b45" stroke-width="2"/><line x1="40" y1="190" x2="87.2" y2="190" stroke="#287aab" stroke-width="3"/><polygon points="96,190 85,194.5 85,185.5" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><line x1="108" y1="154" x2="620" y2="298" stroke="#b64f4f" stroke-width="2" stroke-dasharray="7 5"/><circle cx="108" cy="154" r="5" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><circle cx="460" cy="296" r="3" fill="#b98232" stroke="#b98232" stroke-width="2"/><circle cx="472" cy="296" r="3" fill="#b98232" stroke="#b98232" stroke-width="2"/><circle cx="484" cy="296" r="3" fill="#b98232" stroke="#b98232" stroke-width="2"/><circle cx="496" cy="296" r="3" fill="#b98232" stroke="#b98232" stroke-width="2"/><circle cx="508" cy="296" r="3" fill="#b98232" stroke="#b98232" stroke-width="2"/><circle cx="520" cy="296" r="3" fill="#b98232" stroke="#b98232" stroke-width="2"/><circle cx="532" cy="296" r="3" fill="#b98232" stroke="#b98232" stroke-width="2"/><circle cx="544" cy="296" r="3" fill="#b98232" stroke="#b98232" stroke-width="2"/><circle cx="556" cy="296" r="3" fill="#b98232" stroke="#b98232" stroke-width="2"/><circle cx="568" cy="296" r="3" fill="#b98232" stroke="#b98232" stroke-width="2"/><circle cx="580" cy="296" r="3" fill="#b98232" stroke="#b98232" stroke-width="2"/><circle cx="592" cy="296" r="3" fill="#b98232" stroke="#b98232" stroke-width="2"/><circle cx="604" cy="296" r="3" fill="#b98232" stroke="#b98232" stroke-width="2"/><circle cx="616" cy="296" r="3" fill="#b98232" stroke="#b98232" stroke-width="2"/><line x1="360" y1="227" x2="421.2" y2="227" stroke="#287aab" stroke-width="2.5"/><polygon points="430,227 419,231.5 419,222.5" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><text x="438" y="232" font-size="14" fill="#287aab" text-anchor="start">vh = 0.30 m/s</text><line x1="360" y1="227" x2="360" y2="257.2" stroke="#b64f4f" stroke-width="2.5"/><polygon points="360,266 355.5,255 364.5,255" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="352" y="262" font-size="14" fill="#b64f4f" text-anchor="end">vs = 0.020 m/s</text><text x="530" y="250" font-size="14" fill="#b64f4f" text-anchor="middle">particle path</text><line x1="80" y1="150" x2="80" y2="300" stroke="#647780" stroke-width="1.5"/><line x1="87" y1="150" x2="73" y2="150" stroke="#647780" stroke-width="1.5"/><line x1="87" y1="300" x2="73" y2="300" stroke="#647780" stroke-width="1.5"/><text x="70" y="231" font-size="15" fill="#647780" text-anchor="end">h = 1.0 m</text><line x1="100" y1="324" x2="620" y2="324" stroke="#647780" stroke-width="1.5"/><line x1="100" y1="317" x2="100" y2="331" stroke="#647780" stroke-width="1.5"/><line x1="620" y1="317" x2="620" y2="331" stroke="#647780" stroke-width="1.5"/><text x="360" y="350" font-size="18" fill="#647780" text-anchor="middle">L = vh t = 0.30 × 50 = 15 m</text><text x="360" y="396" font-size="14" fill="#647780" text-anchor="middle">Keep the horizontal and settling velocities distinct</text></g></svg>