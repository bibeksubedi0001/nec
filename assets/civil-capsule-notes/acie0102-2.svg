<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Fineness modulus from a sieve stack</title><desc id="desc">Cumulative percentages retained on the specified sieves are added and divided by 100; the illustrative values give 2.80, and a higher value means coarser grading.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><text x="560" y="44" font-size="16" fill="#647780" text-anchor="middle">Cumulative % retained</text><rect x="70" y="58" width="210" height="34" rx="4" fill="#d6dfe3" stroke="#647780" stroke-width="1.5"/><text x="175" y="81" font-size="17" fill="#273b45" text-anchor="middle">4.75 mm</text><line x1="286" y1="75" x2="438" y2="75" stroke="#b8c8ce" stroke-width="1.2" stroke-dasharray="3 5"/><text x="470" y="81" font-size="18" fill="#273b45" text-anchor="end">2</text><rect x="482" y="66" width="4" height="18" fill="#e6f1f8" stroke="#287aab" stroke-width="1.5"/><rect x="70" y="102" width="210" height="34" rx="4" fill="#d6dfe3" stroke="#647780" stroke-width="1.5"/><text x="175" y="125" font-size="17" fill="#273b45" text-anchor="middle">2.36 mm</text><line x1="286" y1="119" x2="438" y2="119" stroke="#b8c8ce" stroke-width="1.2" stroke-dasharray="3 5"/><text x="470" y="125" font-size="18" fill="#273b45" text-anchor="end">10</text><rect x="482" y="110" width="20" height="18" fill="#e6f1f8" stroke="#287aab" stroke-width="1.5"/><rect x="70" y="146" width="210" height="34" rx="4" fill="#d6dfe3" stroke="#647780" stroke-width="1.5"/><text x="175" y="169" font-size="17" fill="#273b45" text-anchor="middle">1.18 mm</text><line x1="286" y1="163" x2="438" y2="163" stroke="#b8c8ce" stroke-width="1.2" stroke-dasharray="3 5"/><text x="470" y="169" font-size="18" fill="#273b45" text-anchor="end">30</text><rect x="482" y="154" width="60" height="18" fill="#e6f1f8" stroke="#287aab" stroke-width="1.5"/><rect x="70" y="190" width="210" height="34" rx="4" fill="#d6dfe3" stroke="#647780" stroke-width="1.5"/><text x="175" y="213" font-size="17" fill="#273b45" text-anchor="middle">600 µm</text><line x1="286" y1="207" x2="438" y2="207" stroke="#b8c8ce" stroke-width="1.2" stroke-dasharray="3 5"/><text x="470" y="213" font-size="18" fill="#273b45" text-anchor="end">55</text><rect x="482" y="198" width="110" height="18" fill="#e6f1f8" stroke="#287aab" stroke-width="1.5"/><rect x="70" y="234" width="210" height="34" rx="4" fill="#d6dfe3" stroke="#647780" stroke-width="1.5"/><text x="175" y="257" font-size="17" fill="#273b45" text-anchor="middle">300 µm</text><line x1="286" y1="251" x2="438" y2="251" stroke="#b8c8ce" stroke-width="1.2" stroke-dasharray="3 5"/><text x="470" y="257" font-size="18" fill="#273b45" text-anchor="end">85</text><rect x="482" y="242" width="170" height="18" fill="#e6f1f8" stroke="#287aab" stroke-width="1.5"/><rect x="70" y="278" width="210" height="34" rx="4" fill="#d6dfe3" stroke="#647780" stroke-width="1.5"/><text x="175" y="301" font-size="17" fill="#273b45" text-anchor="middle">150 µm</text><line x1="286" y1="295" x2="438" y2="295" stroke="#b8c8ce" stroke-width="1.2" stroke-dasharray="3 5"/><text x="470" y="301" font-size="18" fill="#273b45" text-anchor="end">98</text><rect x="482" y="286" width="196" height="18" fill="#e6f1f8" stroke="#287aab" stroke-width="1.5"/><rect x="70" y="322" width="210" height="30" rx="12" fill="#e9eef0" stroke="#647780" stroke-width="1.5"/><text x="175" y="343" font-size="16" fill="#647780" text-anchor="middle">Pan</text><text x="360" y="392" font-size="17" fill="#273b45" text-anchor="middle">FM = (2 + 10 + 30 + 55 + 85 + 98) / 100 = 2.80</text></g></svg>