<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Pressure change up a constant-area vertical pipe</title><desc id="desc">Equal areas mean equal velocities, so between two sections the lower pressure exceeds the upper by ρgΔz whether the water flows up or down.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><rect x="300" y="60" width="60" height="300" fill="#d8edf7" stroke="none" stroke-width="2"/><line x1="300" y1="50" x2="300" y2="370" stroke="#273b45" stroke-width="3"/><line x1="360" y1="50" x2="360" y2="370" stroke="#273b45" stroke-width="3"/><line x1="292" y1="110" x2="368" y2="110" stroke="#647780" stroke-width="1.5" stroke-dasharray="6 4"/><text x="286" y="115" font-size="15" fill="#273b45" text-anchor="end">upper section</text><line x1="292" y1="310" x2="368" y2="310" stroke="#647780" stroke-width="1.5" stroke-dasharray="6 4"/><text x="286" y="315" font-size="15" fill="#273b45" text-anchor="end">lower section</text><line x1="318" y1="280" x2="318" y2="148.8" stroke="#287aab" stroke-width="2.5"/><polygon points="318,140 322.5,151 313.5,151" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><line x1="342" y1="140" x2="342" y2="271.2" stroke="#647780" stroke-width="2.5" stroke-dasharray="6 4"/><polygon points="342,280 337.5,269 346.5,269" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><line x1="390" y1="110" x2="390" y2="310" stroke="#647780" stroke-width="1.5"/><line x1="397" y1="110" x2="383" y2="110" stroke="#647780" stroke-width="1.5"/><line x1="397" y1="310" x2="383" y2="310" stroke="#647780" stroke-width="1.5"/><text x="400" y="216" font-size="16" fill="#647780" text-anchor="start">Δz = 3 m</text><text x="480" y="130" font-size="17" fill="#273b45" text-anchor="start">p lower − p upper = ρ g Δz</text><text x="480" y="156" font-size="16" fill="#273b45" text-anchor="start">= 1000 × 9.81 × 3</text><text x="480" y="182" font-size="16" fill="#2b7b61" text-anchor="start">= 29.43 kPa, up or down</text><text x="480" y="262" font-size="15" fill="#647780" text-anchor="start">With a loss hL:</text><text x="480" y="286" font-size="15" fill="#647780" text-anchor="start">down: ρ g (Δz − hL)</text><text x="480" y="310" font-size="15" fill="#647780" text-anchor="start">up: ρ g (Δz + hL)</text><text x="360" y="400" font-size="15" fill="#273b45" text-anchor="middle">p/ρg + z = constant when velocities are equal and losses are nil</text></g></svg>