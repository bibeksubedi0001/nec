<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Risk as variability, and when to analyse it</title><desc id="desc">Returns of 8 or 12 percent and of 4 or 16 percent share a 10 percent mean, but their standard deviations are 2 and 6 points. Detailed risk analysis pays most in planning, and is updated as work proceeds.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><text x="80" y="72" font-size="14" fill="#287aab" text-anchor="start">A: 8% or 12%, equally likely: σ = 2 points</text><line x1="80" y1="140" x2="580" y2="140" stroke="#647780" stroke-width="2"/><rect x="270" y="92" width="20" height="48" fill="#e6f1f8" stroke="#287aab" stroke-width="2"/><rect x="370" y="92" width="20" height="48" fill="#e6f1f8" stroke="#287aab" stroke-width="2"/><text x="80" y="184" font-size="14" fill="#b64f4f" text-anchor="start">B: 4% or 16%: σ = 6 points, riskier on this measure</text><line x1="80" y1="250" x2="580" y2="250" stroke="#647780" stroke-width="2"/><rect x="170" y="202" width="20" height="48" fill="#f2dfdf" stroke="#b64f4f" stroke-width="2"/><rect x="470" y="202" width="20" height="48" fill="#f2dfdf" stroke="#b64f4f" stroke-width="2"/><text x="80" y="268" font-size="12" fill="#273b45" text-anchor="middle">0%</text><text x="205" y="268" font-size="12" fill="#273b45" text-anchor="middle">5%</text><text x="330" y="268" font-size="12" fill="#273b45" text-anchor="middle">10%</text><text x="455" y="268" font-size="12" fill="#273b45" text-anchor="middle">15%</text><text x="580" y="268" font-size="12" fill="#273b45" text-anchor="middle">20%</text><line x1="330" y1="84" x2="330" y2="256" stroke="#647780" stroke-width="1.5" stroke-dasharray="5 4"/><text x="338" y="162" font-size="13" fill="#647780" text-anchor="start">mean 10% for both</text><rect x="40" y="290" width="230" height="36" rx="8" fill="#f5ead8" stroke="#b98232" stroke-width="2"/><text x="155" y="312.68" font-size="13" fill="#273b45" text-anchor="middle">Planning: options still open</text><rect x="300" y="290" width="100" height="36" rx="8" fill="#e6f1f8" stroke="#287aab" stroke-width="2"/><text x="350" y="312.68" font-size="13" fill="#273b45" text-anchor="middle">Design</text><rect x="430" y="290" width="120" height="36" rx="8" fill="#e6f1f8" stroke="#287aab" stroke-width="2"/><text x="490" y="312.68" font-size="13" fill="#273b45" text-anchor="middle">Construction</text><rect x="580" y="290" width="110" height="36" rx="8" fill="#e6f1f8" stroke="#287aab" stroke-width="2"/><text x="635" y="312.68" font-size="13" fill="#273b45" text-anchor="middle">Operation</text><line x1="272" y1="308" x2="291.6" y2="308" stroke="#647780" stroke-width="2"/><polygon points="298,308 290,311.5 290,304.5" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><line x1="402" y1="308" x2="421.6" y2="308" stroke="#647780" stroke-width="2"/><polygon points="428,308 420,311.5 420,304.5" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><line x1="552" y1="308" x2="571.6" y2="308" stroke="#647780" stroke-width="2"/><polygon points="578,308 570,311.5 570,304.5" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><path d="M635 328 Q500 372 360 330" stroke="#287aab" stroke-width="1.5" fill="none" stroke-dasharray="5 4" stroke-linejoin="round" stroke-linecap="round"/><polygon points="358,330 369.88,330.14 366.38,338.43" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><text x="500" y="374" font-size="13" fill="#287aab" text-anchor="middle">monitor and update</text><text x="360" y="404" font-size="13" fill="#647780" text-anchor="middle">Variability is one financial measure, not the whole of project risk</text></g></svg>