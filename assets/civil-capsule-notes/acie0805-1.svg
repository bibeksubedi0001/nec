<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Heading and bench, trimmer holes and the work cycle</title><desc id="desc">In heading and benching the upper heading is excavated first and the bench follows. Trimmer holes form the final outline and limit overbreak. The cycle runs mark, drill, charge and blast, ventilate, clear misfires, muck.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><path d="M70 220 L70 170 A110 110 0 0 1 290 170 L290 220 Z" stroke="none" stroke-width="2" fill="#e6f1f8" stroke-linejoin="round" stroke-linecap="round"/><rect x="70" y="220" width="220" height="100" fill="#f5ead8" stroke="none" stroke-width="2"/><line x1="70" y1="220" x2="290" y2="220" stroke="#647780" stroke-width="1.5" stroke-dasharray="6 4"/><path d="M70 320 L70 170 A110 110 0 0 1 290 170 L290 320 Z" stroke="#273b45" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="78" cy="170" r="3" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><circle cx="84.15" cy="135.11" r="3" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><circle cx="101.86" cy="104.44" r="3" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><circle cx="129" cy="81.67" r="3" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><circle cx="162.29" cy="69.55" r="3" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><circle cx="197.71" cy="69.55" r="3" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><circle cx="231" cy="81.67" r="3" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><circle cx="258.14" cy="104.44" r="3" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><circle cx="275.85" cy="135.11" r="3" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><circle cx="282" cy="170" r="3" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><circle cx="78" cy="195" r="3" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><circle cx="282" cy="195" r="3" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><circle cx="78" cy="218" r="3" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><circle cx="282" cy="218" r="3" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><circle cx="78" cy="241" r="3" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><circle cx="282" cy="241" r="3" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><circle cx="78" cy="264" r="3" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><circle cx="282" cy="264" r="3" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><circle cx="78" cy="287" r="3" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><circle cx="282" cy="287" r="3" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><circle cx="78" cy="310" r="3" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><circle cx="282" cy="310" r="3" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><circle cx="172" cy="142" r="3.5" fill="#273b45" stroke="#273b45" stroke-width="2"/><circle cx="188" cy="142" r="3.5" fill="#273b45" stroke="#273b45" stroke-width="2"/><circle cx="172" cy="158" r="3.5" fill="#273b45" stroke="#273b45" stroke-width="2"/><circle cx="188" cy="158" r="3.5" fill="#273b45" stroke="#273b45" stroke-width="2"/><text x="200" y="136" font-size="13" fill="#273b45" text-anchor="start">cut</text><text x="180" y="200" font-size="15" fill="#287aab" text-anchor="middle">heading (first)</text><text x="180" y="280" font-size="15" fill="#b98232" text-anchor="middle">bench (after)</text><text x="180" y="46" font-size="14" fill="#b64f4f" text-anchor="middle">trimmer holes: final outline</text><line x1="360" y1="30" x2="360" y2="340" stroke="#b8c8ce" stroke-width="1.5" stroke-dasharray="6 5"/><rect x="400" y="40" width="290" height="34" rx="8" fill="#e6f1f8" stroke="#287aab" stroke-width="2"/><text x="545" y="62.04" font-size="14" fill="#273b45" text-anchor="middle">1  Mark the tunnel profile</text><rect x="400" y="90" width="290" height="34" rx="8" fill="#e6f1f8" stroke="#287aab" stroke-width="2"/><text x="545" y="112.04" font-size="14" fill="#273b45" text-anchor="middle">2  Set up and drill</text><line x1="545" y1="76" x2="545" y2="82.6" stroke="#647780" stroke-width="2"/><polygon points="545,89 541.5,81 548.5,81" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><rect x="400" y="140" width="290" height="34" rx="8" fill="#fbfcfd" stroke="#647780" stroke-width="2"/><text x="545" y="162.04" font-size="14" fill="#273b45" text-anchor="middle">charge and blast</text><rect x="400" y="140" width="290" height="34" rx="8" fill="none" stroke="#647780" stroke-width="1.5" stroke-dasharray="5 4"/><line x1="545" y1="126" x2="545" y2="132.6" stroke="#647780" stroke-width="2"/><polygon points="545,139 541.5,131 548.5,131" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><rect x="400" y="190" width="290" height="34" rx="8" fill="#e6f1f8" stroke="#287aab" stroke-width="2"/><text x="545" y="212.04" font-size="14" fill="#273b45" text-anchor="middle">3  Ventilate, verify the atmosphere</text><line x1="545" y1="176" x2="545" y2="182.6" stroke="#647780" stroke-width="2"/><polygon points="545,189 541.5,181 548.5,181" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><rect x="400" y="240" width="290" height="34" rx="8" fill="#e6f1f8" stroke="#287aab" stroke-width="2"/><text x="545" y="262.04" font-size="14" fill="#273b45" text-anchor="middle">4  Competent person clears misfires</text><line x1="545" y1="226" x2="545" y2="232.6" stroke="#647780" stroke-width="2"/><polygon points="545,239 541.5,231 548.5,231" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><rect x="400" y="290" width="290" height="34" rx="8" fill="#e6f1f8" stroke="#287aab" stroke-width="2"/><text x="545" y="312.04" font-size="14" fill="#273b45" text-anchor="middle">5  Remove the muck</text><line x1="545" y1="276" x2="545" y2="282.6" stroke="#647780" stroke-width="2"/><polygon points="545,289 541.5,281 548.5,281" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><path d="M400 312 Q380 312 380 290 L380 70 Q380 57 396 57" stroke="#647780" stroke-width="2" fill="none" stroke-dasharray="5 4" stroke-linejoin="round" stroke-linecap="round"/><polygon points="398,57 387,61.5 387,52.5" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><text x="360" y="368" font-size="13" fill="#647780" text-anchor="middle">Stage order only, not an operational blasting procedure</text><text x="360" y="392" font-size="13" fill="#647780" text-anchor="middle">Not only for self-supporting rock; access and equipment set mucking speed</text></g></svg>