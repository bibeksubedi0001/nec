<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Mohr circle for principal stresses 180 and 60 kPa</title><desc id="desc">The centre is the mean principal stress and the radius half their difference; a plane rotated by θ in the element moves 2θ around the circle.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="70" y1="230" x2="660" y2="230" stroke="#647780" stroke-width="2"/><polygon points="668,230 658,234 658,226" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><text x="660" y="214" font-size="19" fill="#273b45" text-anchor="end">σ</text><line x1="90" y1="402" x2="90" y2="60" stroke="#647780" stroke-width="2"/><polygon points="90,52 94,62 86,62" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><text x="102" y="60" font-size="19" fill="#273b45" text-anchor="start">τ</text><circle cx="378" cy="230" r="144" fill="none" stroke="#287aab" stroke-width="3"/><line x1="378" y1="230" x2="470.56" y2="119.69" stroke="#273b45" stroke-width="2"/><line x1="378" y1="230" x2="522" y2="230" stroke="#273b45" stroke-width="2.5"/><path d="M424 230 A46 46 0 0 0 407.57 194.76" stroke="#2b7b61" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="434" y="212" font-size="17" fill="#2b7b61" text-anchor="start">2θ</text><circle cx="470.56" cy="119.69" r="5" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><text x="482.56" y="111.69" font-size="15" fill="#b64f4f" text-anchor="start">plane at θ</text><circle cx="234" cy="230" r="4" fill="#273b45" stroke="#273b45" stroke-width="2"/><text x="226" y="254" font-size="15" fill="#273b45" text-anchor="end">σ3 = 60</text><circle cx="522" cy="230" r="4" fill="#273b45" stroke="#273b45" stroke-width="2"/><text x="530" y="254" font-size="15" fill="#273b45" text-anchor="start">σ1 = 180</text><circle cx="378" cy="230" r="4" fill="#273b45" stroke="#273b45" stroke-width="2"/><text x="378" y="254" font-size="15" fill="#273b45" text-anchor="middle">C = 120</text><text x="364" y="176" font-size="16" fill="#287aab" text-anchor="end">R = 60</text></g></svg>