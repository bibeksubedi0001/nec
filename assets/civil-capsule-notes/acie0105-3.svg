<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Coordinate area by the shoelace rule</title><desc id="desc">Cross products of successive coordinates, summed around the figure and halved, give the plan area; the illustrative quadrilateral has an area of 20 square units.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="60" y1="360" x2="60" y2="80" stroke="#b8c8ce" stroke-width="1"/><line x1="100" y1="360" x2="100" y2="80" stroke="#b8c8ce" stroke-width="1"/><line x1="140" y1="360" x2="140" y2="80" stroke="#b8c8ce" stroke-width="1"/><line x1="180" y1="360" x2="180" y2="80" stroke="#b8c8ce" stroke-width="1"/><line x1="220" y1="360" x2="220" y2="80" stroke="#b8c8ce" stroke-width="1"/><line x1="260" y1="360" x2="260" y2="80" stroke="#b8c8ce" stroke-width="1"/><line x1="300" y1="360" x2="300" y2="80" stroke="#b8c8ce" stroke-width="1"/><line x1="340" y1="360" x2="340" y2="80" stroke="#b8c8ce" stroke-width="1"/><line x1="380" y1="360" x2="380" y2="80" stroke="#b8c8ce" stroke-width="1"/><line x1="60" y1="360" x2="380" y2="360" stroke="#b8c8ce" stroke-width="1"/><line x1="60" y1="320" x2="380" y2="320" stroke="#b8c8ce" stroke-width="1"/><line x1="60" y1="280" x2="380" y2="280" stroke="#b8c8ce" stroke-width="1"/><line x1="60" y1="240" x2="380" y2="240" stroke="#b8c8ce" stroke-width="1"/><line x1="60" y1="200" x2="380" y2="200" stroke="#b8c8ce" stroke-width="1"/><line x1="60" y1="160" x2="380" y2="160" stroke="#b8c8ce" stroke-width="1"/><line x1="60" y1="120" x2="380" y2="120" stroke="#b8c8ce" stroke-width="1"/><line x1="60" y1="80" x2="380" y2="80" stroke="#b8c8ce" stroke-width="1"/><polygon points="100,320 340,280 300,120 140,160" fill="#e6f1f8" stroke="#287aab" stroke-width="2.5" stroke-linejoin="round"/><circle cx="100" cy="320" r="5" fill="#287aab" stroke="#287aab" stroke-width="2"/><text x="94" y="342" font-size="15" fill="#273b45" text-anchor="end">A (1, 1)</text><circle cx="340" cy="280" r="5" fill="#287aab" stroke="#287aab" stroke-width="2"/><text x="348" y="300" font-size="15" fill="#273b45" text-anchor="start">B (7, 2)</text><circle cx="300" cy="120" r="5" fill="#287aab" stroke="#287aab" stroke-width="2"/><text x="308" y="110" font-size="15" fill="#273b45" text-anchor="start">C (6, 6)</text><circle cx="140" cy="160" r="5" fill="#287aab" stroke="#287aab" stroke-width="2"/><text x="134" y="150" font-size="15" fill="#273b45" text-anchor="end">D (2, 5)</text><text x="430" y="100" font-size="17" fill="#273b45" text-anchor="start">(1×2 − 7×1) = −5</text><text x="430" y="132" font-size="17" fill="#273b45" text-anchor="start">(7×6 − 6×2) = 30</text><text x="430" y="164" font-size="17" fill="#273b45" text-anchor="start">(6×5 − 2×6) = 18</text><text x="430" y="196" font-size="17" fill="#273b45" text-anchor="start">(2×1 − 1×5) = −3</text><text x="430" y="244" font-size="17" fill="#273b45" text-anchor="start">Sum = 40</text><text x="430" y="280" font-size="18" fill="#287aab" text-anchor="start">Area = 40 / 2 = 20</text></g></svg>