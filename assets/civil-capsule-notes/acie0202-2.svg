<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Void ratio against effective stress</title><desc id="desc">Over one load increment the void-ratio drop per unit stress rise is av; dividing by 1 + e0 converts it into the volumetric coefficient mv.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="100" y1="330" x2="626" y2="330" stroke="#647780" stroke-width="2"/><polygon points="634,330 624,334 624,326" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><line x1="100" y1="330" x2="100" y2="64" stroke="#647780" stroke-width="2"/><polygon points="100,56 104,66 96,66" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><text x="360" y="370" font-size="19" fill="#273b45" text-anchor="middle">Effective stress σ', kPa</text><text x="106" y="46" font-size="19" fill="#273b45" text-anchor="start">Void ratio e</text><path d="M100 101.87 L106.5 105.86 L113 109.8 L119.5 113.71 L126 117.57 L132.5 121.41 L139 125.2 L145.5 128.96 L152 132.67 L158.5 136.36 L165 140 L171.5 143.61 L178 147.17 L184.5 150.71 L191 154.2 L197.5 157.66 L204 161.07 L210.5 164.46 L217 167.8 L223.5 171.11 L230 174.37 L236.5 177.61 L243 180.8 L249.5 183.96 L256 187.07 L262.5 190.16 L269 193.2 L275.5 196.21 L282 199.17 L288.5 202.11 L295 205 L301.5 207.86 L308 210.67 L314.5 213.46 L321 216.2 L327.5 218.91 L334 221.57 L340.5 224.21 L347 226.8 L353.5 229.36 L360 231.87 L366.5 234.36 L373 236.8 L379.5 239.21 L386 241.58 L392.5 243.91 L399 246.2 L405.5 248.46 L412 250.67 L418.5 252.86 L425 255 L431.5 257.11 L438 259.17 L444.5 261.21 L451 263.2 L457.5 265.16 L464 267.07 L470.5 268.96 L477 270.8 L483.5 272.61 L490 274.38 L496.5 276.11 L503 277.8 L509.5 279.46 L516 281.07 L522.5 282.66 L529 284.2 L535.5 285.71 L542 287.17 L548.5 288.61 L555 290 L561.5 291.36 L568 292.67 L574.5 293.96 L581 295.2 L587.5 296.41 L594 297.57 L600.5 298.71 L607 299.8 L613.5 300.86 L620 301.87" stroke="#287aab" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="295" cy="205" r="5" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><line x1="295" y1="205" x2="295" y2="330" stroke="#647780" stroke-width="1.2" stroke-dasharray="4 5"/><line x1="100" y1="205" x2="295" y2="205" stroke="#647780" stroke-width="1.2" stroke-dasharray="4 5"/><circle cx="425" cy="255" r="5" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><line x1="425" y1="255" x2="425" y2="330" stroke="#647780" stroke-width="1.2" stroke-dasharray="4 5"/><line x1="100" y1="255" x2="425" y2="255" stroke="#647780" stroke-width="1.2" stroke-dasharray="4 5"/><text x="94" y="210" font-size="14" fill="#273b45" text-anchor="end">0.80</text><text x="94" y="260" font-size="14" fill="#273b45" text-anchor="end">0.76</text><line x1="295" y1="300" x2="425" y2="300" stroke="#647780" stroke-width="1.5"/><line x1="295" y1="293" x2="295" y2="307" stroke="#647780" stroke-width="1.5"/><line x1="425" y1="293" x2="425" y2="307" stroke="#647780" stroke-width="1.5"/><text x="360" y="294" font-size="15" fill="#647780" text-anchor="middle">Δσ' = 100</text><text x="390" y="110" font-size="16" fill="#273b45" text-anchor="start">av = (0.80 − 0.76) / 100</text><text x="390" y="136" font-size="16" fill="#273b45" text-anchor="start">    = 0.00040 per kPa</text><text x="390" y="170" font-size="16" fill="#2b7b61" text-anchor="start">mv = av / (1 + e0)</text><text x="390" y="196" font-size="16" fill="#2b7b61" text-anchor="start">    = 0.000222 per kPa</text></g></svg>