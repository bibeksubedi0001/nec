<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Dry volume and cement for a 1:2:4 mix</title><desc id="desc">The finished volume is increased by the dry-volume factor, split in proportion to the mix parts, and the cement volume is converted to bags through its bulk density.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><rect x="80" y="200" width="120" height="120" fill="#d6dfe3" stroke="#273b45" stroke-width="2"/><text x="140" y="346" font-size="16" fill="#273b45" text-anchor="middle">1 m³ finished</text><line x1="210" y1="262" x2="281.2" y2="262" stroke="#287aab" stroke-width="3"/><polygon points="290,262 279,266.5 279,257.5" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><text x="250" y="250" font-size="18" fill="#287aab" text-anchor="middle">× f</text><rect x="300" y="135.2" width="120" height="26.4" fill="#f5ead8" stroke="#b98232" stroke-width="2"/><rect x="300" y="161.6" width="120" height="52.8" fill="#f0e6d4" stroke="#b98232" stroke-width="2"/><rect x="300" y="214.4" width="120" height="105.6" fill="#d6dfe3" stroke="#647780" stroke-width="2"/><text x="440" y="154.4" font-size="16" fill="#273b45" text-anchor="start">Cement, 1 part</text><text x="440" y="194" font-size="16" fill="#273b45" text-anchor="start">Sand, 2 parts</text><text x="440" y="273.2" font-size="16" fill="#273b45" text-anchor="start">Coarse aggregate, 4 parts</text><text x="360" y="110" font-size="16" fill="#647780" text-anchor="middle">Dry loose volume</text><text x="360" y="362" font-size="16" fill="#273b45" text-anchor="middle">Vdry = f × V, with f about 1.50 to 1.55</text><text x="360" y="390" font-size="16" fill="#273b45" text-anchor="middle">Vc = Vdry / 7;  bags n = ρb × Vc / 50 kg</text></g></svg>