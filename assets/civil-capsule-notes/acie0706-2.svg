<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Draining a closed hollow, and bedding</title><desc id="desc">A closed depression stays ponded until a graded channel links it to a workable outlet. Bedding shapes a field into raised beds with dead furrows between them that lead excess water away.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><text x="185" y="60" font-size="15" fill="#273b45" text-anchor="middle">Closed hollow: give it an outlet</text><polygon points="20,140 90,150 130,220 190,222 240,160 300,170 330,255 350,255 350,320 20,320" fill="#f0e6d4" stroke="none" stroke-width="2" stroke-linejoin="round"/><polygon points="117,198 209,198 190,222 130,220" fill="#d8edf7" stroke="none" stroke-width="2" stroke-linejoin="round"/><path d="M20 140 L90 150 L130 220 L190 222 L240 160 L300 170 L330 255 L350 255" stroke="#273b45" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="190" y1="222" x2="330" y2="252" stroke="#2b7b61" stroke-width="3" stroke-dasharray="7 4"/><text x="162" y="188" font-size="14" fill="#287aab" text-anchor="middle">ponded hollow</text><text x="250" y="290" font-size="14" fill="#2b7b61" text-anchor="middle">graded outlet channel</text><text x="346" y="276" font-size="13" fill="#273b45" text-anchor="end">outlet</text><line x1="360" y1="40" x2="360" y2="330" stroke="#b8c8ce" stroke-width="1.5" stroke-dasharray="6 5"/><text x="535" y="60" font-size="15" fill="#273b45" text-anchor="middle">Bedding</text><rect x="370" y="250" width="330" height="70" fill="#f0e6d4" stroke="none" stroke-width="2"/><path d="M370 256 L380 256 Q410 196 440 256 L460 256 L460 256 Q490 196 520 256 L540 256 L540 256 Q570 196 600 256 L620 256 L620 256 Q650 196 680 256 L700 256 L690 256 L690 320 L370 320 Z" stroke="#273b45" stroke-width="2" fill="#f0e6d4" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="450" cy="254" rx="9" ry="3" fill="#d8edf7" stroke="#287aab" stroke-width="1"/><ellipse cx="530" cy="254" rx="9" ry="3" fill="#d8edf7" stroke="#287aab" stroke-width="1"/><ellipse cx="610" cy="254" rx="9" ry="3" fill="#d8edf7" stroke="#287aab" stroke-width="1"/><ellipse cx="690" cy="254" rx="9" ry="3" fill="#d8edf7" stroke="#287aab" stroke-width="1"/><text x="530" y="185" font-size="14" fill="#273b45" text-anchor="middle">raised beds</text><text x="535" y="290" font-size="14" fill="#287aab" text-anchor="middle">dead furrows lead water to an outlet</text><text x="360" y="370" font-size="14" fill="#273b45" text-anchor="middle">Smoothing a hollow that keeps a closed contour does not drain it</text><text x="360" y="394" font-size="13" fill="#647780" text-anchor="middle">Bedding is surface shaping, unlike tile, mole or pumped drainage</text></g></svg>