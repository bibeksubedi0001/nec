<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Cold-front and warm-front lifting</title><desc id="desc">Advancing cold air undercuts warm moist air steeply at a cold front, giving short intense showers; a gentle warm front lifts air slowly and spreads lighter, longer rain.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><polygon points="40,190 40,70 150,80 260,130 330,190" fill="#e6f1f8" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><line x1="40" y1="190" x2="680" y2="190" stroke="#273b45" stroke-width="2.5"/><path d="M440 175 Q330 160 300 92" stroke="#b64f4f" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="300,92 308.56,100.25 300.32,103.88" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><ellipse cx="284" cy="77" rx="24.5" ry="14.7" fill="#ffffff" stroke="#647780" stroke-width="1.2"/><ellipse cx="305" cy="63" rx="31.5" ry="18.9" fill="#ffffff" stroke="#647780" stroke-width="1.2"/><ellipse cx="326" cy="77" rx="24.5" ry="14.7" fill="#ffffff" stroke="#647780" stroke-width="1.2"/><line x1="282" y1="104" x2="276" y2="150" stroke="#287aab" stroke-width="1.5"/><line x1="292" y1="104" x2="286" y2="150" stroke="#287aab" stroke-width="1.5"/><line x1="302" y1="104" x2="296" y2="150" stroke="#287aab" stroke-width="1.5"/><line x1="312" y1="104" x2="306" y2="150" stroke="#287aab" stroke-width="1.5"/><line x1="322" y1="104" x2="316" y2="150" stroke="#287aab" stroke-width="1.5"/><line x1="332" y1="104" x2="326" y2="150" stroke="#287aab" stroke-width="1.5"/><text x="110" y="160" font-size="16" fill="#287aab" text-anchor="middle">cold air</text><text x="520" y="160" font-size="16" fill="#b64f4f" text-anchor="middle">warm moist air</text><text x="560" y="64" font-size="16" fill="#273b45" text-anchor="middle">Cold front: steep