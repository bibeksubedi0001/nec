<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Hairpin bend values in NRS 2070 Table 9-3</title><desc id="desc">NRS 2070 Table 9-3 gives a hairpin design speed of 20 km/h, a minimum radius of 15 m and a maximum longitudinal gradient of 4 percent; swept path and widening must still be checked.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><text x="360" y="40" font-size="16" fill="#273b45" text-anchor="middle">Hairpin bend (hill road)</text><path d="M100 110 L480 110 A70 70 0 0 1 480 250 L100 250" stroke="#273b45" stroke-width="46" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M100 110 L480 110 A70 70 0 0 1 480 250 L100 250" stroke="#e4e8e9" stroke-width="40" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M100 110 L480 110 A70 70 0 0 1 480 250 L100 250" stroke="#ffffff" stroke-width="1.5" fill="none" stroke-dasharray="10 8" stroke-linejoin="round" stroke-linecap="round"/><line x1="480" y1="180" x2="540.8" y2="180" stroke="#b64f4f" stroke-width="2.5"/><polygon points="548,180 539,184 539,176" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="470" y="185" font-size="15" fill="#b64f4f" text-anchor="end">R ≥ 15 m</text><text x="300" y="104" font-size="14" fill="#273b45" text-anchor="middle">grade ≤ 4%</text><text x="300" y="244" font-size="14" fill="#273b45" text-anchor="middle">design speed 20 km/h</text><text x="360" y="316" font-size="14" fill="#273b45" text-anchor="middle">NRS 2070 Table 9-3: speed 20 km/h, min radius 15 m, max gradient 4%</text><text x="360" y="340" font-size="13" fill="#273b45" text-anchor="middle">The 10% entry is superelevation; 0.4% is a tunnel drainage gradient</text><text x="360" y="364" font-size="13" fill="#647780" text-anchor="middle">Also check swept path, widening and clearance for long vehicles</text></g></svg>