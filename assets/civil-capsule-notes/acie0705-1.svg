<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Sarda fall: vertical drop, and a level crest is not a V-notch</title><desc id="desc">A Sarda fall drops water vertically over a raised crest wall into a protected cistern; its rating Q = 1.5 L H^(3/2) gives 12 cumecs for L = 8 m and H = 1 m. A level overflow crest is not a V-notch.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><text x="240" y="36" font-size="16" fill="#273b45" text-anchor="middle">Sarda fall: vertical drop into a cistern</text><text x="240" y="62" font-size="15" fill="#287aab" text-anchor="middle">Q = 1.5 L H^(3/2) = 1.5 × 8 × 1 = 12 m³/s</text><rect x="20" y="140" width="236" height="60" fill="#d8edf7" stroke="none" stroke-width="2"/><polygon points="300,232 460,232 460,270 440,270 420,300 300,300" fill="#d8edf7" stroke="none" stroke-width="2" stroke-linejoin="round"/><polygon points="20,200 250,200 262,160 300,160 300,300 420,300 440,270 460,270 460,330 20,330" fill="#f0e6d4" stroke="none" stroke-width="2" stroke-linejoin="round"/><polygon points="250,200 262,160 300,160 300,300 250,300" fill="#e4e8e9" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><path d="M20 200 L250 200" stroke="#273b45" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M300 300 L420 300 L440 270 L460 270" stroke="#273b45" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M262 147 Q308 147 318 296" stroke="#287aab" stroke-width="6" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="200" y="110" font-size="14" fill="#273b45" text-anchor="middle">raised crest wall</text><line x1="220" y1="116" x2="272" y2="158" stroke="#647780" stroke-width="1.2"/><text x="330" y="200" font-size="14" fill="#287aab" text-anchor="start">vertical drop</text><text x="362" y="318" font-size="14" fill="#273b45" text-anchor="middle">cistern</text><text x="240" y="356" font-size="13" fill="#273b45" text-anchor="middle">Inglis: glacis and baffle; Montague: parabolic glacis</text><text x="240" y="378" font-size="13" fill="#647780" text-anchor="middle">The rating is one check; cistern and foundation too</text><line x1="475" y1="30" x2="475" y2="390" stroke="#b8c8ce" stroke-width="1.5" stroke-dasharray="6 5"/><text x="590" y="80" font-size="15" fill="#273b45" text-anchor="middle">Transverse opening</text><rect x="500" y="100" width="180" height="90" fill="#d6dfe3" stroke="#273b45" stroke-width="1.5"/><rect x="502" y="120" width="176" height="30" fill="#d8edf7" stroke="none" stroke-width="2"/><line x1="500" y1="150" x2="680" y2="150" stroke="#273b45" stroke-width="4"/><text x="590" y="212" font-size="14" fill="#273b45" text-anchor="middle">level crest (Sarda)</text><rect x="500" y="240" width="180" height="90" fill="#d6dfe3" stroke="#273b45" stroke-width="1.5"/><polygon points="550,240 630,240 590,310" fill="#fbfcfd" stroke="#273b45" stroke-width="1.5" stroke-linejoin="round"/><polygon points="557,252 623,252 590,310" fill="#d8edf7" stroke="none" stroke-width="2" stroke-linejoin="round"/><text x="590" y="352" font-size="14" fill="#273b45" text-anchor="middle">V-notch: width grows with head</text></g></svg>