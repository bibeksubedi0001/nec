<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Buckled shape of a fixed-pinned column</title><desc id="desc">The exact root of tan α = α, 4.49341, puts the inflection point 0.301L above the fixed base, so the effective length is 0.699L rather than the approximate 0.707L.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><rect x="150" y="360" width="100" height="16" fill="#d6dfe3" stroke="#273b45" stroke-width="2"/><line x1="150" y1="364" x2="162" y2="376" stroke="#8a9aa3" stroke-width="1"/><line x1="158" y1="360" x2="174" y2="376" stroke="#8a9aa3" stroke-width="1"/><line x1="170" y1="360" x2="186" y2="376" stroke="#8a9aa3" stroke-width="1"/><line x1="182" y1="360" x2="198" y2="376" stroke="#8a9aa3" stroke-width="1"/><line x1="194" y1="360" x2="210" y2="376" stroke="#8a9aa3" stroke-width="1"/><line x1="206" y1="360" x2="222" y2="376" stroke="#8a9aa3" stroke-width="1"/><line x1="218" y1="360" x2="234" y2="376" stroke="#8a9aa3" stroke-width="1"/><line x1="230" y1="360" x2="246" y2="376" stroke="#8a9aa3" stroke-width="1"/><line x1="242" y1="360" x2="250" y2="368" stroke="#8a9aa3" stroke-width="1"/><line x1="200" y1="60" x2="200" y2="360" stroke="#647780" stroke-width="1.2" stroke-dasharray="6 5"/><path d="M200 360 L200.14 355 L200.55 350 L201.24 345 L202.18 340 L203.37 335 L204.8 330 L206.46 325 L208.33 320 L210.39 315 L212.64 310 L215.05 305 L217.6 300 L220.28 295 L223.06 290 L225.94 285 L228.87 280 L231.85 275 L234.86 270 L237.86 265 L240.84 260 L243.78 255 L246.66 250 L249.46 245 L252.15 240 L254.72 235 L257.14 230 L259.4 225 L261.49 220 L263.38 215 L265.05 210 L266.51 205 L267.73 200 L268.69 195 L269.4 190 L269.85 185 L270.01 180 L269.9 175 L269.5 170 L268.82 165 L267.85 160 L266.59 155 L265.05 150 L263.23 145 L261.13 140 L258.76 135 L256.14 130 L253.27 125 L250.15 120 L246.82 115 L243.27 110 L239.53 105 L235.6 100 L231.52 95 L227.29 90 L222.93 85 L218.48 80 L213.93 75 L209.32 70 L204.67 65 L200 60" stroke="#287aab" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="200" cy="60" r="6" fill="#ffffff" stroke="#273b45" stroke-width="2"/><line x1="172" y1="60" x2="190" y2="60" stroke="#273b45" stroke-width="3"/><line x1="210" y1="60" x2="228" y2="60" stroke="#273b45" stroke-width="3"/><line x1="200" y1="14" x2="200" y2="43.2" stroke="#b64f4f" stroke-width="3"/><polygon points="200,52 195.5,41 204.5,41" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="212" y="30" font-size="17" fill="#b64f4f" text-anchor="start">P</text><circle cx="235.01" cy="269.75" r="5" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><line x1="200" y1="269.75" x2="330" y2="269.75" stroke="#b64f4f" stroke-width="1.2" stroke-dasharray="4 4"/><text x="336" y="274.75" font-size="14" fill="#b64f4f" text-anchor="start">inflection</text><line x1="320" y1="60" x2="320" y2="269.75" stroke="#647780" stroke-width="1.5"/><line x1="327" y1="60" x2="313" y2="60" stroke="#647780" stroke-width="1.5"/><line x1="327" y1="269.75" x2="313" y2="269.75" stroke="#647780" stroke-width="1.5"/><text x="330" y="170.87" font-size="15" fill="#647780" text-anchor="start">Le = 0.699L</text><line x1="110" y1="60" x2="110" y2="360" stroke="#647780" stroke-width="1.5"/><line x1="117" y1="60" x2="103" y2="60" stroke="#647780" stroke-width="1.5"/><line x1="117" y1="360" x2="103" y2="360" stroke="#647780" stroke-width="1.5"/><text x="102" y="216" font-size="16" fill="#647780" text-anchor="end">L</text><text x="430" y="130" font-size="16" fill="#273b45" text-anchor="start">tan α = α, α = 4.49341</text><text x="430" y="162" font-size="16" fill="#273b45" text-anchor="start">Pcr = α² EI / L² ≈ 2.046 π² EI / L²</text><text x="430" y="202" font-size="16" fill="#2b7b61" text-anchor="start">K = π / α ≈ 0.699</text><text x="430" y="234" font-size="15" fill="#647780" text-anchor="start">Approximation L/√2 gives 0.707</text></g></svg>