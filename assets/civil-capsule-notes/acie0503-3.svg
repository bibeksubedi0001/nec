<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Standard U-hook as an anchorage credit</title><desc id="desc">A standard U-type tension hook is credited with an anchorage value of 16φ; the designer checks straight embedment plus that credit against the required development length.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><rect x="40" y="150" width="380" height="80" fill="#e4e8e9" stroke="#273b45" stroke-width="2"/><rect x="420" y="100" width="200" height="250" fill="#d6dfe3" stroke="#273b45" stroke-width="2"/><path d="M60 210 L560 210 A20 20 0 0 0 560 170 L520 170" stroke="#466d89" stroke-width="6" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="420" y1="250" x2="560" y2="250" stroke="#647780" stroke-width="1.5"/><line x1="420" y1="243" x2="420" y2="257" stroke="#647780" stroke-width="1.5"/><line x1="560" y1="243" x2="560" y2="257" stroke="#647780" stroke-width="1.5"/><text x="490" y="266" font-size="14" fill="#647780" text-anchor="middle">straight embedment</text><line x1="586" y1="190" x2="650" y2="150" stroke="#647780" stroke-width="1.2"/><text x="654" y="146" font-size="14" fill="#273b45" text-anchor="start">U-hook</text><text x="520" y="316" font-size="15" fill="#647780" text-anchor="middle">support</text><text x="140" y="194" font-size="14" fill="#273b45" text-anchor="middle">beam bar, diameter φ</text><text x="360" y="372" font-size="15" fill="#273b45" text-anchor="middle">Provided: straight embedment + 16φ (320 mm for φ20)</text><text x="360" y="398" font-size="14" fill="#647780" text-anchor="middle">Required Ld comes from the bar force and design bond; 16φ is not Ld</text></g></svg>