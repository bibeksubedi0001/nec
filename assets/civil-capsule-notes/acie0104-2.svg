<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Prism and pyramid</title><desc id="desc">A prism has two parallel congruent end faces joined by lateral faces; a pyramid has one base with triangular faces meeting at a single apex.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><polygon points="90,310 250,310 170,170" fill="#e6f1f8" stroke="#287aab" stroke-width="2" stroke-linejoin="round"/><polygon points="250,310 330,250 250,110 170,170" fill="#d2e6f2" stroke="#287aab" stroke-width="2" stroke-linejoin="round"/><polygon points="90,310 170,170 250,110 170,250" fill="#c3dcec" stroke="#287aab" stroke-width="2" stroke-linejoin="round"/><line x1="170" y1="250" x2="330" y2="250" stroke="#287aab" stroke-width="1.5" stroke-dasharray="6 5"/><polygon points="530,110 420,320 580,320" fill="#deeee6" stroke="#2b7b61" stroke-width="2" stroke-linejoin="round"/><polygon points="530,110 580,320 640,270" fill="#cfe6da" stroke="#2b7b61" stroke-width="2" stroke-linejoin="round"/><line x1="530" y1="110" x2="480" y2="270" stroke="#2b7b61" stroke-width="1.5" stroke-dasharray="6 5"/><line x1="640" y1="270" x2="480" y2="270" stroke="#2b7b61" stroke-width="1.5" stroke-dasharray="6 5"/><line x1="480" y1="270" x2="420" y2="320" stroke="#2b7b61" stroke-width="1.5" stroke-dasharray="6 5"/><text x="200" y="370" font-size="19" fill="#273b45" text-anchor="middle">Prism</text><text x="200" y="396" font-size="16" fill="#647780" text-anchor="middle">two parallel congruent ends</text><text x="530" y="370" font-size="19" fill="#273b45" text-anchor="middle">Pyramid</text><text x="530" y="396" font-size="16" fill="#647780" text-anchor="middle">one base, one common apex</text></g></svg>