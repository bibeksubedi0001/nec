<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Hydraulically efficient channel sections</title><desc id="desc">For a given area the best sections minimize wetted perimeter: the semicircle, the rectangle with B = 2y and the optimum trapezoid give R = y/2, the 90 degree triangle y/(2√2).</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><path d="M35 150 A60 60 0 0 0 155 150 Z" stroke="none" stroke-width="2" fill="#d8edf7" stroke-linejoin="round" stroke-linecap="round"/><path d="M35 135 L35 150 A60 60 0 0 0 155 150 L155 135" stroke="#273b45" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><rect x="190" y="150" width="120" height="60" fill="#d8edf7" stroke="none" stroke-width="2"/><path d="M190 135 L190 210 L310 210 L310 135" stroke="#273b45" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="340.1,150 509.9,150 449.9,210 400.1,210" fill="#d8edf7" stroke="none" stroke-width="2" stroke-linejoin="round"/><path d="M325.1 135 L400.1 210 L449.9 210 L524.9 135" stroke="#273b45" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="550,150 670,150 610,210" fill="#d8edf7" stroke="none" stroke-width="2" stroke-linejoin="round"/><path d="M535 135 L610 210 L685 135" stroke="#273b45" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="35" y1="150" x2="155" y2="150" stroke="#287aab" stroke-width="2"/><line x1="190" y1="150" x2="310" y2="150" stroke="#287aab" stroke-width="2"/><line x1="340.1" y1="150" x2="509.9" y2="150" stroke="#287aab" stroke-width="2"/><line x1="550" y1="150" x2="670" y2="150" stroke="#287aab" stroke-width="2"/><line x1="22" y1="150" x2="22" y2="210" stroke="#647780" stroke-width="1.5"/><line x1="29" y1="150" x2="15" y2="150" stroke="#647780" stroke-width="1.5"/><line x1="29" y1="210" x2="15" y2="210" stroke="#647780" stroke-width="1.5"/><text x="16" y="186" font-size="15" fill="#647780" text-anchor="end">y</text><text x="95" y="244" font-size="15" fill="#273b45" text-anchor="middle">semicircle</text><text x="95" y="268" font-size="16" fill="#2b7b61" text-anchor="middle">R = y/2</text><text x="250" y="244" font-size="15" fill="#273b45" text-anchor="middle">rectangle, B = 2y</text><text x="250" y="268" font-size="16" fill="#2b7b61" text-anchor="middle">R = y/2</text><text x="425" y="244" font-size="15" fill="#273b45" text-anchor="middle">trapezoid: T/2 = y√(1 + z²)</text><text x="425" y="268" font-size="16" fill="#2b7b61" text-anchor="middle">R = y/2</text><text x="610" y="244" font-size="15" fill="#273b45" text-anchor="middle">triangle, 90° vertex</text><text x="610" y="268" font-size="16" fill="#2b7b61" text-anchor="middle">R = y/(2√2)</text><text x="360" y="70" font-size="15" fill="#273b45" text-anchor="middle">Fixed area, slope and roughness: least wetted perimeter gives the largest R</text><text x="360" y="326" font-size="15" fill="#273b45" text-anchor="middle">Check z = 1, y = 2 m: sides 2.828 m, T = 5.657 m, B = 1.657 m, R = 1.0 m</text></g></svg>