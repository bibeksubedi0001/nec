<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">A-series sheets by repeated halving</title><desc id="desc">Each A size halves the long side of the one before, halving the area: A1 is 1/2 m², A2 is 1/4 m² and A3 is 0.125 m². The shape survives halving only with sides in the ratio √2 : 1.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><text x="236" y="50" font-size="16" fill="#273b45" text-anchor="middle">A0 = 1 m², halved repeatedly</text><rect x="40" y="70" width="392" height="277" fill="#ffffff" stroke="#273b45" stroke-width="3"/><rect x="40" y="70" width="196" height="277" fill="#e6f1f8" stroke="#273b45" stroke-width="2"/><rect x="236" y="70" width="196" height="138.5" fill="#deeee6" stroke="#273b45" stroke-width="2"/><rect x="236" y="208.5" width="98" height="138.5" fill="#f5ead8" stroke="#273b45" stroke-width="2"/><rect x="334" y="208.5" width="98" height="138.5" fill="#d6dfe3" stroke="#273b45" stroke-width="2"/><text x="138" y="210" font-size="17" fill="#273b45" text-anchor="middle"><tspan x="138" dy="0">A1</tspan><tspan x="138" dy="20.74">1/2 m²</tspan></text><text x="334" y="136" font-size="16" fill="#273b45" text-anchor="middle">A2  1/4 m²</text><text x="285" y="272" font-size="15" fill="#273b45" text-anchor="middle"><tspan x="285" dy="0">A3</tspan><tspan x="285" dy="18.3">0.125 m²</tspan></text><text x="383" y="280" font-size="15" fill="#273b45" text-anchor="middle">A4</text><text x="590" y="110" font-size="15" fill="#273b45" text-anchor="middle">halve the long side:</text><text x="590" y="138" font-size="15" fill="#287aab" text-anchor="middle">L/S = S/(L/2) → L/S = √2</text><text x="590" y="164" font-size="15" fill="#273b45" text-anchor="middle">S ≈ 0.707 L</text><text x="590" y="216" font-size="15" fill="#273b45" text-anchor="middle">An = 1/2ⁿ m²</text><text x="590" y="242" font-size="15" fill="#2b7b61" text-anchor="middle">A3 = 1/2³ = 0.125 m²</text><text x="590" y="290" font-size="13" fill="#647780" text-anchor="middle">real sheets are trimmed</text><text x="590" y="308" font-size="13" fill="#647780" text-anchor="middle">to whole millimetres</text><text x="360" y="390" font-size="14" fill="#273b45" text-anchor="middle">Every halving keeps the shape only with sides in the ratio √2 : 1</text></g></svg>