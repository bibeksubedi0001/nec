<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Which axis governs column slenderness</title><desc id="desc">With equal effective lengths, the axis with the smaller radius of gyration has the larger slenderness ratio and the lower Euler stress, so it governs buckling.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><rect x="178" y="113.5" width="104" height="173" fill="#d6dfe3" stroke="#273b45" stroke-width="2"/><line x1="140" y1="200" x2="320" y2="200" stroke="#287aab" stroke-width="1.5" stroke-dasharray="8 5"/><line x1="230" y1="80" x2="230" y2="320" stroke="#b64f4f" stroke-width="1.5" stroke-dasharray="8 5"/><text x="132" y="205" font-size="16" fill="#287aab" text-anchor="end">x</text><text x="328" y="205" font-size="16" fill="#287aab" text-anchor="start">x</text><text x="230" y="72" font-size="16" fill="#b64f4f" text-anchor="middle">y</text><text x="230" y="340" font-size="16" fill="#b64f4f" text-anchor="middle">y</text><line x1="184.4" y1="360" x2="275.6" y2="360" stroke="#b64f4f" stroke-width="2"/><polygon points="282,360 274,363.5 274,356.5" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><polygon points="178,360 186,356.5 186,363.5" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="230" y="388" font-size="14" fill="#b64f4f" text-anchor="middle">buckles about y-y</text><text x="420" y="110" font-size="19" fill="#273b45" text-anchor="start">λ = Le / r</text><text x="420" y="160" font-size="15" fill="#287aab" text-anchor="start">x-x: rx = 50 mm, 3000 / 50 = 60</text><text x="420" y="192" font-size="15" fill="#b64f4f" text-anchor="start">y-y: ry = 30 mm, 3000 / 30 = 100</text><text x="420" y="224" font-size="15" fill="#273b45" text-anchor="start">Larger λ governs: 100</text><text x="420" y="272" font-size="16" fill="#273b45" text-anchor="start">σcr = π² E / λ²</text><text x="420" y="304" font-size="14" fill="#647780" text-anchor="start">Least r works as a shortcut</text><text x="420" y="324" font-size="14" fill="#647780" text-anchor="start">only when both Le are equal</text></g></svg>