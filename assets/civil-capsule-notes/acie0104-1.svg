<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Centres of gravity of a solid cone and hemisphere</title><desc id="desc">For a solid cone G lies h/4 above the base, which is 3h/4 below the apex; for a solid hemisphere it lies 3R/8 above the flat base.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><polygon points="80,330 280,330 180,80" fill="#e6f1f8" stroke="#287aab" stroke-width="2" stroke-linejoin="round"/><ellipse cx="180" cy="330" rx="100" ry="16" fill="none" stroke="#287aab" stroke-width="1.5" stroke-dasharray="5 5"/><circle cx="180" cy="267.5" r="5" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><text x="196" y="262" font-size="18" fill="#b64f4f" text-anchor="start">G</text><line x1="62" y1="330" x2="62" y2="267.5" stroke="#647780" stroke-width="1.5"/><line x1="55" y1="330" x2="69" y2="330" stroke="#647780" stroke-width="1.5"/><line x1="55" y1="267.5" x2="69" y2="267.5" stroke="#647780" stroke-width="1.5"/><text x="54" y="304.75" font-size="17" fill="#647780" text-anchor="end">h/4</text><line x1="300" y1="267.5" x2="300" y2="80" stroke="#647780" stroke-width="1.5"/><line x1="293" y1="267.5" x2="307" y2="267.5" stroke="#647780" stroke-width="1.5"/><line x1="293" y1="80" x2="307" y2="80" stroke="#647780" stroke-width="1.5"/><text x="310" y="179.75" font-size="17" fill="#647780" text-anchor="start">3h/4</text><path d="M450 330 A110 110 0 0 1 670 330 Z" stroke="#2b7b61" stroke-width="2" fill="#deeee6" stroke-linejoin="round" stroke-linecap="round"/><ellipse cx="560" cy="330" rx="110" ry="17" fill="none" stroke="#2b7b61" stroke-width="1.5" stroke-dasharray="5 5"/><circle cx="560" cy="288.75" r="5" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><text x="574" y="282.75" font-size="18" fill="#b64f4f" text-anchor="start">G</text><line x1="434" y1="330" x2="434" y2="288.75" stroke="#647780" stroke-width="1.5"/><line x1="427" y1="330" x2="441" y2="330" stroke="#647780" stroke-width="1.5"/><line x1="427" y1="288.75" x2="441" y2="288.75" stroke="#647780" stroke-width="1.5"/><text x="426" y="315.38" font-size="17" fill="#647780" text-anchor="end">3R/8</text><line x1="560" y1="354" x2="670" y2="354" stroke="#647780" stroke-width="1.5"/><line x1="560" y1="347" x2="560" y2="361" stroke="#647780" stroke-width="1.5"/><line x1="670" y1="347" x2="670" y2="361" stroke="#647780" stroke-width="1.5"/><text x="615" y="372" font-size="17" fill="#647780" text-anchor="middle">R</text><text x="180" y="396" font-size="18" fill="#273b45" text-anchor="middle">Solid cone</text><text x="560" y="404" font-size="18" fill="#273b45" text-anchor="middle">Solid hemisphere</text></g></svg>