<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Ground coverage of a plot</title><desc id="desc">With 60 percent permitted coverage, a 400 square metre plot allows a 240 square metre footprint before any tighter setback limit.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><rect x="60" y="60" width="320" height="320" fill="#deeee6" stroke="#2b7b61" stroke-width="2.5"/><rect x="92" y="100" width="256" height="240" fill="#d6dfe3" stroke="#273b45" stroke-width="2.5"/><text x="220" y="212" font-size="19" fill="#273b45" text-anchor="middle">Footprint</text><text x="220" y="240" font-size="19" fill="#273b45" text-anchor="middle">240 m²</text><text x="220" y="84" font-size="17" fill="#2b7b61" text-anchor="middle">Plot 400 m²</text><text x="410" y="120" font-size="16" fill="#273b45" text-anchor="start">Coverage c = footprint / plot</text><text x="410" y="150" font-size="16" fill="#2b7b61" text-anchor="start">0.60 × 400 = 240 m²</text><text x="410" y="180" font-size="16" fill="#273b45" text-anchor="start">Setbacks may reduce it further</text><text x="410" y="210" font-size="16" fill="#273b45" text-anchor="start">Floor-area ratio is a separate</text><text x="410" y="240" font-size="16" fill="#273b45" text-anchor="start">control over all storeys</text></g></svg>