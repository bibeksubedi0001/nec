<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Cumulative speed distribution and the 85th percentile</title><desc id="desc">Spot speeds timed over a measured base, for example 3.6 × 50/3.0 = 60 km/h, are plotted cumulatively. Here about 85 percent of sampled vehicles were at or below 62 km/h.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="90" y1="280" x2="626" y2="280" stroke="#647780" stroke-width="2"/><polygon points="634,280 624,284 624,276" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><line x1="90" y1="280" x2="90" y2="64" stroke="#647780" stroke-width="2"/><polygon points="90,56 94,66 86,66" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><text x="355" y="318" font-size="15" fill="#273b45" text-anchor="middle">spot speed (km/h)</text><text x="96" y="46" font-size="15" fill="#273b45" text-anchor="start">cumulative % at or below</text><text x="90" y="300" font-size="13" fill="#273b45" text-anchor="middle">20</text><text x="165.71" y="300" font-size="13" fill="#273b45" text-anchor="middle">30</text><text x="241.43" y="300" font-size="13" fill="#273b45" text-anchor="middle">40</text><text x="317.14" y="300" font-size="13" fill="#273b45" text-anchor="middle">50</text><text x="392.86" y="300" font-size="13" fill="#273b45" text-anchor="middle">60</text><text x="468.57" y="300" font-size="13" fill="#273b45" text-anchor="middle">70</text><text x="544.29" y="300" font-size="13" fill="#273b45" text-anchor="middle">80</text><text x="620" y="300" font-size="13" fill="#273b45" text-anchor="middle">90</text><text x="82" y="232.5" font-size="13" fill="#273b45" text-anchor="end">25</text><text x="82" y="180" font-size="13" fill="#273b45" text-anchor="end">50</text><text x="82" y="127.5" font-size="13" fill="#273b45" text-anchor="end">75</tex