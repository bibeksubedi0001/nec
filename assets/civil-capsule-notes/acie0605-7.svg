<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Septic-tank height and floor fall; VIP latrine airflow</title><desc id="desc">Internal height is liquid depth plus freeboard, 1.20 + 0.30 = 1.50 m; a 1 in 10 fall over 2.0 m is 0.20 m toward the sludge point. A VIP latrine draws air down the pit and out of a screened vent.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><text x="190" y="60" font-size="16" fill="#273b45" text-anchor="middle">Septic tank section</text><text x="190" y="100" font-size="16" fill="#287aab" text-anchor="middle">H = d + f = 1.50 m</text><polygon points="60,160 320,160 320,280 60,300" fill="#d8edf7" stroke="none" stroke-width="2" stroke-linejoin="round"/><line x1="50" y1="130" x2="330" y2="130" stroke="#273b45" stroke-width="5"/><path d="M60 130 L60 300 L320 280 L320 130" stroke="#273b45" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="20" y1="152" x2="60" y2="152" stroke="#466d89" stroke-width="6"/><line x1="320" y1="160" x2="360" y2="160" stroke="#466d89" stroke-width="6"/><line x1="300" y1="130" x2="300" y2="160" stroke="#647780" stroke-width="1.5"/><line x1="307" y1="130" x2="293" y2="130" stroke="#647780" stroke-width="1.5"/><line x1="307" y1="160" x2="293" y2="160" stroke="#647780" stroke-width="1.5"/><text x="290" y="151" font-size="14" fill="#647780" text-anchor="end">f = 0.30 m</text><line x1="300" y1="160" x2="300" y2="280" stroke="#647780" stroke-width="1.5"/><line x1="307" y1="160" x2="293" y2="160" stroke="#647780" stroke-width="1.5"/><line x1="307" y1="280" x2="293" y2="280" stroke="#647780" stroke-width="1.5"/><text x="290" y="226" font-size="14" fill="#647780" text-anchor="end">d = 1.20 m</text><line x1="240" y1="285" x2="98.77" y2="296.3" stroke="#b98232" stroke-width="2.5"/><polygon points="90,297 100.61,291.64 101.32,300.61" fill="#b98232" stroke="#b98232" stroke-width="1.5" stroke-linejoin="round"/><circle cx="70" cy="298" r="5" fill="#b98232" stroke="#b98232" stroke-width="2"/><text x="190" y="322" font-size="14" fill="#b98232" text-anchor="middle">1 in 10 toward the sludge point</text><text x="190" y="348" font-size="14" fill="#273b45" text-anchor="middle">fall = L/n = 2.0/10 = 0.20 m</text><text x="190" y="370" font-size="13" fill="#647780" text-anchor="middle">floor slope aids desludging only</text><line x1="380" y1="20" x2="380" y2="410" stroke="#b8c8ce" stroke-width="1.5" stroke-dasharray="6 5"/><text x="545" y="30" font-size="16" fill="#273b45" text-anchor="middle">VIP latrine airflow</text><rect x="440" y="262" width="150" height="98" fill="#f0e6d4" stroke="#273b45" stroke-width="2"/><rect x="440" y="150" width="150" height="110" fill="#d6dfe3" stroke="#273b45" stroke-width="2"/><line x1="430" y1="150" x2="600" y2="150" stroke="#273b45" stroke-width="4"/><line x1="390" y1="260" x2="700" y2="260" stroke="#647780" stroke-width="2"/><line x1="396" y1="261" x2="386" y2="272" stroke="#647780" stroke-width="1.4"/><line x1="410" y1="261" x2="400" y2="272" stroke="#647780" stroke-width="1.4"/><line x1="424" y1="261" x2="414" y2="272" stroke="#647780" stroke-width="1.4"/><line x1="438" y1="261" x2="428" y2="272" stroke="#647780" stroke-width="1.4"/><line x1="452" y1="261" x2="442" y2="272" stroke="#647780" stroke-width="1.4"/><line x1="466" y1="261" x2="456" y2="272" stroke="#647780" stroke-width="1.4"/><line x1="480" y1="261" x2="470" y2="272" stroke="#647780" stroke-width="1.4"/><line x1="494" y1="261" x2="484" y2="272" stroke="#647780" stroke-width="1.4"/><line x1="508" y1="261" x2="498" y2="272" stroke="#647780" stroke-width="1.4"/><line x1="522" y1="261" x2="512" y2="272" stroke="#647780" stroke-width="1.4"/><line x1="536" y1="261" x2="526" y2="272" stroke="#647780" stroke-width="1.4"/><line x1="550" y1="261" x2="540" y2="272" stroke="#647780" stroke-width="1.4"/><line x1="564" y1="261" x2="554" y2="272" stroke="#647780" stroke-width="1.4"/><line x1="578" y1="261" x2="568" y2="272" stroke="#647780" stroke-width="1.4"/><line x1="592" y1="261" x2="582" y2="272" stroke="#647780" stroke-width="1.4"/><line x1="606" y1="261" x2="596" y2="272" stroke="#647780" stroke-width="1.4"/><line x1="620" y1="261" x2="610" y2="272" stroke="#647780" stroke-width="1.4"/><line x1="634" y1="261" x2="624" y2="272" stroke="#647780" stroke-width="1.4"/><line x1="648" y1="261" x2="638" y2="272" stroke="#647780" stroke-width="1.4"/><line x1="662" y1="261" x2="652" y2="272" stroke="#647780" stroke-width="1.4"/><line x1="676" y1="261" x2="666" y2="272" stroke="#647780" stroke-width="1.4"/><line x1="690" y1="261" x2="680" y2="272" stroke="#647780" stroke-width="1.4"/><rect x="598" y="70" width="16" height="195" fill="#ffffff" stroke="#273b45" stroke-width="1.5"/><rect x="596" y="60" width="20" height="10" fill="#f5ead8" stroke="#b98232" stroke-width="1.5"/><text x="590" y="54" font-size="14" fill="#b98232" text-anchor="end">fly screen</text><text x="624" y="160" font-size="14" fill="#273b45" text-anchor="start">vent pipe</text><line x1="396" y1="212" x2="443.2" y2="212" stroke="#287aab" stroke-width="2.5"/><polygon points="452,212 441,216.5 441,207.5" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><text x="418" y="200" font-size="14" fill="#287aab" text-anchor="middle">air in</text><line x1="515" y1="230" x2="515" y2="291.2" stroke="#287aab" stroke-width="2.5"/><polygon points="515,300 510.5,289 519.5,289" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><line x1="525" y1="320" x2="587.53" y2="302.39" stroke="#287aab" stroke-width="2.5"/><polygon points="596,300 586.63,307.31 584.19,298.65" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><line x1="606" y1="250" x2="606" y2="92.8" stroke="#287aab" stroke-width="2.5"/><polygon points="606,84 610.5,95 601.5,95" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><text x="475" y="345" font-size="14" fill="#273b45" text-anchor="middle">pit</text><text x="545" y="382" font-size="13" fill="#273b45" text-anchor="middle">persistent odour? check vent size, height,</text><text x="545" y="402" font-size="13" fill="#647780" text-anchor="middle">siting and screen resistance; 50 mm is not universal</text></g></svg>