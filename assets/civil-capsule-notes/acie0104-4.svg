<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Semicircle about its flat diameter</title><desc id="desc">A semicircle contributes half of the circle's moment about the shared diameter, πR⁴/8; its centroid lies 4R/3π from that diameter.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><path d="M120 320 A180 180 0 0 1 480 320 Z" stroke="#287aab" stroke-width="2" fill="#e6f1f8" stroke-linejoin="round" stroke-linecap="round"/><line x1="80" y1="320" x2="520" y2="320" stroke="#273b45" stroke-width="2.5"/><line x1="110" y1="243.61" x2="490" y2="243.61" stroke="#2b7b61" stroke-width="1.8" stroke-dasharray="8 6"/><circle cx="300" cy="243.61" r="5" fill="#2b7b61" stroke="#2b7b61" stroke-width="2"/><line x1="300" y1="320" x2="300" y2="243.61" stroke="#647780" stroke-width="1.5"/><line x1="293" y1="320" x2="307" y2="320" stroke="#647780" stroke-width="1.5"/><line x1="293" y1="243.61" x2="307" y2="243.61" stroke="#647780" stroke-width="1.5"/><text x="312" y="287.8" font-size="16" fill="#647780" text-anchor="start">4R/3π</text><line x1="300" y1="320" x2="167.27" y2="198.42" stroke="#647780" stroke-width="1.8"/><text x="222" y="274" font-size="18" fill="#647780" text-anchor="middle">R</text><text x="510" y="84" font-size="17" fill="#273b45" text-anchor="start">About the flat</text><text x="510" y="108" font-size="17" fill="#273b45" text-anchor="start">diameter:</text><text x="510" y="142" font-size="19" fill="#287aab" text-anchor="start">I = πR⁴/8</text><text x="510" y="170" font-size="19" fill="#287aab" text-anchor="start">   = πd⁴/128</text><text x="360" y="380" font-size="15" fill="#647780" text-anchor="middle">A solid hemisphere's mass inertia is a different quantity, 2MR²/5</text></g></svg>