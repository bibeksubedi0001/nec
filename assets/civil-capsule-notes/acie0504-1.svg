<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Column strain limits and the second-order moment</title><desc id="desc">Uniform axial compression is limited to a strain of 0.002 and the extreme fibre in bending to 0.0035; a slender column also gains a moment of about Pδ as it deflects.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="90" y1="100" x2="90" y2="300" stroke="#273b45" stroke-width="2"/><rect x="90" y="100" width="60" height="200" fill="#f2dfdf" stroke="#b64f4f" stroke-width="1.5"/><text x="120" y="84" font-size="14" fill="#b64f4f" text-anchor="middle">0.002</text><text x="120" y="326" font-size="14" fill="#273b45" text-anchor="middle">axial: uniform</text><line x1="250" y1="100" x2="250" y2="300" stroke="#273b45" stroke-width="2"/><polygon points="250,100 355,100 250,230" fill="#f2dfdf" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><polygon points="250,230 190,300 250,300" fill="#e6f1f8" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><text x="300" y="84" font-size="14" fill="#b64f4f" text-anchor="middle">0.0035</text><text x="270" y="326" font-size="14" fill="#273b45" text-anchor="middle">bending: extreme fibre</text><line x1="520" y1="80" x2="520" y2="330" stroke="#647780" stroke-width="1.2" stroke-dasharray="6 5"/><path d="M520 80 L522.67 86.25 L525.32 92.5 L527.94 98.75 L530.51 105 L533.01 111.25 L535.44 117.5 L537.76 123.75 L539.98 130 L542.08 136.25 L544.04 142.5 L545.85 148.75 L547.51 155 L548.99 161.25 L550.29 167.5 L551.41 173.75 L552.34 180 L553.06 186.25 L553.58 192.5 L553.9 198.75 L554 205 L553.9 211.25 L553.58 217.5 L553.06 223.75 L552.34 230 L551.41 236.25 L550.29 242.5 L548.99 248.75 L547.51 255 L545.85 261.25 L544.04 267.5 L542.08 273.75 L539.98 280 L537.76 286.25 L535.44 292.5 L533.01 298.75 L530.51 305 L527.94 311.25 L525.32 317.5 L522.67 323.75 L520 330" stroke="#287aab" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="520" y1="30" x2="520" y2="67.2" stroke="#b64f4f" stroke-width="3"/><polygon points="520,76 515.5,65 524.5,65" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><line x1="520" y1="380" x2="520" y2="342.8" stroke="#b64f4f" stroke-width="3"/><polygon points="520,334 524.5,345 515.5,345" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="532" y="44" font-size="16" fill="#b64f4f" text-anchor="start">P</text><line x1="520" y1="205" x2="554" y2="205" stroke="#647780" stroke-width="1.5"/><line x1="520" y1="198" x2="520" y2="212" stroke="#647780" stroke-width="1.5"/><line x1="554" y1="198" x2="554" y2="212" stroke="#647780" stroke-width="1.5"/><text x="537" y="201" font-size="15" fill="#647780" text-anchor="middle">δ</text><text x="600" y="150" font-size="16" fill="#273b45" text-anchor="start">M ≈ M1 + P δ</text><text x="360" y="404" font-size="15" fill="#273b45" text-anchor="middle">σmax = P/A + (M1 + P δ)/Z: direct stress is never negligible</text></g></svg>