<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Strain profiles at flexural failure</title><desc id="desc">With the extreme concrete strain at 0.0035, an under-reinforced section has steel strain beyond yield and a shallow compression zone; an over-reinforced one fails with the steel below yield.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="130" y1="100" x2="130" y2="300" stroke="#273b45" stroke-width="2"/><polygon points="130,100 60,100 130,173.68" fill="#f2dfdf" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><polygon points="130,173.68 250,300 130,300" fill="#e6f1f8" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><line x1="116" y1="173.68" x2="144" y2="173.68" stroke="#273b45" stroke-width="2"/><text x="112" y="178.68" font-size="12" fill="#647780" text-anchor="end">NA</text><line x1="206" y1="292" x2="206" y2="308" stroke="#647780" stroke-width="1.5"/><text x="206" y="324" font-size="13" fill="#647780" text-anchor="middle">εy</text><text x="130" y="64" font-size="16" fill="#2b7b61" text-anchor="middle">Under-reinforced</text><text x="130" y="348" font-size="14" fill="#2b7b61" text-anchor="middle">steel yields first: ductile</text><line x1="360" y1="100" x2="360" y2="300" stroke="#273b45" stroke-width="2"/><polygon points="360,100 290,100 360,195.89" fill="#f2dfdf" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><polygon points="360,195.89 436,300 360,300" fill="#e6f1f8" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><line x1="346" y1="195.89" x2="374" y2="195.89" stroke="#273b45" stroke-width="2"/><text x="342" y="200.89" font-size="12" fill="#647780" text-anchor="end">NA</text><line x1="436" y1="292" x2="436" y2="308" stroke="#647780" stroke-width="1.5"/><text x="436" y="324" font-size="13" fill="#647780" text-anchor="middle">εy</text><text x="360" y="64" font-size="16" fill="#b98232" text-anchor="middle">Balanced</text><text x="360" y="348" font-size="14" fill="#b98232" text-anchor="middle">both limits together</text><line x1="590" y1="100" x2="590" y2="300" stroke="#273b45" stroke-width="2"/><polygon points="590,100 520,100 590,227.27" fill="#f2dfdf" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><polygon points="590,227.27 630,300 590,300" fill="#e6f1f8" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><line x1="576" y1="227.27" x2="604" y2="227.27" stroke="#273b45" stroke-width="2"/><text x="572" y="232.27" font-size="12" fill="#647780" text-anchor="end">NA</text><line x1="666" y1="292" x2="666" y2="308" stroke="#647780" stroke-width="1.5"/><text x="666" y="324" font-size="13" fill="#647780" text-anchor="middle">εy</text><text x="590" y="64" font-size="16" fill="#b64f4f" text-anchor="middle">Over-reinforced</text><text x="590" y="348" font-size="14" fill="#b64f4f" text-anchor="middle">concrete crushes first: brittle</text><text x="60" y="94" font-size="13" fill="#b64f4f" text-anchor="start">0.0035</text><text x="360" y="384" font-size="15" fill="#273b45" text-anchor="middle">Extra tension steel deepens the compression zone and loses ductility</text><text x="360" y="408" font-size="14" fill="#647780" text-anchor="middle">Depth restricted: a larger or doubly reinforced section instead</text></g></svg>