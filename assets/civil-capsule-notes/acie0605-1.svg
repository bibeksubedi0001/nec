<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Removal by two stages in series</title><desc id="desc">Each stage removes a fraction of the load reaching it: 60 percent then 50 percent of the remainder leaves 0.4 × 0.5 = 20 percent, an overall removal of 80 percent, not 110.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="130" y1="300" x2="620" y2="300" stroke="#647780" stroke-width="2"/><rect x="170" y="100" width="90" height="200" fill="#d6dfe3" stroke="#273b45" stroke-width="2"/><text x="215" y="92" font-size="15" fill="#273b45" text-anchor="middle">100%</text><rect x="330" y="100" width="90" height="120" fill="#f2dfdf" stroke="#b64f4f" stroke-width="2" stroke-dasharray="6 4"/><text x="375" y="165" font-size="14" fill="#b64f4f" text-anchor="middle">removed 60</text><rect x="330" y="220" width="90" height="80" fill="#d6dfe3" stroke="#273b45" stroke-width="2"/><text x="375" y="266" font-size="15" fill="#273b45" text-anchor="middle">40</text><rect x="490" y="220" width="90" height="40" fill="#f2dfdf" stroke="#b64f4f" stroke-width="2" stroke-dasharray="6 4"/><text x="535" y="245" font-size="13" fill="#b64f4f" text-anchor="middle">removed 20</text><rect x="490" y="260" width="90" height="40" fill="#d6dfe3" stroke="#273b45" stroke-width="2"/><text x="535" y="286" font-size="15" fill="#273b45" text-anchor="middle">20</text><line x1="266" y1="200" x2="315.2" y2="200" stroke="#647780" stroke-width="2"/><polygon points="324,200 313,204.5 313,195.5" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><line x1="426" y1="240" x2="475.2" y2="240" stroke="#647780" stroke-width="2"/><polygon points="484,240 473,244.5 473,235.5" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><text x="215" y="320" font-size="14" fill="#273b45" text-anchor="middle">influent</text><text x="375" y="320" font-size="14" fill="#273b45" text-anchor="middle">after stage 1</text><text x="535" y="320" font-size="14" fill="#273b45" text-anchor="middle">after stage 2</text><text x="360" y="350" font-size="16" fill="#2b7b61" text-anchor="middle">E = 0.60 + 0.50(1 − 0.60) = 0.80 → 80%, not 110%</text><text x="360" y="374" font-size="15" fill="#273b45" text-anchor="middle">remaining = (1 − E1)(1 − E2) = 0.4 × 0.5 = 0.2</text><text x="360" y="398" font-size="14" fill="#647780" text-anchor="middle">500 → 10 mg/L: 98% removed; the 2% is what remains</text></g></svg>