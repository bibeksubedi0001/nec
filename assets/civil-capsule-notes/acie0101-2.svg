<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Gypsum and plaster of Paris</title><desc id="desc">Controlled heating removes part of the crystal water to give the hemihydrate; mixed with water it rehydrates to gypsum and sets.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><rect x="40" y="150" width="250" height="104" rx="8" fill="#f0e6d4" stroke="#b98232" stroke-width="2"/><text x="165" y="186.52" font-size="18" fill="#273b45" text-anchor="middle"><tspan x="165" dy="0">Gypsum</tspan><tspan x="165" dy="21.96">CaSO4·2H2O</tspan><tspan x="165" dy="21.96">dihydrate</tspan></text><rect x="430" y="150" width="250" height="104" rx="8" fill="#e6f1f8" stroke="#287aab" stroke-width="2"/><text x="555" y="186.52" font-size="18" fill="#273b45" text-anchor="middle"><tspan x="555" dy="0">Plaster of Paris</tspan><tspan x="555" dy="21.96">CaSO4·½H2O</tspan><tspan x="555" dy="21.96">hemihydrate</tspan></text><path d="M200 146 Q360 40 525 146" stroke="#b64f4f" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="525,146 513.31,143.84 518.18,136.27" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="360" y="44" font-size="18" fill="#b64f4f" text-anchor="middle">Controlled heating</text><text x="360" y="70" font-size="17" fill="#b64f4f" text-anchor="middle">releases 3/2 H2O</text><path d="M525 258 Q360 366 200 258" stroke="#287aab" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="200,258 211.63,260.42 206.6,267.88" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><text x="360" y="350" font-size="17" fill="#287aab" text-anchor="middle">Mixed with water it rehydrates</text><text x="360" y="376" font-size="17" fill="#287aab" text-anchor="middle">and sets as interlocking gypsum</text></g></svg>