<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Beam tension-steel limits and bar notation</title><desc id="desc">The minimum tension steel uses the effective depth d and the maximum the overall depth D; a note such as 4 bars φ16 gives the count and each bar's diameter.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><rect x="130" y="70" width="125" height="250" fill="#e4e8e9" stroke="#273b45" stroke-width="2"/><rect x="142" y="82" width="101" height="226" rx="6" fill="none" stroke="#466d89" stroke-width="1.5"/><circle cx="153" cy="290" r="8" fill="#466d89" stroke="#273b45" stroke-width="1"/><circle cx="180" cy="290" r="8" fill="#466d89" stroke="#273b45" stroke-width="1"/><circle cx="207" cy="290" r="8" fill="#466d89" stroke="#273b45" stroke-width="1"/><circle cx="234" cy="290" r="8" fill="#466d89" stroke="#273b45" stroke-width="1"/><circle cx="155" cy="100" r="5" fill="#466d89" stroke="#273b45" stroke-width="1"/><circle cx="230" cy="100" r="5" fill="#466d89" stroke="#273b45" stroke-width="1"/><line x1="130" y1="340" x2="255" y2="340" stroke="#647780" stroke-width="1.5"/><line x1="130" y1="333" x2="130" y2="347" stroke="#647780" stroke-width="1.5"/><line x1="255" y1="333" x2="255" y2="347" stroke="#647780" stroke-width="1.5"/><text x="192.5" y="354" font-size="15" fill="#647780" text-anchor="middle">b</text><line x1="108" y1="70" x2="108" y2="320" stroke="#647780" stroke-width="1.5"/><line x1="115" y1="70" x2="101" y2="70" stroke="#647780" stroke-width="1.5"/><line x1="115" y1="320" x2="101" y2="320" stroke="#647780" stroke-width="1.5"/><text x="100" y="201" font-size="15" fill="#647780" text-anchor="end">D</text><line x1="280" y1="70" x2="280" y2="290" stroke="#647780" stroke-width="1.5"/><line x1="287" y1="70" x2="273" y2="70" stroke="#647780" stroke-width="1.5"/><line x1="287" y1="290" x2="273" y2="290" stroke="#647780" stroke-width="1.5"/><text x="288" y="186" font-size="15" fill="#647780" text-anchor="start">d</text><line x1="262" y1="290" x2="286" y2="290" stroke="#647780" stroke-width="1" stroke-dasharray="3 3"/><text x="192" y="386" font-size="15" fill="#466d89" text-anchor="middle">4 bars, φ16</text><text x="360" y="120" font-size="16" fill="#273b45" text-anchor="start">As,min = 0.85 b d / fy</text><text x="360" y="146" font-size="14" fill="#647780" text-anchor="start">250 × 400 mm, Fe500: 170 mm²</text><text x="360" y="196" font-size="16" fill="#273b45" text-anchor="start">As,max = 0.04 b D</text><text x="360" y="222" font-size="14" fill="#647780" text-anchor="start">250 × 500 mm: 5000 mm², overall D</text><text x="360" y="272" font-size="15" fill="#273b45" text-anchor="start">4 bars φ16: 4 × π × 16² / 4 ≈ 804 mm²</text><text x="360" y="298" font-size="14" fill="#647780" text-anchor="start">count and size; spacing is separate</text></g></svg>