<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Wave fronts from a disturbance in moving water</title><desc id="desc">In subcritical flow a disturbance sends waves both ways; at Fr = 1 the upstream wave is held stationary; in supercritical flow every wave is swept downstream.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><circle cx="90" cy="190" r="20" fill="none" stroke="#287aab" stroke-width="1.8"/><circle cx="100" cy="190" r="40" fill="none" stroke="#287aab" stroke-width="1.8"/><circle cx="110" cy="190" r="60" fill="none" stroke="#287aab" stroke-width="1.8"/><circle cx="80" cy="190" r="4" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><line x1="85" y1="96" x2="156.2" y2="96" stroke="#647780" stroke-width="2"/><polygon points="165,96 154,100.5 154,91.5" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><text x="125" y="86" font-size="13" fill="#647780" text-anchor="middle">flow</text><text x="125" y="60" font-size="16" fill="#273b45" text-anchor="middle">Fr &lt; 1: subcritical</text><text x="125" y="290" font-size="14" fill="#273b45" text-anchor="middle">waves travel both ways</text><text x="125" y="312" font-size="14" fill="#647780" text-anchor="middle">downstream control</text><circle cx="320" cy="190" r="20" fill="none" stroke="#287aab" stroke-width="1.8"/><circle cx="340" cy="190" r="40" fill="none" stroke="#287aab" stroke-width="1.8"/><circle cx="360" cy="190" r="60" fill="none" stroke="#287aab" stroke-width="1.8"/><circle cx="300" cy="190" r="4" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><line x1="320" y1="96" x2="391.2" y2="96" stroke="#647780" stroke-width="2"/><polygon points="400,96 389,100.5 389,91.5" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><text x="360" y="86" font-size="13" fill="#647780" text-anchor="middle">flow</text><text x="360" y="60" font-size="16" fill="#273b45" text-anchor="middle">Fr = 1: critical</text><text x="360" y="290" font-size="14" fill="#273b45" text-anchor="middle">upstream wave held</text><text x="360" y="312" font-size="14" fill="#647780" text-anchor="middle">stationary</text><circle cx="540" cy="190" r="20" fill="none" stroke="#287aab" stroke-width="1.8"/><circle cx="575" cy="190" r="40" fill="none" stroke="#287aab" stroke-width="1.8"/><circle cx="610" cy="190" r="60" fill="none" stroke="#287aab" stroke-width="1.8"/><circle cx="505" cy="190" r="4" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><line x1="555" y1="96" x2="626.2" y2="96" stroke="#647780" stroke-width="2"/><polygon points="635,96 624,100.5 624,91.5" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><text x="595" y="86" font-size="13" fill="#647780" text-anchor="middle">flow</text><text x="595" y="60" font-size="16" fill="#273b45" text-anchor="middle">Fr &gt; 1: supercritical</text><text x="595" y="290" font-size="14" fill="#273b45" text-anchor="middle">waves swept downstream</text><text x="595" y="312" font-size="14" fill="#647780" text-anchor="middle">upstream control</text><line x1="505" y1="190" x2="619.89" y2="110" stroke="#b64f4f" stroke-width="1.2" stroke-dasharray="5 4"/><line x1="505" y1="190" x2="619.89" y2="270" stroke="#b64f4f" stroke-width="1.2" stroke-dasharray="5 4"/><line x1="240" y1="50" x2="240" y2="320" stroke="#b8c8ce" stroke-width="1.2" stroke-dasharray="6 6"/><line x1="475" y1="50" x2="475" y2="320" stroke="#b8c8ce" stroke-width="1.2" stroke-dasharray="6 6"/><text x="360" y="372" font-size="16" fill="#273b45" text-anchor="middle">Fr = V / √(g D), with the hydraulic depth D = A / T</text><text x="360" y="398" font-size="14" fill="#647780" text-anchor="middle">The long-wave speed is √(g A / T)</text></g></svg>