<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Working time and rest under Labour Act 2074, section 28</title><desc id="desc">Ordinary working time is limited to 8 hours a day and 48 a week, with overtime regulated separately. After five continuous hours a half-hour rest is given and counted as working time; continuous work uses rotation.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><text x="360" y="50" font-size="16" fill="#273b45" text-anchor="middle">Labour Act 2074, section 28</text><text x="360" y="84" font-size="14" fill="#273b45" text-anchor="middle">ordinary time: 8 h a day, 48 h a week; overtime regulated separately</text><rect x="80" y="120" width="350" height="40" fill="#e6f1f8" stroke="#287aab" stroke-width="2"/><rect x="430" y="120" width="35" height="40" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><rect x="465" y="120" width="175" height="40" fill="#e6f1f8" stroke="#287aab" stroke-width="2"/><text x="255" y="145" font-size="14" fill="#287aab" text-anchor="middle">5 h continuous work</text><text x="552.5" y="145" font-size="14" fill="#287aab" text-anchor="middle">work</text><text x="447.5" y="112" font-size="13" fill="#2b7b61" text-anchor="middle">½ h rest</text><text x="80" y="180" font-size="12" fill="#273b45" text-anchor="middle">0</text><text x="150" y="180" font-size="12" fill="#273b45" text-anchor="middle">1</text><text x="220" y="180" font-size="12" fill="#273b45" text-anchor="middle">2</text><text x="290" y="180" font-size="12" fill="#273b45" text-anchor="middle">3</text><text x="360" y="180" font-size="12" fill="#273b45" text-anchor="middle">4</text><text x="430" y="180" font-size="12" fill="#273b45" text-anchor="middle">5</text><text x="500" y="180" font-size="12" fill="#273b45" text-anchor="middle">6</text><text x="570" y="180" font-size="12" fill="#273b45" text-anchor="middle">7</text><text x="640" y="180" font-size="12" fill="#273b45" text-anchor="middle">8</text><text x="650" y="180" font-size="12" fill="#273b45" text-anchor="start">h</text><text x="72" y="248" font-size="13" fill="#273b45" text-anchor="end">worker A</text><rect x="80" y="230" width="560" height="26" fill="#d6dfe3" stroke="#8a9aa3" stroke-width="1"/><rect x="430" y="230" width="35" height="26" fill="#deeee6" stroke="#2b7b61" stroke-width="1.5"/><text x="72" y="288" font-size="13" fill="#273b45" text-anchor="end">worker B</text><rect x="80" y="270" width="560" height="26" fill="#d6dfe3" stroke="#8a9aa3" stroke-width="1"/><rect x="395" y="270" width="35" height="26" fill="#deeee6" stroke="#2b7b61" stroke-width="1.5"/><text x="360" y="322" font-size="14" fill="#2b7b61" text-anchor="middle">Continuous operation: breaks by rotation, so work never stops</text><text x="360" y="350" font-size="14" fill="#273b45" text-anchor="middle">The half-hour rest after five continuous hours counts as working time</text><text x="360" y="374" font-size="13" fill="#647780" text-anchor="middle">The title year is the enactment, not the latest amendment</text></g></svg>