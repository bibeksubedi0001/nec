<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Similar-pump fifth-power law versus impeller trimming</title><desc id="desc">For similar pumps at the same speed, power scales as D⁵: doubling the diameter of a 10 kW pump gives 320 kW, not the 80 kW of the flow ratio alone. A permitted trim to 0.90 D under a cube law gives 14.58 kW.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><text x="200" y="50" font-size="15" fill="#273b45" text-anchor="middle">Geometrically similar, D doubled</text><line x1="60" y1="300" x2="340" y2="300" stroke="#647780" stroke-width="2"/><rect x="60" y="293.13" width="60" height="6.88" fill="#e6f1f8" stroke="#287aab" stroke-width="2"/><text x="90" y="285.13" font-size="14" fill="#287aab" text-anchor="middle">10 kW</text><text x="90" y="316" font-size="13" fill="#273b45" text-anchor="middle">D</text><rect x="150" y="245" width="60" height="55" fill="#f2dfdf" stroke="#b64f4f" stroke-width="2" stroke-dasharray="5 4"/><text x="180" y="237" font-size="14" fill="#b64f4f" text-anchor="middle">80 kW</text><text x="180" y="316" font-size="13" fill="#273b45" text-anchor="middle">flow ratio only: wrong</text><rect x="240" y="80" width="60" height="220" fill="#e6f1f8" stroke="#287aab" stroke-width="2"/><text x="270" y="72" font-size="14" fill="#287aab" text-anchor="middle">320 kW</text><text x="270" y="316" font-size="13" fill="#273b45" text-anchor="middle">2D</text><line x1="370" y1="40" x2="370" y2="370" stroke="#b8c8ce" stroke-width="1.5" stroke-dasharray="6 5"/><text x="540" y="50" font-size="15" fill="#273b45" text-anchor="middle">Supplier-permitted impeller trim</text><line x1="420" y1="300" x2="660" y2="300" stroke="#647780" stroke-width="2"/><rect x="450" y="150" width="60" height="150" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><text x="480" y="142" font-size="14" fill="#2b7b61" text-anchor="middle">20 kW</text><text x="480" y="316" font-size="13" fill="#273b45" text-anchor="middle">D</text><rect x="570" y="190.65" width="60" height="109.35" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><text x="600" y="182.65" font-size="14" fill="#2b7b61" text-anchor="middle">14.58 kW</text><text x="600" y="316" font-size="13" fill="#273b45" text-anchor="middle">0.90 D</text><text x="200" y="342" font-size="14" fill="#287aab" text-anchor="middle">P ∝ N³D⁵: 10 × 2⁵ = 320 kW</text><text x="200" y="364" font-size="13" fill="#647780" text-anchor="middle">Q ∝ ND³ alone (×8) misses the head ×4</text><text x="540" y="342" font-size="14" fill="#2b7b61" text-anchor="middle">P2 = 20 × 0.90³ = 14.58 kW</text><text x="540" y="364" font-size="13" fill="#647780" text-anchor="middle">same casing: not a similar family</text><text x="360" y="396" font-size="13" fill="#647780" text-anchor="middle">Actual duty comes from the supplier's curves</text></g></svg>