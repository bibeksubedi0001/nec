<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Morning-glory shaft spillway and siphon spillway</title><desc id="desc">A morning-glory spillway has a flared circular lip where overflow drops into a vertical shaft. A siphon spillway passes overflow first, then primes into full enclosed flow; air admission governs its regime.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><text x="185" y="40" font-size="16" fill="#273b45" text-anchor="middle">Morning-glory shaft spillway</text><rect x="20" y="130" width="330" height="70" fill="#d8edf7" stroke="none" stroke-width="2"/><line x1="20" y1="130" x2="350" y2="130" stroke="#287aab" stroke-width="2"/><rect x="20" y="200" width="330" height="140" fill="#d6dfe3" stroke="none" stroke-width="2"/><rect x="170" y="150" width="40" height="150" fill="#fbfcfd" stroke="none" stroke-width="2"/><rect x="210" y="300" width="140" height="30" fill="#fbfcfd" stroke="none" stroke-width="2"/><path d="M110 150 Q165 150 170 200" stroke="#273b45" stroke-width="6" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M270 150 Q215 150 210 200" stroke="#273b45" stroke-width="6" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M170 200 L170 300 Q170 330 200 330 L350 330" stroke="#273b45" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M210 200 L210 290 Q210 300 220 300 L350 300" stroke="#273b45" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M118 140 Q168 138 184 186" stroke="#287aab" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="184,186 176.25,176.99 184.79,174.14" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><path d="M262 140 Q212 138 196 186" stroke="#287aab" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="196,186 195.21,174.14 203.75,176.99" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><line x1="240" y1="315" x2="327.2" y2="315" stroke="#287aab" stroke-width="2.5"/><polygon points="336,315 325,319.5 325,310.5" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><text x="190" y="110" font-size="14" fill="#273b45" text-anchor="middle">flared circular lip</text><text x="220" y="250" font-size="14" fill="#273b45" text-anchor="start">vertical shaft</text><text x="290" y="292" font-size="13" fill="#273b45" text-anchor="middle">tunnel</text><line x1="360" y1="30" x2="360" y2="340" stroke="#b8c8ce" stroke-width="1.5" stroke-dasharray="6 5"/><text x="535" y="40" font-size="16" fill="#273b45" text-anchor="middle">Siphon spillway</text><rect x="370" y="160" width="80" height="160" fill="#d8edf7" stroke="none" stroke-width="2"/><line x1="370" y1="160" x2="420" y2="160" stroke="#287aab" stroke-width="2"/><path d="M435 300 L435 170 Q490 118 545 170 L545 330" stroke="#d8edf7" stroke-width="26" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M420 250 L420 150 Q490 90 560 150 L560 330" stroke="#273b45" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M450 320 L450 190 Q490 150 530 190 L530 330" stroke="#273b45" stroke-width="3" fill="#e4e8e9" stroke-linejoin="round" stroke-linecap="round"/><line x1="490" y1="118" x2="490" y2="80" stroke="#273b45" stroke-width="4"/><text x="500" y="84" font-size="14" fill="#273b45" text-anchor="start">air vent</text><text x="490" y="210" font-size="13" fill="#273b45" text-anchor="middle">crest</text><line x1="545" y1="250" x2="545" y2="313.2" stroke="#287aab" stroke-width="2.5"/><polygon points="545,322 540.5,311 549.5,311" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><text x="640" y="150" font-size="14" fill="#273b45" text-anchor="middle">hood</text><text x="185" y="362" font-size="14" fill="#273b45" text-anchor="middle">overflow drops down a shaft</text><text x="535" y="362" font-size="14" fill="#273b45" text-anchor="middle">primed enclosed flow, no pumping</text><text x="360" y="396" font-size="13" fill="#647780" text-anchor="middle">Spillway = the reservoir's safety valve for floods beyond turbines and storage</text></g></svg>