<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">From ore to metal</title><desc id="desc">Dressing and concentration prepare the ore, extraction reduces the mineral to metal, and refining removes impurities from the extracted metal.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="30" y1="58" x2="455" y2="58" stroke="#647780" stroke-width="1.5"/><line x1="30" y1="58" x2="30" y2="68" stroke="#647780" stroke-width="1.5"/><line x1="455" y1="58" x2="455" y2="68" stroke="#647780" stroke-width="1.5"/><text x="242" y="44" font-size="16" fill="#647780" text-anchor="middle">Beneficiation, before extraction</text><rect x="20" y="76" width="210" height="84" rx="8" fill="#f0e6d4" stroke="#b98232" stroke-width="2"/><text x="125" y="113.75" font-size="17" fill="#273b45" text-anchor="middle"><tspan x="125" dy="0">Ore dressing</tspan><tspan x="125" dy="20.74">washing, crushing</tspan></text><rect x="255" y="76" width="210" height="84" rx="8" fill="#f0e6d4" stroke="#b98232" stroke-width="2"/><text x="360" y="113.75" font-size="17" fill="#273b45" text-anchor="middle"><tspan x="360" dy="0">Concentration</tspan><tspan x="360" dy="20.74">reject gangue</tspan></text><rect x="490" y="76" width="210" height="84" rx="8" fill="#f2dfdf" stroke="#b64f4f" stroke-width="2"/><text x="595" y="113.75" font-size="17" fill="#273b45" text-anchor="middle"><tspan x="595" dy="0">Extraction</tspan><tspan x="595" dy="20.74">smelting, reduction</tspan></text><rect x="490" y="250" width="210" height="84" rx="8" fill="#e6f1f8" stroke="#287aab" stroke-width="2"/><text x="595" y="287.75" font-size="17" fill="#273b45" text-anchor="middle"><tspan x="595" dy="0">Refining</tspan><tspan x="595" dy="20.74">purify the metal</tspan></text><rect x="255" y="250" width="210" height="84" rx="8" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><text x="360" y="287.75" font-size="17" fill="#273b45" text-anchor="middle"><tspan x="360" dy="0">Alloying and</tspan><tspan x="360" dy="20.74">processing</tspan></text><line x1="230" y1="118" x2="244.2" y2="118" stroke="#287aab" stroke-width="3"/><polygon points="253,118 242,122.5 242,113.5" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><line x1="465" y1="118" x2="479.2" y2="118" stroke="#287aab" stroke-width="3"/><polygon points="488,118 477,122.5 477,113.5" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><line x1="595" y1="160" x2="595" y2="239.2" stroke="#287aab" stroke-width="3"/><polygon points="595,248 590.5,237 599.5,237" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><line x1="490" y1="292" x2="475.8" y2="292" stroke="#287aab" stroke-width="3"/><polygon points="467,292 478,287.5 478,296.5" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><text x="125" y="280" font-size="16" fill="#647780" text-anchor="middle">Concentration cleans</text><text x="125" y="304" font-size="16" fill="#647780" text-anchor="middle">the ore; refining</text><text x="125" y="328" font-size="16" fill="#647780" text-anchor="middle">cleans the metal</text></g></svg>