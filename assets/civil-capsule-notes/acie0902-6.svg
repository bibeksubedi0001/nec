<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Eye, object and headlight heights</title><desc id="desc">NRS 2070 stopping checks use a 1.20 m eye and a 0.15 m object, passing checks use equal 1.20 m heights, and the night sag-curve check uses a 0.75 m headlight.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><text x="40" y="70" font-size="14" fill="#273b45" text-anchor="start">Stopping (section 8.3)</text><line x1="40" y1="130" x2="680" y2="130" stroke="#273b45" stroke-width="2"/><rect x="60" y="100" width="60" height="22" rx="5" fill="#e6f1f8" stroke="#287aab" stroke-width="1.5"/><circle cx="74" cy="124" r="6" fill="#273b45" stroke="#273b45" stroke-width="2"/><circle cx="106" cy="124" r="6" fill="#273b45" stroke="#273b45" stroke-width="2"/><circle cx="100" cy="94" r="4" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><rect x="560" y="125" width="12" height="5" fill="#b98232" stroke="#273b45" stroke-width="1"/><line x1="100" y1="94" x2="566" y2="125" stroke="#b64f4f" stroke-width="1.5" stroke-dasharray="6 4"/><text x="100" y="84" font-size="13" fill="#b64f4f" text-anchor="middle">eye 1.20 m</text><text x="566" y="116" font-size="13" fill="#b98232" text-anchor="middle">object 0.15 m</text><text x="40" y="180" font-size="14" fill="#273b45" text-anchor="start">Passing</text><line x1="40" y1="240" x2="680" y2="240" stroke="#273b45" stroke-width="2"/><rect x="60" y="210" width="60" height="22" rx="5" fill="#e6f1f8" stroke="#287aab" stroke-width="1.5"/><circle cx="74" cy="234" r="6" fill="#273b45" stroke="#273b45" stroke-width="2"/><circle cx="106" cy="234" r="6" fill="#273b45" stroke="#273b45" stroke-width="2"/><rect x="590" y="210" width="60" height="22" rx="5" fill="#f5ead8" stroke="#b98232" stroke-width="1.5"/><circle cx="604" cy="234" r="6" fill="#273b45" stroke="#273b45" stroke-width="2"/><circle cx="636" cy="234" r="6" fill="#273b45" stroke="#273b45" stroke-width="2"/><circle cx="100" cy="204" r="4" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><circle cx="620" cy="204" r="4" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><line x1="100" y1="204" x2="620" y2="204" stroke="#b64f4f" stroke-width="1.5" stroke-dasharray="6 4"/><text x="360" y="196" font-size="13" fill="#b64f4f" text-anchor="middle">equal heights 1.20 m</text><text x="40" y="258" font-size="14" fill="#273b45" text-anchor="start">Sag curve at night (section 24.6)</text><path d="M40 290 Q360 390 680 290" stroke="#273b45" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><rect x="64" y="270" width="60" height="22" rx="5" fill="#e6f1f8" stroke="#287aab" stroke-width="1.5"/><circle cx="78" cy="294" r="6" fill="#273b45" stroke="#273b45" stroke-width="2"/><circle cx="110" cy="294" r="6" fill="#273b45" stroke="#273b45" stroke-width="2"/><circle cx="122" cy="280" r="4" fill="#b98232" stroke="#b98232" stroke-width="2"/><path d="M122 280 L420 268 L420 300 Z" stroke="#b98232" stroke-width="1" fill="#f5ead8" stroke-linejoin="round" stroke-linecap="round" opacity="0.8"/><text x="250" y="364" font-size="13" fill="#b98232" text-anchor="middle">headlight 0.75 m, beam convention as stated</text><text x="360" y="400" font-size="13" fill="#647780" text-anchor="middle">Legacy exercise only: Vdesign = Vb + 16 = 80 + 16 = 96 km/h; not an NRS method</text></g></svg>