<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Column cover and helical reinforcement</title><desc id="desc">Nominal cover to column bars is at least 40 mm and not less than the bar diameter; a helix that meets the clause 39.4 detailing earns a 1.05 strength factor.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><rect x="80" y="90" width="180" height="180" fill="#e4e8e9" stroke="#273b45" stroke-width="2"/><rect x="102" y="112" width="136" height="136" rx="6" fill="none" stroke="#466d89" stroke-width="2"/><circle cx="110" cy="120" r="6" fill="#466d89" stroke="#273b45" stroke-width="1"/><circle cx="170" cy="120" r="6" fill="#466d89" stroke="#273b45" stroke-width="1"/><circle cx="230" cy="120" r="6" fill="#466d89" stroke="#273b45" stroke-width="1"/><circle cx="110" cy="180" r="6" fill="#466d89" stroke="#273b45" stroke-width="1"/><circle cx="230" cy="180" r="6" fill="#466d89" stroke="#273b45" stroke-width="1"/><circle cx="110" cy="240" r="6" fill="#466d89" stroke="#273b45" stroke-width="1"/><circle cx="170" cy="240" r="6" fill="#466d89" stroke="#273b45" stroke-width="1"/><circle cx="230" cy="240" r="6" fill="#466d89" stroke="#273b45" stroke-width="1"/><line x1="80" y1="70" x2="104" y2="70" stroke="#647780" stroke-width="1.5"/><line x1="80" y1="65" x2="80" y2="75" stroke="#647780" stroke-width="1.5"/><line x1="104" y1="65" x2="104" y2="75" stroke="#647780" stroke-width="1.5"/><text x="92" y="58" font-size="13" fill="#273b45" text-anchor="middle">40 mm</text><text x="170" y="300" font-size="14" fill="#273b45" text-anchor="middle">300 mm square, φ20 bars</text><text x="170" y="324" font-size="14" fill="#2b7b61" text-anchor="middle">cover = max(40 mm, φ) = 40 mm</text><rect x="470" y="70" width="100" height="220" fill="#e4e8e9" stroke="#273b45" stroke-width="2"/><line x1="476" y1="80" x2="564" y2="90" stroke="#466d89" stroke-width="2"/><line x1="476" y1="100" x2="564" y2="110" stroke="#466d89" stroke-width="2"/><line x1="476" y1="120" x2="564" y2="130" stroke="#466d89" stroke-width="2"/><line x1="476" y1="140" x2="564" y2="150" stroke="#466d89" stroke-width="2"/><line x1="476" y1="160" x2="564" y2="170" stroke="#466d89" stroke-width="2"/><line x1="476" y1="180" x2="564" y2="190" stroke="#466d89" stroke-width="2"/><line x1="476" y1="200" x2="564" y2="210" stroke="#466d89" stroke-width="2"/><line x1="476" y1="220" x2="564" y2="230" stroke="#466d89" stroke-width="2"/><line x1="476" y1="240" x2="564" y2="250" stroke="#466d89" stroke-width="2"/><line x1="476" y1="260" x2="564" y2="270" stroke="#466d89" stroke-width="2"/><line x1="476" y1="280" x2="564" y2="290" stroke="#466d89" stroke-width="2"/><line x1="490" y1="72" x2="490" y2="288" stroke="#466d89" stroke-width="3"/><line x1="520" y1="72" x2="520" y2="288" stroke="#466d89" stroke-width="3"/><line x1="550" y1="72" x2="550" y2="288" stroke="#466d89" stroke-width="3"/><line x1="590" y1="90" x2="590" y2="110" stroke="#647780" stroke-width="1.5"/><line x1="595" y1="90" x2="585" y2="90" stroke="#647780" stroke-width="1.5"/><line x1="595" y1="110" x2="585" y2="110" stroke="#647780" stroke-width="1.5"/><text x="600" y="106" font-size="13" fill="#273b45" text-anchor="start">pitch</text><text x="520" y="316" font-size="14" fill="#273b45" text-anchor="middle">compliant helix:</text><text x="520" y="340" font-size="14" fill="#2b7b61" text-anchor="middle">1.05 × 1200 = 1260 kN</text><text x="360" y="390" font-size="14" fill="#647780" text-anchor="middle">The credit needs the specified volumetric ratio, pitch and anchorage</text></g></svg>