<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Pitched-roof terms in plan</title><desc id="desc">Eaves are the lower edges, the ridge is the high intersection of two slopes, hips are external sloping intersections and a valley is an internal one that collects water.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><polygon points="60,80 460,80 460,400 300,400 300,240 60,240" fill="#f0e6d4" stroke="#273b45" stroke-width="3" stroke-linejoin="round"/><line x1="140" y1="160" x2="380" y2="160" stroke="#b64f4f" stroke-width="3.5"/><line x1="380" y1="160" x2="380" y2="320" stroke="#b64f4f" stroke-width="3.5"/><line x1="60" y1="80" x2="140" y2="160" stroke="#287aab" stroke-width="2.5"/><line x1="60" y1="240" x2="140" y2="160" stroke="#287aab" stroke-width="2.5"/><line x1="460" y1="80" x2="380" y2="160" stroke="#287aab" stroke-width="2.5"/><line x1="300" y1="400" x2="380" y2="320" stroke="#287aab" stroke-width="2.5"/><line x1="460" y1="400" x2="380" y2="320" stroke="#287aab" stroke-width="2.5"/><line x1="300" y1="240" x2="380" y2="160" stroke="#2b7b61" stroke-width="3.5" stroke-dasharray="10 6"/><text x="250" y="148" font-size="18" fill="#b64f4f" text-anchor="middle">Ridge</text><text x="112" y="112" font-size="18" fill="#287aab" text-anchor="start">Hip</text><text x="318" y="198" font-size="18" fill="#2b7b61" text-anchor="end">Valley</text><text x="180" y="268" font-size="18" fill="#273b45" text-anchor="middle">Eaves</text><text x="484" y="104" font-size="17" fill="#b64f4f" text-anchor="start">Ridge</text><text x="484" y="126" font-size="14" fill="#647780" text-anchor="start">high meeting of two slopes</text><text x="484" y="168" font-size="17" fill="#287aab" text-anchor="start">Hip</text><text x="484" y="190" font-size="14" fill="#647780" text-anchor="start">external sloping edge</text><text x="484" y="232" font-size="17" fill="#2b7b61" text-anchor="start">Valley</text><text x="484" y="254" font-size="14" fill="#647780" text-anchor="start">internal, collects water</text><text x="484" y="296" font-size="17" fill="#273b45" text-anchor="start">Eaves</text><text x="484" y="318" font-size="14" fill="#647780" text-anchor="start">lower edge with gutter</text></g></svg>