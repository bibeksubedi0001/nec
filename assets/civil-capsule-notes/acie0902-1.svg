<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Off-tracking and extra widening on a curve</title><desc id="desc">The rear axle follows a smaller radius than the front, so mechanical widening n l²/2R is provided and a separate psychological allowance is added: 2 × 6²/(2 × 60) = 0.60 m before the psychological part.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><text x="360" y="40" font-size="16" fill="#273b45" text-anchor="middle">Rear wheels track inside the front wheels</text><path d="M148.03 220.78 A400 400 0 0 1 589.43 232.34" stroke="#287aab" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M163.51 245.54 A370.8 370.8 0 0 1 572.68 256.26" stroke="#b64f4f" stroke-width="2.5" fill="none" stroke-dasharray="7 4" stroke-linejoin="round" stroke-linecap="round"/><rect x="348" y="177" width="176" height="24" rx="4" fill="#d6dfe3" stroke="#273b45" stroke-width="1.5"/><line x1="360" y1="170" x2="360" y2="208" stroke="#273b45" stroke-width="4"/><line x1="510" y1="170" x2="510" y2="208" stroke="#273b45" stroke-width="4"/><line x1="360" y1="134" x2="510" y2="134" stroke="#647780" stroke-width="1.5"/><line x1="360" y1="127" x2="360" y2="141" stroke="#647780" stroke-width="1.5"/><line x1="510" y1="127" x2="510" y2="141" stroke="#647780" stroke-width="1.5"/><text x="435" y="124" font-size="14" fill="#647780" text-anchor="middle">wheelbase l</text><line x1="318" y1="160" x2="318" y2="189" stroke="#647780" stroke-width="1.5"/><line x1="325" y1="160" x2="311" y2="160" stroke="#647780" stroke-width="1.5"/><line x1="325" y1="189" x2="311" y2="189" stroke="#647780" stroke-width="1.5"/><text x="312" y="224" font-size="14" fill="#b64f4f" text-anchor="end">off-tracking ≈ l²/2R</text><text x="596" y="226" font-size="14" fill="#287aab" text-anchor="start">front path, R</text><text x="580" y="268" font-size="14" fill="#b64f4f" text-anchor="start">rear path</text><text x="360" y="306" font-size="16" fill="#287aab" text-anchor="middle">Wm = n l² / 2R = 2 × 6² / (2 × 60) = 0.60 m</text><text x="360" y="334" font-size="15" fill="#273b45" text-anchor="middle">We = Wm + Wps: mechanical plus psychological, added</text><text x="360" y="362" font-size="13" fill="#647780" text-anchor="middle">A tabulated NRS total widening governs where it applies</text></g></svg>