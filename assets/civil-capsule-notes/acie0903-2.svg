<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Ductility test and VG residue minima</title><desc id="desc">A briquette is pulled apart at a specified rate, conventionally 5 cm/min = 50 mm/min, and temperature. DoR SSRBW Table 6.12 minima for RTFO residue at 25 °C are 75, 50, 40 and 25 cm for VG10 to VG40.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><text x="180" y="60" font-size="16" fill="#273b45" text-anchor="middle">Ductility test</text><text x="180" y="96" font-size="14" fill="#287aab" text-anchor="middle">pulled at 5 cm/min = 50 mm/min</text><line x1="250" y1="112" x2="311.2" y2="112" stroke="#287aab" stroke-width="2.5"/><polygon points="320,112 309,116.5 309,107.5" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><rect x="20" y="124" width="320" height="100" fill="#d8edf7" stroke="#287aab" stroke-width="1.5"/><rect x="40" y="144" width="40" height="60" fill="#466d89" stroke="#273b45" stroke-width="1.5"/><rect x="270" y="144" width="40" height="60" fill="#466d89" stroke="#273b45" stroke-width="1.5"/><path d="M80 162 Q175 170 270 162 L270 180 Q175 172 80 180 Z" stroke="none" stroke-width="2" fill="#273b45" stroke-linejoin="round" stroke-linecap="round"/><text x="60" y="218" font-size="13" fill="#287aab" text-anchor="middle">25 °C</text><line x1="80" y1="244" x2="270" y2="244" stroke="#647780" stroke-width="1.5"/><line x1="80" y1="237" x2="80" y2="251" stroke="#647780" stroke-width="1.5"/><line x1="270" y1="237" x2="270" y2="251" stroke="#647780" stroke-width="1.5"/><text x="175" y="270" font-size="14" fill="#647780" text-anchor="middle">extension at break (cm)</text><line x1="370" y1="40" x2="370" y2="320" stroke="#b8c8ce" stroke-width="1.5" stroke-dasharray="6 5"/><text x="555" y="60" font-size="15" fill="#273b45" text-anchor="middle">Min RTFO-residue ductility, 25 °C</text><line x1="420" y1="280" x2="690" y2="280" stroke="#647780" stroke-width="2"/><rect x="430" y="100" width="40" height="180" fill="#e6f1f8" stroke="#287aab" stroke-width="2"/><text x="450" y="92" font-size="13" fill="#273b45" text-anchor="middle">75 cm</text><text x="450" y="298" font-size="13" fill="#273b45" text-anchor="middle">VG10</text><rect x="490" y="160" width="40" height="120" fill="#f5ead8" stroke="#b98232" stroke-width="2"/><text x="510" y="152" font-size="13" fill="#273b45" text-anchor="middle">50 cm</text><text x="510" y="298" font-size="13" fill="#273b45" text-anchor="middle">VG20</text><rect x="550" y="184" width="40" height="96" fill="#e6f1f8" stroke="#287aab" stroke-width="2"/><text x="570" y="176" font-size="13" fill="#273b45" text-anchor="middle">40 cm</text><text x="570" y="298" font-size="13" fill="#273b45" text-anchor="middle">VG30</text><rect x="610" y="220" width="40" height="60" fill="#e6f1f8" stroke="#287aab" stroke-width="2"/><text x="630" y="212" font-size="13" fill="#273b45" text-anchor="middle">25 cm</text><text x="630" y="298" font-size="13" fill="#273b45" text-anchor="middle">VG40</text><text x="360" y="344" font-size="14" fill="#273b45" text-anchor="middle">50 cm is right for VG20 residue, not a universal requirement</text><text x="360" y="368" font-size="13" fill="#647780" text-anchor="middle">Rate, temperature and conditioning must accompany the result</text></g></svg>