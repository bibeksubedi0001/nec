<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">The green-road approach on a mountain slope</title><desc id="desc">A green road minimises slope disturbance with a modest bench, protects vegetation, intercepts and leads runoff to controlled outlets and places spoil deliberately instead of tipping it downslope.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><polygon points="20,100 318,205 330,225 440,225 470,259 700,340 700,360 20,360" fill="#f0e6d4" stroke="none" stroke-width="2" stroke-linejoin="round"/><path d="M20 100 L318 205 L330 225 L440 225 L470 259 L700 340" stroke="#273b45" stroke-width="2" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="330" y1="225" x2="440" y2="225" stroke="#273b45" stroke-width="5"/><line x1="80" y1="121.18" x2="80" y2="101.18" stroke="#b98232" stroke-width="2"/><circle cx="80" cy="93.18" r="9" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><line x1="140" y1="142.36" x2="140" y2="122.36" stroke="#b98232" stroke-width="2"/><circle cx="140" cy="114.36" r="9" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><line x1="200" y1="163.54" x2="200" y2="143.54" stroke="#b98232" stroke-width="2"/><circle cx="200" cy="135.54" r="9" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><line x1="520" y1="276.5" x2="520" y2="256.5" stroke="#b98232" stroke-width="2"/><circle cx="520" cy="248.5" r="9" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><line x1="670" y1="329.45" x2="670" y2="309.45" stroke="#b98232" stroke-width="2"/><circle cx="670" cy="301.45" r="9" fill="#deeee6" stroke="#2b7b61" stroke-width="2"/><text x="80" y="62" font-size="14" fill="#2b7b61" text-anchor="start">vegetation protected</text><path d="M292 197 L300 206 L308 199" stroke="#287aab" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="300" y="180" font-size="13" fill="#287aab" text-anchor="middle">catch drain</text><text x="392" y="246" font-size="13" fill="#273b45" text-anchor="middle">modest bench, staged cut</text><path d="M445 232 L470 262 L500 262 L520 276 L548 282" stroke="#287aab" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><polygon points="552,283 540.33,285.22 542.11,276.4" fill="#287aab" stroke="#287aab" stroke-width="1.5" stroke-linejoin="round"/><text x="505" y="300" font-size="13" fill="#287aab" text-anchor="middle">lined outlet</text><path d="M600 306 Q632 284 668 318 Z" stroke="#b98232" stroke-width="1.5" fill="#f5ead8" stroke-linejoin="round" stroke-linecap="round"/><text x="632" y="272" font-size="13" fill="#b98232" text-anchor="middle">designated spoil site</text><line x1="410" y1="244" x2="447.66" y2="310.35" stroke="#b64f4f" stroke-width="2" stroke-dasharray="5 4"/><polygon points="452,318 442.66,310.65 450.48,306.21" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><line x1="420" y1="272" x2="446" y2="294" stroke="#b64f4f" stroke-width="2.5"/><line x1="446" y1="272" x2="420" y2="294" stroke="#b64f4f" stroke-width="2.5"/><text x="404" y="330" font-size="13" fill="#b64f4f" text-anchor="end">no free tipping</text><text x="360" y="380" font-size="14" fill="#273b45" text-anchor="middle">Ecology-led alignment with labour-based, staged works</text><text x="360" y="402" font-size="13" fill="#647780" text-anchor="middle">Cheap is not green if slope stability is ignored</text></g></svg>