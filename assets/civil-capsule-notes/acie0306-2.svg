<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Double-mass curve with a break in slope</title><desc id="desc">Plotting a station's cumulative rainfall against the cumulative mean of consistent neighbours exposes a changed relationship, perhaps a relocation, as a change of slope.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="100" y1="330" x2="626" y2="330" stroke="#647780" stroke-width="2"/><polygon points="634,330 624,334 624,326" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><line x1="100" y1="330" x2="100" y2="64" stroke="#647780" stroke-width="2"/><polygon points="100,56 104,66 96,66" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><text x="360" y="370" font-size="16" fill="#273b45" text-anchor="middle">Cumulative mean rainfall of consistent neighbours</text><text x="106" y="46" font-size="16" fill="#273b45" text-anchor="start">Cumulative station rainfall</text><line x1="386" y1="187" x2="620" y2="70" stroke="#647780" stroke-width="1.5" stroke-dasharray="8 6"/><path d="M100 330 L143.33 308.33 L186.67 286.67 L230 265 L273.33 243.33 L316.67 221.67 L360 200 L403.33 180.93 L446.67 165.77 L490 150.6 L533.33 135.43 L576.67 120.27 L620 105.1" stroke="#287aab" stroke-width="3" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="143.33" cy="308.33" r="4" fill="#287aab" stroke="#287aab" stroke-width="2"/><circle cx="186.67" cy="286.67" r="4" fill="#287aab" stroke="#287aab" stroke-width="2"/><circle cx="230" cy="265" r="4" fill="#287aab" stroke="#287aab" stroke-width="2"/><circle cx="273.33" cy="243.33" r="4" fill="#287aab" stroke="#287aab" stroke-width="2"/><circle cx="316.67" cy="221.67" r="4" fill="#287aab" stroke="#287aab" stroke-width="2"/><circle cx="360" cy="200" r="4" fill="#287aab" stroke="#287aab" stroke-width="2"/><circle cx="403.33" cy="180.93" r="4" fill="#287aab" stroke="#287aab" stroke-width="2"/><circle cx="446.67" cy="165.77" r="4" fill="#287aab" stroke="#287aab" stroke-width="2"/><circle cx="490" cy="150.6" r="4" fill="#287aab" stroke="#287aab" stroke-width="2"/><circle cx="533.33" cy="135.43" r="4" fill="#287aab" stroke="#287aab" stroke-width="2"/><circle cx="576.67" cy="120.27" r="4" fill="#287aab" stroke="#287aab" stroke-width="2"/><circle cx="620" cy="105.1" r="4" fill="#287aab" stroke="#287aab" stroke-width="2"/><circle cx="386" cy="187" r="12" fill="none" stroke="#b64f4f" stroke-width="2"/><text x="300" y="130" font-size="15" fill="#b64f4f" text-anchor="middle">change of slope: investigate,</text><text x="300" y="152" font-size="15" fill="#b64f4f" text-anchor="middle">e.g. a gauge relocation</text><line x1="330" y1="158" x2="376" y2="179" stroke="#b64f4f" stroke-width="1.2"/><text x="620" y="58" font-size="14" fill="#647780" text-anchor="end">earlier slope</text><text x="620" y="162" font-size="14" fill="#287aab" text-anchor="end">after the change</text><text x="360" y="404" font-size="15" fill="#273b45" text-anchor="middle">Isohyetal mean: (2 × 40 + 3 × 60) / 5 = 52 mm</text></g></svg>