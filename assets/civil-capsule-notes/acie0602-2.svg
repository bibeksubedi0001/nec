<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Pipe fittings and free thermal movement</title><desc id="desc">Fittings are named by what they do: a reducer joins two diameters, a tee adds a branch, elbows turn the run. A free 30 m steel pipe warming by 40 °C extends 14.4 mm.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><text x="360" y="40" font-size="16" fill="#273b45" text-anchor="middle">Fittings are named by what they do</text><line x1="40" y1="120" x2="90" y2="120" stroke="#466d89" stroke-width="20"/><polygon points="90,110 102,115 102,125 90,130" fill="#466d89" stroke="#466d89" stroke-width="2" stroke-linejoin="round"/><line x1="102" y1="120" x2="140" y2="120" stroke="#466d89" stroke-width="11"/><text x="90" y="170" font-size="15" fill="#273b45" text-anchor="middle"><tspan x="90" dy="0">reducer</tspan><tspan x="90" dy="18.3">200 → 150 mm</tspan></text><line x1="190" y1="120" x2="270" y2="120" stroke="#466d89" stroke-width="14"/><line x1="230" y1="120" x2="230" y2="70" stroke="#466d89" stroke-width="14"/><text x="230" y="170" font-size="15" fill="#273b45" text-anchor="middle">tee: branch</text><path d="M330 120 L380 120 L380 70" stroke="#466d89" stroke-width="14" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="360" y="170" font-size="15" fill="#273b45" text-anchor="middle">90° elbow</text><path d="M450 120 L500 120 L535 85" stroke="#466d89" stroke-width="14" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="495" y="170" font-size="15" fill="#273b45" text-anchor="middle">45° elbow</text><line x1="580" y1="120" x2="630" y2="120" stroke="#466d89" stroke-width="14"/><rect x="630" y="108" width="10" height="24" fill="#273b45" stroke="#273b45" stroke-width="2"/><text x="610" y="170" font-size="15" fill="#273b45" text-anchor="middle">end cap</text><text x="360" y="236" font-size="16" fill="#b64f4f" text-anchor="middle">ΔL = α L ΔT = 12 × 10⁻⁶ × 30 × 40 = 14.4 mm</text><line x1="80" y1="255" x2="80" y2="305" stroke="#273b45" stroke-width="3"/><line x1="80" y1="259" x2="69" y2="269" stroke="#647780" stroke-width="1.4"/><line x1="80" y1="271" x2="69" y2="281" stroke="#647780" stroke-width="1.4"/><line x1="80" y1="283" x2="69" y2="293" stroke="#647780" stroke-width="1.4"/><line x1="80" y1="295" x2="69" y2="305" stroke="#647780" stroke-width="1.4"/><rect x="80" y="270" width="480" height="18" fill="#466d89" stroke="#273b45" stroke-width="1.5"/><rect x="560" y="270" width="30" height="18" fill="#f2dfdf" stroke="#b64f4f" stroke-width="1.5" stroke-dasharray="4 3"/><line x1="80" y1="320" x2="560" y2="320" stroke="#647780" stroke-width="1.5"/><line x1="80" y1="313" x2="80" y2="327" stroke="#647780" stroke-width="1.5"/><line x1="560" y1="313" x2="560" y2="327" stroke="#647780" stroke-width="1.5"/><text x="320" y="346" font-size="18" fill="#647780" text-anchor="middle">L = 30 m from the anchor</text><line x1="560" y1="320" x2="590" y2="320" stroke="#647780" stroke-width="1.5"/><line x1="560" y1="313" x2="560" y2="327" stroke="#647780" stroke-width="1.5"/><line x1="590" y1="313" x2="590" y2="327" stroke="#647780" stroke-width="1.5"/><text x="630" y="346" font-size="15" fill="#b64f4f" text-anchor="middle">ΔL = 14.4 mm</text><text x="360" y="395" font-size="14" fill="#647780" text-anchor="middle">A 40 °C fall gives the same 14.4 mm contraction; the joint must take the stroke</text></g></svg>