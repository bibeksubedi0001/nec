<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Weir and barrage: two ways to hold the pond</title><desc id="desc">A weir raises the pond mainly with a fixed raised crest; a barrage holds it with gates over low sills that can open wide to pass floods. Both provide diversion head for a gravity canal.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><text x="185" y="40" font-size="16" fill="#273b45" text-anchor="middle">Weir: raised fixed crest</text><polygon points="20,125 170,125 165,140 130,300 20,300" fill="#d8edf7" stroke="none" stroke-width="2" stroke-linejoin="round"/><line x1="20" y1="125" x2="168" y2="125" stroke="#287aab" stroke-width="2"/><polygon points="130,300 165,140 205,140 310,300" fill="#e4e8e9" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><path d="M168 133 Q212 131 240 188 Q268 248 300 292" stroke="#287aab" stroke-width="5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><rect x="300" y="282" width="50" height="18" fill="#d8edf7" stroke="none" stroke-width="2"/><line x1="20" y1="300" x2="350" y2="300" stroke="#647780" stroke-width="2"/><text x="80" y="112" font-size="14" fill="#287aab" text-anchor="middle">raised pond</text><text x="185" y="90" font-size="14" fill="#273b45" text-anchor="middle">fixed raised crest</text><line x1="185" y1="96" x2="185" y2="138" stroke="#647780" stroke-width="1.2"/><line x1="360" y1="30" x2="360" y2="330" stroke="#b8c8ce" stroke-width="1.5" stroke-dasharray="6 5"/><text x="535" y="40" font-size="16" fill="#273b45" text-anchor="middle">Barrage: gates over a low sill</text><polygon points="370,125 509,125 509,300 370,300" fill="#d8edf7" stroke="none" stroke-width="2" stroke-linejoin="round"/><line x1="370" y1="125" x2="509" y2="125" stroke="#287aab" stroke-width="2"/><rect x="585" y="262" width="115" height="38" fill="#d8edf7" stroke="none" stroke-width="2"/><polygon points="480,300 500,282 580,282 600,300" fill="#e4e8e9" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><rect x="495" y="110" width="14" height="172" fill="#d6dfe3" stroke="#273b45" stroke-width="1.5"/><rect x="571" y="110" width="14" height="172" fill="#d6dfe3" stroke="#273b45" stroke-width="1.5"/><rect x="509" y="122" width="62" height="146" fill="#466d89" stroke="#273b45" stroke-width="1.5"/><rect x="509" y="50" width="62" height="56" fill="none" stroke="#466d89" stroke-width="1.5" stroke-dasharray="5 4"/><text x="592" y="84" font-size="14" fill="#466d89" text-anchor="start">raised in floods</text><line x1="370" y1="300" x2="700" y2="300" stroke="#647780" stroke-width="2"/><text x="430" y="112" font-size="14" fill="#287aab" text-anchor="middle">pond</text><text x="540" y="322" font-size="14" fill="#273b45" text-anchor="middle">low sill</text><text x="360" y="356" font-size="14" fill="#273b45" text-anchor="middle">Both raise the upstream level to give diversion head for a gravity canal</text><text x="360" y="380" font-size="13" fill="#647780" text-anchor="middle">They do not create water or act mainly as storage</text><text x="360" y="402" font-size="13" fill="#647780" text-anchor="middle">Some weirs carry shutters: predominantly gated control marks a barrage</text></g></svg>