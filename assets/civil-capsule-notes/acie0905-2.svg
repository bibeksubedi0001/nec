<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Design-lane traffic on four-lane roads</title><desc id="desc">DoR factors carry their own bases: an undivided four-lane road puts 0.40 × 1000 two-way = 400 CV/day in the design lane; a divided road puts 0.75 × 500 per direction = 375 CV/day.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><text x="260" y="56" font-size="15" fill="#273b45" text-anchor="middle">Four lanes, undivided</text><rect x="60" y="70" width="400" height="80" fill="#d6dfe3" stroke="#273b45" stroke-width="1.5"/><rect x="60" y="130" width="400" height="20" fill="#f5ead8" stroke="none" stroke-width="2"/><line x1="60" y1="90" x2="460" y2="90" stroke="#ffffff" stroke-width="2" stroke-dasharray="10 8"/><line x1="60" y1="130" x2="460" y2="130" stroke="#ffffff" stroke-width="2" stroke-dasharray="10 8"/><line x1="60" y1="109" x2="460" y2="109" stroke="#b98232" stroke-width="2"/><line x1="60" y1="111" x2="460" y2="111" stroke="#b98232" stroke-width="2"/><line x1="60" y1="70" x2="460" y2="70" stroke="#273b45" stroke-width="2"/><line x1="60" y1="150" x2="460" y2="150" stroke="#273b45" stroke-width="2"/><text x="590" y="100" font-size="15" fill="#273b45" text-anchor="middle">0.40 × 1000 two-way</text><text x="590" y="126" font-size="15" fill="#b98232" text-anchor="middle">= 400 CV/day</text><text x="260" y="196" font-size="15" fill="#273b45" text-anchor="middle">Four lanes, divided</text><rect x="60" y="210" width="400" height="90" fill="#d6dfe3" stroke="#273b45" stroke-width="1.5"/><rect x="60" y="250" width="400" height="10" fill="#deeee6" stroke="#2b7b61" stroke-width="1"/><rect x="60" y="280" width="400" height="20" fill="#f5ead8" stroke="none" stroke-width="2"/><line x1="60" y1="230" x2="460" y2="230" stroke="#ffffff" stroke-width="2" stroke-dasharray="10 8"/><line x1="60" y1="280" x2="460" y2="280" stroke="#ffffff" stroke-width="2" stroke-dasharray="10 8"/><line x1="60" y1="300" x2="460" y2="300" stroke="#273b45" stroke-width="2"/><text x="590" y="246" font-size="15" fill="#273b45" text-anchor="middle">0.75 × 500 per direction</text><text x="590" y="272" font-size="15" fill="#b98232" text-anchor="middle">= 375 CV/day</text><text x="260" y="322" font-size="13" fill="#b98232" text-anchor="middle">design lane shaded</text><text x="360" y="356" font-size="14" fill="#273b45" text-anchor="middle">Check divided or undivided, and two-way or directional counts, first</text><text x="360" y="380" font-size="13" fill="#647780" text-anchor="middle">Do not halve the undivided result again; 0.40 is not a universal four-lane rule</text></g></svg>