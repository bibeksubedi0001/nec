<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Thrust influence line of a three-hinged arch</title><desc id="desc">Thrust equals the crown simple-beam moment divided by the rise, so its influence line is a triangle peaking at L/(4h) under the crown hinge.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><path d="M120 170 L128 163.44 L136 157.11 L144 151 L152 145.11 L160 139.44 L168 134 L176 128.78 L184 123.78 L192 119 L200 114.44 L208 110.11 L216 106 L224 102.11 L232 98.44 L240 95 L248 91.78 L256 88.78 L264 86 L272 83.44 L280 81.11 L288 79 L296 77.11 L304 75.44 L312 74 L320 72.78 L328 71.78 L336 71 L344 70.44 L352 70.11 L360 70 L368 70.11 L376 70.44 L384 71 L392 71.78 L400 72.78 L408 74 L416 75.44 L424 77.11 L432 79 L440 81.11 L448 83.44 L456 86 L464 88.78 L472 91.78 L480 95 L488 98.44 L496 102.11 L504 106 L512 110.11 L520 114.44 L528 119 L536 123.78 L544 128.78 L552 134 L560 139.44 L568 145.11 L576 151 L584 157.11 L592 163.44 L600 170" stroke="#273b45" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><circle cx="120" cy="170" r="7" fill="#ffffff" stroke="#273b45" stroke-width="2"/><circle cx="600" cy="170" r="7" fill="#ffffff" stroke="#273b45" stroke-width="2"/><circle cx="360" cy="70" r="7" fill="#ffffff" stroke="#273b45" stroke-width="2"/><polygon points="120,177 105,201 135,201" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><line x1="98" y1="204" x2="142" y2="204" stroke="#647780" stroke-width="2"/><polygon points="600,177 585,201 615,201" fill="#ffffff" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><line x1="578" y1="204" x2="622" y2="204" stroke="#647780" stroke-width="2"/><circle cx="221.3" cy="103.4" r="5" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><circle cx="498.7" cy="103.4" r="5" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><text x="360" y="150" font-size="14" fill="#b64f4f" text-anchor="middle">envelope peaks L/(2√3) either side of the crown</text><polygon points="120,310 360,230 600,310" fill="#e6f1f8" stroke="#287aab" stroke-width="2.5" stroke-linejoin="round"/><line x1="100" y1="310" x2="620" y2="310" stroke="#647780" stroke-width="1.5"/><text x="360" y="222" font-size="15" fill="#287aab" text-anchor="middle">L / (4h) = 24 / (4 × 6) = 1.00</text><text x="40" y="300" font-size="14" fill="#647780" text-anchor="start">ILD for H</text><text x="360" y="356" font-size="15" fill="#273b45" text-anchor="middle">Span 24 m, rise 6 m: the ordinate is a ratio of thrust to load</text><text x="360" y="384" font-size="14" fill="#647780" text-anchor="middle">H = crown simple-beam moment / rise, for every load position</text></g></svg>