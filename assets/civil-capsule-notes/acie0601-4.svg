<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Membrane filtration and multiple-tube fermentation</title><desc id="desc">Membrane filtration counts colonies directly as CFU but turbid water can clog the membrane; multiple-tube fermentation infers a most probable number from the pattern of gas-positive tubes.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><text x="160" y="40" font-size="17" fill="#273b45" text-anchor="middle">Membrane filtration</text><polygon points="70,70 210,70 165,140 115,140" fill="#d8edf7" stroke="#273b45" stroke-width="2" stroke-linejoin="round"/><line x1="108" y1="146" x2="172" y2="146" stroke="#b98232" stroke-width="5"/><text x="220" y="100" font-size="14" fill="#273b45" text-anchor="start">sample filtered</text><text x="180" y="151" font-size="14" fill="#b98232" text-anchor="start">membrane</text><line x1="140" y1="166" x2="140" y2="197.2" stroke="#647780" stroke-width="2.5"/><polygon points="140,206 135.5,195 144.5,195" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><ellipse cx="140" cy="250" rx="95" ry="38" fill="#ffffff" stroke="#273b45" stroke-width="2"/><ellipse cx="140" cy="250" rx="80" ry="30" fill="#f5ead8" stroke="#b98232" stroke-width="1.5"/><circle cx="100" cy="244" r="4" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><circle cx="120" cy="262" r="4" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><circle cx="150" cy="238" r="4" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><circle cx="168" cy="258" r="4" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><circle cx="186" cy="246" r="4" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><circle cx="132" cy="248" r="4" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><circle cx="106" cy="262" r="4" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><circle cx="160" cy="270" r="4" fill="#b64f4f" stroke="#b64f4f" stroke-width="2"/><text x="140" y="312" font-size="15" fill="#273b45" text-anchor="middle">incubate, count colonies</text><text x="140" y="336" font-size="15" fill="#287aab" text-anchor="middle">result: CFU (direct count)</text><text x="140" y="360" font-size="14" fill="#647780" text-anchor="middle">turbid water may clog it</text><line x1="340" y1="20" x2="340" y2="380" stroke="#b8c8ce" stroke-width="1.5" stroke-dasharray="6 5"/><text x="525" y="40" font-size="17" fill="#273b45" text-anchor="middle">Multiple-tube fermentation</text><text x="410" y="115" font-size="15" fill="#273b45" text-anchor="end">10 mL</text><rect x="431" y="80" width="18" height="60" rx="8" fill="#f5ead8" stroke="#273b45" stroke-width="1.5"/><circle cx="440" cy="92" r="4" fill="#ffffff" stroke="#b98232" stroke-width="1.5"/><rect x="476" y="80" width="18" height="60" rx="8" fill="#f5ead8" stroke="#273b45" stroke-width="1.5"/><circle cx="485" cy="92" r="4" fill="#ffffff" stroke="#b98232" stroke-width="1.5"/><rect x="521" y="80" width="18" height="60" rx="8" fill="#f5ead8" stroke="#273b45" stroke-width="1.5"/><circle cx="530" cy="92" r="4" fill="#ffffff" stroke="#b98232" stroke-width="1.5"/><rect x="566" y="80" width="18" height="60" rx="8" fill="#f5ead8" stroke="#273b45" stroke-width="1.5"/><circle cx="575" cy="92" r="4" fill="#ffffff" stroke="#b98232" stroke-width="1.5"/><rect x="611" y="80" width="18" height="60" rx="8" fill="#f5ead8" stroke="#273b45" stroke-width="1.5"/><circle cx="620" cy="92" r="4" fill="#ffffff" stroke="#b98232" stroke-width="1.5"/><text x="690" y="115" font-size="14" fill="#273b45" text-anchor="end">5 of 5</text><text x="410" y="190" font-size="15" fill="#273b45" text-anchor="end">1 mL</text><rect x="431" y="155" width="18" height="60" rx="8" fill="#f5ead8" stroke="#273b45" stroke-width="1.5"/><circle cx="440" cy="167" r="4" fill="#ffffff" stroke="#b98232" stroke-width="1.5"/><rect x="476" y="155" width="18" height="60" rx="8" fill="#f5ead8" stroke="#273b45" stroke-width="1.5"/><circle cx="485" cy="167" r="4" fill="#ffffff" stroke="#b98232" stroke-width="1.5"/><rect x="521" y="155" width="18" height="60" rx="8" fill="#f5ead8" stroke="#273b45" stroke-width="1.5"/><circle cx="530" cy="167" r="4" fill="#ffffff" stroke="#b98232" stroke-width="1.5"/><rect x="566" y="155" width="18" height="60" rx="8" fill="#d8edf7" stroke="#273b45" stroke-width="1.5"/><rect x="611" y="155" width="18" height="60" rx="8" fill="#d8edf7" stroke="#273b45" stroke-width="1.5"/><text x="690" y="190" font-size="14" fill="#273b45" text-anchor="end">3 of 5</text><text x="410" y="265" font-size="15" fill="#273b45" text-anchor="end">0.1 mL</text><rect x="431" y="230" width="18" height="60" rx="8" fill="#f5ead8" stroke="#273b45" stroke-width="1.5"/><circle cx="440" cy="242" r="4" fill="#ffffff" stroke="#b98232" stroke-width="1.5"/><rect x="476" y="230" width="18" height="60" rx="8" fill="#d8edf7" stroke="#273b45" stroke-width="1.5"/><rect x="521" y="230" width="18" height="60" rx="8" fill="#d8edf7" stroke="#273b45" stroke-width="1.5"/><rect x="566" y="230" width="18" height="60" rx="8" fill="#d8edf7" stroke="#273b45" stroke-width="1.5"/><rect x="611" y="230" width="18" height="60" rx="8" fill="#d8edf7" stroke="#273b45" stroke-width="1.5"/><text x="690" y="265" font-size="14" fill="#273b45" text-anchor="end">1 of 5</text><text x="525" y="322" font-size="15" fill="#273b45" text-anchor="middle">pattern 5-3-1 → most probable number table</text><text x="525" y="346" font-size="14" fill="#647780" text-anchor="middle">an estimate from the positive-tube pattern</text><text x="360" y="398" font-size="15" fill="#273b45" text-anchor="middle">Neither method is universally better</text></g></svg>