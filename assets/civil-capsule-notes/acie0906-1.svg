<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Mass-haul slope and turning points</title><desc id="desc">With cut positive the ordinate rises through cuttings and falls through fills; its slope is the average signed net area, (1000 - 600)/50 = +8 m². A cut-to-fill point is a local maximum, not necessarily the highest.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><line x1="90" y1="290" x2="646" y2="290" stroke="#647780" stroke-width="2"/><polygon points="654,290 644,294 644,286" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><line x1="90" y1="290" x2="90" y2="64" stroke="#647780" stroke-width="2"/><polygon points="90,56 94,66 86,66" fill="#647780" stroke="#647780" stroke-width="1.5" stroke-linejoin="round"/><text x="365" y="328" font-size="15" fill="#273b45" text-anchor="middle">chainage (m)</text><text x="96" y="46" font-size="15" fill="#273b45" text-anchor="start">cumulative volume (m³)</text><text x="90" y="310" font-size="13" fill="#273b45" text-anchor="middle">0</text><text x="181.67" y="310" font-size="13" fill="#273b45" text-anchor="middle">100</text><text x="273.33" y="310" font-size="13" fill="#273b45" text-anchor="middle">200</text><text x="365" y="310" font-size="13" fill="#273b45" text-anchor="middle">300</text><text x="456.67" y="310" font-size="13" fill="#273b45" text-anchor="middle">400</text><text x="548.33" y="310" font-size="13" fill="#273b45" text-anchor="middle">500</text><text x="640" y="310" font-size="13" fill="#273b45" text-anchor="middle">600</text><text x="82" y="280.33" font-size="13" fill="#273b45" text-anchor="end">0</text><text x="82" y="207" font-size="13" fill="#273b45" text-anchor="end">500</text><text x="82" y="133.67" font-size="13" fill="#273b45" text-anchor="end">1000</text><line x1="90" y1="275.33" x2="640" y2="275.33" stroke="#647780" stroke-width="1" stroke-dasharray="4 4"/><path d="M90 275.33 L181.67 238.67 L273.33 187.33 L319.17 128.67 L365 114 L456.67 158 L548.33 216.67 L640 92" stroke="#287aab" stroke-width="3.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M273.33 187.33 L319.17 187.33 L319.17 128.67" stroke="#b64f4f" stroke-width="1.5" fill="none" stroke-dasharray="5 4" stroke-linejoin="round" stroke-linecap="round"/><text x="267.33" y="150.67" font-size="14" fill="#b64f4f" text-anchor="end">ΔV/Δx = 400/50 = +8 m²</text><circle cx="365" cy="114" r="5" fill="#b98232" stroke="#b98232" stroke-width="2"/><text x="365" y="102" font-size="13" fill="#b98232" text-anchor="middle">cut → fill: local max</text><circle cx="548.33" cy="216.67" r="5" fill="#2b7b61" stroke="#2b7b61" stroke-width="2"/><text x="548.33" y="238.67" font-size="13" fill="#2b7b61" text-anchor="middle">fill → cut: local min</text><text x="360" y="350" font-size="14" fill="#273b45" text-anchor="middle">Slope = average signed net earthwork area, cut positive</text><text x="360" y="374" font-size="13" fill="#647780" text-anchor="middle">The cut-to-fill point need not be the project maximum (1250 at the end here)</text></g></svg>