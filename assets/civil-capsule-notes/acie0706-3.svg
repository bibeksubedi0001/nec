<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Open surface drain section</title><desc id="desc">Unlined open drains commonly use a trapezoidal section: a finite bed width with stable sloping earth banks, avoiding unsupported vertical soil faces. A surface drain works whenever surface excess arrives.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><polygon points="20,130 40,130 110,250 230,250 300,130 340,130 340,310 20,310" fill="#f0e6d4" stroke="none" stroke-width="2" stroke-linejoin="round"/><polygon points="81,200 259,200 230,250 110,250" fill="#d8edf7" stroke="none" stroke-width="2" stroke-linejoin="round"/><path d="M20 130 L40 130 L110 250 L230 250 L300 130 L340 130" stroke="#273b45" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="170" y="110" font-size="14" fill="#2b7b61" text-anchor="middle">stable sloping banks</text><line x1="110" y1="270" x2="230" y2="270" stroke="#647780" stroke-width="1.5"/><line x1="110" y1="263" x2="110" y2="277" stroke="#647780" stroke-width="1.5"/><line x1="230" y1="263" x2="230" y2="277" stroke="#647780" stroke-width="1.5"/><text x="170" y="296" font-size="14" fill="#647780" text-anchor="middle">bed width</text><line x1="360" y1="40" x2="360" y2="320" stroke="#b8c8ce" stroke-width="1.5" stroke-dasharray="6 5"/><polygon points="380,130 450,130 450,250 570,250 570,130 690,130 690,310 380,310" fill="#f0e6d4" stroke="none" stroke-width="2" stroke-linejoin="round"/><rect x="450" y="210" width="120" height="40" fill="#d8edf7" stroke="none" stroke-width="2"/><path d="M380 130 L450 130 L450 250 L570 250 L570 130 L690 130" stroke="#273b45" stroke-width="2.5" fill="none" stroke-linejoin="round" stroke-linecap="round"/><path d="M418 130 Q424 206 452 248" stroke="#b64f4f" stroke-width="2" fill="none" stroke-dasharray="6 4" stroke-linejoin="round" stroke-linecap="round"/><path d="M602 130 Q596 206 568 248" stroke="#b64f4f" stroke-width="2" fill="none" stroke-dasharray="6 4" stroke-linejoin="round" stroke-linecap="round"/><text x="535" y="110" font-size="14" fill="#b64f4f" text-anchor="middle">unsupported vertical faces slump</text><text x="360" y="348" font-size="14" fill="#273b45" text-anchor="middle">Trapezoid: practical, not universally optimal</text><text x="360" y="372" font-size="14" fill="#287aab" text-anchor="middle">A surface drain works whenever surface excess arrives, even in a dry month</text><text x="360" y="396" font-size="13" fill="#647780" text-anchor="middle">Hydraulics, land, maintenance and stability set the final shape</text></g></svg>