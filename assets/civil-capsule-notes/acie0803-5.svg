<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Fixed-wheel, radial and drum gates</title><desc id="desc">A fixed-wheel gate has wheels fixed on the moving leaf running on fixed tracks; a radial gate's curved plate pivots on trunnions so pressure acts near the pivot; a drum gate is raised by buoyancy through chamber passages.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><text x="120" y="50" font-size="15" fill="#273b45" text-anchor="middle">Fixed-wheel (vertical lift)</text><rect x="20" y="120" width="50" height="150" fill="#d8edf7" stroke="none" stroke-width="2"/><rect x="70" y="100" width="80" height="170" fill="#466d89" stroke="#273b45" stroke-width="1.5"/><circle cx="154" cy="130" r="9" fill="#ffffff" stroke="#273b45" stroke-width="2"/><circle cx="154" cy="185" r="9" fill="#ffffff" stroke="#273b45" stroke-width="2"/><circle cx="154" cy="240" r="9" fill="#ffffff" stroke="#273b45" stroke-width="2"/><line x1="166" y1="80" x2="166" y2="280" stroke="#273b45" stroke-width="4"/><line x1="20" y1="272" x2="200" y2="272" stroke="#273b45" stroke-width="2"/><text x="120" y="304" font-size="14" fill="#273b45" text-anchor="middle"><tspan x="120" dy="0">wheels fixed to the leaf,</tspan><tspan x="120" dy="17.08">running on fixed tracks</tspan></text><text x="360" y="50" font-size="15" fill="#273b45" text-anchor="middle">Radial (Tainter)</text><rect x="250" y="110" width="84" height="92" fill="#d8edf7" stroke="none" stroke-width="2"/><path d="M333.4 200 A100 100 0 0 1 333.4 100" stroke="#466d89" stroke-width="7" fill="none" stroke-linejoin="round" stroke-linecap="round"/><line x1="420" y1="150" x2="333.4" y2="200" stroke="#273b45" stroke-width="3"/><line x1="420" y1="150" x2="333.4" y2="100" stroke="#273b45" stroke-width="3"/><circle cx="420" cy="150" r="7" fill="#ffffff" stroke="#273b45" stroke-width="2"/><text x="430" y="146" font-size="13" fill="#273b45" text-anchor="start">trunnion</text><line x1="294.43" y1="183.65" x2="311.43" y2="179.09" stroke="#b64f4f" stroke-width="2"/><polygon points="317.61,177.43 310.79,182.89 308.98,176.12" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><line x1="290" y1="150" x2="307.6" y2="150" stroke="#b64f4f" stroke-width="2"/><polygon points="314,150 306,153.5 306,146.5" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><line x1="294.43" y1="116.35" x2="311.43" y2="120.91" stroke="#b64f4f" stroke-width="2"/><polygon points="317.61,122.57 308.98,123.88 310.79,117.11" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><line x1="250" y1="203" x2="360" y2="203" stroke="#273b45" stroke-width="2"/><text x="360" y="304" font-size="14" fill="#273b45" text-anchor="middle"><tspan x="360" dy="0">curved plate on radial arms;</tspan><tspan x="360" dy="17.08">pressure acts near the pivot</tspan></text><text x="600" y="50" font-size="15" fill="#273b45" text-anchor="middle">Drum gate</text><rect x="490" y="150" width="50" height="50" fill="#d8edf7" stroke="none" stroke-width="2"/><rect x="530" y="200" width="140" height="80" fill="#d8edf7" stroke="#273b45" stroke-width="1.5"/><path d="M540 200 A60 60 0 0 1 660 200 Z" stroke="#273b45" stroke-width="1.5" fill="#466d89" stroke-linejoin="round" stroke-linecap="round"/><line x1="490" y1="200" x2="700" y2="200" stroke="#273b45" stroke-width="2"/><line x1="505" y1="202" x2="505" y2="250" stroke="#287aab" stroke-width="3"/><line x1="505" y1="250" x2="530" y2="250" stroke="#287aab" stroke-width="3"/><rect x="509" y="244" width="10" height="12" fill="#b98232" stroke="#273b45" stroke-width="1"/><text x="600" y="304" font-size="14" fill="#273b45" text-anchor="middle"><tspan x="600" dy="0">buoyant; chamber passages</tspan><tspan x="600" dy="17.08">raise or lower it: protect them</tspan></text><text x="360" y="368" font-size="14" fill="#273b45" text-anchor="middle">Flood capacity needs gates that open when required:</text><text x="360" y="392" font-size="13" fill="#647780" text-anchor="middle">tested operation with independent or emergency power</text></g></svg>