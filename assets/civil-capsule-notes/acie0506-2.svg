<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-labelledby="title desc"><title id="title">Stress across a wall under eccentric load</title><desc id="desc">With e within t/6 both faces stay in compression: an average of 0.60 MPa at e = t/24 gives 0.75 and 0.45 MPa at the two faces.</desc><rect width="720" height="420" fill="#fbfcfd"/><g font-family="'Times New Roman', Times, serif" letter-spacing="0"><rect x="280" y="90" width="160" height="180" fill="#e4e8e9" stroke="#273b45" stroke-width="2"/><line x1="280" y1="120" x2="440" y2="120" stroke="#647780" stroke-width="1"/><line x1="280" y1="150" x2="440" y2="150" stroke="#647780" stroke-width="1"/><line x1="280" y1="180" x2="440" y2="180" stroke="#647780" stroke-width="1"/><line x1="280" y1="210" x2="440" y2="210" stroke="#647780" stroke-width="1"/><line x1="280" y1="240" x2="440" y2="240" stroke="#647780" stroke-width="1"/><rect x="333.3" y="90" width="53.4" height="180" fill="#e6f1f8" stroke="none" stroke-width="2" opacity="0.8"/><line x1="360" y1="80" x2="360" y2="280" stroke="#647780" stroke-width="1.2" stroke-dasharray="6 4"/><line x1="366.7" y1="38" x2="366.7" y2="79.2" stroke="#b64f4f" stroke-width="3.5"/><polygon points="366.7,88 362.2,77 371.2,77" fill="#b64f4f" stroke="#b64f4f" stroke-width="1.5" stroke-linejoin="round"/><text x="366.7" y="28" font-size="14" fill="#b64f4f" text-anchor="middle">P at e = t/24</text><polygon points="280,290 440,290 440,350 280,326" fill="#f2dfdf" stroke="#b64f4f" stroke-width="2" stroke-linejoin="round"/><text x="272" y="330" font-size="14" fill="#b64f4f" text-anchor="end">0.45 MPa</text><text x="448" y="346" font-size="14" fill="#b64f4f" text-anchor="start">0.75 MPa</text><line x1="280" y1="390" x2="440" y2="390" stroke="#647780" stroke-width="1.5"/><line x1="280" y1="383" x2="280" y2="397" stroke="#647780" stroke-width="1.5"/><line x1="440" y1="383" x2="440" y2="397" stroke="#647780" stroke-width="1.5"/><text x="360" y="386" font-size="14" fill="#647780" text-anchor="middle">t</text><text x="360" y="190" font-size="13" fill="#287aab" text-anchor="middle">middle third</text><text x="150" y="150" font-size="16" fill="#273b45" text-anchor="middle">σ = P/A (1 ± 6e/t)</text><text x="150" y="178" font-size="14" fill="#647780" text-anchor="middle">6e/t = 1/4:</text><text x="150" y="200" font-size="14" fill="#647780" text-anchor="middle">0.60 × 1.25, 0.60 × 0.75</text><text x="580" y="150" font-size="15" fill="#273b45" text-anchor="middle">e ≤ t/6: no tension</text><text x="580" y="190" font-size="14" fill="#273b45" text-anchor="middle">e/t from 1/24 to 1/6:</text><text x="580" y="212" font-size="14" fill="#273b45" text-anchor="middle">edge allowance × 1.25</text><text x="580" y="236" font-size="14" fill="#2b7b61" text-anchor="middle">0.80 → 1.00 MPa</text></g></svg>